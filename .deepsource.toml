version = 1

# Keep DeepSource focused on executable source and tests. The repository contains
# a large amount of research evidence, manifests, frozen data and generated
# artifacts that should not consume static-analysis time.
exclude_patterns = [
  ".github/**",
  "**/__pycache__/**",
  "**/*.csv",
  "**/*.csv.gz",
  "**/*.parquet",
  "**/*.zip",
  "football-data/benchmarks/**",
  "football-data/cache/**",
  "football-data/evidence/**",
  "football-data/forward/**",
  "football-data/manifests/**",
  "football-data/docs/**"
]

test_patterns = [
  "football-data/tests/**",
  "**/tests/**",
  "**/test_*.py",
  "**/*_test.py"
]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.12"
  cyclomatic_complexity_threshold = "high"
  skip_doc_coverage = ["module", "magic", "init", "test"]
