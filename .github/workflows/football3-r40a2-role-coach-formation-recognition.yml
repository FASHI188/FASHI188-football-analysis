name: football3 R40A2 role coach formation recognition

on:
  push:
    branches:
      - football3/r40a2-role-coach-formation-recognition
    paths:
      - football-data/experiments/r40a2_role_coach_formation_recognition/run_r40a2.py
      - .github/workflows/football3-r40a2-role-coach-formation-recognition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r40a2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r40a2-role-coach-formation-recognition
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recognition runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R40A2 recognition audit
        run: python football-data/experiments/r40a2_role_coach_formation_recognition/run_r40a2.py run
      - name: Verify R40A2 contract
        run: python football-data/experiments/r40a2_role_coach_formation_recognition/run_r40a2.py verify
      - name: Persist R40A2 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r40a2_role_coach_formation_recognition/results/summary_r40a2.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R40A2 recognition audit'
            git fetch origin football3/r40a2-role-coach-formation-recognition
            git rebase origin/football3/r40a2-role-coach-formation-recognition
            git push origin HEAD:football3/r40a2-role-coach-formation-recognition
          fi
      - name: Upload R40A2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r40a2-role-coach-formation-recognition
          path: football-data/experiments/r40a2_role_coach_formation_recognition/results/summary_r40a2.json
          if-no-files-found: error
          retention-days: 90
