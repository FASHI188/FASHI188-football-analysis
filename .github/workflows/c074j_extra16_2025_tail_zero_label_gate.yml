name: C074-J extra16 calendar-2025 tail zero-label gate
on:
  pull_request:
    paths:
      - 'research/C074J_CONTRACT.md'
      - 'research/c074j_extra16_2025_tail_zero_label_gate.py'
      - '.github/workflows/c074j_extra16_2025_tail_zero_label_gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-label-extra16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas==2.2.3
      - run: |
          python research/c074j_extra16_2025_tail_zero_label_gate.py --out artifacts/c074j_extra16_zero_label
          cp research/C074J_CONTRACT.md artifacts/c074j_extra16_zero_label/C074J_CONTRACT.md
      - uses: actions/upload-artifact@v4
        with:
          name: c074j-extra16-2025-tail-zero-label
          path: artifacts/c074j_extra16_zero_label/
          if-no-files-found: error
          retention-days: 30
