name: Football C069 R2 Maxcard Coverage

on:
  pull_request:
    paths:
      - 'football-data/research/c069_r2_maxcard_coverage/**'
      - 'football-data/validation/evaluate_c069_r2_maxcard_coverage.py'
      - '.github/workflows/football-c069-r2-maxcard-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 scipy==1.18.0 scikit-learn==1.8.0
      - name: Compile frozen R2 implementation
        run: |
          python -m py_compile \
            football-data/validation/build_c068_a01_runtime.py \
            football-data/validation/build_c068_a02_runtime.py \
            football-data/validation/evaluate_c069_matched_pair_draw_state_r1.py \
            football-data/validation/run_c069_matched_pair_draw_state_r1.py \
            football-data/validation/evaluate_c069_r2_maxcard_coverage.py
          python -m json.tool football-data/research/c069_r2_maxcard_coverage/contract.json >/dev/null
      - name: Download exact public Wyscout source archives
        run: |
          mkdir -p /tmp/c069r2
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/c069r2/matches.zip https://ndownloader.figshare.com/files/14464622
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/c069r2/events.zip https://ndownloader.figshare.com/files/14464685
      - name: Rebuild already-viewed A01 and A02 packages
        run: |
          python football-data/validation/build_c068_a01_runtime.py \
            --matches-zip /tmp/c069r2/matches.zip --events-zip /tmp/c069r2/events.zip --out /tmp/c069r2/A01.zip
          python football-data/validation/build_c068_a02_runtime.py \
            --matches-zip /tmp/c069r2/matches.zip --events-zip /tmp/c069r2/events.zip --out /tmp/c069r2/A02.zip
      - name: Run frozen C069 R2 coverage-only audit
        run: |
          mkdir -p football-data/manifests/c069_r2_maxcard_coverage
          cp football-data/research/c069_r2_maxcard_coverage/contract.json \
            football-data/manifests/c069_r2_maxcard_coverage/contract.json
          python football-data/validation/evaluate_c069_r2_maxcard_coverage.py \
            --a01 /tmp/c069r2/A01.zip \
            --a02 /tmp/c069r2/A02.zip \
            --out football-data/manifests/c069_r2_maxcard_coverage/summary.json
      - name: Verify coverage-only boundaries and frozen R1 reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/c069_r2_maxcard_coverage/summary.json').read_text())
          assert x['schema_version']=='C069_MATCHED_PAIR_DRAW_STATE_R2_COVERAGE'
          assert x['status'] in {'COVERAGE_RECOVERED','STOP_COVERAGE'}
          assert x['source']['source_matches']==800
          assert x['source']['regular_matches']==795
          assert x['source']['eligible_rows']==327
          assert x['source']['eligible_draws']==127
          assert x['source']['eligible_onegoal_wins']==200
          assert x['r1_greedy_reproduction']=={
            'fold_1': {'train': 27, 'test': 18},
            'fold_2': {'train': 51, 'test': 14},
            'fold_3': {'train': 81, 'test': 12},
          }
          assert x['boundary']['coverage_only'] is True
          assert x['boundary']['model_fitting_performed'] is False
          assert x['boundary']['model_scoring_performed'] is False
          assert x['boundary']['protected_samples_used'] is False
          assert x['boundary']['new_A_packages_opened'] is False
          assert x['boundary']['formal_weight']==0
          for fold in x['folds'].values():
              assert fold['r2_maxcard']['train_pairs']==fold['r2_maxcard']['train_maximum_cardinality_certificate']
              assert fold['r2_maxcard']['test_pairs']==fold['r2_maxcard']['test_maximum_cardinality_certificate']
          print(json.dumps(x,indent=2))
          PY
      - name: Upload C069 R2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: c069-r2-maxcard-coverage
          path: football-data/manifests/c069_r2_maxcard_coverage/
          if-no-files-found: error
          retention-days: 30
      - name: Confirm runtime-only output
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
