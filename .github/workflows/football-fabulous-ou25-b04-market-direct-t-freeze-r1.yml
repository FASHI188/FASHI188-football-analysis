name: Football fabul0us OU25 B04 market Direct-T freeze R1

on:
  push:
    branches: [research/fabulous-ou25-b01-input-audit-r1]
    paths:
      - '.github/workflows/football-fabulous-ou25-b04-market-direct-t-freeze-r1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football-fabulous-ou25-b04-market-direct-t-freeze-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-label-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0

      - name: Restore original sealed B04 manifest and verify zero-label reserve artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fab /tmp/reserve
          curl -sS -L --fail --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FASHI188/FASHI188-football-analysis/actions/artifacts/9275467160/zip' \
            -o /tmp/reserve.zip
          test "$(sha256sum /tmp/reserve.zip | awk '{print $1}')" = 'a13df6e1ce262ea573e785720259a7a47b9344cbfd8550c939c1c8154f9954b8'
          unzip -q /tmp/reserve.zip -d /tmp/reserve
          test "$(sha256sum /tmp/reserve/FAB-OU25-PIT-B04.json | awk '{print $1}')" = 'ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/reserve/FAB-OU25-PIT-B04.json').read_text())
          inv=json.loads(Path('/tmp/reserve/inventory.json').read_text())
          assert m['batch_id']=='FAB-OU25-PIT-B04' and m['status']=='SEALED_UNOPENED'
          assert m['batch_size']==359 and len(m['matches'])==359
          assert m['selection_uses_outcomes'] is False and m['outcome_values_dereferenced']==0
          assert inv['outcome_values_dereferenced']==0 and inv['forbidden_outcome_fields_dereferenced']==[]
          b=[x for x in inv['batches'] if x['batch_id']=='FAB-OU25-PIT-B04']
          assert len(b)==1 and b[0]['n']==359 and b[0]['manifest_sha256']=='ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'
          print('B04_ORIGINAL_SEAL_VERIFIED_LABELS_UNOPENED')
          PY

      - name: Download pinned pre-match market source only
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 900 \
            'https://huggingface.co/datasets/fabul0us/football_odds_2023-24/resolve/211feb35f9dcd270bd7a1b27b39a8b1f45f239aa/match_odds.csv?download=true' \
            -o /tmp/fab/match_odds.csv
          test "$(sha256sum /tmp/fab/match_odds.csv | awk '{print $1}')" = 'c0e8854302159e1a8c529463f33280b728909c5e0ba95262515a7a144a43aa2a'

      - name: Build B04 zero-label pre-match packet from sealed identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, math
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          MANIFEST_SHA='ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'
          SRC_SHA='c0e8854302159e1a8c529463f33280b728909c5e0ba95262515a7a144a43aa2a'
          CUTOFFS=[24,12,6,1]
          manifest_path=Path('/tmp/reserve/FAB-OU25-PIT-B04.json')
          src_path=Path('/tmp/fab/match_odds.csv')
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==MANIFEST_SHA
          assert hashlib.sha256(src_path.read_bytes()).hexdigest()==SRC_SHA
          manifest=json.loads(manifest_path.read_text())

          def dt(x):
              s=str(x).strip().replace('Z','+00:00')
              try: z=datetime.fromisoformat(s)
              except Exception:
                  try: z=datetime.strptime(s,'%Y-%m-%d %H:%M:%S.%f')
                  except Exception: z=datetime.strptime(s,'%Y-%m-%d %H:%M:%S')
              return z.replace(tzinfo=timezone.utc) if z.tzinfo is None else z.astimezone(timezone.utc)
          def valid(v):
              try:
                  x=float(v); return math.isfinite(x) and x>1.0
              except Exception: return False
          def devig2(o,u):
              a,b=1/float(o),1/float(u); return a/(a+b)
          def devig3(h,d,a):
              x=[1/float(h),1/float(d),1/float(a)]; s=sum(x); return [v/s for v in x]

          selected={(m['source_home'],m['source_away'],m['competition']):m for m in manifest['matches']}
          assert len(selected)==359
          quotes={k:{'ou':{},'hda':{}} for k in selected}
          with src_path.open('r',encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f)
              forbidden={'score','result','winner','home_goals','away_goals','fthg','ftag','settlement'}
              assert not ({str(x).lower() for x in (r.fieldnames or [])} & forbidden)
              for row in r:
                  key=(row.get('home_team','').strip(),row.get('away_team','').strip(),row.get('competition','').strip())
                  if key not in selected: continue
                  uts=row.get('U/O 2.5 timestamp')
                  if uts and valid(row.get('odds_over_2.5')) and valid(row.get('odds_under_2.5')):
                      quotes[key]['ou'][dt(uts)]=(float(row['odds_over_2.5']),float(row['odds_under_2.5']))
                  hts=row.get('1X2 timestamp')
                  if hts and all(valid(row.get(c)) for c in ('odds_1','odds_X','odds_2')):
                      quotes[key]['hda'][dt(hts)]=(float(row['odds_1']),float(row['odds_X']),float(row['odds_2']))

          rows=[]; coverage={}
          for cutoff_h in CUTOFFS:
              complete=0
              for key,m in selected.items():
                  kickoff=dt(m['kickoff_utc']); cutoff=kickoff-timedelta(hours=cutoff_h)
                  oe=[(t,v) for t,v in quotes[key]['ou'].items() if t<=cutoff]
                  he=[(t,v) for t,v in quotes[key]['hda'].items() if t<=cutoff]
                  if not oe or not he: continue
                  ot,(over,under)=max(oe,key=lambda x:x[0]); ht,(oh,od,oa)=max(he,key=lambda x:x[0])
                  ph,pd,pa=devig3(oh,od,oa)
                  rows.append({
                    'fixture_id':int(m['fixture_id']),'batch_id':'FAB-OU25-PIT-B04','cutoff_hours':cutoff_h,
                    'kickoff_utc':m['kickoff_utc'],'competition':m['competition'],
                    'ou_timestamp_utc':ot.isoformat(),'hda_timestamp_utc':ht.isoformat(),
                    'ou_lead_hours':(kickoff-ot).total_seconds()/3600.0,
                    'hda_lead_hours':(kickoff-ht).total_seconds()/3600.0,
                    'p_over25_devig':devig2(over,under),'p_home_devig':ph,'p_draw_devig':pd,'p_away_devig':pa,
                  }); complete+=1
              coverage[str(cutoff_h)]={'complete_both_markets':complete,'coverage_rate':complete/359.0}
          assert coverage['1']['complete_both_markets']==359, coverage
          assert len({r['fixture_id'] for r in rows if r['cutoff_hours']==1})==359
          outdir=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_input_audit_r1'); outdir.mkdir(parents=True,exist_ok=True)
          packet={'schema_version':'FAB-OU25-B04-PRE-MATCH-INPUTS-R1','batch_id':'FAB-OU25-PIT-B04','reconstructed_batch_manifest_sha256':MANIFEST_SHA,'cutoffs_hours_before_kickoff':CUTOFFS,'selection_uses_outcomes':False,'outcome_values_dereferenced':0,'fields':['fixture_id','kickoff_utc','competition','market timestamps','de-vigged 1X2 probabilities','de-vigged OU2.5 over probability'],'rows':rows}
          p=outdir/'B04_pre_match_inputs_all_cutoffs.json'; p.write_text(json.dumps(packet,ensure_ascii=False,indent=2)+'\n')
          summary={'schema_version':'FAB-OU25-B04-INPUT-AUDIT-R1','status':'ZERO_LABEL_COMPLETE','source_sha256':SRC_SHA,'reserve_artifact_id':9275467160,'reserve_zip_sha256':'a13df6e1ce262ea573e785720259a7a47b9344cbfd8550c939c1c8154f9954b8','reserve_reconstructed_n':1559,'b04_n':359,'b04_manifest_sha256_expected':MANIFEST_SHA,'b04_manifest_sha256_reconstructed':hashlib.sha256(manifest_path.read_bytes()).hexdigest(),'b04_hash_match':True,'coverage':coverage,'pre_match_packet_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'target_labels_accessed':0,'target_outcome_columns_read':[],'model_fits':0,'scoring':0,'threshold_tuning':0,'effect_test_authorized':False}
          (outdir/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print('B04_PACKET_SHA256='+summary['pre_match_packet_sha256'])
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Execute unchanged Direct-T model contract for B04
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          packet=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_input_audit_r1/B04_pre_match_inputs_all_cutoffs.json')
          packet_sha=hashlib.sha256(packet.read_bytes()).hexdigest()
          src=Path('football-data/validation/freeze_fabulous_ou25_b01_market_direct_t_r1.py').read_text(encoding='utf-8')
          assert "B01_SHA = 'fcba07147d230357925d3ee41027dfae18a27654960641c509ead5626b057baf'" in src
          assert "PACKET_SHA = 'c43429684741389bd6f57011a5c906be17cbbdd5e8d3ba279b278d038110159a'" in src
          assert "if len(target)!=400 or len({int(r['fixture_id']) for r in target})!=400:" in src
          assert "'n':400" in src and "'rows':400" in src
          out=src.replace('B01','B04').replace('b01','b04')
          out=out.replace("B04_SHA = 'fcba07147d230357925d3ee41027dfae18a27654960641c509ead5626b057baf'","B04_SHA = 'ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'")
          out=out.replace("PACKET_SHA = 'c43429684741389bd6f57011a5c906be17cbbdd5e8d3ba279b278d038110159a'",f"PACKET_SHA = '{packet_sha}'")
          out=out.replace("if len(target)!=400 or len({int(r['fixture_id']) for r in target})!=400:","if len(target)!=359 or len({int(r['fixture_id']) for r in target})!=359:")
          out=out.replace("'n':400","'n':359").replace("'rows':400","'rows':359")
          out=out.replace("'B02_B03_B04_labels_accessed':0", "'B04_labels_accessed':0,'prior_B01_B02_B03_outcomes_used_for_training_or_parameter_selection':False")
          runtime=Path('football-data/validation/_runtime_freeze_fabulous_ou25_b04_market_direct_t_r1.py')
          runtime.write_text(out,encoding='utf-8')
          PY
          python football-data/validation/_runtime_freeze_fabulous_ou25_b04_market_direct_t_r1.py
          rm -f football-data/validation/_runtime_freeze_fabulous_ou25_b04_market_direct_t_r1.py

      - name: Freeze receipt and assert B04 preregistration before labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          inp=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_input_audit_r1/B04_pre_match_inputs_all_cutoffs.json')
          d=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_r1')
          pred=d/'B04_frozen_predictions.csv'; lockp=d/'preregistration_and_prediction_lock.json'; lock=json.loads(lockp.read_text())
          assert lock['status']=='PREDICTIONS_FROZEN_LABELS_UNOPENED'
          assert lock['target']['batch_id']=='FAB-OU25-PIT-B04'
          assert lock['target']['batch_manifest_sha256']=='ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'
          assert lock['target']['n']==359 and lock['target']['target_labels_accessed']==0
          assert lock['historical_training']['target_period_start_exclusive']=='2023-07-01'
          assert lock['historical_training']['identity_sha256']=='4e8fe036b5dc4b46b1e8fffbd88c3fa77665720cd4be0340dda65f9956884c95'
          assert lock['historical_training']['post_target_outcome_values_dereferenced']==0
          assert lock['model']['baseline_features']==['logit_pH','logit_pD','logit_pA']
          assert lock['model']['candidate_features']==['logit_pH','logit_pD','logit_pA','ou25_logit_over']
          assert lock['model']['candidate_increment_exact']=='logit(de-vigged P(Over2.5))'
          assert lock['model']['selected_C']==0.1
          assert lock['science_gate']['PASS']=='point delta < 0 AND calendar-date/bootstrap90 upper bound < 0'
          receipt={'status':'B04_PREDICTIONS_FROZEN_LABELS_UNOPENED','original_reserve_run':31991453403,'original_reserve_artifact':9275467160,'batch_manifest_sha256':lock['target']['batch_manifest_sha256'],'packet_sha256':hashlib.sha256(inp.read_bytes()).hexdigest(),'prediction_sha256':hashlib.sha256(pred.read_bytes()).hexdigest(),'prereg_lock_sha256':hashlib.sha256(lockp.read_bytes()).hexdigest(),'rows':359,'selected_C':0.1,'B04_labels_accessed_in_this_freeze':0,'B01_B02_B03_outcomes_used_for_training_or_parameter_selection':False,'formal_weight':0}
          (d/'B04_freeze_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print('B04_FREEZE_RECEIPT='+json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload zero-label B04 freeze artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-ou25-b04-market-direct-t-freeze-r1-${{ github.sha }}
          path: |
            football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_input_audit_r1/*.json
            football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_r1/*
          if-no-files-found: error
          retention-days: 90

      - name: Confirm no tracked runtime mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf football-data/validation/__pycache__
          rm -f football-data/validation/_runtime_freeze_fabulous_ou25_b04_market_direct_t_r1.py
          git diff --exit-code
          git diff --cached --exit-code
