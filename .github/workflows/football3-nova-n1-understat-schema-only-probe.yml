name: football3-nova-n1-understat-schema-only-probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'governance/football3/nova_n1_understat_schema_probe_v1.py'
      - 'governance/football3/test_nova_n1_understat_schema_probe_v1.py'
      - '.github/workflows/football3-nova-n1-understat-schema-only-probe.yml'

permissions:
  contents: read

concurrency:
  group: football3-nova-n1-understat-schema-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  schema_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact branch and unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = 'football3/nova-n1-lagged-deep-ppda-v1'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m py_compile \
            governance/football3/nova_n1_understat_schema_probe_v1.py \
            governance/football3/test_nova_n1_understat_schema_probe_v1.py
          cd governance/football3
          python test_nova_n1_understat_schema_probe_v1.py -v

      - name: Probe public Understat league endpoint schema keys only
        shell: bash
        run: |
          set -euo pipefail
          python governance/football3/nova_n1_understat_schema_probe_v1.py --out n1_understat_schema_probe
          python - <<'PY'
          import json
          p=json.load(open('n1_understat_schema_probe/understat_schema_only_probe.json',encoding='utf-8'))
          assert p['usage_status']=='TECHNICAL_FEASIBILITY_ONLY_NOT_A_LICENSE_GRANT'
          assert p['json_values_decoded']==0
          assert p['test_result_vault_opened'] is False and p['test_labels_read'] is False
          assert p['formal_v2_modified'] is False and p['current_modified'] is False and p['production_modified'] is False
          assert len(p['reports'])==5
          for r in p['reports']:
              assert r['json_values_decoded']==0
              assert r['result_values_decoded']==0
              assert r['goal_or_xg_values_decoded']==0
              assert r['raw_response_persisted'] is False
              assert r['test_result_vault_opened'] is False and r['test_labels_read'] is False
          print(json.dumps({r['league']:{'status':r['status'],'feature_keys':r.get('required_feature_keys_present',[]),'result_keys_seen_names_only':r.get('result_like_keys_present_but_values_not_decoded',[])} for r in p['reports']},sort_keys=True))
          PY

      - name: Upload schema-only feasibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: football3-nova-n1-understat-schema-only-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: n1_understat_schema_probe/
          if-no-files-found: error
          retention-days: 90
