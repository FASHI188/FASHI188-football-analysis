name: football3 Historical Fusion V3.1.1 Joint Score

on:
  push:
    branches: ['football3/historical-fusion-v3-1-1-joint-score-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-1-1-joint-score-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-historical-fusion-v3-1-1-joint-score-${{ github.sha }}
  cancel-in-progress: false

env:
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  V31_HEAD: 7689ec0726fbed6fd2474e1a237b49ab7ad768c7
  USR1_HEAD: 485807562f0d1c859ba13355dc671e980de5eb9e
  CONTRACT_BLOB: ced676043c61cbe7d61580ea107761d871548a7a
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      terminal_status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact HEAD lineage whitelist frozen contract and refs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-1-1-joint-score-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$FORMAL_HEAD" HEAD)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-low-variance-v1 | cut -f1)" = "$V31_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-upset-safe-v1 | cut -f1)" = "$USR1_HEAD"
          test "$(git hash-object football-data/research/historical_fusion_v3_1_1_joint_score/V3_1_1_JOINT_SCORE_CONTRACT.json)" = "$CONTRACT_BLOB"
          test "$(sha256sum football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py | awk '{print $1}')" = 'b7f244e43a267e20552a722b3d2ef859adba208577e6cbbe7adc2989c2762696'
          test "$(sha256sum football-data/research/historical_fusion_v3_1_1_joint_score/test_historical_fusion_v3_1_1_joint_score.py | awk '{print $1}')" = 'b02693e2a90688f2603989e8c4469c28425441303efd354a9609ebd941026656'
          python - <<'PY'
          import os,subprocess
          allowed={
            '.github/workflows/football3-historical-fusion-v3-1-1-joint-score-v1.yml',
            'football-data/research/historical_fusion_v3_1_1_joint_score/V3_1_1_JOINT_SCORE_CONTRACT.json',
            'football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py',
            'football-data/research/historical_fusion_v3_1_1_joint_score/test_historical_fusion_v3_1_1_joint_score.py',
          }
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['FORMAL_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          forbidden=('CURRENT','production_pointer','formal_enablement')
          assert not any(any(x in p for x in forbidden) for p in got),got
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fresh deterministic joint-score tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py football-data/research/historical_fusion_v3_1_1_joint_score/test_historical_fusion_v3_1_1_joint_score.py
          python football-data/research/historical_fusion_v3_1_1_joint_score/test_historical_fusion_v3_1_1_joint_score.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 12 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify six frozen research inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY'
          import sys
          norm=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          python - <<'PY'
          import hashlib,pathlib
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert h('_inputs/v2/code/historical_xg_fusion_v2.py')=='1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          assert h('_inputs/xg/code/historical_xg_challenger.py')=='588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          assert h('_inputs/v1/pure_engine.py')=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_inputs/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          assert h('_inputs/v31/code/historical_fusion_v3_1.py')=='59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'
          PY

      - name: Authoritative POST_VIEW joint-score research
        id: run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _run
          python football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --contract football-data/research/historical_fusion_v3_1_1_joint_score/V3_1_1_JOINT_SCORE_CONTRACT.json \
            --v2-engine _inputs/v2/code/historical_xg_fusion_v2.py \
            --xg-engine _inputs/xg/code/historical_xg_challenger.py \
            --v1-engine _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --usr1-engine _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v31-engine _inputs/v31/code/historical_fusion_v3_1.py \
            --out _run 2>&1 | tee /tmp/joint_stdout.txt
          python - <<'PY'
          import json
          f=json.load(open('_run/final_status.json'))
          allowed={'V3_1_1_JOINT_SCORE_RESEARCH_CANDIDATE_READY_CONFIRMATION_REQUIRED','V3_1_1_JOINT_SCORE_RESEARCH_REJECTED'}
          assert f['status'] in allowed,f['status']
          assert f['research_only'] is True and f['fresh_confirmation_available'] is False and f['promotion_allowed'] is False
          assert f['formal_v2_unchanged'] is True and f['CURRENT_changed'] is False and f['production_pointer_changed'] is False and f['formal_enablement_changed'] is False
          if f['status'].endswith('READY_CONFIRMATION_REQUIRED'):
              assert f['candidate_id']=='V3.1.1-A'
              h=f['candidate_fixed_2023_joint_holdout']; m=json.load(open('_run/matrix_contract_receipt.json'))
              assert h['all_pass'] is True
              assert m['matrix_shape']==[15,15] and m['cell_count']==225 and m['one_x_two_source']=='INTEGRATE_FINAL_MATRIX_ONLY'
              assert m['matrix_valid_all'] is True and m['fallback_matrix_exact'] is True
              assert m['max_matrix_to_v3_1_a_1x2_abs_diff']<=1e-12
              assert m['max_formal_v2_joint_to_formal_v2_1x2_abs_diff']<=1e-12
              assert h['one_x_two']['gates']['weak_team_win_conditional_degradation']<=0.01
              assert h['score_gates']['exact_score_logloss_delta']<=0.0
              assert f['future_required_n']['max_for_dual_objective_confirmation'] is not None
          PY
          status="$(python -c "import json;print(json.load(open('_run/final_status.json'))['status'])")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "slug=$(cat _run/artifact_slug.txt)" >> "$GITHUB_OUTPUT"

      - name: Seal exact joint-score artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/contracts _seal/code _seal/evidence
          cp football-data/research/historical_fusion_v3_1_1_joint_score/V3_1_1_JOINT_SCORE_CONTRACT.json _seal/contracts/
          cp football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py football-data/research/historical_fusion_v3_1_1_joint_score/test_historical_fusion_v3_1_1_joint_score.py _seal/code/
          cp _run/*.json _seal/evidence/
          cp /tmp/tests.txt /tmp/joint_stdout.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          r=pathlib.Path('_seal'); files={}
          for p in sorted(r.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          f=json.load(open('_run/final_status.json'))
          m={'schema_version':'football3-v3-1-1-joint-score-artifact-v1','status':f['status'],'head':os.environ['GITHUB_SHA'],'direct_parent':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),'formal_v2_head':os.environ['FORMAL_HEAD'],'v3_1_head':os.environ['V31_HEAD'],'usr1_head':os.environ['USR1_HEAD'],'historical_only':True,'post_view_research_only':True,'fresh_confirmation_available':False,'promotion_allowed':False,'matrix_0_14_by_0_14_required':True,'one_x_two_integrated_from_matrix_only':True,'formal_v2_unchanged':True,'production_pointer_changed':False,'CURRENT_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (r/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload V3.1.1 joint-score research artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-1-1-joint-score-${{ steps.run.outputs.slug }}-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: validate-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Remote ZIP digest CRC manifest exact-set SHA bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ART_ID: ${{ needs.validate-and-seal.outputs.artifact_id }}
          DIGEST: ${{ needs.validate-and-seal.outputs.artifact_digest }}
          STATUS: ${{ needs.validate-and-seal.outputs.terminal_status }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}")"
          md="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$md" "$DIGEST" <<'PY'
          import sys
          norm=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" -o /tmp/a.zip
          python - "$DIGEST" <<'PY'
          import hashlib,pathlib,sys
          exp=sys.argv[1].removeprefix('sha256:'); got=hashlib.sha256(pathlib.Path('/tmp/a.zip').read_bytes()).hexdigest(); assert got==exp,(got,exp)
          PY
          unzip -tq /tmp/a.zip
          rm -rf /tmp/r && mkdir /tmp/r && unzip -q /tmp/a.zip -d /tmp/r
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          r=pathlib.Path('/tmp/r'); m=json.loads((r/'artifact_manifest.json').read_text())
          assert m['head']==os.environ['GITHUB_SHA'] and m['status']==os.environ['STATUS']
          assert m['direct_parent']==subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert m['formal_v2_head']=='e12f5d1193be5d81f60301cf34ab2140e11712a9'
          assert m['v3_1_head']=='7689ec0726fbed6fd2474e1a237b49ab7ad768c7'
          assert m['usr1_head']=='485807562f0d1c859ba13355dc671e980de5eb9e'
          assert m['post_view_research_only'] is True and m['fresh_confirmation_available'] is False and m['promotion_allowed'] is False
          assert m['matrix_0_14_by_0_14_required'] is True and m['one_x_two_integrated_from_matrix_only'] is True
          assert m['formal_v2_unchanged'] is True and m['production_pointer_changed'] is False and m['CURRENT_changed'] is False and m['formal_enablement_changed'] is False and m['formal_weights_changed'] is False
          exp=set(m['files']); got={p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file()}-{'artifact_manifest.json'}
          assert got==exp,(got^exp)
          for rel,meta in m['files'].items():
              b=(r/rel).read_bytes(); assert len(b)==meta['bytes'] and hashlib.sha256(b).hexdigest()==meta['sha256'],rel
          f=json.loads((r/'evidence/final_status.json').read_text()); mr=json.loads((r/'evidence/matrix_contract_receipt.json').read_text())
          assert f['status']==m['status']; assert mr['matrix_shape']==[15,15] and mr['cell_count']==225 and mr['one_x_two_source']=='INTEGRATE_FINAL_MATRIX_ONLY'
          PY
