name: Football V4.7.1 Repository Integrity Read-Only
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Compile integrity auditors
        run: |
          python -m py_compile football-data/validation/repository_integrity_v471.py football-data/validation/repository_integrity_runtime_v473.py football-data/validation/repository_asset_topology_v472.py football-data/validation/workflow_stability_audit_v474.py governance/validate_project_continuity.py
      - name: Run fail-closed repository integrity gates
        run: |
          python football-data/validation/repository_integrity_runtime_v473.py --strict-exit --print-summary
          python football-data/validation/repository_asset_topology_v472.py --strict-exit --print-summary
          python football-data/validation/workflow_stability_audit_v474.py --print-summary
          python governance/validate_project_continuity.py --self-test
          python governance/test_required_context_coverage.py
      - name: Confirm no repository writeback
        run: git diff --exit-code
