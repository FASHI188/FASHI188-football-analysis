name: Football R39L Feature Coverage

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39l-feature-coverage.yml'
      - 'football-data/research/lineup_attack_r39l/**'

permissions:
  contents: read

concurrency:
  group: r39l-feature-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zero-target-label-feature-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'

      - name: Verify frozen zero-target-label contract and synthetic strict lag
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/lineup_attack_r39l/audit_lineup_attack_features_r39l.py
          python - <<'PY'
          import importlib.util,json
          from datetime import date
          from pathlib import Path
          p=json.loads(Path('football-data/research/lineup_attack_r39l/preregistration_r39l.json').read_text())
          r=json.loads(Path('football-data/research/lineup_attack_r39l/source_registration_r39l.json').read_text())
          assert p['preregistration_status']=='ZERO_LABEL_COVERAGE_AMENDMENT_FROZEN_BEFORE_TARGET_LABEL_ACCESS'
          assert p['zero_label_design_amendment']['target_labels_accessed_in_first_audit']==0
          assert p['zero_label_design_amendment']['feature_dimension_after']==10
          assert p['full_feature_dimension']==10 and p['target_and_model']['full_dimension']==10
          assert p['source_binding']['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert p['source_binding']['fixed100_labels_accessed_before_r39l']==0
          assert p['execution_gate']['real_target_label_evaluation_authorized_now'] is False
          assert r['r39i_identity_lane']['labels_accessed']==0
          assert r['feature_contract']['feature_dimension']==10 and r['feature_contract']['prior_core_features']==0
          assert all(v==0 for v in r['no_target_label_contract'].values())
          path=Path('football-data/research/lineup_attack_r39l/audit_lineup_attack_features_r39l.py')
          spec=importlib.util.spec_from_file_location('r39l',path);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          raw={'p1':[(date(2024,1,1),1,90),(date(2024,1,2),9,90)]};comp={'GB1':[(date(2023,1,1),10,900),(date(2024,1,2),100,90)]}
          pi=m.make_prefix(raw);ci=m.make_prefix(comp)
          v,maxd=m.player_rate('p1',date(2024,1,2),'GB1',pi,ci,900.0)
          assert maxd==date(2024,1,1)
          expected=90.0*(1.0+(10.0/900.0)*900.0)/(90.0+900.0)
          assert abs(v-expected)<1e-12
          print('PASS_R39L_ZERO_LABEL_AMENDED_CONTRACT_AND_STRICT_LAG_SELF_TEST')
          PY

      - name: Download and sanitize Transfermarkt identity lineup and prior-performance tables
        run: |
          set -euo pipefail
          rm -rf r39l-tm r39l-fd r39l-out player_scores.zip /tmp/r39l-*.csv
          mkdir -p r39l-tm r39l-fd r39l-out
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39l-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39l-lineups.csv
          unzip -p player_scores.zip appearances.csv > /tmp/r39l-appearances.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39l-games.csv','r39l-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39l-lineups.csv','r39l-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39l-appearances.csv','r39l-tm/appearances_prior.csv',['appearance_id','game_id','player_id','player_club_id','date','competition_id','goals','assists','minutes_played'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing: raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39l-games.csv /tmp/r39l-lineups.csv /tmp/r39l-appearances.csv player_scores.zip

      - name: Download and sanitize Football-Data market identity only
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="/tmp/r39l-${season}_${div}.csv";out="r39l-fd/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing: raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
              rm -f "$raw"
            done
          done

      - name: Audit R39I identity reproduction and R39L feature coverage
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_r39l/audit_lineup_attack_features_r39l.py \
            --registration football-data/research/lineup_attack_r39l/source_registration_r39l.json \
            --r39i-coverage-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39l-fd --games r39l-tm/games_identity.csv --lineups r39l-tm/lineups_identity.csv \
            --appearances r39l-tm/appearances_prior.csv --out-dir r39l-out

      - name: Verify zero-target-label terminal state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39l-out/feature_coverage_r39l.json').read_text())
          assert r['r39i_identity_lane']['preholdout']==8161
          assert r['r39i_identity_lane']['holdout_2526']==1273
          assert r['r39i_identity_lane']['fixed100_rows']==100
          assert r['r39i_identity_lane']['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert all(v==0 for v in r['audit_access'].values())
          assert r['strict_lag_violations']==0
          assert r['status'] in {'PASS_R39L_ZERO_TARGET_LABEL_FEATURE_COVERAGE','STOP_R39L_FEATURE_COVERAGE_OR_LAG_GATE'}
          print(json.dumps({k:r[k] for k in ('status','r39i_identity_lane','transfermarkt','feature_eligible','ineligible_reasons','strict_lag_violations','audit_access')},indent=2))
          PY

      - name: Delete source inputs before artifact
        run: rm -rf r39l-tm r39l-fd

      - uses: actions/upload-artifact@v4
        with:
          name: football-r39l-feature-coverage-${{ github.sha }}-${{ github.run_id }}
          path: r39l-out/
          if-no-files-found: error
          retention-days: 30
