name: football3-nova-n9-coach-history-oof

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n9_coach_history_oof_preregistration_v1.json'
      - 'governance/football3/nova_n9_coach_history_label_vault_v1.py'
      - 'governance/football3/nova_n9_coach_history_oof_v1.py'
      - 'governance/football3/test_nova_n9_coach_history_oof_v1.py'
      - '.github/workflows/football3-nova-n9-coach-history-oof-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-nova-n9-coach-history-oof-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  BASELINE_ARTIFACT_ID: '10447180675'
  BASELINE_ARTIFACT_DIGEST: 'sha256:729e61784247904f25a2a23995325ac0b6e8c9ce82cd9181f2a93045764af3e6'
  BASELINE_2022_SHA256: '1bfa3ff8721b75d6a2e1167da788e1712bdb74508623bb03c96a81c4186f4695'
  OLD_DB_ARTIFACT_ID: '9798682425'
  OLD_DB_ARTIFACT_DIGEST: 'sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba'
  OLD_DB_SHA256: 'f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
  DATA_READY_ARTIFACT_ID: '10703158427'
  DATA_READY_ARTIFACT_DIGEST: 'sha256:d3fece85022e8b3a6658792305eb044957385c8db2c8f0401eb2d9f69803b744'
  DATA_READY_RECEIPT_SHA256: '1e4e3b8767a88a73f422d51c224004f86b4ba208602d3c0970f499e3a72a73b9'
  DATA_READY_STATE_SHA256: '7559d92a364aaf8ea76e038f6e96ad3b0ed2e1f54dc9ba4d8b5366f1ea34d24f'

jobs:
  n9-coach-oof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric runtime
        run: python -m pip install --disable-pip-version-check --quiet 'numpy==2.3.3'
      - name: Static module and contract tests
        run: |
          set -euo pipefail
          python -m py_compile governance/football3/nova_n9_coach_history_label_vault_v1.py governance/football3/nova_n9_coach_history_oof_v1.py governance/football3/test_nova_n9_coach_history_oof_v1.py
          PYTHONPATH=governance/football3 python governance/football3/test_nova_n9_coach_history_oof_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
          python - <<'PY'
          import json
          p=json.load(open('governance/football3/nova_n9_coach_history_oof_preregistration_v1.json'))
          assert p['status']=='DESIGN_LOCKED_PRELABEL'
          assert p['exact_base']=='803178448c2d8b1555ae4309bacbf5811c1e4912'
          assert p['data']['completed_only'] is True and p['data']['development_n']==1826
          assert p['experiment_budget']['maximum_batches']==1 and p['experiment_budget']['isolated_open_allowed'] is False
          assert [x['id'] for x in p['subroutes']]==['R1_TENURE','R2_CHANGE_BANDS','R3_TENURE_DEPTH','R4_FIXED_NONLINEAR']
          assert p['data_ready']['exact_head']=='803178448c2d8b1555ae4309bacbf5811c1e4912'
          assert p['data_ready']['state_projection_sha256']=='7559d92a364aaf8ea76e038f6e96ad3b0ed2e1f54dc9ba4d8b5366f1ea34d24f'
          assert p['feature_contract']['manager_name_direct_encoding_allowed'] is False
          assert p['feature_contract']['target_match_manager_direct_feature_allowed'] is False
          assert p['model']['candidate_weight']==0 and p['model']['matrix_delta']==0
          PY
      - name: Download and verify immutable Formal V2 baseline, label DB and N9 DATA_READY asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _run _inputs && mkdir -p _run/labels _run/oof _run/final _inputs/baseline _inputs/olddb _inputs/dataready
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            got="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq '.digest')"
            test "$got" = "$expected"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip" && unzip -q "$zip" -d "$dest"
          }
          verify_one "$BASELINE_ARTIFACT_ID" "$BASELINE_ARTIFACT_DIGEST" /tmp/base.zip _inputs/baseline
          verify_one "$OLD_DB_ARTIFACT_ID" "$OLD_DB_ARTIFACT_DIGEST" /tmp/db.zip _inputs/olddb
          verify_one "$DATA_READY_ARTIFACT_ID" "$DATA_READY_ARTIFACT_DIGEST" /tmp/dataready.zip _inputs/dataready
          BASELINE="$(find _inputs/baseline -name formal_v2_baseline_2022_label_free.jsonl -print -quit)"; test -n "$BASELINE"
          STATE="$(find _inputs/dataready -name coach_history_state_2022.jsonl -print -quit)"; test -n "$STATE"
          RECEIPT="$(find _inputs/dataready -name data_ready_receipt.json -print -quit)"; test -n "$RECEIPT"
          test "$(sha256sum "$BASELINE" | awk '{print $1}')" = "$BASELINE_2022_SHA256"
          test "$(sha256sum _inputs/olddb/understat_frozen.db | awk '{print $1}')" = "$OLD_DB_SHA256"
          test "$(sha256sum "$STATE" | awk '{print $1}')" = "$DATA_READY_STATE_SHA256"
          test "$(sha256sum "$RECEIPT" | awk '{print $1}')" = "$DATA_READY_RECEIPT_SHA256"
          python - "$RECEIPT" <<'PY'
          import json, os, sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='N9_COACH_HISTORY_DATA_READY' and r['classification']=='DATA_READY'
          assert r['exact_head']=='803178448c2d8b1555ae4309bacbf5811c1e4912'
          assert r['target_n']==1826 and r['identity_bound_n']==1826 and r['manager_state_both_n']==1825
          assert r['state_projection_sha256']==os.environ['DATA_READY_STATE_SHA256']
          assert r['target_match_manager_direct_feature_used']==0
          assert r['result_labels_read']==0 and r['score_values_read']==0 and r['xg_values_read']==0 and r['market_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          PY
          printf '%s\n' "$BASELINE" > /tmp/baseline_path.txt
          printf '%s\n' "$STATE" > /tmp/state_path.txt
      - name: Open development 2022 labels only after DATA_READY and baseline verification
        run: |
          set -euo pipefail
          STATE="$(cat /tmp/state_path.txt)"
          python governance/football3/nova_n9_coach_history_label_vault_v1.py --db _inputs/olddb/understat_frozen.db --projection "$STATE" --out _run/labels 2>&1 | tee /tmp/labels.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/labels/label_receipt.json'))
          assert r['status']=='N9_COACH_HISTORY_DEVELOPMENT_2022_LABEL_VAULT_PASS' and r['development_n']==1826
          assert r['n1_2025_isolated_labels_read']==0 and r['n2_2023_isolated_labels_read']==0 and r['n3_2021_isolated_labels_read']==0
          assert r['raw_goals_emitted'] is False and r['score_fields_emitted'] is False
          PY
      - name: Run exactly four preregistered chronological coach-history OOF routes
        run: |
          set -euo pipefail
          BASELINE="$(cat /tmp/baseline_path.txt)"; STATE="$(cat /tmp/state_path.txt)"
          python governance/football3/nova_n9_coach_history_oof_v1.py --prereg governance/football3/nova_n9_coach_history_oof_preregistration_v1.json --source "$STATE" --baseline "$BASELINE" --labels _run/labels/labels_2022.jsonl --out _run/oof 2>&1 | tee /tmp/oof.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/oof/development_oof_result.json'))
          assert r['status']=='N9_COACH_HISTORY_DEVELOPMENT_OOF_COMPLETE'
          assert r['classification'] in {'POSITIVE_SIGNAL','FAIL_CURRENT_IMPLEMENTATION'}
          assert r['development_n']==1826 and r['completed_matches_only'] is True and r['oof_evaluation_n']>0
          assert len(r['routes'])==4 and {x['route'] for x in r['routes']}=={'R1_TENURE','R2_CHANGE_BANDS','R3_TENURE_DEPTH','R4_FIXED_NONLINEAR'}
          assert set(r['league_report'])=={'EPL','Bundesliga','La_liga','Ligue_1','Serie_A','J1','K1'}
          assert r['data_ready_exact_head']=='803178448c2d8b1555ae4309bacbf5811c1e4912'
          assert r['data_ready_state_sha256']=='7559d92a364aaf8ea76e038f6e96ad3b0ed2e1f54dc9ba4d8b5366f1ea34d24f'
          assert r['manager_name_direct_encoding_used'] is False and r['target_match_manager_direct_feature_used']==0
          assert r['n1_2025_isolated_labels_read']==0 and r['n2_2023_isolated_labels_read']==0 and r['n3_2021_isolated_labels_read']==0
          assert r['candidate_activation_allowed'] is False and r['promotion_allowed'] is False
          assert r['formal_v2_changed'] is False and r['current_changed'] is False and r['production_changed'] is False and r['candidate_weight']==0 and r['matrix_delta']==0
          PY
      - name: Seal terminal receipt
        run: |
          python - <<'PY'
          import json, os
          l=json.load(open('_run/labels/label_receipt.json')); o=json.load(open('_run/oof/development_oof_result.json'))
          r={'schema_version':'football3-nova-n9-coach-history-terminal-receipt-v1','status':'N9_COACH_HISTORY_BATCH_TERMINAL','exact_head':os.environ['CANDIDATE_HEAD'],'classification':o['classification'],'development_n':o['development_n'],'oof_evaluation_n':o['oof_evaluation_n'],'best_signal_route':o['best_signal_route'],'best_formal_minus_candidate_logloss':o['best_formal_minus_candidate_logloss'],'data_ready_exact_head':o['data_ready_exact_head'],'data_ready_state_sha256':o['data_ready_state_sha256'],'label_sha256':l['label_sha256'],'isolated_labels_read':{'n1_2025':0,'n2_2023':0,'n3_2021':0},'candidate_weight':0,'matrix_delta':0,'formal_v2_changed':False,'current_changed':False,'production_changed':False}
          open('_run/final/final_receipt.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n9-coach-history-oof-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/labels.txt
            /tmp/oof.txt
          retention-days: 90
