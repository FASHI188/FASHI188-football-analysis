name: football3 top1 R32 coach formation context

on:
  push:
    branches:
      - football3/top1-r32-coach-formation-context
    paths:
      - football-data/experiments/top1_r32_coach_formation_context/run_experiment_r32.py
      - .github/workflows/football3-top1-r32-coach-formation-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r32-coach-formation-context
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R32 coach formation context
        run: python football-data/experiments/top1_r32_coach_formation_context/run_experiment_r32.py run
      - name: Verify R32 contract
        run: python football-data/experiments/top1_r32_coach_formation_context/run_experiment_r32.py verify
      - name: Persist R32 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r32_coach_formation_context/results/summary_r32.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R32 coach formation context'
            git push origin HEAD:football3/top1-r32-coach-formation-context
          fi
      - name: Upload R32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r32-coach-formation-context
          path: football-data/experiments/top1_r32_coach_formation_context/results/summary_r32.json
          if-no-files-found: error
          retention-days: 90
