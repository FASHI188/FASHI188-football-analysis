name: C072-D2 free OU2.5 zero-label source audit

on:
  pull_request:
    branches:
      - research/c072c-xg-total-scalar-20260818
    paths:
      - 'football-data/research/C072D2_FREE_OU25_OPEN_CLOSE_ZERO_LABEL_CONTRACT.md'
      - 'football-data/research/audit_c072d2_free_ou25_zero_label.py'
      - '.github/workflows/c072d2_free_ou25_zero_label.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3
      - name: Run zero-label source audit
        run: python football-data/research/audit_c072d2_free_ou25_zero_label.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c072d2-free-ou25-zero-label-audit
          path: football-data/research/c072d2_free_ou25_zero_label_audit.json
          if-no-files-found: error
