name: C072-D2 free OU2.5 zero-label source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce frozen zero-label source audit
        run: python football-data/research/audit_c072d2_free_ou25_zero_label.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c072d2-free-ou25-zero-label-audit
          path: football-data/research/c072d2_free_ou25_zero_label_audit.json
          if-no-files-found: error
