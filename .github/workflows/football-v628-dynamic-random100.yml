name: football-v628-dynamic-random100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_dynamic_strength_1x2_random100_v6280.py'
      - 'football-data/validation/validate_direct_dynamic_1x2_random100_v6281.py'
      - '.github/workflows/football-v628-dynamic-random100.yml'

permissions:
  contents: read

jobs:
  random100:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile
        run: |
          python -m py_compile \
            football-data/validation/validate_dynamic_strength_1x2_random100_v6280.py \
            football-data/validation/validate_direct_dynamic_1x2_random100_v6281.py

      - name: Run V6.28.1 direct dynamic 1X2 random100
        run: |
          python football-data/validation/validate_direct_dynamic_1x2_random100_v6281.py

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6281-direct-dynamic-1x2-random100-receipt
          path: football-data/manifests/v6_direct_dynamic_1x2_random100_v6281_status.json
          if-no-files-found: error
