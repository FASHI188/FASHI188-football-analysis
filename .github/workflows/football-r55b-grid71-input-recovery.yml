name: Football R55B Grid71 Input Recovery

on:
  push:
    branches:
      - research/r55-ou-matched300-20260814
    paths:
      - football-data/research/r55b_grid71_input_recovery_20260816.py
      - .github/workflows/football-r55b-grid71-input-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-grid71-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Download already-verified frozen release archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output archive.1.1.zip \
            'https://github.com/FASHI188/FASHI188-football-analysis/releases/download/football-data-archive-v1/archive.1.1.zip'

      - name: Recover pre-target and frozen-target grid71 inputs
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import builtins,collections,runpy,sys; builtins.Counter=collections.Counter; sys.argv=["r55b_grid71_input_recovery_20260816.py","--archive","archive.1.1.zip"]; runpy.run_path("football-data/research/r55b_grid71_input_recovery_20260816.py",run_name="__main__")'

      - name: Upload recovery audit and rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r55b-grid71-input-recovery
          path: football-data/research/r55b_grid71_input_recovery_20260816.json
          if-no-files-found: error
          retention-days: 30
