name: Football V6.25.2 Match Feature Coverage Audit

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_match_feature_coverage_audit_v6252.py"
      - ".github/workflows/football-v6252-match-feature-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit
        run: python -m py_compile football-data/validation/v6_match_feature_coverage_audit_v6252.py
      - name: Run coverage audit
        run: python football-data/validation/v6_match_feature_coverage_audit_v6252.py
      - name: Persist audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_match_feature_coverage_audit_v6252_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.2 match-feature coverage"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Read-only research audit; no CURRENT/runtime mutation.
