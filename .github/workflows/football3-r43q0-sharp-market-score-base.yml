name: football3 R43Q0 sharp market score base

on:
  push:
    branches:
      - football3/r43q0-sharp-market-score-base
    paths:
      - football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py
      - .github/workflows/football3-r43q0-sharp-market-score-base.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43q0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43q0-sharp-market-score-base
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify frozen market ledger exists
        run: |
          test -f football-data/forward/v6_market_first_events_v651.json
          python -m py_compile football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py
      - name: Run R43Q0 sharp market score base
        run: python football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py run
      - name: Verify R43Q0 contract
        run: python football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py verify
      - name: Persist R43Q0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43q0_sharp_market_score_base/results/summary_r43q0_sharp_market_score_base.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43Q0 sharp market score base'
            git fetch origin football3/r43q0-sharp-market-score-base
            git rebase origin/football3/r43q0-sharp-market-score-base
            git push origin HEAD:football3/r43q0-sharp-market-score-base
          fi
      - name: Upload R43Q0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43q0-sharp-market-score-base
          path: football-data/experiments/r43q0_sharp_market_score_base/results/summary_r43q0_sharp_market_score_base.json
          if-no-files-found: error
          retention-days: 90
