name: football3 top1 R30 ranked draw budget

on:
  push:
    branches:
      - football3/top1-r30-ranked-draw-budget
    paths:
      - football-data/experiments/top1_r30_ranked_draw_budget/run_experiment_r30.py
      - .github/workflows/football3-top1-r30-ranked-draw-budget.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r30:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r30-ranked-draw-budget
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R30 ranked draw budget
        run: python football-data/experiments/top1_r30_ranked_draw_budget/run_experiment_r30.py run
      - name: Verify R30 contract
        run: python football-data/experiments/top1_r30_ranked_draw_budget/run_experiment_r30.py verify
      - name: Persist R30 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r30_ranked_draw_budget/results/summary_r30.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R30 ranked draw budget'
            git push origin HEAD:football3/top1-r30-ranked-draw-budget
          fi
      - name: Upload R30 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r30-ranked-draw-budget
          path: football-data/experiments/top1_r30_ranked_draw_budget/results/summary_r30.json
          if-no-files-found: error
          retention-days: 90
