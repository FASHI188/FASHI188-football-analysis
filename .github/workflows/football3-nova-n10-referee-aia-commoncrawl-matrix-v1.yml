name: football3-nova-n10-referee-aia-commoncrawl-matrix

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_aia_commoncrawl_matrix_registry_v1.json'
      - 'governance/football3/nova_n10_referee_aia_commoncrawl_matrix_v1.py'
      - 'governance/football3/test_nova_n10_referee_aia_commoncrawl_matrix_v1.py'
      - '.github/workflows/football3-nova-n10-referee-aia-commoncrawl-matrix-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-nova-n10-referee-aia-commoncrawl-matrix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-aia-commoncrawl-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile             governance/football3/nova_n10_referee_aia_commoncrawl_matrix_v1.py             governance/football3/test_nova_n10_referee_aia_commoncrawl_matrix_v1.py
          PYTHONPATH=governance/football3             python governance/football3/test_nova_n10_referee_aia_commoncrawl_matrix_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 5 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Audit Common Crawl 38-round metadata matrix
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_aia_commoncrawl_matrix_v1.py             --registry governance/football3/nova_n10_referee_aia_commoncrawl_matrix_registry_v1.json             --ledger governance/football3/nova_n10_referee_aia_canonical_round_ledger_v1.json             --out _run --timeout 20 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/aia_commoncrawl_matrix_receipt.json'))
          assert r['classification'] in {'POSITIVE_SIGNAL_SOURCE_FEASIBILITY','STOP_DATA_COVERAGE'}
          assert r['round_n']==38
          assert r['query_error_n']==len(r['query_errors'])
          m=json.load(open('_run/aia_commoncrawl_matrix.json'))
          assert len(m['query_reports'])==r['query_n']
          assert r['warc_content_fetched'] is False
          assert r['article_body_read'] is False
          assert r['appointment_names_parsed'] is False
          assert r['match_payload_read'] is False and r['standings_payload_read'] is False and r['player_stats_payload_read'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          assert r['referee_oof_allowed'] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-aia-commoncrawl-matrix-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
