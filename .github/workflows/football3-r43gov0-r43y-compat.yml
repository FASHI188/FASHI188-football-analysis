name: football3 R43GOV0 M5F R43Y compatibility

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/r43y_draw_calibration.py
      - football-data/tests/test_r43y_draw_calibration_compat.py
      - .github/workflows/football3-r43gov0-r43y-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r43y-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json|football-data/forward/r43y0_draw_calibration_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Fetch exact pinned R43Y source and frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r43y/source /tmp/r43y/frozen
          curl -L --fail --retry 3 -o /tmp/r43y/source/run_r43y0.py https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/7043d6f7788f05b958e2ab7ec743b982a54ec5aa/football-data/experiments/r43y0_draw_calibration_forward/run_r43y0.py
          test "$(git hash-object /tmp/r43y/source/run_r43y0.py)" = "a342138bef97eb4acb0bcba015dea251a3280fdf"
          curl -L --fail --retry 3 -o /tmp/r43y/frozen/ledger.json https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/7043d6f7788f05b958e2ab7ec743b982a54ec5aa/football-data/forward/r43y0_draw_calibration_forward_events.json
          test "$(git hash-object /tmp/r43y/frozen/ledger.json)" = "faafc8baf094452096cab62df56bf2fb92af10b8"
          curl -L --fail --retry 3 -o /tmp/r43y/frozen/lock_summary.json https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/7043d6f7788f05b958e2ab7ec743b982a54ec5aa/football-data/experiments/r43y0_draw_calibration_forward/results/summary_r43y0_draw_calibration_lock.json
          test "$(git hash-object /tmp/r43y/frozen/lock_summary.json)" = "ef74412c8af8228c2b15f8d212447b3e7fc740da"
      - name: Compile M5F Y component
        run: |
          python -m py_compile football-data/components/r43y_draw_calibration.py
          python -m py_compile football-data/tests/test_r43y_draw_calibration_compat.py
      - name: Run exact source and frozen-ledger compatibility tests
        env:
          R43Y_SOURCE_FILE: /tmp/r43y/source/run_r43y0.py
          R43Y_LEDGER_FILE: /tmp/r43y/frozen/ledger.json
          R43Y_LOCK_SUMMARY_FILE: /tmp/r43y/frozen/lock_summary.json
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43y_draw_calibration_compat.py' -v 2>&1 | tee /tmp/r43y_compat_test.log
      - name: Upload M5F diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5f-r43y-diagnostic
          path: /tmp/r43y_compat_test.log
          if-no-files-found: error
          retention-days: 30
      - name: Write M5F Y gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5f_r43y_compat_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5f-r43y-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "source_component": "R43Y0 draw calibration forward",
            "source_commit": "7043d6f7788f05b958e2ab7ec743b982a54ec5aa",
            "source_blob_sha": "a342138bef97eb4acb0bcba015dea251a3280fdf",
            "frozen_prediction_ledger_blob_sha": "faafc8baf094452096cab62df56bf2fb92af10b8",
            "frozen_lock_summary_blob_sha": "ef74412c8af8228c2b15f8d212447b3e7fc740da",
            "native_input": "1x2_probabilities",
            "native_output": "1x2_probabilities",
            "fixed_draw_logit_intercept": 0.1322913820792354,
            "development_source_n": 53,
            "home_away_remaining_mass_ratio_preserved": true,
            "parameter_search": false,
            "threshold_search": false,
            "draw_override": false,
            "exact_source_compatibility": true,
            "frozen_prediction_reproduction_count": 41,
            "frozen_prediction_reproduction_exact": true,
            "frozen_natural_draw_top1_count": 3,
            "score_matrix_lifting_migrated": false,
            "score_matrix_lifting_reason": "native_R43Y_source_only_defines_1x2_transform_do_not_invent_matrix_rule",
            "enabled_by_default": false,
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M5G_reconcile_registry_and_native_matrix_contracts"
          }
          JSON
      - name: Upload M5F Y gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5f-r43y-compat-gate
          path: football-data/governance/r43gov0/results/m5f_r43y_compat_gate.json
          if-no-files-found: error
          retention-days: 90
