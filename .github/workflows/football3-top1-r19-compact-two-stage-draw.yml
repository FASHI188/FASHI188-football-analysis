name: football3 top1 R19 compact two-stage draw

on:
  push:
    branches:
      - football3/top1-r19-compact-two-stage-draw
    paths:
      - football-data/experiments/top1_r19_compact_two_stage_draw/run_experiment_r19.py
      - .github/workflows/football3-top1-r19-compact-two-stage-draw.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r19:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r19-compact-two-stage-draw
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R19 compact two-stage draw
        run: python football-data/experiments/top1_r19_compact_two_stage_draw/run_experiment_r19.py run
      - name: Verify R19 contract
        run: python football-data/experiments/top1_r19_compact_two_stage_draw/run_experiment_r19.py verify
      - name: Persist R19 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r19_compact_two_stage_draw/results/summary_r19.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R19 compact two-stage draw'
            git push origin HEAD:football3/top1-r19-compact-two-stage-draw
          fi
      - name: Upload R19 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r19-compact-two-stage-draw
          path: football-data/experiments/top1_r19_compact_two_stage_draw/results/summary_r19.json
          if-no-files-found: error
          retention-days: 90
