name: Football C070-F Fresh4000 Zero-Label Download

on:
  push:
    branches:
      - research/c070f-fresh4000-download-20260818
    paths:
      - .github/workflows/football-c070f-fresh4000-download.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c070f-fresh4000-download
  cancel-in-progress: false

jobs:
  download-and-freeze-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7

      - name: Download pinned public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c070f_source"
          curl -L --fail --retry 5 --retry-delay 3 \
            -o "$RUNNER_TEMP/c070f_source/database.sqlite" \
            "https://huggingface.co/datasets/julien-c/kaggle-hugomathien-soccer/resolve/80e14cc7aa624cc266470f43a626652dabdfb80a/database.sqlite?download=true"
          test -s "$RUNNER_TEMP/c070f_source/database.sqlite"
          echo "4df8569777d59fdd690754b1cc8ca1f7989baf65f2eaddd0f1368285f11139a9  $RUNNER_TEMP/c070f_source/database.sqlite" | sha256sum -c -
          ls -lh "$RUNNER_TEMP/c070f_source/database.sqlite"

      - name: Freeze exactly 4000 identities without event/result parsing
        shell: bash
        env:
          C070F_DB: ${{ runner.temp }}/c070f_source/database.sqlite
          C070F_OUT: ${{ runner.temp }}/c070f_fresh4000_out
        run: |
          set -euo pipefail
          python3 football-data/research/c070f_fresh4000_identity_freeze.py | tee "$RUNNER_TEMP/c070f_fresh4000_stdout.json"

      - name: Enforce zero-label research boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'c070f_fresh4000_out' / 'c070f_fresh4000_identity_summary.json'
          s = json.loads(p.read_text())
          assert s['status'] == 'PASS_ZERO_LABEL_FRESH4000_IDENTITY_FREEZE'
          assert s['selected_matches'] == 4000
          assert s['event_payload_contents_parsed'] is False
          assert s['target_score_columns_selected'] == []
          assert s['model_fits'] == 0 and s['scoring_runs'] == 0 and s['tuning_runs'] == 0
          assert s['formal_weight'] == 0
          assert s['block_counts']['calibration'] >= 1000
          assert s['block_counts']['confirmation'] >= 1400
          print(json.dumps(s, indent=2))
          PY

      - name: Upload pinned raw source and frozen 4000 identity package
        uses: actions/upload-artifact@v4
        with:
          name: c070f-fresh4000-source-and-identity
          retention-days: 30
          compression-level: 0
          path: |
            ${{ runner.temp }}/c070f_source/database.sqlite
            ${{ runner.temp }}/c070f_fresh4000_out/c070f_league_season_event_presence.csv
            ${{ runner.temp }}/c070f_fresh4000_out/c070f_4000_identity_manifest.csv
            ${{ runner.temp }}/c070f_fresh4000_out/c070f_fresh4000_identity_summary.json
            ${{ runner.temp }}/c070f_fresh4000_stdout.json
