name: football3 Top1 R16 global Elo strength

on:
  push:
    branches:
      - football3/top1-r16-global-elo-strength
    paths:
      - football-data/experiments/top1_r16_global_elo/run_experiment_r16.py
      - .github/workflows/football3-top1-r16-global-elo-strength.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r16-global-strength:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R16 branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r16-global-elo-strength
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run strict-prior global strength challenger
        run: python football-data/experiments/top1_r16_global_elo/run_experiment_r16.py run
      - name: Verify R16 contract
        run: python football-data/experiments/top1_r16_global_elo/run_experiment_r16.py verify
      - name: Persist R16 manifest and result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r16_global_elo/data/source_manifest_r16.json football-data/experiments/top1_r16_global_elo/results/summary_r16.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r16] persist global strength result'
            git push origin HEAD:football3/top1-r16-global-elo-strength
          fi
      - name: Upload immutable R16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r16-global-elo-strength
          path: |
            football-data/experiments/top1_r16_global_elo/data/source_manifest_r16.json
            football-data/experiments/top1_r16_global_elo/results/summary_r16.json
          if-no-files-found: error
          retention-days: 30
