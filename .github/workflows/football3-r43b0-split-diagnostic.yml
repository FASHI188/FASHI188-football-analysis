name: football3 R43B0 split diagnostic
on:
  push:
    branches: [football3/r43b0-probabilistic-lineup-baseline]
    paths:
      - football-data/research/diagnostics/r43b0_split_diag.py
      - .github/workflows/football3-r43b0-split-diagnostic.yml
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/r43b0-probabilistic-lineup-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - run: python football-data/research/diagnostics/r43b0_split_diag.py
