name: Football Beat The Bookie R39E Sequence Coverage

on:
  pull_request:
    branches:
      - research/betfair-kaggle-timestamp-coverage-r39a
    paths:
      - '.github/workflows/football-beat-the-bookie-r39e-sequence-coverage.yml'

permissions:
  contents: read

jobs:
  full-prematch-sequence-coverage-no-labels:
    if: ${{ github.run_attempt == 1 && github.run_number == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify frozen registration and code identities
        run: |
          set -euo pipefail
          python -m json.tool football-data/research/beat_the_bookie_r39/sequence_coverage_registration_r39e.json >/dev/null
          python -m py_compile football-data/research/beat_the_bookie_r39/audit_full_sequence_coverage_r39e.py
          test "$(git hash-object football-data/research/beat_the_bookie_r39/sequence_coverage_registration_r39e.json)" = "ff708e8faa13e95d7a5f9a7a522301f0315f4b6a"
          test "$(git hash-object football-data/research/beat_the_bookie_r39/audit_full_sequence_coverage_r39e.py)" = "aafcd22f4fdb2335e964fc3f86cf2c709ec3709f"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/beat_the_bookie_r39/sequence_coverage_registration_r39e.json').read_text())
          assert r['status']=='PRE_REGISTERED_NO_LABEL_SEQUENCE_COVERAGE_AUDIT'
          assert r['time_semantics']['kickoff_T0_suffix_71_allowed'] is False
          assert r['hourly_consensus_audit']['primary_sequence_threshold']==3
          assert r['population_binding']['identity_lock_allowed_in_this_stage'] is False
          assert r['hard_limits']['result_labels_allowed'] is False
          assert r['hard_limits']['model_fit_allowed'] is False
          assert r['hard_limits']['formal_weight']==0
          print('PASS_R39E_SEQUENCE_COVERAGE_CONTRACT')
          PY

      - name: Download bound odds-series files only
        run: |
          set -euo pipefail
          rm -rf r39e-source r39e-sanitized r39e-output r39e-source.zip
          mkdir -p r39e-source r39e-sanitized r39e-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset' \
            -o r39e-source.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('r39e-source.zip')
          wanted={'odds_series.csv.gz','odds_series_b.csv.gz'}
          assert wanted <= set(z.namelist())
          for name in wanted: z.extract(name,'r39e-source')
          PY
          echo 'cc6e0ad9b818d9d8a06e857d65d8dd8f32d8d7a21d9b9b49a5c27d4e9eb1c722  r39e-source/odds_series.csv.gz' | sha256sum -c -
          echo '3d24e8c8021559b03afa17194a3748929e48b27311fea5da045e7f0040c957c5  r39e-source/odds_series_b.csv.gz' | sha256sum -c -

      - name: Physically remove score columns before Python
        run: |
          set -euo pipefail
          for base in odds_series odds_series_b; do
            gzip -dc "r39e-source/${base}.csv.gz" \
              | cut -d',' -f1-3,6- \
              | gzip -c > "r39e-sanitized/${base}_no_scores.csv.gz"
          done
          rm -rf r39e-source r39e-source.zip
          python - <<'PY'
          import csv,gzip
          for base in ('odds_series','odds_series_b'):
              p=f'r39e-sanitized/{base}_no_scores.csv.gz'
              with gzip.open(p,'rt',encoding='utf-8-sig',newline='') as f:
                  h=next(csv.reader(f))
              assert h[:3]==['match_id','match_date','match_time']
              assert 'score_home' not in h and 'score_away' not in h
              assert len(h)==32*72*3+3
          print('PASS_R39E_SCORE_COLUMNS_REMOVED')
          PY

      - name: Audit full pre-match sequence coverage without labels or identities
        run: |
          set -euo pipefail
          python football-data/research/beat_the_bookie_r39/audit_full_sequence_coverage_r39e.py \
            --registration football-data/research/beat_the_bookie_r39/sequence_coverage_registration_r39e.json \
            --source-dir r39e-sanitized \
            --out-dir r39e-output

      - name: Verify hard gates and zero-label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39e-output/sequence_coverage_status_r39e.json').read_text())
          assert r['status']=='PASS_R39E_FULL_PREMATCH_SEQUENCE_COVERAGE_NO_LABELS'
          assert r['population']['training_eligible_rows']==49511
          assert r['population']['holdout_eligible_rows']==10734
          assert r['sequence_definition']['kickoff_T0_suffix_71_accessed'] is False
          assert r['sequence_definition']['hours_per_sequence']==71
          assert r['gates']['passed'] is True
          n=r['no_label_audit']
          assert n['score_values_accessed']==0 and n['result_values_accessed']==0
          assert n['prediction_metrics_computed']==0 and n['model_fits']==0
          assert n['thresholds_selected']==0 and n['identity_locks_created']==0
          assert n['holdout_individual_identities_output']==0
          assert n['T0_suffix_71_odds_values_accessed']==0
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY

      - name: Delete sanitized source before artifact upload
        if: always()
        run: rm -rf r39e-sanitized

      - name: Upload R39E zero-label aggregate coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-beat-the-bookie-r39e-sequence-coverage-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: r39e-output/
          if-no-files-found: error
          retention-days: 30
