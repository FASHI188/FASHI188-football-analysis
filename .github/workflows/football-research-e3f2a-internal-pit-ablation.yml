name: Football Research E3f-2A Internal PIT Ablation

on:
  pull_request:
    branches:
      - research/e3f1b-external-pit-source-contract
    types: [opened, synchronize, reopened]
    paths:
      - football-data/research/e3f2a_internal_pit_ablation.py
      - football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md
      - .github/workflows/football-research-e3f2a-internal-pit-ablation.yml

permissions:
  contents: read

concurrency:
  group: football-research-e3f2a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-ablation:
    if: github.event.pull_request.head.ref == 'research/e3f2a-internal-pit-ablation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 5842f1a42c75a56f9a34fadda7ae85016c4e674c
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      OUT_DIR: football-data/artifacts/research/e3f2a_internal_pit_ablation
    steps:
      - name: Checkout exact research branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact research HEAD
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.1

      - name: Syntax check
        run: |
          python -m py_compile football-data/research/e3f2a_internal_pit_ablation.py

      - name: Verify ablation contract
        run: |
          set -euo pipefail
          grep -q 'formal_weight=0' football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md
          grep -q 'No class weights' football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md
          grep -q 'post-hoc threshold' football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md
          grep -q 'frozen 6,251' football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md
          grep -q 'B100' football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md

      - name: Run research-only E3f-2A ablation
        run: |
          python football-data/research/e3f2a_internal_pit_ablation.py \
            --output-dir "$OUT_DIR" --print-summary

      - name: Verify report and identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["OUT_DIR"])/"e3f2a_internal_pit_ablation.json"
          r=json.loads(p.read_text())
          assert r["repository_head"] == os.environ["EXPECTED_HEAD"]
          assert r["sample_count"] == 6251
          assert r["b100_count"] == 100
          assert r["internal_feature_count"] == 93
          assert len(r["models"]) == 14
          assert r["external_records_ingested"] == 0
          assert r["class_weight"] is None
          assert r["posthoc_threshold"] is None
          assert r["formal_weight"] == 0
          assert r["verdict"]["formal_assets_changed"] == 0
          PY

      - name: Upload E3f-2A report
        uses: actions/upload-artifact@v4
        with:
          name: football-e3f2a-internal-pit-ablation-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ env.OUT_DIR }}/e3f2a_internal_pit_ablation.json
            ${{ env.OUT_DIR }}/e3f2a_internal_pit_ablation.md
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected formal assets were not changed
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$files"
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$files" | grep -Fxq 'football-data/research/e3f2a_internal_pit_ablation.py'
          printf '%s\n' "$files" | grep -Fxq 'football-data/research/contracts/e3f2a_internal_pit_ablation_contract.md'
          printf '%s\n' "$files" | grep -Fxq '.github/workflows/football-research-e3f2a-internal-pit-ablation.yml'
