name: Football C076-C Four-Hazard Tail Development
on:
  push:
    branches: [research/c076c-fourhazard-tail-development-20260819]
    paths: [football-data/research/c076c_fourhazard_tail_contract.json, football-data/research/evaluate_c076c_fourhazard_tail.py, .github/workflows/football-c076c-fourhazard-tail.yml]
  pull_request:
    paths: [football-data/research/c076c_fourhazard_tail_contract.json, football-data/research/evaluate_c076c_fourhazard_tail.py, .github/workflows/football-c076c-fourhazard-tail.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-c076c-fourhazard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  fourhazard-development:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Install frozen runtime
        run: python -m pip install numpy==2.2.6 pandas==2.3.2 pyarrow==21.0.0 scikit-learn==1.7.1
      - name: Download pinned broad source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c076c_source"
          REV=f0cbe86bee3f28cc4b803f735a5287968741c471
          BASE="https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/$REV"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c076c_source/fixtures.parquet" "$BASE/fixtures.parquet?download=true"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c076c_source/match_stats.parquet" "$BASE/match_stats.parquet?download=true"
          echo "7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7  $RUNNER_TEMP/c076c_source/fixtures.parquet" | sha256sum -c -
          echo "2fb85b14b4428e1a36efe6d651de4ca8f7a6169ecfa3edb9cda49cb5e58d97e9  $RUNNER_TEMP/c076c_source/match_stats.parquet" | sha256sum -c -
      - name: Run frozen development
        run: |
          mkdir -p "$RUNNER_TEMP/c076c_out"
          PYTHONPATH=football-data/research python football-data/research/evaluate_c076c_fourhazard_tail.py --fixtures "$RUNNER_TEMP/c076c_source/fixtures.parquet" --stats "$RUNNER_TEMP/c076c_source/match_stats.parquet" --out-dir "$RUNNER_TEMP/c076c_out"
      - name: Enforce boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c076c_out'/'summary.json').read_text())
          assert s['schema_version']=='C076C_FOURHAZARD_TAIL_DEVELOPMENT_V1'
          assert s['status'] in {'STOP_COVERAGE','DEVELOPMENT_GATE_PASS_POSTVIEW','FAIL_PARK'}
          b=s['boundaries']; assert b['C075C_consumed_tail_labels_used'] is False and b['C075E_consumed_tail_labels_used'] is False and b['C071_post2024_goal_labels_opened'] is False and b['C071_reserve_52180_opened'] is False and b['C070F_confirmation1597_opened'] is False and b['A05_opened'] is False and b['protected_opened'] is False and b['T_ge_7_D_given_T_model_fit'] is False and b['unified_matrix_generated'] is False and b['formal_weight']==0
          if s['status']!='STOP_COVERAGE':
            assert s['pooled']['max_tail_residual']<=1e-8 and s['pooled']['max_prob_residual']<=1e-10
          if s['status']=='DEVELOPMENT_GATE_PASS_POSTVIEW': assert s['confirmation_ready_parameter'] is not None
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c076c-fourhazard-tail-development
          retention-days: 30
          path: |
            ${{ runner.temp }}/c076c_out/summary.json
            ${{ runner.temp }}/c076c_out/row_metrics.csv
            ${{ runner.temp }}/c076c_out/confirmation_ready_parameter.json
            football-data/research/c076c_fourhazard_tail_contract.json
          if-no-files-found: warn
