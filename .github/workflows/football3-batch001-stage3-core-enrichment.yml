name: football3 Batch-001 stage3 core enrichment

on:
  push:
    branches:
      - football3/batch001-stage3-prior-structured-enrichment
    paths:
      - football-data/experiments/batch001_stage3_prior_structured_enrichment/build_stage3_core.py
      - .github/workflows/football3-batch001-stage3-core-enrichment.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage3-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch001-stage3-prior-structured-enrichment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Build strict-prior core feature pack
        run: python football-data/experiments/batch001_stage3_prior_structured_enrichment/build_stage3_core.py run
      - name: Verify Stage3 core contract
        run: python football-data/experiments/batch001_stage3_prior_structured_enrichment/build_stage3_core.py verify
      - name: Persist locked Stage3 core pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch001_stage3_prior_structured_enrichment/results/batch001_stage3_core_features_locked.json
          git commit -m '[locked] football3 Batch-001 Stage3 core prior features' || true
          git push origin HEAD:football3/batch001-stage3-prior-structured-enrichment
      - name: Upload Stage3 core artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch001-stage3-core-prior-features
          path: football-data/experiments/batch001_stage3_prior_structured_enrichment/results/batch001_stage3_core_features_locked.json
          if-no-files-found: error
          retention-days: 90
