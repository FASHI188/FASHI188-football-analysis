name: football3 single test Nottingham Leeds R9b K1 K3

on:
  push:
    branches:
      - football3/single-test-nottingham-leeds-20260825-k3
    paths:
      - football-data/experiments/single_tests/nottingham_leeds_20260825.py
      - football-data/experiments/single_tests/nottingham_leeds_driver.py
      - .github/workflows/football3-single-test-nottingham-leeds-k3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  single-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/single-test-nottingham-leeds-20260825-k3
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run strict-prior Nottingham Leeds calculation
        id: calc
        run: python football-data/experiments/single_tests/nottingham_leeds_driver.py
      - name: Persist compact diagnostic on failure
        if: failure() && steps.calc.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/single_tests/results/nottingham_leeds_error.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes'
          else
            git commit -m '[diagnostic] Nottingham Leeds one-shot failure'
            git push origin HEAD:football3/single-test-nottingham-leeds-20260825-k3
          fi
      - name: Verify one-shot contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/experiments/single_tests/results/nottingham_leeds_20260825.json')
          x=json.loads(p.read_text())
          assert x['status']=='COMPLETE'
          g=x['governance']
          assert g['strict_prior_snapshot'] and not g['odds_used'] and not g['market_prices_used']
          assert not g['manual_probability_adjustment'] and not g['post_match_target_data_used']
          assert not g['target_result_read_by_model'] and not g['same_day_leakage']
          assert not g['friendlies_used']
          assert len(x['pre_match_updates'])==1
          assert x['pre_match_updates'][0]['row']['date']=='2026-08-22'
          assert x['pre_match_updates'][0]['row']['home_goals']==0 and x['pre_match_updates'][0]['row']['away_goals']==1
          for stage in ('snapshot_only','pre_match_updated'):
              for model in ('K1','K3'):
                  q=x[stage]['prediction'][model]
                  assert abs(q['home']+q['draw']+q['away']-1.0)<1e-8
          print('NOTTINGHAM_LEEDS_CONTRACT_PASS')
          PY
      - name: Persist result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/single_tests/results/nottingham_leeds_20260825.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated single-test] Nottingham Leeds 20260825'
            git push origin HEAD:football3/single-test-nottingham-leeds-20260825-k3
          fi
      - name: Upload result artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: football3-single-test-nottingham-leeds-k3
          path: football-data/experiments/single_tests/results/nottingham_leeds_20260825.json
          if-no-files-found: error
          retention-days: 90
