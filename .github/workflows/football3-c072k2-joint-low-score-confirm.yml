name: football3-c072k2-joint-low-score-confirm

on:
  pull_request:
    branches:
      - football3/c072j2-fresh-joint-source-20260819
    paths:
      - 'football-data/research/C072K2_JOINT_LOW_SCORE_CONFIRM_CONTRACT.md'
      - 'football-data/research/evaluate_c072k2_joint_low_score_confirm.py'
      - '.github/workflows/football3-c072k2-joint-low-score-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==2.1.3 scikit-learn==1.7.1
      - name: Frozen integration contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072K2_JOINT_LOW_SCORE_CONFIRM_CONTRACT.md').read_text()
          assert 'Exactly four variants are reported' in c
          assert '28 exact-score cells with T<=6 plus one TAIL_7PLUS bucket' in c
          assert '5,000 reps' in c and '72027' in c and '72028' in c
          assert 'C073-C077 quarantined' in c
          print('K2 frozen integration guard: PASS')
          PY
      - name: Run fresh joint confirmation
        run: python football-data/research/evaluate_c072k2_joint_low_score_confirm.py
      - name: Boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072k2_summary.json').read_text())
          b=x['boundary']
          assert b['component_coefficients_refit_on_J2'] is False
          assert b['replacement_rows'] == 0
          assert b['TAIL_7PLUS_remains_aggregate'] is True
          assert b['T_ge_7_exact_scores_resolved'] is False
          assert b['C073_C077_quarantined'] is True
          assert b['C070F_confirmation1597_opened'] is False
          assert b['formal_weight'] == 0
          print('K2 boundary guard: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072k2-joint-low-score-confirmation
          path: football-data/research/c072k2_summary.json
