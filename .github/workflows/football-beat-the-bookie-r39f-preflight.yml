name: Football Beat The Bookie R39F Preflight

on:
  push:
    branches: [research/beat-the-bookie-r39f-provider-leadlag]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39f-preflight.yml'
      - 'football-data/research/beat_the_bookie_r39/preregistration_r39f.json'
      - 'football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py'
  pull_request:
    branches: [research/beat-the-bookie-r39e-full72h-trajectory]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39f-preflight.yml'
      - 'football-data/research/beat_the_bookie_r39/preregistration_r39f.json'
      - 'football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py'

permissions:
  contents: read

jobs:
  zero-label-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3'
      - name: Validate exact preregistration and code
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py
          python -m json.tool football-data/research/beat_the_bookie_r39/preregistration_r39f.json >/dev/null
          python football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/beat_the_bookie_r39/preregistration_r39f.json').read_text())
          assert p['identity_binding']['r39f_blind_sha256']=='1ccb7e5dd7a3328ee9cc47e6886dc3a8348203dac2ed414c0da59b4185031ae5'
          assert p['identity_binding']['blind_labels_previously_accessed']==0
          assert p['time_horizon']['T0_index_71_excluded_from_all_R39F_features'] is True
          assert p['micro_features']['count']==26 and len(p['micro_features']['features'])==26
          assert p['micro_model']['l2_candidates']==[1.0,10.0,100.0]
          assert p['lead_lag']['labels_used'] is False
          assert p['hard_limits']['formal_weight']==0
          print('PASS_R39F_ZERO_LABEL_PREFLIGHT')
          PY
      - name: Zero-access receipt
        run: |
          mkdir -p r39f-preflight
          python - <<'PY'
          import json,datetime
          out={'status':'PASS_R39F_ZERO_LABEL_PREFLIGHT','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'real_data_opened':0,'score_values_accessed':0,'result_values_accessed':0,'model_fit_on_real_data':0,'blind_fixed100_labels_accessed':0,'threshold_selection_on_real_data':0}
          open('r39f-preflight/preflight_receipt_r39f.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football-beat-the-bookie-r39f-preflight-${{ github.sha }}-${{ github.run_id }}
          path: r39f-preflight/
          if-no-files-found: error
          retention-days: 30
