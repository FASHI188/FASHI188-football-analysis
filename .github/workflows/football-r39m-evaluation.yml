name: Football R39M Evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39m-evaluation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39m-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recency-lineup-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Enforce unique first-attempt R39M evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/football-r39m-evaluation.yml/runs?branch=research%2Flineup-attack-recency-r39m&per_page=20" -o /tmp/runs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          cur=int(os.environ['GITHUB_RUN_ID']);runs=json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs',[])
          prior=[int(r['id']) for r in runs if int(r['id'])!=cur and r.get('head_branch')=='research/lineup-attack-recency-r39m']
          assert not prior,f'prior R39M evaluation run(s) exist: {prior}'
          print('PASS_R39M_UNIQUE_FIRST_EVALUATION_RUN')
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify exact frozen scientific blobs and successful zero-label preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json)" = "01046fb1412f434c973b6369169cc6059ff6f9d2"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json)" = "b87d52023815469592128c43d2dab0406765d54a"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json)" = "de2c4ba33d0ed2a0f85c76b96f63a875daf59615"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py)" = "a465ea1d3ff59db25f166d248f31f89ab62fdeb4"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluate_recency_r39m.py)" = "300d896d66ce554c62ec3acf96d208ae9f0c4531"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31353876403" -o /tmp/pre-run.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31353876403/artifacts" -o /tmp/pre-art.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/pre-run.json').read_text());a=json.loads(Path('/tmp/pre-art.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success' and r['head_sha']=='9b36ec0fbaee41c4f07b6c184a2257d851eccdb0'
          arts=a.get('artifacts',[]);assert len(arts)==1
          x=arts[0];assert x['id']==9049926892
          assert x.get('digest')=='sha256:8a01ae9c2e32aab6387a3499e869ddfc70bef32c03e8ef1931e3e99c35a4f33b'
          print('PASS_R39M_AUTHORIZED_BY_ZERO_LABEL_PREFLIGHT_31353876403')
          PY
          python football-data/research/lineup_attack_recency_r39m/evaluate_recency_r39m.py --self-test
      - name: Download and sanitize Transfermarkt feature sources
        run: |
          set -euo pipefail
          rm -rf r39m-tm r39m-market r39m-raw r39m-output player_scores.zip /tmp/r39m-*.csv
          mkdir -p r39m-tm r39m-market r39m-raw r39m-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39m-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39m-lineups.csv
          unzip -p player_scores.zip appearances.csv > /tmp/r39m-appearances.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39m-games.csv','r39m-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39m-lineups.csv','r39m-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39m-appearances.csv','r39m-tm/appearances_prior.csv',['appearance_id','game_id','player_id','player_club_id','date','competition_id','goals','assists','minutes_played'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing:raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39m-games.csv /tmp/r39m-lineups.csv /tmp/r39m-appearances.csv player_scores.zip
      - name: Download Football-Data raw labels and isolate market-only identity
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="r39m-raw/${season}_${div}.csv";out="r39m-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing:raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
            done
          done
      - name: Execute frozen R39M rolling-policy-blind sequence
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_recency_r39m/evaluate_recency_r39m.py \
            --prereg football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json \
            --contract football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json \
            --source-registration football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json \
            --r39l-source-registration football-data/research/lineup_attack_r39l/source_registration_r39l.json \
            --r39i-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39m-market --raw-dir r39m-raw \
            --games r39m-tm/games_identity.csv --lineups r39m-tm/lineups_identity.csv \
            --appearances r39m-tm/appearances_prior.csv --out-dir r39m-output
      - name: Verify terminal label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39m-output/r39m_result.json').read_text());ff=json.loads(Path('r39m-output/feature_freeze_receipt_r39m.json').read_text())
          assert ff['feature_freeze_completed'] is True and ff['target_labels_accessed_before_feature_freeze']==0
          assert ff['preholdout_rows']==8161 and ff['holdout_pool_rows']==1273 and ff['fixed100_rows']==100
          assert ff['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert ff['dynamic_feature_sha256_by_half_life']=={
            '90':'38c1ecc0bf47c4762747a8216e0ceaae3f432c712b50462acd75a74c84ef9d7a',
            '180':'c76a1da7e689d61c766f32295d6886477040eef0563b9b6fec1fa7bd92a93e4f',
            '365':'86d63860eb590d9a0fdddbfb3c6b5a48f84c7bd222bfd533098391585c40772f'}
          allowed={'STOP_R39M_BEFORE_POLICY_AND_HOLDOUT_RECENCY_NO_ROLLING_INCREMENT','STOP_R39M_BEFORE_HOLDOUT_RECENCY_NO_POLICY_INCREMENT','PASS_R39M_RECENCY_LINEUP_ATTACK_FIXED100_EXPLORATORY_ONLY','NO_R39M_RECENCY_LINEUP_ATTACK_INCREMENT_FIXED100'}
          assert r['status'] in allowed
          fr=json.loads(Path('r39m-output/final_freeze_receipt_r39m.json').read_text())
          if r['status'].startswith('STOP_R39M_BEFORE_'):
              assert r['holdout_labels_accessed']==0 and fr['final_freeze_completed'] is False and fr['holdout_labels_accessed_before_freeze']==0
          else:
              assert r['holdout_labels_accessed']==100 and fr['final_freeze_completed'] is True and fr['holdout_labels_accessed_before_freeze']==0
          print(json.dumps({'status':r['status'],'selected_dynamic':r.get('selected_dynamic'),'rolling_development':r.get('rolling_development'),'policy':r.get('policy'),'holdout':r.get('holdout'),'holdout_labels_accessed':r['holdout_labels_accessed']},indent=2))
          PY
      - name: Delete downloaded source inputs before artifact
        run: rm -rf r39m-tm r39m-market r39m-raw
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39m-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39m-output/
          if-no-files-found: error
          retention-days: 30
