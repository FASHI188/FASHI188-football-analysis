name: football3 Top1 20k opponent latent plus veto r1

on:
  push:
    branches:
      - football3/top1-20k-opponent-veto-r1
    paths:
      - football-data/experiments/top1_20k_r1/**
      - .github/workflows/football3-top1-20k-opponent-veto-r1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football3-top1-20k-opponent-veto-r1
  cancel-in-progress: false

jobs:
  freeze-and-evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[generated top1-20k-r1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen gate runtime
        run: python -m pip install scikit-learn==1.7.1

      - name: Download source and freeze exactly 20000 matches
        run: python football-data/experiments/top1_20k_r1/run_experiment.py freeze

      - name: Run strict chronological A B C experiment
        run: python football-data/experiments/top1_20k_r1/run_experiment.py run

      - name: Verify no-market and untouched-test contract
        run: python football-data/experiments/top1_20k_r1/run_experiment.py verify

      - name: Persist frozen 20k dataset and result to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_20k_r1/data \
                  football-data/experiments/top1_20k_r1/results
          if git diff --cached --quiet; then
            echo 'No generated changes to persist.'
          else
            git commit -m '[generated top1-20k-r1] freeze 20000 matches and persist A-B-C result'
            git push origin HEAD:football3/top1-20k-opponent-veto-r1
          fi

      - name: Upload immutable experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-20k-opponent-veto-r1
          retention-days: 30
          if-no-files-found: error
          path: |
            football-data/experiments/top1_20k_r1/contract.json
            football-data/experiments/top1_20k_r1/data/source_manifest.json
            football-data/experiments/top1_20k_r1/data/matches_20000_part*.csv
            football-data/experiments/top1_20k_r1/results/summary.json
