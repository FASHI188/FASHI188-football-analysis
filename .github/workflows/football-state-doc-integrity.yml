name: Football Continuity Router Integrity

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'CHATGPT_PROJECT_START_HERE.txt'
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - 'EXECUTION_LITE.md'
      - 'HISTORY_ONLY_INDEX.md'
      - 'governance/validate_project_continuity.py'
      - '.github/workflows/football-state-doc-integrity.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CHATGPT_PROJECT_START_HERE.txt'
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - 'EXECUTION_LITE.md'
      - 'HISTORY_ONLY_INDEX.md'
      - 'governance/validate_project_continuity.py'
      - '.github/workflows/football-state-doc-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-continuity-router-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity-router-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Validate single live state router and retired mirrors
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_project_continuity.py --self-test
          python governance/validate_project_continuity.py --root .
          sha256sum AGENTS.md CHATGPT_PROJECT_START_HERE.txt ACTIVE_CHECKPOINT.md PROJECT_CURRENT.md LAST_HANDOFF.md EXECUTION_LITE.md HISTORY_ONLY_INDEX.md
