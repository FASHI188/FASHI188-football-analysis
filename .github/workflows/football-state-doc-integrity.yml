name: Football Governance Topology Integrity

on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'EXECUTION_LITE.md'
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - 'CHATGPT_PROJECT_START_HERE.txt'
      - 'HISTORY_ONLY_INDEX.md'
      - 'CORRECTION_PLAN.md'
      - 'DRAW_AUDIT_HANDOFF.md'
      - 'REPOSITORY_GOVERNANCE_PLAN.md'
      - 'governance/validate_project_continuity.py'
      - '.github/workflows/football-state-doc-integrity.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'EXECUTION_LITE.md'
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - 'CHATGPT_PROJECT_START_HERE.txt'
      - 'HISTORY_ONLY_INDEX.md'
      - 'CORRECTION_PLAN.md'
      - 'DRAW_AUDIT_HANDOFF.md'
      - 'REPOSITORY_GOVERNANCE_PLAN.md'
      - 'governance/validate_project_continuity.py'
      - '.github/workflows/football-state-doc-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-governance-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-topology-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Validate simplified governance topology
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_project_continuity.py --self-test
          python governance/validate_project_continuity.py --root .
          sha256sum AGENTS.md EXECUTION_LITE.md governance/validate_project_continuity.py
