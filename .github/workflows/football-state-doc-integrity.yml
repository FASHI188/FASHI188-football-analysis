name: Football Governance Topology Integrity

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'EXECUTION_LITE.md'
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - 'CHATGPT_PROJECT_START_HERE.txt'
      - 'HISTORY_ONLY_INDEX.md'
      - 'CORRECTION_PLAN.md'
      - 'DRAW_AUDIT_HANDOFF.md'
      - 'REPOSITORY_GOVERNANCE_PLAN.md'
      - 'football-data/config/v6_current_research_scope_v6494.json'
      - 'football-data/config/v6_engineering_research_profile_v6494.json'
      - 'football-data/runtime/**'
      - 'football-data/validation/activate_*.py'
      - 'football-data/validation/audit_current_research_scope_v6494.py'
      - 'football-data/validation/v6_sync_42_runtime_truth_v6495.py'
      - 'football-data/validation/v6_sync_f06_challenge_truth_v6505.py'
      - 'football-data/validation/validate_engineering_research_profile_v6494.py'
      - 'football-data/engine/validate_platform.py'
      - 'football-data/docs/ASSET_LIFECYCLE.md'
      - '.github/workflows/football-v6494-active-research-scope-guard.yml'
      - '.github/workflows/football-v6494-current-state-audit.yml'
      - '.github/workflows/football-v6494-engineering-profile-guard.yml'
      - 'governance/validate_project_continuity.py'
      - '.github/workflows/football-state-doc-integrity.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'EXECUTION_LITE.md'
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - 'CHATGPT_PROJECT_START_HERE.txt'
      - 'HISTORY_ONLY_INDEX.md'
      - 'CORRECTION_PLAN.md'
      - 'DRAW_AUDIT_HANDOFF.md'
      - 'REPOSITORY_GOVERNANCE_PLAN.md'
      - 'football-data/config/v6_current_research_scope_v6494.json'
      - 'football-data/config/v6_engineering_research_profile_v6494.json'
      - 'football-data/runtime/**'
      - 'football-data/validation/activate_*.py'
      - 'football-data/validation/audit_current_research_scope_v6494.py'
      - 'football-data/validation/v6_sync_42_runtime_truth_v6495.py'
      - 'football-data/validation/v6_sync_f06_challenge_truth_v6505.py'
      - 'football-data/validation/validate_engineering_research_profile_v6494.py'
      - 'football-data/engine/validate_platform.py'
      - 'football-data/docs/ASSET_LIFECYCLE.md'
      - '.github/workflows/football-v6494-active-research-scope-guard.yml'
      - '.github/workflows/football-v6494-current-state-audit.yml'
      - '.github/workflows/football-v6494-engineering-profile-guard.yml'
      - 'governance/validate_project_continuity.py'
      - '.github/workflows/football-state-doc-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-governance-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-topology-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate single control plane and engineering boundaries
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_project_continuity.py --self-test
          python governance/validate_project_continuity.py --root .
          python -m py_compile \
            governance/validate_project_continuity.py \
            football-data/validation/validate_engineering_research_profile_v6494.py \
            football-data/runtime/activation/activate_mls_d_conditional_runtime_v470.py \
            football-data/runtime/activation/activate_selective_direction_runtime_v501.py \
            football-data/engine/validate_platform.py
          python football-data/validation/validate_engineering_research_profile_v6494.py --print-summary
          sha256sum AGENTS.md EXECUTION_LITE.md governance/validate_project_continuity.py football-data/docs/ASSET_LIFECYCLE.md
