name: Football State Document Integrity

on:
  push:
    branches:
      - main
    paths:
      - 'ACTIVE_CHECKPOINT.md'
      - 'PROJECT_CURRENT.md'
      - 'LAST_HANDOFF.md'
      - '.github/workflows/football-state-doc-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-state-doc-integrity-main
  cancel-in-progress: true

jobs:
  state-doc-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7

      - name: Compute checkpoint/state document SHA-256 and compare state versions
        shell: bash
        run: |
          set -euo pipefail
          test -s ACTIVE_CHECKPOINT.md
          test -s PROJECT_CURRENT.md
          test -s LAST_HANDOFF.md
          sha256sum ACTIVE_CHECKPOINT.md PROJECT_CURRENT.md LAST_HANDOFF.md
          project_version="$(awk -F': ' '$1 == "- state_version" {print $2; exit}' PROJECT_CURRENT.md)"
          handoff_version="$(awk -F': ' '$1 == "- state_version" {print $2; exit}' LAST_HANDOFF.md)"
          test -n "$project_version"
          test -n "$handoff_version"
          test "$project_version" = "$handoff_version"
          case "$project_version" in
            *[!0-9]*) echo "Invalid state_version: $project_version"; exit 1 ;;
          esac
          echo "FOOTBALL_STATE_DOC_INTEGRITY_PASS state_version=$project_version"
