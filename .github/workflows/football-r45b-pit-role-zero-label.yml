name: Football R45B PIT Role Zero-Label Gate

on:
  push:
    branches:
      - research/r45b-pit-role-availability-zero-label
    paths:
      - 'football-data/research/r45b_pit_role_availability_gate.py'
      - 'football-data/research/r45b_pit_role_deep_inventory.py'
      - 'football-data/research/r45b_forward_capture_contract.json'
      - 'football-data/research/r45b_forward_capture_validator.py'
      - 'football-data/research/r45b_matchup_interaction_preregistration.json'
      - 'football-data/research/r45b_task_state_extractor_preregistration.json'
      - 'football-data/research/r45b_task_state_extractor.py'
      - 'football-data/research/r45b_process_proxy_extractor_preregistration.json'
      - 'football-data/research/r45b_process_proxy_extractor.py'
      - 'football-data/research/r45b_oos_governance_guard.py'
      - 'football-data/processed/ESP_LaLiga/2025-26.csv'
      - 'football-data/evidence/r45b_forward_capture/**'
      - '.github/workflows/football-r45b-pit-role-zero-label.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r45b-pit-role-zero-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-label-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Self-test fixed task-state extractor
        shell: bash
        run: |
          python football-data/research/r45b_task_state_extractor.py --self-test

      - name: Self-test preregistered process-proxy extractor
        shell: bash
        run: |
          python football-data/research/r45b_process_proxy_extractor.py --self-test

      - name: Generate Alaves zero-label SHOTS_SOT_PROXY process evidence
        shell: bash
        run: |
          python football-data/research/r45b_process_proxy_extractor.py \
            --csv football-data/processed/ESP_LaLiga/2025-26.csv \
            --prereg football-data/research/r45b_process_proxy_extractor_preregistration.json \
            --output football-data/evidence/r45b_forward_capture/ESP_LaLiga/alaves_getafe_20260815/process_capability_deportivo_alaves_shots_sot_proxy_generated.json \
            --competition-id ESP_LaLiga \
            --fixture-key ESP_LaLiga__Deportivo_Alaves__Getafe_CF__20260815T173000Z \
            --home-team 'Deportivo Alaves' \
            --away-team 'Getafe CF' \
            --team 'Deportivo Alaves' \
            --kickoff-at-utc 2026-08-15T17:30:00Z \
            --freeze-at-utc 2026-08-13T08:56:29Z \
            --evidence-id r45b_esp_laliga_ala_get_20260815_process_alaves_shots_sot_20260813t085629z

      - name: Generate Getafe zero-label SHOTS_SOT_PROXY process evidence
        shell: bash
        run: |
          python football-data/research/r45b_process_proxy_extractor.py \
            --csv football-data/processed/ESP_LaLiga/2025-26.csv \
            --prereg football-data/research/r45b_process_proxy_extractor_preregistration.json \
            --output football-data/evidence/r45b_forward_capture/ESP_LaLiga/alaves_getafe_20260815/process_capability_getafe_cf_shots_sot_proxy_generated.json \
            --competition-id ESP_LaLiga \
            --fixture-key ESP_LaLiga__Deportivo_Alaves__Getafe_CF__20260815T173000Z \
            --home-team 'Deportivo Alaves' \
            --away-team 'Getafe CF' \
            --team 'Getafe CF' \
            --kickoff-at-utc 2026-08-15T17:30:00Z \
            --freeze-at-utc 2026-08-13T08:56:29Z \
            --evidence-id r45b_esp_laliga_ala_get_20260815_process_getafe_shots_sot_20260813t085629z

      - name: Run first zero-label PIT input audit
        shell: bash
        run: |
          set +e
          python football-data/research/r45b_pit_role_availability_gate.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Unexpected first audit execution failure: rc=$rc"
            exit "$rc"
          fi
          echo "first_audit_exit_code=$rc"
          cat football-data/research/r45b_pit_role_availability_gate_status.json
          if [ "$rc" -eq 2 ]; then
            echo "First R45B gate correctly fail-closed: PIT inputs are incomplete."
          fi

      - name: Run deep zero-label PIT inventory
        shell: bash
        run: |
          set +e
          python football-data/research/r45b_pit_role_deep_inventory.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Unexpected deep inventory execution failure: rc=$rc"
            exit "$rc"
          fi
          echo "deep_inventory_exit_code=$rc"
          cat football-data/research/r45b_pit_role_deep_inventory_status.json
          if [ "$rc" -eq 2 ]; then
            echo "R45B deep inventory correctly fail-closed: one or more PIT axes remain incomplete."
          fi

      - name: Validate forward-capture readiness
        shell: bash
        run: |
          set +e
          python football-data/research/r45b_forward_capture_validator.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Unexpected forward-capture validator failure: rc=$rc"
            exit "$rc"
          fi
          echo "forward_capture_exit_code=$rc"
          cat football-data/research/r45b_forward_capture_validation_status.json
          if [ "$rc" -eq 2 ]; then
            echo "R45B forward capture is not ready; no OOS authorization is granted."
          fi

      - name: Upload process diagnostics before assertion
        uses: actions/upload-artifact@v4
        with:
          name: r45b-process-diagnostics
          path: |
            football-data/evidence/r45b_forward_capture/ESP_LaLiga/alaves_getafe_20260815/process_capability_deportivo_alaves_shots_sot_proxy_generated.json
            football-data/evidence/r45b_forward_capture/ESP_LaLiga/alaves_getafe_20260815/process_capability_getafe_cf_shots_sot_proxy_generated.json
            football-data/research/r45b_forward_capture_validation_status.json
          if-no-files-found: error
          retention-days: 7

      - name: Assert full zero-label data readiness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('football-data/research/r45b_forward_capture_validation_status.json')
          status = json.loads(path.read_text(encoding='utf-8'))
          valid_by_type = status.get('valid_by_type') or {}
          axis = status.get('axis_ready') or {}
          blockers = status.get('blocking_axes') or []

          expected = {
              'task_utility': 2,
              'availability_and_replacement': 1,
              'process_capability': 2,
              'expected_xi_roles': 2,
          }
          for kind, minimum in expected.items():
              actual = int(valid_by_type.get(kind) or 0)
              print(f'{kind}_valid={actual}')
              if actual < minimum:
                  raise SystemExit(f'{kind} valid records below minimum {minimum}')

          required_axes = (
              'expected_xi_roles',
              'availability_and_replacement',
              'process_capability',
              'task_utility',
              'matchup_interaction_gate',
          )
          for key in required_axes:
              ready = bool(axis.get(key))
              print(f'axis_{key}={ready}')
              if not ready:
                  raise SystemExit(f'axis not ready: {key}')

          role_pair_count = int(status.get('fixtures_with_both_team_role_xi_same_freeze') or 0)
          record_count = int(status.get('record_count') or 0)
          valid_count = int(status.get('valid_record_count') or 0)
          invalid_count = int(status.get('invalid_record_count') or 0)
          final_status = str(status.get('status') or '')
          print(f'role_pair_count={role_pair_count}')
          print(f'record_count={record_count}')
          print(f'valid_record_count={valid_count}')
          print(f'invalid_record_count={invalid_count}')
          print(f'blocking_axes={blockers}')
          print(f'final_status={final_status}')

          if role_pair_count < 1:
              raise SystemExit('missing same-freeze both-team role XI pair')
          if record_count < 7 or valid_count != record_count or invalid_count != 0:
              raise SystemExit('forward-capture record validity invariant failed')
          if blockers:
              raise SystemExit(f'blocking axes remain: {blockers}')
          if final_status != 'READY_FOR_SEPARATE_OOS_PREREGISTRATION':
              raise SystemExit(f'unexpected final readiness status: {final_status}')

          zero_fields = (
              'target_match_labels_read',
              'training_runs',
              'scoring_runs',
              'tuning_runs',
              'provider_requests',
              'paid_provider_requests',
              'formal_weight',
          )
          for field in zero_fields:
              value = int(status.get(field) or 0)
              print(f'{field}={value}')
              if value != 0:
                  raise SystemExit(f'zero-label invariant violated: {field}={value}')
          if status.get('automatic_oos_authorization') is not False:
              raise SystemExit('automatic OOS authorization must remain false')
          if status.get('independent_oos_authorized') is not False:
              raise SystemExit('independent OOS authorization must remain false at data-readiness gate')
          PY

      - name: Enforce no automatic OOS authorization
        if: always()
        shell: bash
        run: |
          python football-data/research/r45b_oos_governance_guard.py
