name: football3 R43AB1 referee prior-style screen

on:
  push:
    branches:
      - football3/r43ab1-referee-prior-style-screen
    paths:
      - football-data/experiments/r43ab1_referee_prior_style_screen/run_r43ab1.py
      - .github/workflows/football3-r43ab1-referee-prior-style-screen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43ab1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43ab1-referee-prior-style-screen
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43AB1 referee strict-prior development screen
        run: python football-data/experiments/r43ab1_referee_prior_style_screen/run_r43ab1.py run
      - name: Verify R43AB1 contract
        run: python football-data/experiments/r43ab1_referee_prior_style_screen/run_r43ab1.py verify
      - name: Persist R43AB1 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43ab1_referee_prior_style_screen/results/summary_r43ab1.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43AB1 referee prior-style evidence'
            git fetch origin football3/r43ab1-referee-prior-style-screen
            git rebase origin/football3/r43ab1-referee-prior-style-screen
            git push origin HEAD:football3/r43ab1-referee-prior-style-screen
          fi
      - name: Upload R43AB1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43ab1-referee-prior-style-screen
          path: football-data/experiments/r43ab1_referee_prior_style_screen/results/summary_r43ab1.json
          if-no-files-found: error
          retention-days: 90
