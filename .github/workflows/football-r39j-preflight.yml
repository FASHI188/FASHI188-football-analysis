name: Football R39J Preflight

on:
  pull_request:
    paths:
      - 'football-data/research/market_regime_r39j/preregistration_r39j.json'
      - 'football-data/research/market_regime_r39j/evaluate_market_draw_regime_r39j.py'
      - '.github/workflows/football-r39j-preflight.yml'

permissions:
  contents: read

jobs:
  zero-label-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Validate frozen R39J contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/market_regime_r39j/evaluate_market_draw_regime_r39j.py
          python football-data/research/market_regime_r39j/evaluate_market_draw_regime_r39j.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/market_regime_r39j/preregistration_r39j.json').read_text())
          assert p['source_binding']['complete_preholdout_rows']==10704
          assert p['source_binding']['complete_holdout_rows']==1747
          assert p['source_binding']['fixed100_identity_sha256']=='6ebc9f200942a49e5456774236f950bd73f49e5a0591e29f2e5195c8ccb0d050'
          assert p['source_binding']['fixed100_labels_accessed_before_r39j_evaluation']==0
          assert p['regime_definition']['total_regimes']==27
          assert p['market_transform']['event_level_market_wrong_classifier'] is False
          assert p['correction']['pseudo_count']==300.0
          assert p['label_order_contract']['fixed100_labels_before_final_freeze']==0
          assert p['hard_limits']['formal_weight']==0
          print('PASS_R39J_FROZEN_ZERO_LABEL_PREFLIGHT')
          PY
      - name: Persist preflight receipt
        run: |
          mkdir -p r39j-preflight
          printf '%s\n' '{"status":"PASS_R39J_FROZEN_ZERO_LABEL_PREFLIGHT","real_data_access":0,"labels_accessed":0,"model_fit":0,"fixed100_labels_accessed":0}' > r39j-preflight/preflight_r39j.json
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39j-preflight-${{ github.sha }}-${{ github.run_id }}
          path: r39j-preflight/
          if-no-files-found: error
          retention-days: 30
