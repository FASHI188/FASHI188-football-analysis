name: Football V5.1 Split Draw Mechanisms Screen10 R30

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "football-data/config/v511_split_draw_mechanisms_screen10_r30.json"
      - "football-data/validation/build_v511_split_draw_mechanisms_screen10_r30.py"
      - "football-data/validation/build_v511_historical_blind_context_screen10_r29.py"
      - "football-data/validation/evaluate_v511_market_draw_screen10_r22.py"
      - "football-data/processed/**/*.csv"
      - ".github/workflows/football-v511-split-draw-mechanisms-screen10-r30.yml"

permissions:
  contents: read

concurrency:
  group: football-v511-split-draw-mechanisms-screen10-r30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-split-blind-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3
      - name: Compile dependencies and R30
        run: |
          python -m py_compile football-data/validation/evaluate_v511_market_draw_screen10_r22.py
          python -m py_compile football-data/validation/build_v511_historical_blind_context_screen10_r29.py
          python -m py_compile football-data/validation/build_v511_split_draw_mechanisms_screen10_r30.py
      - name: Run R30 self-test
        run: python football-data/validation/build_v511_split_draw_mechanisms_screen10_r30.py --self-test
      - name: Build R30A and R30B fixed blind packets
        run: python football-data/validation/build_v511_split_draw_mechanisms_screen10_r30.py
      - name: Validate packet isolation and contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status_path=Path('football-data/manifests/v511_split_draw_mechanisms_screen10_r30_status.json')
          status=json.loads(status_path.read_text(encoding='utf-8'))
          assert status['status']=='PASS_R30A_R30B_NEW_BLIND_PACKETS_BUILT'
          assert status['formal_weight']==0
          assert status['r29_excluded_identity_count']==20
          assert {row['lane'] for row in status['lanes']}=={'R30A','R30B'}
          for row in status['lanes']:
              assert row['pairs']==10
              public_path=Path('football-data') / Path(row['public_json'])
              public=json.loads(public_path.read_text(encoding='utf-8'))
              assert len(public['pairs'])==10
          for path in Path('football-data/manifests/r30_public').glob('*.json'):
              obj=json.loads(path.read_text(encoding='utf-8'))
              assert len(obj['pairs'])==10
              for pair in obj['pairs']:
                  assert len(pair['candidates'])==2
                  for candidate in pair['candidates']:
                      text=json.dumps(candidate,ensure_ascii=False).casefold()
                      for token in ['final_score','home_goals_90','away_goals_90','side_a_role','side_b_role']:
                          assert token not in text
          assert len(list(Path('football-data/manifests/r30_hidden').glob('*.json')))==2
          assert status['ruling']['public_and_hidden_artifacts_separated'] is True
          assert status['ruling']['resampling_allowed'] is False
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
      - name: Upload public blind packets only
        uses: actions/upload-artifact@v4
        with:
          name: v511-r30-public-blind-packets
          path: |
            football-data/manifests/v511_split_draw_mechanisms_screen10_r30_status.json
            football-data/manifests/r30_public/*.json
            football-data/manifests/r30_public/*.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload sealed labels separately
        uses: actions/upload-artifact@v4
        with:
          name: v511-r30-sealed-hidden-labels
          path: football-data/manifests/r30_hidden/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no repository persistence
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git diff --cached --name-only)"
