name: football3 R43GOV0 M5B R43T compatibility

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/r43t_dynamic_bivariate_state.py
      - football-data/tests/test_r43t_state_compat.py
      - .github/workflows/football3-r43gov0-r43t-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r43t-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Fetch exact pinned R43T source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/run_r43t0.py https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/70c283a501b1f28e91a40dbb4e2c1173bf73b78e/football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py
          test "$(git hash-object /tmp/run_r43t0.py)" = "f6db4f0e6c0f544c058b15a7279731f55c5f6570"
      - name: Compile M5B T component
        run: |
          python -m py_compile football-data/components/r43t_dynamic_bivariate_state.py
          python -m py_compile football-data/tests/test_r43t_state_compat.py
      - name: Run exact source compatibility tests
        env:
          R43T_SOURCE_FILE: /tmp/run_r43t0.py
        run: python -m unittest discover -s football-data/tests -p 'test_r43t_state_compat.py' -v
      - name: Write M5B T gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5b_r43t_compat_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5b-r43t-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "source_component": "R43T0 dynamic bivariate residual state",
            "source_blob_sha": "f6db4f0e6c0f544c058b15a7279731f55c5f6570",
            "source_commit": "70c283a501b1f28e91a40dbb4e2c1173bf73b78e",
            "bitwise_core_source_compatibility": true,
            "same_kickoff_group_lifecycle_preserved": true,
            "implementation_migrated": true,
            "enabled_by_default": false,
            "historical_architecture_gate_passed": false,
            "historical_full_volume_53pct_met": false,
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M5C_migrate_R43Q_market_matrix_core_disabled_then_R43R_if_distinct"
          }
          JSON
      - name: Upload M5B T gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5b-r43t-compat-gate
          path: football-data/governance/r43gov0/results/m5b_r43t_compat_gate.json
          if-no-files-found: error
          retention-days: 90
