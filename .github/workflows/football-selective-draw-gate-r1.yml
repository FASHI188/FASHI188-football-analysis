name: Football Selective Draw Gate R1

on:
  push:
    branches:
      - research/gold1000-r1-data-audit
    paths:
      - '.github/workflows/football-selective-draw-gate-r1.yml'
      - 'football-data/research/gold1000_r1/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/football-selective-draw-gate-r1.yml'
      - 'football-data/research/gold1000_r1/**'

permissions:
  contents: read

concurrency:
  group: selective-draw-gate-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confirm-selective-draw-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact branch HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install frozen research dependency
        run: python -m pip install --disable-pip-version-check --no-input scikit-learn==1.8.0
      - name: Compile research scripts
        run: |
          python -m py_compile football-data/research/gold1000_r1/build_gold1000_sample_r1.py
          python -m py_compile football-data/research/gold1000_r1/build_gold1000_p0_r1.py
          python -m py_compile football-data/research/gold1000_r1/audit_football_data_main_r1.py
          python -m py_compile football-data/research/gold1000_r1/audit_football_data_extra_r1.py
          python -m py_compile football-data/research/gold1000_r1/select_gold1000_confirm_r1.py
          python -m py_compile football-data/research/gold1000_r1/build_gold1000_standard_master_r1.py
          python -m py_compile football-data/research/gold1000_r1/run_selective_draw_gate_r1.py
      - name: Rebuild frozen GOLD1000 development and reserve samples
        run: |
          rm -rf gate-work selective-gate-evidence
          mkdir -p gate-work selective-gate-evidence
          python football-data/research/gold1000_r1/build_gold1000_sample_r1.py \
            --repo-root . \
            --spec football-data/research/gold1000_r1/gold1000_spec_r1.json \
            --out gate-work/base
      - name: Build development P0 features
        run: |
          python football-data/research/gold1000_r1/build_gold1000_p0_r1.py \
            --repo-root . \
            --sample gate-work/base/GOLD1000_R1_random_manifest.csv \
            --out gate-work/dev-p0
      - name: Build frozen latest-season confirmation sample
        run: |
          python football-data/research/gold1000_r1/select_gold1000_confirm_r1.py \
            --reserve gate-work/base/GOLD1000_R1_reserve_manifest.csv \
            --spec football-data/research/gold1000_r1/gold1000_spec_r1.json \
            --out gate-work/confirm
      - name: Build confirmation P0 features
        run: |
          python football-data/research/gold1000_r1/build_gold1000_p0_r1.py \
            --repo-root . \
            --sample gate-work/confirm/GOLD1000_R1_confirm_latest_manifest.csv \
            --out gate-work/confirm-p0
      - name: Download and match static market data for development
        run: |
          python football-data/research/gold1000_r1/audit_football_data_main_r1.py \
            --sample gate-work/base/GOLD1000_R1_random_manifest.csv \
            --out gate-work/dev-main
          python football-data/research/gold1000_r1/audit_football_data_extra_r1.py \
            --sample gate-work/base/GOLD1000_R1_random_manifest.csv \
            --out gate-work/dev-extra
      - name: Download and match static market data for confirmation
        run: |
          python football-data/research/gold1000_r1/audit_football_data_main_r1.py \
            --sample gate-work/confirm/GOLD1000_R1_confirm_latest_manifest.csv \
            --out gate-work/confirm-main
          python football-data/research/gold1000_r1/audit_football_data_extra_r1.py \
            --sample gate-work/confirm/GOLD1000_R1_confirm_latest_manifest.csv \
            --out gate-work/confirm-extra
      - name: Standardize development and confirmation masters
        run: |
          python football-data/research/gold1000_r1/build_gold1000_standard_master_r1.py \
            --p0 gate-work/dev-p0/GOLD1000_R1_random_manifest_with_p0.csv \
            --main-market gate-work/dev-main/GOLD1000_R1_football_data_main_enriched.csv \
            --extra-market gate-work/dev-extra/GOLD1000_R1_football_data_extra_enriched.csv \
            --out gate-work/dev-master
          python football-data/research/gold1000_r1/build_gold1000_standard_master_r1.py \
            --p0 gate-work/confirm-p0/GOLD1000_R1_random_manifest_with_p0.csv \
            --main-market gate-work/confirm-main/GOLD1000_R1_football_data_main_enriched.csv \
            --extra-market gate-work/confirm-extra/GOLD1000_R1_football_data_extra_enriched.csv \
            --out gate-work/confirm-master
      - name: Run preregistered gate and untouched confirmation
        run: |
          python football-data/research/gold1000_r1/run_selective_draw_gate_r1.py \
            --development gate-work/dev-master/GOLD1000_R1_standard_master.csv \
            --confirmation gate-work/confirm-master/GOLD1000_R1_standard_master.csv \
            --prereg football-data/research/gold1000_r1/selective_draw_gate_prereg_r1.json \
            --out selective-gate-evidence
      - name: Assemble evidence and exact manifest
        env:
          CHECKED_OUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cp football-data/research/gold1000_r1/selective_draw_gate_prereg_r1.json selective-gate-evidence/
          cp gate-work/confirm/GOLD1000_R1_confirm_latest_manifest.csv selective-gate-evidence/
          cp gate-work/confirm/GOLD1000_R1_confirm_latest_receipt.json selective-gate-evidence/
          cp gate-work/dev-master/GOLD1000_R1_standard_master_receipt.json selective-gate-evidence/development_master_receipt.json
          cp gate-work/confirm-master/GOLD1000_R1_standard_master_receipt.json selective-gate-evidence/confirmation_master_receipt.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('selective-gate-evidence')
          def hf(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={
            'schema_version':'SELECTIVE-DRAW-GATE-WORKFLOW-R1',
            'status':'PASS_RESEARCH_ONLY',
            'event_name':os.environ['EVENT_NAME'],
            'checked_out_branch_head_sha':os.environ['CHECKED_OUT_SHA'],
            'workflow_event_sha':os.environ['WORKFLOW_EVENT_SHA'],
            'run_id':os.environ['RUN_ID'],
            'provider_api_calls':0,
            'static_http_downloads_only':True,
            'formal_weight':0,
            'formal_asset_writes':0,
            'confirmation_label_selection':0
          }
          (out/'workflow_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest={'schema_version':'SELECTIVE-DRAW-GATE-ARTIFACT-MANIFEST-R1','files':{}}
          for p in sorted(out.iterdir()):
            if p.is_file() and p.name!='manifest.json':manifest['files'][p.name]={'sha256':hf(p),'bytes':p.stat().st_size}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY
      - name: Upload selective draw gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: selective-draw-gate-r1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: selective-gate-evidence/
          if-no-files-found: error
          retention-days: 30
