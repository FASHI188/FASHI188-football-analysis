# PAUSED_FOR_REPOSITORY_GOVERNANCE
name: Governance Forward Legacy Capability Adjudication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-forward-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/governance/verify_consolidated_capabilities.py --target forward.yml --require-archived
