name: football-r55b-input-integrity-audit

on:
  push:
    branches:
      - research/r55-ou-matched300-20260814
    paths:
      - 'football-data/research/r55b_inputs/**'
      - 'football-data/research/r55b_input_integrity_audit_20260814.py'
      - '.github/workflows/football-r55b-input-integrity-audit.yml'

permissions:
  contents: read

jobs:
  input-integrity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit persisted R55B input chunks
        run: python football-data/research/r55b_input_integrity_audit_20260814.py
      - uses: actions/upload-artifact@v4
        with:
          name: r55b-input-integrity-audit
          path: |
            football-data/research/r55b_input_integrity_audit_20260814.json
            football-data/research/r55b_inputs/*.b64part
          if-no-files-found: error
          retention-days: 14
