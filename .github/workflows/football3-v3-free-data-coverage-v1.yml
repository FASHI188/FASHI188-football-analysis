name: Football3 V3 Free Data Coverage V1
on:
  push:
    branches: [football3/v3-free-data-coverage-v1]
    paths:
      - '.github/workflows/football3-v3-free-data-coverage-v1.yml'
      - 'governance/football3/v3_free_data_coverage_contract_v1.json'
      - 'governance/football3/v3_free_source_registry_v1.json'
      - 'governance/football3/v3_git_snapshot_adapter_v1.py'
      - 'governance/football3/v3_free_data_coverage_probe_v1.py'
      - 'governance/football3/validate_v3_free_data_coverage_v1.py'
      - 'governance/football3/test_v3_free_data_coverage_v1.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: football3-v3-free-data-coverage-${{ github.sha }}
  cancel-in-progress: false
env:
  EXACT_BASE: '02343081400618660958cdb4d960d014046aa41b'
  FORMAL_HEAD: 'e12f5d1193be5d81f60301cf34ab2140e11712a9'
  CURRENT_SHA: '71d54a6fd227ad2bbdddea9d0e42b88cea2022efef8faf26c7483cd99d5b8731'
jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact base and seven-file scope
        id: identity
        env:
          CANDIDATE_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXACT_BASE" HEAD)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/formal-gpt-runner-integration-v1 | cut -f1)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          python - <<'PY'
          import subprocess
          expected={
            '.github/workflows/football3-v3-free-data-coverage-v1.yml',
            'governance/football3/v3_free_data_coverage_contract_v1.json',
            'governance/football3/v3_free_source_registry_v1.json',
            'governance/football3/v3_git_snapshot_adapter_v1.py',
            'governance/football3/v3_free_data_coverage_probe_v1.py',
            'governance/football3/validate_v3_free_data_coverage_v1.py',
            'governance/football3/test_v3_free_data_coverage_v1.py',
          }
          got=set(subprocess.check_output(['git','diff','--name-only','02343081400618660958cdb4d960d014046aa41b...HEAD'],text=True).splitlines())
          assert got==expected,(sorted(got),sorted(expected))
          PY
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Prove previous foundation and formal chain immutable
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          exact='02343081400618660958cdb4d960d014046aa41b'
          blobs={
          '.github/workflows/football3-v3-pit-data-foundation-audit-v1.yml':'88906b67509ebabd285ded31646406520119045a',
          'governance/football3/v3_pit_data_foundation_contract_v1.json':'778487281a4cf90b7a739d77c63da6c2259b0241',
          'governance/football3/v3_pit_data_source_inventory_v1.json':'3d053ef8c0a0c0c47173d599e140a1e075f51f0a',
          'governance/football3/v3_pit_data_provider_interface_v1.py':'8b9bba7b548e61de7f3b79d96881ebe9c3a41b51',
          'governance/football3/validate_v3_pit_data_foundation_v1.py':'bf42df4ede376465f13ae36f52c850aa25a608df',
          'governance/football3/test_validate_v3_pit_data_foundation_v1.py':'c92b9225bd96212af7260b6321e0feb33457ff5c',
          'governance/football3/nextgen_current_v2_foundation_contract_v1.json':'897684e9655f7123dd2c338470a64c4837819639',
          'governance/football3/nextgen_current_v2_foundation_v1.py':'eebb4aa9747794923a91e26cd36ab6e63b744f6f',
          'governance/football3/test_nextgen_current_v2_foundation_v1.py':'e063f42f3820beb23d6b6def1c66543246676567',
          'football-data/new_engine_v1/formal_fusion_v2.py':'a5ed26d5ffd4a2875cb9c658cfaa28665a8b7871',
          'football-data/new_engine_v1/test_formal_fusion_v2.py':'61b25cd403fa1d9efa0dfcbc1643e0f17621944e',
          'football-data/config/formal_model_pointer_historical_xg_fusion_v2.json':'f07743f9c873d415fad9612f3225f64c64b10542',
          'football-data/formal_gpt_gateway_v1/entry.py':'b41b0ede2db99c116b90270a32cd04dd240eb655',
          }
          for p,e in blobs.items():
              base=subprocess.check_output(['git','rev-parse',f'{exact}:{p}'],text=True).strip()
              work=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert base==e,(p,base,e)
              assert work==e,(p,work,e)
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static validator and free-data permanent tests
        env:
          PYTHONPATH: governance/football3
        run: |
          set -euo pipefail
          python -m py_compile \
            governance/football3/v3_git_snapshot_adapter_v1.py \
            governance/football3/v3_free_data_coverage_probe_v1.py \
            governance/football3/validate_v3_free_data_coverage_v1.py \
            governance/football3/test_v3_free_data_coverage_v1.py
          python governance/football3/validate_v3_free_data_coverage_v1.py --repo-root . | tee /tmp/validator.txt
          python governance/football3/v3_free_data_coverage_probe_v1.py | tee /tmp/probe.txt
          python governance/football3/test_v3_free_data_coverage_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 40 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
          grep -q '"data_ready_candidates": \[\]' /tmp/probe.txt
          grep -q '"new_target_labels_read": false' /tmp/probe.txt
      - name: Previous PIT foundation regression
        env:
          PYTHONPATH: governance/football3
        run: |
          set -euo pipefail
          python governance/football3/validate_v3_pit_data_foundation_v1.py --repo-root . | tee /tmp/pit-validator.txt
          python governance/football3/test_validate_v3_pit_data_foundation_v1.py 2>&1 | tee /tmp/pit-tests.txt
          grep -q 'Ran 31 tests' /tmp/pit-tests.txt
          grep -q '^OK$' /tmp/pit-tests.txt
      - name: NextGen foundation regression
        env:
          PYTHONPATH: 'football-data:governance/football3'
        run: |
          set -euo pipefail
          python governance/football3/test_nextgen_current_v2_foundation_v1.py 2>&1 | tee /tmp/foundation.txt
          grep -q 'Ran 14 tests' /tmp/foundation.txt
          grep -q '^OK$' /tmp/foundation.txt
          if grep -q 'skipped=' /tmp/foundation.txt; then exit 2; fi
      - name: Formal V2 regression
        env:
          PYTHONPATH: 'football-data:football-data/research'
        run: |
          set -euo pipefail
          python football-data/new_engine_v1/test_formal_fusion_v2.py 2>&1 | tee /tmp/formal.txt
          grep -q 'Ran 13 tests' /tmp/formal.txt
          grep -q '^OK$' /tmp/formal.txt
      - name: Seal zero-label free-data coverage receipt
        id: names
        env:
          CANDIDATE_SHA: '${{ steps.identity.outputs.candidate_sha }}'
        run: |
          set -euo pipefail
          rm -rf _seal; mkdir -p _seal/contract _seal/code _seal/evidence _seal/workflow
          cp governance/football3/v3_free_data_coverage_contract_v1.json governance/football3/v3_free_source_registry_v1.json _seal/contract/
          cp governance/football3/v3_git_snapshot_adapter_v1.py governance/football3/v3_free_data_coverage_probe_v1.py governance/football3/validate_v3_free_data_coverage_v1.py governance/football3/test_v3_free_data_coverage_v1.py _seal/code/
          cp .github/workflows/football3-v3-free-data-coverage-v1.yml _seal/workflow/
          cp /tmp/validator.txt /tmp/probe.txt /tmp/tests.txt /tmp/pit-validator.txt /tmp/pit-tests.txt /tmp/foundation.txt /tmp/formal.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('_seal')
          receipt={
            'schema_version':'football3-v3-free-data-coverage-receipt-v1','status':'FREE_DATA_SHARED_INFRA_READY_NO_CANDIDATE_DATA_READY','candidate_head':os.environ['CANDIDATE_SHA'],'exact_base':os.environ['EXACT_BASE'],'formal_head':os.environ['FORMAL_HEAD'],'current_sha256':os.environ['CURRENT_SHA'],'data_ready_candidates':[],'active_experts':[],'selected_experts':[],'c1_free_source_surface_exhausted':True,'openfootball_current_direct_domain_count':8,'openfootball_current_gap_domain_count':9,'new_target_labels_read':False,'legacy_sealed_labels_read':False,'training_performed':False,'tuning_performed':False,'formal_v2_changed':False,'current_changed':False,'formal_weights_changed':False,'production_changed':False,'login_used':False,'secret_used':False,'paid_source_used':False,'manual_per_match_download_used':False,
          }
          (root/'evidence'/'free_data_coverage_receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          files={}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[p.relative_to(root).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          manifest={'schema_version':'football3-v3-free-data-coverage-artifact-v1','status':receipt['status'],'candidate_head':receipt['candidate_head'],'exact_base':receipt['exact_base'],'files':files}
          (root/'artifact_manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
          artifact_name="football3-v3-free-data-coverage-${CANDIDATE_SHA}-${GITHUB_RUN_ID}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ steps.names.outputs.artifact_name }}'
          path: _seal
          if-no-files-found: error
          retention-days: 30
  remote-readback:
    needs: validate-and-seal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: '${{ needs.validate-and-seal.outputs.artifact_name }}'
          path: _readback
      - name: Verify sealed receipt
        env:
          CANDIDATE_SHA: '${{ needs.validate-and-seal.outputs.candidate_sha }}'
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_readback')
          m=json.loads((r/'artifact_manifest.json').read_text())
          x=json.loads((r/'evidence'/'free_data_coverage_receipt.json').read_text())
          assert m['candidate_head']==os.environ['CANDIDATE_SHA']
          assert x['status']=='FREE_DATA_SHARED_INFRA_READY_NO_CANDIDATE_DATA_READY'
          assert x['data_ready_candidates']==[] and x['active_experts']==[] and x['selected_experts']==[]
          assert x['c1_free_source_surface_exhausted'] is True
          assert x['openfootball_current_direct_domain_count']==8 and x['openfootball_current_gap_domain_count']==9
          for k in ('new_target_labels_read','legacy_sealed_labels_read','training_performed','tuning_performed','formal_v2_changed','current_changed','formal_weights_changed','production_changed','login_used','secret_used','paid_source_used','manual_per_match_download_used'):
              assert x[k] is False,k
          for rel,meta in m['files'].items():
              b=(r/rel).read_bytes(); assert hashlib.sha256(b).hexdigest()==meta['sha256'] and len(b)==meta['bytes']
          print('V3_FREE_DATA_COVERAGE_REMOTE_READBACK_PASS')
          PY
