name: Football V6.49.3 Fresh Forward Challengers + Context Priority

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_fresh_market_forward_challengers_v6492.py"
      - "football-data/validation/v6_context_priority_queue_v6493.py"
      - ".github/workflows/football-v6492-fresh-challengers.yml"

permissions:
  contents: write

concurrency:
  group: football-v6493-fresh-challengers
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python -m py_compile football-data/validation/v6_fresh_market_forward_challengers_v6492.py
          python -m py_compile football-data/validation/v6_context_priority_queue_v6493.py
      - name: Freeze fresh future-fixture challengers
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_fresh_market_forward_challengers_v6492.py
      - name: Build model-value context priority queue
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_context_priority_queue_v6493.py
      - name: Persist ledgers and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_fresh_market_forward_challengers_v6492_freeze.json \
            --allow-prefix football-data/forward/v6_fresh_selector_events_v6492.json \
            --allow-prefix football-data/forward/v6_fresh_matrix_events_v6492.json \
            --allow-prefix football-data/manifests/v6_fresh_market_forward_challengers_v6492_status.json \
            --allow-prefix football-data/manifests/v6_context_priority_queue_v6493_status.json \
            --message-prefix "audit(football): persist V6.49.3 fresh challengers and context queue"
      - name: Hard guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/v6_fresh_market_forward_challengers_v6492_status.json').read_text(encoding='utf-8'))
          q=json.loads(Path('football-data/manifests/v6_context_priority_queue_v6493_status.json').read_text(encoding='utf-8'))
          g=x.get('governance') or {}
          if x.get('status') != 'PASS' or q.get('status') != 'PASS': raise SystemExit('status guard failed')
          if g.get('future_fixture_only') is not True: raise SystemExit('future fixture guard failed')
          if g.get('historical_result_backfill') is not False: raise SystemExit('historical result backfill guard failed')
          if g.get('formal_weight') != 0 or (q.get('governance') or {}).get('formal_weight') != 0: raise SystemExit('formal weight guard failed')
          print(json.dumps({'freeze_stats':x.get('freeze_stats'),'selector_events':(x.get('selector_ledger_audit') or {}).get('event_count'),'matrix_events':(x.get('matrix_ledger_audit') or {}).get('event_count'),'priority_counts':q.get('priority_counts')},ensure_ascii=False))
          PY

# V6.49.2 remains the unique active forward challenger. The :37 schedule is an idempotent
# fallback for delayed/missed unified-pipeline runs; one immutable prediction per fixture and
# no historical backfill remain enforced by the frozen V6.49.2 contract.
