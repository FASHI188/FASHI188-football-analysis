name: Football V6.49.3 Fresh Forward Challengers MANUAL_ONLY

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6493-fresh-challengers-manual
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit chain
        run: |
          python -m py_compile football-data/validation/v6_fresh_market_forward_challengers_v6492.py
          python -m py_compile football-data/validation/v6_fresh_matrix_structural_audit_v6498.py
          python -m py_compile football-data/validation/v6_joint_surface_coherence_v6499.py
          python -m py_compile football-data/validation/v6_context_priority_queue_v6493.py
      - name: Run manually approved challenger audit
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python football-data/validation/v6_fresh_market_forward_challengers_v6492.py
          python football-data/validation/v6_fresh_matrix_structural_audit_v6498.py
          python football-data/validation/v6_joint_surface_coherence_v6499.py
          python football-data/validation/v6_context_priority_queue_v6493.py
      - name: Persist manual-run audit receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_fresh_market_forward_challengers_v6492_freeze.json \
            --allow-prefix football-data/forward/v6_fresh_selector_events_v6492.json \
            --allow-prefix football-data/forward/v6_fresh_matrix_events_v6492.json \
            --allow-prefix football-data/manifests/v6_fresh_market_forward_challengers_v6492_status.json \
            --allow-prefix football-data/manifests/v6_fresh_matrix_structural_audit_v6498_status.json \
            --allow-prefix football-data/manifests/v6_joint_surface_coherence_v6499_status.json \
            --allow-prefix football-data/manifests/v6_context_priority_queue_v6493_status.json \
            --message-prefix "audit(football): persist manually approved fresh challenger audit"
