name: Football V6.25.1 Exact Total Selective Gate

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_exact_selective_gate_v6251.py"
      - ".github/workflows/football-v6251-total-selective-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit
        run: python -m py_compile football-data/validation/v6_total_exact_selective_gate_v6251.py
      - name: Run exact-total confidence gate audit
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_exact_selective_gate_v6251.py
      - name: Persist audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_exact_selective_gate_v6251_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.1 exact-total selective gate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Diagnostic only; no CURRENT/runtime mutation.
