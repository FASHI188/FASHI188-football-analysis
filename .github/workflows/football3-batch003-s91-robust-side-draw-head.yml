name: football3 Batch-003 S91 robust-side draw-head
on:
  push:
    branches: [football3/batch003-hierarchical-draw]
    paths:
      - football-data/experiments/batch003_s91_robust_side_draw_head/run_batch003_s91.py
      - .github/workflows/football3-batch003-s91-robust-side-draw-head.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch003-hierarchical-draw
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Generate locked Batch-003 S91 predictions
        run: python football-data/experiments/batch003_s91_robust_side_draw_head/run_batch003_s91.py run
      - name: Verify Batch-003 S91 lock contract
        run: python football-data/experiments/batch003_s91_robust_side_draw_head/run_batch003_s91.py verify
      - name: Upload Batch-003 S91 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch003-s91-robust-side-draw-head
          path: football-data/experiments/batch003_s91_robust_side_draw_head/results/batch003_s91_predictions_locked.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist Batch-003 S91 predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch003_s91_robust_side_draw_head/results/batch003_s91_predictions_locked.json
          git add football-data/experiments/batch003_s91_robust_side_draw_head/data/mapping_audit_batch003_s91.json
          git commit -m '[locked] football3 Batch-003 S91 robust-side draw-head predictions' || true
          git fetch origin football3/batch003-hierarchical-draw
          git rebase origin/football3/batch003-hierarchical-draw
          git push origin HEAD:football3/batch003-hierarchical-draw
