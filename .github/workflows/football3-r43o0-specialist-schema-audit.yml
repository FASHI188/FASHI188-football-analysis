name: football3 R43O0 specialist zero-label schema audit

on:
  push:
    branches:
      - football3/r43o0-specialist-schema-audit
    paths:
      - football-data/experiments/r43o0_specialist_schema_audit/run_r43o0_schema.py
      - .github/workflows/football3-r43o0-specialist-schema-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43o0_schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43o0-specialist-schema-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Reconstruct and verify frozen R42H
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/experiments/r42h_player_technical_translation
          cat "$D"/encoded/run_r42h.py.gz.b64.part0 "$D"/encoded/run_r42h.py.gz.b64.part1 | base64 -d | gzip -d > "$D"/run_r42h_player_technical_translation.py
          echo 'b7bf4bd5fbfd61936e8de52fa09e5b81f748389cb9e0d2de6f33641c1d394a45  '"$D"'/run_r42h_player_technical_translation.py' | sha256sum -c -
          python -m py_compile football-data/experiments/r43o0_specialist_schema_audit/run_r43o0_schema.py
      - name: Run R43O0 zero-label schema audit
        run: python football-data/experiments/r43o0_specialist_schema_audit/run_r43o0_schema.py run
      - name: Verify R43O0 audit contract
        run: python football-data/experiments/r43o0_specialist_schema_audit/run_r43o0_schema.py verify
      - name: Persist audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43o0_specialist_schema_audit/results/summary_r43o0_specialist_schema_audit.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43O0 specialist schema audit'
            git fetch origin football3/r43o0-specialist-schema-audit
            git rebase origin/football3/r43o0-specialist-schema-audit
            git push origin HEAD:football3/r43o0-specialist-schema-audit
          fi
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43o0-specialist-schema-audit
          path: football-data/experiments/r43o0_specialist_schema_audit/results/summary_r43o0_specialist_schema_audit.json
          if-no-files-found: error
          retention-days: 90
