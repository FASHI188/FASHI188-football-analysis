name: Football V6.50.7 Draw Residual Net Gain

on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_draw_residual_net_gain_v6507.py"
      - ".github/workflows/football-v6507-draw-residual-net-gain.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6507-draw-residual-net-gain
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python -m py_compile football-data/validation/v6_draw_residual_net_gain_v6507.py
      - name: Run strict draw residual challenge
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_draw_residual_net_gain_v6507.py
      - name: Persist research receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_draw_residual_net_gain_v6507_status.json \
            --message-prefix "audit(football): persist V6.50.7 draw residual challenge"
      - name: Hard governance guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_draw_residual_net_gain_v6507_status.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          g=x.get('governance') or {}
          if g.get('research_only') is not True or g.get('formal_weight') != 0: raise SystemExit('research governance drift')
          if g.get('current_rule_change') is not False or g.get('formal_probability_change') is not False or g.get('formal_selector_threshold_change') is not False: raise SystemExit('formal mutation forbidden')
          d=x.get('design') or {}
          if d.get('target_results_used_for_training_or_threshold') is not False: raise SystemExit('target leakage')
          print(json.dumps({'status':x.get('status'),'target':(x.get('target_2025') or {}).get('candidate'),'gates':x.get('gates')},ensure_ascii=False))
          PY

# Research challenge only. Never changes CURRENT V5.0.1 or formal weights.
