name: football3 R43I5 frozen two-provider consensus

on:
  push:
    branches:
      - football3/r43i0-market-forward-settlement-20260828
    paths:
      - football-data/experiments/r43i5_frozen_two_provider_consensus/**
      - .github/workflows/football3-r43i5-frozen-two-provider-consensus.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43i5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43i0-market-forward-settlement-20260828
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile R43I5
        run: python -m py_compile football-data/experiments/r43i5_frozen_two_provider_consensus/run_r43i5.py
      - name: Run R43I5 synchronized two-provider consensus
        env:
          PYTHONPATH: football-data/engine
        run: python football-data/experiments/r43i5_frozen_two_provider_consensus/run_r43i5.py run
      - name: Verify R43I5 discovery contract
        env:
          PYTHONPATH: football-data/engine
        run: python football-data/experiments/r43i5_frozen_two_provider_consensus/run_r43i5.py verify
      - name: Persist R43I5 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add football-data/experiments/r43i5_frozen_two_provider_consensus/results/summary_r43i5_frozen_two_provider_consensus.json
          if git diff --cached --quiet; then
            echo 'No evidence delta'
          else
            git commit -m '[r43i5] persist synchronized two-provider consensus discovery'
            git push origin HEAD:football3/r43i0-market-forward-settlement-20260828
          fi
      - name: Upload R43I5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43i5-frozen-two-provider-consensus
          path: football-data/experiments/r43i5_frozen_two_provider_consensus/results/summary_r43i5_frozen_two_provider_consensus.json
          if-no-files-found: error
          retention-days: 90
