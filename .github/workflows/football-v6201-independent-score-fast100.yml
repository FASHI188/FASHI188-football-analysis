name: Football V6.20.1 Independent Score Fast100
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_independent_score_hierarchical_fast100_v6201.py"
      - "football-data/validation/v6_independent_total_hierarchical_fast100_v6200.py"
      - ".github/workflows/football-v6201-independent-score-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6201-independent-score-fast100
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sklearn
        run: python -m pip install --quiet scikit-learn
      - name: Compile
        run: python -m py_compile football-data/validation/v6_independent_score_hierarchical_fast100_v6201.py
      - name: Run fixed-seed Fast100
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_independent_score_hierarchical_fast100_v6201.py
      - name: Persist receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_independent_score_hierarchical_fast100_v6201_status.json
          git add "$p"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.20.1 independent-score Fast100"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
