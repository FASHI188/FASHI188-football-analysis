name: football3 Historical Fusion V3 Side Head Consistency External Confirm
on:
  push:
    branches: ['football3/historical-fusion-v3-side-head-consistency-external-confirm-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-side-head-consistency-external-confirm-v1.yml'
      - 'football-data/research/historical_fusion_v3_side_head_consistency_external_confirm/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: football3-v3-side-head-consistency-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_HEAD: 7d2b5f89dd4e79e859f060f4b0705cacaaa5820a
  CONTRACT_FREEZE_COMMIT: 464761af799e2393c4f22e7aa2342eb19ea1462b
  CONTRACT_BLOB: 009124b50c884b2d6e4ae7fab897d564cf85d3ec
  RUNNER_BLOB: aa01d25a0feaa23a01cabf4088c9acc2596631b3
  TEST_BLOB: 4279f239f5216023d6a93777c99c4c32f1b25bea
  V324_HEAD: 3cc9098cd321ee4f1dd659b1a4f4db75c02555ed
  V324_RUNNER_BLOB: 218cfab50a23ca5f94e57c95b2357ae2c9d9ba8f
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
jobs:
  confirm-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact lineage contract freeze whitelist and formal guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-side-head-consistency-external-confirm-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${CONTRACT_FREEZE_COMMIT}^")" = "$BASE_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1 | cut -f1)" = "$V324_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_v3_side_head_consistency_external_confirm
          test "$(git hash-object "$D/SIDE_HEAD_CONSISTENCY_EXTERNAL_CONFIRM_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/side_head_consistency_external_confirm.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_side_head_consistency_external_confirm.py")" = "$TEST_BLOB"
          test "$(git hash-object football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection/v3_2_4_segment4.py)" = "$V324_RUNNER_BLOB"
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_v3_side_head_consistency_external_confirm'); contract=str(d/'SIDE_HEAD_CONSISTENCY_EXTERNAL_CONFIRM_CONTRACT.json')
          freeze=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...{os.environ['CONTRACT_FREEZE_COMMIT']}"],text=True).splitlines()); assert freeze=={contract},freeze
          allowed={'.github/workflows/football3-historical-fusion-v3-side-head-consistency-external-confirm-v1.yml',contract,str(d/'side_head_consistency_external_confirm.py'),str(d/'test_side_head_consistency_external_confirm.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...HEAD"],text=True).splitlines()); assert got==allowed,(got,allowed)
          c=json.loads((d/'SIDE_HEAD_CONSISTENCY_EXTERNAL_CONFIRM_CONTRACT.json').read_text()); assert c['status']=='FROZEN_BEFORE_THIRD_EXTERNAL_COHORT_DOWNLOAD_OR_SCORING'; assert c['proxy_mapping']['no_learning'] and c['proxy_mapping']['no_parameter_fit'] and c['proxy_mapping']['no_threshold_grid']; assert {x['code'] for x in c['data']['leagues']}=={'E2','E3','SC1','SC2','SC3'}
          assert not any(any(x in p for x in ('CURRENT','production_pointer','formal_enablement')) for p in got)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run seven structural tests before third-cohort scoring
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_side_head_consistency_external_confirm
          python -m py_compile "$D/side_head_consistency_external_confirm.py" "$D/test_side_head_consistency_external_confirm.py"
          (cd "$D" && python test_side_head_consistency_external_confirm.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Download frozen untouched third external cohort
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _data && mkdir _data
          for sp in 2425 2526; do
            for lg in E2 E3 SC1 SC2 SC3; do
              curl -fsSL --retry 3 --retry-delay 2 "https://www.football-data.co.uk/mmz4281/${sp}/${lg}.csv" -o "_data/${sp}_${lg}.csv"
              test -s "_data/${sp}_${lg}.csv"
            done
          done
          sha256sum _data/*.csv | sort > /tmp/data_sha256.txt
      - name: Execute frozen side-head consistency confirmation once
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_side_head_consistency_external_confirm
          rm -rf _run && mkdir _run
          python "$D/side_head_consistency_external_confirm.py" --contract "$D/SIDE_HEAD_CONSISTENCY_EXTERNAL_CONFIRM_CONTRACT.json" --data-dir _data --v324-runner football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection/v3_2_4_segment4.py --out _run | tee /tmp/result_stdout.txt
      - name: Seal immutable third-cohort evidence
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_side_head_consistency_external_confirm
          rm -rf _artifact && mkdir -p _artifact/{contracts,code,evidence,data_receipts}
          cp "$D/SIDE_HEAD_CONSISTENCY_EXTERNAL_CONFIRM_CONTRACT.json" _artifact/contracts/
          cp "$D/side_head_consistency_external_confirm.py" "$D/test_side_head_consistency_external_confirm.py" _artifact/code/
          cp _run/side_head_consistency_external_confirm_result.json _artifact/evidence/
          cp /tmp/tests.txt /tmp/result_stdout.txt _artifact/evidence/
          cp /tmp/data_sha256.txt _artifact/data_receipts/
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('_artifact'); f=json.load(open(root/'evidence/side_head_consistency_external_confirm_result.json')); files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix(); files[rel]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          m={'schema_version':'football3-v3-side-head-consistency-artifact-v1','head':os.environ['GITHUB_SHA'],'status':f['status'],'all_pass':f['all_pass'],'row_count':f['row_count'],'counts':f['counts'],'formal_confirmation':False,'promotion_allowed':False,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (root/'artifact_manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload immutable third-cohort evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-side-head-consistency-${{ github.sha }}-${{ github.run_id }}
          path: _artifact
          if-no-files-found: error
          retention-days: 90
  remote-readback:
    needs: confirm-and-seal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football3-side-head-consistency-${{ github.sha }}-${{ github.run_id }}
          path: readback
      - name: Verify manifest and terminal evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('readback'); m=json.load(open(root/'artifact_manifest.json'))
          for rel,rec in m['files'].items():
              p=root/rel; assert p.exists(),rel; assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256'],rel
          f=json.load(open(root/'evidence/side_head_consistency_external_confirm_result.json')); assert f['status']==m['status']; assert f['formal_confirmation'] is False and f['promotion_allowed'] is False; assert f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed']
          PY
