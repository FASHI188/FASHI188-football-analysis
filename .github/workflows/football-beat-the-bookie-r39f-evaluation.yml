name: Football Beat The Bookie R39F Evaluation

on:
  push:
    branches: [research/beat-the-bookie-r39f-provider-leadlag]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39f-evaluation.yml'

permissions:
  contents: read

jobs:
  provider-microstructure-fixed100:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3'
      - name: Verify exact frozen contract before external or label access
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py
          python -m json.tool football-data/research/beat_the_bookie_r39/preregistration_r39f.json >/dev/null
          python football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py --self-test
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('football-data/research/beat_the_bookie_r39/preregistration_r39f.json')
          c=Path('football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py')
          r=json.loads(p.read_text())
          assert r['source_and_audit_binding']['provider_audit_status']=='PASS_R39F_PROVIDER_SLOT_AUDIT_NO_LABELS'
          assert r['identity_binding']['r39f_blind_sha256']=='1ccb7e5dd7a3328ee9cc47e6886dc3a8348203dac2ed414c0da59b4185031ae5'
          assert r['identity_binding']['blind_labels_previously_accessed']==0
          assert r['time_horizon']['T0_index_71_excluded_from_all_R39F_features'] is True
          assert r['lead_lag']['labels_used'] is False
          assert r['hard_limits']['formal_weight']==0
          print('prereg_sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('evaluator_sha256',hashlib.sha256(c.read_bytes()).hexdigest())
          print('PASS_R39F_FROZEN_EVAL_CONTRACT')
          PY
      - name: Download independent source
        run: |
          set -euo pipefail
          rm -rf r39f-source r39f-sanitized r39f-output r39f-source.zip
          mkdir -p r39f-source r39f-sanitized
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset' -o r39f-source.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('r39f-source.zip')
          wanted=('odds_series.csv.gz','odds_series_b.csv.gz')
          names=set(z.namelist()); assert set(wanted)<=names
          for n in wanted: z.extract(n,'r39f-source')
          PY
          rm r39f-source.zip
      - name: Build score-free market input
        run: |
          set -euo pipefail
          for base in odds_series odds_series_b; do
            gzip -dc "r39f-source/${base}.csv.gz" | cut -d',' -f1-3,6- | gzip -c > "r39f-sanitized/${base}_no_scores.csv.gz"
          done
      - name: Execute frozen R39F sequence
        run: |
          set -euo pipefail
          python football-data/research/beat_the_bookie_r39/evaluate_provider_leadlag_r39f.py \
            --prereg football-data/research/beat_the_bookie_r39/preregistration_r39f.json \
            --sanitized-dir r39f-sanitized \
            --original-dir r39f-source \
            --out-dir r39f-output
      - name: Verify label order and result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39f-output/r39f_result.json').read_text())
          allowed={
            'STOP_R39F_BEFORE_BLIND_LABEL_ACCESS_PROVIDER_MICROSTRUCTURE_NO_INCREMENT',
            'STOP_R39F_BEFORE_BLIND_LABEL_ACCESS_NO_POLICY_LANE',
            'PASS_R39F_PROVIDER_MICROSTRUCTURE_FIXED100_EXPLORATORY_ONLY',
            'NO_R39F_PROVIDER_MICROSTRUCTURE_INCREMENT_FIXED100'
          }
          assert r['status'] in allowed
          blind=r['blind_fixed100_labels_accessed']
          if r['status'].startswith('STOP_R39F_BEFORE_BLIND_LABEL_ACCESS'):
            assert blind==0
          else:
            assert blind==100
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Delete raw source before artifact
        if: always()
        run: rm -rf r39f-source r39f-sanitized
      - name: Upload aggregate R39F evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-beat-the-bookie-r39f-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39f-output/
          if-no-files-found: error
          retention-days: 30
