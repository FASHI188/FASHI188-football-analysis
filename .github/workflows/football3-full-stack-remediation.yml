name: Football3 Full Stack Scientific Preflight

on:
  push:
    branches: [football3/historical-xg-fusion-v2-formal-wiring-governed-v1]
    paths:
      - '.github/workflows/football3-full-stack-remediation.yml'
      - '.github/workflows/football3-historical-xg-fusion-v2-formal-wiring.yml'
      - 'football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json'
      - 'governance/football3/**'
  pull_request:
    paths:
      - 'football-data/**'
      - 'scripts/**'
      - 'governance/football3/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256: '3cfe9302bac9abc8b9d1bfd678c4a38f4c79dd2c124dd6e2b3bfaa3d715c83dc'
  HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256: 'c61d695eeb5601bb74a5b6a673b71c28d17959730732e476d4361563b3436b58'
  FORMAL_WIRING_GOVERNANCE_BASE_HEAD: '3016f6c7a0b77e0db310ad926011dfaa50c56e02'
  FORMAL_WIRING_GOVERNED_BRANCH: 'football3/historical-xg-fusion-v2-formal-wiring-governed-v1'

jobs:
  full-stack-preflight:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.head_ref, 'football3/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install frozen remediation dependencies
        run: pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 pytest==8.4.1
      - name: Compile remediation execution stack
        run: |
          python -m py_compile \
            football-data/research/football3_core.py \
            football-data/research/validate_football3_experiment.py \
            football-data/research/validate_football3_research_policy_v3.py \
            football-data/research/audit_football3_execution_surface.py \
            football-data/research/audit_football3_changed_scientific_files.py \
            football-data/research/audit_football3_lineage.py \
            football-data/research/audit_football3_pr_scope.py \
            football-data/research/run_football3_synthetic_prelabel_smoke.py
      - name: Compile isolated non-market formal_wiring governance validator
        if: github.ref_name == env.FORMAL_WIRING_GOVERNED_BRANCH || github.head_ref == env.FORMAL_WIRING_GOVERNED_BRANCH
        run: |
          python -m py_compile \
            governance/football3/validate_formal_wiring_contract_v2.py \
            governance/football3/test_validate_formal_wiring_contract_v2.py
      - name: Audit C072-C lineage and all C073-C077-derived research isolation
        run: python football-data/research/audit_football3_lineage.py
      - name: Unit-test metrics calibration PIT identity bootstrap evaluator and V2 contract guards
        env:
          PYTHONPATH: football-data/research
        run: |
          pytest -q \
            football-data/research/test_football3_core.py \
            football-data/research/test_validate_football3_experiment.py
      - name: Run isolated non-market formal_wiring positive and fail-closed tests
        if: github.ref_name == env.FORMAL_WIRING_GOVERNED_BRANCH || github.head_ref == env.FORMAL_WIRING_GOVERNED_BRANCH
        run: pytest -q governance/football3/test_validate_formal_wiring_contract_v2.py
      - name: Validate isolated non-market formal_wiring schema-v2 and immutable market governance
        if: github.ref_name == env.FORMAL_WIRING_GOVERNED_BRANCH || github.head_ref == env.FORMAL_WIRING_GOVERNED_BRANCH
        run: |
          python governance/football3/validate_formal_wiring_contract_v2.py \
            --contract football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json \
            --schema governance/football3/formal_wiring_contract_schema_v2.json \
            --repo-root . \
            --base-head "$FORMAL_WIRING_GOVERNANCE_BASE_HEAD"
      - name: Run zero-real-label end-to-end scoring smoke
        env:
          PYTHONPATH: football-data/research
        run: |
          python football-data/research/run_football3_synthetic_prelabel_smoke.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('football-data/research/football3_synthetic_prelabel_smoke_summary.json').read_text())
          assert s['status']=='FOOTBALL3_SYNTHETIC_PRELABEL_SMOKE_PASS'
          assert s['real_target_labels_opened']==0
          assert s['same_cutoff_guard'] and s['master_cutoff_guard'] and s['pit_guard'] and s['temporal_oos_guard']
          assert s['identity_join_guard'] and s['sealed_boundary_guard'] and s['ou_direction_guard']
          assert s['canonical_evaluator_guard'] and set(s['canonical_evaluation']['bootstrap'])=={'LogLoss','Brier','RPS'}
          print('synthetic pre-label smoke: PASS')
          PY
      - name: Audit historical positive-result engineering boundary and active execution surface
        env:
          PYTHONPATH: football-data/research
        run: |
          python football-data/research/audit_football3_execution_surface.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('football-data/research/football3_execution_surface_audit_summary.json').read_text())
          assert s['status']=='FOOTBALL3_EXECUTION_SURFACE_AUDIT_PASS', s
          assert s['real_target_labels_opened']==0 and s['models_fit_or_scored']==0 and s['sealed_pools_opened']==0
          print('execution-surface audit: PASS')
          PY
      - name: Validate V3 policy V2 contract template audit receipt and single authority
        run: |
          python football-data/research/validate_football3_research_policy_v3.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/FOOTBALL3_RESEARCH_POLICY_V3.json').read_text())
          r=json.loads(Path('football-data/research/FOOTBALL_GLOBAL_CONSUMPTION_REGISTRY_V1.json').read_text())
          t=json.loads(Path('football-data/research/FOOTBALL3_EXPERIMENT_CONTRACT_TEMPLATE_V2.json').read_text())
          a=json.loads(Path('football-data/research/FOOTBALL3_GLOBAL_CONSUMPTION_AUDIT_TEMPLATE_V1.json').read_text())
          assert p['project_id']=='football3'
          assert p['scientific_root']['sha']=='e3e73c998020beef585cc459a69ea5b73b44ddb3'
          assert p['prediction_contract']['master_prediction_cutoff']=='T-15m'
          assert p['execution_core']['mandatory_proper_scores']==['LogLoss','Brier','RPS']
          assert p['execution_core']['mandatory_calibration_metrics']==['Top1ECE','ClasswiseECE']
          assert p['validation']['optional_stopping'] is False
          assert r['rules']['viewed_target_labels_are_globally_consumed'] is True
          assert all(x['authorized_access'] is False for x in r['sealed'])
          assert t['schema_version']==2 and t['prediction_cutoff']['master']=='T-15m'
          assert t['data_plan']['identity_lock_format']=='sha256_csv_v1'
          assert t['metrics']['implementation']=='football3_core.evaluate_frozen_experiment'
          assert a['real_target_values_read']==0 and a['connected_audit_status']=='VERIFIED_ZERO_LABEL'
          for stale in [
            'football-data/research/FOOTBALL3_RESEARCH_POLICY_V2.json',
            'football-data/research/validate_football3_research_policy_v2.py',
            'football-data/research/FOOTBALL3_EXPERIMENT_CONTRACT_TEMPLATE_V1.json',
            'football-data/research/FOOTBALL3_EXECUTION_STANDARD_V1.md',
          ]:
            assert not Path(stale).exists(), stale
          print('policy/contract/audit/single-authority: PASS')
          PY
      - name: Enforce migration and revalidate all active V2 contracts
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == env.FORMAL_WIRING_GOVERNED_BRANCH)
        env:
          PYTHONPATH: football-data/research
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$FORMAL_WIRING_GOVERNANCE_BASE_HEAD"
          fi
          python football-data/research/audit_football3_changed_scientific_files.py \
            --base "$BASE_SHA" \
            --head HEAD \
            --expected-guard-canonical-ast-sha256 "${HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256}" \
            --expected-audit-canonical-ast-sha256 "${HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256}"
      - name: Prove remediation itself opens no real target or sealed data
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == env.FORMAL_WIRING_GOVERNED_BRANCH)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$FORMAL_WIRING_GOVERNANCE_BASE_HEAD"
          fi
          export BASE_SHA
          python - <<'PY'
          import os, subprocess
          base=os.environ['BASE_SHA'] if os.environ.get('BASE_SHA') else os.environ['FORMAL_WIRING_GOVERNANCE_BASE_HEAD']
          changed=subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines()
          forbidden_fragments=['c072n17/development_join_audit.csv','c072n20/consumed_n20_p1000_receipt.csv','confirmation1597','reserve266','confirmation150']
          bad=[f for f in changed if any(x.lower() in f.lower() for x in forbidden_fragments)]
          assert not bad, bad
          print('changed files contain no target receipt/sealed pool material:',len(changed))
          PY
