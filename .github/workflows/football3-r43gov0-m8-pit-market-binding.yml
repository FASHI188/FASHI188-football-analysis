name: football3 R43GOV0 M8 PIT market binding

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/pipeline/unified_inference.py
      - football-data/components/r43_native_matrix_components.py
      - football-data/pit/feature_store.py
      - football-data/assembly/feature_assembler.py
      - football-data/tests/test_r43q_pit_market_binding.py
      - football-data/tests/test_r43_component_chain_composition.py
      - .github/workflows/football3-r43gov0-m8-pit-market-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit-market-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json|football-data/forward/r43y0_draw_calibration_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi

      - name: Compile M8 market binding
        run: |
          python -m py_compile football-data/pipeline/unified_inference.py
          python -m py_compile football-data/components/r43_native_matrix_components.py
          python -m py_compile football-data/tests/test_r43q_pit_market_binding.py
          python -m py_compile football-data/tests/test_r43_component_chain_composition.py

      - name: Run M8 PIT market tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43q_pit_market_binding.py' -v 2>&1 | tee /tmp/m8_test.log

      - name: Run M5H composition regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43_component_chain_composition.py' -v 2>&1 | tee /tmp/m8_m5h_regression.log

      - name: Upload M8 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m8-pit-market-binding-diagnostic
          path: |
            /tmp/m8_test.log
            /tmp/m8_m5h_regression.log
          if-no-files-found: error
          retention-days: 30

      - name: Write M8 gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m8_pit_market_binding_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m8-pit-market-binding-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "market_feature_family": "market_1x2_ah_ou",
            "r43q_exact_core_unchanged": true,
            "r43q_unified_baseline_pit_bound": true,
            "atomic_1x2_ah_ou_snapshot_required": true,
            "direct_market_payload_forbidden": true,
            "known_at_as_of_enforced": true,
            "effective_at_as_of_enforced": true,
            "expiration_enforced": true,
            "historical_use_permission_required": true,
            "fixture_identity_bound": true,
            "consumer_attested_numeric_activation": true,
            "activation_receipt_binds_used_source_record_hash": true,
            "manual_market_activation_cannot_replace_consumer_attestation": true,
            "dataset_replay_live_candidate_numerics_identical": true,
            "default_market_numeric_effect_policy": false,
            "research_candidate_policy_override_required": true,
            "historical_r43q_architecture_gate_passed": false,
            "formal_promotion_allowed": false,
            "fresh_confirmatory_test_claim": false,
            "formal_default_baseline": "V500_frozen_unchanged",
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M9_update_truth_registry_and_end_to_end_governed_configuration_gate"
          }
          JSON

      - name: Upload M8 gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m8-pit-market-binding-gate
          path: football-data/governance/r43gov0/results/m8_pit_market_binding_gate.json
          if-no-files-found: error
          retention-days: 90
