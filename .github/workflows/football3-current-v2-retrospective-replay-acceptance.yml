name: Football3 Current V2 Retrospective Replay Acceptance

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, reopened, synchronize]
    paths:
      - 'football-data/formal_gpt_gateway_v1/**'
      - 'governance/football3/**'
      - '.github/workflows/football3-current-v2-retrospective-replay-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  targeted-adapter-contract:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'football3/current-v2-retrospective-replay')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 pytest==8.4.1
      - name: Compile replay adapters and targeted tests
        run: |
          set -euo pipefail
          python -m py_compile \
            football-data/formal_gpt_gateway_v1/current_v2_retrospective_replay_v1.py \
            football-data/formal_gpt_gateway_v1/current_v2_retrospective_exact_history_v1.py \
            football-data/formal_gpt_gateway_v1/current_v2_retrospective_xg_coverage_v1.py \
            football-data/formal_gpt_gateway_v1/current_v2_retrospective_receipt_contract_v1.py \
            football-data/formal_gpt_gateway_v1/entry.py \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_replay_v1.py \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_exact_history_v1.py \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_xg_coverage_v1.py
      - name: Run targeted replay adapter contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1
        run: |
          set -euo pipefail
          python -m pytest -q \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_replay_v1.py \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_exact_history_v1.py \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_xg_coverage_v1.py
      - name: Assert candidate checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > current_v2_retrospective_replay_candidate_head.txt
      - name: Upload targeted contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-current-v2-retrospective-targeted-${{ github.run_id }}
          path: current_v2_retrospective_replay_candidate_head.txt
          if-no-files-found: error
