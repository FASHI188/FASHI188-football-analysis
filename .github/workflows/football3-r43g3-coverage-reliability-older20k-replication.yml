name: football3 R43G3 coverage reliability older20k replication

on:
  push:
    branches:
      - football3/r43g3-coverage-reliability-older20k-replication
    paths:
      - football-data/experiments/r43g3_coverage_reliability_older20k_replication/**
      - .github/workflows/football3-r43g3-coverage-reliability-older20k-replication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43g3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43g3-coverage-reliability-older20k-replication
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Reconstruct frozen R42H runner
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/experiments/r42h_player_technical_translation
          cat "$D"/encoded/run_r42h.py.gz.b64.part0 "$D"/encoded/run_r42h.py.gz.b64.part1 | base64 -d | gzip -d > "$D"/run_r42h_player_technical_translation.py
          echo 'b7bf4bd5fbfd61936e8de52fa09e5b81f748389cb9e0d2de6f33641c1d394a45  '"$D"'/run_r42h_player_technical_translation.py' | sha256sum -c -
          echo '17155fe709877801299b1b8f2d965cb11da4cb81c5d2fc5733cf7536bbe2faad  football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py' | sha256sum -c -
          python -m py_compile football-data/experiments/r43f5_probability_weighted_technical_mixture/run_r43f5.py
          python -m py_compile football-data/experiments/r43g1_coverage_reliability_shrink/run_r43g1.py
          python -m py_compile football-data/experiments/r43g3_coverage_reliability_older20k_replication/run_r43g3.py
      - name: Run R43G3 frozen older20k replication
        run: python football-data/experiments/r43g3_coverage_reliability_older20k_replication/run_r43g3.py
      - name: Verify R43G3 contract
        run: |
          python - <<'PY'
          import json
          p='football-data/experiments/r43g3_coverage_reliability_older20k_replication/results/summary_r43g3_coverage_reliability_older20k_replication.json'
          d=json.load(open(p))
          assert d['status']=='COMPLETE' and d['formal_weight']==0
          g=d['governance']
          assert g['formula_change'] is False and g['gate_change'] is False
          assert g['parameter_search'] is False and g['threshold_search'] is False and g['feature_search'] is False
          assert g['no_manual_outcome_override'] is True and g['no_manual_draw_override'] is True
          assert g['r42l_lock_modified'] is False
          assert d['split']['test_n'] >= 1000
          print('R43G3 contract verified')
          PY
      - name: Persist R43G3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add football-data/experiments/r43g3_coverage_reliability_older20k_replication/results/summary_r43g3_coverage_reliability_older20k_replication.json
          if git diff --cached --quiet; then
            echo 'No evidence delta'
          else
            git commit -m '[r43g3] persist frozen older20k reliability evidence'
            git push origin HEAD:football3/r43g3-coverage-reliability-older20k-replication
          fi
      - name: Upload R43G3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43g3-coverage-reliability-older20k-replication
          path: football-data/experiments/r43g3_coverage_reliability_older20k_replication/results/summary_r43g3_coverage_reliability_older20k_replication.json
          if-no-files-found: error
          retention-days: 90
