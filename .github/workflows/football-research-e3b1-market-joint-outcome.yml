name: Football Research E3b-1 Market-Joint Direct Outcome

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "research/matrix-draw-gate-e3a"
    types: [opened, synchronize, reopened, edited]
    paths:
      - "football-data/research/market_joint_direct_outcome_e3b1.py"
      - ".github/workflows/football-research-e3b1-market-joint-outcome.yml"
  push:
    branches:
      - "research/market-joint-direct-outcome-e3b1"
    paths:
      - "football-data/research/market_joint_direct_outcome_e3b1.py"
      - ".github/workflows/football-research-e3b1-market-joint-outcome.yml"

permissions:
  contents: read

concurrency:
  group: football-research-e3b1-market-joint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-market-joint-direct-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact research HEAD
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1

      - name: Syntax check
        run: |
          python -m py_compile football-data/research/market_joint_direct_outcome_e3b1.py

      - name: Run research-only E3b-1 experiment
        env:
          PYTHONPATH: football-data/engine:football-data/validation:football-data/research
          PYTHONUTF8: "1"
        run: |
          python football-data/research/market_joint_direct_outcome_e3b1.py --print-summary

      - name: Upload E3b-1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-e3b1-market-joint-${{ github.sha }}
          path: artifacts/research/market_joint_direct_outcome_e3b1/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected formal assets were not changed
        if: always()
        run: |
          git diff --exit-code -- football-data/models football-data/config football-data/processed football-data/raw
          git diff --exit-code
