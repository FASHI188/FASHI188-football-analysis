name: Football3 HDA Aggregation Engineering Zero Label

on:
  pull_request:
    paths:
      - 'football-data/research/football3_hda.py'
      - 'football-data/research/football3_hda_scoring.py'
      - 'football-data/research/test_football3_hda.py'
      - 'football-data/research/football3_hda_score_support_registry_v1.json'
      - 'football-data/research/run_football3_hda_zero_label_audit.py'
      - 'football-data/research/audit_football3_changed_scientific_files.py'
      - '.github/workflows/football3-hda-aggregation-engineering-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-hda-engineering-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256: '60663cae3774c2b718b0f40e72d416f5183bc9b8d3adca969ed870108ea1bebf'
  HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256: '2d04d229f0badc6533c83655a52ec26242dec7414ae8d65db6aac4b5ee5813db'

jobs:
  # Reusable structural CI: follows football3/* HEAD refs across any PR base branch.
  hda-structure-linux:
    if: startsWith(github.head_ref, 'football3/')
    name: hda-continuous-structure-linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify frozen canonical AST identities from workflow literals
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path

          SCHEMA = "football3_canonical_ast_structure_v1"
          TARGETS = {
              "football-data/research/audit_football3_changed_scientific_files.py": os.environ["HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256"],
              "football-data/research/run_football3_hda_zero_label_audit.py": os.environ["HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256"],
          }

          def canonical(value):
              if isinstance(value, ast.AST):
                  return ["node", type(value).__name__, [[field, canonical(item)] for field, item in ast.iter_fields(value)]]
              if isinstance(value, list):
                  return ["list", [canonical(item) for item in value]]
              if isinstance(value, tuple):
                  return ["tuple", [canonical(item) for item in value]]
              return ["literal", type(value).__name__, repr(value)]

          def canonical_sha256(path):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              payload = {"schema": SCHEMA, "tree": canonical(tree)}
              encoded = json.dumps(payload, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          checked = {}
          for path, expected in TARGETS.items():
              if len(expected) != 64 or any(ch not in "0123456789abcdef" for ch in expected):
                  raise SystemExit(f"invalid frozen workflow SHA-256 for {path}: {expected!r}")
              actual = canonical_sha256(path)
              if actual != expected:
                  raise SystemExit(f"canonical AST identity mismatch for {path}: expected={expected} actual={actual}")
              checked[path] = actual
          print(json.dumps(checked, sort_keys=True))
          PY
      - name: Compile HDA production, scoring, guard, audit, and tests
        run: |
          python -m py_compile \
            football-data/research/football3_hda.py \
            football-data/research/football3_hda_scoring.py \
            football-data/research/test_football3_hda.py \
            football-data/research/run_football3_hda_zero_label_audit.py \
            football-data/research/audit_football3_changed_scientific_files.py
      - name: Run complete synthetic, scoring, AST-contract, and guard-counterexample suite
        env:
          PYTHONPATH: football-data/research
        run: python -m unittest football-data/research/test_football3_hda.py -v
      - name: Validate frozen support registry directly
        env:
          PYTHONPATH: football-data/research
        run: |
          python - <<'PY'
          from football3_hda import load_score_support_registry
          registry = load_score_support_registry()
          assert len(registry) == 2, len(registry)
          print(sorted(registry))
          PY
      - name: Run production football3 guard on actual PR scope
        run: |
          python football-data/research/audit_football3_changed_scientific_files.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --expected-guard-canonical-ast-sha256 "${HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256}" \
            --expected-audit-canonical-ast-sha256 "${HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256}"
      - name: Verify no repository persistence
        run: git diff --exit-code

  hda-structure-windows:
    if: startsWith(github.head_ref, 'football3/')
    name: hda-continuous-structure-windows
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
