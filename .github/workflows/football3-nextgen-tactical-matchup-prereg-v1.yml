name: Football3 NextGen Tactical Matchup Preregistration
on:
  push:
    branches: [football3/nextgen-tactical-matchup-prereg-v1]
    paths:
      - 'governance/football3/nextgen_tactical_matchup_prereg_contract_v1.json'
      - 'governance/football3/validate_nextgen_tactical_matchup_prereg_v1.py'
      - 'governance/football3/test_validate_nextgen_tactical_matchup_prereg_v1.py'
      - '.github/workflows/football3-nextgen-tactical-matchup-prereg-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: football3-nextgen-tactical-matchup-prereg-${{ github.sha }}
  cancel-in-progress: false
env:
  EXACT_BASE: 'de4423d75dead888a4fdd9f2bd0a0fbe89e47fba'
  FORMAL_HEAD: 'e12f5d1193be5d81f60301cf34ab2140e11712a9'
  FORMAL_V2_BLOB: 'a5ed26d5ffd4a2875cb9c658cfaa28665a8b7871'
  FORMAL_V2_TEST_BLOB: '61b25cd403fa1d9efa0dfcbc1643e0f17621944e'
  FORMAL_POINTER_BLOB: 'f07743f9c873d415fad9612f3225f64c64b10542'
  FORMAL_GATEWAY_ENTRY_BLOB: 'b41b0ede2db99c116b90270a32cd04dd240eb655'
  CURRENT_SHA256: '71d54a6fd227ad2bbdddea9d0e42b88cea2022efef8faf26c7483cd99d5b8731'
  LEGACY_DEV_HEAD: '9cb97764de1250fd08c6d0880559192e66352ce3'
  LEGACY_DEV_ARTIFACT_ID: '9931718950'
  LEGACY_DEV_ARTIFACT_DIGEST: 'sha256:4eaee5a8b8b62e4a75cf7f5c2c7beca94bcb909c7b7ccfb1d2ecba21c5cd2c96'
  LEGACY_PROS_HEAD: '5abb056d6d88bb42809e1114ad642c3c9f414acb'
  LEGACY_PROS_ARTIFACT_ID: '9941451940'
  LEGACY_PROS_ARTIFACT_DIGEST: 'sha256:3dc33bad08091c8353cf3df2dbbcf71166620910dedd352562ece972fc1658e8'
jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Bind exact base and four-file scope
        id: identity
        env: {CANDIDATE_SHA: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXACT_BASE" HEAD)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/formal-gpt-runner-integration-v1 | cut -f1)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          python - <<'PY'
          import subprocess
          expected={'.github/workflows/football3-nextgen-tactical-matchup-prereg-v1.yml','governance/football3/nextgen_tactical_matchup_prereg_contract_v1.json','governance/football3/validate_nextgen_tactical_matchup_prereg_v1.py','governance/football3/test_validate_nextgen_tactical_matchup_prereg_v1.py'}
          got=set(subprocess.check_output(['git','diff','--name-only','de4423d75dead888a4fdd9f2bd0a0fbe89e47fba...HEAD'],text=True).splitlines())
          assert got==expected,(sorted(got),sorted(expected))
          PY
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Prove formal surfaces immutable
        run: |
          set -euo pipefail
          for spec in \
            "football-data/new_engine_v1/formal_fusion_v2.py:$FORMAL_V2_BLOB" \
            "football-data/new_engine_v1/test_formal_fusion_v2.py:$FORMAL_V2_TEST_BLOB" \
            "football-data/config/formal_model_pointer_historical_xg_fusion_v2.json:$FORMAL_POINTER_BLOB" \
            "football-data/formal_gpt_gateway_v1/entry.py:$FORMAL_GATEWAY_ENTRY_BLOB"
          do path="${spec%%:*}"; expected="${spec##*:}"; test "$(git rev-parse "$EXACT_BASE:$path")" = "$expected"; test "$(git hash-object "$path")" = "$expected"; done
      - name: Verify protected legacy Stage6 evidence identities
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/football3/stage6-pre-b-preshot-deep-ppda-v1 | cut -f1)" = "$LEGACY_DEV_HEAD"
          test "$(git ls-remote origin refs/heads/football3/stage6-pre-b-prospective-confirmation-v1 | cut -f1)" = "$LEGACY_PROS_HEAD"
          python - <<'PY'
          import json,os,subprocess
          for id_key,digest_key in [('LEGACY_DEV_ARTIFACT_ID','LEGACY_DEV_ARTIFACT_DIGEST'),('LEGACY_PROS_ARTIFACT_ID','LEGACY_PROS_ARTIFACT_DIGEST')]:
              raw=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ[id_key]}"],text=True)
              meta=json.loads(raw)
              assert meta['expired'] is False
              got=meta['digest']; expected=os.environ[digest_key]
              if not got.startswith('sha256:'): got='sha256:'+got
              if not expected.startswith('sha256:'): expected='sha256:'+expected
              assert got==expected,(got,expected)
          PY
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Static contract and permanent tests
        env: {PYTHONPATH: governance/football3}
        run: |
          set -euo pipefail
          python -m py_compile governance/football3/validate_nextgen_tactical_matchup_prereg_v1.py governance/football3/test_validate_nextgen_tactical_matchup_prereg_v1.py
          python governance/football3/validate_nextgen_tactical_matchup_prereg_v1.py --repo-root . | tee /tmp/validator.txt
          python governance/football3/test_validate_nextgen_tactical_matchup_prereg_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 18 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Existing formal V2 permanent regression
        env: {PYTHONPATH: 'football-data:football-data/research'}
        run: |
          set -euo pipefail
          python football-data/new_engine_v1/test_formal_fusion_v2.py 2>&1 | tee /tmp/formal-v2.txt
          grep -q 'Ran 13 tests' /tmp/formal-v2.txt
          grep -q '^OK$' /tmp/formal-v2.txt
      - name: Seal exact-HEAD STOP evidence
        id: names
        env: {CANDIDATE_SHA: '${{ steps.identity.outputs.candidate_sha }}'}
        run: |
          set -euo pipefail
          rm -rf _seal; mkdir -p _seal/code _seal/contract _seal/evidence _seal/workflow
          cp governance/football3/validate_nextgen_tactical_matchup_prereg_v1.py governance/football3/test_validate_nextgen_tactical_matchup_prereg_v1.py _seal/code/
          cp governance/football3/nextgen_tactical_matchup_prereg_contract_v1.json _seal/contract/
          cp .github/workflows/football3-nextgen-tactical-matchup-prereg-v1.yml _seal/workflow/
          cp /tmp/validator.txt /tmp/tests.txt /tmp/formal-v2.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_seal')
          receipt={'schema_version':'football3-nextgen-tactical-matchup-prereg-receipt-v1','status':'STOP_DATA_COVERAGE','candidate_id':'V3-C6-SINGLE-LOW-DIMENSIONAL-TACTICAL-MATCHUP','candidate_head':os.environ['CANDIDATE_SHA'],'canonical_exact_base':os.environ['EXACT_BASE'],'formal_model_head':os.environ['FORMAL_HEAD'],'current_sha256':os.environ['CURRENT_SHA256'],'research_only':True,'candidate_status':'NOT_AVAILABLE','weight':0,'matrix_delta':0,'new_target_labels_read':False,'legacy_1335_target_labels_read':False,'legacy_1335_interim_scoring':False,'legacy_receipts_rebound':False,'training_performed':False,'tuning_performed':False,'formal_v2_unchanged':True,'current_changed':False,'formal_weights_changed':False,'production_changed':False}
          (r/'evidence'/'candidate6_prereg_receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          files={}
          for p in sorted(r.rglob('*')):
            if p.is_file():
              b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          m={'schema_version':'football3-nextgen-tactical-matchup-prereg-artifact-v1','status':receipt['status'],'candidate_id':receipt['candidate_id'],'candidate_head':receipt['candidate_head'],'canonical_exact_base':receipt['canonical_exact_base'],'formal_model_head':receipt['formal_model_head'],'current_sha256':receipt['current_sha256'],'protected_legacy_dev_head':os.environ['LEGACY_DEV_HEAD'],'protected_legacy_pros_head':os.environ['LEGACY_PROS_HEAD'],'changed_file_count':4,'files':files}
          (r/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
          artifact_name="football3-nextgen-tactical-matchup-prereg-${CANDIDATE_SHA}-${GITHUB_RUN_ID}"; echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.names.outputs.artifact_name }}', path: _seal, if-no-files-found: error, retention-days: 30}
  remote-readback:
    needs: validate-and-seal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with: {name: '${{ needs.validate-and-seal.outputs.artifact_name }}', path: _readback}
      - name: Verify sealed STOP receipt
        env: {CANDIDATE_SHA: '${{ needs.validate-and-seal.outputs.candidate_sha }}'}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_readback'); m=json.loads((r/'artifact_manifest.json').read_text()); x=json.loads((r/'evidence'/'candidate6_prereg_receipt.json').read_text())
          assert m['status']=='STOP_DATA_COVERAGE' and m['candidate_head']==os.environ['CANDIDATE_SHA'] and m['canonical_exact_base']==os.environ['EXACT_BASE']
          assert x['candidate_status']=='NOT_AVAILABLE' and x['weight']==0 and x['matrix_delta']==0
          assert not x['new_target_labels_read'] and not x['legacy_1335_target_labels_read'] and not x['legacy_1335_interim_scoring'] and not x['legacy_receipts_rebound'] and not x['training_performed'] and not x['tuning_performed']
          actual={p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file() and p.name!='artifact_manifest.json'}; assert actual==set(m['files'])
          for rel,meta in m['files'].items():
            b=(r/rel).read_bytes(); assert hashlib.sha256(b).hexdigest()==meta['sha256'] and len(b)==meta['bytes']
          print('NEXTGEN_TACTICAL_MATCHUP_PREREG_REMOTE_READBACK_PASS')
          PY
