name: football3 Batch-002 stage1 S80 robust compact draw

on:
  push:
    branches:
      - football3/batch002-stage1-s80-robust-compact-draw
    paths:
      - football-data/experiments/batch002_stage1_s80_robust_compact_draw/run_batch002_s80.py
      - football-data/experiments/batch002_stage1_s80_robust_compact_draw/s80_driver.py
      - .github/workflows/football3-batch002-stage1-s80-robust-compact-draw.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch002-stage1-s80-robust-compact-draw
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Generate locked Batch-002 S80 predictions
        run: |
          cd football-data/experiments/batch002_stage1_s80_robust_compact_draw
          python s80_driver.py
      - name: Persist compact diagnostic on failure
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f football-data/experiments/batch002_stage1_s80_robust_compact_draw/results/error_batch002_s80.json ]; then
            git add football-data/experiments/batch002_stage1_s80_robust_compact_draw/results/error_batch002_s80.json
            git commit -m '[diagnostic] football3 Batch-002 S80 failure' || true
            git fetch origin football3/batch002-stage1-s80-robust-compact-draw
            git rebase origin/football3/batch002-stage1-s80-robust-compact-draw
            git push origin HEAD:football3/batch002-stage1-s80-robust-compact-draw
          fi
      - name: Verify Batch-002 S80 lock contract
        run: python football-data/experiments/batch002_stage1_s80_robust_compact_draw/run_batch002_s80.py verify
      - name: Upload Batch-002 S80 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch002-s80-robust-compact-draw
          path: football-data/experiments/batch002_stage1_s80_robust_compact_draw/results/batch002_s80_predictions_locked.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist locked predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch002_stage1_s80_robust_compact_draw/results/batch002_s80_predictions_locked.json
          git add football-data/experiments/batch002_stage1_s80_robust_compact_draw/data/mapping_audit_batch002_s80.json
          git commit -m '[locked] football3 Batch-002 S80 robust compact-draw predictions' || true
          git fetch origin football3/batch002-stage1-s80-robust-compact-draw
          git rebase origin/football3/batch002-stage1-s80-robust-compact-draw
          git push origin HEAD:football3/batch002-stage1-s80-robust-compact-draw
