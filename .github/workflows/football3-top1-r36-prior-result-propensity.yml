name: football3 top1 R36 prior result propensity

on:
  push:
    branches:
      - football3/top1-r36-prior-result-propensity
    paths:
      - football-data/experiments/top1_r36_prior_result_propensity/run_experiment_r36.py
      - .github/workflows/football3-top1-r36-prior-result-propensity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r36:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r36-prior-result-propensity
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R36 prior result propensity
        run: python football-data/experiments/top1_r36_prior_result_propensity/run_experiment_r36.py run
      - name: Verify R36 contract
        run: python football-data/experiments/top1_r36_prior_result_propensity/run_experiment_r36.py verify
      - name: Persist R36 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r36_prior_result_propensity/results/summary_r36.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R36 prior result propensity'
            git fetch origin football3/top1-r36-prior-result-propensity
            git rebase origin/football3/top1-r36-prior-result-propensity
            git push origin HEAD:football3/top1-r36-prior-result-propensity
          fi
      - name: Upload R36 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r36-prior-result-propensity
          path: football-data/experiments/top1_r36_prior_result_propensity/results/summary_r36.json
          if-no-files-found: error
          retention-days: 90
