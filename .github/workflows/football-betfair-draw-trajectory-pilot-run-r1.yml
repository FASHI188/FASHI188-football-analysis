name: Football Betfair Draw Trajectory Pilot R1 — Consumed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumed-block:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/betfair-draw-trajectory-pilot-run-r1
          persist-credentials: false
      - name: Verify consumed receipt and block all reruns before external access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('football-data/research/betfair_draw_trajectory_pilot_r1/run_consumed_receipt.json').read_text(encoding='utf-8'))
          assert receipt['rerun_allowed'] is False
          assert receipt['formal_weight'] == 0
          assert receipt['current_match_use_allowed'] is False
          assert receipt['formal_ev_allowed'] is False
          print({
            'status': 'BLOCKED_ONE_TIME_RUN_ALREADY_CONSUMED',
            'external_source_accessed': False,
            'winner_labels_read': 0,
            'execution_head': receipt['execution_head'],
            'workflow_run': receipt['workflow_run']
          })
          raise SystemExit('The one-time authorization has been consumed. Rerun is prohibited.')
          PY
