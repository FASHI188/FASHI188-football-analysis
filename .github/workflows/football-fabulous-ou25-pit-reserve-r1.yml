name: Football fabul0us OU25 PIT reserve R1

on:
  push:
    branches: [research/anonymous-data-reserve-r1]
    paths:
      - '.github/workflows/football-fabulous-ou25-pit-reserve-r1.yml'

permissions:
  contents: read

jobs:
  join-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Anonymous download, zero-label kickoff join, seal 400-match batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fab football-data/research/anonymous_data_reserve_r1/fabulous_ou25_pit
          curl -sS -L --fail --retry 2 --max-time 600 \
            'https://huggingface.co/datasets/fabul0us/football_odds_2023-24/resolve/211feb35f9dcd270bd7a1b27b39a8b1f45f239aa/match_odds.csv?download=true' \
            -o /tmp/fab/match_odds.csv
          curl -sS -L --fail --retry 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/fixtures.parquet?download=true' \
            -o /tmp/fab/fixtures.parquet
          curl -sS -L --fail --retry 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/teams.parquet?download=true' \
            -o /tmp/fab/teams.parquet
          python -m pip -q install pyarrow rapidfuzz unidecode
          python - <<'PY'
          import csv,json,hashlib,math,re
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from collections import defaultdict
          import pyarrow.parquet as pq
          from rapidfuzz.fuzz import ratio
          from unidecode import unidecode

          SRC_SHA='c0e8854302159e1a8c529463f33280b728909c5e0ba95262515a7a144a43aa2a'
          FIX_SHA='7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7'
          src=Path('/tmp/fab/match_odds.csv'); fp=Path('/tmp/fab/fixtures.parquet'); tp=Path('/tmp/fab/teams.parquet')
          assert hashlib.sha256(src.read_bytes()).hexdigest()==SRC_SHA
          assert hashlib.sha256(fp.read_bytes()).hexdigest()==FIX_SHA
          team_sha=hashlib.sha256(tp.read_bytes()).hexdigest()
          outdir=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_pit')

          def dt(x):
              if x is None:return None
              if isinstance(x,datetime):
                  return x.replace(tzinfo=timezone.utc) if x.tzinfo is None else x.astimezone(timezone.utc)
              s=str(x).strip().replace('Z','+00:00')
              try:
                  z=datetime.fromisoformat(s)
              except Exception:
                  try:z=datetime.strptime(s,'%Y-%m-%d %H:%M:%S.%f')
                  except Exception:
                      try:z=datetime.strptime(s,'%Y-%m-%d %H:%M:%S')
                      except Exception:return None
              return z.replace(tzinfo=timezone.utc) if z.tzinfo is None else z.astimezone(timezone.utc)

          def norm(s):
              s=unidecode(str(s or '')).lower()
              s=re.sub(r'\b(fc|cf|afc|ac|ssc|calcio|club|football|futbol|deportivo|sporting)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return ' '.join(s.split())

          # Small translation/legacy alias bridge; fixed before any outcome access.
          alias={
            'lipsia':'rb leipzig','colonia':'koln','stoccarda':'vfb stuttgart','friburgo':'sc freiburg',
            'eintracht francofort':'eintracht frankfurt','monchengladbach':'borussia monchengladbach',
            'bayern':'bayern munich','dortmund':'borussia dortmund','leverkusen':'bayer leverkusen',
            'union berlino':'union berlin','paris saint germain':'paris saint germain','milan':'ac milan',
            'inter':'inter milan','roma':'as roma','napoli':'ssc napoli','verona':'hellas verona',
            'atletico madrid':'atletico madrid','barcellona':'barcelona','real sociedad':'real sociedad',
            'athletic bilbao':'athletic club','betis':'real betis','siviglia':'sevilla',
            'girona':'girona','alaves':'alaves','cadice':'cadiz','maiorka':'mallorca',
            'psg':'paris saint germain'
          }
          alias={norm(k):norm(v) for k,v in alias.items()}
          def canon(s):
              n=norm(s); return alias.get(n,n)

          # Aggregate source solely by pre-match market identity/timestamps. No outcome columns exist.
          groups={}
          with src.open('r',encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f)
              for row in r:
                  h=row.get('home_team','').strip(); a=row.get('away_team','').strip(); c=row.get('competition','').strip()
                  ts=dt(row.get('U/O 2.5 timestamp'))
                  try:
                      u=float(row.get('odds_under_2.5','')); o=float(row.get('odds_over_2.5',''))
                      valid=math.isfinite(u) and math.isfinite(o) and u>1 and o>1
                  except Exception: valid=False
                  if not(h and a and c and ts and valid): continue
                  key=(h,a,c)
                  g=groups.setdefault(key,{'home':h,'away':a,'competition':c,'timestamps':set(),'rows':0})
                  g['timestamps'].add(ts); g['rows']+=1
          for g in groups.values():
              ss=sorted(g['timestamps']); g['min_ts']=ss[0]; g['max_ts']=ss[-1]; g['n_ts']=len(ss)

          # Teams: discover ID/name columns without touching outcomes.
          tpf=pq.ParquetFile(tp); tcols=tpf.schema.names
          idc='id' if 'id' in tcols else ('team_id' if 'team_id' in tcols else None)
          namec='name' if 'name' in tcols else ('team_name' if 'team_name' in tcols else None)
          assert idc and namec, tcols
          tt=pq.read_table(tp,columns=[idc,namec])
          team_name={int(i):str(n) for i,n in zip(tt[idc].to_pylist(),tt[namec].to_pylist()) if i is not None and n is not None}

          # Fixtures: only identity/time/status fields; goal/result fields never read.
          ft=pq.read_table(fp,columns=['id','date_utc','is_played','league_id','home_team_id','away_team_id'])
          fixtures=[]
          for fid,kick,played,lid,hid,aid in zip(*(ft[c].to_pylist() for c in ['id','date_utc','is_played','league_id','home_team_id','away_team_id'])):
              if not played or fid is None or hid is None or aid is None: continue
              k=dt(kick)
              if k is None:continue
              # 2023-24 search envelope only; identity/time only.
              if not(datetime(2023,7,1,tzinfo=timezone.utc)<=k<=datetime(2024,6,30,23,59,59,tzinfo=timezone.utc)):continue
              hn=team_name.get(int(hid)); an=team_name.get(int(aid))
              if not hn or not an:continue
              fixtures.append({'id':int(fid),'kickoff':k,'home':hn,'away':an,'home_n':canon(hn),'away_n':canon(an),'league_id':lid})

          # Candidate index by time; match source pair using fixed fuzzy thresholds and temporal constraint.
          matched=[]; ambiguous=[]; unmatched=[]
          for key,g in groups.items():
              if g['n_ts']<2: continue
              sh=canon(g['home']); sa=canon(g['away']); mx=g['max_ts']
              cand=[]
              for f in fixtures:
                  lead=(f['kickoff']-mx).total_seconds()/3600
                  # data card says no live odds; accept only last quote 0.25h..14d before kickoff.
                  if lead<0.25 or lead>336: continue
                  hs=ratio(sh,f['home_n']); aas=ratio(sa,f['away_n'])
                  if hs<68 or aas<68: continue
                  pair=(hs+aas)/2
                  # time proximity gently breaks ties but cannot rescue bad names.
                  score=pair - min(20,lead/48)
                  cand.append((score,pair,lead,f))
              cand.sort(key=lambda x:x[0],reverse=True)
              if not cand:
                  unmatched.append({'home':g['home'],'away':g['away'],'competition':g['competition'],'max_ts':mx.isoformat(),'n_ts':g['n_ts']}); continue
              best=cand[0]
              # strict: good pair similarity; if second candidate is too close, reject ambiguity.
              if best[1]<78:
                  unmatched.append({'home':g['home'],'away':g['away'],'competition':g['competition'],'max_ts':mx.isoformat(),'n_ts':g['n_ts'],'best_pair_similarity':best[1]}); continue
              if len(cand)>1 and best[0]-cand[1][0]<8:
                  ambiguous.append({'home':g['home'],'away':g['away'],'competition':g['competition'],'n_ts':g['n_ts'],'best_fixture':best[3]['id'],'best_score':best[0],'second_fixture':cand[1][3]['id'],'second_score':cand[1][0]}); continue
              f=best[3]
              first_lead=(f['kickoff']-g['min_ts']).total_seconds()/3600
              last_lead=(f['kickoff']-g['max_ts']).total_seconds()/3600
              if last_lead<0.25: continue
              matched.append({
                'fixture_id':f['id'],'source_home':g['home'],'source_away':g['away'],'fixture_home':f['home'],'fixture_away':f['away'],
                'competition':g['competition'],'kickoff_utc':f['kickoff'].isoformat(),'first_quote_hours_before':first_lead,
                'last_quote_hours_before':last_lead,'distinct_ou25_timestamps':g['n_ts'],'source_rows':g['rows'],'pair_similarity':best[1]
              })

          # Deduplicate any accidental two-source-identities->same fixture; reject duplicates entirely.
          byfid=defaultdict(list)
          for m in matched: byfid[m['fixture_id']].append(m)
          dup_fids={fid for fid,x in byfid.items() if len(x)>1}
          matched=[m for m in matched if m['fixture_id'] not in dup_fids]

          # Strong reserve gate: >=2 real distinct timestamps, last observation >=1h pre-kickoff.
          reserve=[m for m in matched if m['distinct_ou25_timestamps']>=2 and m['last_quote_hours_before']>=1.0]
          seed='FABULOUS-OU25-PIT-RESERVE-20260817-R1'
          reserve=sorted(reserve,key=lambda m:hashlib.sha256(f"{seed}|{m['fixture_id']}".encode()).hexdigest())
          batch_size=400; batches=[]; used=0
          for i in range(0,len(reserve),batch_size):
              b=reserve[i:i+batch_size]
              if len(b)<300:break
              bid=f'FAB-OU25-PIT-B{len(batches)+1:02d}'
              payload={'schema_version':'FAB-OU25-PIT-BATCH-R1','batch_id':bid,'status':'SEALED_UNOPENED','batch_size':len(b),
                       'source_revision':'211feb35f9dcd270bd7a1b27b39a8b1f45f239aa','source_csv_sha256':SRC_SHA,
                       'selection_uses_outcomes':False,'outcome_values_dereferenced':0,
                       'pit_gate':'unique zero-label team-pair/kickoff join; >=2 distinct OU2.5 timestamps; last timestamp >=1h before kickoff',
                       'matches':b}
              p=outdir/f'{bid}.json'; p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
              batches.append({'batch_id':bid,'n':len(b),'manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}); used+=len(b)

          def stat(vals):
              vals=sorted(vals)
              if not vals:return None
              return {'min':vals[0],'median':vals[len(vals)//2],'p90':vals[int(.9*(len(vals)-1))],'max':vals[-1]}
          inv={
            'schema_version':'FABULOUS-OU25-PIT-RESERVE-INVENTORY-R1',
            'source_csv_sha256':SRC_SHA,'kickoff_source_fixtures_sha256':FIX_SHA,'kickoff_source_teams_sha256':team_sha,
            'source_identity_groups':len(groups),'source_groups_ge2_timestamps':sum(g['n_ts']>=2 for g in groups.values()),
            'fixture_candidates_2023_24':len(fixtures),'strict_unique_matches':len(matched),'ambiguous_groups':len(ambiguous),'unmatched_groups':len(unmatched),
            'duplicate_fixture_ids_rejected':len(dup_fids),'reserve_gate_matches':len(reserve),
            'last_quote_hours_before_kickoff':stat([m['last_quote_hours_before'] for m in reserve]),
            'distinct_timestamps':stat([m['distinct_ou25_timestamps'] for m in reserve]),
            'sealed_batch_size':batch_size,'sealed_batches':len(batches),'sealed_matches':used,'unsealed_reserve_tail':len(reserve)-used,
            'batches':batches,'outcome_values_dereferenced':0,
            'fixture_fields_dereferenced':['id','date_utc','is_played','league_id','home_team_id','away_team_id'],
            'forbidden_outcome_fields_dereferenced':[],
            'hard_rule':'Open outcomes for at most one preregistered 300-500 match sealed batch per experiment; all other batches stay unopened.'
          }
          (outdir/'inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2)+'\n')
          (outdir/'join_diagnostics.json').write_text(json.dumps({'ambiguous':ambiguous[:100],'unmatched':unmatched[:100]},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(inv,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fabulous-ou25-pit-reserve-r1
          path: football-data/research/anonymous_data_reserve_r1/fabulous_ou25_pit/*.json
          retention-days: 30
