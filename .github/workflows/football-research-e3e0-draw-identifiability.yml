name: Football Research E3e-0 Draw Identifiability

# One-shot execution evidence branch only.
# PR #66 remains manual-dispatch-only and unchanged.
on:
  workflow_dispatch:
  push:
    branches:
      - research/e3e0-execution-20260731
    paths:
      - ".github/e3e0_run_request"

permissions:
  contents: read

concurrency:
  group: football-research-e3e0-draw-identifiability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-draw-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact research branch HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact research HEAD
        id: exact_head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "expected_head=${EXPECTED_HEAD}"
          echo "actual_head=${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"
          git diff --exit-code
          echo "sha=${actual_head}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2

      - name: Syntax check
        run: |
          python -m py_compile \
            football-data/research/e3e0_draw_identifiability.py \
            football-data/research/e3d1_direct_td_joint_head.py \
            football-data/research/market_joint_direct_outcome_e3b1.py

      - name: Verify isolated research contract
        run: |
          set -euo pipefail
          test -f football-data/research/contracts/e3e0_pure_hda_isolated_research_contract.md
          grep -F 'Status: `FROZEN_NO_RUN`' football-data/research/contracts/e3e0_pure_hda_isolated_research_contract.md
          grep -F 'formal_weight: `0`' football-data/research/contracts/e3e0_pure_hda_isolated_research_contract.md
          grep -F 'Exact-score, total-goal and BTTS statuses are `NOT_APPLICABLE`' football-data/research/contracts/e3e0_pure_hda_isolated_research_contract.md

      - name: Run research-only E3e-0 diagnosis
        env:
          PYTHONPATH: football-data/engine:football-data/validation:football-data/research
          PYTHONUTF8: "1"
        run: |
          python football-data/research/e3e0_draw_identifiability.py --print-summary

      - name: Verify source report HEAD
        if: success()
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report_path = Path("artifacts/research/e3e0_draw_identifiability/e3e0_draw_identifiability.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          recorded = report.get("repository_head")
          print({"actual_head": actual, "report_head": recorded})
          if recorded != actual:
              raise SystemExit("E3e-0 report HEAD mismatch")
          if report.get("sample", {}).get("count") != 6251:
              raise SystemExit("E3e-0 fixed sample contract failed")
          if report.get("b100", {}).get("count") != 100:
              raise SystemExit("E3e-0 B100 contract failed")
          PY

      - name: Upload E3e-0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-e3e0-draw-identifiability-${{ steps.exact_head.outputs.sha }}
          path: artifacts/research/e3e0_draw_identifiability/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected formal assets were not changed
        if: always()
        run: |
          git diff --exit-code -- football-data/models football-data/config football-data/processed football-data/raw
          git diff --exit-code
