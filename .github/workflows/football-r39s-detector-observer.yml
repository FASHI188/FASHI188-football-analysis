name: Football R39S Detector Observer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-evidence-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm historical detector evidence is frozen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/premierleague_rendered_lineup_r39s/terminal_receipt_r39s.json').read_text())
          assert r['detector_confirmation']['workflow_run_id']==31365268494
          assert r['detector_confirmation']['artifact_id']==9053889041
          assert r['detector_confirmation']['run_conclusion']=='success'
          print('R39S_DETECTOR_OBSERVER_FROZEN')
          PY
