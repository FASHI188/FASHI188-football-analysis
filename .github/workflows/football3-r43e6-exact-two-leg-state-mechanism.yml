name: football3 R43E6 exact two leg state mechanism

on:
  push:
    branches:
      - football3/r43e6-exact-two-leg-state-mechanism
    paths:
      - football-data/experiments/r43e6_exact_two_leg_state_mechanism/**
      - .github/workflows/football3-r43e6-exact-two-leg-state-mechanism.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43e6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43e6-exact-two-leg-state-mechanism
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Run R43E6 exact two-leg state test
        run: python football-data/experiments/r43e6_exact_two_leg_state_mechanism/run_r43e6.py
      - name: Verify R43E6 contract
        run: |
          python - <<'PY'
          import json
          p='football-data/experiments/r43e6_exact_two_leg_state_mechanism/results/summary_r43e6_exact_two_leg_state_mechanism.json'
          d=json.load(open(p))
          assert d['status']=='COMPLETE' and d['formal_weight']==0
          g=d['governance']
          assert g['target_90min_result_used_as_feature'] is False
          assert g['first_leg_90min_score_used_as_feature'] is True
          assert g['parameter_search'] is False
          assert g['feature_search_after_test'] is False
          assert g['no_manual_importance_bonus'] is True
          assert g['no_manual_draw_override'] is True
          assert g['r42l_lock_modified'] is False
          assert d['split']['test_n'] >= 200
          print('R43E6 contract verified')
          PY
      - name: Persist R43E6 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add football-data/experiments/r43e6_exact_two_leg_state_mechanism/results/summary_r43e6_exact_two_leg_state_mechanism.json
          if git diff --cached --quiet; then
            echo 'No evidence delta'
          else
            git commit -m '[r43e6] persist exact two-leg state evidence'
            git push origin HEAD:football3/r43e6-exact-two-leg-state-mechanism
          fi
      - name: Upload R43E6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43e6-exact-two-leg-state-mechanism
          path: football-data/experiments/r43e6_exact_two_leg_state_mechanism/results/summary_r43e6_exact_two_leg_state_mechanism.json
          if-no-files-found: error
          retention-days: 90
