name: football-v636-gold500

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/build_gold500_feature_library_v6360.py'
      - '.github/workflows/football-v636-gold500.yml'

permissions:
  contents: read

jobs:
  build-gold500:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install fixed dependency
        run: python -m pip install --disable-pip-version-check catboost==1.2.10

      - name: Compile
        run: python -m py_compile football-data/validation/build_gold500_feature_library_v6360.py

      - name: Build fixed Gold500 library
        run: python football-data/validation/build_gold500_feature_library_v6360.py

      - name: Upload Gold500 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6360-gold500-library
          path: |
            football-data/manifests/v6_gold500_feature_library_v6360_status.json
            football-data/manifests/gold500_v6360/gold500_features_v6360.jsonl
            football-data/manifests/gold500_v6360/gold500_development_labels_v6360.jsonl
          if-no-files-found: error
