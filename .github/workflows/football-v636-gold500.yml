name: football-v636-gold500

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/build_gold500_feature_library_v6360.py'
      - 'football-data/validation/build_gold500_feature_library_v6361.py'
      - '.github/workflows/football-v636-gold500.yml'

permissions:
  contents: write

jobs:
  build-gold500:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install fixed dependency
        run: python -m pip install --disable-pip-version-check catboost==1.2.10

      - name: Compile
        run: |
          python -m py_compile \
            football-data/validation/build_gold500_feature_library_v6360.py \
            football-data/validation/build_gold500_feature_library_v6361.py

      - name: Build fixed Gold500 library
        shell: bash
        run: |
          set +e
          python football-data/validation/build_gold500_feature_library_v6361.py 2>&1 | tee football-data/manifests/v6360_gold500_build.log
          status=${PIPESTATUS[0]}
          echo "builder_exit_status=${status}" | tee -a football-data/manifests/v6360_gold500_build.log
          exit ${status}

      - name: Persist successful Gold500 library
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            football-data/manifests/v6_gold500_feature_library_v6360_status.json \
            football-data/manifests/gold500_v6360/gold500_features_v6360.jsonl \
            football-data/manifests/gold500_v6360/gold500_development_labels_v6360.jsonl
          if git diff --cached --quiet; then
            echo "Gold500 files already persisted"
          else
            git commit -m "data(football): freeze V6.36 Gold500 benchmark library"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload Gold500 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6360-gold500-library
          path: |
            football-data/manifests/v6360_gold500_build.log
            football-data/manifests/v6_gold500_feature_library_v6360_status.json
            football-data/manifests/gold500_v6360/gold500_features_v6360.jsonl
            football-data/manifests/gold500_v6360/gold500_development_labels_v6360.jsonl
          if-no-files-found: warn
