name: football3 Batch-001 S60 baseline

on:
  push:
    branches:
      - football3/batch-001-s60-baseline-20260826
    paths:
      - .github/workflows/football3-batch-001-s60-baseline.yml
      - football-data/batches/batch-001/run_s60_pseudoprospective_baseline.py

permissions:
  contents: write

jobs:
  s60-baseline-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout S60 research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: football3/batch-001-s60-baseline-20260826

      - name: Fetch immutable Batch-001 identity lock
        run: |
          git fetch --depth=1 origin football3/batch-001-pseudo-prospective-lock-20260826:refs/remotes/origin/batch001-lock
          mkdir -p /tmp/football3-batch001
          git show refs/remotes/origin/batch001-lock:football-data/batches/batch-001/lock/batch001_zero_label_lock.csv > /tmp/football3-batch001/batch001_zero_label_lock.csv
          echo '028f6b1e3443bbd144a04941e2764365b861fcf2af6cca81402c1cc29ffa84a6  /tmp/football3-batch001/batch001_zero_label_lock.csv' | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked S60 runtime
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2 pyarrow==18.1.0

      - name: Fail if immutable S60 prediction lock already exists
        run: |
          test ! -e football-data/batches/batch-001/s60_baseline/batch001_s60_baseline_predictions.json
          test ! -e football-data/batches/batch-001/s60_baseline/receipt.json

      - name: Build strict-prior S60 baseline without target labels
        env:
          BATCH001_LOCK: /tmp/football3-batch001/batch001_zero_label_lock.csv
          BATCH001_S60_OUT: football-data/batches/batch-001/s60_baseline
        run: python football-data/batches/batch-001/run_s60_pseudoprospective_baseline.py

      - name: Verify S60 lock contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('football-data/batches/batch-001/s60_baseline')
          r = json.loads((p/'receipt.json').read_text())
          d = json.loads((p/'batch001_s60_baseline_predictions.json').read_text())
          assert r['status'] == 'S60_BASELINE_LOCKED_NO_TARGET_LABELS'
          assert r['rows'] == 100
          assert abs(r['mapping_coverage'] - 1.0) < 1e-15
          assert d['information_boundary']['target_result_fields_loaded'] is False
          assert d['information_boundary']['target_xg_loaded'] is False
          assert d['information_boundary']['target_market_prices_loaded'] is False
          assert d['information_boundary']['target_rows_used_to_update_state'] is False
          assert d['information_boundary']['earlier_batch_target_results_used_for_later_targets'] is False
          assert sum(r['top1_picks'].values()) == 100
          print('BATCH001_S60_LOCK_CONTRACT_OK')
          print(json.dumps(r, sort_keys=True))
          PY

      - name: Persist immutable S60 prediction snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/batches/batch-001/s60_baseline/batch001_s60_baseline_predictions.json
          git add football-data/batches/batch-001/s60_baseline/receipt.json
          if test -e football-data/batches/batch-001/s60_baseline/mapping_diagnostic.json; then git add football-data/batches/batch-001/s60_baseline/mapping_diagnostic.json; fi
          git commit -m 'data(football3): lock Batch-001 S60 pseudo-prospective baseline'
          git push origin HEAD:football3/batch-001-s60-baseline-20260826

      - name: Upload immutable S60 baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch-001-s60-baseline
          path: |
            football-data/batches/batch-001/s60_baseline/batch001_s60_baseline_predictions.json
            football-data/batches/batch-001/s60_baseline/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload mapping diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch-001-s60-baseline-diagnostic
          path: football-data/batches/batch-001/s60_baseline/mapping_diagnostic.json
          if-no-files-found: ignore
          retention-days: 30
