name: Football R44L3 Player Functional Draw 300

on:
  push:
    branches:
      - research/r44l3-player-functional-draw-300
    paths:
      - 'football-data/research/r44l3_player_functional_draw_300/**'
      - '.github/workflows/football-r44l3-player-functional-draw-300.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r44l3-player-functional-draw-300-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrospective-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prereg exists before execution
        shell: bash
        run: |
          test -f football-data/research/r44l3_player_functional_draw_300/prereg_r44l3.md
          git log -1 --format=%H -- football-data/research/r44l3_player_functional_draw_300/prereg_r44l3.md
          git log -1 --format=%H -- football-data/research/r44l3_player_functional_draw_300/run_r44l3.py
      - name: Run frozen research-only audit
        shell: bash
        run: |
          python football-data/research/r44l3_player_functional_draw_300/run_r44l3.py | tee r44l3_stdout.txt
      - name: Audit protected formal assets unchanged by worktree execution
        shell: bash
        run: |
          git diff --exit-code -- . ':!r44l3_output/**' ':!r44l3_stdout.txt'
      - name: Upload R44L3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-r44l3-player-functional-draw-300-${{ github.sha }}-${{ github.run_id }}
          path: |
            r44l3_output/
            r44l3_stdout.txt
            football-data/research/r44l3_player_functional_draw_300/prereg_r44l3.md
          retention-days: 30
          if-no-files-found: error
