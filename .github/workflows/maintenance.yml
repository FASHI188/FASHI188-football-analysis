name: Formal Runtime Read-Only Maintenance

on:
  workflow_dispatch:
    inputs:
      retained_capability:
        description: "Optional explicitly retained capability to execute without repository persistence"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - runtime-maintenance-v473
          - formal-next-season-parameter-rollforward-v470
          - formal-next-season-runtime-readiness-v470
          - kambi-formal-domain-coverage-v6852
          - workflow-stability-v474
          - formal-prediction-queue-v501
  pull_request:
    paths:
      - "football-data/engine/formal_ev_lomo_gate_v470.py"
      - "football-data/engine/formal_governance_runtime_v470.py"
      - "football-data/engine/formal_next_season_parameter_runtime_v470.py"
      - "football-data/engine/oof_next_season_runtime_v470.py"
      - "football-data/engine/promoted_challenger_runtime_gate_v470.py"
      - "football-data/engine/promoted_challenger_runtime_v470.py"
      - "football-data/engine/selective_direction_gate_v500.py"
      - "football-data/engine/run_formal_prediction_actionable.py"
      - "football-data/validation/activate_mls_d_conditional_runtime_v470.py"
      - "football-data/validation/activate_selective_direction_runtime_v501.py"
      - "football-data/validation/runtime_maintenance_v473.py"
      - "football-data/validation/formal_next_season_parameter_rollforward_v470.py"
      - "football-data/validation/formal_next_season_runtime_readiness_v470.py"
      - "football-data/validation/formal_prediction_queue_v501.py"
      - "football-data/validation/v6_kambi_formal_domain_coverage_v6852.py"
      - "football-data/validation/workflow_stability_audit_v474.py"
      - "football-data/validation/smoke_formal_ev_lomo_gate_v470.py"
      - "football-data/validation/smoke_*runtime_v470.py"
      - "football-data/validation/smoke_dynamic_strength_live_input_contract_v470.py"
      - "football-data/validation/smoke_selective_direction_runtime_v500.py"
      - "football-data/manifests/formal_ev_lomo_gate_v470_smoke.json"
      - "football-data/manifests/promotions/USA_MLS_d_conditional_v470*.json"
      - "football-data/manifests/promotions/ESP_LaLiga_selective_direction_v500*.json"
      - "football-data/manifests/v500_upgrade_status.json"
      - "football-data/manifests/v501_upgrade_status.json"
      - "governance/consolidated_capability_adjudication.json"
      - ".github/workflows/maintenance.yml"
  push:
    branches:
      - main
    paths:
      - "football-data/engine/formal_ev_lomo_gate_v470.py"
      - "football-data/engine/formal_governance_runtime_v470.py"
      - "football-data/engine/formal_next_season_parameter_runtime_v470.py"
      - "football-data/engine/oof_next_season_runtime_v470.py"
      - "football-data/engine/promoted_challenger_runtime_gate_v470.py"
      - "football-data/engine/promoted_challenger_runtime_v470.py"
      - "football-data/engine/selective_direction_gate_v500.py"
      - "football-data/engine/run_formal_prediction_actionable.py"
      - "football-data/validation/activate_mls_d_conditional_runtime_v470.py"
      - "football-data/validation/activate_selective_direction_runtime_v501.py"
      - "football-data/validation/runtime_maintenance_v473.py"
      - "football-data/validation/formal_next_season_parameter_rollforward_v470.py"
      - "football-data/validation/formal_next_season_runtime_readiness_v470.py"
      - "football-data/validation/formal_prediction_queue_v501.py"
      - "football-data/validation/v6_kambi_formal_domain_coverage_v6852.py"
      - "football-data/validation/workflow_stability_audit_v474.py"
      - "football-data/validation/smoke_formal_ev_lomo_gate_v470.py"
      - "football-data/validation/smoke_*runtime_v470.py"
      - "football-data/validation/smoke_dynamic_strength_live_input_contract_v470.py"
      - "football-data/validation/smoke_selective_direction_runtime_v500.py"
      - "football-data/manifests/formal_ev_lomo_gate_v470_smoke.json"
      - "football-data/manifests/promotions/USA_MLS_d_conditional_v470*.json"
      - "football-data/manifests/promotions/ESP_LaLiga_selective_direction_v500*.json"
      - "football-data/manifests/v500_upgrade_status.json"
      - "football-data/manifests/v501_upgrade_status.json"
      - "governance/consolidated_capability_adjudication.json"
      - ".github/workflows/maintenance.yml"

permissions:
  contents: read

concurrency:
  group: formal-runtime-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile formal runtime and explicitly retained capability chain
        run: |
          python -m py_compile \
            football-data/engine/formal_ev_lomo_gate_v470.py \
            football-data/engine/formal_governance_runtime_v470.py \
            football-data/engine/formal_next_season_parameter_runtime_v470.py \
            football-data/engine/oof_next_season_runtime_v470.py \
            football-data/engine/promoted_challenger_runtime_gate_v470.py \
            football-data/engine/promoted_challenger_runtime_v470.py \
            football-data/engine/run_formal_prediction_actionable.py \
            football-data/engine/selective_direction_gate_v500.py \
            football-data/validation/activate_mls_d_conditional_runtime_v470.py \
            football-data/validation/activate_selective_direction_runtime_v501.py \
            football-data/validation/runtime_maintenance_v473.py \
            football-data/validation/formal_next_season_parameter_rollforward_v470.py \
            football-data/validation/formal_next_season_runtime_readiness_v470.py \
            football-data/validation/formal_prediction_queue_v501.py \
            football-data/validation/v6_kambi_formal_domain_coverage_v6852.py \
            football-data/validation/workflow_stability_audit_v474.py \
            football-data/validation/smoke_formal_ev_lomo_gate_v470.py \
            football-data/validation/smoke_formal_governance_runtime_v470.py \
            football-data/validation/smoke_oof_next_season_runtime_v470.py \
            football-data/validation/smoke_promoted_mls_d_runtime_v470.py \
            football-data/validation/smoke_selective_direction_runtime_v500.py
      - name: Verify committed hash-bound activations
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python football-data/validation/activate_selective_direction_runtime_v501.py --check
          python football-data/validation/activate_mls_d_conditional_runtime_v470.py --check
      - name: Run consolidated formal runtime smokes
        env:
          PYTHONPATH: football-data/engine:football-data/validation
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python football-data/validation/smoke_formal_ev_lomo_gate_v470.py
          python football-data/validation/smoke_formal_governance_runtime_v470.py
          python football-data/validation/smoke_selective_direction_runtime_v500.py
          python football-data/validation/smoke_promoted_mls_d_runtime_v470.py
          python football-data/validation/smoke_formal_next_season_parameter_runtime_v470.py
          python football-data/validation/smoke_oof_next_season_runtime_v470.py
          python football-data/validation/smoke_dynamic_strength_live_input_contract_v470.py
          python football-data/validation/smoke_dynamic_strength_pre_oof_runtime_v470.py

      - name: Execute retained runtime maintenance capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'runtime-maintenance-v473' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/runtime_maintenance_v473.py --strict-exit --print-summary

      - name: Execute retained formal parameter rollforward capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'formal-next-season-parameter-rollforward-v470' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python football-data/validation/formal_next_season_parameter_rollforward_v470.py

      - name: Execute retained formal runtime readiness capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'formal-next-season-runtime-readiness-v470' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/formal_next_season_runtime_readiness_v470.py

      - name: Execute retained Kambi formal-domain coverage capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'kambi-formal-domain-coverage-v6852' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python football-data/validation/v6_kambi_formal_domain_coverage_v6852.py

      - name: Execute retained workflow stability capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'workflow-stability-v474' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/workflow_stability_audit_v474.py --strict-exit --print-summary

      - name: Execute retained formal prediction queue capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'formal-prediction-queue-v501' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python football-data/validation/formal_prediction_queue_v501.py

      - name: Prove no repository persistence path is present
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "no staged repository mutation"
          else
            echo "unexpected staged repository mutation" >&2
            git diff --cached --stat >&2
            exit 2
          fi
          if ! git diff --quiet; then
            echo "ephemeral local receipts were generated; they are intentionally not committed or pushed"
            git diff --stat
          fi
