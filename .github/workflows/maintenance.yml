name: Repository Runtime Read-Only Maintenance

on:
  workflow_dispatch:
    inputs:
      retained_capability:
        description: "Optional V5.1-authorized maintenance capability"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - runtime-maintenance-v473
          - workflow-stability-v474
  pull_request:
    paths:
      - ".github/workflows/**"
      - "governance/**"
      - "scripts/governance/**"
      - "football-data/validation/runtime_maintenance_v473.py"
      - "football-data/validation/workflow_stability_audit_v474.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "governance/**"
      - "scripts/governance/**"
      - "football-data/validation/runtime_maintenance_v473.py"
      - "football-data/validation/workflow_stability_audit_v474.py"

permissions:
  contents: read

concurrency:
  group: repository-runtime-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -q PyYAML
      - name: Compile V5.1 governance and retained maintenance chain
        run: |
          python -m py_compile \
            scripts/governance/v510_workflow_acceptance.py \
            scripts/governance/verify_v510_capabilities.py \
            scripts/governance/verify_powershell_acceptance_parity.py \
            football-data/validation/runtime_maintenance_v473.py \
            football-data/validation/workflow_stability_audit_v474.py
      - name: Validate V5.1 active workflows
        run: python scripts/governance/v510_workflow_acceptance.py --strict
      - name: Validate effective retained capability ownership
        run: python scripts/governance/verify_v510_capabilities.py --target maintenance.yml --require-archived

      - name: Execute retained repository runtime maintenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'runtime-maintenance-v473' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/runtime_maintenance_v473.py --strict-exit --print-summary

      - name: Execute retained workflow stability audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retained_capability == 'workflow-stability-v474' }}
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/workflow_stability_audit_v474.py --strict-exit --print-summary

      - name: Prove no repository persistence path is present
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "no staged repository mutation"
          else
            echo "unexpected staged repository mutation" >&2
            git diff --cached --stat >&2
            exit 2
          fi
          if ! git diff --quiet; then
            echo "ephemeral local receipts were generated; they are intentionally not committed or pushed"
            git diff --stat
          fi
