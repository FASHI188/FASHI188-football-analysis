name: football3-c072f2-ou25-movement-forward-confirm

on:
  pull_request:
    branches:
      - football3/c072e2-ou25-movement-directt-20260819
    paths:
      - 'football-data/research/C072F2_OU25_MOVEMENT_FORWARD_CONFIRM_CONTRACT.md'
      - 'football-data/research/evaluate_c072f2_ou25_movement_forward_confirm.py'
      - '.github/workflows/football3-c072f2-ou25-movement-forward-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==2.1.3 scikit-learn==1.7.1
      - name: Frozen one-shot contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072F2_OU25_MOVEMENT_FORWARD_CONFIRM_CONTRACT.md').read_text()
          assert 'first and only permitted opening' in c
          assert 'C073-C077 remain quarantined' in c
          assert '5,000 reps' in c and 'seed 72023' in c
          print('confirmation contract guard: PASS')
          PY
      - name: Run one-shot forward confirmation
        run: python football-data/research/evaluate_c072f2_ou25_movement_forward_confirm.py
      - name: Boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072f2_summary.json').read_text())
          b=x['boundary']
          assert b['replacement_rows'] == 0
          assert b['C073_C077_quarantined'] is True
          assert b['C070F_confirmation1597_opened'] is False
          assert b['formal_weight'] == 0
          print('boundary guard: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072f2-forward-confirmation
          path: football-data/research/c072f2_summary.json
