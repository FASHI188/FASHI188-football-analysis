name: Football3 J1 2024 Free Pack Verify V1

on:
  workflow_dispatch:
    inputs:
      download_page_url:
        description: 'Exact Hudl public J1 2024 download page URL supplied by the user'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: football3-j1-2024-free-pack-verify-v1
  cancel-in-progress: false

jobs:
  verify:
    name: Research-only temporary payload verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGE_URL: ${{ inputs.download_page_url }}
      WORKDIR: ${{ runner.temp }}/football3-j1-2024-free-pack-verify
    steps:
      - name: Prepare isolated runner temp directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/raw" "$WORKDIR/extracted" "$WORKDIR/report"
          umask 077
          printf '%s\n' "$PAGE_URL" > "$WORKDIR/report/requested_page_url.txt"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$WORKDIR/report/access_started_at_utc.txt"

      - name: Fetch public download page without cookies or credentials
        id: page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, urllib.parse
          u = urllib.parse.urlparse(os.environ['PAGE_URL'])
          if u.scheme != 'https' or u.hostname not in {'www.hudl.com','hudl.com'}:
              print('FAIL: download page must be HTTPS on hudl.com', file=sys.stderr)
              sys.exit(20)
          if '/gc/download/free-data-japans-2024-j1-league' not in u.path:
              print('FAIL: unexpected Hudl path', file=sys.stderr)
              sys.exit(21)
          PY
          curl --fail --silent --show-error --location --max-redirs 5 \
            --connect-timeout 20 --max-time 90 \
            -D "$WORKDIR/raw/page_headers.txt" \
            -o "$WORKDIR/raw/download_page.html" \
            -w '%{url_effective}\n%{http_code}\n' \
            "$PAGE_URL" > "$WORKDIR/raw/page_curl_meta.txt"
          cp "$WORKDIR/raw/page_headers.txt" "$WORKDIR/report/page_headers.txt"
          sha256sum "$WORKDIR/raw/download_page.html" > "$WORKDIR/report/download_page.sha256"
          stat -c '%s' "$WORKDIR/raw/download_page.html" > "$WORKDIR/report/download_page.size_bytes"
          sed -n '1p' "$WORKDIR/raw/page_curl_meta.txt" > "$WORKDIR/report/page_final_url.txt"
          sed -n '2p' "$WORKDIR/raw/page_curl_meta.txt" > "$WORKDIR/report/page_http_status.txt"

      - name: Resolve only static public download targets and fail closed on gates
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json, os, re, sys, urllib.parse

          work = Path(os.environ['WORKDIR'])
          html = (work/'raw/download_page.html').read_text(errors='replace')
          page_url = os.environ['PAGE_URL']

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.forms=[]; self.inputs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='a' and d.get('href'):
                      self.links.append((d.get('href'), d.get('download'), d.get('class',''), d.get('id','')))
                  if tag=='form': self.forms.append(d)
                  if tag=='input': self.inputs.append(d)
          p=P(); p.feed(html)

          lower=html.lower()
          password_input=any((i.get('type') or '').lower()=='password' for i in p.inputs)
          gate_words=bool(re.search(r'\b(sign[ -]?in|log[ -]?in|register|create account)\b', lower))
          agreement_checkbox=any((i.get('type') or '').lower()=='checkbox' and re.search(r'(agree|terms|consent|accept)', str(i).lower()) for i in p.inputs)

          candidates=[]
          for href, download_attr, cls, ident in p.links:
              absu=urllib.parse.urljoin(page_url, href)
              text=' '.join([href or '', download_attr or '', cls or '', ident or '']).lower()
              if any(k in text for k in ['download','.zip','.tar','.gz','.json','.csv','statsbomb','j1']):
                  candidates.append(absu)

          # Also discover literal URLs in page source; keep only likely downloadable resources.
          for m in re.finditer(r'https://[^\"\'<>\\s]+', html):
              u=m.group(0).replace('&amp;','&')
              lu=u.lower()
              if any(k in lu for k in ['download','.zip','.tar','.gz','.json','.csv','statsbomb','j1']):
                  candidates.append(u)

          def is_same_page(u):
              a=urllib.parse.urlparse(u); b=urllib.parse.urlparse(page_url)
              return (a.scheme,a.netloc,a.path)==(b.scheme,b.netloc,b.path)

          def looks_signed(u):
              q={k.lower() for k,_ in urllib.parse.parse_qsl(urllib.parse.urlparse(u).query, keep_blank_values=True)}
              signed={'x-amz-signature','x-amz-credential','x-amz-expires','awsaccesskeyid','signature','expires','x-goog-signature','x-goog-credential','x-goog-expires','sig','token'}
              return bool(q & signed)

          clean=[]
          for u in candidates:
              if is_same_page(u): continue
              pu=urllib.parse.urlparse(u)
              if pu.scheme not in {'https'}: continue
              if re.search(r'(login|signin|register|signup|account)', pu.path, re.I):
                  continue
              if looks_signed(u):
                  (work/'report/stop_reason.txt').write_text('SIGNED_OR_ONE_TIME_URL_DETECTED\n')
                  (work/'report/resolution.json').write_text(json.dumps({'candidates':candidates,'signed_url':u},indent=2))
                  sys.exit(31)
              clean.append(u)

          # Fail closed if the apparent flow has explicit credential/agreement gates and no static download target.
          if not clean:
              reason='NO_STATIC_PUBLIC_DOWNLOAD_URL'
              if password_input or gate_words: reason='LOGIN_OR_REGISTRATION_GATE_DETECTED'
              elif agreement_checkbox: reason='AGREEMENT_ACCEPTANCE_GATE_DETECTED'
              (work/'report/stop_reason.txt').write_text(reason+'\n')
              (work/'report/resolution.json').write_text(json.dumps({
                  'password_input':password_input,
                  'login_or_register_words':gate_words,
                  'agreement_checkbox':agreement_checkbox,
                  'form_count':len(p.forms),
                  'candidate_count':len(candidates),
                  'static_candidate_count':0
              },indent=2))
              sys.exit(32)

          # De-duplicate preserving order.
          seen=set(); clean=[u for u in clean if not (u in seen or seen.add(u))]
          (work/'report/resolution.json').write_text(json.dumps({
              'password_input':password_input,
              'login_or_register_words':gate_words,
              'agreement_checkbox':agreement_checkbox,
              'form_count':len(p.forms),
              'candidate_count':len(candidates),
              'static_candidates':clean
          },indent=2))
          (work/'raw/candidate_urls.txt').write_text('\n'.join(clean)+'\n')
          PY

      - name: Download candidate public payloads without cookie jar
        id: download
        shell: bash
        run: |
          set -euo pipefail
          : > "$WORKDIR/report/download_manifest.tsv"
          printf 'requested_url\tfinal_url\tdownloaded_at_utc\tsize_bytes\tsha256\tcontent_type\tcontent_disposition\tlocal_file\n' >> "$WORKDIR/report/download_manifest.tsv"
          n=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            n=$((n+1))
            hdr="$WORKDIR/raw/candidate_${n}.headers"
            body="$WORKDIR/raw/candidate_${n}.bin"
            meta="$WORKDIR/raw/candidate_${n}.meta"
            curl --fail --silent --show-error --location --max-redirs 5 \
              --connect-timeout 20 --max-time 180 \
              -D "$hdr" -o "$body" \
              -w '%{url_effective}\n%{http_code}\n%{content_type}\n' \
              "$u" > "$meta"
            final_url="$(sed -n '1p' "$meta")"
            http_code="$(sed -n '2p' "$meta")"
            ctype="$(sed -n '3p' "$meta")"
            disp="$(grep -i '^content-disposition:' "$hdr" | tail -1 | tr -d '\r' | cut -d: -f2- | sed 's/^ *//' || true)"
            python3 - "$final_url" <<'PY'
          import sys, urllib.parse
          u=sys.argv[1]
          q={k.lower() for k,_ in urllib.parse.parse_qsl(urllib.parse.urlparse(u).query, keep_blank_values=True)}
          bad={'x-amz-signature','x-amz-credential','x-amz-expires','awsaccesskeyid','signature','expires','x-goog-signature','x-goog-credential','x-goog-expires','sig','token'}
          if q & bad:
              raise SystemExit(41)
          PY
            # HTML response means the candidate did not resolve to a static payload; never submit forms or session state.
            if printf '%s' "$ctype" | grep -qi 'text/html'; then
              echo "HTML_OR_GATE_RESPONSE_FROM_CANDIDATE" > "$WORKDIR/report/stop_reason.txt"
              exit 42
            fi
            size="$(stat -c '%s' "$body")"
            sha="$(sha256sum "$body" | awk '{print $1}')"
            ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$u" "$final_url" "$ts" "$size" "$sha" "$ctype" "$disp" "candidate_${n}.bin" >> "$WORKDIR/report/download_manifest.tsv"
          done < "$WORKDIR/raw/candidate_urls.txt"

          # Require at least one non-trivial candidate payload.
          if [ "$n" -eq 0 ]; then
            echo "NO_PAYLOAD_DOWNLOADED" > "$WORKDIR/report/stop_reason.txt"
            exit 43
          fi

      - name: Extract payloads only inside runner temp
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          extracted_any=0
          for f in "$WORKDIR"/raw/candidate_*.bin; do
            kind="$(file -b "$f" || true)"
            case "$kind" in
              *Zip*)
                mkdir -p "$WORKDIR/extracted/$(basename "$f")"
                unzip -q "$f" -d "$WORKDIR/extracted/$(basename "$f")"
                extracted_any=1
                ;;
              *gzip*|*tar*)
                mkdir -p "$WORKDIR/extracted/$(basename "$f")"
                tar -xf "$f" -C "$WORKDIR/extracted/$(basename "$f")"
                extracted_any=1
                ;;
              *JSON*|*CSV*|*text*)
                cp "$f" "$WORKDIR/extracted/$(basename "$f")"
                extracted_any=1
                ;;
              *)
                # Keep raw candidate in temp but do not attempt unsafe extraction.
                ;;
            esac
          done
          if [ "$extracted_any" -ne 1 ]; then
            echo "NO_RECOGNIZED_STATIC_ARCHIVE_OR_DATA_FILE" > "$WORKDIR/report/stop_reason.txt"
            exit 50
          fi

      - name: Audit package structure, xG schema, and match identity only
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, json, os, re, sys

          work=Path(os.environ['WORKDIR'])
          root=work/'extracted'
          report=work/'report'
          files=[p for p in root.rglob('*') if p.is_file()]

          def sha256(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
              return h.hexdigest()

          structure=[]
          for p in files:
              structure.append({'path':str(p.relative_to(root)),'size_bytes':p.stat().st_size,'sha256':sha256(p)})
          (report/'package_file_structure.json').write_text(json.dumps(structure,indent=2,ensure_ascii=False))

          def find_one(names, patterns=()):
              exact=[]; fuzzy=[]
              lowers={n.lower() for n in names}
              for p in files:
                  if p.name.lower() in lowers: exact.append(p)
                  elif any(re.fullmatch(pat,p.name,re.I) for pat in patterns): fuzzy.append(p)
              found=exact or fuzzy
              return found[0] if len(found)==1 else None, [str(x.relative_to(root)) for x in found]

          events_path, events_candidates=find_one(
              ['Statsbomb-J1.League.json','Statsbomb_J1_League.json','sb_events.json'],
              [r'.*j1.*league.*\.json', r'sb[_-]?events\.json'])
          matches_path, matches_candidates=find_one(['sb_matches.json'],[r'sb[_-]?matches\.json'])
          mm_path, mm_candidates=find_one(['matches_mapping.csv'],[r'matches[_-]?mapping\.csv'])
          tm_path, tm_candidates=find_one(['teams_mapping.csv'],[r'teams[_-]?mapping\.csv'])

          required={
              'events':(events_path,events_candidates),
              'sb_matches':(matches_path,matches_candidates),
              'matches_mapping':(mm_path,mm_candidates),
              'teams_mapping':(tm_path,tm_candidates),
          }
          if any(v[0] is None for v in required.values()):
              (report/'schema_audit.json').write_text(json.dumps({'status':'FAIL_REQUIRED_FILES','required_candidates':{k:v[1] for k,v in required.items()}},indent=2))
              sys.exit(61)

          # Record target file provenance. Source URL is the downloaded object that contained the member;
          # this verifier intentionally does not invent per-member HTTP URLs.
          download_rows=[]
          with (report/'download_manifest.tsv').open(newline='') as f:
              download_rows=list(csv.DictReader(f,delimiter='\t'))
          source_urls=[r['final_url'] for r in download_rows]
          target_manifest=[]
          for label,p in [('Statsbomb-J1.League.json',events_path),('sb_matches.json',matches_path),('matches_mapping.csv',mm_path),('teams_mapping.csv',tm_path)]:
              target_manifest.append({
                  'requested_label':label,
                  'actual_member_path':str(p.relative_to(root)),
                  'size_bytes':p.stat().st_size,
                  'sha256':sha256(p),
                  'source_download_final_urls':source_urls,
              })
          (report/'target_files_manifest.json').write_text(json.dumps(target_manifest,indent=2,ensure_ascii=False))

          # Read only fields required for structure/identity audit. Do not inspect or emit score/result fields.
          events=json.loads(events_path.read_text(errors='strict'))
          if isinstance(events,dict):
              # Some exports wrap records in a top-level object.
              for key in ('events','data','records'):
                  if isinstance(events.get(key),list): events=events[key]; break
          if not isinstance(events,list):
              (report/'schema_audit.json').write_text(json.dumps({'status':'FAIL_EVENTS_NOT_LIST'},indent=2)); sys.exit(62)

          def getv(obj, *paths):
              for path in paths:
                  if path in obj: return obj.get(path)
                  cur=obj; ok=True
                  for part in path.split('.'):
                      if isinstance(cur,dict) and part in cur: cur=cur[part]
                      else: ok=False; break
                  if ok: return cur
              return None
          def has_path(obj, *paths):
              for path in paths:
                  if path in obj: return True
                  cur=obj; ok=True
                  for part in path.split('.'):
                      if isinstance(cur,dict) and part in cur: cur=cur[part]
                      else: ok=False; break
                  if ok: return True
              return False

          shot_total=0; xg_present=0; xg_nonnull=0; event_match_ids=set(); event_team_nonnull=0
          for e in events:
              if not isinstance(e,dict): continue
              mid=getv(e,'match_id','match.id')
              if mid is not None: event_match_ids.add(str(mid))
              if getv(e,'team.id','team_id') is not None: event_team_nonnull+=1
              typ=getv(e,'type.name','type_name','type')
              is_shot=(typ=='Shot') or (isinstance(typ,dict) and typ.get('name')=='Shot')
              if is_shot:
                  shot_total+=1
                  if has_path(e,'shot.statsbomb_xg','shot_statsbomb_xg'):
                      xg_present+=1
                      xv=getv(e,'shot.statsbomb_xg','shot_statsbomb_xg')
                      if xv is not None and xv!='': xg_nonnull+=1

          matches=json.loads(matches_path.read_text(errors='strict'))
          if isinstance(matches,dict):
              for key in ('matches','data','records'):
                  if isinstance(matches.get(key),list): matches=matches[key]; break
          if not isinstance(matches,list):
              (report/'schema_audit.json').write_text(json.dumps({'status':'FAIL_MATCHES_NOT_LIST'},indent=2)); sys.exit(63)

          match_ids=set(); identities={}; complete={'match_id':0,'home_team':0,'away_team':0,'date':0,'kickoff':0}
          for m in matches:
              if not isinstance(m,dict): continue
              mid=getv(m,'match_id','match.id')
              home=getv(m,'home_team.home_team_id','home_team.id','home_team_id','home_team.home_team_name','home_team.name')
              away=getv(m,'away_team.away_team_id','away_team.id','away_team_id','away_team.away_team_name','away_team.name')
              date=getv(m,'match_date','date','match.date')
              kickoff=getv(m,'kick_off','kickoff','kick_off_time','match_time','match.kick_off')
              vals={'match_id':mid,'home_team':home,'away_team':away,'date':date,'kickoff':kickoff}
              for k,v in vals.items():
                  if v is not None and v!='': complete[k]+=1
              if mid is not None:
                  s=str(mid); match_ids.add(s); identities[s]={'match_id':mid,'home_team':home,'away_team':away,'date':date,'kickoff':kickoff}

          def read_csv(path):
              with path.open(newline='',encoding='utf-8-sig') as f: return list(csv.DictReader(f))
          mm=read_csv(mm_path); tm=read_csv(tm_path)
          mm_fields=list(mm[0].keys()) if mm else []
          tm_fields=list(tm[0].keys()) if tm else []
          def choose_sb_id(fields):
              cands=[f for f in fields if 'statsbomb' in f.lower() and 'id' in f.lower()]
              if not cands: cands=[f for f in fields if f.lower() in {'sb_id','sb_match_id','match_id','statsbomb_id'}]
              return cands[0] if cands else None
          mm_id_col=choose_sb_id(mm_fields)
          mm_ids={str(r.get(mm_id_col)) for r in mm if mm_id_col and r.get(mm_id_col) not in (None,'')}

          missing_events=sorted(match_ids-event_match_ids)
          extra_events=sorted(event_match_ids-match_ids)
          missing_event_identities=[identities[x] for x in missing_events if x in identities]
          mapping_missing=sorted(match_ids-mm_ids) if mm_id_col else []
          mapping_extra=sorted(mm_ids-match_ids) if mm_id_col else []

          nmatch=len(matches)
          identity_rates={k:(complete[k]/nmatch if nmatch else 0.0) for k in complete}
          audit={
              'status':'AUDITED',
              'events_actual_path':str(events_path.relative_to(root)),
              'matches_actual_path':str(matches_path.relative_to(root)),
              'matches_mapping_actual_path':str(mm_path.relative_to(root)),
              'teams_mapping_actual_path':str(tm_path.relative_to(root)),
              'events_row_count':len(events),
              'unique_event_match_id_count':len(event_match_ids),
              'sb_matches_row_count':len(matches),
              'unique_sb_matches_match_id_count':len(match_ids),
              'shot_total':shot_total,
              'xg_field_path_detected':'shot.statsbomb_xg',
              'xg_field_present_count':xg_present,
              'xg_field_nonnull_count':xg_nonnull,
              'xg_field_present_rate':(xg_present/shot_total if shot_total else 0.0),
              'xg_field_nonnull_rate':(xg_nonnull/shot_total if shot_total else 0.0),
              'identity_complete_counts':complete,
              'identity_complete_rates':identity_rates,
              'matches_mapping_rows':len(mm),
              'matches_mapping_fields':mm_fields,
              'matches_mapping_statsbomb_id_column':mm_id_col,
              'matches_mapping_unique_statsbomb_ids':len(mm_ids),
              'matches_mapping_missing_from_mapping':mapping_missing,
              'matches_mapping_extra_vs_sb_matches':mapping_extra,
              'teams_mapping_rows':len(tm),
              'teams_mapping_fields':tm_fields,
              'event_match_ids_missing_vs_sb_matches':missing_events,
              'event_match_ids_extra_vs_sb_matches':extra_events,
              'missing_event_match_identities_no_results':missing_event_identities,
          }
          schema_pass=(
              len(match_ids)==380 and len(event_match_ids)==380 and
              shot_total>0 and xg_present==shot_total and xg_nonnull==shot_total and
              all(abs(identity_rates[k]-1.0)<1e-12 for k in identity_rates) and
              mm_id_col is not None and mm_ids==match_ids and len(mm)==380 and
              not missing_events and not extra_events
          )
          audit['payload_schema_pass']=schema_pass
          (report/'schema_audit.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False))

          # Human-readable missing list, explicitly excluding all score/result fields.
          with (report/'missing_matches_no_results.tsv').open('w',encoding='utf-8') as f:
              f.write('match_id\tdate\tkickoff\thome_team\taway_team\treason\n')
              for x in missing_event_identities:
                  f.write(f"{x.get('match_id','')}\t{x.get('date','')}\t{x.get('kickoff','')}\t{x.get('home_team','')}\t{x.get('away_team','')}\tMISSING_FROM_EVENT_PAYLOAD\n")
              for mid in mapping_missing:
                  x=identities.get(mid,{})
                  f.write(f"{x.get('match_id',mid)}\t{x.get('date','')}\t{x.get('kickoff','')}\t{x.get('home_team','')}\t{x.get('away_team','')}\tMISSING_FROM_MATCHES_MAPPING\n")

          if not schema_pass:
              sys.exit(64)
          PY

      - name: Search package and page for license or usage documents
        id: license
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, os, re, urllib.parse

          work=Path(os.environ['WORKDIR']); root=work/'extracted'; report=work/'report'
          files=[p for p in root.rglob('*') if p.is_file()]
          legal=[]
          name_re=re.compile(r'(^|[-_.])(readme|license|licence|terms|agreement|eula|copying|notice)([-_.]|$)',re.I)
          for p in files:
              if name_re.search(p.name):
                  legal.append({'name':p.name,'path':str(p.relative_to(root)),'size_bytes':p.stat().st_size})

          page=work/'raw/download_page.html'
          page_links=[]
          if page.exists():
              html=page.read_text(errors='replace')
              class P(HTMLParser):
                  def __init__(self): super().__init__(); self.links=[]
                  def handle_starttag(self,tag,attrs):
                      d=dict(attrs)
                      if tag=='a' and d.get('href'): self.links.append(d['href'])
              p=P(); p.feed(html)
              for href in p.links:
                  u=urllib.parse.urljoin(os.environ['PAGE_URL'],href)
                  if re.search(r'(terms|license|licence|agreement|conditions)',u,re.I): page_links.append(u)

          # Extract only short <=20-word keyword windows from package text files; do not infer legal meaning.
          excerpts=[]
          keywords=re.compile(r'\b(research|non[- ]?commercial|evaluation|model|store|storage|archive|derived|derivative|retain|retention|analysis|analyse|analyze)\b',re.I)
          for item in legal:
              p=root/item['path']
              if p.suffix.lower() in {'.txt','.md','.rst','.html','.htm','.csv',''} and p.stat().st_size < 2_000_000:
                  try: text=p.read_text(errors='replace')
                  except Exception: continue
                  words=re.findall(r'\S+',text)
                  for i,w in enumerate(words):
                      if keywords.search(w):
                          lo=max(0,i-8); hi=min(len(words),i+12)
                          excerpt=' '.join(words[lo:hi])
                          excerpts.append({'file':item['path'],'excerpt_max_20_words':excerpt})
                          if len([x for x in excerpts if x['file']==item['path']])>=8: break

          out={
              'dataset_specific_legal_files':legal,
              'download_page_legal_links':sorted(set(page_links)),
              'short_verbatim_keyword_windows':excerpts,
              'automatic_legal_conclusion':'HOLD',
              'reason':'No automated legal inference. LICENSE_PASS requires explicit dataset-specific permission for all four requested rights.'
          }
          (report/'license_evidence.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Build small fail-closed verification receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          work=Path(os.environ['WORKDIR']); r=work/'report'
          def readj(name):
              p=r/name
              if not p.exists(): return None
              try: return json.loads(p.read_text())
              except Exception: return None
          schema=readj('schema_audit.json') or {}
          lic=readj('license_evidence.json') or {}
          stop=(r/'stop_reason.txt').read_text().strip() if (r/'stop_reason.txt').exists() else None
          receipt={
              'schema':'football3-j1-2024-free-pack-minimal-verification-v1',
              'research_only':True,
              'model_run':False,
              'training':False,
              'tuning':False,
              'prediction':False,
              'oos_opened':False,
              'production_changes':False,
              'raw_data_uploaded_as_artifact':False,
              'access_stop_reason':stop,
              'license_status':'LICENSE_HOLD',
              'payload_schema_status':'PAYLOAD_SCHEMA_PASS' if schema.get('payload_schema_pass') else 'PAYLOAD_SCHEMA_FAIL',
              'unique_match_ids':schema.get('unique_sb_matches_match_id_count'),
              'event_unique_match_ids':schema.get('unique_event_match_id_count'),
              'shot_total':schema.get('shot_total'),
              'xg_field_path':schema.get('xg_field_path_detected'),
              'xg_present_rate':schema.get('xg_field_present_rate'),
              'xg_nonnull_rate':schema.get('xg_field_nonnull_rate'),
              'identity_complete_rates':schema.get('identity_complete_rates'),
              'missing_event_match_identities_no_results':schema.get('missing_event_match_identities_no_results'),
              'license_evidence_files':lic.get('dataset_specific_legal_files'),
              'eligible_for_j1_single_season_research_only_pilot':False,
              'eligibility_reason':'Requires human confirmation of dataset-specific license rights; no automatic transition to model evaluation.'
          }
          (r/'verification_receipt.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False))
          PY
          (cd "$WORKDIR/report" && sha256sum *.json *.tsv *.txt *.sha256 2>/dev/null | sort > SHA256SUMS.txt || true)

      - name: Upload report only, never raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-j1-2024-free-pack-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/football3-j1-2024-free-pack-verify/report/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Enforce fail-closed completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$WORKDIR/report/stop_reason.txt" ]; then
            echo "Stopped by access/gate policy: $(cat "$WORKDIR/report/stop_reason.txt")"
            exit 70
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json, os, sys
          p=Path(os.environ['WORKDIR'])/'report/verification_receipt.json'
          if not p.exists(): sys.exit(71)
          r=json.loads(p.read_text())
          # Schema may pass, but license remains HOLD until human review of dataset-specific terms.
          if r.get('payload_schema_status')!='PAYLOAD_SCHEMA_PASS': sys.exit(72)
          if r.get('license_status')!='LICENSE_HOLD': sys.exit(73)
          print('PAYLOAD_SCHEMA_PASS; LICENSE_HOLD; no model evaluation executed.')
          PY
