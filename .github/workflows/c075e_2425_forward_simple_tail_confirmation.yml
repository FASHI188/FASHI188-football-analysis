name: Football C075-E 2024-25 Forward Simple Tail Confirmation
on:
  push:
    branches: [research/c075e-2425-forward-simple-tail-confirmation-20260819]
    paths: [research/c075e_2425_forward_simple_tail_confirmation_contract.json, research/evaluate_c075e_2425_forward_simple_tail_confirmation.py, .github/workflows/c075e_2425_forward_simple_tail_confirmation.yml]
  pull_request:
    paths: [research/c075e_2425_forward_simple_tail_confirmation_contract.json, research/evaluate_c075e_2425_forward_simple_tail_confirmation.py, .github/workflows/c075e_2425_forward_simple_tail_confirmation.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-c075e-forward-confirmation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  one-shot-forward-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Install frozen runtime
        run: python -m pip install numpy==2.2.6 pandas==2.3.2
      - name: Clone pinned external source
        run: |
          git clone https://github.com/openfootball/football.json.git external-openfootball
          git -C external-openfootball checkout ea767ac28cf9a2d737bb3e4ce65aa4b1f4ac9361
      - name: Run one-shot forward confirmation
        run: |
          mkdir -p artifacts/c075e_confirmation
          python research/evaluate_c075e_2425_forward_simple_tail_confirmation.py --source-root external-openfootball --out-dir artifacts/c075e_confirmation
      - name: Enforce governance boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/c075e_confirmation/summary.json').read_text())
          assert s['schema_version']=='C075E_2425_FORWARD_SIMPLE_TAIL_CONFIRMATION_V1'
          assert s['external_identity']['count']==5388
          assert s['external_identity']['sha256']=='2d054e8d514a8d7bd6ce421ffe452876b3070b88871b12ca72eabc0061bb04f4'
          q=s['score_projection_boundary']; assert q['decoded_frozen_match_objects']==5388 and q['decoded_nonfrozen_match_objects']==0 and q['missing_replacement_count']==0 and q['external_parameter_refit'] is False and q['external_recalibration'] is False and q['C075C_consumed_tail_labels_reused'] is False
          b=s['protected_boundaries']; assert b['C071_reserve_52180_opened'] is False and b['C070F_confirmation1597_opened'] is False and b['A05_opened'] is False and b['protected_opened'] is False and b['T_ge_7_D_given_T_tested'] is False and b['unified_matrix_generated'] is False
          if s['status']!='STOP_COVERAGE_FORWARD_LABELS_CONSUMED':
              m=s['pooled_forward']['exact_tail_scores']; assert m['unenumerated_tail_residual']<=1e-8 and m['probability_sum_abs_residual']<=1e-10
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c075e-2425-forward-simple-tail-confirmation
          retention-days: 30
          path: |
            artifacts/c075e_confirmation/summary.json
            artifacts/c075e_confirmation/tail_confirmation_rows.csv
            artifacts/c075e_confirmation/score_projection_accounting.csv
            research/c075e_2425_forward_simple_tail_confirmation_contract.json
