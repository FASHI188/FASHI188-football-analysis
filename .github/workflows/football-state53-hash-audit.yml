name: football-state53-hash-audit
on:
  push:
    branches: [research/r55-ou-matched300-20260814]
    paths: ['.github/workflows/football-state53-hash-audit.yml']
permissions:
  contents: read
jobs:
  hash-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hash state files
        run: |
          sha256sum PROJECT_CURRENT.md LAST_HANDOFF.md ACTIVE_CHECKPOINT.md
          git rev-parse HEAD
