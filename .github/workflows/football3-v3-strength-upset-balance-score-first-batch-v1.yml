name: football3 V3 Strength Upset Balance Score First Batch

on:
  push:
    branches: ['football3/v3-strength-upset-balance-score-research-v1']
    paths:
      - '.github/workflows/football3-v3-strength-upset-balance-score-first-batch-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v3-strength-upset-balance-score-${{ github.sha }}
  cancel-in-progress: false

env:
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  STRESS_HEAD: b32944f1e0a973dd5ff3a2e87d72333d85d27051
  DATA_HEAD: 95757332b4ea3cd4d75db370d19ba83dfbf55601
  CONTRACT_BLOB: dc2a7877aa84d7f3fb8e8169743aa50755623b86
  SCOPE_BLOB: 0a42a6b28df1ca9f35990e8e10e3ead8af2eb756
  EVALUATOR_BLOB: b5a3f75ff1dd975b2df798661e73342927226c71
  TEST_BLOB: 3ba859eaf6f487148d22d586bd81cf7de886fc00
  EVALUATOR_SOURCE_SHA256: 0bb755363f757f4f7fcddf5690ec6beff7e66f49732028077ad9c82d3dfb36df
  STRESS_ARTIFACT_ID: '9876751277'
  STRESS_ARTIFACT_DIGEST: sha256:bc2fa9c21f55de74f180331d3d0cc5007c496ed426a38cd1613f29375188049a
  DATA_ARTIFACT_ID: '9876641831'
  DATA_ARTIFACT_DIGEST: sha256:2422a1e4746452614032e5af8c6afcc7172eb0b644d237791fc038c0a6d3547c
  DIAG_ARTIFACT_ID: '9878053742'
  DIAG_ARTIFACT_DIGEST: sha256:ee32b21e8d7e652f68fc0f8b8407826992f9e22f31220e57b5f92127bb42a954
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a

jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      slug: ${{ steps.research.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact HEAD lineage frozen refs and nine-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/v3-strength-upset-balance-score-research-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$STRESS_HEAD" HEAD)" = "$STRESS_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/v3-1-1-historical-replay-score-2024-2026-v1 | cut -f1)" = "$STRESS_HEAD"
          test "$(git hash-object football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_RESEARCH_CONTRACT.json)" = "$CONTRACT_BLOB"
          test "$(git hash-object football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_IMPLEMENTATION_SCOPE_AND_REPAIR.json)" = "$SCOPE_BLOB"
          test "$(git hash-object football-data/research/v3_strength_upset_balance_score/first_batch_research.py)" = "$EVALUATOR_BLOB"
          test "$(git hash-object football-data/research/v3_strength_upset_balance_score/test_first_batch_research.py)" = "$TEST_BLOB"
          python - <<'PY'
          import os,subprocess
          expected={
            '.github/workflows/football3-v3-strength-upset-balance-diagnostic-v1.yml',
            '.github/workflows/football3-v3-strength-upset-balance-score-first-batch-v1.yml',
            'football-data/research/v3_strength_upset_balance_score/DIAGNOSTIC_CONTRACT.json',
            'football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_RESEARCH_CONTRACT.json',
            'football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_IMPLEMENTATION_SCOPE_AND_REPAIR.json',
            'football-data/research/v3_strength_upset_balance_score/diagnose_v3_1_1.py',
            'football-data/research/v3_strength_upset_balance_score/test_diagnose_v3_1_1.py',
            'football-data/research/v3_strength_upset_balance_score/first_batch_research.py',
            'football-data/research/v3_strength_upset_balance_score/test_first_batch_research.py',
          }
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['STRESS_HEAD']}...HEAD"],text=True).splitlines())
          assert got==expected,(got,expected)
          assert not any(any(x in p for x in ('CURRENT','production_pointer','formal_enablement','formal-fast')) for p in got),got
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fresh deterministic evaluator guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/v3_strength_upset_balance_score/first_batch_research.py football-data/research/v3_strength_upset_balance_score/test_first_batch_research.py
          python football-data/research/v3_strength_upset_balance_score/test_first_batch_research.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 6 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
          python - <<'PY'
          import base64,hashlib,pathlib,re,zlib,os
          p=pathlib.Path('football-data/research/v3_strength_upset_balance_score/first_batch_research.py')
          s=p.read_text(); m=re.search(r"_PAYLOAD=b'''(.*)'''\nexec",s,re.S); assert m
          src=zlib.decompress(base64.b85decode(m.group(1).encode()))
          assert hashlib.sha256(src).hexdigest()==os.environ['EVALUATOR_SOURCE_SHA256']
          compile(src.decode(),'first_batch_research_decompressed.py','exec')
          PY

      - name: Download and verify frozen research evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _in && mkdir -p _in/{stress,data,diag,old,usr1}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            got="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq .digest)"
            python - "$got" "$expected" <<'PY'
          import sys
          n=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert n(sys.argv[1])==n(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$STRESS_ARTIFACT_ID" "$STRESS_ARTIFACT_DIGEST" /tmp/stress.zip _in/stress
          verify_one "$DATA_ARTIFACT_ID" "$DATA_ARTIFACT_DIGEST" /tmp/data.zip _in/data
          verify_one "$DIAG_ARTIFACT_ID" "$DIAG_ARTIFACT_DIGEST" /tmp/diag.zip _in/diag
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _in/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _in/usr1
          python - <<'PY'
          import hashlib,json,pathlib
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          sr=json.load(open('_in/stress/evidence/historical_stress_result.json'))
          dm=json.load(open('_in/data/data/data_manifest.json'))
          dg=json.load(open('_in/diag/evidence/diagnostic_report.json'))
          assert sr['status']=='V3_1_1_HISTORICAL_STRESS_TEST_PASSED' and sr['n']==3504
          assert dm['fixture_n']==3504 and dm['fixture_identity_sha256']=='60f14c0960b231b0e4fb0f90a0000e9c82e64f6e33c6b06e417f6902dc1ad13e'
          assert dg['diagnosis']['v3_1_1_internal_score_structure_changed'] is False
          assert dg['diagnosis']['v3_1_1_upset_probability_changed'] is False
          assert h('_in/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_in/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          PY

      - name: Authoritative POST_VIEW repaired first-batch replay
        id: research
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _run
          python football-data/research/v3_strength_upset_balance_score/first_batch_research.py \
            --contract football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_RESEARCH_CONTRACT.json \
            --stress-predictions _in/stress/evidence/predictions_label_free.jsonl \
            --fixtures _in/data/data/fixtures.jsonl \
            --updates _in/data/data/state_updates.jsonl \
            --labels _in/data/data/label_vault.jsonl \
            --old-db _in/old/understat_frozen.db \
            --usr1-engine _in/usr1/code/historical_fusion_v3_upset_safe.py \
            --out _run 2>&1 | tee /tmp/research_stdout.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/first_batch_result.json'))
          assert r['status']=='FIRST_BATCH_RESEARCH_COMPLETE'
          assert r['classification']=='POST_VIEW_HISTORICAL_RESEARCH_ONLY' and r['fresh_confirmation'] is False and r['promotion_allowed'] is False
          assert (r['n'],r['development_n'],r['evaluation_n'])==(3504,1752,1752)
          assert r['matrix_audit']['all_valid'] is True
          assert r['formal_v2_unchanged'] and r['v3_1_1_unchanged'] and not r['CURRENT_changed'] and not r['production_pointer_changed'] and not r['formal_enablement_changed'] and not r['fast_runtime_changed']
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('_run/first_batch_result.json')); b=r['baseline_v3_1_1']['evaluation']['one_x_two']['logloss']
          gains={k:b-r[k]['evaluation']['one_x_two']['logloss'] for k in ('A','B')}
          cg=r['baseline_v3_1_1']['evaluation']['score']['conditional_score_logloss']-r['C']['evaluation']['score']['conditional_score_logloss']
          print('slug=A'+str(int(r['A']['pass']))+'_B'+str(int(r['B']['pass']))+'_C'+str(int(r['C']['pass']))+f"__Ag_{gains['A']:.6f}__Bg_{gains['B']:.6f}__Cg_{cg:.6f}")
          PY

      - name: Seal first-batch research artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{contracts,code,evidence}
          cp football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_RESEARCH_CONTRACT.json _seal/contracts/
          cp football-data/research/v3_strength_upset_balance_score/FIRST_BATCH_IMPLEMENTATION_SCOPE_AND_REPAIR.json _seal/contracts/
          cp football-data/research/v3_strength_upset_balance_score/first_batch_research.py football-data/research/v3_strength_upset_balance_score/test_first_batch_research.py _seal/code/
          cp _run/* _seal/evidence/
          cp /tmp/tests.txt /tmp/research_stdout.txt _seal/evidence/
          cp _in/diag/evidence/diagnostic_report.json _seal/evidence/source_diagnostic_report.json
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal'); files={}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[str(p.relative_to(root))]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          m={'schema_version':'football3-v3-strength-upset-balance-score-first-batch-artifact-manifest-v1','head':os.environ['GITHUB_SHA'],'branch':'football3/v3-strength-upset-balance-score-research-v1','formal_v2_head':os.environ['FORMAL_HEAD'],'v3_1_1_stress_head':os.environ['STRESS_HEAD'],'classification':'POST_VIEW_REPAIRED_REPLAY_NOT_FIRST_UNSEEN_EVALUATION','fresh_confirmation':False,'promotion_allowed':False,'source_artifacts':{'stress':[int(os.environ['STRESS_ARTIFACT_ID']),os.environ['STRESS_ARTIFACT_DIGEST']], 'data':[int(os.environ['DATA_ARTIFACT_ID']),os.environ['DATA_ARTIFACT_DIGEST']], 'diagnostic':[int(os.environ['DIAG_ARTIFACT_ID']),os.environ['DIAG_ARTIFACT_DIGEST']], 'old_understat':[int(os.environ['OLD_ARTIFACT_ID']),os.environ['OLD_ARTIFACT_DIGEST']], 'usr1':[int(os.environ['USR1_ARTIFACT_ID']),os.environ['USR1_ARTIFACT_DIGEST']]},'payload_files':files,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'fast_runtime_changed':False,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False}
          pathlib.Path('_seal/artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload first-batch research artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-strength-upset-balance-score-${{ steps.research.outputs.slug }}-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: research-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remote ZIP digest CRC manifest exact-set SHA bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.research-and-seal.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.research-and-seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          got="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq .digest)"
          python - "$got" "$EXPECTED_DIGEST" <<'PY'
          import sys
          n=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert n(sys.argv[1])==n(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/a.zip
          python - /tmp/a.zip "$EXPECTED_DIGEST" <<'PY'
          import hashlib,sys
          d='sha256:'+hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(); e=sys.argv[2] if sys.argv[2].startswith('sha256:') else 'sha256:'+sys.argv[2]; assert d==e,(d,e)
          PY
          unzip -tq /tmp/a.zip
          rm -rf /tmp/r && mkdir /tmp/r && unzip -q /tmp/a.zip -d /tmp/r
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('/tmp/r'); m=json.load(open(root/'artifact_manifest.json')); assert m['head']==os.environ['GITHUB_SHA']
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and p.name!='artifact_manifest.json'}; expected=set(m['payload_files']); assert actual==expected,(actual^expected)
          for rel,q in m['payload_files'].items():
              b=(root/rel).read_bytes(); assert hashlib.sha256(b).hexdigest()==q['sha256']; assert len(b)==q['bytes']
          r=json.load(open(root/'evidence/first_batch_result.json')); assert r['status']=='FIRST_BATCH_RESEARCH_COMPLETE'
          PY
