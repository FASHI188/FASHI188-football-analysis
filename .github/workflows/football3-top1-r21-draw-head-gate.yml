name: football3 top1 R21 draw head gate

on:
  push:
    branches:
      - football3/top1-r21-draw-head-gate
    paths:
      - football-data/experiments/top1_r21_draw_head_gate/run_experiment_r21.py
      - .github/workflows/football3-top1-r21-draw-head-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r21:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r21-draw-head-gate
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R21 draw head gate
        run: python football-data/experiments/top1_r21_draw_head_gate/run_experiment_r21.py run
      - name: Verify R21 contract
        run: python football-data/experiments/top1_r21_draw_head_gate/run_experiment_r21.py verify
      - name: Persist R21 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r21_draw_head_gate/results/summary_r21.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R21 draw head gate'
            git push origin HEAD:football3/top1-r21-draw-head-gate
          fi
      - name: Upload R21 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r21-draw-head-gate
          path: football-data/experiments/top1_r21_draw_head_gate/results/summary_r21.json
          if-no-files-found: error
          retention-days: 90
