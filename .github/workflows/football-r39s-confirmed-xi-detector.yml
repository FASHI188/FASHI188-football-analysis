name: Football R39S Confirmed XI Detector Confirmation

on:
  push:
    branches:
      - research/premierleague-rendered-lineup-r39s
    paths:
      - '.github/workflows/football-r39s-confirmed-xi-detector.yml'

permissions:
  contents: read

concurrency:
  group: football-r39s-confirmed-xi-detector
  cancel-in-progress: false

jobs:
  confirm-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify frozen detector contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/premierleague_rendered_lineup_r39s/render_lineup_pages_r39s.py
          python -m py_compile football-data/research/premierleague_rendered_lineup_r39s/detect_confirmed_xi_r39s.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('football-data/research/premierleague_rendered_lineup_r39s/detector_contract_r39s.json').read_text())
          assert c['schema_version']=='R39S-CONFIRMED-XI-DETECTOR-1.0'
          assert c['formal_weight']==0 and c['research_only'] is True
          src=c['derived_from_authoritative_technical_run']
          assert src['workflow_run_id']==31364726786
          assert src['artifact_id']==9053700055
          assert src['artifact_digest']=='sha256:d06e561fd67e01f293e03e8a381a9b8dc6c34896228197a05cf0beca613d3f15'
          assert c['classification']['CONFIRMED_XI']['lineupsPlayer_eq']==22
          assert c['classification']['PRE_ANNOUNCEMENT_SQUADS']['squads_ge']==1
          b=c['hard_boundaries']
          assert b['blind100_labels_accessed']==b['research_target_labels_used']==b['model_fits']==b['candidate_probabilities']==b['football_api_requests']==b['api_keys_used']==0
          print('PASS_R39S_DETECTOR_CONTRACT')
          PY

      - name: Render current technical reference and forward page
        run: |
          set -euo pipefail
          python football-data/research/premierleague_rendered_lineup_r39s/render_lineup_pages_r39s.py \
            --contract football-data/research/premierleague_rendered_lineup_r39s/contract_r39s.json \
            --output "$RUNNER_TEMP/r39s-detector-confirm"

      - name: Apply frozen detector to both rendered DOMs
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/r39s-detector-confirm"
          python football-data/research/premierleague_rendered_lineup_r39s/detect_confirmed_xi_r39s.py \
            --contract football-data/research/premierleague_rendered_lineup_r39s/detector_contract_r39s.json \
            --dom "$ROOT/technical_reference_rendered_dom.html" \
            --expected-state CONFIRMED_XI \
            --output "$ROOT/reference_detector_result.json"
          python football-data/research/premierleague_rendered_lineup_r39s/detect_confirmed_xi_r39s.py \
            --contract football-data/research/premierleague_rendered_lineup_r39s/detector_contract_r39s.json \
            --dom "$ROOT/forward_target_rendered_dom.html" \
            --expected-state PRE_ANNOUNCEMENT_SQUADS \
            --output "$ROOT/forward_detector_result.json"

      - name: Freeze confirmation receipt and remove post-match reference DOM
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r39s-detector-confirm'
          render=json.loads((root/'render_receipt_r39s.json').read_text())
          ref=json.loads((root/'reference_detector_result.json').read_text())
          fwd=json.loads((root/'forward_detector_result.json').read_text())
          assert ref['state']=='CONFIRMED_XI' and ref['starter_count']==22
          assert len(ref['home_starters'])==11 and len(ref['away_starters'])==11
          assert fwd['state']=='PRE_ANNOUNCEMENT_SQUADS' and fwd['starter_count']==0
          assert fwd['source_native_counts']['lineupsFormations']==0
          assert fwd['source_native_counts']['lineupsPlayer']==0
          assert fwd['source_native_counts']['squads']>=1
          receipt={
            'schema_version':'R39S-DETECTOR-CONFIRMATION-1.0',
            'terminal':'PASS_R39S_CONFIRMED_XI_DETECTOR_CONFIRMATION',
            'technical_reference':{
              'role':'parser_self_test_only_not_research_sample',
              'state':ref['state'],
              'starter_count':ref['starter_count'],
              'source_native_counts':ref['source_native_counts'],
              'postmatch_reference_dom_retained':False,
              'outcome_used_for_model_or_evaluation':False
            },
            'forward_target':{
              'match_id':2645195,
              'state':fwd['state'],
              'starter_count':fwd['starter_count'],
              'source_native_counts':fwd['source_native_counts'],
              'observed_at_utc':render['forward_target']['observed_at_utc'],
              'scheduled_kickoff_utc':render['forward_target']['scheduled_kickoff_utc'],
              'rendered_dom_sha256':fwd['dom_sha256']
            },
            'blind100_labels_accessed':0,
            'research_target_labels_used':0,
            'model_fits':0,
            'candidate_probabilities':0,
            'football_api_requests':0,
            'api_keys_used':0,
            'formal_weight':0
          }
          raw=(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          (root/'detector_confirmation_receipt_r39s.json').write_bytes(raw)
          (root/'detector_confirmation_receipt_r39s.sha256').write_text(hashlib.sha256(raw).hexdigest()+'\n')
          (root/'technical_reference_rendered_dom.html').unlink()
          (root/'reference_detector_result.json').unlink()
          print(json.dumps({'terminal':receipt['terminal'],'forward_state':receipt['forward_target']['state'],'forward_observed_at_utc':receipt['forward_target']['observed_at_utc'],'forward_counts':receipt['forward_target']['source_native_counts']},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r39s-confirmed-xi-detector-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39s-detector-confirm
          retention-days: 30
          if-no-files-found: error
