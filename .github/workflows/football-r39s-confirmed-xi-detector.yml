name: Football R39S Confirmed XI Detector Confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-freeze-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm frozen detector terminal
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/premierleague_rendered_lineup_r39s/terminal_receipt_r39s.json').read_text())
          assert r['terminal']=='PASS_R39S_CONFIRMED_XI_DETECTOR_CONFIRMATION'
          assert r['forward_target_result']['state']=='PRE_ANNOUNCEMENT_SQUADS'
          assert r['detector']['CONFIRMED_XI']['lineupsPlayer']==22
          assert r['next_stage_authorized'] is False
          print('R39S_DETECTOR_TERMINALLY_FROZEN')
          PY
