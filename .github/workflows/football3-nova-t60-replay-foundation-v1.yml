name: football3-nova-t60-replay-foundation

on:
  pull_request:
    paths:
      - 'governance/football3/nova_t60_replay_foundation_v1.json'
      - 'governance/football3/nova_t60_replay_foundation_v1.py'
      - 'governance/football3/test_nova_t60_replay_foundation_v1.py'
      - '.github/workflows/football3-nova-t60-replay-foundation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-nova-t60-replay-foundation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  foundation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Static compile
        run: |
          set -euo pipefail
          python -m py_compile \
            governance/football3/nova_t60_replay_foundation_v1.py \
            governance/football3/test_nova_t60_replay_foundation_v1.py
      - name: Foundation contract tests
        run: |
          set -euo pipefail
          cd governance/football3
          python test_nova_t60_replay_foundation_v1.py -v 2>&1 | tee /tmp/t60_tests.txt
          grep -q 'Ran 9 tests' /tmp/t60_tests.txt
          grep -q '^OK$' /tmp/t60_tests.txt
      - name: Deterministic T-60 simulation
        run: |
          set -euo pipefail
          rm -rf t60_foundation_receipt && mkdir -p t60_foundation_receipt
          python governance/football3/nova_t60_replay_foundation_v1.py simulate \
            --config governance/football3/nova_t60_replay_foundation_v1.json \
            --out-dir t60_foundation_receipt \
            2>&1 | tee t60_foundation_receipt/stdout.txt
          python - <<'PY'
          import json
          p=json.load(open('t60_foundation_receipt/simulation_receipt.json'))
          assert p['status']=='T60_REPLAY_FOUNDATION_SIMULATION_PASS'
          assert p['activation_enabled'] is False
          assert p['replay_coverage_start_at'] is None
          assert p['coverage_guarantee_active'] is False
          assert p['competition_count']==7
          assert p['deterministic_state_replay'] is True
          assert p['available_at_cutoff_enforced'] is True
          assert p['post_cutoff_value_excluded'] is True
          assert p['gap_receipt_generated'] is True
          assert p['reservation_duplicate_suppressed'] is True
          assert p['completed_duplicate_suppressed'] is True
          assert p['result_fields_read']==0
          assert p['retroactive_fabrication'] is False
          assert p['formal_v2_changed'] is False
          assert p['current_changed'] is False
          assert p['production_changed'] is False
          assert p['candidate_weight']==0 and p['matrix_delta']==0
          assert len(p['sealed_state_sha256'])==64
          assert len(p['sealed_input_sha256'])==64
          PY
          cp /tmp/t60_tests.txt t60_foundation_receipt/
      - name: Upload immutable foundation receipt
        uses: actions/upload-artifact@v4
        with:
          name: football3-nova-t60-replay-foundation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: t60_foundation_receipt/
          if-no-files-found: error
          retention-days: 90
