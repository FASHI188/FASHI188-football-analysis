name: Football V6.25.3b Shot-Feature Total Head

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_shot_feature_offset_v6253b.py"
      - ".github/workflows/football-v6253b-shot-feature-total.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile wrapper
        run: python -m py_compile football-data/validation/v6_total_shot_feature_offset_v6253b.py
      - name: Run fold-safe strict-PIT shot-feature screen
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_shot_feature_offset_v6253b.py
      - name: Persist audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_shot_feature_offset_v6253_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist fold-safe V6.25.3 shot-feature total head"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
