name: football3 V2 final-holdout evidence protocol repair

on:
  push:
    branches:
      - football3/new-engine-v2-joint-score-clean
    paths:
      - 'football-data/new_engine_v2_joint_score/**'
      - '.github/workflows/football3-new-engine-v2-joint-score.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v2-evidence-protocol-${{ github.sha }}
  cancel-in-progress: false

jobs:
  zero-label-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enforce evidence-only whitelist and frozen V2 bytes
        shell: bash
        run: |
          set -euo pipefail
          INVALID_BASE=1b8c5178a5a33942523ea31f7fea0d74fdc8031d
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INVALID_BASE" HEAD
          changed="$(git diff --name-only "$INVALID_BASE" HEAD -- football-data/new_engine_v2_joint_score || true)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(football-data/new_engine_v2_joint_score/evidence_protocol\.py|football-data/new_engine_v2_joint_score/test_evidence_protocol\.py|football-data/new_engine_v2_joint_score/evidence_protocol/.*)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Frozen V2/model/research/scoring bytes changed:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'V2 protected bytes unchanged from invalid-run HEAD.'

      - name: Stop before any label unseal or scorer
        shell: bash
        run: |
          set -euo pipefail
          echo 'TECHNICAL_INVALID_EVIDENCE_INCOMPLETE: Run 33318914374'
          echo 'Original final holdout: TECHNICAL_REPLAY_ONLY'
          echo 'STOP_BEFORE_SCORER'
          echo 'No dataset/research/blind prediction regeneration/final_driver/score_unseal/final_evaluate invoked.'
