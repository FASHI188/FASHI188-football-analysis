name: football3 R42 live availability shadow

on:
  push:
    branches:
      - football3/r42-live-availability-shadow
    paths:
      - football-data/experiments/r42_live_availability_shadow/run_r42_shadow.py
      - .github/workflows/football3-r42-live-availability-shadow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r42-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r42-live-availability-shadow
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R42 live availability shadow
        run: python football-data/experiments/r42_live_availability_shadow/run_r42_shadow.py run
      - name: Verify R42 shadow contract
        run: python football-data/experiments/r42_live_availability_shadow/run_r42_shadow.py verify
      - name: Persist R42 shadow evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r42_live_availability_shadow/results/summary_r42_shadow.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R42 live availability shadow'
            git fetch origin football3/r42-live-availability-shadow
            git rebase origin/football3/r42-live-availability-shadow
            git push origin HEAD:football3/r42-live-availability-shadow
          fi
      - name: Upload R42 shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r42-live-availability-shadow
          path: football-data/experiments/r42_live_availability_shadow/results/summary_r42_shadow.json
          if-no-files-found: error
          retention-days: 90
