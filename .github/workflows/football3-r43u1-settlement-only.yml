name: football3 R43U1 settlement only

on:
  push:
    branches:
      - football3/r43u1-pristine-forward-confirmation
    paths:
      - football-data/experiments/r43u1_pristine_forward_confirmation/settle_r43u1.py
      - .github/workflows/football3-r43u1-settlement-only.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43u1-pristine-forward-confirmation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable dependencies
        run: |
          test -f football-data/forward/r43u1_pristine_forward_events.json
          test -f football-data/forward/v6_market_first_events_v651.json
          test -f football-data/forward/r43_batch01_pristine_lockbox.json
          test -f football-data/forward/r43_batch02_pristine_lockbox.json
          python -m py_compile football-data/experiments/r43_batch01_lockbox/verify_lockbox.py
          python -m py_compile football-data/experiments/r43_batch02_lockbox/seal_verify_lockbox.py
          python -m py_compile football-data/experiments/r43u1_pristine_forward_confirmation/settle_r43u1.py
      - name: Verify sealed Batch01 and Batch02 prediction prefixes before settlement
        run: |
          python football-data/experiments/r43_batch01_lockbox/verify_lockbox.py run
          python football-data/experiments/r43_batch01_lockbox/verify_lockbox.py verify
          python football-data/experiments/r43_batch02_lockbox/seal_verify_lockbox.py verify
      - name: Settle only existing frozen R43U1 predictions
        run: python football-data/experiments/r43u1_pristine_forward_confirmation/settle_r43u1.py run
      - name: Verify settlement-only contract
        run: python football-data/experiments/r43u1_pristine_forward_confirmation/settle_r43u1.py verify
      - name: Persist R43U1 settlement evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43_batch01_lockbox/results/summary_r43_batch01_lockbox_verify.json
          git add football-data/experiments/r43_batch02_lockbox/results/summary_r43_batch02_lockbox_verify.json
          git add football-data/forward/r43u1_pristine_forward_results.json
          git add football-data/experiments/r43u1_pristine_forward_confirmation/results/summary_r43u1_pristine_forward_evaluation.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43U1 settlement-only evidence'
            git fetch origin football3/r43u1-pristine-forward-confirmation
            git rebase origin/football3/r43u1-pristine-forward-confirmation
            git push origin HEAD:football3/r43u1-pristine-forward-confirmation
          fi
      - name: Upload R43U1 settlement artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43u1-settlement-only
          path: |
            football-data/forward/r43_batch01_pristine_lockbox.json
            football-data/forward/r43_batch02_pristine_lockbox.json
            football-data/experiments/r43_batch01_lockbox/results/summary_r43_batch01_lockbox_verify.json
            football-data/experiments/r43_batch02_lockbox/results/summary_r43_batch02_lockbox_verify.json
            football-data/forward/r43u1_pristine_forward_results.json
            football-data/experiments/r43u1_pristine_forward_confirmation/results/summary_r43u1_pristine_forward_evaluation.json
          if-no-files-found: error
          retention-days: 90

# settlement scoring is blocked on sealed Batch01 and Batch02 prefix integrity
