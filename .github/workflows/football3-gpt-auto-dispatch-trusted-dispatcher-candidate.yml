name: Football3 GPT Auto Dispatch Trusted Dispatcher Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/football3-gpt-auto-dispatch-trusted-dispatcher-v1.yml'
      - '.github/workflows/football3-gpt-auto-dispatch-trusted-dispatcher-candidate.yml'
      - 'governance/football3/test_trusted_dispatcher_workflow_v1.py'

permissions:
  contents: read

jobs:
  trusted-dispatcher-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile trusted dispatcher contract test
        run: python3 -m py_compile governance/football3/test_trusted_dispatcher_workflow_v1.py
      - name: Verify default-branch trusted workflow security contract
        run: python3 governance/football3/test_trusted_dispatcher_workflow_v1.py
