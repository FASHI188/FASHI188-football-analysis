name: Football Cross-Market R39G Evaluation

on:
  pull_request:
    branches: [research/beat-the-bookie-r39f-provider-leadlag]
    paths:
      - '.github/workflows/football-crossmarket-r39g-evaluation.yml'
      - 'football-data/research/crossmarket_r39g/preregistration_r39g.json'
      - 'football-data/research/crossmarket_r39g/evaluate_crossmarket_r39g.py'

permissions:
  contents: read

jobs:
  crossmarket-fixed100:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Verify exact frozen contract before data or label access
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/crossmarket_r39g/evaluate_crossmarket_r39g.py
          python football-data/research/crossmarket_r39g/evaluate_crossmarket_r39g.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/crossmarket_r39g/preregistration_r39g.json').read_text())
          assert p['stage']=='R39G_FOOTBALL_DATA_CROSSMARKET_FIXED100'
          assert p['source_binding']['audit_run_id']==31322305282
          assert p['source_binding']['fixed100_identity_sha256']=='0e95f2b0234c125c440c2d2c87eca20c41270a22474ec4871282b51a56bfab62'
          assert p['label_order_contract']['fixed100_labels_before_final_freeze']==0
          assert p['hard_limits']['formal_weight']==0 and p['hard_limits']['promotion_authorized'] is False
          print('PASS_R39G_EXACT_FROZEN_CONTRACT')
          PY
      - name: Download official Football-Data source
        run: |
          set -euo pipefail
          rm -rf r39g-raw r39g-sanitized r39g-output
          mkdir -p r39g-raw r39g-sanitized r39g-output
          for season in 1920 2021 2122 2223 2324 2425; do
            for div in E0 D1 I1 SP1 F1; do
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" \
                -o "r39g-raw/${season}_${div}.csv"
            done
          done
      - name: Build score-free market input
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          raw=Path('r39g-raw'); out=Path('r39g-sanitized'); out.mkdir(exist_ok=True)
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgH','AvgD','AvgA','Avg>2.5','Avg<2.5','AHh','AvgAHH','AvgAHA','AvgCH','AvgCD','AvgCA','AvgC>2.5','AvgC<2.5','AHCh','AvgCAHH','AvgCAHA']
          for p in sorted(raw.glob('*.csv')):
              season=p.stem.split('_',1)[0]
              with p.open('r',encoding='utf-8-sig',errors='replace',newline='') as f:
                  r=csv.DictReader(f); header=r.fieldnames or []
                  selected=[c for c in keep if c in header]
                  q=out/p.name
                  with q.open('w',encoding='utf-8',newline='') as g:
                      w=csv.DictWriter(g,fieldnames=['Season']+selected); w.writeheader()
                      for row in r:
                          z={'Season':season}
                          for c in selected: z[c]=row.get(c,'')
                          w.writerow(z)
          PY
      - name: Execute frozen R39G sequence
        run: |
          set -euo pipefail
          python football-data/research/crossmarket_r39g/evaluate_crossmarket_r39g.py \
            --prereg football-data/research/crossmarket_r39g/preregistration_r39g.json \
            --sanitized-dir r39g-sanitized --raw-dir r39g-raw --out-dir r39g-output
      - name: Verify label order and result boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('r39g-output/r39g_result.json'); r=json.loads(p.read_text())
          allowed={
            'STOP_R39G_BEFORE_HOLDOUT_LABEL_ACCESS_CROSSMARKET_NO_INCREMENT',
            'STOP_R39G_BEFORE_HOLDOUT_LABEL_ACCESS_NO_POLICY_LANE',
            'PASS_R39G_CROSSMARKET_FIXED100_EXPLORATORY_ONLY',
            'NO_R39G_CROSSMARKET_INCREMENT_FIXED100'
          }
          assert r['status'] in allowed
          assert r['training_labels_accessed']==8952
          assert r['holdout_labels_before_freeze']==0
          assert r['prior_beat_the_bookie_blind_labels_accessed']==0
          if r['status'].startswith('STOP_'):
              assert r['fixed100_labels_accessed']==0
              assert not Path('r39g-output/model_policy_freeze_receipt_r39g.json').exists() or r['status']=='STOP_R39G_BEFORE_HOLDOUT_LABEL_ACCESS_NO_POLICY_LANE'
          else:
              assert r['fixed100_labels_accessed']==100
              assert r['fixed100_nonselected_2425_labels_accessed']==0
              assert Path('r39g-output/model_policy_freeze_receipt_r39g.json').exists()
          meta={'evaluation_pr_head_sha':os.environ.get('PR_HEAD_SHA'),'evaluation_merge_sha':os.environ.get('GITHUB_SHA'),'status':r['status']}
          Path('r39g-output/evaluation_identity_r39g.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Delete raw source before artifact
        run: rm -rf r39g-raw r39g-sanitized
      - name: Upload aggregate R39G evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-crossmarket-r39g-evaluation-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: r39g-output/
          if-no-files-found: error
          retention-days: 30
