name: football3 R43Z1 result identity preflight

on:
  push:
    branches:
      - football3/r43u1-pristine-forward-confirmation
    paths:
      - football-data/experiments/r43z1_result_identity_preflight/run_r43z1.py
      - .github/workflows/football3-r43z1-result-identity-preflight.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43z1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43u1-pristine-forward-confirmation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preflight dependencies
        run: |
          test -f football-data/forward/r43u1_pristine_forward_events.json
          python -m py_compile football-data/experiments/r43z1_result_identity_preflight/run_r43z1.py
          python -m py_compile football-data/validation/v6_pristine_forward_result_resolver_v612.py
      - name: Run zero-label ESPN identity preflight
        run: python football-data/experiments/r43z1_result_identity_preflight/run_r43z1.py run
      - name: Verify zero-label preflight contract
        run: python football-data/experiments/r43z1_result_identity_preflight/run_r43z1.py verify
      - name: Persist R43Z1 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43z1_result_identity_preflight/results/summary_r43z1_result_identity_preflight.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43Z1 zero-label ESPN identity preflight'
            git fetch origin football3/r43u1-pristine-forward-confirmation
            git rebase origin/football3/r43u1-pristine-forward-confirmation
            git push origin HEAD:football3/r43u1-pristine-forward-confirmation
          fi
      - name: Upload R43Z1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43z1-result-identity-preflight
          path: football-data/experiments/r43z1_result_identity_preflight/results/summary_r43z1_result_identity_preflight.json
          if-no-files-found: error
          retention-days: 90
