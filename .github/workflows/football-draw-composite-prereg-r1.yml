name: Football Draw Composite Prereg R1 Read-Only

on:
  pull_request:
    branches: [main]
    paths:
      - "football-data/research/draw_composite_*"
      - "football-data/research/validate_draw_composite_prereg_r1.py"
      - ".github/workflows/football-draw-composite-prereg-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draw-composite-prereg-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify exact checkout identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > /tmp/exact_head.txt

      - name: Run read-only full preregistration preflight
        shell: bash
        run: |
          python football-data/research/validate_draw_composite_prereg_r1.py \
            --output /tmp/draw_composite_prereg_full_preflight.json

      - name: Verify authorization and repository write boundary
        shell: bash
        run: |
          test ! -e football-data/research/draw_composite_run_authorization_r1.json
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/draw_composite_prereg_full_preflight.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "PASS_FULL_PREFLIGHT"
          assert receipt["experiment_executed"] is False
          assert receipt["labels_read"] == 0
          assert receipt["provider_requests"] == 0
          assert receipt["secret_access"] is False
          assert receipt["formal_asset_changes"] == 0
          assert receipt["repository"]["dataset_count"] == 17
          assert receipt["repository"]["authorization_file_present"] is False
          assert all(row["rows_parsed"] == 0 and row["labels_parsed"] == 0
                     for row in receipt["repository"]["dataset_checks"].values())
          PY

      - name: Build artifact metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = {
              "schema_version": "DRAW-COMPOSITE-PREREG-FULL-PREFLIGHT-ARTIFACT-R1.1",
              "exact_head": Path("/tmp/exact_head.txt").read_text().strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "experiment_executed": False,
              "labels_read": 0,
              "provider_requests": 0,
              "secret_access": False,
              "formal_asset_changes": 0,
          }
          Path("/tmp/draw_composite_prereg_artifact_metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload read-only preflight artifact
        uses: actions/upload-artifact@v7
        with:
          name: draw-composite-prereg-r1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/exact_head.txt
            /tmp/draw_composite_prereg_full_preflight.json
            /tmp/draw_composite_prereg_artifact_metadata.json
          if-no-files-found: error
          retention-days: 30
