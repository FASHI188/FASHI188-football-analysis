name: football3 Top1 R15 draw activation gate

on:
  push:
    branches:
      - football3/top1-r15-draw-activation-gate
    paths:
      - football-data/experiments/top1_r15_draw_gate/run_experiment_r15.py
      - .github/workflows/football3-top1-r15-draw-activation-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r15-draw-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R15 branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r15-draw-activation-gate
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Select draw activation threshold on validation and score test
        run: python football-data/experiments/top1_r15_draw_gate/run_experiment_r15.py run
      - name: Verify R15 decision-policy contract
        run: python football-data/experiments/top1_r15_draw_gate/run_experiment_r15.py verify
      - name: Persist R15 manifest and result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r15_draw_gate/data/source_manifest_r15.json football-data/experiments/top1_r15_draw_gate/results/summary_r15.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r15] persist draw activation gate result'
            git push origin HEAD:football3/top1-r15-draw-activation-gate
          fi
      - name: Upload immutable R15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r15-draw-activation-gate
          path: |
            football-data/experiments/top1_r15_draw_gate/data/source_manifest_r15.json
            football-data/experiments/top1_r15_draw_gate/results/summary_r15.json
          if-no-files-found: error
          retention-days: 30
