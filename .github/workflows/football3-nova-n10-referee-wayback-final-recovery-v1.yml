name: football3-nova-n10-referee-wayback-final-recovery

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_wayback_final_recovery_registry_v1.json'
      - 'governance/football3/nova_n10_referee_wayback_final_recovery_v1.py'
      - 'governance/football3/test_nova_n10_referee_wayback_final_recovery_v1.py'
      - '.github/workflows/football3-nova-n10-referee-wayback-final-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-nova-n10-referee-wayback-final-recovery-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-wayback-final-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile             governance/football3/nova_n10_referee_sky_combined_freeze_v1.py             governance/football3/nova_n10_referee_sky_pit_binding_v1.py             governance/football3/nova_n10_referee_wayback_final_recovery_v1.py             governance/football3/test_nova_n10_referee_wayback_final_recovery_v1.py
          PYTHONPATH=governance/football3             python governance/football3/test_nova_n10_referee_wayback_final_recovery_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 5 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Retry only final Wayback external-error rounds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_wayback_final_recovery_v1.py             --registry governance/football3/nova_n10_referee_wayback_final_recovery_registry_v1.json             --aia-ledger governance/football3/nova_n10_referee_aia_canonical_round_ledger_v1.json             --out _run 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json, os
          r=json.load(open('_run/wayback_final_recovery_receipt.json'))
          assert r['status']=='N10_REFEREE_WAYBACK_FINAL_RECOVERY_COMPLETE'
          assert r['classification'] in {
              'POSITIVE_SIGNAL_SOURCE_PIT_BINDING',
              'PARTIAL_SOURCE_PIT_BINDING',
              'STOP_DATA_COVERAGE',
          }
          assert r['final_recovery_batch_number']==1
          assert r['max_final_recovery_batches']==1
          assert r['retry_round_n']==19
          assert r['retry_rounds']==[8,9,11,12,14,15,16,17,19,20,21,22,23,27,28,32,34,36,38]
          assert 24 not in r['retry_rounds'] and 25 not in r['retry_rounds']
          assert r['fixture_schedule_complete'] is True
          assert r['fixture_schedule_covered_round_n']==38
          assert r['fixture_n']==380
          assert r['witness_report_n'] + r['witness_error_n'] == 38
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['raw_archived_page_body_read'] is False
          assert r['referee_assignment_body_parsed'] is False
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          assert r['referee_oof_allowed'] is False
          assert os.path.exists('_run/zero_label_fixture_schedule_ledger.json')
          assert os.path.exists('_run/wayback_final_witness_ledger.json')
          assert os.path.exists('_run/sky_publication_pit_binding_final_ledger.json')
          if r['remaining_external_error_n'] > 0:
              assert r['wayback_closed_for_remaining_external_error_rounds'] is True
              assert r['classification']=='STOP_DATA_COVERAGE'
          else:
              assert r['wayback_closed_for_remaining_external_error_rounds'] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-wayback-final-recovery-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
