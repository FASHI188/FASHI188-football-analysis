name: football3 R43GOV0 M10 final rebuild

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/identity/**
      - football-data/pit/**
      - football-data/assembly/**
      - football-data/pipeline/unified_inference.py
      - football-data/pipeline/unified_dataset.py
      - football-data/pipeline/v500_baseline_adapter.py
      - football-data/pipeline/governed_configuration.py
      - football-data/evaluation/unified_evaluator.py
      - football-data/components/legacy_r43_registry.py
      - football-data/components/r43*.py
      - football-data/governance/feature_integration_truth.py
      - football-data/tests/test_team_identity.py
      - football-data/tests/test_pit_feature_store.py
      - football-data/tests/test_feature_assembler.py
      - football-data/tests/test_r43_component_chain_composition.py
      - football-data/tests/test_unified_dataset_evaluator.py
      - football-data/tests/test_r43q_pit_market_binding.py
      - football-data/tests/test_feature_integration_truth.py
      - football-data/tests/test_governed_configuration.py
      - football-data/tests/test_final_rebuild_governance.py
      - .github/workflows/football3-r43gov0-m10-final-rebuild.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Verify research isolation frozen V500 and sealed paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "football3/r43gov0-unified-governance-audit"
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json|football-data/forward/r43y0_draw_calibration_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
          if find football-data/governance -maxdepth 1 -type f \( -name 'M7_*' -o -name '.m7_marker' -o -name 'README_M7.txt' -o -name 'FEATURE_TRUTH_VERSION' \) | grep -q .; then
            echo 'accidental M7 marker file remains' >&2
            exit 1
          fi

      - name: Compile rebuilt governance chain
        run: |
          python -m py_compile football-data/identity/team_identity.py
          python -m py_compile football-data/pit/feature_store.py
          python -m py_compile football-data/assembly/feature_assembler.py
          python -m py_compile football-data/pipeline/unified_inference.py
          python -m py_compile football-data/pipeline/unified_dataset.py
          python -m py_compile football-data/pipeline/v500_baseline_adapter.py
          python -m py_compile football-data/pipeline/governed_configuration.py
          python -m py_compile football-data/evaluation/unified_evaluator.py
          python -m py_compile football-data/components/legacy_r43_registry.py
          python -m py_compile football-data/tests/test_final_rebuild_governance.py

      - name: Run M1 identity regression
        run: python -m unittest discover -s football-data/tests -p 'test_team_identity.py' -v

      - name: Run M2 PIT regression
        run: python -m unittest discover -s football-data/tests -p 'test_pit_feature_store.py' -v

      - name: Run M3 feature activation regression
        run: python -m unittest discover -s football-data/tests -p 'test_feature_assembler.py' -v

      - name: Run M5 component-chain regression
        run: python -m unittest discover -s football-data/tests -p 'test_r43_component_chain_composition.py' -v

      - name: Run M6 dataset evaluator regression
        run: python -m unittest discover -s football-data/tests -p 'test_unified_dataset_evaluator.py' -v

      - name: Run M7 truth regression
        run: PYTHONPATH=football-data python -m unittest football-data/tests/test_feature_integration_truth.py -v

      - name: Run M8 PIT market regression
        run: python -m unittest discover -s football-data/tests -p 'test_r43q_pit_market_binding.py' -v

      - name: Run M9 configuration regression
        run: python -m unittest discover -s football-data/tests -p 'test_governed_configuration.py' -v

      - name: Run M10 final rebuild contract
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_final_rebuild_governance.py' -v 2>&1 | tee /tmp/m10_final.log

      - name: Upload M10 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m10-final-rebuild-diagnostic
          path: /tmp/m10_final.log
          if-no-files-found: error
          retention-days: 30

      - name: Write M10 final gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          HEAD_SHA="$(git rev-parse HEAD)"
          cat > football-data/governance/r43gov0/results/m10_final_rebuild_gate.json <<JSON
          {
            "schema_version": "football3-r43gov0-m10-final-rebuild-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "head": "${HEAD_SHA}",
            "rebuild_complete": true,
            "m1_identity_contract_passed": true,
            "m2_pit_contract_passed": true,
            "m3_feature_activation_receipt_passed": true,
            "m4_unified_inference_path_retained": true,
            "m5_r43_q_r_t_u_y_migrated_and_governed": true,
            "m6_unified_dataset_evaluator_passed": true,
            "m7_feature_truth_passed": true,
            "m8_pit_market_binding_passed": true,
            "m9_profile_isolation_passed": true,
            "r43_source_lineage_resolved": true,
            "r43_implementations_migrated": true,
            "r43_components_enabled_by_default": false,
            "formal_default_profile": "V500_frozen_unchanged",
            "formal_default_v500_blob": "9c302506c49aa1847e60cd7896fc1a80f3b6b457",
            "market_research_candidate_pit_bound": true,
            "market_research_candidate_formal_promotion_allowed": false,
            "lineup_numeric_1x2_enabled": false,
            "player_technical_numeric_1x2_enabled": false,
            "head_coach_numeric_1x2_enabled": false,
            "availability_numeric_1x2_enabled": false,
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "research_rebuild_complete_does_not_equal_formal_model_promotion": true,
            "next_step": "freeze_governance_rebuild_artifact_then_design_fresh_confirmatory_research_only_experiment"
          }
          JSON

      - name: Upload M10 final gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m10-final-rebuild-gate
          path: football-data/governance/r43gov0/results/m10_final_rebuild_gate.json
          if-no-files-found: error
          retention-days: 90
