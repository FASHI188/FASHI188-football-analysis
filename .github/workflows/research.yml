# PAUSED_FOR_REPOSITORY_GOVERNANCE
name: Governance Research Consolidated Read-Only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/governance/verify_consolidated_capabilities.py
