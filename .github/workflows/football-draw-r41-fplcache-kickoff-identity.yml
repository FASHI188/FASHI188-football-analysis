name: Football Draw R41 FPL Cache Kickoff Identity Zero-Label Audit

on:
  push:
    branches: [research/draw-pit-availability-zero-label-20260814]
    paths:
      - 'football-data/research/draw_pit_availability_r41_fplcache_kickoff_identity_audit_20260814.py'
      - '.github/workflows/football-draw-r41-fplcache-kickoff-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draw-r41-fplcache-kickoff-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Clone and pin public six-hour FPL cache
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --sparse https://github.com/Randdalf/fplcache.git external-fplcache
          git -C external-fplcache sparse-checkout set \
            cache/2025/8 cache/2025/9 cache/2025/10 cache/2025/11 cache/2025/12 \
            cache/2026/1 cache/2026/2 cache/2026/3 cache/2026/4 cache/2026/5
          git -C external-fplcache fetch --quiet origin 19f12ec27dc670ebd79e5353585e67f333d070e3 --depth 1
          git -C external-fplcache checkout --quiet --detach 19f12ec27dc670ebd79e5353585e67f333d070e3
          git -C external-fplcache rev-parse HEAD > fplcache_head.txt
          test "$(cat fplcache_head.txt)" = "19f12ec27dc670ebd79e5353585e67f333d070e3"

      - name: Clone public FPL fixture history
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/vaastav/Fantasy-Premier-League.git external-fpl
          test -d external-fpl/.git

      - name: Run zero-label kickoff identity audit
        shell: bash
        run: |
          set -euo pipefail
          python football-data/research/draw_pit_availability_r41_fplcache_kickoff_identity_audit_20260814.py \
            --vaastav-dir external-fpl \
            --cache-dir external-fplcache/cache \
            --cache-head "$(cat fplcache_head.txt)" \
            --out r41-fplcache-kickoff-identity

      - name: Enforce zero-label and formal-isolation invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('r41-fplcache-kickoff-identity/kickoff_identity_receipt.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['target_labels_read'] == 0
          assert d['target_score_values_accessed'] == 0
          assert d['model_fits'] == 0
          assert d['training_runs'] == 0
          assert d['scoring_runs'] == 0
          assert d['tuning_runs'] == 0
          assert d['provider_requests'] == 0
          assert d['paid_provider_requests'] == 0
          assert d['formal_weight'] == 0
          assert d['formal_model_data_config_current_changes'] == [0, 0, 0, 0]
          assert d['minimum_lead_hours'] == 6.0
          assert d['maximum_staleness_days'] == 10.0
          print(d['status'])
          print('pit_fixture_identity_count=', d['pit_fixture_identity_count'])
          print('eligible_fixture_count=', d['eligible_fixture_count'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: draw-r41-fplcache-kickoff-identity-zero-label
          path: r41-fplcache-kickoff-identity/
