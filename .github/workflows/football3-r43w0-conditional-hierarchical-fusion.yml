name: football3 R43W0 conditional hierarchical fusion

on:
  push:
    branches:
      - football3/r43w0-conditional-hierarchical-fusion
    paths:
      - football-data/experiments/r43w0_conditional_hierarchical_fusion/run_r43w0.py
      - .github/workflows/football3-r43w0-conditional-hierarchical-fusion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43w0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43w0-conditional-hierarchical-fusion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify inherited dependencies
        run: |
          test -f football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py
          test -f football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py
          test -f football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py
          python -m py_compile football-data/experiments/r43w0_conditional_hierarchical_fusion/run_r43w0.py
      - name: Run R43W0 conditional hierarchical fusion
        run: python football-data/experiments/r43w0_conditional_hierarchical_fusion/run_r43w0.py run
      - name: Verify R43W0 contract
        run: python football-data/experiments/r43w0_conditional_hierarchical_fusion/run_r43w0.py verify
      - name: Persist R43W0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43w0_conditional_hierarchical_fusion/results/summary_r43w0_conditional_hierarchical_fusion.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43W0 conditional hierarchical fusion'
            git fetch origin football3/r43w0-conditional-hierarchical-fusion
            git rebase origin/football3/r43w0-conditional-hierarchical-fusion
            git push origin HEAD:football3/r43w0-conditional-hierarchical-fusion
          fi
      - name: Upload R43W0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43w0-conditional-hierarchical-fusion
          path: football-data/experiments/r43w0_conditional_hierarchical_fusion/results/summary_r43w0_conditional_hierarchical_fusion.json
          if-no-files-found: error
          retention-days: 90
