name: football3 New Engine V1 historical rebuild

on:
  push:
    branches:
      - football3/new-engine-v1
    paths:
      - 'football-data/new_engine_v1/**'
      - '.github/workflows/football3-new-engine-v1.yml'
      - '.github/workflows/football3-new-engine-v1-forward.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-new-engine-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  historical-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact New Engine branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind anchor and whitelist
        shell: bash
        run: |
          set -euo pipefail
          ANCHOR=7c1815c47102412e88f72189e2b8f837d9b73a42
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "$ANCHOR" HEAD
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          bad="$(git diff --name-only "$ANCHOR"...HEAD | grep -Ev '^(football-data/new_engine_v1/|\.github/workflows/football3-new-engine-v1\.yml$|\.github/workflows/football3-new-engine-v1-forward\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo "out-of-whitelist paths:" >&2
            echo "$bad" >&2
            exit 1
          fi
          test -f football-data/new_engine_v1/contracts/ENGINE_DESIGN_CONTRACT.md
          test -f football-data/new_engine_v1/contracts/DATA_LABEL_PIT_CONTRACT.md
          test -f football-data/new_engine_v1/contracts/REUSE_BOUNDARY.md
          test -f football-data/new_engine_v1/contracts/FILE_WHITELIST.md
          test -f football-data/new_engine_v1/contracts/VALIDATION_PREREG.md
          if grep -Eiq 'bayesian_dynamic_state_oof_v500|v500_baseline_adapter|legacy_r43_registry|odds|market' football-data/new_engine_v1/pure_engine.py; then
            echo 'pure core violates independence boundary' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.3.2 scipy==1.16.1

      - name: Compile New Engine V1
        run: |
          python -m py_compile football-data/new_engine_v1/pure_engine.py
          python -m py_compile football-data/new_engine_v1/market_assist.py
          python -m py_compile football-data/new_engine_v1/legacy_v500.py
          python -m py_compile football-data/new_engine_v1/historical_eval.py
          python -m py_compile football-data/new_engine_v1/test_new_engine.py

      - name: Run structural and cold-start unit tests
        run: |
          cd football-data/new_engine_v1
          python -m unittest test_new_engine.py -v

      - name: Run preregistered chronological historical OOS
        run: python football-data/new_engine_v1/historical_eval.py

      - name: Verify evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('football-data/new_engine_v1/evidence')
          result=json.loads((root/'historical_oos_result.json').read_text())
          cold=json.loads((root/'cold_start_audit.json').read_text())
          final=json.loads((root/'final_status.json').read_text())
          assert result['anchor']=='7c1815c47102412e88f72189e2b8f837d9b73a42'
          assert result['scientific_status'] in {'MODEL_CANDIDATE_PASSED','NOT_PROMOTED'}
          assert result['governance']['same_cutoff_predict_all_then_update'] is True
          assert result['governance']['historical_labels_are_unsealed_only_after_batch_prediction_hash_persisted'] is True
          assert result['market_assisted_historical']['status']=='MARKET_ASSIST_NOT_SCORED'
          assert cold['status']=='PASS'
          assert final['final_state']=='GPT_REBUILT_PENDING_CODEX_RECHECK'
          assert final['scientific_status']==result['scientific_status']
          assert result['coverage']['pure'] >= 0.99
          PY

      - name: Write exact-HEAD artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('football-data/new_engine_v1')
          ev=root/'evidence'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only','7c1815c47102412e88f72189e2b8f837d9b73a42...HEAD'],text=True).splitlines()
          selected=[]
          for base in (root/'contracts', ev):
              selected.extend(p for p in base.rglob('*') if p.is_file() and p.name != 'artifact_manifest.json')
          selected.extend([
              root/'pure_engine.py',
              root/'market_assist.py',
              root/'legacy_v500.py',
              root/'historical_eval.py',
              root/'test_new_engine.py',
          ])
          files={}
          for p in sorted(set(selected)):
              data=p.read_bytes()
              files[str(p)]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          assert files
          assert not any('__pycache__' in name for name in files)
          assert not any('/forward/' in name for name in files)
          manifest={
              'schema_version':'football3-new-engine-v1-artifact-v1',
              'head':head,
              'parent':parent,
              'anchor':'7c1815c47102412e88f72189e2b8f837d9b73a42',
              'branch':'football3/new-engine-v1',
              'changed_paths':changed,
              'files':files,
              'artifact_manifest_self_excluded':True,
              'pycache_in_manifest':False,
              'formal_model_modified':False,
              'current_modified':False,
              'main_modified':False,
              'final_state':'GPT_REBUILT_PENDING_CODEX_RECHECK',
          }
          (ev/'artifact_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Verify artifact manifest matches upload scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('football-data/new_engine_v1')
          manifest=json.loads((root/'evidence/artifact_manifest.json').read_text())
          expected=[]
          for base in (root/'contracts', root/'evidence'):
              expected.extend(p for p in base.rglob('*') if p.is_file() and p.name != 'artifact_manifest.json')
          expected.extend([root/'pure_engine.py',root/'market_assist.py',root/'legacy_v500.py',root/'historical_eval.py',root/'test_new_engine.py'])
          expected={str(p):p for p in expected}
          assert set(manifest['files']) == set(expected)
          for name,p in expected.items():
              data=p.read_bytes()
              assert manifest['files'][name]['sha256']==hashlib.sha256(data).hexdigest()
              assert manifest['files'][name]['bytes']==len(data)
          PY

      - name: Upload New Engine V1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-new-engine-v1-${{ github.sha }}-${{ github.run_id }}
          path: |
            football-data/new_engine_v1/contracts/
            football-data/new_engine_v1/evidence/
            football-data/new_engine_v1/pure_engine.py
            football-data/new_engine_v1/market_assist.py
            football-data/new_engine_v1/legacy_v500.py
            football-data/new_engine_v1/historical_eval.py
            football-data/new_engine_v1/test_new_engine.py
          if-no-files-found: error
          retention-days: 90
