name: football-r45a-player-capability-300-retro

on:
  push:
    branches:
      - research/r45a-player-capability-300-retro
    paths:
      - .github/workflows/football-r45a-player-capability-300-retro.yml

permissions:
  contents: read

jobs:
  r45a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Reconstruct frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/r45a_player_capability_300_retro
          cat "$D"/encoded/run_r45a.py.b64.part1 "$D"/encoded/run_r45a.py.b64.part2 | base64 -d | gzip -d > "$D/run_r45a.py"
          cat "$D"/encoded/sample_market_min.csv.b64.part1 "$D"/encoded/sample_market_min.csv.b64.part2 "$D"/encoded/sample_market_min.csv.b64.part3_1 "$D"/encoded/sample_market_min.csv.b64.part3_2 "$D"/encoded/sample_market_min.csv.b64.part3_3_1 "$D"/encoded/sample_market_min.csv.b64.part3_3_2 "$D"/encoded/sample_market_min.csv.b64.part3_3_3 "$D"/encoded/sample_market_min.csv.b64.part4 | base64 -d | gzip -d > "$D/sample_market_min.csv"
          echo 'e4bce5f43ba3a6db80ff6e5c9386249d05f59fc61499dd052ca5180e63627ebe  '"$D/run_r45a.py" | sha256sum -c -
          echo 'bc58fcf4bf4a452d1769dacd9111b1cdf88e5039a45e706d339559a3627f163b  '"$D/sample_market_min.csv" | sha256sum -c -
      - name: Install fixed research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.3.1 numpy==2.3.2 scipy==1.16.1 pyreadr==0.5.3 rapidfuzz==3.13.0 scikit-learn==1.9.0
      - name: Fetch external historical capability source
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/r45a_player_capability_300_retro
          git clone --depth 1 https://github.com/jasonsignolet/football.git "$D/external_football"
          cd "$D/external_football"
          git rev-parse HEAD | tee ../external_source_commit.txt
      - name: Convert RData with R-native date semantics
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/r45a_player_capability_300_retro
          cd "$D"
          Rscript - <<'RS'
          files <- c('football_match.RData','team.RData','player_attributes.RData','team_attributes.RData')
          for (f in files) {
            e <- new.env(parent=emptyenv())
            n <- load(file.path('external_football','data',f), envir=e)
            stopifnot(length(n)==1)
            x <- e[[n[[1]]]]
            out <- file.path('external_football','data',sub('\\.RData$','.csv',f))
            write.csv(x,out,row.names=FALSE,na='')
            if ('date' %in% names(x)) cat(f, as.character(min(x$date,na.rm=TRUE)), as.character(max(x$date,na.rm=TRUE)), '\n')
          }
          RS
      - name: Apply deterministic loader-only fix
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/r45a_player_capability_300_retro
          cd "$D"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('run_r45a.py'); s=p.read_text()
          old="""def read_rdata(name):\n    p=EXT/name\n    r=pyreadr.read_r(str(p))\n    dfs=[v for v in r.values() if isinstance(v,pd.DataFrame)]\n    if len(dfs)!=1: raise RuntimeError(f'{name}: expected 1 dataframe got keys={list(r.keys())}')\n    df=dfs[0]\n    print(name,df.shape,list(df.columns)[:12],flush=True)\n    return df\n"""
          new="""def read_rdata(name):\n    p=EXT/name\n    csvp=p.with_suffix('.csv')\n    if not csvp.exists(): raise RuntimeError(f'{name}: R-native CSV missing')\n    df=pd.read_csv(csvp,low_memory=False)\n    print(name,df.shape,list(df.columns)[:12],flush=True)\n    return df\n"""
          if old not in s: raise SystemExit('loader patch anchor not found')
          s=s.replace(old,new,1); p.write_text(s)
          receipt={'fix':'RDATA_DATE_LOADER_ONLY','reason':'pyreadr 0.5.3 converted R Date fields to 1970-01-01','sample_sha256':'bc58fcf4bf4a452d1769dacd9111b1cdf88e5039a45e706d339559a3627f163b','original_runner_sha256':'e4bce5f43ba3a6db80ff6e5c9386249d05f59fc61499dd052ca5180e63627ebe','patched_runner_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'model_feature_parameter_changes':0}
          Path('engineering_fix_receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Run frozen retrospective study
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/r45a_player_capability_300_retro
          cd "$D"
          EURO_FOOTBALL_DATA=external_football/data R45A_OUT=r45a_output python run_r45a.py | tee r45a_console.log
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('r45a_output/result.json')
          x=json.loads(p.read_text())
          assert x['formal_weight']==0
          assert x['status']=='RETROSPECTIVE_RESEARCH_ONLY'
          print(json.dumps({'coverage':x['coverage'],'metrics':x['metrics'],'bootstrap':x['bootstrap']},indent=2))
          PY
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          D=football-data/research/r45a_player_capability_300_retro
          if [ -d "$D/r45a_output" ]; then find "$D/r45a_output" -type f -print0 | sort -z | xargs -0 sha256sum > "$D/r45a_output_sha256.txt"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r45a-player-capability-300-retro
          path: |
            football-data/research/r45a_player_capability_300_retro/r45a_output
            football-data/research/r45a_player_capability_300_retro/r45a_console.log
            football-data/research/r45a_player_capability_300_retro/r45a_output_sha256.txt
            football-data/research/r45a_player_capability_300_retro/external_source_commit.txt
            football-data/research/r45a_player_capability_300_retro/engineering_fix_receipt.json
          if-no-files-found: warn
