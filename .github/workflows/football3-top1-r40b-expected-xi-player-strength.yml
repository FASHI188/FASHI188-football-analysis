name: football3 top1 R40B expected-XI player strength

on:
  push:
    branches:
      - football3/top1-r40b-expected-xi-player-strength
    paths:
      - football-data/experiments/top1_r40b_expected_xi_player_strength/run_experiment_r40b.py
      - .github/workflows/football3-top1-r40b-expected-xi-player-strength.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r40b:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r40b-expected-xi-player-strength
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R40B expected-XI player strength
        run: python football-data/experiments/top1_r40b_expected_xi_player_strength/run_experiment_r40b.py run
      - name: Verify R40B contract
        run: python football-data/experiments/top1_r40b_expected_xi_player_strength/run_experiment_r40b.py verify
      - name: Persist R40B evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r40b_expected_xi_player_strength/results/summary_r40b.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R40B expected-XI player strength'
            git fetch origin football3/top1-r40b-expected-xi-player-strength
            git rebase origin/football3/top1-r40b-expected-xi-player-strength
            git push origin HEAD:football3/top1-r40b-expected-xi-player-strength
          fi
      - name: Upload R40B artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r40b-expected-xi-player-strength
          path: football-data/experiments/top1_r40b_expected_xi_player_strength/results/summary_r40b.json
          if-no-files-found: error
          retention-days: 90
