name: Football3 Official Generic Runner Candidate Regression V1

on:
  push:
    branches:
      - football3/formal-state-integrity-guard-governed-candidate-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OFFICIAL_RUNNER_BASE_HEAD: '0187e39ef33bedf68e1e99013362b65e731ea4c9'
  OFFICIAL_RUNNER_PATH: '.github/workflows/football3-formal-gpt-runner-integration-v1.yml'

jobs:
  generic-runner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove official runner workflow restored byte-for-byte from governed base
        run: |
          set -euo pipefail
          git show "${OFFICIAL_RUNNER_BASE_HEAD}:${OFFICIAL_RUNNER_PATH}" > /tmp/official-base.yml
          cmp --silent /tmp/official-base.yml "$OFFICIAL_RUNNER_PATH"
          sha256sum /tmp/official-base.yml "$OFFICIAL_RUNNER_PATH" | tee runner_workflow_sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/football3-formal-gpt-runner-integration-v1.yml').read_text()
          required=[
            'football3/formal-gpt-runner-integration-v1','workflow_dispatch:',
            'football3/formal-gpt-runner-request-carrier-v1','Build audited invocation request',
            'Restore latest durable formal state Artifact','Download byte-bound frozen FULL rebuild sources',
            'Execute frozen original formal runner through gateway','Probe missing input routes to FULL and fails closed',
            'Upload prediction or gap receipt','Upload complete reusable state bundle',
            'Preserve main gateway failure as job failure']
          missing=[x for x in required if x not in s]
          assert not missing,missing
          assert 'football3/formal-gpt-runner-identity-repair-v1' not in s
          assert 'xg_coverage_rebuild_replay_ger_v1.py' not in s
          print('OFFICIAL_GENERIC_RUNNER_BYTE_RESTORE_PASS')
          PY
      - name: Restore frozen generic regression sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runner/understat .runner/confirmation .runner/out
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" -o .runner/understat.zip
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" -o .runner/confirmation.zip
          unzip -q .runner/understat.zip -d .runner/understat
          unzip -q .runner/confirmation.zip -d .runner/confirmation
      - name: Exercise arbitrary non-Stuttgart request path and FAST FULL equivalence
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_gpt_gateway_v1/formal_state_integrity_regression_v2.py \
            --repo-root "$PWD" --understat-db "$PWD/.runner/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runner/confirmation" --out "$PWD/.runner/out"
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('.runner/out/formal_state_integrity_regression.json').read_text())
          assert d['status']=='PASS' and d['non_stuttgart_case_n']>=4
          assert d['target_specific_replay_used'] is False
          assert d['all_fast_full_probability_byte_equal'] and d['all_fast_full_matrix_byte_equal']
          assert d['legal_fallback_frozen_v1_exact'] is True
          PY
      - name: Exercise production missing-input FULL fail-closed probe
        run: |
          set -euo pipefail
          mkdir -p .runner/missing
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_runtime_missing_input_probe_v1.py \
            --repo-root "$PWD" --understat-db "$PWD/.runner/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runner/confirmation" --work "$PWD/.runner/missing-work" --out "$PWD/.runner/missing"
          test -n "$(find .runner/missing -type f -print -quit)"
      - name: Prove generic entry has guard and no target-specific repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('football-data/formal_gpt_gateway_v1/entry.py').read_text()
          assert 'formal_state_integrity_guard_v1' in s
          assert 'formal_state_integrity_coverage_patch_v1' in s
          assert 'formal_state_integrity_xg_history_count_fix_v1' in s
          assert 'target_identity_replay_fix_v1' not in s
          assert 'xg_trigger_diagnostic_fix_v2' not in s
          PY
      - name: Write official generic runner regression manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('.github/workflows/football3-formal-gpt-runner-integration-v1.yml')
          r=json.loads(pathlib.Path('.runner/out/formal_state_integrity_regression.json').read_text())
          m={'schema_version':'football3-official-generic-runner-candidate-regression-v1','status':'PASS',
             'candidate_head':os.environ['GITHUB_SHA'],'production_authority':False,
             'official_runner_byte_equal_base':True,'official_runner_base_head':os.environ['OFFICIAL_RUNNER_BASE_HEAD'],
             'official_runner_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'generic_request_path':True,'persistent_state_restore_contract':True,'fast_to_full_contract':True,
             'missing_input_fail_closed_contract':True,'failure_receipt_contract':True,
             'non_stuttgart_case_n':r['non_stuttgart_case_n'],'fast_full_matrix_byte_equal':r['all_fast_full_matrix_byte_equal'],
             'fast_full_probability_byte_equal':r['all_fast_full_probability_byte_equal'],
             'legal_fallback_frozen_v1_exact':r['legal_fallback_frozen_v1_exact'],'target_specific_replay_used':False}
          pathlib.Path('.runner/official_generic_runner_manifest.json').write_text(json.dumps(m,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(m,sort_keys=True))
          PY
      - name: Upload official generic runner regression Artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-official-generic-runner-regression-${{ github.run_id }}
          path: |
            runner_workflow_sha256.txt
            .runner/official_generic_runner_manifest.json
            .runner/out/formal_state_integrity_regression.json
            .runner/missing/
          if-no-files-found: error
          retention-days: 90
