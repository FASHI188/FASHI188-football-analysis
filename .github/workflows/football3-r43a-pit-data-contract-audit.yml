name: football3 R43A PIT data contract audit

on:
  push:
    branches:
      - football3/r43a-pit-data-contract-audit
    paths:
      - football-data/experiments/r43a_pit_data_contract_audit/**
      - .github/workflows/football3-r43a-pit-data-contract-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43a-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43a-pit-data-contract-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow
      - name: Restore R9b 20k source spine
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43A PIT data contract audit
        run: python football-data/experiments/r43a_pit_data_contract_audit/run_r43a_pit_audit.py run
      - name: Verify R43A contract
        run: python football-data/experiments/r43a_pit_data_contract_audit/run_r43a_pit_audit.py verify
      - name: Persist R43A audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43a_pit_data_contract_audit/results/summary_r43a_pit_contract_audit.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43A PIT source contract audit'
            git fetch origin football3/r43a-pit-data-contract-audit
            git rebase origin/football3/r43a-pit-data-contract-audit
            git push origin HEAD:football3/r43a-pit-data-contract-audit
          fi
      - name: Upload R43A artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43a-pit-data-contract-audit
          path: football-data/experiments/r43a_pit_data_contract_audit/results/summary_r43a_pit_contract_audit.json
          if-no-files-found: error
          retention-days: 90
