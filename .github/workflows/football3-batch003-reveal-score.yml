name: football3 Batch-003 reveal score

on:
  push:
    branches:
      - football3/batch003-reveal-score
    paths:
      - football-data/experiments/batch003_reveal_score/score_batch003.py
      - .github/workflows/football3-batch003-reveal-score.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch003-reveal-score
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reveal and score locked Batch-003 100
        run: python football-data/experiments/batch003_reveal_score/score_batch003.py run
      - name: Verify Batch-003 reveal contract
        run: python football-data/experiments/batch003_reveal_score/score_batch003.py verify
      - name: Upload Batch-003 reveal artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch003-reveal-score
          path: football-data/experiments/batch003_reveal_score/results/summary_batch003_reveal.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist Batch-003 reveal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch003_reveal_score/results/summary_batch003_reveal.json
          git commit -m '[revealed] football3 Batch-003 score S60-S91' || true
          git fetch origin football3/batch003-reveal-score
          git rebase origin/football3/batch003-reveal-score
          git push origin HEAD:football3/batch003-reveal-score
