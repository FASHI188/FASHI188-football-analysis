      - run: python -m py_compile football-data/validation/diagnose_kleague_ajax_v6463b.py
      - run: python football-data/validation/diagnose_kleague_ajax_v6463b.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_kleague_ajax_contract_v6463b_status.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.46.3b K League AJAX contract"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
