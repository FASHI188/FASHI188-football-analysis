name: Football Direct-T GD Joint Fixed200 R1

on:
  push:
    branches: ["research/direct-t-gd-fixed200-20260816"]
    paths:
      - "football-data/validation/evaluate_direct_t_gd_joint_fixed200_r1.py"
      - "football-data/validation/diagnose_direct_t_gd_fixed200_oracle_t_r1.py"
      - ".github/workflows/football-direct-t-gd-fixed200-r1.yml"
  pull_request:
    branches: ["research/v510-context-market-prototype-r1"]
    paths:
      - "football-data/validation/evaluate_direct_t_gd_joint_fixed200_r1.py"
      - "football-data/validation/diagnose_direct_t_gd_fixed200_oracle_t_r1.py"
      - ".github/workflows/football-direct-t-gd-fixed200-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-direct-t-gd-fixed200-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile evaluators
        run: |
          python -m py_compile football-data/validation/evaluate_direct_t_gd_joint_fixed200_r1.py
          python -m py_compile football-data/validation/diagnose_direct_t_gd_fixed200_oracle_t_r1.py
      - name: Self-test score mapping
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/evaluate_direct_t_gd_joint_fixed200_r1.py --self-test
      - name: Materialize audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run identity-frozen fixed200 exploratory evaluation
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/evaluate_direct_t_gd_joint_fixed200_r1.py
      - name: Run post-result oracle-T diagnostic on same fixed200
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/diagnose_direct_t_gd_fixed200_oracle_t_r1.py
      - name: Show compact result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('football-data/manifests/direct_t_gd_joint_fixed200_r1_status.json').read_text(encoding='utf-8'))
          b=json.loads(Path('football-data/manifests/direct_t_gd_fixed200_oracle_t_diagnostic_r1.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'joint_sample': a['sample'],
              'joint_metrics': a['metrics'],
              'joint_draw': a['draw_diagnostics'],
              'oracle_hda': b['oracle_hda'],
              'oracle_exact_score': b['oracle_exact_score'],
              'oracle_draw_decomposition': b['draw_decomposition'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload fixed200 evidence
        uses: actions/upload-artifact@v4
        with:
          name: direct-t-gd-joint-fixed200-r1-${{ github.sha }}
          path: |
            football-data/manifests/direct_t_gd_joint_fixed200_r1_status.json
            football-data/manifests/direct_t_gd_joint_fixed200_r1_rows.csv
            football-data/manifests/direct_t_gd_fixed200_oracle_t_diagnostic_r1.json
            football-data/manifests/direct_t_gd_fixed200_oracle_t_diagnostic_r1_rows.csv
          if-no-files-found: error
          retention-days: 30
