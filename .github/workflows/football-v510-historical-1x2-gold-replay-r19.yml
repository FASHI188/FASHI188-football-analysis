name: Football V5.1 Historical 1X2 Gold Replay R19

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "football-data/config/v510_historical_1x2_gold_replay_r19.json"
      - "football-data/validation/evaluate_v510_historical_1x2_gold_replay_r19.py"
      - "football-data/validation/v510_historical_structure_features_r1.py"
      - "football-data/manifests/v510_existing_score_market_pit_ledger_r1_rows.csv"
      - ".github/workflows/football-v510-historical-1x2-gold-replay-r19.yml"

permissions:
  contents: read

concurrency:
  group: football-v510-historical-1x2-gold-replay-r19-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Compile R19 evaluator
        run: python -m py_compile football-data/validation/evaluate_v510_historical_1x2_gold_replay_r19.py
      - name: Run R19 historical training and replay
        run: python football-data/validation/evaluate_v510_historical_1x2_gold_replay_r19.py
      - name: Validate R19 evidence identity and hard limits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v510_historical_1x2_gold_replay_r19_status.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['data_identity']=={
            'rows':26873,'competitions':16,'draws':6976,'zero_zero':1910,'tail_7plus':630
          }
          assert x['rolling_test_rows']==15639
          assert x['rolling_test_unique_identities']==15639
          assert x['gold_sample']['rows']==1000
          assert x['gold_sample']['selection_uses_labels'] is False
          assert len(x['gold_sample']['identity_sha256'])==64
          assert x['ruling']['historical_training_and_repeated_replay_allowed'] is True
          assert x['ruling']['forward_matches_are_final_confirmation_not_training_prerequisite'] is True
          assert x['ruling']['current_match_probability_allowed'] is False
          assert x['ruling']['formal_weight']==0
          print(json.dumps({
            'status':x['status'],
            'gold_sample':x['gold_sample'],
            'full_rolling':x['full_rolling'],
            'ruling':x['ruling'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload R19 outputs
        uses: actions/upload-artifact@v4
        with:
          name: v510-historical-1x2-gold-replay-r19
          path: |
            football-data/manifests/v510_historical_1x2_gold_replay_r19_status.json
            football-data/manifests/v510_historical_1x2_gold_replay_r19_gold.csv
            football-data/manifests/v510_historical_1x2_gold_replay_r19_stability.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no repository persistence
        run: |
          git status --short
          test -z "$(git diff --cached --name-only)"
