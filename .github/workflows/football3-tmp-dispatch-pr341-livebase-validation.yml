name: Football3 Temporary Dispatch PR341 Livebase Validation

on:
  push:
    branches:
      - football3/tmp-dispatch-pr341-livebase-validation-20260908-v1

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical formal runner from integration ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/349340611/dispatches"
          payload='{"ref":"football3/formal-gpt-runner-integration-v1","inputs":{"request_pr_number":"341"}}'
          code="$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${endpoint}" \
            -d "${payload}")"
          echo "dispatch_http_status=${code}"
          if [ "${code}" != "204" ]; then
            cat /tmp/dispatch-response.json || true
            exit 1
          fi
          echo 'WORKFLOW_DISPATCH_ACCEPTED'
