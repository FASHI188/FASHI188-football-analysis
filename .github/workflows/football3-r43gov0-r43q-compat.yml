name: football3 R43GOV0 M5C R43Q compatibility

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/r43q_market_score_core.py
      - football-data/tests/test_r43q_market_score_compat.py
      - .github/workflows/football3-r43gov0-r43q-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r43q-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Fetch exact pinned R43Q source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/run_r43q0.py https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/d738d5066d5c5a79eb4ee5856c034ee239521706/football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py
          test "$(git hash-object /tmp/run_r43q0.py)" = "299b86ed07e49af0b9ec5c7632f519e91e836158"
      - name: Compile M5C Q component
        run: |
          python -m py_compile football-data/components/r43q_market_score_core.py
          python -m py_compile football-data/tests/test_r43q_market_score_compat.py
      - name: Run exact source compatibility tests
        id: compat
        continue-on-error: true
        env:
          R43Q_SOURCE_FILE: /tmp/run_r43q0.py
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43q_market_score_compat.py' -v 2>&1 | tee /tmp/r43q_compat_test.log
      - name: Upload M5C diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5c-r43q-diagnostic
          path: /tmp/r43q_compat_test.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce exact compatibility gate
        if: steps.compat.outcome != 'success'
        run: exit 1
      - name: Write M5C Q gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5c_r43q_compat_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5c-r43q-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "source_component": "R43Q0 sharp market score base",
            "source_blob_sha": "299b86ed07e49af0b9ec5c7632f519e91e836158",
            "source_commit": "d738d5066d5c5a79eb4ee5856c034ee239521706",
            "market_surfaces": ["1x2","asian_handicap","over_under"],
            "same_timestamp_required_by_source_contract": true,
            "score_matrix_core_migrated": true,
            "draw_calibrator_migrated": true,
            "exact_source_compatibility": true,
            "enabled_by_default": false,
            "historical_architecture_gate_passed": false,
            "historical_full_volume_53pct_met": false,
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M5D_migrate_R43R_strong_shrink_football_residual_disabled"
          }
          JSON
      - name: Upload M5C Q gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5c-r43q-compat-gate
          path: football-data/governance/r43gov0/results/m5c_r43q_compat_gate.json
          if-no-files-found: error
          retention-days: 90
