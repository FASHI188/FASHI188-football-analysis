name: Football R39Q One-Shot Live Bootstrap

on:
  push:
    branches:
      - research/e3g0d-one-shot-live-r39q
    paths:
      - '.github/workflows/football-e3g0d-r39q-one-shot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: football-r39q-one-shot-live-bootstrap
  cancel-in-progress: false

env:
  ROOT: football-data/research
  CONTRACT: football-data/research/e3g0d_r39q_one_shot_contract.json
  WRAPPER: football-data/research/e3g0d_one_shot_bootstrap_r39q.py
  ARCHIVE: football-data/research/e3g0d_api_football_archive_helper_secure.py
  AUTH_NONCE: R39Q-20260810-EPL2026-ONE-SHOT-BUILD-PLAN-V1
  TARGET_DATE: '2026-08-21'
  LEAGUE_ID: '39'
  SEASON_ID: '2026'

jobs:
  one-shot-live-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact frozen one-shot contract
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_REF" = 'refs/heads/research/e3g0d-one-shot-live-r39q'
          test "$RUN_ATTEMPT_VALUE" = '1'
          python -m py_compile "$WRAPPER" "$ROOT"/e3g0d_*.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('football-data/research/e3g0d_r39q_one_shot_contract.json').read_text())
          assert c['status']=='AUTHORIZED_ONE_SHOT_RESEARCH_BOOTSTRAP'
          assert c['authorization_nonce']=='R39Q-20260810-EPL2026-ONE-SHOT-BUILD-PLAN-V1'
          assert c['branch']=='research/e3g0d-one-shot-live-r39q'
          assert c['event']=='push' and c['run_attempt_required']==1
          assert c['mode']=='build-plan' and c['endpoint']=='fixtures'
          assert c['competition_id']==39 and c['season_id']==2026 and c['target_date_utc']=='2026-08-21'
          assert c['fixture_limit']==1 and c['max_provider_requests']==1 and c['retries']==0
          h=c['hard_limits']
          assert h['schedule_activation'] is False and h['automatic_recurring_collection'] is False
          assert h['model_fit']==h['target_labels_accessed']==h['candidate_probabilities']==h['formal_weight']==0
          assert h['formal_model_mutation']==h['formal_data_mutation']==h['config_mutation']==h['CURRENT_mutation']==h['main_mutation']==0
          print('PASS_R39Q_FROZEN_ONE_SHOT_CONTRACT')
          PY
          files="$(git diff --name-only c5e2931e85930dff9203deffccb69464796f1c79...HEAD)"
          ! printf '%s\n' "$files" | grep -E '(^|/)(models?|data/formal|config|CURRENT)'

      - name: Verify API-Football key is configured without exposing it
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo 'R39Q_API_FOOTBALL_KEY_MISSING' >&2
            exit 2
          fi
          echo 'PASS_R39Q_API_FOOTBALL_KEY_PRESENT'

      - name: Lock authorization nonce and reserve one request
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_VALUE: ${{ github.sha }}
          RUN_VALUE: ${{ github.run_id }}
          ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'football-data/research')
          from e3g0d_archive_github import GitHubReader
          from e3g0d_api_football_archive_helper import quota_used
          from e3g0d_runtime import create_reservation
          from e3g0d_common import iso,packed
          repo=os.environ['REPOSITORY'];token=os.environ['GH_TOKEN'];nonce=os.environ['AUTH_NONCE']
          reader=GitHubReader(repo,token)
          consumed=[a for a in reader.artifacts('football-e3g0d-r39q-consumed-') if not a.get('expired') and nonce in str(a.get('name',''))]
          if consumed:
              raise SystemExit('R39Q_AUTHORIZATION_ALREADY_CONSUMED')
          now=dt.datetime.now(dt.timezone.utc);day=now.date().isoformat();q=quota_used(reader,day);used=int(q['requests_used_today'])
          root=Path(os.environ['RUNNER_TEMP']);expires=iso(now+dt.timedelta(days=30))
          create_reservation({
              'MAXIMUM':'1','USED':str(used),'HEAD_VALUE':os.environ['HEAD_VALUE'],'RUN_VALUE':os.environ['RUN_VALUE'],
              'ATTEMPT_VALUE':os.environ['ATTEMPT_VALUE'],'REQUEST_DAY':day,'MODE_VALUE':'build-plan','TARGET':'2026-08-21','EXPIRES':expires
          },root/'reservation')
          marker={
              'schema_version':'R39Q-AUTHORIZATION-CONSUMED-1.0','authorization_nonce':nonce,'provider':'API-Football',
              'mode':'build-plan','competition_id':39,'season_id':2026,'target_date_utc':'2026-08-21',
              'max_provider_requests':1,'run_head':os.environ['HEAD_VALUE'],'workflow_run_id':os.environ['RUN_VALUE'],
              'workflow_run_attempt':int(os.environ['ATTEMPT_VALUE']),'request_day_utc':day,'consumed_at_utc':iso(now),
              'append_only':True,'formal_weight':0
          }
          (root/'consumed').mkdir(parents=True,exist_ok=True)
          (root/'consumed'/'authorization_consumed.json').write_bytes(packed(marker)+b'\n')
          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a',encoding='utf-8') as f:
              f.write(f'used={used}\nrequest_day={day}\nexpires={expires}\n')
          print(json.dumps({'status':'PASS_R39Q_AUTHORIZATION_UNUSED_AND_QUOTA_RESERVED','requests_used_today':used,'reservation':1,'formal_weight':0},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: reservation_upload
        with:
          name: football-e3g0d-quota-reservation-${{ steps.prepare.outputs.request_day }}-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reservation
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: consumed_upload
        with:
          name: football-e3g0d-r39q-consumed-R39Q-20260810-EPL2026-ONE-SHOT-BUILD-PLAN-V1-${{ github.run_id }}
          path: ${{ runner.temp }}/consumed
          retention-days: 30
          if-no-files-found: error

      - name: Execute the single authorized provider request
        id: collect
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R39Q_ONE_SHOT_BOOTSTRAP: 'true'
          REQUESTS_USED_TODAY: ${{ steps.prepare.outputs.used }}
          RESERVATION_UPLOAD: ${{ steps.reservation_upload.outcome }}
          CONSUMED_UPLOAD: ${{ steps.consumed_upload.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python "$WRAPPER" --output-dir "$RUNNER_TEMP/out"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'out/r39q_bootstrap_summary.json').read_text())
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as f:
              f.write('plan_sha='+s['plan_sha256']+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence_upload
        if: always() && steps.consumed_upload.outcome == 'success'
        with:
          name: football-e3g0d-r39q-bootstrap-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: plan_upload
        if: steps.collect.outcome == 'success'
        with:
          name: football-e3g0d-plan-2026-08-21-league-39-season-2026-sha256-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ steps.collect.outputs.plan_sha }}
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: error

      - name: Build immutable plan index
        id: plan_index
        if: steps.plan_upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.plan_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.plan_upload.outputs.artifact-digest }}
          ARTIFACT_NAME: football-e3g0d-plan-2026-08-21-league-39-season-2026-sha256-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ steps.collect.outputs.plan_sha }}
          PLAN_SHA: ${{ steps.collect.outputs.plan_sha }}
          TARGET: '2026-08-21'
          REQUEST_DAY: ${{ steps.prepare.outputs.request_day }}
          LEAGUE: '39'
          SEASON: '2026'
          HEAD_VALUE: ${{ github.sha }}
          RUN_VALUE: ${{ github.run_id }}
          ATTEMPT_VALUE: ${{ github.run_attempt }}
          EXPIRES: ${{ steps.prepare.outputs.expires }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'football-data/research')
          from e3g0d_runtime import build_plan_index
          receipts=list((Path(os.environ['RUNNER_TEMP'])/'out/run_receipts').glob('*.json'))
          if len(receipts)!=1: raise SystemExit('R39Q_RUN_RECEIPT_AMBIGUOUS')
          env=dict(os.environ);env['RECEIPT']=receipts[0].as_posix()
          build_plan_index(env,Path(os.environ['RUNNER_TEMP'])/'index')
          print('PASS_R39Q_PLAN_INDEX_BUILT')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: plan_index_upload
        if: steps.plan_index.outcome == 'success'
        with:
          name: football-e3g0d-plan-index-${{ steps.plan_upload.outputs.artifact-id }}-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/index
          retention-days: 30
          if-no-files-found: error

      - name: Verify terminal one-shot boundary
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PLAN_UPLOAD_OUTCOME: ${{ steps.plan_upload.outcome }}
          INDEX_UPLOAD_OUTCOME: ${{ steps.plan_index_upload.outcome }}
          PLAN_ARTIFACT_ID: ${{ steps.plan_upload.outputs.artifact-id }}
          PLAN_ARTIFACT_DIGEST: ${{ steps.plan_upload.outputs.artifact-digest }}
          INDEX_ARTIFACT_ID: ${{ steps.plan_index_upload.outputs.artifact-id }}
          INDEX_ARTIFACT_DIGEST: ${{ steps.plan_index_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$COLLECT_OUTCOME" = 'success'
          test "$PLAN_UPLOAD_OUTCOME" = 'success'
          test "$INDEX_UPLOAD_OUTCOME" = 'success'
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);s=json.loads((root/'out/r39q_bootstrap_summary.json').read_text())
          assert s['status']=='PASS_R39Q_FIRST_AUTHENTIC_FORWARD_FIXTURE_OBSERVATION'
          assert s['request_attempts']==1 and s['plan_fixture_count']>=1 and s['snapshot_count']==1
          assert s['target_labels_accessed']==s['model_fits']==s['candidate_probabilities']==s['formal_weight']==0
          final={
              'schema_version':'R39Q-TERMINAL-RECEIPT-1.0','status':'PASS_R39Q_ONE_SHOT_FORWARD_BOOTSTRAP',
              'request_attempts':1,'plan_fixture_count':s['plan_fixture_count'],'plan_sha256':s['plan_sha256'],
              'requested_observation':s['snapshot'],'plan_artifact_id':int(os.environ['PLAN_ARTIFACT_ID']),
              'plan_artifact_digest':os.environ['PLAN_ARTIFACT_DIGEST'],'plan_index_artifact_id':int(os.environ['INDEX_ARTIFACT_ID']),
              'plan_index_artifact_digest':os.environ['INDEX_ARTIFACT_DIGEST'],'target_labels_accessed':0,'model_fits':0,
              'candidate_probabilities':0,'formal_weight':0,'schedule_enabled':False,'main_mutation':0
          }
          (root/'r39q-final').mkdir(parents=True,exist_ok=True)
          (root/'r39q-final/terminal_receipt.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':final['status'],'plan_fixture_count':final['plan_fixture_count'],'plan_artifact_id':final['plan_artifact_id'],'plan_index_artifact_id':final['plan_index_artifact_id'],'formal_weight':0},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: football-e3g0d-r39q-terminal-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39q-final
          retention-days: 30
          if-no-files-found: warn
