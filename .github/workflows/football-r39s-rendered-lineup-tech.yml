name: Football R39S Rendered Lineup Technical Audit

on:
  push:
    branches:
      - research/premierleague-rendered-lineup-r39s
    paths:
      - '.github/workflows/football-r39s-rendered-lineup-tech.yml'

permissions:
  contents: read

concurrency:
  group: football-r39s-rendered-lineup-tech
  cancel-in-progress: false

jobs:
  rendered-lineup-tech:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify frozen R39S contract and browser availability
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/premierleague_rendered_lineup_r39s/render_lineup_pages_r39s.py
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          p=Path('football-data/research/premierleague_rendered_lineup_r39s/contract_r39s.json')
          c=json.loads(p.read_text())
          assert c['schema_version']=='R39S-PL-RENDERED-LINEUP-TECH-1.0'
          assert c['research_only'] is True and c['formal_weight']==0
          assert c['source']['allowed_host']=='www.premierleague.com'
          assert c['source']['football_api_requests']==0 and c['source']['authentication'] is False
          assert c['technical_reference']['role']=='parser_self_test_only_not_research_sample'
          assert c['technical_reference']['must_not_be_used_for_model_fit_or_evaluation'] is True
          assert c['forward_target']['match_id']==2645195
          assert c['forward_target']['scheduled_kickoff_utc']=='2026-08-21T19:00:00Z'
          assert c['render_rules']['max_browser_navigations']==2
          b=c['hard_boundaries']
          assert b['blind100_labels_accessed']==b['research_target_labels_used']==b['model_fits']==b['candidate_probabilities']==0
          browser=next((shutil.which(x) for x in ('google-chrome','google-chrome-stable','chromium','chromium-browser') if shutil.which(x)),None)
          assert browser, 'HEADLESS_BROWSER_NOT_FOUND'
          print('PASS_R39S_ZERO_LABEL_RENDER_CONTRACT', browser)
          PY

      - name: Render technical reference and forward baseline
        run: |
          set -euo pipefail
          python football-data/research/premierleague_rendered_lineup_r39s/render_lineup_pages_r39s.py \
            --contract football-data/research/premierleague_rendered_lineup_r39s/contract_r39s.json \
            --output "$RUNNER_TEMP/r39s-render"

      - name: Verify R39S terminal receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from datetime import datetime
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r39s-render'
          p=root/'render_receipt_r39s.json'
          raw=p.read_bytes(); r=json.loads(raw)
          assert r['schema_version']=='R39S-RENDER-RECEIPT-1.0'
          assert r['terminal']=='PASS_R39S_RENDERED_LINEUP_TECHNICAL_AUDIT'
          assert r['blind100_labels_accessed']==r['research_target_labels_used']==r['model_fits']==r['candidate_probabilities']==0
          assert r['football_api_requests']==r['api_keys_used']==0 and r['formal_weight']==0
          assert all(r['technical_reference']['expected_marker_results'].values())
          ko=datetime.fromisoformat(r['forward_target']['scheduled_kickoff_utc'].replace('Z','+00:00'))
          obs=datetime.fromisoformat(r['forward_target']['observed_at_utc'].replace('Z','+00:00'))
          assert obs < ko
          for key,name in [('technical_reference','technical_reference_rendered_dom.html'),('forward_target','forward_target_rendered_dom.html')]:
              q=root/name
              assert q.is_file() and q.stat().st_size>0
              assert hashlib.sha256(q.read_bytes()).hexdigest()==r[key]['dom_sha256']
              assert re.fullmatch(r'[0-9a-f]{64}',r[key]['dom_sha256'])
          expected=(root/'render_receipt_r39s.sha256').read_text().strip()
          assert expected==hashlib.sha256(raw).hexdigest()
          print(json.dumps({'terminal':r['terminal'],'browser_version':r['browser_version'],'forward_observed_at_utc':r['forward_target']['observed_at_utc'],'diagnostics':r['diagnostics']},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r39s-rendered-lineup-tech-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39s-render
          retention-days: 30
          if-no-files-found: error
