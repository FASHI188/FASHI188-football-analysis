name: Football R39S Rendered Lineup Technical Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-freeze-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm R39S is terminally frozen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/research/premierleague_rendered_lineup_r39s/terminal_receipt_r39s.json')
          r=json.loads(p.read_text())
          assert r['terminal']=='PASS_R39S_CONFIRMED_XI_DETECTOR_CONFIRMATION'
          assert r['next_stage_authorized'] is False
          assert r['hard_boundaries']['football_api_requests']==0
          assert r['hard_boundaries']['blind100_labels_accessed']==0
          print('R39S_TERMINALLY_FROZEN_NO_AUTOMATIC_RENDER')
          PY
