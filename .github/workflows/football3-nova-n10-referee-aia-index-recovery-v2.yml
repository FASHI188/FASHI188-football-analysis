name: football3-nova-n10-referee-aia-index-recovery-v2

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_aia_index_recovery_registry_v2.json'
      - 'governance/football3/nova_n10_referee_aia_index_recovery_v2.py'
      - 'governance/football3/test_nova_n10_referee_aia_index_recovery_v2.py'
      - '.github/workflows/football3-nova-n10-referee-aia-index-recovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-nova-n10-referee-aia-index-recovery-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-aia-index-recovery-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile governance/football3/nova_n10_referee_aia_index_recovery_v2.py governance/football3/test_nova_n10_referee_aia_index_recovery_v2.py
          PYTHONPATH=governance/football3 python governance/football3/test_nova_n10_referee_aia_index_recovery_v2.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 5 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Revalidate exact official AIA Designazioni index variants
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_aia_index_recovery_v2.py             --registry governance/football3/nova_n10_referee_aia_index_recovery_registry_v2.json             --out _run --timeout 25 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/aia_index_recovery_receipt.json'))
          assert r['classification'] in {'DATA_COVERAGE_FEASIBILITY_PASS','STOP_DATA_COVERAGE'}
          assert r['recovery_attempt_n']==1
          assert r['page_variant_n']==3
          assert r['article_body_fetched'] is False
          assert r['page_expansion_performed'] is False
          assert r['match_payload_read'] is False
          assert r['standings_payload_read'] is False
          assert r['player_stats_payload_read'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-aia-index-recovery-v2-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
