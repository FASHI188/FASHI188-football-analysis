name: Football3 Weekly Top5 League Personnel Scan

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-weekly-top5-personnel-scan
  cancel-in-progress: false

jobs:
  weekly-personnel-scan:
    name: weekly-top5-personnel-scan-zero-label
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/adaptive-latent-strength-v1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Restore previous weekly fingerprint
        uses: actions/cache/restore@v4
        with:
          path: .football3-cache/weekly-top5-personnel
          key: football3-weekly-top5-personnel-${{ github.run_id }}
          restore-keys: |
            football3-weekly-top5-personnel-

      - name: Scan all 96 clubs from official league personnel/transfer surfaces
        id: scan
        continue-on-error: true
        run: |
          mkdir -p football-data/research/evidence/weekly_top5_personnel_scan
          python - <<'PY'
          import hashlib, json, re
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          OUT = Path('football-data/research/evidence/weekly_top5_personnel_scan')
          PREV = Path('.football3-cache/weekly-top5-personnel/current_snapshot.json')
          SCHEMA = 'football3_weekly_top5_league_personnel_scan_v1'
          LEAGUES = {
            'ENG_PremierLeague': {
              'teams': ['AFC Bournemouth','Arsenal','Aston Villa','Brentford','Brighton & Hove Albion','Chelsea','Coventry City','Crystal Palace','Everton','Fulham','Hull City','Ipswich Town','Leeds United','Liverpool','Manchester City','Manchester United','Newcastle United','Nottingham Forest','Sunderland','Tottenham Hotspur'],
              'membership': ['https://www.premierleague.com/en/news/4365156/new-to-the-premier-league-heres-all-you-need-to-know'],
              'personnel': ['https://www.premierleague.com/en/transfers/2026-27/summer']
            },
            'ESP_LaLiga': {
              'teams': ['Athletic Club','Atlético de Madrid','CA Osasuna','Celta','Deportivo Alavés','Elche CF','FC Barcelona','Getafe CF','Levante UD','Málaga CF','R. Racing Club','Rayo Vallecano','RC Deportivo','RCD Espanyol de Barcelona','Real Betis','Real Madrid','Real Sociedad','Sevilla FC','Valencia CF','Villarreal CF'],
              'membership': ['https://www.laliga.com/laliga-easports/clubes'],
              'personnel': ['https://www.laliga.com/en-GB/transfers/laliga-easports']
            },
            'GER_Bundesliga': {
              'teams': ['FC Augsburg','1. FC Union Berlin','SV Werder Bremen','Borussia Dortmund','SV Elversberg','Eintracht Frankfurt','Sport-Club Freiburg','Hamburger SV','TSG Hoffenheim','1. FC Köln','RB Leipzig','Bayer 04 Leverkusen','1. FSV Mainz 05','Borussia Mönchengladbach','FC Bayern München','SC Paderborn 07','FC Schalke 04','VfB Stuttgart'],
              'membership': ['https://www.bundesliga.com/de/bundesliga/clubs'],
              'personnel': ['https://www.bundesliga.com/en/bundesliga/news/official-bundesliga-transfer-centre-summer-2026-37051/']
            },
            'ITA_SerieA': {
              'teams': ['Atalanta','Bologna','Cagliari','Como','Fiorentina','Frosinone','Genoa','Inter','Juventus','Lazio','Lecce','Milan','Monza','Napoli','Parma','Roma','Sassuolo','Torino','Udinese','Venezia'],
              'membership': ['https://en.legaseriea.it/serie-a/news/looking-forward-to-the-2026-27-serie-a-fixture-list'],
              'personnel': ['https://en.legaseriea.it/serie-a/calciomercato']
            },
            'FRA_Ligue1': {
              'teams': ['Angers SCO','AJ Auxerre','Stade Brestois 29','Havre AC','Le Mans FC','RC Lens','FC Lorient','LOSC','Olympique Lyonnais','Olympique de Marseille','AS Monaco','OGC Nice','Paris FC','Paris Saint-Germain','Stade Rennais F.C.','RC Strasbourg Alsace','Toulouse FC','ESTAC Troyes'],
              'membership': ['https://ligue1.com/fr/articles/l1_article_5293-les-dates-de-reprise-des-clubs-de-l1-2627'],
              'personnel': ['https://ligue1.com/fr/articles/l1_article_5130-'],
              'discover': 'https://ligue1.com/fr/articles'
            }
          }
          ALIASES = {
            'AFC Bournemouth':['Bournemouth'], 'Brighton & Hove Albion':['Brighton'],
            'Hull City':['Hull'], 'Ipswich Town':['Ipswich'], 'Leeds United':['Leeds'],
            'Manchester United':['Manchester United','Man Utd'], 'Newcastle United':['Newcastle'],
            'Nottingham Forest':['Nottingham Forest',"Nott'm Forest"], 'Tottenham Hotspur':['Tottenham','Spurs'],
            'Atlético de Madrid':['Atlético de Madrid','Atletico de Madrid'], 'Celta':['Celta','Celta Vigo'],
            'Deportivo Alavés':['Deportivo Alavés','Alavés'], 'R. Racing Club':['R. Racing Club','Racing Club','Real Racing Club'],
            'RC Deportivo':['RC Deportivo','Deportivo'], 'RCD Espanyol de Barcelona':['RCD Espanyol de Barcelona','Espanyol'],
            'FC Bayern München':['FC Bayern München','Bayern München','Bayern Munich'], 'Sport-Club Freiburg':['Sport-Club Freiburg','SC Freiburg','Freiburg'],
            'Hamburger SV':['Hamburger SV','Hamburg'], '1. FC Köln':['1. FC Köln','Köln','Cologne'],
            'Bayer 04 Leverkusen':['Bayer 04 Leverkusen','Bayer Leverkusen','Leverkusen'],
            'Borussia Mönchengladbach':['Borussia Mönchengladbach',"M'gladbach",'Gladbach'], 'SC Paderborn 07':['SC Paderborn 07','Paderborn'],
            'FC Schalke 04':['FC Schalke 04','Schalke'], 'Inter':['Inter','Internazionale'], 'Milan':['Milan','AC Milan'], 'Roma':['Roma','AS Roma'],
            'Havre AC':['Havre AC','Le Havre'], 'LOSC':['LOSC','Lille'], 'Olympique Lyonnais':['Olympique Lyonnais','Lyon'],
            'Olympique de Marseille':['Olympique de Marseille','Marseille'], 'Paris Saint-Germain':['Paris Saint-Germain','PSG'],
            'Stade Rennais F.C.':['Stade Rennais','Rennes'], 'RC Strasbourg Alsace':['RC Strasbourg Alsace','Strasbourg'],
            'ESTAC Troyes':['ESTAC Troyes','Troyes']
          }
          expected = {'ENG_PremierLeague':20,'ESP_LaLiga':20,'GER_Bundesliga':18,'ITA_SerieA':20,'FRA_Ligue1':18}
          assert set(LEAGUES) == set(expected)
          assert sum(len(v['teams']) for v in LEAGUES.values()) == 96
          for league, count in expected.items():
              assert len(LEAGUES[league]['teams']) == count
              assert len(set(LEAGUES[league]['teams'])) == count

          def norm(s):
              return re.sub(r'\s+', ' ', (s or '').replace('\u00a0',' ')).strip()

          def aliases(team):
              return ALIASES.get(team, [team])

          def contains(text, team):
              low = text.casefold()
              return any(a.casefold() in low for a in aliases(team))

          def snippets(text, team, radius=800):
              low = text.casefold()
              out = []
              for a in aliases(team):
                  pos = low.find(a.casefold())
                  if pos >= 0:
                      out.append(text[max(0,pos-radius):min(len(text),pos+len(a)+radius)])
              return sorted(set(out))

          def expand(page):
              for _ in range(6):
                  try:
                      buttons = page.locator('button')
                      for i in range(min(buttons.count(),80)):
                          b = buttons.nth(i)
                          try: label = norm(b.inner_text(timeout=250))
                          except: continue
                          if re.search(r'(load more|show more|view more|voir plus|mostrar más|mehr anzeigen|carica altro)', label, re.I):
                              try: b.click(timeout=600); page.wait_for_timeout(250)
                              except: pass
                      page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
                      page.wait_for_timeout(400)
                  except: pass

          def render(browser, league, role, url):
              page = browser.new_page(viewport={'width':1440,'height':1000})
              try:
                  resp = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                  page.wait_for_timeout(800); expand(page)
                  text = norm(page.locator('body').inner_text(timeout=10000))
                  if resp and resp.status >= 400: raise RuntimeError(f'http={resp.status}')
                  if len(text) < 100: raise RuntimeError(f'short={len(text)}')
                  return {'league':league,'role':role,'url':url,'final_url':page.url,'title':norm(page.title()),'text':text,'sha256':hashlib.sha256(text.encode()).hexdigest(),'status':'OK','error':None}
              except Exception as exc:
                  return {'league':league,'role':role,'url':url,'final_url':page.url,'title':'','text':'','sha256':hashlib.sha256(b'').hexdigest(),'status':'ERROR','error':str(exc)}
              finally:
                  page.close()

          def discover_ligue1(browser, url):
              page = browser.new_page(viewport={'width':1440,'height':1000})
              found = []
              try:
                  page.goto(url, wait_until='domcontentloaded', timeout=45000)
                  page.wait_for_timeout(800); expand(page)
                  links = page.locator('a')
                  for i in range(min(links.count(),500)):
                      a = links.nth(i)
                      try: href = a.get_attribute('href') or ''; label = norm(a.inner_text(timeout=250))
                      except: continue
                      marker = (label+' '+href).casefold()
                      if not any(k in marker for k in ('mercato','transfert','transfer')): continue
                      if href.startswith('/'): href = 'https://ligue1.com'+href
                      if href.startswith('https://ligue1.com/') and href not in found: found.append(href)
                      if len(found) >= 12: break
              except: pass
              finally: page.close()
              return found

          rows = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  for league,cfg in LEAGUES.items():
                      for u in cfg['membership']: rows.append(render(browser,league,'membership',u))
                      for u in cfg['personnel']: rows.append(render(browser,league,'personnel',u))
                      if cfg.get('discover'):
                          for u in discover_ligue1(browser,cfg['discover']):
                              if not any(r['url']==u for r in rows): rows.append(render(browser,league,'personnel_discovered',u))
              finally: browser.close()

          prev = None
          if PREV.exists():
              try:
                  x = json.loads(PREV.read_text())
                  if x.get('schema') == SCHEMA: prev = {(r['league'],r['team']):r for r in x.get('teams',[])}
              except: pass
          prev = prev or {}

          teams_out, missing, changed = [], [], []
          personnel_mentions = 0
          for league,cfg in LEAGUES.items():
              ms = ' '.join(r['text'] for r in rows if r['league']==league and r['role']=='membership' and r['status']=='OK')
              ps = [r for r in rows if r['league']==league and r['role'].startswith('personnel') and r['status']=='OK']
              for team in cfg['teams']:
                  membership_ok = contains(ms, team)
                  if not membership_ok: missing.append({'league':league,'team':team})
                  snips, urls = [], []
                  for src in ps:
                      s = snippets(src['text'], team)
                      if s: snips += s; urls.append(src['final_url'])
                  fp = hashlib.sha256('\n'.join(sorted(set(snips))).encode()).hexdigest()
                  mentioned = bool(snips); personnel_mentions += int(mentioned)
                  out = {'league':league,'team':team,'membership_observed':membership_ok,'personnel_mentioned':mentioned,'personnel_fingerprint_sha256':fp,'personnel_evidence_urls':sorted(set(urls))}
                  old = prev.get((league,team))
                  if old and old.get('personnel_fingerprint_sha256') != fp: changed.append({'league':league,'team':team})
                  teams_out.append(out)

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          snap = {
              'schema':SCHEMA,'project_id':'football3','season':'2026/27','observed_at_utc':now,
              'status':'PASS_SCOPE_96_ZERO_LABEL_WEEKLY_PERSONNEL_SCAN' if not missing else 'PARTIAL_MEMBERSHIP_COVERAGE',
              'league_count':5,'club_count':96,'membership_observed_count':96-len(missing),
              'personnel_mentioned_count':personnel_mentions,'membership_missing':missing,
              'changed_team_candidates':changed,
              'source_count':len(rows),'source_ok_count':sum(r['status']=='OK' for r in rows),
              'sources':[{k:r[k] for k in ('league','role','url','final_url','title','sha256','status','error')} | {'char_count':len(r['text'])} for r in rows],
              'teams':teams_out,
              'real_labels_read':0,'real_match_rows_read':0,'training':False,'tuning':False,'real_scoring':False,
              'provider_api':False,'secret_access':False,'CURRENT_change':False,'formal_pit_eligible':False,'formal_weight':0.0,'merge':False
          }
          OUT.joinpath('current_snapshot.json').write_text(json.dumps(snap,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          report = [
              '# Football3 weekly top-5 personnel scan','',
              f'- observed_at_utc: `{now}`',f'- status: `{snap["status"]}`',
              f'- clubs in scope: `96`',f'- membership observed: `{snap["membership_observed_count"]}`',
              f'- personnel/transfer mentions: `{personnel_mentions}`',
              f'- changed-team candidates vs previous: `{len(changed)}`','',
              '## Changed-team candidates'
          ]
          report += [f'- {x["league"]}: {x["team"]}' for x in changed] or ['- none / first baseline']
          report += ['','## Boundaries','- real labels/results: 0','- training/tuning/real scoring: 0/0/0','- CURRENT changes: 0','- dynamic scan output: artifact/cache only; no repository persistence']
          OUT.joinpath('scan_report.md').write_text('\n'.join(report)+'\n')
          print(json.dumps({'status':snap['status'],'clubs':96,'membership_observed':snap['membership_observed_count'],'personnel_mentions':personnel_mentions,'changed':len(changed),'sources_ok':snap['source_ok_count'],'sources':snap['source_count']},sort_keys=True))
          if missing: raise SystemExit(2)
          PY

      - name: Refresh cache payload
        if: always()
        run: |
          mkdir -p .football3-cache/weekly-top5-personnel
          test ! -f football-data/research/evidence/weekly_top5_personnel_scan/current_snapshot.json || \
            cp football-data/research/evidence/weekly_top5_personnel_scan/current_snapshot.json \
               .football3-cache/weekly-top5-personnel/current_snapshot.json

      - name: Save weekly fingerprint
        if: always() && hashFiles('.football3-cache/weekly-top5-personnel/current_snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .football3-cache/weekly-top5-personnel
          key: football3-weekly-top5-personnel-${{ github.run_id }}

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-weekly-top5-personnel-scan-${{ github.run_id }}
          path: football-data/research/evidence/weekly_top5_personnel_scan
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed if 96-club scope was not proven
        if: steps.scan.outcome != 'success'
        run: exit 1

      - name: Verify no repository persistence
        if: always()
        run: git diff --exit-code
