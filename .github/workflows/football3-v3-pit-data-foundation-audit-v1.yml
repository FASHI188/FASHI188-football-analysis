name: Football3 V3 PIT Data Foundation Audit
on:
  push:
    branches: [football3/v3-pit-data-foundation-audit-v1]
    paths:
      - '.github/workflows/football3-v3-pit-data-foundation-audit-v1.yml'
      - 'governance/football3/v3_pit_data_foundation_contract_v1.json'
      - 'governance/football3/v3_pit_data_source_inventory_v1.json'
      - 'governance/football3/v3_pit_data_provider_interface_v1.py'
      - 'governance/football3/validate_v3_pit_data_foundation_v1.py'
      - 'governance/football3/test_validate_v3_pit_data_foundation_v1.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: football3-v3-pit-data-foundation-${{ github.sha }}
  cancel-in-progress: false
env:
  EXACT_BASE: '2e2c000902e6c8d6b4e3ff1bf16387eb1c56ebf6'
  FORMAL_HEAD: 'e12f5d1193be5d81f60301cf34ab2140e11712a9'
  CURRENT_SHA256: '71d54a6fd227ad2bbdddea9d0e42b88cea2022efef8faf26c7483cd99d5b8731'
  FORMAL_V2_BLOB: 'a5ed26d5ffd4a2875cb9c658cfaa28665a8b7871'
  FORMAL_V2_TEST_BLOB: '61b25cd403fa1d9efa0dfcbc1643e0f17621944e'
  FORMAL_POINTER_BLOB: 'f07743f9c873d415fad9612f3225f64c64b10542'
  FORMAL_GATEWAY_ENTRY_BLOB: 'b41b0ede2db99c116b90270a32cd04dd240eb655'
  FOUNDATION_CONTRACT_BLOB: '897684e9655f7123dd2c338470a64c4837819639'
  FOUNDATION_IMPL_BLOB: 'eebb4aa9747794923a91e26cd36ab6e63b744f6f'
  FOUNDATION_TEST_BLOB: 'e063f42f3820beb23d6b6def1c66543246676567'
  C1_BLOB: '863cadbd7743933a888e035f6ed4a6d170e636c4'
  C2_BLOB: 'e2df5ef84629049a3f346c98da349420de898a1e'
  C3_BLOB: 'f8006e500e33cc74ac8c6b9f8fba32cb6ac446e0'
  C4_BLOB: 'cc35ba5da918e5fc1438059396284a8ffaac3278'
  C5_BLOB: '0d5930d8a58ccc6931a5fddf14b9bc62dc8fbee6'
  C6_BLOB: '78fb2c2adda89cae61cf9d5c7ebfe1ac77f57443'
  C7_BLOB: '215015a7664fda4b7b788513302d29e9e280bed8'
  C8_BLOB: 'bb2a9b8987ae9bce8edaf1ed697cf4d0bf3e72b5'
jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact base and six-file scope
        id: identity
        env:
          CANDIDATE_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXACT_BASE" HEAD)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/formal-gpt-runner-integration-v1 | cut -f1)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          python - <<'PY'
          import subprocess
          expected={
            '.github/workflows/football3-v3-pit-data-foundation-audit-v1.yml',
            'governance/football3/v3_pit_data_foundation_contract_v1.json',
            'governance/football3/v3_pit_data_source_inventory_v1.json',
            'governance/football3/v3_pit_data_provider_interface_v1.py',
            'governance/football3/validate_v3_pit_data_foundation_v1.py',
            'governance/football3/test_validate_v3_pit_data_foundation_v1.py',
          }
          got=set(subprocess.check_output(['git','diff','--name-only','2e2c000902e6c8d6b4e3ff1bf16387eb1c56ebf6...HEAD'],text=True).splitlines())
          assert got==expected,(sorted(got),sorted(expected))
          PY
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Prove formal foundation and C1-C8 research contracts immutable
        run: |
          set -euo pipefail
          for spec in \
            "football-data/new_engine_v1/formal_fusion_v2.py:$FORMAL_V2_BLOB" \
            "football-data/new_engine_v1/test_formal_fusion_v2.py:$FORMAL_V2_TEST_BLOB" \
            "football-data/config/formal_model_pointer_historical_xg_fusion_v2.json:$FORMAL_POINTER_BLOB" \
            "football-data/formal_gpt_gateway_v1/entry.py:$FORMAL_GATEWAY_ENTRY_BLOB" \
            "governance/football3/nextgen_current_v2_foundation_contract_v1.json:$FOUNDATION_CONTRACT_BLOB" \
            "governance/football3/nextgen_current_v2_foundation_v1.py:$FOUNDATION_IMPL_BLOB" \
            "governance/football3/test_nextgen_current_v2_foundation_v1.py:$FOUNDATION_TEST_BLOB" \
            "governance/football3/nextgen_market_pit_prereg_contract_v1.json:$C1_BLOB" \
            "governance/football3/nextgen_dynamic_strength_prereg_contract_v1.json:$C2_BLOB" \
            "governance/football3/nextgen_starting_xi_delta_prereg_contract_v1.json:$C3_BLOB" \
            "governance/football3/nextgen_gk_young_transfer_prereg_contract_v1.json:$C4_BLOB" \
            "governance/football3/nextgen_total_goals_expert_prereg_contract_v1.json:$C5_BLOB" \
            "governance/football3/nextgen_tactical_matchup_prereg_contract_v1.json:$C6_BLOB" \
            "governance/football3/nextgen_dynamic_gating_prereg_contract_v1.json:$C7_BLOB" \
            "governance/football3/nextgen_selected_publishing_prereg_contract_v1.json:$C8_BLOB"
          do
            path="${spec%%:*}"; expected="${spec##*:}"
            test "$(git rev-parse "$EXACT_BASE:$path")" = "$expected"
            test "$(git hash-object "$path")" = "$expected"
          done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static and dedicated permanent tests
        env:
          PYTHONPATH: governance/football3
        run: |
          set -euo pipefail
          python -m py_compile \
            governance/football3/v3_pit_data_provider_interface_v1.py \
            governance/football3/validate_v3_pit_data_foundation_v1.py \
            governance/football3/test_validate_v3_pit_data_foundation_v1.py
          python governance/football3/validate_v3_pit_data_foundation_v1.py --repo-root . | tee /tmp/validator.txt
          python governance/football3/test_validate_v3_pit_data_foundation_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 31 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Foundation permanent regression
        env:
          PYTHONPATH: 'football-data:governance/football3'
        run: |
          set -euo pipefail
          python governance/football3/test_nextgen_current_v2_foundation_v1.py 2>&1 | tee /tmp/foundation.txt
          grep -q 'Ran 14 tests' /tmp/foundation.txt
          grep -q '^OK$' /tmp/foundation.txt
          if grep -q 'skipped=' /tmp/foundation.txt; then
            echo 'NEXTGEN_FOUNDATION_INTEGRATION_SKIP_FORBIDDEN' >&2
            exit 2
          fi
      - name: Formal V2 permanent regression
        env:
          PYTHONPATH: 'football-data:football-data/research'
        run: |
          set -euo pipefail
          python football-data/new_engine_v1/test_formal_fusion_v2.py 2>&1 | tee /tmp/formal-v2.txt
          grep -q 'Ran 13 tests' /tmp/formal-v2.txt
          grep -q '^OK$' /tmp/formal-v2.txt
      - name: Seal research-only data-foundation audit receipt
        id: names
        env:
          CANDIDATE_SHA: '${{ steps.identity.outputs.candidate_sha }}'
        run: |
          set -euo pipefail
          rm -rf _seal; mkdir -p _seal/contract _seal/code _seal/evidence _seal/workflow
          cp governance/football3/v3_pit_data_foundation_contract_v1.json governance/football3/v3_pit_data_source_inventory_v1.json _seal/contract/
          cp governance/football3/v3_pit_data_provider_interface_v1.py governance/football3/validate_v3_pit_data_foundation_v1.py governance/football3/test_validate_v3_pit_data_foundation_v1.py _seal/code/
          cp .github/workflows/football3-v3-pit-data-foundation-audit-v1.yml _seal/workflow/
          cp /tmp/validator.txt /tmp/tests.txt /tmp/foundation.txt /tmp/formal-v2.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_seal')
          receipt={
            'schema_version':'football3-v3-pit-data-foundation-audit-receipt-v1',
            'status':'PUBLIC_FOUNDATION_READY_EXTERNAL_SOURCE_DECISION_REQUIRED',
            'candidate_head':os.environ['CANDIDATE_SHA'],
            'canonical_exact_base':os.environ['EXACT_BASE'],
            'formal_model_head':os.environ['FORMAL_HEAD'],
            'current_sha256':os.environ['CURRENT_SHA256'],
            'research_only':True,
            'public_workstreams_completed':[0,1,2,3],
            'openfootball_big5_lower_division_pins':5,
            'next_boundary':'CURRENT_PERSONNEL_AND_T15_LINEUP_SOURCE',
            'new_target_labels_read':False,
            'legacy_sealed_labels_read':False,
            'training_performed':False,
            'tuning_performed':False,
            'candidate_activation_changed':False,
            'formal_v2_changed':False,
            'current_changed':False,
            'formal_weights_changed':False,
            'production_changed':False,
            'secrets_written':False,
            'paid_subscription_action':False,
          }
          (r/'evidence'/'v3_pit_data_foundation_receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          files={}
          for p in sorted(r.rglob('*')):
            if p.is_file():
              b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          manifest={
            'schema_version':'football3-v3-pit-data-foundation-audit-artifact-v1',
            'status':receipt['status'],'candidate_head':receipt['candidate_head'],
            'canonical_exact_base':receipt['canonical_exact_base'],'formal_model_head':receipt['formal_model_head'],
            'current_sha256':receipt['current_sha256'],'changed_file_count':6,'files':files,
          }
          (r/'artifact_manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
          artifact_name="football3-v3-pit-data-foundation-${CANDIDATE_SHA}-${GITHUB_RUN_ID}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: '${{ steps.names.outputs.artifact_name }}'
          path: _seal
          if-no-files-found: error
          retention-days: 30
  remote-readback:
    needs: validate-and-seal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: '${{ needs.validate-and-seal.outputs.artifact_name }}'
          path: _readback
      - name: Verify sealed strict-PIT data foundation receipt
        env:
          CANDIDATE_SHA: '${{ needs.validate-and-seal.outputs.candidate_sha }}'
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_readback')
          m=json.loads((r/'artifact_manifest.json').read_text())
          x=json.loads((r/'evidence'/'v3_pit_data_foundation_receipt.json').read_text())
          assert m['status']=='PUBLIC_FOUNDATION_READY_EXTERNAL_SOURCE_DECISION_REQUIRED'
          assert m['candidate_head']==os.environ['CANDIDATE_SHA'] and m['canonical_exact_base']==os.environ['EXACT_BASE']
          assert x['public_workstreams_completed']==[0,1,2,3]
          assert x['openfootball_big5_lower_division_pins']==5
          assert x['next_boundary']=='CURRENT_PERSONNEL_AND_T15_LINEUP_SOURCE'
          assert not any(x[k] for k in ('new_target_labels_read','legacy_sealed_labels_read','training_performed','tuning_performed','candidate_activation_changed','formal_v2_changed','current_changed','formal_weights_changed','production_changed','secrets_written','paid_subscription_action'))
          actual={p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file() and p.name!='artifact_manifest.json'}
          assert actual==set(m['files'])
          for rel,meta in m['files'].items():
            b=(r/rel).read_bytes(); assert hashlib.sha256(b).hexdigest()==meta['sha256'] and len(b)==meta['bytes']
          print('V3_PIT_DATA_FOUNDATION_REMOTE_READBACK_PASS')
          PY
