name: Football Beat The Bookie R39D Preflight

on:
  push:
    branches: [research/beat-the-bookie-r39d-draw-boundary]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39d-preflight.yml'
      - 'football-data/research/beat_the_bookie_r39/preregistration_r39d.json'
      - 'football-data/research/beat_the_bookie_r39/evaluate_learned_draw_boundary_r39d.py'
  pull_request:
    branches: [research/beat-the-bookie-timeseries-r39b]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39d-preflight.yml'
      - 'football-data/research/beat_the_bookie_r39/preregistration_r39d.json'
      - 'football-data/research/beat_the_bookie_r39/evaluate_learned_draw_boundary_r39d.py'

permissions:
  contents: read

jobs:
  zero-label-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Validate frozen R39D contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/beat_the_bookie_r39/evaluate_learned_draw_boundary_r39d.py
          python -m json.tool football-data/research/beat_the_bookie_r39/preregistration_r39d.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/beat_the_bookie_r39/preregistration_r39d.json').read_text())
          assert p['identity_binding']['r39d_rows']==100
          assert p['identity_binding']['r39d_identity_set_sha256']=='df5871889f7dcf858d9adb7fa6d92c6e9ca4efa85074bddac3f5e82038ff6935'
          assert p['identity_binding']['r39c_r39d_overlap_rows']==0
          assert p['chronological_policy_design']['fit_fraction']==0.8
          assert p['candidate_target_coverages']==[0.05,0.1,0.15,0.2]
          assert p['label_order_contract']['all_holdout_period_labels_forbidden_before_model_and_policy_freeze'] is True
          assert p['label_order_contract']['r39c_fixed100_labels_must_not_be_read'] is True
          assert p['label_order_contract']['no_post_holdout_tuning'] is True
          assert p['hard_limits']['formal_weight']==0
          print('PASS_R39D_PREREG_CONTRACT')
          PY
          python football-data/research/beat_the_bookie_r39/evaluate_learned_draw_boundary_r39d.py --self-test
      - name: Verify zero external and label access in preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          print({'external_dataset_downloaded':False,'training_labels_read':0,'holdout_labels_read':0,'r39c_labels_read':0,'model_fit_on_real_data':0,'threshold_selected_on_real_data':0})
          PY
