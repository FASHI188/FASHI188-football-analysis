# PR-visible engineering trigger; scientific contract/evaluator unchanged.
# Child branch exists only to execute the workflow already present on its base.
name: Football C073-B Score Top1 Bridge

on:
  push:
    branches:
      - research/c073b-score-top1-bridge-20260819
    paths:
      - football-data/research/c073b_score_top1_bridge_contract.json
      - football-data/research/evaluate_c073b_score_top1_bridge.py
      - .github/workflows/football-c073b-score-top1-bridge.yml
  pull_request:
    paths:
      - football-data/research/c073b_score_top1_bridge_contract.json
      - football-data/research/evaluate_c073b_score_top1_bridge.py
      - .github/workflows/football-c073b-score-top1-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c073b-score-top1-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  score-top1-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install frozen scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 pyarrow==21.0.0 scikit-learn==1.7.1

      - name: Download and verify pinned C071 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c073b_source"
          REV="f0cbe86bee3f28cc4b803f735a5287968741c471"
          BASE="https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/$REV"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c073b_source/fixtures.parquet" "$BASE/fixtures.parquet?download=true"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c073b_source/match_stats.parquet" "$BASE/match_stats.parquet?download=true"
          echo "7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7  $RUNNER_TEMP/c073b_source/fixtures.parquet" | sha256sum -c -
          echo "2fb85b14b4428e1a36efe6d651de4ca8f7a6169ecfa3edb9cda49cb5e58d97e9  $RUNNER_TEMP/c073b_source/match_stats.parquet" | sha256sum -c -

      - name: Run frozen same-20k score Top1 bridge
        run: |
          mkdir -p "$RUNNER_TEMP/c073b_out"
          PYTHONPATH=football-data/research python football-data/research/evaluate_c073b_score_top1_bridge.py \
            --fixtures "$RUNNER_TEMP/c073b_source/fixtures.parquet" \
            --stats "$RUNNER_TEMP/c073b_source/match_stats.parquet" \
            --out-dir "$RUNNER_TEMP/c073b_out"

      - name: Enforce no-new-label and no-formal-claim boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c073b_out'/'summary.json').read_text())
          assert s['identity']['same_selected_20000']==20000
          assert s['identity']['selected_ids_sha256']=='aaff97c9eaca165410e99c3b4a3d49384234280d37304159ef79edea762d88e5'
          assert s['identity']['completed_nonnull']==19984
          assert s['identity']['null_results']==16
          assert s['identity']['reserve_52180_target_labels_opened'] is False
          assert s['identity']['new_target_label_ids_opened']==0
          assert s['boundaries']['T7plus_exact_tail_available'] is False
          assert s['boundaries']['unified_matrix_generated'] is False
          assert s['boundaries']['formal_exact_score_top1_claim_allowed'] is False
          assert s['boundaries']['manual_draw_or_1_1_boost'] is False
          assert s['boundaries']['sample_reselection'] is False
          assert s['boundaries']['formal_weight']==0
          assert s['boundaries']['C070F_confirmation1597_opened'] is False
          assert s['boundaries']['A05_opened'] is False
          assert s['boundaries']['protected_opened'] is False
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload C073-B bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: c073b-score-top1-bridge
          retention-days: 30
          path: |
            ${{ runner.temp }}/c073b_out/summary.json
            ${{ runner.temp }}/c073b_out/bridge_match_metrics.csv
            ${{ runner.temp }}/c073b_out/same_selected_20000_identity.csv
            football-data/research/c073b_score_top1_bridge_contract.json
