name: football3-c072n12-dynamic-ou25-trajectory-pt

on:
  pull_request:
    branches:
      - football3/c072n11-dynamic-multiline-ou-zero-label-source-20260819
    paths:
      - 'football-data/research/C072N12_DYNAMIC_OU25_TRAJECTORY_PT_DEVELOPMENT_CONTRACT.md'
      - 'football-data/research/evaluate_c072n12_dynamic_ou25_trajectory_pt.py'
      - '.github/workflows/football3-c072n12-dynamic-ou25-trajectory-pt.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen model dependencies
        run: pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scikit-learn==1.7.1

      - name: Preregistration and boundary guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072N12_DYNAMIC_OU25_TRAJECTORY_PT_DEVELOPMENT_CONTRACT.md').read_text()
          assert 'REPLICATION / REPRODUCTION' in c
          assert 'Primary scientific comparison: `C - B1`.' in c
          assert 'path_total_variation' in c and 'path_max_abs_step' in c
          assert 'No post-view repair on these labels' in c
          assert 'C070-F Confirmation1597 remains sealed' in c
          print('N12 preregistration guard: PASS')
          PY

      - name: Download immutable N11R1 zero-label manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/n11r1
          gh run download 32256083111 \
            --repo FASHI188/FASHI188-football-analysis \
            --name football3-c072n11r1-fabul0us-ou25-kickoff-join \
            --dir /tmp/n11r1
          echo '96eb5dd412883d903cdf2ff0ebbffb8244f1a6f552fbeea1d4a1153f3a7b7faf  /tmp/n11r1/c072n11r1_fabul0us_ou25_kickoff_manifest.csv' | sha256sum -c -

      - name: Download immutable dynamic O/U source
        run: |
          mkdir -p /tmp/c072n12
          curl --location --fail --silent --show-error \
            'https://huggingface.co/datasets/fabul0us/football_odds_2023-24/resolve/211feb35f9dcd270bd7a1b27b39a8b1f45f239aa/match_odds.csv?download=true' \
            --output /tmp/c072n12/match_odds.csv
          echo 'c0e8854302159e1a8c529463f33280b728909c5e0ba95262515a7a144a43aa2a  /tmp/c072n12/match_odds.csv' | sha256sum -c -

      - name: Execute one-shot frozen N12 development
        run: |
          python football-data/research/evaluate_c072n12_dynamic_ou25_trajectory_pt.py \
            --dynamic-csv /tmp/c072n12/match_odds.csv \
            --manifest /tmp/n11r1/c072n11r1_fabul0us_ou25_kickoff_manifest.csv

      - name: Boundary and terminal guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('football-data/research/c072n12_dynamic_ou25_trajectory_pt_summary.json').read_text())
          assert s['classification'] == 'REPLICATION / REPRODUCTION'
          assert s['C073_C077_quarantined'] is True
          assert s['C070F_confirmation1597_opened'] is False
          assert s['formal_weight'] == 0
          assert s['terminal'] in {
            'C072N12_DATA_INSUFFICIENT_ALL_CLASSES',
            'C072N12_DYNAMIC_OU25_TRAJECTORY_BREAKTHROUGH_SCREEN_PASS',
            'C072N12_DYNAMIC_OU25_TRAJECTORY_DEVELOPMENT_PASS',
            'C072N12_ENDPOINT_MOVEMENT_PASS_PATH_SHAPE_NOT_ESTABLISHED',
            'C072N12_DYNAMIC_OU25_TRAJECTORY_PARK',
          }
          print('N12 boundaries: PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football3-c072n12-dynamic-ou25-trajectory-pt
          path: |
            football-data/research/c072n12_dynamic_ou25_trajectory_pt_summary.json
            football-data/research/c072n12_dynamic_ou25_trajectory_pt_predictions.csv
          if-no-files-found: warn
