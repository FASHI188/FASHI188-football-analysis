name: Football Engineering Quality and Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-engineering-quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-file-guard:
    name: Changed-file quality and security guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve comparison range
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            echo "BASE_SHA=${BASE_SHA}" >> "${GITHUB_ENV}"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          echo "base=${BASE_SHA}"
          echo "head=${HEAD_SHA}"

      - name: Reject whitespace errors in changed lines
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      - name: Run guard unit tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/governance/test_quality_security_guard.py

      - name: Scan changed files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/governance/quality_security_guard.py \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"
