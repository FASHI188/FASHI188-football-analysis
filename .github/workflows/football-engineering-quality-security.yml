name: Football Engineering Quality and Security
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  linux-hardening:
    name: linux-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 pytest==8.4.1
      - name: Resolve comparison range
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Changed-file quality and security scan
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          python scripts/governance/test_quality_security_guard.py
          python scripts/governance/quality_security_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Football3 production tests on Linux
        env:
          PYTHONPATH: football-data/research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _football3_linux
          pytest -q football-data/research/test_football3_core.py football-data/research/test_football3_label_access.py football-data/research/test_validate_football3_experiment.py | tee _football3_linux/linux-production-counterexamples.txt
          python football-data/research/validate_football3_experiment.py --contract football-data/research/FOOTBALL3_REMEDIATION_SAFETY_CONTRACT_V3.json | tee -a _football3_linux/linux-production-counterexamples.txt
      - name: Governance production negatives
        shell: bash
        run: |
          set -euo pipefail
          python governance/validate_project_continuity.py --self-test | tee -a _football3_linux/linux-production-counterexamples.txt
          python governance/test_required_context_coverage.py | tee -a _football3_linux/linux-production-counterexamples.txt
      - uses: actions/upload-artifact@v4
        with:
          name: football3-linux-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: _football3_linux/
          if-no-files-found: error
          retention-days: 30
  windows-hardening:
    name: windows-utf8-path-hardening
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 pytest==8.4.1
      - name: Football3 production tests on Windows UTF-8 paths
        shell: pwsh
        env:
          PYTHONPATH: football-data/research
        run: |
          New-Item -ItemType Directory -Force -Path _football3_windows | Out-Null
          pytest -q football-data/research/test_football3_core.py football-data/research/test_football3_label_access.py football-data/research/test_validate_football3_experiment.py 2>&1 | Tee-Object -FilePath _football3_windows/windows-production-counterexamples.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python football-data/research/validate_football3_experiment.py --contract football-data/research/FOOTBALL3_REMEDIATION_SAFETY_CONTRACT_V3.json 2>&1 | Tee-Object -FilePath _football3_windows/windows-production-counterexamples.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python governance/validate_project_continuity.py --self-test 2>&1 | Tee-Object -FilePath _football3_windows/windows-production-counterexamples.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: football3-windows-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: _football3_windows/
          if-no-files-found: error
          retention-days: 30
  changed-file-guard:
    name: Changed-file quality and security guard
    if: always()
    needs: [linux-hardening, windows-hardening]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - name: Assert both OS production test jobs succeeded
        shell: bash
        run: |
          test "${{ needs.linux-hardening.result }}" = "success"
          test "${{ needs.windows-hardening.result }}" = "success"
      - uses: actions/download-artifact@v5
        with:
          name: football3-linux-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: _cross_platform/linux
      - uses: actions/download-artifact@v5
        with:
          name: football3-windows-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: _cross_platform/windows
      - name: Build cross-platform exact-head evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          python governance/repository_governance_audit.py --root . --repo "$GITHUB_REPOSITORY" --base-sha "$BASE_SHA" --out _governance_audit
          mkdir -p _football3_remediation_evidence/governance
          cp -R _governance_audit/. _football3_remediation_evidence/governance/
          python governance/build_football3_remediation_evidence.py --root . --base-sha "$BASE_SHA" --out _football3_remediation_evidence --test-summary _cross_platform/linux/linux-production-counterexamples.txt --test-summary _cross_platform/windows/windows-production-counterexamples.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: football3-remediation-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: _football3_remediation_evidence/
          if-no-files-found: error
          retention-days: 30
