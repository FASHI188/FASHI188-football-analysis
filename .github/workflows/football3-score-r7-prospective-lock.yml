name: football3 score R7 prospective lock

on:
  push:
    branches:
      - football3/score-r7-prospective-lock-20260827
    paths:
      - football-data/experiments/score_r7_prospective_lock/run_score_r7.py
      - .github/workflows/football3-score-r7-prospective-lock.yml

permissions:
  contents: write
  actions: read

jobs:
  score-r7-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/score-r7-prospective-lock-20260827
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Generate prospective prediction lock
        run: python football-data/experiments/score_r7_prospective_lock/run_score_r7.py run
      - name: Verify prospective lock contract
        run: python football-data/experiments/score_r7_prospective_lock/run_score_r7.py verify
      - name: Persist immutable prediction snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/score_r7_prospective_lock/results/prospective_predictions_score_r7.json football-data/experiments/score_r7_prospective_lock/data/mapping_audit_score_r7.json
          git commit -m '[locked] football3 score R7 prospective predictions'
          git push origin HEAD:football3/score-r7-prospective-lock-20260827
      - name: Upload immutable prospective artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-score-r7-prospective-lock
          path: |
            football-data/experiments/score_r7_prospective_lock/results/prospective_predictions_score_r7.json
            football-data/experiments/score_r7_prospective_lock/data/mapping_audit_score_r7.json
          if-no-files-found: error
          retention-days: 90
