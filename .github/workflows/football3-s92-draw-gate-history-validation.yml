name: football3 S92 draw-gate history validation

on:
  push:
    branches:
      - football3/s92-draw-gate-history-validation
    paths:
      - football-data/experiments/s92_draw_gate_history_validation/run_s92_history_gate.py
      - .github/workflows/football3-s92-draw-gate-history-validation.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/s92-draw-gate-history-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Run S92 pre-2025 historical draw-gate validation
        run: python football-data/experiments/s92_draw_gate_history_validation/run_s92_history_gate.py run
      - name: Verify S92 history validation contract
        run: python football-data/experiments/s92_draw_gate_history_validation/run_s92_history_gate.py verify
      - name: Upload S92 history validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-s92-draw-gate-history-validation
          path: football-data/experiments/s92_draw_gate_history_validation/results/summary_s92_history_gate.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist S92 history validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/s92_draw_gate_history_validation/results/summary_s92_history_gate.json
          git commit -m '[validated] football3 S92 pre-2025 draw gate' || true
          git fetch origin football3/s92-draw-gate-history-validation
          git rebase origin/football3/s92-draw-gate-history-validation
          git push origin HEAD:football3/s92-draw-gate-history-validation
