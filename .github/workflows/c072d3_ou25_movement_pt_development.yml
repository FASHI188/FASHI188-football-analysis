name: C072-D3 O/U2.5 movement P(T) development reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scikit-learn==1.7.1
      - name: Reproduce frozen rolling-OOS development
        run: python football-data/research/evaluate_c072d3_ou25_movement_pt.py
      - name: Upload reproduced summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c072d3-ou25-movement-pt-summary
          path: football-data/research/c072d3_ou25_movement_pt_summary.json
          if-no-files-found: error
