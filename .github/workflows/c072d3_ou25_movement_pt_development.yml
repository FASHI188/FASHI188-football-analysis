name: C072-D3 O/U2.5 movement P(T) development

on:
  push:
    branches:
      - football3/c072d3-ou25-movement-pt-development-20260819
    paths:
      - 'football-data/research/c072d3_ou25_movement_pt_contract.json'
      - 'football-data/research/evaluate_c072d3_ou25_movement_pt.py'
      - '.github/workflows/c072d3_ou25_movement_pt_development.yml'
      - 'football-data/research/C072D3_EXECUTION_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  develop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scikit-learn==1.7.1
      - name: Run frozen rolling-OOS development
        shell: bash
        run: |
          set +e
          python football-data/research/evaluate_c072d3_ou25_movement_pt.py
          code=$?
          echo "SCIENTIFIC_EXIT=${code}" >> "$GITHUB_ENV"
          exit 0
      - name: Commit immutable scientific summary to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/research/c072d3_ou25_movement_pt_summary.json
          if git diff --cached --quiet; then
            echo 'No summary diff to commit.'
          else
            git commit -m 'evidence: C072-D3 movement P(T) development [skip ci]'
            git push origin HEAD:football3/c072d3-ou25-movement-pt-development-20260819
          fi
      - name: Enforce frozen scientific gate
        shell: bash
        run: |
          if [[ "${SCIENTIFIC_EXIT}" != "0" ]]; then
            echo "Frozen development gate did not pass (exit ${SCIENTIFIC_EXIT}); summary was still committed."
            exit "${SCIENTIFIC_EXIT}"
          fi
