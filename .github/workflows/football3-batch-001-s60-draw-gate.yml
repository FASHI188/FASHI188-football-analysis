name: football3 Batch-001 S60 draw gate

on:
  push:
    branches:
      - football3/batch-001-s60-draw-gate-20260826
    paths:
      - .github/workflows/football3-batch-001-s60-draw-gate.yml
      - football-data/batches/batch-001/run_s60_draw_gate_candidate.py

permissions:
  contents: write

jobs:
  lock-draw-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: football3/batch-001-s60-draw-gate-20260826

      - name: Fetch immutable Batch-001 identity lock
        run: |
          git fetch --depth=1 origin football3/batch-001-pseudo-prospective-lock-20260826:refs/remotes/origin/batch001-lock
          mkdir -p /tmp/football3-batch001
          git show refs/remotes/origin/batch001-lock:football-data/batches/batch-001/lock/batch001_zero_label_lock.csv > /tmp/football3-batch001/batch001_zero_label_lock.csv
          echo '028f6b1e3443bbd144a04941e2764365b861fcf2af6cca81402c1cc29ffa84a6  /tmp/football3-batch001/batch001_zero_label_lock.csv' | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked candidate runtime
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2 pyarrow==18.1.0

      - name: Fail if draw candidate lock already exists
        run: |
          test ! -e football-data/batches/batch-001/s60_draw_gate/batch001_s60_draw_candidate_predictions.json
          test ! -e football-data/batches/batch-001/s60_draw_gate/receipt.json

      - name: Build zero-label S60 draw-gate candidate
        env:
          BATCH001_LOCK: /tmp/football3-batch001/batch001_zero_label_lock.csv
          BATCH001_DRAW_OUT: football-data/batches/batch-001/s60_draw_gate
        run: python football-data/batches/batch-001/run_s60_draw_gate_candidate.py

      - name: Verify draw candidate lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/batches/batch-001/s60_draw_gate')
          r=json.loads((p/'receipt.json').read_text())
          d=json.loads((p/'batch001_s60_draw_candidate_predictions.json').read_text())
          assert r['status']=='DRAW_CANDIDATE_LOCKED_NO_TARGET_LABELS'
          assert r['rows']==100 and abs(r['mapping_coverage']-1.0)<1e-15
          assert sum(r['S60_top1_picks'].values())==100
          assert sum(r['J2_S60_top1_picks'].values())==100
          assert sum(r['G2_S60_top1_picks'].values())==100
          g=d['governance']
          assert not g['target_result_fields_loaded'] and not g['target_xg_loaded']
          assert not g['target_market_prices_loaded'] and not g['target_rows_used_to_update_state']
          assert not g['target_labels_used_for_threshold_selection'] and not g['manual_probability_adjustment']
          assert d['candidate_contract']['threshold']==0.08
          print('BATCH001_DRAW_CANDIDATE_LOCK_OK')
          print(json.dumps(r,sort_keys=True))
          PY

      - name: Persist immutable draw candidate snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/batches/batch-001/s60_draw_gate/batch001_s60_draw_candidate_predictions.json
          git add football-data/batches/batch-001/s60_draw_gate/receipt.json
          git commit -m 'data(football3): lock Batch-001 S60 draw-gate challenger'
          git push origin HEAD:football3/batch-001-s60-draw-gate-20260826

      - name: Upload draw candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch-001-s60-draw-gate
          path: football-data/batches/batch-001/s60_draw_gate/
          if-no-files-found: error
          retention-days: 90
