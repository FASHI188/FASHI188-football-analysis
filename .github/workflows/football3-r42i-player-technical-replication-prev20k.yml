name: football3 R42I player technical replication prev20k

on:
  push:
    branches:
      - football3/r42i-player-technical-replication-prev20k
    paths:
      - football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py
      - .github/workflows/football3-r42i-player-technical-replication-prev20k.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r42i-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r42i-player-technical-replication-prev20k
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Verify frozen R42I runner
        shell: bash
        run: |
          echo '17155fe709877801299b1b8f2d965cb11da4cb81c5d2fc5733cf7536bbe2faad  football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py' | sha256sum -c -
      - name: Run R42I previous-20k replication
        run: python football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py run
      - name: Verify R42I contract
        run: python football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py verify
      - name: Persist R42I evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r42i_player_technical_replication_prev20k/results/summary_r42i_player_technical_replication_prev20k.json
          git add football-data/experiments/r42i_player_technical_replication_prev20k/results/oos_records_r42i.jsonl
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R42I previous-20k technical replication'
            git fetch origin football3/r42i-player-technical-replication-prev20k
            git rebase origin/football3/r42i-player-technical-replication-prev20k
            git push origin HEAD:football3/r42i-player-technical-replication-prev20k
          fi
      - name: Upload R42I artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r42i-player-technical-replication-prev20k
          path: |
            football-data/experiments/r42i_player_technical_replication_prev20k/results/summary_r42i_player_technical_replication_prev20k.json
            football-data/experiments/r42i_player_technical_replication_prev20k/results/oos_records_r42i.jsonl
          if-no-files-found: error
          retention-days: 90
