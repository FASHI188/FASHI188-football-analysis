name: Football3 Current V2 Retrospective State Audit Order Regression

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, reopened, synchronize]
    paths:
      - 'football-data/formal_gpt_gateway_v1/current_v2_retrospective_receipt_contract_v1.py'
      - 'football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_state_integrity_artifact_v1.py'
      - '.github/workflows/football3-current-v2-retrospective-state-audit-order-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-audit-order-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p state_audit_order_evidence
          printf '%s\n' "$CANDIDATE_SHA" > state_audit_order_evidence/candidate_exact_head.txt
      - name: Install frozen test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 pytest==8.4.1
      - name: Compile and run permanent state audit ordering regression
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1
        run: |
          set -euo pipefail
          python -m py_compile \
            football-data/formal_gpt_gateway_v1/current_v2_retrospective_receipt_contract_v1.py \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_state_integrity_artifact_v1.py
          python -m pytest -q \
            football-data/formal_gpt_gateway_v1/test_current_v2_retrospective_state_integrity_artifact_v1.py \
            | tee state_audit_order_evidence/pytest.txt
      - name: Record regression receipt
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          out=pathlib.Path('state_audit_order_evidence')
          out.mkdir(parents=True,exist_ok=True)
          payload={
              'schema_version':'football3-current-v2-retrospective-state-audit-order-regression-v1',
              'candidate_exact_head':os.environ['CANDIDATE_SHA'],
              'writer_phase':'AFTER_GATEWAY_SUMMARY_PERSISTED',
              'prediction_or_matrix_changed':False,
              'route_or_fallback_changed':False,
              'current_or_model_or_weight_changed':False,
          }
          (out/'regression_receipt.json').write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Upload exact-head regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: football3-current-v2-retrospective-state-audit-order-${{ github.run_id }}
          path: state_audit_order_evidence/
          if-no-files-found: error
          retention-days: 90
