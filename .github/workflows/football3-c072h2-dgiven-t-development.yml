name: football3-c072h2-dgiven-t-development

on:
  pull_request:
    branches:
      - football3/c072g2-fresh2526-dgiven-t-source-20260819
    paths:
      - 'football-data/research/C072H2_DGIVENT_DEVELOPMENT_CONTRACT.md'
      - 'football-data/research/evaluate_c072h2_dgiven_t_development.py'
      - 'football-data/research/run_c072h2_dgiven_t_development.py'
      - '.github/workflows/football3-c072h2-dgiven-t-development.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==2.1.3 scikit-learn==1.7.1
      - name: Frozen contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072H2_DGIVENT_DEVELOPMENT_CONTRACT.md').read_text()
          assert 'If A qualifies AND B movement increment qualifies: confirmation candidate = Model B.' in c
          assert 'Else if A qualifies: confirmation candidate = Model A.' in c
          assert 'C073-C077 remain quarantined' in c
          assert 'C072-G2 2025/26 target results sealed.' in c
          print('H2 contract/selection guard: PASS')
          PY
      - name: Run frozen H2 development
        run: python football-data/research/run_c072h2_dgiven_t_development.py
      - name: Fresh-pool boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072h2_summary.json').read_text())
          b=x['boundary']
          assert b['C072G2_2526_targets_opened'] is False
          assert b['C073_C077_quarantined'] is True
          assert b['C070F_confirmation1597_opened'] is False
          assert b['formal_weight'] == 0
          print('fresh target seal: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072h2-dgiven-t-development
          path: football-data/research/c072h2_summary.json
