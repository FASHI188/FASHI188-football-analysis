name: football3 Top1 nonlinear full coverage R6

on:
  push:
    branches:
      - football3/top1-20k-opponent-veto-r1
    paths:
      - football-data/experiments/top1_r6_nonlinear/run_experiment_r6.py
      - .github/workflows/football3-top1-r6-nonlinear-fullcoverage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r6-nonlinear-full-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-20k-opponent-veto-r1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Freeze external pure-results 20000
        run: python football-data/experiments/top1_r6_nonlinear/run_experiment_r6.py freeze
      - name: Run 100 percent coverage nonlinear comparison
        run: python football-data/experiments/top1_r6_nonlinear/run_experiment_r6.py run
      - name: Verify no-market untouched-test contract
        run: python football-data/experiments/top1_r6_nonlinear/run_experiment_r6.py verify
      - name: Persist R6 data and result to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r6_nonlinear/data football-data/experiments/top1_r6_nonlinear/results
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r6] freeze external 20k and nonlinear full-coverage result'
            git push origin HEAD:football3/top1-20k-opponent-veto-r1
          fi
      - name: Upload immutable R6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r6-nonlinear-fullcoverage
          path: |
            football-data/experiments/top1_r6_nonlinear/data/source_manifest_r6.json
            football-data/experiments/top1_r6_nonlinear/results/summary_r6.json
          if-no-files-found: error
          retention-days: 30
