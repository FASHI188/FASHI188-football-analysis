name: football-v6-three-stage-core-v6261

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'football-data/config/v6260_three_stage_core_registry.json'
      - 'football-data/engine/three_stage_core_v6260.py'
      - 'football-data/validation/validate_three_stage_core_v6261.py'
      - '.github/workflows/football-v6-three-stage-core-v6261.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile new core and validator
        run: |
          python -m py_compile \
            football-data/engine/three_stage_core_v6260.py \
            football-data/validation/validate_three_stage_core_v6261.py

      - name: Run three-stage strict-PIT structural validation
        run: |
          python football-data/validation/validate_three_stage_core_v6261.py

      - name: Persist immutable research receipt
        if: always()
        run: |
          if [ ! -f football-data/manifests/v6_three_stage_core_v6261_status.json ]; then
            echo 'validation receipt missing' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/manifests/v6_three_stage_core_v6261_status.json
          if git diff --cached --quiet; then
            echo 'receipt unchanged'
            exit 0
          fi
          git commit -m 'audit(football): persist V6.26 three-stage core validation'
          git push
