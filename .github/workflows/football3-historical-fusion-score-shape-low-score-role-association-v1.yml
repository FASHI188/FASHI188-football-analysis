name: football3 Historical Fusion Score-Shape Low-Score Role Association
on:
  push:
    branches:
      - football3/historical-fusion-score-shape-low-score-role-association-v1
permissions:
  contents: read
  actions: read
jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_HEAD: cb8f98ab8364c3e388f8cffc7a5659b2846b2657
      V326_HEAD: 2d02de0de4da73412d90b019886f710beaf3ee85
      SEG4_HEAD: 3cc9098cd321ee4f1dd659b1a4f4db75c02555ed
      V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
      FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
      CONTRACT_FREEZE_COMMIT: 44521fd6eb8e22ba87d03d1263af6bbd120bb3b2
      CONTRACT_BLOB: 5243d97e7c0e58a21d59ffd61d176a8f2f53643c
      RUNNER_BLOB: 7ec59e396820ad81196096b7bf9aea96b9649b41
      TEST_BLOB: 95e717a36a735bffa12262eb66a459a31a9186ea
      V324_ARTIFACT_ID: '9888387173'
      V324_ARTIFACT_DIGEST: sha256:c14813b04a3f21f5cf8de0cf99d682b0e539f2011adb9212532af175509e6ad1
      V2_ARTIFACT_ID: '9828471485'
      V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
      XG_ARTIFACT_ID: '9826787329'
      XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
      V1_ARTIFACT_ID: '9732754224'
      V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
      OLD_ARTIFACT_ID: '9798682425'
      OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
      USR1_ARTIFACT_ID: '9848912219'
      USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
      V31_ARTIFACT_ID: '9855441319'
      V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact lineage contract freeze whitelist and formal guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-score-shape-low-score-role-association-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          test "$(git rev-parse "${CONTRACT_FREEZE_COMMIT}^")" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-score-shape-dynamic-share-concentration-v1 | cut -f1)" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-6-temporal-horizon-consensus-v1 | cut -f1)" = "$V326_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1 | cut -f1)" = "$SEG4_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_score_shape_low_score_role_association
          test "$(git hash-object "$D/V3_SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/v3_score_shape_low_score_role_association.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_v3_score_shape_low_score_role_association.py")" = "$TEST_BLOB"
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_score_shape_low_score_role_association')
          contract=str(d/'V3_SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_CONTRACT.json')
          freeze=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...{os.environ['CONTRACT_FREEZE_COMMIT']}"],text=True).splitlines())
          assert freeze=={contract},freeze
          allowed={'.github/workflows/football3-historical-fusion-score-shape-low-score-role-association-v1.yml',contract,str(d/'v3_score_shape_low_score_role_association.py'),str(d/'test_v3_score_shape_low_score_role_association.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          c=json.loads((d/'V3_SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_CONTRACT.json').read_text())
          assert c['status']=='FROZEN_BEFORE_TARGET_SCORING' and c['new_information_axis'] is True and c['local_joint_dependence_axis'] is True
          assert c['scientific_hypothesis']['id']=='STRICT_PREMATCH_TEAM_ROLE_LOW_SCORE_LOG_ODDS_ASSOCIATION'
          assert c['association_state']['pseudocount_per_cell']==0.5
          assert c['association_state']['threshold_grid']=='NONE'
          assert c['data_roles']['2023']=='CLOSED_FOR_THIS_COMPONENT'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run seven structural tests
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_score_shape_low_score_role_association
          python -m py_compile "$D/v3_score_shape_low_score_role_association.py" "$D/test_v3_score_shape_low_score_role_association.py"
          (cd "$D" && python test_v3_score_shape_low_score_role_association.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Download and verify frozen predecessor and scientific inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v324,v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            got="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq .digest)"
            test "${got#sha256:}" = "${expected#sha256:}"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python - "$zip" "$expected" <<'PY'
          import hashlib,sys
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==sys.argv[2].split(':',1)[-1].lower()
          PY
            unzip -tq "$zip"; unzip -q "$zip" -d "$dest"
          }
          verify_one "$V324_ARTIFACT_ID" "$V324_ARTIFACT_DIGEST" /tmp/v324.zip _inputs/v324
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          python - <<'PY'
          import hashlib,json,pathlib,os
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          m=json.load(open('_inputs/v324/artifact_manifest.json'));f=json.load(open('_inputs/v324/evidence/final_status.json'))
          assert m['head']==os.environ['SEG4_HEAD'];assert f['2023_opened'] is False and f['3504_opened'] is False
          PY
      - name: Run frozen Stage6 low-score role association once
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_score_shape_low_score_role_association
          D4=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          D3=football-data/research/historical_fusion_v3_2_3_temporal_transport
          rm -rf _run && mkdir _run
          python "$D/v3_score_shape_low_score_role_association.py" \
            --contract "$D/V3_SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_CONTRACT.json" \
            --v324-contract "$D4/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json" --v324 "$D4/v3_2_4_segment4.py" \
            --v323-contract "$D3/V3_2_3_TEMPORAL_TRANSPORT_CONTRACT.json" --v323 "$D3/v3_2_3_segment3.py" \
            --v322 football-data/research/historical_fusion_v3_2_2_parity_boundary/v3_2_2_segment2.py \
            --v32dev football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair_execution/v3_2_development.py \
            --core football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair/v3_2_core.py \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json --out _run 2>&1 | tee /tmp/research_stdout.txt
          python - <<'PY'
          import json
          f=json.load(open('_run/final_status.json'))
          assert f['status'] in {'SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_READY_FOR_MACRO_INTEGRATION','SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT'}
          assert f['research_only'] and f['post_view'] and not f['fresh_confirmation'] and not f['promotion_allowed']
          assert not f['2023_opened'] and not f['3504_opened'] and not f['macro_stage_7_started']
          assert f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed'] and not f['production_pointer_changed'] and not f['formal_enablement_changed'] and not f['formal_weights_changed']
          PY
      - name: Seal evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_score_shape_low_score_role_association
          mkdir -p _artifact/evidence _artifact/code
          cp _run/*.json _artifact/evidence/
          cp "$D/V3_SCORE_SHAPE_LOW_SCORE_ROLE_ASSOCIATION_CONTRACT.json" "$D/v3_score_shape_low_score_role_association.py" "$D/test_v3_score_shape_low_score_role_association.py" _artifact/code/
          cp /tmp/tests.txt /tmp/research_stdout.txt _artifact/evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_artifact');files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes();files[str(p.relative_to(root))]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          final=json.load(open('_run/final_status.json'))
          m={'schema_version':'football3-score-shape-low-score-role-association-artifact-v1','head':os.environ['GITHUB_SHA'],'base_head':os.environ['BASE_HEAD'],'contract_freeze_commit':os.environ['CONTRACT_FREEZE_COMMIT'],'contract_blob':os.environ['CONTRACT_BLOB'],'runner_blob':os.environ['RUNNER_BLOB'],'test_blob':os.environ['TEST_BLOB'],'final_status':final['status'],'2023_opened':False,'3504_opened':False,'files':files}
          pathlib.Path('_artifact/artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload immutable Stage6 low-score association evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-score-shape-low-score-role-association-${{ github.sha }}-${{ github.run_id }}
          path: _artifact
          if-no-files-found: error
          retention-days: 90
  remote-readback:
    runs-on: ubuntu-24.04
    needs: research-and-seal
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football3-score-shape-low-score-role-association-${{ github.sha }}-${{ github.run_id }}
          path: artifact
      - name: Verify manifest and terminal evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('artifact');m=json.load(open(root/'artifact_manifest.json'))
          assert m['head']==os.environ['GITHUB_SHA'];assert m['2023_opened'] is False and m['3504_opened'] is False
          for rel,z in m['files'].items():
              p=root/rel;assert p.is_file(),rel;assert hashlib.sha256(p.read_bytes()).hexdigest()==z['sha256'];assert p.stat().st_size==z['bytes']
          f=json.load(open(root/'evidence/final_status.json'));assert f['status']==m['final_status'];assert f['macro_stage_7_started'] is False
          PY
