name: Football3 V3 Player DVC PIT Audit V1

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    paths:
      - '.github/workflows/football3-v3-player-dvc-pit-audit-v1.yml'
      - 'governance/football3/v3_player_dvc_pit_audit_contract_v1.json'
      - 'governance/football3/validate_v3_player_dvc_pit_audit_v1.py'
      - 'governance/football3/test_v3_player_dvc_pit_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-label-dvc-metadata-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact HEAD binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '{"head":"%s","event":"%s"}\n' "$(git rev-parse HEAD)" "${GITHUB_EVENT_NAME}" > head-binding.json
      - name: Compile and permanent tests
        run: |
          set -euo pipefail
          python -m py_compile governance/football3/validate_v3_player_dvc_pit_audit_v1.py governance/football3/test_v3_player_dvc_pit_audit_v1.py
          python governance/football3/test_v3_player_dvc_pit_audit_v1.py
      - name: Fetch DVC directory descriptors only
        run: |
          set -euo pipefail
          mkdir -p artifact
          python governance/football3/validate_v3_player_dvc_pit_audit_v1.py --output artifact/player-dvc-pit-audit-receipt.json
          cp governance/football3/v3_player_dvc_pit_audit_contract_v1.json artifact/
          cp head-binding.json artifact/
      - name: Prove zero-label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('artifact/player-dvc-pit-audit-receipt.json'))
          assert p['labels_opened'] == 0
          assert p['training'] is False
          assert p['tuning'] is False
          assert p['downloaded_data_objects'] == 0
          assert p['data_ready'] is False
          assert p['decision'] in {
            'STOP_DATA_COVERAGE_DVC_OBJECT_UNAVAILABLE',
            'STOP_DATA_COVERAGE_PLAYER_ASSET_SURFACE',
            'PASS_DVC_HISTORY_TRANSPORT_NEXT_SCHEMA_AUDIT'
          }
          print(p['decision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-v3-player-dvc-pit-audit-v1-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 90
