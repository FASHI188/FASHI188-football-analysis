name: Football3 Effective Evidence Guard Selector Exact Head Acceptance V1

on:
  push:
    branches:
      - football3/effective-evidence-guard-selector-governed-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-effective-evidence-guard-selector-exact-head-acceptance-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  EXACT_BASE: '0bfcd824d855161595226f3a67b33c4cfa9ab8a3'
  SOURCE_RUN_ID: '33979095886'
  SOURCE_ARTIFACT_ID: '9973225479'
  HAMBURG_KICKOFF: '2026-09-06T13:30:00+00:00'
  HAMBURG_CUTOFF: '2026-09-04T13:19:44+00:00'

jobs:
  exact-head-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove exact ancestry and protected scientific surfaces unchanged
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_BASE" HEAD
          git diff --name-only "$EXACT_BASE"...HEAD | tee acceptance_changed_files.txt
          if grep -E '(^|/)(formal_fusion_v2\.py|pure_engine\.py|historical_xg_challenger\.py|CURRENT|formal_pointer\.json|model_lock\.json)$' acceptance_changed_files.txt; then
            echo 'protected model/CURRENT surface changed' >&2
            exit 1
          fi
          printf 'draft_only=true\nready=false\nmerge=false\nproduction_activation=false\nairtable_write=false\n' > acceptance_authority.txt
          git rev-parse HEAD | tee acceptance_exact_head.txt

      - name: Compile changed governance modules
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 -m py_compile \
            football-data/formal_gpt_gateway_v1/durable_state_selector_v1.py \
            football-data/formal_gpt_gateway_v1/formal_effective_evidence_guard_governed_v1.py \
            football-data/formal_gpt_gateway_v1/formal_state_integrity_coverage_patch_v1.py \
            football-data/formal_gpt_gateway_v1/formal_durable_state_governance_v1.py \
            football-data/formal_gpt_gateway_v1/entry.py

      - name: Restore only bound acceptance sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .accept/understat .accept/confirmation .accept/hamburg/state/bundle .accept/meta
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            -o .accept/meta/source_run.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" \
            -o .accept/meta/source_artifact.json
          fetch_artifact () {
            local id="$1" out="$2"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$out"
          }
          fetch_artifact 9798682425 .accept/understat.zip
          fetch_artifact 9827606506 .accept/confirmation.zip
          fetch_artifact "$SOURCE_ARTIFACT_ID" .accept/hamburg_source.zip
          unzip -q .accept/understat.zip -d .accept/understat
          unzip -q .accept/confirmation.zip -d .accept/confirmation
          unzip -q .accept/hamburg_source.zip -d .accept/hamburg/state/bundle
          sha256sum .accept/understat.zip .accept/confirmation.zip .accept/hamburg_source.zip | tee .accept/source_zip_sha256.txt
          find .accept/hamburg/state/bundle -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | tee .accept/hamburg_bundle_file_sha256.txt
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          run=json.load(open('.accept/meta/source_run.json'))
          art=json.load(open('.accept/meta/source_artifact.json'))
          kickoff=datetime.fromisoformat(os.environ['HAMBURG_KICKOFF'])
          created=datetime.fromisoformat(str(art['created_at']).replace('Z','+00:00'))
          assert run['id']==int(os.environ['SOURCE_RUN_ID'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert art['id']==int(os.environ['SOURCE_ARTIFACT_ID']) and art['expired'] is False
          assert created < kickoff, (created,kickoff)
          print('BOUND_SOURCE_METADATA_PASS', art['name'], art.get('digest'), art['created_at'])
          PY

      - name: Run selector guard sealed recovery and authoritative-error directed tests
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 - <<'PY' | tee .accept/targeted_tests_stdout.txt
          import copy, json, os, pathlib, shutil, tempfile
          import runtime as rt
          import durable_state_contract_v1 as contract
          import durable_state_selector_v1 as selector
          import formal_effective_evidence_guard_governed_v1 as eff

          root=pathlib.Path('.accept')
          bundle=root/'hamburg/state/bundle'
          meta=json.load(open(root/'meta/source_artifact.json'))
          run=json.load(open(root/'meta/source_run.json'))
          loaded=rt.validate_bundle(bundle)
          target=rt._parse_dt(os.environ['HAMBURG_CUTOFF'],'target cutoff')
          kickoff=rt._parse_dt(os.environ['HAMBURG_KICKOFF'],'kickoff')
          assert loaded['meta']['historical_cutoff']==target.isoformat()

          pre=selector._candidate_from_bundle(meta,run,bundle,target,'GER_Bundesliga',kickoff)
          assert pre['verified'] and pre['pit_ok'] and pre['artifact_available_before_kickoff']
          assert rt._parse_dt(pre['artifact_created_at'],'created') < kickoff
          # This bound retrospective artifact is allowed to have been packaged after
          # the sealed historical cutoff, provided its state/source PIT stays at cutoff
          # and the package itself existed before kickoff.
          assert pre['artifact_available_by_target_cutoff'] is False

          post_meta=dict(meta)
          post_meta['id']=int(meta['id'])+999999
          post_meta['created_at']='2026-09-06T13:31:00+00:00'
          post=selector._candidate_from_bundle(post_meta,run,bundle,target,'GER_Bundesliga',kickoff)
          assert post['artifact_available_before_kickoff'] is False and post['pit_ok'] is False
          chosen, evaluated=contract.choose_candidate([pre,post],target,'GER_Bundesliga')
          assert chosen and chosen['artifact_id']==int(meta['id'])
          assert any('PIT' in row['rejection_reasons'] for row in evaluated if row['artifact_id']==post_meta['id'])

          bad_verified=dict(pre); bad_verified['verified']=False
          chosen2, evaluated2=contract.choose_candidate([bad_verified],target,'GER_Bundesliga')
          assert chosen2 is None and 'VERIFIED' in evaluated2[0]['rejection_reasons']
          bad_pit=dict(pre); bad_pit['pit_ok']=False
          chosen3, evaluated3=contract.choose_candidate([bad_pit],target,'GER_Bundesliga')
          assert chosen3 is None and 'PIT' in evaluated3[0]['rejection_reasons']
          chosen4, evaluated4=contract.choose_candidate([post],target,'GER_Bundesliga')
          assert chosen4 is None

          # Actual formal entry install chain: coverage patch must install the governed
          # effective-evidence adapter before capturing the classifier.
          import entry
          assert entry.FORMAL_STATE_INTEGRITY_COVERAGE_PATCH['installed'] is True
          eg=entry.FORMAL_STATE_INTEGRITY_COVERAGE_PATCH['effective_evidence_guard']
          assert eg['installed'] is True
          assert eg['prematch_fallback_verdict_source']=='historical_xg_challenger_v1.dynamic.fallback_exact_v1'
          assert eg['independent_guard_threshold_reimplementation_used'] is False

          saved_classifier=eff._ORIGINAL_CLASSIFY
          def base_audit(reasons=None):
              return {'anomaly_reasons':list(reasons or []),'historical_xg':{}}
          try:
              eff._ORIGINAL_CLASSIFY=lambda *a,**k: base_audit()
              active=eff.classify_state({}, {}, {}, {'dynamic':{'evidence':[6,7,8,9],'fallback_exact_v1':False}}, {'fallback_exact_v1':False})
              assert active['status']=='PASS' and active['fallback_class']=='NONE'
              assert active['formal_fallback_verdict']['effective_evidence']==[6.0,7.0,8.0,9.0]

              eff._ORIGINAL_CLASSIFY=lambda *a,**k: base_audit(['XG_EXPECTED_BUT_EFFECTIVE_EVIDENCE_INSUFFICIENT:legacy'])
              legal=eff.classify_state({}, {}, {}, {'dynamic':{'evidence':[1.0,2.0,1.5,2.5],'fallback_exact_v1':True}}, {'fallback_exact_v1':True})
              assert legal['status']=='PASS' and legal['fallback_class']=='NORMAL_FALLBACK'
              assert not legal['anomaly_reasons']

              eff._ORIGINAL_CLASSIFY=lambda *a,**k: base_audit(['FALLBACK_DESPITE_EFFECTIVE_EVIDENCE_THRESHOLD:legacy'])
              unexpected=eff.classify_state({}, {}, {}, {'dynamic':{'evidence':[5,5,5,5],'fallback_exact_v1':False}}, {'fallback_exact_v1':True})
              assert unexpected['status']=='DATA_STATE_ANOMALY'
              assert any(x.startswith('FORMAL_XG_FALLBACK_VERDICT_MISMATCH:') for x in unexpected['anomaly_reasons'])

              eff._ORIGINAL_CLASSIFY=lambda *a,**k: base_audit(['HOME_ESTABLISHED_HISTORY_ZERO'])
              independent=eff.classify_state({}, {}, {}, {'dynamic':{'evidence':[1,1,1,1],'fallback_exact_v1':True}}, {'fallback_exact_v1':True})
              assert independent['status']=='DATA_STATE_ANOMALY' and 'HOME_ESTABLISHED_HISTORY_ZERO' in independent['anomaly_reasons']
          finally:
              eff._ORIGINAL_CLASSIFY=saved_classifier

          # first authoritative reason must survive guard enrichment.
          tmp=pathlib.Path(tempfile.mkdtemp(prefix='f3-first-reason-'))
          saved_enrich=eff._ORIGINAL_ENRICH
          try:
              (tmp/'prediction_receipt.json').write_text(json.dumps({'failure_reason':'FIRST_AUTH','fallback_exact_v1':True}))
              eff._ORIGINAL_ENRICH=lambda out,result,audit,mode,binding: {'fallback_reason':'LATER_GUARD','receipt_sha':'old'}
              result={}
              enriched=eff._enrich_receipt(tmp,result,{'formal_fallback_verdict':{'source':'test'}},'FAST',{})
              assert enriched['fallback_reason']=='FIRST_AUTH'
              assert enriched['first_authoritative_failure_reason']=='FIRST_AUTH'
              assert enriched['integrity_guard_fallback_reason']=='LATER_GUARD'
              assert result['fallback_reason']=='FIRST_AUTH'
          finally:
              eff._ORIGINAL_ENRICH=saved_enrich
              shutil.rmtree(tmp,ignore_errors=True)

          # Exact-sealed recovery suppression: actual clear/rebuild implementations
          # are never invoked and bundle bytes remain unchanged.
          tmp=pathlib.Path(tempfile.mkdtemp(prefix='f3-sealed-'))
          state=tmp/'state'; shutil.copytree(bundle,state/'bundle')
          before=rt.validate_bundle(state/'bundle')['manifest']['state_bundle_sha256']
          saved_pre=eff._ORIGINAL_CACHE_PREFLIGHT
          saved_clear=eff._ORIGINAL_CLEAR_CACHE
          saved_full=eff._ORIGINAL_FULL_REBUILD
          try:
              eff._ORIGINAL_CACHE_PREFLIGHT=lambda *a,**k: {'fast_eligible':False,'reason':'GENERIC_TRUE_ANOMALY_PRECHECK'}
              eff._ORIGINAL_CLEAR_CACHE=lambda *a,**k: (_ for _ in ()).throw(AssertionError('actual cache clear invoked'))
              eff._ORIGINAL_FULL_REBUILD=lambda *a,**k: (_ for _ in ()).throw(AssertionError('actual live FULL invoked'))
              pr=eff._cache_preflight(state,pathlib.Path('.'),'GER_Bundesliga','2026/27','Hamburger SV','1. FSV Mainz 05',kickoff,target)
              assert pr['sealed_exact_cutoff_replay'] and pr['recovery_suppressed'] and pr['fast_eligible']
              eff._clear_cache(state)
              rb=eff._build_integrity_base(state/'bundle')
              assert rb['cache_clear_used'] is False and rb['live_full_used'] is False
              assert rb['route']=='SEALED_EXACT_CUTOFF_REPLAY_RECOVERY_SUPPRESSED'
              after=rt.validate_bundle(state/'bundle')['manifest']['state_bundle_sha256']
              assert after==before
          finally:
              eff._ORIGINAL_CACHE_PREFLIGHT=saved_pre
              eff._ORIGINAL_CLEAR_CACHE=saved_clear
              eff._ORIGINAL_FULL_REBUILD=saved_full
              eff._SEALED_EXACT_ROOTS.discard(str(state.resolve()))
              shutil.rmtree(tmp,ignore_errors=True)

          manifest={
            'status':'PASS',
            'selector_prematch_artifact_ceiling':True,
            'postmatch_duplicate_rejected':True,
            'verified_rejection':True,
            'pit_rejection':True,
            'no_prematch_state_fail_closed':True,
            'formal_entry_effective_guard_installed':True,
            'fusion_v2_active_verdict':True,
            'legal_normal_fallback_verdict':True,
            'continuing_club_unexpected_fallback_anomaly':True,
            'sealed_cache_clear_used':False,
            'sealed_live_full_used':False,
            'first_authoritative_failure_reason_preserved':True,
          }
          (root/'targeted_tests_manifest.json').write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          print('DIRECTED_ACCEPTANCE_PASS',json.dumps(manifest,sort_keys=True))
          PY

      - name: Build explicit bound durable selection for Hamburg Mainz
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 - <<'PY'
          import json, os, pathlib
          import runtime as rt
          import durable_state_contract_v1 as contract
          import durable_state_selector_v1 as selector
          root=pathlib.Path('.accept')
          state=root/'hamburg/state'
          art=json.load(open(root/'meta/source_artifact.json'))
          run=json.load(open(root/'meta/source_run.json'))
          target=rt._parse_dt(os.environ['HAMBURG_CUTOFF'],'target cutoff')
          kickoff=rt._parse_dt(os.environ['HAMBURG_KICKOFF'],'kickoff')
          cand=selector._candidate_from_bundle(art,run,state/'bundle',target,'GER_Bundesliga',kickoff)
          selected,evaluated=contract.choose_candidate([cand],target,'GER_Bundesliga')
          assert selected is not None and selected['artifact_id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          core={
            'schema_version':contract.SELECTION_SCHEMA,
            'status':'SELECTED',
            'selection_rule':'explicit_user_bound_prematch_artifact_then_same_generic_eligibility_contract',
            'target_cutoff':target.isoformat(),
            'prematch_artifact_availability_ceiling':kickoff.isoformat(),
            'competition_id':'GER_Bundesliga',
            'selected':selected,
            'runtime_contract':contract.runtime_contract_payload(),
            'candidate_count':1,
            'candidates':evaluated,
          }
          audit={**core,'selection_sha256':contract.sha(core)}
          (state/'durable_state_selection_v1.json').write_bytes(contract.canon(audit))
          (root/'hamburg_bound_selection.json').write_bytes(contract.canon(audit))
          print('HAMBURG_BOUND_SELECTION_PASS',audit['selection_sha256'])
          PY

      - name: Re-run Hamburg Mainz exact sealed replay from bound prematch artifact
        env:
          FOOTBALL3_DURABLE_SELECTOR_REQUIRED: '1'
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          mkdir -p .accept/hamburg/out
          cat > .accept/hamburg_request.json <<JSON
          {"schema_version":"football3-formal-gpt-gateway-v1","request_id":"hamburg-mainz-effective-evidence-exact-head-acceptance","mode":"predict","match":{"competition_id":"GER_Bundesliga","season":"2026/27","home_team_name":"Hamburger SV","away_team_name":"1. FSV Mainz 05","kickoff":"${HAMBURG_KICKOFF}","cutoff":"${HAMBURG_CUTOFF}"}}
          JSON
          before="$(python3 - <<'PY'
          import json
          print(json.load(open('.accept/hamburg/state/bundle/manifest.json'))['state_bundle_sha256'])
          PY
          )"
          python3 football-data/formal_gpt_gateway_v1/entry.py \
            --request "$PWD/.accept/hamburg_request.json" \
            --repo-root "$PWD" \
            --understat-db "$PWD/.accept/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.accept/confirmation" \
            --state-root "$PWD/.accept/hamburg/state" \
            --out "$PWD/.accept/hamburg/out" \
            | tee .accept/hamburg_stdout.txt
          after="$(python3 - <<'PY'
          import json
          print(json.load(open('.accept/hamburg/state/bundle/manifest.json'))['state_bundle_sha256'])
          PY
          )"
          test "$before" = "$after"
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime
          root=pathlib.Path('.accept')
          out=root/'hamburg/out'
          s=json.load(open(out/'summary.json'))
          r=json.load(open(out/'prediction_receipt.json'))
          x=json.load(open(out/'xg_trigger_audit.json'))
          sel=json.load(open(root/'hamburg_bound_selection.json'))
          art=json.load(open(root/'meta/source_artifact.json'))
          assert s['status']=='PASS',s
          assert s['gateway_route']=='SEALED_EXACT_CUTOFF_REPLAY',s
          assert s['source_refetch_used'] is False and s['state_mutated'] is False,s
          assert s['prediction_sha'] and r['prediction_sha']==s['prediction_sha']
          evidence=[float(v) for v in x['dynamic']['evidence']]
          assert len(evidence)==4,evidence
          formal_flag=bool(x['dynamic']['fallback_exact_v1'])
          assert formal_flag==bool(r['fallback_exact_v1'])
          expected_route='FROZEN_V1_EXACT_FALLBACK' if formal_flag else 'FUSION_V2_ACTIVE'
          assert r['model_route']==expected_route,(r['model_route'],expected_route,evidence)
          fv=r['formal_fallback_verdict']
          assert fv['source']=='historical_xg_challenger_v1.dynamic.fallback_exact_v1'
          assert fv['receipt_verdict_consistent'] is True
          assert fv['effective_evidence']==evidence
          created=datetime.fromisoformat(str(art['created_at']).replace('Z','+00:00'))
          kickoff=datetime.fromisoformat(os.environ['HAMBURG_KICKOFF'])
          assert created < kickoff
          assert sel['selected']['artifact_id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          probs={'home':float(r['p_home']),'draw':float(r['p_draw']),'away':float(r['p_away'])}
          top1=max(probs,key=probs.get)
          tg=r.get('total_goals') or {}
          over25=sum(float(v) for k,v in tg.items() if int(k)>=3)
          btts=float((r.get('btts') or {}).get('yes'))
          result={
            'status':'PASS','source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
            'source_artifact_created_at':art['created_at'],'kickoff':os.environ['HAMBURG_KICKOFF'],'cutoff':os.environ['HAMBURG_CUTOFF'],
            'gateway_route':s['gateway_route'],'source_refetch_used':s['source_refetch_used'],'state_mutated':s['state_mutated'],
            'model_route':r['model_route'],'fallback_class':r.get('fallback_class'),'fallback_exact_v1':r['fallback_exact_v1'],
            'effective_evidence':evidence,'prediction_sha':r['prediction_sha'],'receipt_sha':r['receipt_sha'],
            'p_home':probs['home'],'p_draw':probs['draw'],'p_away':probs['away'],'top1':top1,
            'top3_scores':r['top_scores'][:3],'over_2_5':over25,'btts_yes':btts,
            'state_sha256':r['state_sha256'],'state_bundle_sha256':r['state_bundle_sha'],
            'selection_sha256':sel['selection_sha256'],'artifact_digest':art.get('digest'),
          }
          (root/'hamburg_final_acceptance.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          print('HAMBURG_EXACT_SEALED_PASS',json.dumps(result,sort_keys=True))
          PY

      - name: Verify exact sealed true anomaly fails closed without actual clear or live FULL
        env:
          FOOTBALL3_DURABLE_SELECTOR_REQUIRED: '1'
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          rm -rf .accept/sealed_anomaly
          mkdir -p .accept/sealed_anomaly/state/bundle .accept/sealed_anomaly/out
          unzip -q .accept/hamburg_source.zip -d .accept/sealed_anomaly/state/bundle
          cp .accept/hamburg/state/durable_state_selection_v1.json .accept/sealed_anomaly/state/durable_state_selection_v1.json
          python3 - <<'PY' | tee .accept/sealed_anomaly_stdout.txt
          import json, os, pathlib
          import entry, gateway
          import formal_effective_evidence_guard_governed_v1 as eff
          import runtime as rt
          root=pathlib.Path('.accept/sealed_anomaly')
          req=json.load(open('.accept/hamburg_request.json'))
          before=rt.validate_bundle(root/'state/bundle')['manifest']['state_bundle_sha256']
          saved=eff._ORIGINAL_CLASSIFY
          saved_clear=eff._ORIGINAL_CLEAR_CACHE
          saved_full=eff._ORIGINAL_FULL_REBUILD
          calls={'actual_clear':0,'actual_full':0}
          def forced(*args,**kwargs):
              d=saved(*args,**kwargs)
              d['anomaly_reasons']=list(d.get('anomaly_reasons') or [])+['GENERIC_FORCED_TRUE_ANOMALY']
              return d
          def actual_clear(*args,**kwargs):
              calls['actual_clear']+=1
              raise AssertionError('sealed anomaly invoked actual cache clear')
          def actual_full(*args,**kwargs):
              calls['actual_full']+=1
              raise AssertionError('sealed anomaly invoked actual live FULL')
          try:
              eff._ORIGINAL_CLASSIFY=forced
              eff._ORIGINAL_CLEAR_CACHE=actual_clear
              eff._ORIGINAL_FULL_REBUILD=actual_full
              result=gateway.normal_request(req,root/'state',root/'out',pathlib.Path('.'),pathlib.Path('.accept/understat/understat_frozen.db'),pathlib.Path('.accept/confirmation'))
          finally:
              eff._ORIGINAL_CLASSIFY=saved
              eff._ORIGINAL_CLEAR_CACHE=saved_clear
              eff._ORIGINAL_FULL_REBUILD=saved_full
          after=rt.validate_bundle(root/'state/bundle')['manifest']['state_bundle_sha256']
          assert result['status']=='DATA_STATE_ANOMALY',result
          assert result['prediction_sha'] is None and result['receipt_sha'] is None,result
          assert calls=={'actual_clear':0,'actual_full':0},calls
          assert before==after,(before,after)
          m={'status':'PASS','result_status':result['status'],'prediction_sha':result['prediction_sha'],'actual_cache_clear_calls':0,'actual_live_full_calls':0,'state_bundle_unchanged':True}
          pathlib.Path('.accept/sealed_anomaly_acceptance.json').write_text(json.dumps(m,sort_keys=True,separators=(',',':'))+'\n')
          print('SEALED_TRUE_ANOMALY_FAIL_CLOSED_PASS',json.dumps(m,sort_keys=True))
          PY

      - name: Run cross-league generic integrity regression
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          mkdir -p .accept/cross_league
          python3 football-data/formal_gpt_gateway_v1/formal_state_integrity_regression_v2.py \
            --repo-root "$PWD" \
            --understat-db "$PWD/.accept/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.accept/confirmation" \
            --out "$PWD/.accept/cross_league" \
            | tee .accept/cross_league_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('.accept/cross_league/formal_state_integrity_regression.json'))
          assert d['status']=='PASS',d
          assert d['non_stuttgart_case_n']>=4,d
          assert d['target_specific_replay_used'] is False,d
          assert d['all_fast_full_probability_byte_equal'] and d['all_fast_full_matrix_byte_equal'],d
          assert d['legal_fallback_frozen_v1_exact'] is True,d
          print('CROSS_LEAGUE_REGRESSION_PASS')
          PY

      - name: Run real FUSION V2 active exact-head acceptance
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_gpt_gateway_v1/test_fusion_v2_active_exact_head_v1.py \
            --repo-root "$PWD" \
            --understat-db "$PWD/.accept/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.accept/confirmation" \
            --expected-runtime-head "$GITHUB_SHA" \
            --out "$PWD/.accept/fusion_v2_active_exact_head_receipt.json" \
            | tee .accept/fusion_v2_active_stdout.txt
          python3 - <<'PY'
          import json,os
          d=json.load(open('.accept/fusion_v2_active_exact_head_receipt.json'))
          assert d['passed'] is True and d['runtime_exact_head']==os.environ['GITHUB_SHA'],d
          assert d['formal_model_invoked'] is True and d['model_route']=='FUSION_V2_ACTIVE',d
          assert d['fallback_exact_v1'] is False and len(d['effective_evidence'])==4,d
          print('FUSION_V2_ACTIVE_EXACT_HEAD_PASS',d['receipt_sha256'])
          PY

      - name: Run production 300 equivalence
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_gpt_gateway_v1/test_production_300_adjudicated_v1.py \
            --mode production \
            --repo-root "$PWD" \
            --understat-db "$PWD/.accept/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.accept/confirmation" \
            --n 300 \
            --out "$PWD/.accept/production_300_equivalence_receipt.json" \
            | tee .accept/production_300_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('.accept/production_300_equivalence_receipt.json'))
          assert d['passed'] is True and d['mode']=='production',d
          eq=d['equivalence_300']
          assert eq['n']==300 and eq['passed'] is True,eq
          assert eq['max_abs_1x2']<=1e-12 and eq['max_abs_score_matrix_cell']<=1e-12 and eq['cache_state_exact'] is True,eq
          print('PRODUCTION_300_PASS',d['receipt_sha256'])
          PY

      - name: Build final acceptance manifest and digests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('.accept')
          h=json.load(open(root/'hamburg_final_acceptance.json'))
          t=json.load(open(root/'targeted_tests_manifest.json'))
          a=json.load(open(root/'sealed_anomaly_acceptance.json'))
          c=json.load(open(root/'cross_league/formal_state_integrity_regression.json'))
          f=json.load(open(root/'fusion_v2_active_exact_head_receipt.json'))
          p=json.load(open(root/'production_300_equivalence_receipt.json'))
          manifest={
            'schema_version':'football3-effective-evidence-guard-selector-exact-head-acceptance-v1',
            'status':'PASS','exact_head':os.environ['GITHUB_SHA'],'exact_base':os.environ['EXACT_BASE'],
            'source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
            'targeted':t,'sealed_anomaly':a,'hamburg_mainz':h,
            'cross_league_status':c['status'],'cross_league_case_n':c['non_stuttgart_case_n'],
            'fusion_v2_active_receipt_sha256':f['receipt_sha256'],
            'production_300_receipt_sha256':p['receipt_sha256'],
            'model_parameters_or_weights_changed':False,'formal_current_or_production_pointer_changed':False,
            'fusion_weights_changed':False,'ready':False,'merge':False,'production_activation':False,'airtable_write':False,
          }
          payload=json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n'
          (root/'final_acceptance_manifest.json').write_text(payload)
          print('FINAL_ACCEPTANCE_PASS',hashlib.sha256(payload.encode()).hexdigest())
          PY
          find .accept -type f -not -path '*/state/bundle/*' -print0 | sort -z | xargs -0 sha256sum > .accept/final_file_sha256.txt
          sha256sum .accept/final_acceptance_manifest.json | tee .accept/final_acceptance_manifest_sha256.txt

      - name: Upload exact-head acceptance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-effective-evidence-guard-selector-exact-head-${{ github.run_id }}
          path: |
            acceptance_authority.txt
            acceptance_changed_files.txt
            acceptance_exact_head.txt
            .accept/final_acceptance_manifest.json
            .accept/final_acceptance_manifest_sha256.txt
            .accept/final_file_sha256.txt
            .accept/source_zip_sha256.txt
            .accept/hamburg_bundle_file_sha256.txt
            .accept/meta/source_run.json
            .accept/meta/source_artifact.json
            .accept/targeted_tests_manifest.json
            .accept/targeted_tests_stdout.txt
            .accept/hamburg_bound_selection.json
            .accept/hamburg_final_acceptance.json
            .accept/hamburg_stdout.txt
            .accept/hamburg/out/summary.json
            .accept/hamburg/out/prediction_receipt.json
            .accept/hamburg/out/state_integrity_audit.json
            .accept/hamburg/out/xg_trigger_audit.json
            .accept/hamburg/out/durable_state_governance.json
            .accept/hamburg/out/state_transition_receipt.json
            .accept/sealed_anomaly_acceptance.json
            .accept/sealed_anomaly_stdout.txt
            .accept/cross_league/formal_state_integrity_regression.json
            .accept/cross_league_stdout.txt
            .accept/fusion_v2_active_exact_head_receipt.json
            .accept/fusion_v2_active_stdout.txt
            .accept/production_300_equivalence_receipt.json
            .accept/production_300_stdout.txt
          if-no-files-found: error
          retention-days: 90
