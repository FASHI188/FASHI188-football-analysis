name: Football R41B Fixed200 Low Event Total

on:
  pull_request:
    paths:
      - "football-data/config/r41b_fixed200_low_event_total.json"
      - "football-data/validation/evaluate_r41b_fixed200_low_event_total.py"
      - "football-data/validation/evaluate_r41a_fixed200_joint_error_decomposition.py"
      - "football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py"
      - "football-data/validation/v510_historical_structure_features_r1.py"
      - "football-data/validation/v510_historical_structure_model_r1.py"
      - "football-data/config/v510_existing_score_market_pit_ledger_r1.json"
      - "football-data/config/v510_historical_label_structure_rolling_r1.json"
      - "football-data/processed/**/*.csv"
      - ".github/workflows/football-r41b-fixed200-low-event-total.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-r41b-fixed200-low-event-total-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile research path
        run: |
          python -m py_compile \
            football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py \
            football-data/validation/v510_historical_structure_features_r1.py \
            football-data/validation/v510_historical_structure_model_r1.py \
            football-data/validation/evaluate_r41a_fixed200_joint_error_decomposition.py \
            football-data/validation/evaluate_r41b_fixed200_low_event_total.py
      - name: Deterministic self-tests
        run: |
          python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py --self-test
          python football-data/validation/evaluate_r41a_fixed200_joint_error_decomposition.py --self-test
          python football-data/validation/evaluate_r41b_fixed200_low_event_total.py --self-test
      - name: Rebuild exact audited V5.1 historical score ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run disjoint fixed200 low-event total challenge
        run: python football-data/validation/evaluate_r41b_fixed200_low_event_total.py
      - name: Verify hard boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/r41b_fixed200_low_event_total_status.json').read_text(encoding='utf-8'))
          assert x['status']=='PASS_R41B_FIXED200_EXECUTION_COMPLETE'
          assert x['sample']['rows']==200
          assert x['sample']['R41A_overlap']==0
          assert x['sample']['labels_used_for_identity_selection'] is False
          assert x['sample']['blind_claim'] is False
          assert x['model_contract']['fixed200_used_for_regularization_selection'] is False
          assert x['governance']['formal_weight']==0
          assert x['governance']['protected_blind_access']==0
          assert x['governance']['formal_model_mutation'] is False
          assert x['governance']['formal_data_mutation'] is False
          assert x['governance']['formal_config_mutation'] is False
          assert x['governance']['current_mutation'] is False
          assert x['governance']['main_mutation'] is False
          print(json.dumps({
              'scientific_verdict':x['scientific_verdict'],
              'sample':x['sample'],
              'metrics':x['metrics'],
              'draw_diagnostics':x['draw_diagnostics'],
              'gate':x['gate'],
              'interpretation':x['interpretation'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload aggregate research receipt
        uses: actions/upload-artifact@v4
        with:
          name: r41b-fixed200-low-event-total
          path: |
            football-data/manifests/r41b_fixed200_low_event_total_status.json
            football-data/manifests/v510_existing_score_market_pit_ledger_r1_status.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm only runtime manifests are untracked
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'football-data/manifests/v510_existing_score_market_pit_ledger_r1_rows.csv',
            'football-data/manifests/v510_existing_score_market_pit_ledger_r1_status.json',
            'football-data/manifests/r41b_fixed200_low_event_total_status.json',
          }
          lines=subprocess.check_output(['git','status','--short'],text=True).splitlines()
          unexpected=[line for line in lines if line[3:] not in allowed]
          assert not unexpected, unexpected
          print({'runtime_only': sorted(allowed)})
          PY
