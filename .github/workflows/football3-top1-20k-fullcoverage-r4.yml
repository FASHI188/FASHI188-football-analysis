name: football3 Top1 disjoint 20k full coverage R4
on:
  push:
    branches: ["football3/top1-20k-opponent-veto-r1"]
    paths:
      - "football-data/experiments/top1_20k_r4/run_experiment_r4.py"
      - ".github/workflows/football3-top1-20k-fullcoverage-r4.yml"
permissions:
  contents: write
jobs:
  r4-full-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-20k-opponent-veto-r1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install calibration runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Freeze fourth disjoint 20000 matches
        run: python football-data/experiments/top1_20k_r4/run_experiment_r4.py freeze
      - name: Run full coverage Top1 experiment
        run: python football-data/experiments/top1_20k_r4/run_experiment_r4.py run
      - name: Verify 100 percent coverage and no-market contract
        run: python football-data/experiments/top1_20k_r4/run_experiment_r4.py verify
      - name: Persist R4 frozen data and result to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/experiments/top1_20k_r4/data football-data/experiments/top1_20k_r4/results
          git commit -m "[generated top1-20k-r4] freeze fourth disjoint 20000 and full-coverage result"
          git push origin HEAD:football3/top1-20k-opponent-veto-r1
      - name: Upload immutable R4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-20k-fullcoverage-r4
          path: |
            football-data/experiments/top1_20k_r4/data/source_manifest_r4.json
            football-data/experiments/top1_20k_r4/results/summary_r4.json
          retention-days: 30
