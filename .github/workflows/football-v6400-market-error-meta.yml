name: football-v6400-market-error-meta

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_market_error_meta_gold500_v6400.py'
      - '.github/workflows/football-v6400-market-error-meta.yml'
      - 'football-data/manifests/gold500_v6360/gold500_features_v6360.jsonl'
      - 'football-data/manifests/gold500_v6360/gold500_development_labels_v6360.jsonl'

permissions:
  contents: write

jobs:
  fast100:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check catboost==1.2.10 scipy==1.14.1

      - name: Compile
        run: python -m py_compile football-data/validation/validate_market_error_meta_gold500_v6400.py

      - name: Run V6.40 historical gate and conditional Fast100
        shell: bash
        run: |
          set +e
          python football-data/validation/validate_market_error_meta_gold500_v6400.py 2>&1 | tee football-data/manifests/v6400_market_error_meta.log
          status=${PIPESTATUS[0]}
          echo "validator_exit_status=${status}" | tee -a football-data/manifests/v6400_market_error_meta.log
          exit ${status}

      - name: Persist successful receipt
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_market_error_meta_gold500_v6400_status.json
          if git diff --cached --quiet; then
            echo "V6.40 receipt already persisted"
          else
            git commit -m "audit(football): persist V6.40 market-error meta result"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6400-market-error-meta
          path: |
            football-data/manifests/v6400_market_error_meta.log
            football-data/manifests/v6_market_error_meta_gold500_v6400_status.json
          if-no-files-found: warn
