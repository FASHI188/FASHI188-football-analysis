name: Football R44L7B Setpiece Full Zero Label

on:
  push:
    branches:
      - research/r44l7b-setpiece-full-zero-label
    paths:
      - 'football-data/research/r44l7b_setpiece_full_zero_label/**'
      - '.github/workflows/football-r44l7b-setpiece-full-zero-label.yml'
  pull_request:
    paths:
      - 'football-data/research/r44l7b_setpiece_full_zero_label/**'
      - '.github/workflows/football-r44l7b-setpiece-full-zero-label.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r44l7b-setpiece-full-zero-label-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen R44L7B zero-label contract
        run: |
          set -euo pipefail
          test -f football-data/research/r44l7b_setpiece_full_zero_label/prereg_r44l7b.md
          python -m py_compile football-data/research/r44l7b_setpiece_full_zero_label/run_full_coverage_r44l7b.py
          python - <<'PY'
          from pathlib import Path
          s=Path('football-data/research/r44l7b_setpiece_full_zero_label/run_full_coverage_r44l7b.py').read_text(encoding='utf-8')
          forbidden=['home_'+'score','away_'+'score','winner','label_'+'draw','binary_'+'target','goal_'+'difference']
          hits=[x for x in forbidden if x in s]
          assert not hits, hits
          assert 'competition_id":11' not in s and '"competition_id":11' not in s
          assert 'WARMUP=100' in s and 'PRIOR_N=5' in s
          pre=Path('football-data/research/r44l7b_setpiece_full_zero_label/prereg_r44l7b.md').read_text(encoding='utf-8')
          for token in ['same_match_event_used_before_feature=0','result/label keys accessed=0','model_fits=0','La Liga 2015/16固定排除']:
              assert token in pre, token
          print('PASS_R44L7B_STATIC_ZERO_LABEL_CONTRACT')
          PY
      - name: Run full prior-only zero-label coverage
        env:
          R44L7B_OUTPUT: ${{ runner.temp }}/r44l7b
        run: |
          set -euo pipefail
          rm -rf "$R44L7B_OUTPUT"
          python football-data/research/r44l7b_setpiece_full_zero_label/run_full_coverage_r44l7b.py | tee "$RUNNER_TEMP/r44l7b_stdout.txt"
      - name: Verify receipt and exact HEAD
        env:
          R44L7B_OUTPUT: ${{ runner.temp }}/r44l7b
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['R44L7B_OUTPUT']); raw=(root/'receipt.json').read_bytes(); r=json.loads(raw)
          assert r['schema_version']=='V520-R44L7B-FULL-ZERO-LABEL-1.0'
          assert r['terminal'] in {'PASS_R44L7B_FULL_PRIOR_ONLY_ZERO_LABEL_COVERAGE','STOP_R44L7B_FULL_PRIOR_ONLY_COVERAGE'}
          assert r['research_only'] is True and r['formal_weight']==0
          assert all(v==0 for v in r['hard_boundary_receipt'].values())
          assert r['same_match_event_used_before_feature']==0
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['run_identity']['checked_out_head_sha']==head
          assert (root/'receipt.sha256').read_text().strip()==hashlib.sha256(raw).hexdigest()
          print(json.dumps({'terminal':r['terminal'],'summary':r['summary'],'gates':r['gates'],'head':head},sort_keys=True))
          PY
          git diff --exit-code -- .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: football-r44l7b-full-zero-label-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r44l7b/
            ${{ runner.temp }}/r44l7b_stdout.txt
            football-data/research/r44l7b_setpiece_full_zero_label/prereg_r44l7b.md
          retention-days: 30
          if-no-files-found: error
