name: Football V6.49.4 Engineering Profile Guard Read-Only

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "football-data/config/v6_engineering_research_profile_v6494.json"
      - "football-data/validation/validate_engineering_research_profile_v6494.py"
      - ".github/workflows/football-v6494-engineering-profile-guard.yml"
  push:
    branches: [main]
    paths:
      - "football-data/config/v6_engineering_research_profile_v6494.json"
      - "football-data/validation/validate_engineering_research_profile_v6494.py"
      - ".github/workflows/football-v6494-engineering-profile-guard.yml"

permissions:
  contents: read

concurrency:
  group: football-v6494-engineering-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile read-only engineering profile validator
        run: python -m py_compile football-data/validation/validate_engineering_research_profile_v6494.py
      - name: Validate engineering profile without repository persistence
        run: python football-data/validation/validate_engineering_research_profile_v6494.py --print-summary
      - name: Confirm checkout unchanged
        run: git diff --exit-code
