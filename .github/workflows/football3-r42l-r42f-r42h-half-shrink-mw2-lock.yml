name: football3 R42L R42F+R42H half-shrink MW2 lock

on:
  push:
    branches:
      - football3/r42l-r42f-r42h-half-shrink-mw2-lock
    paths:
      - football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/run_r42l_mw2_forward_lock.py
      - .github/workflows/football3-r42l-r42f-r42h-half-shrink-mw2-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r42l-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r42l-r42f-r42h-half-shrink-mw2-lock
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Verify frozen dependency runners
        shell: bash
        run: |
          set -euo pipefail
          echo 'b860c1dfc86230a0da842cce2a8b78a02e1239eb191efeab30ad4ed1fb087cc5  football-data/experiments/r42k_r42h_v1_half_shrink_oldest20k/run_r42k_half_shrink.py' | sha256sum -c -
          echo '17155fe709877801299b1b8f2d965cb11da4cb81c5d2fc5733cf7536bbe2faad  football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py' | sha256sum -c -
          python -m py_compile football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/run_r42l_mw2_forward_lock.py
      - name: Reconstruct frozen R42H dependency
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/experiments/r42h_player_technical_translation
          cat "$D"/encoded/run_r42h.py.gz.b64.part0 "$D"/encoded/run_r42h.py.gz.b64.part1 | base64 -d | gzip -d > "$D"/run_r42h_player_technical_translation.py
          echo 'b7bf4bd5fbfd61936e8de52fa09e5b81f748389cb9e0d2de6f33641c1d394a45  '"$D"'/run_r42h_player_technical_translation.py' | sha256sum -c -
          python -m py_compile "$D"/run_r42h_player_technical_translation.py
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R42L true-forward MW2 lock
        run: python football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/run_r42l_mw2_forward_lock.py run
      - name: Verify R42L lock contract
        run: python football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/run_r42l_mw2_forward_lock.py verify
      - name: Persist R42L prematch lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/results/r42l_mw2_half_shrink_lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[locked] football3 R42L R42F+R42H half-shrink MW2 prospective lock'
            git fetch origin football3/r42l-r42f-r42h-half-shrink-mw2-lock
            git rebase origin/football3/r42l-r42f-r42h-half-shrink-mw2-lock
            git push origin HEAD:football3/r42l-r42f-r42h-half-shrink-mw2-lock
          fi
      - name: Upload R42L artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r42l-r42f-r42h-half-shrink-mw2-lock
          path: football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/results/r42l_mw2_half_shrink_lock.json
          if-no-files-found: error
          retention-days: 90
