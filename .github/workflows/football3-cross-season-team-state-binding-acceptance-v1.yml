name: Football3 Cross-Season Team State Binding Acceptance V1

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-cross-season-team-state-binding-acceptance-v1
  cancel-in-progress: false

jobs:
  governed-acceptance:
    if: ${{ github.event.pull_request.head.ref == 'football3/cross-season-team-state-binding-governed-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact PR HEAD and protected-scope diff
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA"...HEAD | tee changed-files.txt
          if grep -E '(^|/)(CURRENT|formal_fusion_v2.py|historical_xg_challenger.py|pure_engine.py|team_aliases.json)$|historical_xg_fusion_v2/.*/(model|parameter|weight)' changed-files.txt; then
            echo 'protected model/CURRENT/raw alias scope changed' >&2
            exit 1
          fi
          python3 -m py_compile \
            football-data/formal_gpt_gateway_v1/cross_season_team_state_binding_v1.py \
            football-data/formal_gpt_gateway_v1/formal_receipt_distribution_contract_v1.py \
            football-data/formal_gpt_gateway_v1/formal_future_fixture_identity_bridge_v1.py \
            football-data/formal_gpt_gateway_v1/cross_season_identity_audit_v1.py \
            football-data/formal_gpt_gateway_v1/ucl_cross_season_identity_audit_v1.py \
            football-data/engine/ucl_league_phase_identity_bridge_v1.py \
            football-data/engine/run_formal_prediction_ucl_governed_v1.py

      - name: Static governance and exact-scope gates
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1:$PWD/football-data/engine"
          python3 - <<'PY'
          import json
          import runtime as rt
          import ucl_league_phase_identity_bridge_v1 as ucl
          expected=(
            'ARG_Primera','BRA_SerieA','ENG_PremierLeague','ESP_LaLiga','FRA_Ligue1',
            'GER_Bundesliga','ITA_SerieA','JPN_J1','KOR_KLeague1','NED_Eredivisie',
            'NOR_Eliteserien','POR_PrimeiraLiga','SCO_Premiership','SUI_SuperLeague',
            'SWE_Allsvenskan','USA_MLS',
          )
          assert tuple(rt.FORMAL_SCOPE)==expected
          assert 'UEFA_ChampionsLeague' not in rt.FORMAL_SCOPE
          reg=ucl._registry()
          assert reg['team_count']==36 and len(reg['teams'])==36
          assert reg['phase']=='league_phase' and reg['season']=='2026/27'
          assert reg['authority']['qualification_roster_is_authoritative_for_league_phase'] is False
          snap=ucl.registry_snapshot()
          assert snap['qualification_roster_used'] is False
          open('static-governance.json','w').write(json.dumps({'status':'PASS','formal_scope':list(expected),'ucl_roster_count':36,'ucl_roster_sha256':reg['roster_sha256']},sort_keys=True)+'\n')
          PY

      - name: Restore immutable pre-target state and frozen rebuild sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .formal_state_cache/bundle .runtime_sources/understat .runtime_sources/confirmation acceptance
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9973225479/zip" -o .runtime_sources/state.zip
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/state.zip -d .formal_state_cache/bundle
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle --bundle "$PWD/.formal_state_cache/bundle" | tee acceptance/state-validate-before.txt
          sha256sum .formal_state_cache/bundle/* | sort > acceptance/state-files-before.sha256

      - name: Execute Nottingham Forest vs Tottenham through formal production entry
        run: |
          set -euo pipefail
          cat > acceptance/request.json <<'JSON'
          {"schema_version":"football3-formal-gpt-gateway-v1","mode":"predict","request_id":"cross-season-governed-acceptance-nfo-tottenham-sealed-v1","match":{"competition_id":"ENG_PremierLeague","season":"2026/27","kickoff":"2026-09-05T14:00:00+00:00","cutoff":"2026-09-04T13:19:44+00:00","home_team_name":"Nottingham Forest","away_team_name":"Tottenham Hotspur"}}
          JSON
          rm -rf acceptance/run1 acceptance/run2
          mkdir -p acceptance/run1 acceptance/run2
          export FOOTBALL3_DURABLE_SELECTOR_REQUIRED=0
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_gpt_gateway_v1/entry.py \
            --request "$PWD/acceptance/request.json" --repo-root "$PWD" \
            --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runtime_sources/confirmation" \
            --state-root "$PWD/.formal_state_cache" --out "$PWD/acceptance/run1" | tee acceptance/run1/stdout.txt
          python3 - <<'PY'
          import json, pathlib
          r=json.load(open('acceptance/run1/prediction_receipt.json'))
          b=json.load(open('acceptance/run1/team_identity_bridge.json'))
          assert b['home']['current_name']=='Nottingham Forest'
          assert b['away']['current_name']=='Tottenham Hotspur'
          assert b['home']['participation_classification'] in ('CONTINUING_CLUB','RENAMED_OR_REKEYED_CLUB')
          assert b['away']['participation_classification'] in ('CONTINUING_CLUB','RENAMED_OR_REKEYED_CLUB')
          assert b['home']['historical_match_count']>0 and b['away']['historical_match_count']>0
          assert b['home']['state_local_evidence'] and b['home']['state_global_evidence']
          assert b['away']['state_local_evidence'] and b['away']['state_global_evidence']
          assert r['state_integrity_guard']['status']=='PASS'
          assert r['fallback_class'] in ('NONE','NORMAL_FALLBACK')
          assert r['fallback_class']!='DATA_STATE_ANOMALY'
          assert r['history_counts']['home_linked_2025_26_xg_matches']>0
          assert r['history_counts']['away_linked_2025_26_xg_matches']>0
          assert r['manual_or_auxiliary_fallback_used'] is False
          assert r['mu_home'] is None and r['mu_away'] is None
          assert r['mu_semantics']=='NOT_DEFINED_FOR_GLOBAL_MIXTURE_SINGLE_POISSON_MU_NOT_CLAIMED'
          assert 0.0 <= r['over_2_5'] <= 1.0
          assert abs(r['btts_yes']-r['btts']['yes']) < 1e-15
          assert r['top_3_exact_scores']==r['top_scores'][:3]
          assert r['one_x_two_top1']['selection'] in ('HOME','DRAW','AWAY')
          assert r['prediction_sha_before_distribution_contract']==r['prediction_sha']
          pathlib.Path('acceptance/nfo-tot-assertions.json').write_text(json.dumps({
            'status':'PASS','model_route':r['model_route'],'fallback_class':r['fallback_class'],
            'prediction_sha':r['prediction_sha'],'state_sha':r['state_sha256'],
            'effective_evidence':r['history_counts']['xg_effective_evidence'],
            'home_linked_xg':r['history_counts']['home_linked_2025_26_xg_matches'],
            'away_linked_xg':r['history_counts']['away_linked_2025_26_xg_matches'],
          },sort_keys=True)+'\n')
          PY
          sha256sum .formal_state_cache/bundle/* | sort > acceptance/state-files-post-run1.sha256

      - name: Audit seven domestic focus domains and all sixteen formal domains
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_gpt_gateway_v1/cross_season_identity_audit_v1.py \
            --repo-root "$PWD" --bundle "$PWD/.formal_state_cache/bundle" --out-dir "$PWD/acceptance/audit"

      - name: Audit UEFA Champions League official 36-team league phase
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1:$PWD/football-data/engine"
          python3 football-data/formal_gpt_gateway_v1/ucl_cross_season_identity_audit_v1.py \
            --repo-root "$PWD" --bundle "$PWD/.formal_state_cache/bundle" --out-dir "$PWD/acceptance/ucl-audit"
          python3 - <<'PY'
          import json
          d=json.load(open('acceptance/ucl-audit/ucl_2026_27_identity_audit.json'))
          assert d['authoritative_roster_count']==36 and d['resolved_team_count']==36
          assert d['qualification_roster_used'] is False
          assert d['fusion_v2_scope_unchanged'] is True
          assert not d['missing'] and not d['ambiguous'] and not d['duplicate_canonical_identity']
          assert not d['state_anomalies']
          assert d['final_guard_status'] in ('PASS','PASS_WITH_DATA_COVERAGE_LIMITATIONS')
          PY

      - name: Exercise real governed UCL legacy formal entry before Matchday 1
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/engine"
          cat > acceptance/ucl-real-madrid-inter.json <<'JSON'
          {
            "competition_id":"UEFA_ChampionsLeague",
            "season":"2026/27",
            "home_team":"Real Madrid",
            "away_team":"Inter",
            "kickoff_utc":"2026-09-08T20:00:00+00:00",
            "freeze_time_utc":"2026-09-06T03:59:00+00:00",
            "settlement":"90_minutes_including_stoppage",
            "competition_round":"League phase Matchday 1",
            "two_legged":false,
            "market_snapshot":null,
            "lineup_evidence":null,
            "data_freshness_evidence":{
              "source_name":"UEFA official 2026/27 Champions League fixtures",
              "source_url":"https://www.uefa.com/uefachampionsleague/news/02a8-2174c9e9019d-f909a77bd77a-1000--2026-27-champions-league-all-the-league-phase-fixtures/",
              "observed_at_utc":"2026-09-03T12:00:00+00:00",
              "expected_history_matches":0,
              "latest_history_match_date":null
            }
          }
          JSON
          python3 - <<'PY'
          import json
          import match_pipeline
          import ucl_league_phase_identity_bridge_v1 as ucl
          ucl.install(match_pipeline)
          inp=json.load(open('acceptance/ucl-real-madrid-inter.json'))
          ctx=match_pipeline.prepare_match_context(inp)
          tf=ctx['team_features']
          assert tf['status']=='通过', tf
          assert tf['identity_bridge']['status']=='PASS'
          assert tf['identity_bridge']['home']['current_uefa_name']=='Real Madrid'
          assert tf['identity_bridge']['away']['current_uefa_name']=='Inter'
          assert tf['identity_bridge']['registry']['team_count']==36
          open('acceptance/ucl-production-context.json','w').write(json.dumps(ctx,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY
          set +e
          python3 football-data/engine/run_formal_prediction_ucl_governed_v1.py \
            --input acceptance/ucl-real-madrid-inter.json \
            --context-output acceptance/ucl-formal-context.json \
            --calculation-output acceptance/ucl-formal-calculation.json \
            --validation-output acceptance/ucl-formal-validation.json \
            --print-summary > acceptance/ucl-formal-entry.stdout 2>&1
          rc=$?
          set -e
          cat acceptance/ucl-formal-entry.stdout
          if [ "$rc" -eq 0 ]; then
            status='FORMAL_LEGACY_OUTPUT_GENERATED'
          elif [ "$rc" -eq 2 ] && grep -Eq 'no point-in-time validated parameter set for target season 2026/27|current-season history has 0 matches' acceptance/ucl-formal-entry.stdout; then
            status='IDENTITY_PASS_SCIENTIFIC_GUARD_BLOCKED'
          else
            echo "unexpected UCL legacy entry result rc=$rc" >&2
            exit 1
          fi
          if grep -Eq 'D01|identity not unique|historical strength identity not unique' acceptance/ucl-formal-entry.stdout; then
            echo 'UCL identity failed before scientific guard' >&2
            exit 1
          fi
          STATUS="$status" python3 - <<'PY'
          import json,os
          d={
            'status':os.environ['STATUS'],
            'fixture':'Real Madrid vs Inter',
            'season':'2026/27',
            'fusion_v2_used':False,
            'identity_registry_count':36,
            'qualification_roster_used':False,
            'scientific_parameters_modified':False,
          }
          open('acceptance/ucl-formal-route-adjudication.json','w').write(json.dumps(d,sort_keys=True)+'\n')
          PY

      - name: Run production-300 exact formal runtime equivalence regression
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1"
          python3 football-data/formal_fast_runtime_v1/test_runtime.py \
            --mode production --repo-root "$PWD" \
            --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runtime_sources/confirmation" \
            --n 300 --out "$PWD/acceptance/production-300-equivalence-receipt.json" \
            | tee acceptance/production-300.stdout

      - name: Verify sealed determinism and post-FULL state immutability
        run: |
          set -euo pipefail
          export FOOTBALL3_DURABLE_SELECTOR_REQUIRED=0
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          python3 football-data/formal_gpt_gateway_v1/entry.py \
            --request "$PWD/acceptance/request.json" --repo-root "$PWD" \
            --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runtime_sources/confirmation" \
            --state-root "$PWD/.formal_state_cache" --out "$PWD/acceptance/run2" | tee acceptance/run2/stdout.txt
          python3 - <<'PY'
          import json
          a=json.load(open('acceptance/run1/prediction_receipt.json'))
          b=json.load(open('acceptance/run2/prediction_receipt.json'))
          for k in ('state_sha256','state_bundle_sha','runtime_input_sha','prediction_sha'):
              assert a[k]==b[k], (k,a[k],b[k])
          assert a['team_identity_bridge']==b['team_identity_bridge']
          assert a['p_home']==b['p_home'] and a['p_draw']==b['p_draw'] and a['p_away']==b['p_away']
          assert a['over_2_5']==b['over_2_5'] and a['btts_yes']==b['btts_yes']
          PY
          sha256sum .formal_state_cache/bundle/* | sort > acceptance/state-files-post-run2.sha256
          diff -u acceptance/state-files-post-run1.sha256 acceptance/state-files-post-run2.sha256

      - name: Upload governed acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-season-team-state-binding-acceptance-${{ github.run_id }}
          path: |
            acceptance/
            changed-files.txt
            static-governance.json
          if-no-files-found: error
          retention-days: 90
