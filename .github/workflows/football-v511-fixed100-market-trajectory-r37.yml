name: Football V5.1 Fixed100 Market Trajectory R37

on:
  push:
    branches:
      - research/v511-fixed100-market-trajectory-r37
    paths:
      - '.github/workflows/football-v511-fixed100-market-trajectory-r37.yml'
      - 'football-data/config/v511_fixed100_market_trajectory_r37.json'
      - 'football-data/validation/evaluate_v511_fixed100_market_trajectory_r37.py'
  pull_request:
    branches:
      - research/v511-fixed100-ah-score-matrix-r36
    paths:
      - '.github/workflows/football-v511-fixed100-market-trajectory-r37.yml'
      - 'football-data/config/v511_fixed100_market_trajectory_r37.json'
      - 'football-data/validation/evaluate_v511_fixed100_market_trajectory_r37.py'

permissions:
  contents: read

concurrency:
  group: football-v511-fixed100-market-trajectory-r37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed100-market-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify frozen research inputs
        run: |
          set -euo pipefail
          python -m py_compile football-data/validation/evaluate_v510_market_residual_1x2_r1.py
          python -m py_compile football-data/validation/evaluate_v511_fixed100_market_residual_r34.py
          python -m py_compile football-data/validation/evaluate_v511_fixed100_score_matrix_r35.py
          python -m py_compile football-data/validation/evaluate_v511_fixed100_ah_score_matrix_r36.py
          python -m py_compile football-data/validation/evaluate_v511_fixed100_market_trajectory_r37.py
          python -m json.tool football-data/config/v511_fixed100_market_trajectory_r37.json >/dev/null
          test -f football-data/benchmarks/v6_1x2_neutral_fixed1000_v6131.json

      - name: Run deterministic trajectory self-test
        run: |
          set -euo pipefail
          python football-data/validation/evaluate_v511_fixed100_market_trajectory_r37.py --self-test

      - name: Run fixed 100-match opening-to-closing trajectory exploration
        run: |
          set -euo pipefail
          rm -rf r37-output
          python football-data/validation/evaluate_v511_fixed100_market_trajectory_r37.py \
            --config football-data/config/v511_fixed100_market_trajectory_r37.json \
            --out-dir r37-output

      - name: Verify result and hard boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('r37-output')
          result = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          assert result['status'] in {
              'STOP_INSUFFICIENT_OPEN_CLOSE_TRAJECTORY_SAMPLE_BEFORE_LABELS',
              'PROMISING_OPEN_CLOSE_TRAJECTORY_SIGNAL_EXPLORATION_ONLY',
              'NO_OPEN_CLOSE_TRAJECTORY_INCREMENT_FIXED100_EXPLORATION_ONLY',
          }
          assert result['source']['source_rows'] == 1000
          assert result['source']['market_complete_rows'] >= 100
          assert result['source']['external_collection'] == 0
          assert result['source']['provider_requests'] == 0

          hard = result['hard_limits']
          assert hard['formal_weight'] == 0
          assert hard['formal_promotion_allowed'] is False
          assert hard['independent_confirmation_claim_allowed'] is False
          assert hard['current_match_probability_allowed'] is False
          assert hard['current_match_direction_allowed'] is False
          assert hard['formal_unified_matrix_allowed'] is False
          assert hard['formal_exact_score_allowed'] is False
          assert hard['ev_allowed'] is False
          assert hard['provider_requests'] == 0
          assert hard['external_collection'] == 0
          assert hard['CURRENT_mutation'] == 0
          assert hard['formal_model_data_config_mutation'] == 0
          assert hard['main_mutation'] == 0

          if result['status'].startswith('STOP_'):
              assert result['sample']['score_labels_parsed'] == 0
              assert {path.name for path in root.iterdir()} == {
                  'status.json', 'manifest.json'
              }
          else:
              sample = result['sample']
              assert sample['rows'] == 100
              assert sample['prior_overlap_rows'] == 0
              assert sample['selection_uses_score_labels'] is False
              assert sample['selection_frozen_before_score_label_parsing'] is True
              assert sample['no_resampling_after_result'] is True

              expected = {
                  'market', 'opening', 'close_matrix',
                  'x1_mom_0_25', 'matrix_mom_0_25',
                  'x1_mom_0_5', 'matrix_mom_0_5',
                  'x1_mom_1_0', 'matrix_mom_1_0',
              }
              assert set(result['metrics']) == expected
              assert all(value['rows'] == 100 for value in result['metrics'].values())
              audit = result['coordination_audit']
              assert audit['all_snapshot_projections_converged'] is True
              assert audit['max_probability_sum_error'] <= 1e-12
              assert audit['max_market_partition_residual'] <= 1e-11
              architecture = result['architecture']
              assert architecture['opening_to_closing_proxy'] is True
              assert architecture['original_quote_timestamps_available'] is False
              assert architecture['manual_draw_offset_used'] is False
              assert architecture['manual_draw_quota_used'] is False
              assert {path.name for path in root.iterdir()} == {
                  'status.json', 'candidate_summary.csv',
                  'fixed100_predictions.csv', 'trajectory_field_audit.csv',
                  'manifest.json',
              }

          print(json.dumps({
              'status': result['status'],
              'availability': result.get('field_audit', {}).get('availability'),
              'sample': result.get('sample'),
              'metrics': result.get('metrics'),
              'draw_auc': result.get('post_result_draw_auc_diagnostic'),
              'promising_candidates': result.get('promising_candidates'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Confirm isolated research diff
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          base = '6a80dc027accdd4ece29a17df5f835d88dfe607b'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...HEAD'],
              text=True,
          ).splitlines())
          expected = {
              '.github/workflows/football-v511-fixed100-market-trajectory-r37.yml',
              'football-data/config/v511_fixed100_market_trajectory_r37.json',
              'football-data/validation/evaluate_v511_fixed100_market_trajectory_r37.py',
          }
          assert changed == expected, (changed, expected)
          print({'changed': sorted(changed), 'formal_asset_changes': 0})
          PY

      - name: Upload fixed100 trajectory evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-v511-fixed100-market-trajectory-r37-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: r37-output/
          if-no-files-found: error
          retention-days: 30
