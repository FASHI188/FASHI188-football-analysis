name: Football V6.50.5 Runtime Truth One-Shot Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-v6505-runtime-truth-sync-once.yml"

permissions:
  contents: write

concurrency:
  group: football-v6505-runtime-truth-sync-once
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and synchronize F06 runtime truth
        run: |
          python -m py_compile football-data/validation/v6_sync_f06_challenge_truth_v6505.py
          python football-data/validation/v6_sync_f06_challenge_truth_v6505.py
      - name: Persist only unique runtime truth
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_42_issue_remediation_v6489_status.json \
            --message-prefix "audit(football): persist V6.50.5 runtime truth r9"
      - name: Hard receipt guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/v6_42_issue_remediation_v6489_status.json').read_text(encoding='utf-8'))
          a=x.get('current_forward_acquisition') or {}
          if x.get('schema_version')!='V6.50.5-42-issue-runtime-truth-registry-r9': raise SystemExit('r9 missing')
          if a.get('v6505_joint_prediction_count')!=31: raise SystemExit('V6505 count mismatch')
          if (x.get('summary') or {})!={'PASS':36,'PARTIAL':4,'FORWARD_GATED':2,'EXTERNAL_DATA_GAP':0,'TODO':0,'BLOCKED':0}: raise SystemExit('status composition drift')
          if x.get('formal_probability_change') is not False or x.get('formal_weight_change') is not False: raise SystemExit('formal mutation forbidden')
          print(json.dumps({'schema':x.get('schema_version'),'v6503':a.get('v6503_ou_kl_prediction_count'),'v6505':a.get('v6505_joint_prediction_count'),'score_unique':a.get('v6505_score_top1_unique'),'one_one_rate':a.get('v6505_one_one_top1_rate')},ensure_ascii=False))
          PY

# One-shot engineering materialization only. Delete after the r9 receipt is verified.
