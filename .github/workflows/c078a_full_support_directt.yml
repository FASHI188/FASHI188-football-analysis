name: C078-A Full-Support Direct-T NB2 Development

on:
  push:
    branches: [research/c078a-full-support-direct-t-prereg-20260820]
    paths:
      - research/C078A_FULL_SUPPORT_DIRECTT_CONTRACT.md
      - research/C078A_IMPLEMENTATION_SPEC.md
      - research/c078a_full_support_directt.py
      - research/test_c078a_full_support_units.py
      - .github/workflows/c078a_full_support_directt.yml

permissions:
  contents: read

concurrency:
  group: c078a-full-support-directt-development
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install frozen scientific runtime
        run: python -m pip install numpy==2.2.6 pandas==2.3.2 scipy==1.16.1 scikit-learn==1.7.1

      - name: Clone pinned already-open C074-E development source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/nm2890/football-data.git "$RUNNER_TEMP/c078a_source"
          git -C "$RUNNER_TEMP/c078a_source" checkout 279978313f9c16a210fa80e8986fa22f0f866fba
          test "$(git -C "$RUNNER_TEMP/c078a_source" rev-parse HEAD)" = "279978313f9c16a210fa80e8986fa22f0f866fba"

      - name: Run frozen numerical and PIT unit tests
        run: |
          PYTHONPATH=research python research/test_c078a_full_support_units.py | tee "$RUNNER_TEMP/c078a_unit_tests.json"

      - name: Run one frozen C078-A development comparison
        run: |
          mkdir -p "$RUNNER_TEMP/c078a_result"
          PYTHONPATH=research python research/c078a_full_support_directt.py \
            --source-root "$RUNNER_TEMP/c078a_source" \
            --out-dir "$RUNNER_TEMP/c078a_result"

      - name: Enforce contract identity and terminal logic
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          s=json.loads((temp/'c078a_result'/'summary.json').read_text())
          u=json.loads((temp/'c078a_unit_tests.json').read_text())
          assert s['schema_version']=='C078A_FULL_SUPPORT_DIRECTT_NB2_V1'
          assert s['status'] in {'FULL_SUPPORT_DIRECTT_DEVELOPMENT_PASS','FAIL_PARK'}
          assert s['source_revision']=='279978313f9c16a210fa80e8986fa22f0f866fba'
          assert s['pooled_exact']['n']==13329, s['pooled_exact']['n']
          assert s['feature_count']==13
          assert len(s['folds'])==5
          assert [x['test_season'] for x in s['folds']]==['2019-2020','2020-2021','2021-2022','2022-2023','2023-2024']
          # Reconstructing the frozen C074-E categorical comparators on the same row identities is an implementation anchor.
          assert abs(s['collapsed8']['categorical_scorehistory']['logloss']-1.8648259044) < 5e-6, s['collapsed8']['categorical_scorehistory']
          assert abs(s['collapsed8']['categorical_movement']['logloss']-1.8560610997) < 5e-6, s['collapsed8']['categorical_movement']
          assert s['formal_weight']==0
          assert s['C077B_labels_read'] is False
          assert s['C076D_4567_opened'] is False
          assert s['C071_reserve52180_opened'] is False
          assert s['C070F1597_opened'] is False
          assert s['A05_or_protected_opened'] is False
          assert s['exact_tail_formally_promoted'] is False
          assert s['unified_matrix_generated'] is False
          assert s['CURRENT_change'] is False
          assert s['no_rescue_after_view'] is True
          if s['status']=='FULL_SUPPORT_DIRECTT_DEVELOPMENT_PASS':
              assert all(s['gates'].values()), s['gates']
          else:
              assert not all(s['gates'].values()), s['gates']
          assert u['schema_version']=='C078A_FULL_SUPPORT_UNIT_TESTS_V1'
          assert u['status']=='PASS'
          assert all(v=='PASS' for v in u['tests'].values())
          assert u['C077B_labels_read'] is False
          assert u['sealed_pool_opened'] is False
          print(json.dumps({'scientific':s,'unit_tests':u},ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c078a-full-support-directt-development
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/c078a_result/summary.json
            ${{ runner.temp }}/c078a_result/row_metrics.csv
            ${{ runner.temp }}/c078a_unit_tests.json
            research/C078A_FULL_SUPPORT_DIRECTT_CONTRACT.md
            research/C078A_IMPLEMENTATION_SPEC.md
            research/c078a_full_support_directt.py
            research/test_c078a_full_support_units.py
