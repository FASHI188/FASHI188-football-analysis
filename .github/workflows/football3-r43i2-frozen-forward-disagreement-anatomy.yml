name: football3 R43I2 frozen forward disagreement anatomy

on:
  push:
    branches:
      - football3/r43i0-market-forward-settlement-20260828
    paths:
      - football-data/experiments/r43i2_frozen_forward_disagreement_anatomy/**
      - .github/workflows/football3-r43i2-frozen-forward-disagreement-anatomy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43i2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43i0-market-forward-settlement-20260828
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile R43I2
        run: python -m py_compile football-data/experiments/r43i2_frozen_forward_disagreement_anatomy/run_r43i2.py
      - name: Run R43I2 frozen disagreement anatomy
        run: python football-data/experiments/r43i2_frozen_forward_disagreement_anatomy/run_r43i2.py run
      - name: Verify R43I2 diagnostic contract
        run: python football-data/experiments/r43i2_frozen_forward_disagreement_anatomy/run_r43i2.py verify
      - name: Persist R43I2 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add football-data/experiments/r43i2_frozen_forward_disagreement_anatomy/results/summary_r43i2_frozen_forward_disagreement_anatomy.json
          if git diff --cached --quiet; then
            echo 'No evidence delta'
          else
            git commit -m '[r43i2] persist frozen forward disagreement anatomy'
            git push origin HEAD:football3/r43i0-market-forward-settlement-20260828
          fi
      - name: Upload R43I2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43i2-frozen-forward-disagreement-anatomy
          path: football-data/experiments/r43i2_frozen_forward_disagreement_anatomy/results/summary_r43i2_frozen_forward_disagreement_anatomy.json
          if-no-files-found: error
          retention-days: 90
