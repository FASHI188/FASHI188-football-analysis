name: Football R39L Evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39l-evaluation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39l-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lineup-attack-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enforce single first-attempt evaluation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/football-r39l-evaluation.yml/runs?branch=research%2Flineup-attack-quality-r39l&per_page=20" -o /tmp/runs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          cur=int(os.environ['GITHUB_RUN_ID']);runs=json.loads(Path('/tmp/runs.json').read_text()).get('workflow_runs',[])
          prior=[int(r['id']) for r in runs if int(r['id'])!=cur and r.get('head_branch')=='research/lineup-attack-quality-r39l']
          assert not prior,f'prior R39L evaluation run(s) exist: {prior}'
          print('PASS_R39L_UNIQUE_FIRST_EVALUATION_RUN')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'

      - name: Verify exact frozen scientific blobs and zero-label preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_r39l/preregistration_r39l.json)" = "7c8806e760e2ccdc6a860e557f235aca33a2b623"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_r39l/source_registration_r39l.json)" = "769b198142e473f9de9b501b46ea94642d8f11f1"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_r39l/evaluator_contract_r39l.json)" = "cb4723c8edcecdb27bde028550c988e9976245b3"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_r39l/audit_lineup_attack_features_r39l.py)" = "b588cdb26661551b7904522340595e51d76beff1"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_r39l/evaluate_lineup_attack_r39l.py)" = "4d4760f0a365124f55a0688432fc36ca91416a43"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31352929452" -o /tmp/preflight-run.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31352929452/artifacts" -o /tmp/preflight-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/preflight-run.json').read_text());a=json.loads(Path('/tmp/preflight-artifacts.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='3a7ec31a7673a161a8695431d4dbc00ca27b67e0'
          arts=a.get('artifacts',[]);assert len(arts)==1
          x=arts[0];assert x['id']==9049579064
          assert x.get('digest')=='sha256:4b7a1366aa0f2959154446af6a793aaf4b8759ffb7f02a4e47a31ae836cbf2ee'
          print('PASS_R39L_AUTHORIZED_BY_ZERO_LABEL_PREFLIGHT_31352929452')
          PY
          python football-data/research/lineup_attack_r39l/evaluate_lineup_attack_r39l.py --self-test

      - name: Download and sanitize Transfermarkt feature sources
        run: |
          set -euo pipefail
          rm -rf r39l-tm r39l-market r39l-raw r39l-output player_scores.zip /tmp/r39l-*.csv
          mkdir -p r39l-tm r39l-market r39l-raw r39l-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39l-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39l-lineups.csv
          unzip -p player_scores.zip appearances.csv > /tmp/r39l-appearances.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39l-games.csv','r39l-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39l-lineups.csv','r39l-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39l-appearances.csv','r39l-tm/appearances_prior.csv',['appearance_id','game_id','player_id','player_club_id','date','competition_id','goals','assists','minutes_played'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing:raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39l-games.csv /tmp/r39l-lineups.csv /tmp/r39l-appearances.csv player_scores.zip

      - name: Download Football-Data raw labels and isolate market-only inputs
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="r39l-raw/${season}_${div}.csv";out="r39l-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing:raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
            done
          done

      - name: Execute frozen R39L chronological evaluation
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_r39l/evaluate_lineup_attack_r39l.py \
            --prereg football-data/research/lineup_attack_r39l/preregistration_r39l.json \
            --contract football-data/research/lineup_attack_r39l/evaluator_contract_r39l.json \
            --source-registration football-data/research/lineup_attack_r39l/source_registration_r39l.json \
            --r39i-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39l-market --raw-dir r39l-raw \
            --games r39l-tm/games_identity.csv --lineups r39l-tm/lineups_identity.csv \
            --appearances r39l-tm/appearances_prior.csv --out-dir r39l-output

      - name: Verify terminal label boundary and result integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39l-output/r39l_result.json').read_text())
          ff=json.loads(Path('r39l-output/feature_freeze_receipt_r39l.json').read_text())
          assert ff['feature_freeze_completed'] is True
          assert ff['target_labels_accessed_before_feature_freeze']==0
          assert ff['preholdout_rows']==8161 and ff['holdout_pool_rows']==1273 and ff['fixed100_rows']==100
          assert ff['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          allowed={
            'STOP_R39L_BEFORE_POLICY_AND_HOLDOUT_LINEUP_ATTACK_NO_VALIDATION_INCREMENT',
            'STOP_R39L_BEFORE_HOLDOUT_LINEUP_ATTACK_NO_POLICY_INCREMENT',
            'PASS_R39L_LINEUP_ATTACK_QUALITY_FIXED100_EXPLORATORY_ONLY',
            'NO_R39L_LINEUP_ATTACK_QUALITY_INCREMENT_FIXED100'}
          assert r['status'] in allowed
          fr=json.loads(Path('r39l-output/final_freeze_receipt_r39l.json').read_text())
          if r['status'].startswith('STOP_R39L_BEFORE_'):
              assert r['holdout_labels_accessed']==0
              assert fr['final_freeze_completed'] is False
              assert fr['holdout_labels_accessed_before_freeze']==0
          else:
              assert r['holdout_labels_accessed']==100
              assert fr['final_freeze_completed'] is True
              assert fr['holdout_labels_accessed_before_freeze']==0
          print(json.dumps({
            'status':r['status'],
            'selected_l2':r.get('selected_l2'),
            'split_counts':r.get('split_counts'),
            'validation':r.get('validation'),
            'policy':r.get('policy'),
            'holdout':r.get('holdout'),
            'holdout_labels_accessed':r['holdout_labels_accessed']},indent=2))
          PY

      - name: Delete all downloaded source inputs before artifact
        run: rm -rf r39l-tm r39l-market r39l-raw

      - uses: actions/upload-artifact@v4
        with:
          name: football-r39l-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39l-output/
          if-no-files-found: error
          retention-days: 30
