name: football3-nova-n1-formal-replay-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime introspection only
        run: |
          python governance/football3/nova_n1_formal_replay_probe_v1.py > n1_probe.json
          cat n1_probe.json
      - name: Upload probe receipt
        uses: actions/upload-artifact@v4
        with:
          name: football3-nova-n1-formal-replay-probe-${{ github.sha }}-${{ github.run_id }}
          path: n1_probe.json
          if-no-files-found: error
