name: Football C075-G 2025-26 Fresh13 Presence Gate

on:
  push:
    branches:
      - research/c075g-2526-fresh13-presence-audit-20260819
    paths:
      - research/c075g_2526_fresh13_presence_contract.json
      - research/audit_c075g_2526_fresh13_presence.py
      - .github/workflows/c075g_2526_fresh13_presence.yml
  pull_request:
    paths:
      - research/c075g_2526_fresh13_presence_contract.json
      - research/audit_c075g_2526_fresh13_presence.py
      - .github/workflows/c075g_2526_fresh13_presence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c075g-fresh13-presence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fresh13-presence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone pinned external source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/openfootball/football.json.git external-openfootball
          git -C external-openfootball checkout ea767ac28cf9a2d737bb3e4ce65aa4b1f4ac9361
          test "$(git -C external-openfootball rev-parse HEAD)" = "ea767ac28cf9a2d737bb3e4ce65aa4b1f4ac9361"

      - name: Run score-presence-only audit
        run: |
          mkdir -p artifacts/c075g_presence
          python research/audit_c075g_2526_fresh13_presence.py \
            --source-root external-openfootball \
            --out-dir artifacts/c075g_presence

      - name: Enforce zero-value boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/c075g_presence/summary.json').read_text())
          assert s['schema_version']=='C075G_2526_FRESH13_PRESENCE_AUDIT_V1'
          assert s['status']=='PASS_ZERO_VALUE_FRESH_CONFIRMATION_SOURCE_GATE'
          assert s['fixed_file_count']==13
          assert s['identity_count']>=3500
          assert s['duplicate_identity_count']==0
          assert s['score_ft_presence_fraction']>=.98
          assert s['minimum_per_file_presence_fraction']>=.95
          l=s['label_boundary']
          for k in ['score_numbers_captured','score_numbers_converted','score_numbers_stored','score_numbers_hashed','goal_totals_computed','tail_membership_computed','model_fit']:
              assert l[k] is False
          p=s['protected_boundaries']
          assert p['C075C_consumed_tail_labels_reused'] is False
          assert p['C075E_consumed_tail_labels_reused'] is False
          assert p['C071_reserve_52180_opened'] is False
          assert p['C070F_confirmation1597_opened'] is False
          assert p['A05_opened'] is False
          assert p['protected_opened'] is False
          assert p['unified_matrix_generated'] is False
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload C075-G source evidence
        uses: actions/upload-artifact@v4
        with:
          name: c075g-2526-fresh13-presence-gate
          retention-days: 30
          path: |
            artifacts/c075g_presence/summary.json
            artifacts/c075g_presence/identity_manifest.jsonl
            research/c075g_2526_fresh13_presence_contract.json
