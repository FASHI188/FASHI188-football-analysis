name: football3 R43E0 coach fingerprint OOS

on:
  push:
    branches:
      - football3/r43e0-coach-fingerprint-oos
    paths:
      - 'football-data/experiments/r43e0_coach_fingerprint_oos/**'
      - '.github/workflows/football3-r43e0-coach-fingerprint-oos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43e0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43e0-coach-fingerprint-oos
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore R9b 20k source spine
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43E0 coach fingerprint
        run: python football-data/experiments/r43e0_coach_fingerprint_oos/run_r43e0.py run
      - name: Verify R43E0 contract
        run: python football-data/experiments/r43e0_coach_fingerprint_oos/run_r43e0.py verify
      - name: Persist R43E0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43e0_coach_fingerprint_oos/results/summary_r43e0_coach_fingerprint.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43E0 coach fingerprint OOS'
            git fetch origin football3/r43e0-coach-fingerprint-oos
            git rebase origin/football3/r43e0-coach-fingerprint-oos
            git push origin HEAD:football3/r43e0-coach-fingerprint-oos
          fi
      - name: Upload R43E0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43e0-coach-fingerprint-oos
          path: football-data/experiments/r43e0_coach_fingerprint_oos/results/summary_r43e0_coach_fingerprint.json
          if-no-files-found: error
          retention-days: 90
