name: football3 Batch-003 100-match lock
on:
  push:
    branches: [football3/batch003-hierarchical-draw]
    paths:
      - football-data/experiments/batch003_100match_lock/lock_batch003.py
      - .github/workflows/football3-batch003-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch003-hierarchical-draw
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock Batch-003 safe cohort
        run: python football-data/experiments/batch003_100match_lock/lock_batch003.py run
      - name: Verify Batch-003 lock
        run: python football-data/experiments/batch003_100match_lock/lock_batch003.py verify
      - name: Persist Batch-003 lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch003_100match_lock/results/batch003_locked_100.json
          git commit -m '[locked] football3 Batch-003 fresh 100-match cohort' || true
          git fetch origin football3/batch003-hierarchical-draw
          git rebase origin/football3/batch003-hierarchical-draw
          git push origin HEAD:football3/batch003-hierarchical-draw
      - name: Upload Batch-003 lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch003-100match-lock
          path: football-data/experiments/batch003_100match_lock/results/batch003_locked_100.json
          if-no-files-found: error
          retention-days: 90
