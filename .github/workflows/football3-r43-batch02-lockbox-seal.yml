name: football3 R43 Batch02 lockbox seal

on:
  push:
    branches:
      - football3/r43u1-pristine-forward-confirmation
    paths:
      - .github/workflows/football3-r43-batch02-lockbox-seal.yml
      - football-data/experiments/r43_batch02_lockbox/seal_verify_lockbox.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-batch02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43u1-pristine-forward-confirmation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify seal dependencies
        run: |
          test -f football-data/forward/r43_batch01_pristine_lockbox.json
          test -f football-data/forward/r43u1_pristine_forward_events.json
          test -f football-data/forward/r43y0_draw_calibration_forward_events.json
          test -f football-data/forward/v6_market_first_events_v651.json
          python -m py_compile football-data/experiments/r43_batch02_lockbox/seal_verify_lockbox.py
      - name: Seal Batch02 pre-settlement prefixes
        run: python football-data/experiments/r43_batch02_lockbox/seal_verify_lockbox.py seal
      - name: Verify Batch02 lockbox contract
        run: python football-data/experiments/r43_batch02_lockbox/seal_verify_lockbox.py verify
      - name: Persist Batch02 lockbox
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/forward/r43_batch02_pristine_lockbox.json
          git add football-data/experiments/r43_batch02_lockbox/results/summary_r43_batch02_lockbox_verify.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43 Batch02 pristine lockbox'
            git fetch origin football3/r43u1-pristine-forward-confirmation
            git rebase origin/football3/r43u1-pristine-forward-confirmation
            git push origin HEAD:football3/r43u1-pristine-forward-confirmation
          fi
      - name: Upload Batch02 lockbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43-batch02-lockbox
          path: |
            football-data/forward/r43_batch02_pristine_lockbox.json
            football-data/experiments/r43_batch02_lockbox/results/summary_r43_batch02_lockbox_verify.json
          if-no-files-found: error
          retention-days: 90
