name: Football3 GPT Auto Dispatch Receiver V3

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  default-branch-registration-safe-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit registration-only no-op receipt
        run: |
          set -euo pipefail
          echo 'DEFAULT_BRANCH_RECEIVER_REGISTRATION=REGISTERED'
          echo 'DEFAULT_BRANCH_RECEIVER_EXECUTION=SKIP'
          echo 'DEFAULT_BRANCH_RECEIVER_PRODUCTION_SIDE_EFFECTS=false'
          echo 'DEFAULT_BRANCH_RECEIVER_CARRIER_CODE_EXECUTED=false'
          echo 'DEFAULT_BRANCH_RECEIVER_FORMAL_DISPATCH=false'
