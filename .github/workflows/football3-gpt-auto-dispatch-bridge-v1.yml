name: Football3 GPT Auto Dispatch Bridge V2 Candidate Security

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: football3-gpt-auto-dispatch-bridge-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate-contract-security:
    if: ${{ github.event.pull_request.number != 341 }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile permanent bridge and authoritative request contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            football-data/formal_gpt_gateway_v1/request_contract_v1.py \
            football-data/formal_gpt_gateway_v1/auto_dispatch_bridge_v1.py \
            football-data/formal_gpt_gateway_v1/test_auto_dispatch_bridge_v1.py

      - name: Permanent bridge contract and security tests
        run: |
          set -euo pipefail
          python3 football-data/formal_gpt_gateway_v1/test_auto_dispatch_bridge_v1.py

      - name: Read-only live PR 341 contract and changed-file audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources
          PYTHONPATH="$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1:$PWD/football-data" \
            python3 football-data/formal_gpt_gateway_v1/auto_dispatch_bridge_v1.py audit-live \
              --repo "$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" \
              --audit-out .runtime_sources/auto_dispatch_bridge_candidate_audit.json

      - name: Prove candidate workflow has no privileged carrier execution path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/football3-gpt-auto-dispatch-bridge-v1.yml')
          text=p.read_text(encoding='utf-8')
          assert '\n  pull_request_target:' not in text
          assert '\n      actions: write' not in text
          assert 'github.event.pull_request.number != 341' in text
          print('TRUSTED_AUTO_DISPATCH_TRIGGER_UNAVAILABLE')
          print('CANDIDATE_CARRIER_CODE_EXECUTION_PATH_ABSENT')
          PY

      - name: Upload read-only bridge candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: football3-auto-dispatch-bridge-candidate-${{ github.run_id }}
          path: .runtime_sources/auto_dispatch_bridge_candidate_audit.json
          if-no-files-found: error
          retention-days: 90
