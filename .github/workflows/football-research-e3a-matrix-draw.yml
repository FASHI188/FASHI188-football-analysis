name: Football Research E3a Matrix Draw Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "research/big5-high-completeness-b100"
    types: [opened, synchronize, reopened, edited]
    paths:
      - "football-data/research/matrix_draw_gate_e3a.py"
      - ".github/workflows/football-research-e3a-matrix-draw.yml"
  push:
    branches:
      - "research/matrix-draw-gate-e3a"
    paths:
      - "football-data/research/matrix_draw_gate_e3a.py"
      - ".github/workflows/football-research-e3a-matrix-draw.yml"

permissions:
  contents: read

concurrency:
  group: football-research-e3a-matrix-draw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-matrix-draw-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact research HEAD
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile football-data/research/matrix_draw_gate_e3a.py

      - name: Run research-only E3a experiment
        env:
          PYTHONPATH: football-data/engine:football-data/validation:football-data/research
          PYTHONUTF8: "1"
        run: |
          python football-data/research/matrix_draw_gate_e3a.py --print-summary

      - name: Upload E3a report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-e3a-matrix-draw-${{ github.sha }}
          path: artifacts/research/matrix_draw_gate_e3a/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected formal assets were not changed
        if: always()
        run: |
          git diff --exit-code -- football-data/models football-data/config football-data/processed football-data/raw
          git diff --exit-code
