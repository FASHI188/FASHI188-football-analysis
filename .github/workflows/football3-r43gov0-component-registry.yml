name: football3 R43GOV0 M5A component registry governance

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/legacy_r43_registry.py
      - football-data/tests/test_legacy_r43_registry.py
      - .github/workflows/football3-r43gov0-component-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-registry-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Compile M5A registry
        run: |
          python -m py_compile football-data/components/legacy_r43_registry.py
          python -m py_compile football-data/tests/test_legacy_r43_registry.py
      - name: Run M5A registry tests
        run: python -m unittest discover -s football-data/tests -p 'test_legacy_r43_registry.py' -v
      - name: Write M5A gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5a_component_registry_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5a-gate-v1",
            "status": "PASS_WITH_R43Y_PROVENANCE_HOLD",
            "scope": "research_governance_only",
            "registered_components": ["R43Q", "R43R", "R43T", "R43U", "R43Y"],
            "all_components_enabled_by_default": false,
            "all_legacy_components_disabled": true,
            "r43q_architecture_gate_passed": false,
            "r43r_architecture_gate_passed": false,
            "r43r_native_output": "1x2_probabilities",
            "r43t_architecture_gate_passed": false,
            "r43u_architecture_gate_passed": true,
            "r43u_full_volume_53pct_met": false,
            "r43y_source_resolved": false,
            "r43y_algorithm_fabricated": false,
            "probable_lineup_numeric_effect_enabled": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M5B_exact_migration_of_resolved_native_score_matrix_components_with_compatibility_tests_only"
          }
          JSON
      - name: Upload M5A registry gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5a-component-registry-gate
          path: football-data/governance/r43gov0/results/m5a_component_registry_gate.json
          if-no-files-found: error
          retention-days: 90
