name: Football C071 Opportunity Source Audit

on:
  push:
    branches:
      - research/c071-opportunity-source-audit-20260818
    paths:
      - football-data/research/c071_opportunity_source_audit_contract.json
      - football-data/research/audit_c071_opportunity_source.py
      - .github/workflows/football-c071-opportunity-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c071-opportunity-source-audit
  cancel-in-progress: false

jobs:
  zero-label-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install frozen audit runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 pyarrow==21.0.0

      - name: Download pinned opportunity source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c071_source"
          REV="f0cbe86bee3f28cc4b803f735a5287968741c471"
          BASE="https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/$REV"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c071_source/fixtures.parquet" "$BASE/fixtures.parquet?download=true"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c071_source/match_stats.parquet" "$BASE/match_stats.parquet?download=true"
          test -s "$RUNNER_TEMP/c071_source/fixtures.parquet"
          test -s "$RUNNER_TEMP/c071_source/match_stats.parquet"
          sha256sum "$RUNNER_TEMP/c071_source/fixtures.parquet" "$RUNNER_TEMP/c071_source/match_stats.parquet"

      - name: Audit PIT opportunity coverage without target labels
        run: |
          mkdir -p "$RUNNER_TEMP/c071_out"
          python football-data/research/audit_c071_opportunity_source.py \
            --fixtures "$RUNNER_TEMP/c071_source/fixtures.parquet" \
            --stats "$RUNNER_TEMP/c071_source/match_stats.parquet" \
            --out-dir "$RUNNER_TEMP/c071_out"

      - name: Enforce zero-label and governance boundary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c071_out'/'summary.json').read_text())
          assert s['status']=='C071_SOURCE_AUDIT_COMPLETE'
          z=s['zero_label_boundary']
          assert z['forbidden_outcome_columns_read']==[]
          assert z['target_outcomes_read'] is False
          assert z['model_fit'] is False and z['scoring'] is False and z['tuning'] is False
          assert s['pit']['known_at_le_kickoff']==0
          assert s['boundaries']['C070F_confirmation1597_opened'] is False
          assert s['boundaries']['A05_opened'] is False
          assert s['boundaries']['protected_opened'] is False
          assert s['boundaries']['formal_weight']==0
          print(json.dumps(s, indent=2))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: c071-opportunity-source-audit
          retention-days: 30
          path: |
            ${{ runner.temp }}/c071_out/summary.json
            ${{ runner.temp }}/c071_out/league_year_core_coverage.csv
            ${{ runner.temp }}/c071_out/eligible_identity_threshold8.csv
            football-data/research/c071_opportunity_source_audit_contract.json
