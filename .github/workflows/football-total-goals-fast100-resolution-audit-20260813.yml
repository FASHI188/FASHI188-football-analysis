name: football-total-goals-fast100-resolution-audit-20260813

on:
  push:
    branches:
      - research/total-goals-fast100-replay-20260813
    paths:
      - football-data/validation/v6_total_goals_fast100_resolution_audit_20260813.py
      - .github/workflows/football-total-goals-fast100-resolution-audit-20260813.yml

permissions:
  contents: read

jobs:
  resolution-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run viewed Fast100 resolution audit
        run: python football-data/validation/v6_total_goals_fast100_resolution_audit_20260813.py
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: total-goals-fast100-resolution-audit-20260813
          path: football-data/manifests/v6_total_goals_fast100_resolution_audit_20260813.json
          if-no-files-found: error
