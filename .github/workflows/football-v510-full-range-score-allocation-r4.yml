name: Football V5.1 Full-Range Score Allocation R4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "football-data/config/v510_full_range_score_allocation_r4.json"
      - "football-data/validation/evaluate_v510_full_range_score_allocation_r4.py"
      - "football-data/validation/evaluate_v510_historical_tail_mapping_r1.py"
      - "football-data/validation/v510_historical_structure_features_r1.py"
      - "football-data/validation/v510_historical_structure_model_r1.py"
      - "football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py"
      - "football-data/processed/**/*.csv"
      - ".github/workflows/football-v510-full-range-score-allocation-r4.yml"

permissions:
  contents: read

concurrency:
  group: football-v510-full-range-score-allocation-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile R4 evaluator
        run: python -m py_compile football-data/validation/evaluate_v510_full_range_score_allocation_r4.py
      - name: Run R4 self-test
        run: python football-data/validation/evaluate_v510_full_range_score_allocation_r4.py --self-test
      - name: Materialize audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Evaluate R4 full-range score allocation
        run: python football-data/validation/evaluate_v510_full_range_score_allocation_r4.py
      - name: Show compact receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v510_full_range_score_allocation_r4_status.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
            'status':x.get('status'),
            'evidence_class':x.get('evidence_class'),
            'data_identity':x.get('data_identity'),
            'pooled':x.get('pooled'),
            'audits':x.get('audits'),
            'stability':x.get('stability'),
            'ruling':x.get('ruling'),
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload R4 receipts
        uses: actions/upload-artifact@v4
        with:
          name: v510-full-range-score-allocation-r4
          path: |
            football-data/manifests/v510_full_range_score_allocation_r4_status.json
            football-data/manifests/v510_full_range_score_allocation_r4_stability.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no repository persistence
        run: |
          git status --short
          test -z "$(git diff --cached --name-only)"
