name: football3 Historical Existing Source Marginal Exhaustion Close V1

on:
  push:
    branches: ['football3/historical-existing-source-marginal-exhaustion-close-v1']
    paths:
      - '.github/workflows/football3-historical-existing-source-marginal-exhaustion-close-v1.yml'
      - 'football-data/research/historical_existing_source_marginal_exhaustion_close_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PARENT_HEAD: 9f4d638b5b2f0367fcb5cdc98683d6b3f33123dd
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  B_HEAD: 9cb97764de1250fd08c6d0880559192e66352ce3
  CANDIDATE_ARTIFACT_ID: '9971645936'
  CANDIDATE_ARTIFACT_DIGEST: sha256:5a485ce6985c698a655fc42633a6d705d5ccdb0bd4861033d2e649ed23a828ec

jobs:
  seal-existing-source-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact lineage and frozen-boundary guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-existing-source-marginal-exhaustion-close-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/stage6-pre-b-preshot-deep-ppda-v1 | cut -f1)" = "$B_HEAD"
          changed="$(git diff --name-only "$PARENT_HEAD...HEAD")"
          if printf '%s\n' "$changed" | grep -E 'CURRENT|production_pointer|formal_enablement|stage6_pre_b_deep_ppda|stage6_pre_b_prospective|historical_fusion_v3_1_1_joint_score'; then
            echo 'forbidden frozen-path mutation' >&2; exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/football3-historical-existing-source-marginal-exhaustion-close-v1.yml|football-data/research/historical_existing_source_marginal_exhaustion_close_v1/*) ;;
              '') ;;
              *) echo "unexpected path: $p" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify closeout contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='football-data/research/historical_existing_source_marginal_exhaustion_close_v1/HISTORICAL_EXISTING_SOURCE_CLOSEOUT.json'
          x=json.load(open(p))
          assert x['status']=='HISTORICAL_EXISTING_SOURCE_MARGINAL_EXHAUSTION_CLOSE'
          assert x['anchor']['parent_head']=='9f4d638b5b2f0367fcb5cdc98683d6b3f33123dd'
          assert x['anchor']['parent_run']==33973581675
          assert x['anchor']['parent_artifact']==9971645936
          assert x['latest_mechanism']['development_result']=='XGBUILDUP_RESPONSIBILITY_CANDIDATE_DEVELOPMENT_FAIL_CLOSE_NO_RETUNE'
          assert x['latest_mechanism']['action']=='CLOSED_NO_RETUNE'
          assert x['conclusion']['existing_frozen_understat_and_current_historical_sources']=='MARGINAL_INFORMATION_EXHAUSTED_FOR_HIGH_VALUE_STRICT_PIT_CANDIDATES'
          assert x['conclusion']['do_not_continue_by_field_renaming'] is True
          assert x['conclusion']['do_not_run_xA_keypass_xGChain_micro_variants'] is True
          assert x['conclusion']['next_research_class']=='GENUINELY_NEW_INFORMATION_SOURCE_ONLY'
          assert x['frozen_boundaries']['historical_confirmation_2023']=='LOCKED_NOT_READ'
          assert x['frozen_boundaries']['prospective_1335']=='FORBIDDEN_NOT_TOUCHED'
          assert x['frozen_boundaries']['CURRENT_change'] is False
          PY

      - name: Download and verify failed candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          test "$got" = "$CANDIDATE_ARTIFACT_DIGEST"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" -o /tmp/candidate.zip
          test "sha256:$(sha256sum /tmp/candidate.zip | awk '{print $1}')" = "$CANDIDATE_ARTIFACT_DIGEST"
          rm -rf _candidate && mkdir _candidate
          unzip -q /tmp/candidate.zip -d _candidate
          python - <<'PY'
          import json, math
          m=json.load(open('_candidate/MANIFEST.json'))
          r=json.load(open('_candidate/evidence/xgbuildup_responsibility_candidate_result.json'))
          assert m['github_sha']=='9f4d638b5b2f0367fcb5cdc98683d6b3f33123dd'
          assert m['status']=='XGBUILDUP_RESPONSIBILITY_CANDIDATE_DEVELOPMENT_FAIL_CLOSE_NO_RETUNE'
          assert m['scientific_pass'] is False
          assert m['historical_confirmation_2023_labels_opened'] is False
          assert m['prospective_1335_data_touched'] is False
          assert r['scientific_pass'] is False
          assert r['development_n']==5478 and r['rolling_oos_n']==3652
          assert r['historical_confirmation_2023_labels_opened'] is False
          assert r['prospective_1335_data_touched'] is False
          d=r['pooled']['deltas']
          expected={'hits':1,'top1_pp':0.027382256297914243,'logloss':0.00007221303998605766,'brier':0.00018453557539188647,'rps':0.00008325987869722828,'exact_score_logloss':0.00007221303998239392,'total_goals_logloss':0.00020823998442520697}
          for k,v in expected.items():
              if isinstance(v,int): assert d[k]==v
              else: assert math.isclose(d[k],v,rel_tol=0,abs_tol=1e-15),(k,d[k],v)
          folds={f['season']:f for f in r['fold_results']}
          assert folds[2021]['deltas']['hits']==-1
          assert folds[2022]['deltas']['hits']==2
          assert folds[2021]['deltas']['draw_logloss']<0
          assert folds[2022]['deltas']['draw_logloss']>0
          PY

      - name: Seal closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{closeout,parent_evidence}
          cp football-data/research/historical_existing_source_marginal_exhaustion_close_v1/HISTORICAL_EXISTING_SOURCE_CLOSEOUT.json _seal/closeout/
          cp _candidate/MANIFEST.json _seal/parent_evidence/CANDIDATE_MANIFEST.json
          cp _candidate/evidence/xgbuildup_responsibility_candidate_result.json _seal/parent_evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal')
          c=json.load(open(root/'closeout/HISTORICAL_EXISTING_SOURCE_CLOSEOUT.json'))
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          m={
            'schema_version':'football3-historical-existing-source-marginal-exhaustion-close-artifact-v1',
            'github_sha':os.environ['GITHUB_SHA'],
            'parent_head':os.environ['PARENT_HEAD'],
            'status':c['status'],
            'scientific_conclusion':c['conclusion']['existing_frozen_understat_and_current_historical_sources'],
            'next_research_class':c['conclusion']['next_research_class'],
            'historical_confirmation_2023_opened':False,
            'prospective_1335_touched':False,
            'formal_model_changed':False,
            'CURRENT_changed':False,
            'files':files
          }
          (root/'MANIFEST.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload sealed closeout
        uses: actions/upload-artifact@v4
        with:
          name: football3-historical-existing-source-marginal-exhaustion-close-${{ github.sha }}
          path: _seal
          if-no-files-found: error
          retention-days: 90
