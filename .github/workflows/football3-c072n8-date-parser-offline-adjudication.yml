name: football3-c072n8-date-parser-offline-adjudication

on:
  pull_request:
    branches:
      - football3/c072n7r1-fiveleague-metadata-engineering-replay-20260819
    paths:
      - 'football-data/research/C072N8_IMPLEMENTATION_CORRECTION_01.json'
      - 'football-data/research/C072N8_IMPLEMENTATION_CORRECTION_02.json'
      - 'football-data/research/adjudicate_c072n8_date_parser_offline.py'
      - '.github/workflows/football3-c072n8-date-parser-offline-adjudication.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Correction contracts guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c1=json.loads(Path('football-data/research/C072N8_IMPLEMENTATION_CORRECTION_01.json').read_text())
          c2=json.loads(Path('football-data/research/C072N8_IMPLEMENTATION_CORRECTION_02.json').read_text())
          assert c1['classification'] == 'POST_RETRIEVAL_DATE_PARSER_ENGINEERING_ERROR'
          assert c1['observed_run_id'] == 32244931845
          assert c1['observed_dataset_sha256'] == 'e9538997e1ec46582e240add8eb37372341a0c75b51e024c8bef0139aa29c082'
          assert 'No source re-fetch or admin-ajax request.' in c1['forbidden_changes']
          assert c2['classification'] == 'OFFLINE_ADJUDICATION_GUARD_ENGINEERING_MISMATCH'
          assert c2['frozen_integrity']['original_run_id'] == 32244931845
          assert c2['new_source_requests_allowed'] == 0
          print('N8 correction contracts: PASS')
          PY
      - name: Download exact frozen N8 artifact from original run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c072n8-frozen
          gh run download 32244931845 \
            --repo FASHI188/FASHI188-football-analysis \
            --name football3-c072n8-multiline-odds-zero-label \
            --dir /tmp/c072n8-frozen
          ls -l /tmp/c072n8-frozen
      - name: Offline date-parser adjudication only
        run: |
          python football-data/research/adjudicate_c072n8_date_parser_offline.py \
            --csv /tmp/c072n8-frozen/c072n8_multiline_odds.csv \
            --summary /tmp/c072n8-frozen/c072n8_zero_label_summary.json \
            --out football-data/research/c072n8_zero_label_corrected_summary.json
      - name: Boundary and correction guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072n8_zero_label_corrected_summary.json').read_text())
          assert x['offline_reaudit_new_footiqo_requests'] == 0
          assert x['dataset_sha256'] == 'e9538997e1ec46582e240add8eb37372341a0c75b51e024c8bef0139aa29c082'
          assert x['ordered_identity_sha256'] == '95ff10827e5097158c2bf20838e317c106d0b53c8ad6088a50fecae99b6ad0f4'
          assert x['retained_rows'] == 18768
          assert x['target_result_columns_requested_or_materialized'] == 0
          assert x['model_fit'] == 0 and x['model_score'] == 0
          assert x['C073_C077_quarantined'] is True
          print('N8 corrected boundaries: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072n8-date-parser-corrected-summary
          path: football-data/research/c072n8_zero_label_corrected_summary.json
          if-no-files-found: error
