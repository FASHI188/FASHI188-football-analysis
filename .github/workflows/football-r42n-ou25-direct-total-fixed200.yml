name: Football R42N OU2.5 Direct-T Fixed200

on:
  pull_request:
    paths:
      - "football-data/config/r42n_ou25_direct_total_fixed200.json"
      - "football-data/validation/evaluate_r42n_ou25_direct_total_fixed200.py"
      - "football-data/validation/evaluate_r41_priority_fixed200_battery.py"
      - "football-data/validation/evaluate_r42m_weak_signal_fusion_direct_total_fixed200.py"
      - "football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py"
      - "football-data/validation/v510_historical_structure_features_r1.py"
      - "football-data/validation/v510_historical_structure_model_r1.py"
      - ".github/workflows/football-r42n-ou25-direct-total-fixed200.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-r42n-ou25-direct-total-fixed200-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/engine:football-data/validation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile frozen R42N path
        run: |
          python -m py_compile \
            football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py \
            football-data/validation/evaluate_r41_priority_fixed200_battery.py \
            football-data/validation/evaluate_r42e_shot_direct_total_crossdomain_fixed200.py \
            football-data/validation/evaluate_r42f_htft_response_direct_total_fixed200.py \
            football-data/validation/evaluate_r42j_all_history_pair_recovery_direct_total_fixed200.py \
            football-data/validation/evaluate_r42m_weak_signal_fusion_direct_total_fixed200.py \
            football-data/validation/evaluate_r42n_ou25_direct_total_fixed200.py \
            football-data/validation/v510_historical_structure_features_r1.py \
            football-data/validation/v510_historical_structure_model_r1.py
      - name: Deterministic self-tests
        run: |
          python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py --self-test
          python football-data/validation/evaluate_r42n_ou25_direct_total_fixed200.py --self-test
      - name: Rebuild exact audited V5.1 historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run frozen R42N coverage gate and fixed200 if authorized
        run: python football-data/validation/evaluate_r42n_ou25_direct_total_fixed200.py
      - name: Verify coverage, sample and governance contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/r42n_ou25_direct_total_fixed200_status.json').read_text(encoding='utf-8'))
          assert x['prior_fixed200_exclusion']['rows']==3800
          assert x['prior_fixed200_exclusion']['hashes']['R42M']=='85478232f1b15cb0cf6661f0f421576dac0c782b71771c86b12ea10141cf703e'
          z=x['zero_test_selection_receipt']
          assert z['target_labels_used_for_coverage_gate'] is False
          assert z['target_labels_used_for_identity_selection'] is False
          assert z['fixed200_used_for_C_selection'] is False
          assert z['fixed200_used_for_feature_selection'] is False
          assert z['fixed200_used_for_threshold_selection'] is False
          b=x['market_boundary']
          assert b['retrospective_reference_only'] is True
          assert b['original_quote_timestamps_available'] is False
          assert b['formal_PIT_claim'] is False
          g=x['governance']
          assert g['formal_weight']==0 and g['protected_blind_access']==0
          assert g['formal_model_mutation'] is False and g['formal_data_mutation'] is False and g['formal_config_mutation'] is False
          assert g['current_mutation'] is False and g['main_mutation'] is False
          if x['status']=='STOP_R42N_OU25_COVERAGE_LT200':
              assert x['model_fits']==0 and x['sample'] is None
          else:
              assert x['status']=='PASS_R42N_FIXED200_EXECUTION_COMPLETE'
              assert x['sample']['rows']==200 and x['sample']['overlap_with_prior_3800']==0
              assert x['sample']['labels_used_for_identity_selection'] is False
              m=x['model_contract']
              assert m['same_C_used_by_challenger'] is True
              assert m['ou_feature_count']==1 and m['ou_feature_name']=='ou25_logit_over'
              assert m['scientific_parameters_selected_on_fixed200']==0
              assert m['manual_feature_weight'] is False
              assert m['baseline_probability_sum_max_residual'] < 1e-10
              assert m['challenger_probability_sum_max_residual'] < 1e-10
          print(json.dumps({'status':x['status'],'scientific_verdict':x['scientific_verdict'],'coverage':x['coverage'],'sample':x.get('sample'),'model_contract':x.get('model_contract'),'metrics':x.get('metrics')},ensure_ascii=False,indent=2))
          PY
      - name: Upload R42N receipt
        uses: actions/upload-artifact@v4
        with:
          name: r42n-ou25-direct-total-fixed200
          path: football-data/manifests/r42n_ou25_direct_total_fixed200_status.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm only runtime manifests are untracked
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
