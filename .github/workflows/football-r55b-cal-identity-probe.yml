name: Football R55B Calibration Identity Probe

on:
  push:
    branches:
      - research/r55-ou-matched300-20260814
    paths:
      - .github/workflows/football-r55b-cal-identity-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-calibration-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download already-verified frozen release archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output archive.1.1.zip \
            'https://github.com/FASHI188/FASHI188-football-analysis/releases/download/football-data-archive-v1/archive.1.1.zip'
      - name: Probe pre-target match-id mapping chain
        shell: bash
        run: |
          python - <<'PY'
          import csv,gzip,io,json,zipfile
          from collections import Counter
          def read_member(z,name,encoding='latin1'):
            raw=z.open(name); gz=gzip.GzipFile(fileobj=raw); text=io.TextIOWrapper(gz,encoding=encoding,newline='')
            rd=csv.DictReader(text); rd.fieldnames=[x.strip() for x in rd.fieldnames]
            return raw,gz,text,rd
          with zipfile.ZipFile('archive.1.1.zip') as z:
            raw,gz,text,rd=read_member(z,'odds_series_b.csv.gz','utf-8')
            b_ids=set(); b_dates=[]; b_rows=0; pre_rows=0
            try:
              for r in rd:
                b_rows+=1; d=(r.get('match_date') or '').strip(); mid=(r.get('match_id') or '').strip()
                if d:b_dates.append(d)
                if d and d<'2016-03-01': pre_rows+=1; b_ids.add(mid)
            finally:
              text.close(); gz.close(); raw.close()
            print('b_header=',json.dumps(rd.fieldnames))
            print('b_rows=',b_rows,'b_date_min=',min(b_dates),'b_date_max=',max(b_dates),'b_pretarget_rows=',pre_rows,'b_pretarget_unique_ids=',len(b_ids))

            raw,gz,text,rd2=read_member(z,'odds_series_matches.csv.gz','latin1')
            m_rows=0; m_dates=[]; mapped=0; mapped_samples=[]; eligible_leagues=Counter()
            try:
              print('matches_header=',json.dumps(rd2.fieldnames,ensure_ascii=False))
              for r in rd2:
                r={k:(v.strip() if isinstance(v,str) else v) for k,v in r.items()}
                m_rows+=1; dt=r.get('match_datetime',''); mid=r.get('match_id','')
                if dt:m_dates.append(dt)
                if mid in b_ids:
                  mapped+=1
                  eligible_leagues[r.get('league','')]+=1
                  if len(mapped_samples)<20: mapped_samples.append(r)
            finally:
              text.close(); gz.close(); raw.close()
            print('matches_rows=',m_rows,'matches_date_min=',min(m_dates) if m_dates else None,'matches_date_max=',max(m_dates) if m_dates else None)
            print('b_pretarget_ids_mapped=',mapped)
            print('mapped_league_top=',json.dumps(eligible_leagues.most_common(30),ensure_ascii=False))
            print('mapped_samples=',json.dumps(mapped_samples,ensure_ascii=False))
          PY
