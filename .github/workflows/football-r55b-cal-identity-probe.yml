name: Football R55B Calibration Identity Probe

on:
  push:
    branches:
      - research/r55-ou-matched300-20260814
    paths:
      - .github/workflows/football-r55b-cal-identity-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-calibration-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download already-verified frozen release archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output archive.1.1.zip \
            'https://github.com/FASHI188/FASHI188-football-analysis/releases/download/football-data-archive-v1/archive.1.1.zip'
      - name: Probe closing odds identity representation only
        shell: bash
        run: |
          python - <<'PY'
          import csv,gzip,io,json,zipfile
          from collections import Counter
          with zipfile.ZipFile('archive.1.1.zip') as z:
              hits=[n for n in z.namelist() if n.rsplit('/',1)[-1]=='closing_odds.csv.gz']
              assert len(hits)==1,hits
              with z.open(hits[0]) as raw, gzip.GzipFile(fileobj=raw) as gz, io.TextIOWrapper(gz,encoding='utf-8',newline='') as text:
                  reader=csv.DictReader(text)
                  leagues=Counter(); samples=[]; rows=0
                  for r in reader:
                      rows+=1; leagues[r['league']]+=1
                      if len(samples)<20 and ('2015' in r['match_date'] or '2016' in r['match_date']):
                          samples.append({k:r.get(k) for k in ('match_id','league','match_date','home_team','away_team')})
                  print('row_count=',rows)
                  print('league_top=',json.dumps(leagues.most_common(30),ensure_ascii=False))
                  print('date_identity_samples=',json.dumps(samples,ensure_ascii=False))
          PY
