name: football3 top1 R39 frozen R38 earlier-era replication

on:
  push:
    branches:
      - football3/top1-r39-r38-earlier-era-replication
    paths:
      - football-data/experiments/top1_r39_r38_earlier_era_replication/run_experiment_r39.py
      - .github/workflows/football3-top1-r39-r38-earlier-era-replication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r39:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r39-r38-earlier-era-replication
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k control snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R39 frozen R38 replication
        run: python football-data/experiments/top1_r39_r38_earlier_era_replication/run_experiment_r39.py run
      - name: Verify R39 contract
        run: python football-data/experiments/top1_r39_r38_earlier_era_replication/run_experiment_r39.py verify
      - name: Persist R39 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r39_r38_earlier_era_replication/results/summary_r39.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R39 frozen R38 earlier-era replication'
            git fetch origin football3/top1-r39-r38-earlier-era-replication
            git rebase origin/football3/top1-r39-r38-earlier-era-replication
            git push origin HEAD:football3/top1-r39-r38-earlier-era-replication
          fi
      - name: Upload R39 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r39-r38-earlier-era-replication
          path: football-data/experiments/top1_r39_r38_earlier_era_replication/results/summary_r39.json
          if-no-files-found: error
          retention-days: 90
