name: football3 Historical Fusion V3 Stage7 Macro Integration Closure

on:
  push:
    branches: ['football3/historical-fusion-v3-stage7-macro-integration-closure-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-stage7-macro-integration-closure-v1.yml'
      - 'football-data/research/historical_fusion_v3_stage7_macro_integration_closure/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v3-stage7-closure-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_HEAD: a84de09ed88512752cfa817f9159599d14ddb7df
  CONTRACT_FREEZE_COMMIT: 9d656b021d4834d63ce17d6a8362d866cf90cf72
  CONTRACT_BLOB: 6da0c3b594a0f975f5912f55d90a90a93a4ecd9c
  RUNNER_BLOB: d7b73f37728923bc4eab6262f2ca6cf0ad15810c
  TEST_BLOB: dd57cf74e764a1e795add740c2bfd2ebcd46466f
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  USR1_HEAD: 485807562f0d1c859ba13355dc671e980de5eb9e
  V324_HEAD: 3cc9098cd321ee4f1dd659b1a4f4db75c02555ed
  V326_HEAD: 2d02de0de4da73412d90b019886f710beaf3ee85
  V311_ARTIFACT_ID: '9856755439'
  V311_ARTIFACT_DIGEST: sha256:f118ffa5d09c40bbefc3f18788e534e4e6b7504744a6976f78f157ce09abf305
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V324_ARTIFACT_ID: '9888387173'
  V324_ARTIFACT_DIGEST: sha256:c14813b04a3f21f5cf8de0cf99d682b0e539f2011adb9212532af175509e6ad1
  V326_ARTIFACT_ID: '9889280493'
  V326_ARTIFACT_DIGEST: sha256:8847f6e45dbbd31365ce962dd8b161f0d20281370da9ee1506548158b97ff859

jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact lineage contract freeze whitelist and formal guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-stage7-macro-integration-closure-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${CONTRACT_FREEZE_COMMIT}^")" = "$BASE_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-upset-safe-v1 | cut -f1)" = "$USR1_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1 | cut -f1)" = "$V324_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-6-temporal-horizon-consensus-v1 | cut -f1)" = "$V326_HEAD"
          D=football-data/research/historical_fusion_v3_stage7_macro_integration_closure
          test "$(git hash-object "$D/V3_STAGE7_MACRO_INTEGRATION_CLOSURE_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/v3_stage7_macro_integration_closure.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_v3_stage7_macro_integration_closure.py")" = "$TEST_BLOB"
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_v3_stage7_macro_integration_closure')
          contract=str(d/'V3_STAGE7_MACRO_INTEGRATION_CLOSURE_CONTRACT.json')
          freeze=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...{os.environ['CONTRACT_FREEZE_COMMIT']}"],text=True).splitlines())
          assert freeze=={contract},freeze
          allowed={'.github/workflows/football3-historical-fusion-v3-stage7-macro-integration-closure-v1.yml',contract,str(d/'v3_stage7_macro_integration_closure.py'),str(d/'test_v3_stage7_macro_integration_closure.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          assert not any(any(x in p for x in ('CURRENT','production_pointer','formal_enablement')) for p in got)
          c=json.loads((d/'V3_STAGE7_MACRO_INTEGRATION_CLOSURE_CONTRACT.json').read_text())
          assert c['status']=='FROZEN_BEFORE_STAGE7_CLOSURE_AUDIT'
          assert c['data_roles']['2019_2022']=='ALREADY_CONSUMED_BY_FROZEN_COMPONENTS_NO_NEW_SCORING'
          assert c['data_roles']['2023']=='CLOSED' and c['data_roles']['2024_25_and_2025_26_3504']=='FORBIDDEN'
          assert c['frozen_lineage']['v3_2_6']['prediction_weight']==0
          assert c['frozen_lineage']['usr1_upset_safe']['role']=='ALREADY_EMBEDDED_IN_V3_1_1_DO_NOT_REAPPLY'
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify frozen component artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v311,usr1,v324,v326}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower()
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python - "$zip" "$expected" <<'PY'
          import hashlib,sys
          got=hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(); exp=sys.argv[2].split(':',1)[-1].lower(); assert got==exp,(got,exp)
          PY
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$V311_ARTIFACT_ID" "$V311_ARTIFACT_DIGEST" /tmp/v311.zip _inputs/v311
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V324_ARTIFACT_ID" "$V324_ARTIFACT_DIGEST" /tmp/v324.zip _inputs/v324
          verify_one "$V326_ARTIFACT_ID" "$V326_ARTIFACT_DIGEST" /tmp/v326.zip _inputs/v326

      - name: Compile and run seven structural closure tests
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_stage7_macro_integration_closure
          python -m py_compile "$D/v3_stage7_macro_integration_closure.py" "$D/test_v3_stage7_macro_integration_closure.py"
          export STAGE7_V311_ROOT="$GITHUB_WORKSPACE/_inputs/v311"
          export STAGE7_USR1_ROOT="$GITHUB_WORKSPACE/_inputs/usr1"
          export STAGE7_V324_ROOT="$GITHUB_WORKSPACE/_inputs/v324"
          export STAGE7_V326_ROOT="$GITHUB_WORKSPACE/_inputs/v326"
          (cd "$D" && python test_v3_stage7_macro_integration_closure.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Execute no-label Stage7 closure audit
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_stage7_macro_integration_closure
          rm -rf _run && mkdir _run
          python "$D/v3_stage7_macro_integration_closure.py" \
            --contract "$D/V3_STAGE7_MACRO_INTEGRATION_CLOSURE_CONTRACT.json" \
            --v311 _inputs/v311 --usr1 _inputs/usr1 --v324 _inputs/v324 --v326 _inputs/v326 --out _run | tee /tmp/closure_stdout.txt
          python - <<'PY'
          import json
          f=json.load(open('_run/final_status.json'))
          assert f['status']=='STAGE7_ORIGINAL_COMPOSITION_EQUIVALENT_TO_V324_BLOCKED_BY_EXISTING_FOLD_LL'
          assert f['equivalent_to_v324'] and f['new_label_scoring'] is False and f['double_count_usr1_avoided']
          assert f['inherited_failed_gates']==['fold_ll_gate']
          assert f['rolling_2021_2022_summary']['deltas']['fold_logloss_nondegrade_n']==4
          assert f['2023_opened'] is False and f['3504_opened'] is False
          assert f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed']
          PY

      - name: Seal immutable Stage7 closure artifact
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_stage7_macro_integration_closure
          rm -rf _artifact && mkdir -p _artifact/{contracts,code,evidence}
          cp "$D/V3_STAGE7_MACRO_INTEGRATION_CLOSURE_CONTRACT.json" _artifact/contracts/
          cp "$D/v3_stage7_macro_integration_closure.py" "$D/test_v3_stage7_macro_integration_closure.py" _artifact/code/
          cp _run/closure_receipt.json _run/final_status.json _artifact/evidence/
          cp /tmp/tests.txt _artifact/evidence/tests.txt
          cp /tmp/closure_stdout.txt _artifact/evidence/closure_stdout.txt
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('_artifact')
          files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix(); files[rel]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          f=json.load(open(root/'evidence/final_status.json'))
          m={'schema_version':'football3-v3-stage7-closure-artifact-v1','head':os.environ['GITHUB_SHA'],'status':f['status'],'equivalent_to_v324':f['equivalent_to_v324'],'new_label_scoring':False,'double_count_usr1_avoided':True,'2023_opened':False,'3504_opened':False,'research_only':True,'promotion_allowed':False,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'frozen_component_artifacts':{'v311':int(os.environ['V311_ARTIFACT_ID']),'usr1':int(os.environ['USR1_ARTIFACT_ID']),'v324':int(os.environ['V324_ARTIFACT_ID']),'v326':int(os.environ['V326_ARTIFACT_ID'])},'files':files}
          (root/'artifact_manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload immutable Stage7 closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-stage7-macro-closure-${{ github.sha }}-${{ github.run_id }}
          path: _artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  remote-readback:
    needs: research-and-seal
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact named closure artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-stage7-macro-closure-${{ github.sha }}-${{ github.run_id }}
          path: readback
      - name: Verify manifest and terminal evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('readback'); m=json.load(open(root/'artifact_manifest.json'))
          assert m['status']=='STAGE7_ORIGINAL_COMPOSITION_EQUIVALENT_TO_V324_BLOCKED_BY_EXISTING_FOLD_LL'
          assert m['equivalent_to_v324'] and m['new_label_scoring'] is False and m['double_count_usr1_avoided']
          assert m['2023_opened'] is False and m['3504_opened'] is False and m['promotion_allowed'] is False
          for rel,rec in m['files'].items():
              p=root/rel; assert p.exists(),rel; assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256'],rel
          f=json.load(open(root/'evidence/final_status.json'))
          assert f['status']==m['status'] and f['inherited_failed_gates']==['fold_ll_gate']
          assert f['rolling_2021_2022_summary']['deltas']['fold_logloss_nondegrade_n']==4
          PY
