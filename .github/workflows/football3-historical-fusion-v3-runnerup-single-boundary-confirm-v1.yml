name: football3 Historical Fusion V3 Runnerup Single Boundary Confirm
on:
  push:
    branches: ['football3/historical-fusion-v3-runnerup-single-boundary-confirm-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-runnerup-single-boundary-confirm-v1.yml'
      - 'football-data/research/historical_fusion_v3_runnerup_single_boundary_confirm/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: football3-v3-runnerup-single-boundary-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_HEAD: 45de54163fa10d23ce41322f08435cdbd96d1f11
  CONTRACT_FREEZE_COMMIT: a546eec12748193fbd61d2529377c3524b32b54c
  CONTRACT_BLOB: e269d1ce18ed94f5f0582225f8bf4f5c2d65dbaf
  RUNNER_BLOB: 696fe0569209a1edc1aa538db31320720bbf3c12
  TEST_BLOB: 2cf15767930d30b727d98a24269bb48b882913e0
  V324_HEAD: 3cc9098cd321ee4f1dd659b1a4f4db75c02555ed
  V324_RUNNER_BLOB: 218cfab50a23ca5f94e57c95b2357ae2c9d9ba8f
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  TRANSITION_ARTIFACT_ID: '9901766394'
  TRANSITION_ARTIFACT_DIGEST: sha256:b680c9b58ac9e0c496bfdb4d056a10fb512f3fb1b3650afc6ce4ed025c23f517
jobs:
  confirm-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact lineage freeze whitelist and formal guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-runnerup-single-boundary-confirm-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${CONTRACT_FREEZE_COMMIT}^")" = "$BASE_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1 | cut -f1)" = "$V324_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_v3_runnerup_single_boundary_confirm
          test "$(git hash-object "$D/RUNNERUP_SINGLE_BOUNDARY_CONFIRM_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/runnerup_single_boundary_confirm.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_runnerup_single_boundary_confirm.py")" = "$TEST_BLOB"
          test "$(git hash-object football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection/v3_2_4_segment4.py)" = "$V324_RUNNER_BLOB"
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_v3_runnerup_single_boundary_confirm'); contract=str(d/'RUNNERUP_SINGLE_BOUNDARY_CONFIRM_CONTRACT.json')
          freeze=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...{os.environ['CONTRACT_FREEZE_COMMIT']}"],text=True).splitlines()); assert freeze=={contract},freeze
          allowed={'.github/workflows/football3-historical-fusion-v3-runnerup-single-boundary-confirm-v1.yml',contract,str(d/'runnerup_single_boundary_confirm.py'),str(d/'test_runnerup_single_boundary_confirm.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...HEAD"],text=True).splitlines()); assert got==allowed,(got,allowed)
          c=json.loads((d/'RUNNERUP_SINGLE_BOUNDARY_CONFIRM_CONTRACT.json').read_text()); assert c['status']=='FROZEN_BEFORE_PREVIOUSLY_UNOPENED_CONFIRMATION_DOWNLOAD'; assert c['mechanism']['no_learning'] and c['mechanism']['no_parameter_fit'] and c['mechanism']['no_numeric_threshold'] and c['mechanism']['no_grid']
          assert not any(any(x in p for x in ('CURRENT','production_pointer','formal_enablement')) for p in got)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify predecessor artifact proves confirmation unopened
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRANSITION_ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$got" "$TRANSITION_ARTIFACT_DIGEST" <<'PY'
          import sys
          n=lambda s:s.split(':',1)[-1].lower(); assert n(sys.argv[1])==n(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRANSITION_ARTIFACT_ID}/zip" -o /tmp/transition.zip
          python - <<'PY'
          import hashlib,os
          got=hashlib.sha256(open('/tmp/transition.zip','rb').read()).hexdigest(); exp=os.environ['TRANSITION_ARTIFACT_DIGEST'].split(':',1)[-1]; assert got==exp,(got,exp)
          PY
          rm -rf /tmp/transition && mkdir /tmp/transition && unzip -q /tmp/transition.zip -d /tmp/transition
          test -f /tmp/transition/data_receipts/confirm_unopened.txt
          test ! -f /tmp/transition/evidence/candidate_freeze.json
          test ! -f /tmp/transition/evidence/confirmation.json
          python - <<'PY'
          import json
          f=json.load(open('/tmp/transition/evidence/final_status.json')); assert f['status']=='TRANSITION_FAMILY_ATTRIBUTION_DEVELOPMENT_NO_VALID_FAMILY_CONFIRMATION_UNOPENED'; assert f['confirmation_opened'] is False
          PY
      - name: Compile and run seven structural tests before confirmation
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_runnerup_single_boundary_confirm
          python -m py_compile "$D/runnerup_single_boundary_confirm.py" "$D/test_runnerup_single_boundary_confirm.py"
          (cd "$D" && python test_runnerup_single_boundary_confirm.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Download previously unopened confirmation cohort
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _data _run && mkdir _data _run
          for sp in 2223 2324; do
            for lg in E2 E3 SC1 SC2 SC3; do
              curl -fsSL --retry 3 --retry-delay 2 "https://www.football-data.co.uk/mmz4281/${sp}/${lg}.csv" -o "_data/${sp}_${lg}.csv"
              test -s "_data/${sp}_${lg}.csv"
            done
          done
          sha256sum _data/*.csv | sort > /tmp/data_sha256.txt
      - name: Execute frozen runner-up confirmation once
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_runnerup_single_boundary_confirm
          python "$D/runnerup_single_boundary_confirm.py" --contract "$D/RUNNERUP_SINGLE_BOUNDARY_CONFIRM_CONTRACT.json" --data-dir _data --v324-runner football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection/v3_2_4_segment4.py --out _run | tee /tmp/result_stdout.txt
      - name: Seal immutable runner-up confirmation evidence
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_runnerup_single_boundary_confirm
          rm -rf _artifact && mkdir -p _artifact/{contracts,code,evidence,data_receipts}
          cp "$D/RUNNERUP_SINGLE_BOUNDARY_CONFIRM_CONTRACT.json" _artifact/contracts/
          cp "$D/runnerup_single_boundary_confirm.py" "$D/test_runnerup_single_boundary_confirm.py" _artifact/code/
          cp _run/runnerup_single_boundary_confirm_result.json _artifact/evidence/
          cp /tmp/tests.txt /tmp/result_stdout.txt _artifact/evidence/
          cp /tmp/data_sha256.txt _artifact/data_receipts/
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('_artifact'); f=json.load(open(root/'evidence/runnerup_single_boundary_confirm_result.json')); files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix(); files[rel]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          m={'schema_version':'football3-v3-runnerup-single-boundary-artifact-v1','head':os.environ['GITHUB_SHA'],'status':f['status'],'all_pass':f['all_pass'],'row_count':f['row_count'],'counts':f['counts'],'formal_confirmation':False,'promotion_allowed':False,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (root/'artifact_manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload immutable runner-up confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-runnerup-single-boundary-${{ github.sha }}-${{ github.run_id }}
          path: _artifact
          if-no-files-found: error
          retention-days: 90
  remote-readback:
    needs: confirm-and-seal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football3-runnerup-single-boundary-${{ github.sha }}-${{ github.run_id }}
          path: readback
      - name: Verify manifest and terminal evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('readback'); m=json.load(open(root/'artifact_manifest.json'))
          for rel,rec in m['files'].items():
              p=root/rel; assert p.exists(),rel; assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256'],rel
          f=json.load(open(root/'evidence/runnerup_single_boundary_confirm_result.json')); assert f['status']==m['status']; assert f['formal_confirmation'] is False and f['promotion_allowed'] is False; assert f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed']
          PY
