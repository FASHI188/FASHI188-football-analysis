name: football-v631-match-context-pit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'football-data/validation/v6_match_context_pit_ledger_v6310.py'
      - 'football-data/config/v6_match_context_pit_v6310.json'
      - 'football-data/evidence/match_context_pre_kickoff/**'
      - '.github/workflows/football-v631-match-context-pit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/v6_match_context_pit_ledger_v6310.py'
      - 'football-data/config/v6_match_context_pit_v6310.json'
      - 'football-data/evidence/match_context_pre_kickoff/**'
      - '.github/workflows/football-v631-match-context-pit.yml'

permissions:
  contents: read

jobs:
  pit-context-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile
        run: python -m py_compile football-data/validation/v6_match_context_pit_ledger_v6310.py

      - name: Build V6.31 match-bound PIT context ledger
        run: python football-data/validation/v6_match_context_pit_ledger_v6310.py

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6310-match-context-pit-ledger
          path: football-data/manifests/v6_match_context_pit_v6310_status.json
          if-no-files-found: error
