name: Football R39S Rendered Lineup Observer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-evidence-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm historical render evidence is frozen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/premierleague_rendered_lineup_r39s/terminal_receipt_r39s.json').read_text())
          assert r['technical_render_audit']['workflow_run_id']==31364726786
          assert r['technical_render_audit']['artifact_id']==9053700055
          assert r['technical_render_audit']['run_conclusion']=='success'
          print('R39S_RENDER_OBSERVER_FROZEN')
          PY
