name: C079-A Footiqo Multiline Zero-Label Gate

on:
  push:
    branches: [research/c079a-footiqo-multiline-zero-label-gate-20260820]
    paths:
      - research/C079A_FOOTIQO_MULTILINE_ZERO_LABEL_CONTRACT.md
      - research/audit_c079a_footiqo_multiline_source.py
      - .github/workflows/c079a_footiqo_multiline_zero_label.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.2.6 pandas==2.3.2 requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1
      - name: Run zero-label multiline source audit
        run: |
          mkdir -p "$RUNNER_TEMP/c079a_out"
          python research/audit_c079a_footiqo_multiline_source.py --out-dir "$RUNNER_TEMP/c079a_out"
      - name: Enforce zero-label boundary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c079a_out'/'summary.json').read_text())
          assert s['schema_version']=='C079A_MULTILINE_ZERO_LABEL_SOURCE_V1'
          assert s['status'] in {'PASS_MULTILINE_ZERO_LABEL_SOURCE','STOP_MULTILINE_SOURCE'}
          b=s['label_boundary']
          assert b['result_score_fields_materialized']==0
          assert b['FTHG_FTAG_numeric_access'] is False
          assert b['goal_totals_computed'] is False and b['tail_membership_computed'] is False and b['model_fit'] is False
          if s['status']=='PASS_MULTILINE_ZERO_LABEL_SOURCE': assert all(s['gate'].values()),s['gate']
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c079a-footiqo-multiline-zero-label
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/c079a_out/summary.json
            ${{ runner.temp }}/c079a_out/multiline_market_snapshot.csv
            research/C079A_FOOTIQO_MULTILINE_ZERO_LABEL_CONTRACT.md
            research/audit_c079a_footiqo_multiline_source.py
