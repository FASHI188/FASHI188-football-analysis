name: C074-D free OU2.5 movement Direct-T

on:
  pull_request:
    paths:
      - 'research/C074D_CONTRACT.md'
      - 'research/c074d_free_ou25_movement_directt.py'
      - '.github/workflows/c074d_free_ou25_movement_directt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2

      - name: Clone and pin free public source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/nm2890/football-data.git external-football-data
          git -C external-football-data checkout 279978313f9c16a210fa80e8986fa22f0f866fba
          test "$(git -C external-football-data rev-parse HEAD)" = "279978313f9c16a210fa80e8986fa22f0f866fba"
          git -C external-football-data rev-parse HEAD | tee source_revision.txt

      - name: Run preregistered expanding-window OOS probe
        run: |
          python research/c074d_free_ou25_movement_directt.py \
            --external-root external-football-data \
            --out artifacts/c074d_directt
          cp source_revision.txt artifacts/c074d_directt/source_revision.txt
          cp research/C074D_CONTRACT.md artifacts/c074d_directt/C074D_CONTRACT.md

      - name: Upload C074-D artifact
        uses: actions/upload-artifact@v4
        with:
          name: c074d-free-ou25-movement-directt
          path: artifacts/c074d_directt/
          if-no-files-found: error
          retention-days: 30
