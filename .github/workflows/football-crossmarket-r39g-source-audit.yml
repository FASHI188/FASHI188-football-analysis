name: Football Cross-Market R39G Source Audit

on:
  push:
    branches: [research/football-data-crossmarket-r39g]
    paths:
      - '.github/workflows/football-crossmarket-r39g-source-audit.yml'
      - 'football-data/research/crossmarket_r39g/source_audit_registration_r39g.json'
      - 'football-data/research/crossmarket_r39g/audit_crossmarket_source_r39g.py'

permissions:
  contents: read

jobs:
  zero-label-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify frozen source contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/crossmarket_r39g/audit_crossmarket_source_r39g.py
          python -m json.tool football-data/research/crossmarket_r39g/source_audit_registration_r39g.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/crossmarket_r39g/source_audit_registration_r39g.json').read_text())
          assert r['lane_selection']['preferred_order']==['OPEN_AND_CLOSE_CROSSMARKET_AVG','CLOSE_ONLY_CROSSMARKET_AVG']
          assert r['identity_lock']['holdout_season']=='2425' and r['identity_lock']['rows']==100 and r['identity_lock']['seed']==51143
          assert r['prior_blind_set']['labels_accessed']==0 and r['prior_blind_set']['use_in_r39g'] is False
          assert r['no_label_contract']['holdout_labels_accessed']==0
          assert r['hard_limits']['formal_weight']==0
          print('PASS_R39G_SOURCE_AUDIT_CONTRACT')
          PY
      - name: Download Football-Data official CSV files
        run: |
          set -euo pipefail
          rm -rf r39g-raw r39g-sanitized r39g-output
          mkdir -p r39g-raw r39g-sanitized r39g-output
          for season in 1920 2021 2122 2223 2324 2425; do
            for div in E0 D1 I1 SP1 F1; do
              url="https://www.football-data.co.uk/mmz4281/${season}/${div}.csv"
              out="r39g-raw/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o "$out"
            done
          done
      - name: Physically strip results and keep only identity plus market columns
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          raw=Path('r39g-raw'); out=Path('r39g-sanitized'); out.mkdir(exist_ok=True)
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgH','AvgD','AvgA','Avg>2.5','Avg<2.5','AHh','AvgAHH','AvgAHA','AvgCH','AvgCD','AvgCA','AvgC>2.5','AvgC<2.5','AHCh','AvgCAHH','AvgCAHA']
          forbidden={'FTHG','FTAG','FTR','HTHG','HTAG','HTR'}
          for p in sorted(raw.glob('*.csv')):
              season=p.stem.split('_',1)[0]
              with p.open('r',encoding='utf-8-sig',errors='replace',newline='') as f:
                  r=csv.DictReader(f); header=r.fieldnames or []
                  selected=[c for c in keep if c in header]
                  if any(c in selected for c in forbidden): raise RuntimeError('forbidden selected')
                  q=out/p.name
                  with q.open('w',encoding='utf-8',newline='') as g:
                      w=csv.DictWriter(g,fieldnames=['Season']+selected); w.writeheader()
                      for row in r:
                          z={'Season':season}
                          for c in selected: z[c]=row.get(c,'')
                          w.writerow(z)
          PY
          rm -rf r39g-raw
      - name: Run source coverage and fixed100 identity lock
        run: |
          set -euo pipefail
          python football-data/research/crossmarket_r39g/audit_crossmarket_source_r39g.py \
            --registration football-data/research/crossmarket_r39g/source_audit_registration_r39g.json \
            --sanitized-dir r39g-sanitized --out-dir r39g-output
      - name: Verify zero-label result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39g-output/source_audit_and_identity_lock_r39g.json').read_text())
          assert r['status'] in {'PASS_R39G_CROSSMARKET_SOURCE_AND_FIXED100_LOCK_NO_LABELS','STOP_R39G_CROSSMARKET_SOURCE_COVERAGE_INSUFFICIENT'}
          n=r['no_label_audit']
          assert n['result_columns_present_in_audit_input'] is False
          assert n['FTHG_accessed']==0 and n['FTAG_accessed']==0 and n['FTR_accessed']==0
          assert n['model_fit']==0 and n['prediction_metrics']==0 and n['threshold_selection']==0 and n['holdout_labels_accessed']==0
          if r['status'].startswith('PASS_'):
              assert r['locked_fixed100_rows']==100 and r['locked_fixed100_identity_sha256']
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-crossmarket-r39g-source-audit-${{ github.sha }}-${{ github.run_id }}
          path: r39g-output/
          if-no-files-found: error
          retention-days: 30
