name: football3 one-off Celje vs Slovan pure-model frozen inference

on:
  push:
    branches:
      - football3/once-celje-slovan-20260826
    paths:
      - .github/workflows/football3-once-celje-slovan-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: football-data/engine
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze 90m-safe 2026/27 UCL qualifying history
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          path = Path('football-data/processed/UEFA_ChampionsLeague/main_tournament_90min_safe.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig', newline='')))
          fieldnames = list(rows[0].keys())
          assert not any(r['season'] == '2026/27' for r in rows)

          matches = [
            ('2026-07-07','Sabah','The New Saints',2,0,'qualifying_r1'),
            ('2026-07-07','Lincoln Red Imps','Inter Escaldes',3,1,'qualifying_r1'),
            ('2026-07-07','Ararat-Armenia','Riga',2,0,'qualifying_r1'),
            ('2026-07-07','Kauno Žalgiris','Drita',1,1,'qualifying_r1'),
            ('2026-07-07','Vardar','KuPS Kuopio',0,2,'qualifying_r1'),
            ('2026-07-07','Floriana','Shamrock Rovers',2,0,'qualifying_r1'),
            ('2026-07-07','Tre Fiori','Larne',0,1,'qualifying_r1'),
            ('2026-07-07','Borac','Levski Sofia',1,1,'qualifying_r1'),
            ('2026-07-07','KÍ Klaksvík','Atert Bissen',2,1,'qualifying_r1'),
            ('2026-07-07','Víkingur Reykjavík','Győri ETO',1,0,'qualifying_r1'),
            ('2026-07-08','Kairat Almaty','Sutjeska',2,1,'qualifying_r1'),
            ('2026-07-08','Flora Tallinn','Iberia Tbilisi',2,3,'qualifying_r1'),
            ('2026-07-08','Vitebsk','Universitatea Craiova',1,4,'qualifying_r1'),
            ('2026-07-08','Petrocub','Egnatia',1,1,'qualifying_r1'),
            ('2026-07-14','Iberia Tbilisi','Flora Tallinn',2,2,'qualifying_r1'),
            ('2026-07-14','Inter Escaldes','Lincoln Red Imps',1,1,'qualifying_r1'),
            ('2026-07-14','Riga','Ararat-Armenia',3,2,'qualifying_r1'),
            ('2026-07-14','Győri ETO','Víkingur Reykjavík',2,2,'qualifying_r1'),
            ('2026-07-14','The New Saints','Sabah',1,2,'qualifying_r1'),
            ('2026-07-14','Levski Sofia','Borac',4,0,'qualifying_r1'),
            ('2026-07-14','Drita','Kauno Žalgiris',2,3,'qualifying_r1'),
            ('2026-07-14','Shamrock Rovers','Floriana',5,1,'qualifying_r1'),
            ('2026-07-14','Larne','Tre Fiori',2,1,'qualifying_r1'),
            ('2026-07-15','Universitatea Craiova','Vitebsk',1,0,'qualifying_r1'),
            ('2026-07-15','Atert Bissen','KÍ Klaksvík',1,2,'qualifying_r1'),
            ('2026-07-15','Egnatia','Petrocub',6,1,'qualifying_r1'),
            ('2026-07-15','Sutjeska','Kairat Almaty',0,2,'qualifying_r1'),
            ('2026-07-21','Mjällby','Lincoln Red Imps',3,0,'qualifying_r2'),
            ('2026-07-21','Sabah','KuPS Kuopio',1,0,'qualifying_r2'),
            ('2026-07-21','Ararat-Armenia','Shamrock Rovers',2,0,'qualifying_r2'),
            ('2026-07-21','Iberia Tbilisi','Slovan Bratislava',0,2,'qualifying_r2'),
            ('2026-07-21','Aarhus','Lech Poznań',1,4,'qualifying_r2'),
            ('2026-07-21','Thun','GNK Dinamo',1,1,'qualifying_r2'),
            ('2026-07-21','KÍ Klaksvík','Kauno Žalgiris',0,0,'qualifying_r2'),
            ('2026-07-21','Larne','Crvena Zvezda',0,4,'qualifying_r2'),
            ('2026-07-21','Víkingur Reykjavík','Hapoel Beer-Sheva',2,1,'qualifying_r2'),
            ('2026-07-21','Fenerbahçe','Górnik Zabrze',1,0,'qualifying_r2'),
            ('2026-07-21','Sturm Graz','Heart of Midlothian',4,0,'qualifying_r2'),
            ('2026-07-22','Omonia','Kairat Almaty',1,0,'qualifying_r2'),
            ('2026-07-22','Levski Sofia','Universitatea Craiova',1,0,'qualifying_r2'),
            ('2026-07-22','Egnatia','Celje',3,3,'qualifying_r2'),
            ('2026-07-28','KuPS Kuopio','Sabah',0,2,'qualifying_r2'),
            ('2026-07-28','Lincoln Red Imps','Mjällby',0,0,'qualifying_r2'),
            ('2026-07-28','Celje','Egnatia',1,1,'qualifying_r2'),
            ('2026-07-28','Shamrock Rovers','Ararat-Armenia',2,1,'qualifying_r2'),
            ('2026-07-28','Heart of Midlothian','Sturm Graz',0,2,'qualifying_r2'),
            ('2026-07-29','Kairat Almaty','Omonia',1,0,'qualifying_r2'),
            ('2026-07-29','Kauno Žalgiris','KÍ Klaksvík',1,0,'qualifying_r2'),
            ('2026-07-29','Lech Poznań','Aarhus',1,4,'qualifying_r2'),
            ('2026-07-29','Universitatea Craiova','Levski Sofia',2,2,'qualifying_r2'),
            ('2026-07-29','Hapoel Beer-Sheva','Víkingur Reykjavík',2,0,'qualifying_r2'),
            ('2026-07-29','Crvena Zvezda','Larne',5,0,'qualifying_r2'),
            ('2026-07-29','Slovan Bratislava','Iberia Tbilisi',1,1,'qualifying_r2'),
            ('2026-07-29','Górnik Zabrze','Fenerbahçe',1,1,'qualifying_r2'),
            ('2026-08-04','Mjällby','Slovan Bratislava',1,2,'qualifying_r3'),
            ('2026-08-04','Ararat-Armenia','Celje',2,1,'qualifying_r3'),
            ('2026-08-04','Levski Sofia','Kairat Almaty',1,0,'qualifying_r3'),
            ('2026-08-04','Hapoel Beer-Sheva','Crvena Zvezda',1,0,'qualifying_r3'),
            ('2026-08-04','GNK Dinamo','Kauno Žalgiris',5,0,'qualifying_r3'),
            ('2026-08-04','Olympiacos','N.E.C.',0,0,'qualifying_r3'),
            ('2026-08-04','Union SG','Bodø/Glimt',3,3,'qualifying_r3'),
            ('2026-08-04','Sparta Praha','Lyon',2,1,'qualifying_r3'),
            ('2026-08-05','Aarhus','Sabah',2,1,'qualifying_r3'),
            ('2026-08-05','Fenerbahçe','Sturm Graz',2,0,'qualifying_r3'),
            ('2026-08-11','Kairat Almaty','Levski Sofia',0,1,'qualifying_r3'),
            ('2026-08-11','Sabah','Aarhus',4,0,'qualifying_r3'),
            ('2026-08-11','Kauno Žalgiris','GNK Dinamo',1,2,'qualifying_r3'),
            ('2026-08-11','Crvena Zvezda','Hapoel Beer-Sheva',0,2,'qualifying_r3'),
            ('2026-08-11','Slovan Bratislava','Mjällby',2,0,'qualifying_r3'),
            ('2026-08-11','Celje','Ararat-Armenia',2,0,'qualifying_r3'),
            ('2026-08-11','Sturm Graz','Fenerbahçe',0,1,'qualifying_r3'),
            ('2026-08-11','Lyon','Sparta Praha',3,0,'qualifying_r3'),
            ('2026-08-18','Levski Sofia','AEK Athens',0,0,'playoff'),
            ('2026-08-18','GNK Dinamo','Viking',2,2,'playoff'),
            ('2026-08-18','Fenerbahçe','Lyon',1,1,'playoff'),
            ('2026-08-19','Hapoel Beer-Sheva','Sabah',2,1,'playoff'),
            ('2026-08-19','Celtic','LASK',3,0,'playoff'),
            ('2026-08-19','Slovan Bratislava','Celje',1,1,'playoff'),
            ('2026-08-19','N.E.C.','Bodø/Glimt',1,3,'playoff'),
          ]
          assert len(matches) == 79, len(matches)
          excluded_ambiguous_et = [
            '2026-07-14 KuPS Kuopio vs Vardar',
            '2026-07-28 GNK Dinamo vs Thun',
            '2026-08-11 Bodø/Glimt vs Union SG',
            '2026-08-11 N.E.C. vs Olympiacos',
          ]
          for date, home, away, hg, ag, stage in matches:
            row = {k: '' for k in fieldnames}
            row.update({
              'competition_id':'UEFA_ChampionsLeague',
              'season':'2026/27','source_season':'2026-27','stage':stage,
              'source_code':'uefa_official_frozen_pre_kickoff_20260825',
              'Date':date,'Time':'','HomeTeam':home,'AwayTeam':away,
              'FTHG':str(hg),'FTAG':str(ag),
              'FTR':'H' if hg > ag else 'D' if hg == ag else 'A',
              'HTHG':'','HTAG':''
            })
            rows.append(row)

          with path.open('w', encoding='utf-8', newline='') as fh:
            w = csv.DictWriter(fh, fieldnames=fieldnames)
            w.writeheader(); w.writerows(rows)

          target_rows = [r for r in rows if r['season'] == '2026/27']
          assert len(target_rows) == 79
          celje_home = [r for r in target_rows if r['HomeTeam'] == 'Celje']
          slovan_away = [r for r in target_rows if r['AwayTeam'] == 'Slovan Bratislava']
          assert len(celje_home) == 2, len(celje_home)
          assert len(slovan_away) == 2, len(slovan_away)
          assert all(r['Date'] < '2026-08-26' for r in target_rows)

          receipt = {
            'status':'FROZEN_PRE_KICKOFF_90M_SAFE_BACKFILL',
            'competition_id':'UEFA_ChampionsLeague','season':'2026/27',
            'target_fixture':'Celje vs Slovan Bratislava',
            'target_match_date':'2026-08-26','cutoff_policy':'strictly prior calendar dates only',
            'safe_history_rows':79,
            'celje_home_rows':len(celje_home),'slovan_away_rows':len(slovan_away),
            'excluded_ambiguous_extra_time_rows':excluded_ambiguous_et,
            'celje_egnatia_20260728_used_90m_score':'1-1; verified by Celje official report',
            'source_basis':['UEFA official 2026/27 qualifying results','NK Celje official 90m clarification for Celje-Egnatia'],
            'pure_model_input':True,'market_snapshot_used':False,'odds_used':False,
          }
          Path('/tmp/celje_slovan_pre_kickoff_backfill.json').write_text(
            json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          print('UCL_90M_SAFE_BACKFILL_OK rows=79 celje_home=2 slovan_away=2')
          PY

      - name: Write pure-model strictly pre-kickoff input
        run: |
          cat > /tmp/celje_slovan_input.json <<'JSON'
          {
            "competition_id": "UEFA_ChampionsLeague",
            "season": "2026/27",
            "home_team": "Celje",
            "away_team": "Slovan Bratislava",
            "cutoff_utc": "2026-08-26T18:55:00Z"
          }
          JSON
          cat /tmp/celje_slovan_input.json

      - name: Run CURRENT universal router
        run: |
          python football-data/engine/run_universal_prediction_candidate_v1.py \
            --input /tmp/celje_slovan_input.json \
            --output /tmp/celje_slovan_output.json
          cat /tmp/celje_slovan_output.json

      - name: Assert pure stable-current-season route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inp = json.loads(Path('/tmp/celje_slovan_input.json').read_text(encoding='utf-8'))
          p = json.loads(Path('/tmp/celje_slovan_output.json').read_text(encoding='utf-8'))
          if 'market_snapshot' in inp:
              raise SystemExit('market snapshot unexpectedly present')
          route = p.get('universal_router') or {}
          state = (p.get('cold_start_candidate') or {}).get('state')
          print('route=', route)
          print('cold_start_state=', state)
          if route.get('route') != 'STABLE_CURRENT_SEASON' or state != 'STABLE_CURRENT_SEASON':
              raise SystemExit(f'unexpected route/state: {route} / {state}')
          if int(p.get('history_matches', -1)) != 79:
              raise SystemExit(f"unexpected history_matches={p.get('history_matches')}")
          one = (p.get('probabilities') or {}).get('one_x_two')
          if not one:
              raise SystemExit('1X2 missing from model output')
          team_sample = p.get('team_sample') or {}
          if float(team_sample.get('home_raw_matches', 0)) < 2 or float(team_sample.get('away_raw_matches', 0)) < 2:
              raise SystemExit(f'target venue samples below stable threshold: {team_sample}')
          audit = p.get('input_audit') or {}
          if audit.get('historical_odds_read') is True:
              raise SystemExit(f'historical odds unexpectedly read: {audit}')
          print('MODEL_1X2=', json.dumps(one, ensure_ascii=False, sort_keys=True))
          print('TEAM_SAMPLE=', json.dumps(team_sample, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload immutable inference output
        uses: actions/upload-artifact@v4
        with:
          name: football3-celje-slovan-20260826-pure-model-frozen
          path: |
            /tmp/celje_slovan_input.json
            /tmp/celje_slovan_output.json
            /tmp/celje_slovan_pre_kickoff_backfill.json
          if-no-files-found: error
          retention-days: 30
