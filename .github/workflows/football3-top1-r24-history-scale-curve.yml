name: football3 top1 R24 history scale curve

on:
  push:
    branches:
      - football3/top1-r24-history-scale-curve
    paths:
      - football-data/experiments/top1_r24_history_scale_curve/run_experiment_r24.py
      - football-data/experiments/top1_r24_history_scale_curve/driver_r24.py
      - .github/workflows/football3-top1-r24-history-scale-curve.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r24:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r24-history-scale-curve
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Run R24 history scale curve
        run: python football-data/experiments/top1_r24_history_scale_curve/driver_r24.py
      - name: Persist compact R24 diagnostic on failure
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f football-data/experiments/top1_r24_history_scale_curve/results/error_r24.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m '[diagnostic] football3 R24 compact failure receipt'
            git push origin HEAD:football3/top1-r24-history-scale-curve
          fi
      - name: Verify R24 contract
        run: python football-data/experiments/top1_r24_history_scale_curve/run_experiment_r24.py verify
      - name: Persist R24 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r24_history_scale_curve/results/summary_r24.json football-data/experiments/top1_r24_history_scale_curve/data/source_manifest_r24.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R24 history scale curve'
            git push origin HEAD:football3/top1-r24-history-scale-curve
          fi
      - name: Upload R24 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: |
            football-data/experiments/top1_r24_history_scale_curve/results/summary_r24.json
            football-data/experiments/top1_r24_history_scale_curve/data/source_manifest_r24.json
            football-data/experiments/top1_r24_history_scale_curve/data/extra_r24_xg_60000.csv
          if-no-files-found: error
          retention-days: 90
