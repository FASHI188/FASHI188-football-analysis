name: Football R39M Feature Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39m-feature-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: r39m-feature-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  zero-label-feature-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enforce first snapshot run
        run: test "${GITHUB_RUN_ATTEMPT}" = "1"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify zero-label frozen design
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/lineup_attack_recency_r39m/export_frozen_feature_snapshot_r39m.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json').read_text())
          s=json.loads(Path('football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json').read_text())
          assert p['blind_binding']['fixed100_labels_accessed_before_r39m']==0
          assert p['blind_binding']['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert p['recency_weighted_player_attack_rate']['half_life_days_candidates']==[90,180,365]
          assert p['model_contract']['dynamic_full_l2_candidates']==[1.0,10.0,100.0]
          assert all(v==0 for v in s['no_target_label_contract'].values())
          print('PASS_R39M_ZERO_LABEL_SNAPSHOT_CONTRACT')
          PY
      - name: Download and sanitize Transfermarkt source tables
        run: |
          set -euo pipefail
          rm -rf r39m-snap-tm r39m-snap-market r39m-snapshot player_scores.zip /tmp/r39m-snap-*.csv
          mkdir -p r39m-snap-tm r39m-snap-market r39m-snapshot
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39m-snap-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39m-snap-lineups.csv
          unzip -p player_scores.zip appearances.csv > /tmp/r39m-snap-appearances.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39m-snap-games.csv','r39m-snap-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39m-snap-lineups.csv','r39m-snap-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39m-snap-appearances.csv','r39m-snap-tm/appearances_prior.csv',['appearance_id','game_id','player_id','player_club_id','date','competition_id','goals','assists','minutes_played'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing:raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39m-snap-games.csv /tmp/r39m-snap-lineups.csv /tmp/r39m-snap-appearances.csv player_scores.zip
      - name: Download and sanitize Football-Data market identity only
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="/tmp/r39m-snap-${season}_${div}.csv";out="r39m-snap-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing:raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
              rm -f "$raw"
            done
          done
      - name: Export frozen zero-label feature matrix
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_recency_r39m/export_frozen_feature_snapshot_r39m.py \
            --registration football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json \
            --r39l-source-registration football-data/research/lineup_attack_r39l/source_registration_r39l.json \
            --r39i-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39m-snap-market --games r39m-snap-tm/games_identity.csv --lineups r39m-snap-tm/lineups_identity.csv \
            --appearances r39m-snap-tm/appearances_prior.csv --out-dir r39m-snapshot
      - name: Verify snapshot identity and zero-label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          r=json.loads(Path('r39m-snapshot/snapshot_receipt_r39m.json').read_text())
          assert r['status']=='PASS_R39M_ZERO_LABEL_FROZEN_FEATURE_SNAPSHOT'
          assert r['rows']=={'all':9434,'preholdout':8161,'holdout_2526':1273,'fixed100':100}
          assert r['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert all(v==0 for v in r['zero_label_contract'].values())
          with Path('r39m-snapshot/feature_snapshot_r39m.csv').open('r',encoding='utf-8',newline='') as f:
              rd=csv.reader(f);header=next(rd);n=sum(1 for _ in rd)
          assert n==9434 and len(header)==47
          print(json.dumps(r,indent=2))
          PY
      - name: Delete downloaded source inputs before artifact
        run: rm -rf r39m-snap-tm r39m-snap-market
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39m-frozen-feature-snapshot-${{ github.sha }}-${{ github.run_id }}
          path: r39m-snapshot/
          if-no-files-found: error
          retention-days: 30
