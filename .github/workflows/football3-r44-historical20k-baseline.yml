name: football3 R44 historical 20k baseline replay

on:
  push:
    branches:
      - football3/r44-historical-20k-research
    paths:
      - '.github/workflows/football3-r44-historical20k-baseline.yml'
  workflow_dispatch:

concurrency:
  group: football3-r44-historical20k-baseline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r44-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact R44 branch
        uses: actions/checkout@v4
        with:
          ref: football3/r44-historical-20k-research
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 pyarrow==18.1.0

      - name: Replay exact governed R9b 20k baseline
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py all

      - name: Gate strict historical baseline contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('football-data/experiments/top1_r9b_xg_hf')
          manifest = json.loads((root / 'data/source_manifest_r9b.json').read_text(encoding='utf-8'))
          summary = json.loads((root / 'results/summary_r9b.json').read_text(encoding='utf-8'))
          g = summary['governance']
          checks = {
              'snapshot_20000': manifest.get('snapshot_rows') == 20000 and g.get('snapshot_rows') == 20000,
              'strict_prior_xg': bool(manifest.get('strict_prior_xg_contract')) and bool(g.get('strict_prior_xg')),
              'same_date_withheld': bool(g.get('same_date_results_and_xg_withheld')),
              'date_safe_split': bool(g.get('date_safe_split_boundaries')),
              'full_coverage': float(g.get('coverage_required', 0)) == 1.0,
              'no_odds': not bool(g.get('odds_used')) and not bool(manifest.get('odds_table_downloaded')),
              'no_manual_adjustment': not bool(g.get('manual_match_adjustment')),
              'untouched_test_present': int(g.get('untouched_within_r9b_test', 0)) > 0,
              'development_only': summary.get('classification') == 'DEVELOPMENT_OVERLAPPING_ERA_NOT_FRESH_CONFIRMATION',
          }
          status = 'PASS_R44_BASELINE_REPRODUCED' if all(checks.values()) else 'FAIL_R44_BASELINE_CONTRACT'
          gate = {
              'schema_version': 'football3-r44-historical20k-baseline-gate-v1',
              'status': status,
              'checks': checks,
              'source_manifest': {
                  'first_date': manifest.get('first_date'),
                  'last_date': manifest.get('last_date'),
                  'snapshot_sha256': manifest.get('snapshot_sha256'),
                  'fixtures_sha256': manifest.get('fixtures_sha256'),
                  'match_stats_sha256': manifest.get('match_stats_sha256'),
              },
              'validation': summary.get('validation'),
              'test': summary.get('test'),
          }
          out = Path('football-data/experiments/r44_historical20k_baseline')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'gate.json').write_text(json.dumps(gate, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(gate, indent=2, ensure_ascii=False))
          if status != 'PASS_R44_BASELINE_REPRODUCED':
              raise SystemExit(1)
          PY

      - name: Upload R44 baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r44-historical20k-baseline
          if-no-files-found: error
          retention-days: 90
          path: |
            football-data/experiments/top1_r9b_xg_hf/data/source_manifest_r9b.json
            football-data/experiments/top1_r9b_xg_hf/results/summary_r9b.json
            football-data/experiments/r44_historical20k_baseline/gate.json
