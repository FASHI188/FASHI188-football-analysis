# V5.0.3 governance audit only; no training, scoring, provider, secret, or formal-asset mutation.
name: Football Draw Signal Closure Audit V5.0.3

on:
  push:
    branches: [research/draw-challenger-v502]
    paths:
      - "AGENTS.md"
      - "football-data/audit/football_draw_signal_closure_audit_v503.md"
      - "football-data/audit/draw_signal_claim_contract_v503.py"
      - "football-data/audit/draw_signal_closure_engine_v503.py"
      - "football-data/tests/test_draw_signal_claim_contract_v503.py"
      - ".github/workflows/football-draw-challenger-v502.yml"
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "football-data/audit/football_draw_signal_closure_audit_v503.md"
      - "football-data/audit/draw_signal_claim_contract_v503.py"
      - "football-data/audit/draw_signal_closure_engine_v503.py"
      - "football-data/tests/test_draw_signal_claim_contract_v503.py"
      - ".github/workflows/football-draw-challenger-v502.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-draw-closure-audit-v503-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN: 605abf2d9f98c46f063106c7bd47193b96e588e4
  PREVIOUS_VALIDATED_HEAD: 3330b1cdddbaaf34d9d9c496902e649b81870275
  EVIDENCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  closure-audit-v503:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact-head rule no-provider and protected-asset gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f AGENTS.md
          test -f football-data/audit/football_draw_signal_closure_audit_v503.md
          test "$(git ls-files -- football-data/audit/football_draw_signal_closure_audit_v503.md | wc -l)" -eq 1
          grep -Fq 'Football Draw Signal Closure Audit V5.0.3' football-data/audit/football_draw_signal_closure_audit_v503.md
          grep -Fq 'CURRENT_AUTHORITATIVE_RULE' football-data/audit/football_draw_signal_closure_audit_v503.md
          grep -Fq 'football-data/audit/football_draw_signal_closure_audit_v503.md' AGENTS.md
          python -m py_compile \
            football-data/research/draw_challenger_inventory_v502.py \
            football-data/research/draw_signal_closure_engine_v502.py \
            football-data/research/draw_signal_closure_engine_v502_r3.py \
            football-data/audit/draw_signal_closure_engine_v502_r4.py \
            football-data/audit/draw_signal_claim_contract_v503.py \
            football-data/audit/draw_signal_closure_engine_v503.py \
            football-data/research/draw_signal_complete_ledger_v502.py \
            football-data/tests/test_draw_signal_closure_audit_v502.py \
            football-data/tests/test_draw_signal_complete_ledger_v502.py \
            football-data/tests/test_draw_signal_claim_contract_v503.py
          ! grep -R -nE 'API_FOOTBALL_KEY|api-sports|v3\.football\.api-sports|requests\.|httpx|aiohttp|urllib\.request' \
            football-data/audit/draw_signal_claim_contract_v503.py \
            football-data/audit/draw_signal_closure_engine_v503.py \
            football-data/tests/test_draw_signal_claim_contract_v503.py
          changed="$(git diff --name-only "$BASE_MAIN"...HEAD)"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(models?|processed|team_strengths|config|CURRENT|formal_core_v460|oof_matrix_calibration_v461_status)'
      - name: Historical V5.0.2 audit tests
        env:
          PYTHONPATH: football-data/research
        run: |
          python -m unittest football-data/tests/test_draw_signal_closure_audit_v502.py -v
          python -m unittest football-data/tests/test_draw_signal_complete_ledger_v502.py -v
      - name: V5.0.3 claim-contract production counterexamples
        run: python -m unittest football-data/tests/test_draw_signal_claim_contract_v503.py -v
      - name: Build and deterministically verify V5.0.3 outputs
        shell: bash
        env:
          PYTHONPATH: football-data/research:football-data/audit
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/draw-closure-audit-v503"
          inventory="$root/inventory"
          closure="$root/closure"
          mkdir -p "$inventory" "$closure"
          python football-data/research/draw_challenger_inventory_v502.py --output-dir "$inventory"
          python football-data/audit/draw_signal_closure_engine_v503.py --output-dir "$closure"
          python football-data/research/draw_signal_complete_ledger_v502.py --closure-dir "$closure" > "$root/ledger_verify_stdout.json"
          python football-data/audit/draw_signal_claim_contract_v503.py --closure-dir "$closure" --root . --verify-existing > "$root/claim_verify_stdout.json"
          git status --short > "$root/git_status_after_audit.txt"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-closure-audit-v503'
          closure = root / 'closure'
          audit = json.loads((closure / 'closure_audit.json').read_text(encoding='utf-8'))
          meta = json.loads((closure / 'metadata.json').read_text(encoding='utf-8'))
          verification = json.loads((closure / 'closure_verification.json').read_text(encoding='utf-8'))
          ledger_stdout = json.loads((root / 'ledger_verify_stdout.json').read_text(encoding='utf-8'))
          claim_verification = json.loads((closure / 'claim_contract_verification.json').read_text(encoding='utf-8'))
          verify_stdout = json.loads((root / 'claim_verify_stdout.json').read_text(encoding='utf-8'))
          claim_records = json.loads((closure / 'claim_records.json').read_text(encoding='utf-8'))
          report = json.loads((closure / 'claim_report.json').read_text(encoding='utf-8'))
          receipt = json.loads((closure / 'audit_execution_receipt.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], encoding='utf-8').strip()

          assert head == os.environ['EVIDENCE_HEAD'] == audit['head'] == meta['checkout_head'] == claim_records['head']
          assert audit['rule_version'] == meta['rule_version'] == 'Football Draw Signal Closure Audit V5.0.3'
          assert audit['historical_relationship']['previous_version'] == 'Football Draw Signal Closure Audit V5.0.2'
          assert audit['historical_relationship']['previous_exact_head'] == os.environ['PREVIOUS_VALIDATED_HEAD']
          assert audit['historical_relationship']['silent_rewrite'] is False
          assert verification['status'] == ledger_stdout['status'] == claim_verification['status'] == verify_stdout['status'] == 'PASS'
          assert report['accurate_object']['exact_new_head'] == head
          assert report['accurate_object']['previous_head'] == os.environ['PREVIOUS_VALIDATED_HEAD']
          assert audit['decision'] == 'PRE_REGISTRATION_REQUIRED_NO_TRAINING_YET'
          assert audit['preregistration']['status'] == 'PRE_REGISTERED_NOT_RUN'
          assert audit['preregistration']['run_authorized'] is False
          assert audit['preregistration']['formal_promotion_authorized'] is False
          assert audit['formal_weight'] == meta['formal_weight'] == 0
          assert audit['model_training'] == meta['model_training'] == 0
          assert audit['new_target_period_scoring'] == meta['new_target_period_scoring'] == 0
          for obj in (audit, meta):
              assert obj['provider_request_attempts'] == 0
              assert obj['audit_code_external_request_attempts'] == 0
              assert obj['external_request_attempts'] == 0
              assert obj['external_request_attempts'] == obj['provider_request_attempts'] + obj['audit_code_external_request_attempts']
              assert obj['external_request_attempts_scope'].startswith('V5.0.2_LEDGER_COMPATIBILITY:')
          assert audit['api_football_key_accessed'] is False and meta['api_football_key_accessed'] is False
          assert meta['model_diff'] == meta['formal_data_diff'] == meta['config_diff'] == meta['current_diff'] == 0
          assert audit['execution_boundary']['measurement_scope'] == 'AUDIT_BUSINESS_CODE_ONLY'
          assert 'workflow-artifact-upload' in audit['execution_boundary']['not_yet_executed_at_measurement']
          assert audit['execution_boundary']['workflow_infrastructure_network_used'] == 'OUT_OF_SCOPE_NOT_MEASURED_BY_AUDIT_CODE'
          assert receipt['artifact_upload_status'] == 'NOT_EXECUTED_BY_AUDIT_CODE'
          assert receipt['provider_request_attempts'] == receipt['audit_code_external_request_attempts'] == receipt['external_request_attempts'] == 0
          assert receipt['external_request_attempts_scope'].startswith('V5.0.2_LEDGER_COMPATIBILITY:')

          binding = claim_verification['binding']
          assert binding == verify_stdout['bindings']
          assert binding['claim_records_sha256'] == claim_records['records_sha256'] == meta['claim_records_sha256']
          assert binding['claim_report_json_sha256'] == meta['claim_report_json_sha256']
          assert binding['claim_report_markdown_sha256'] == meta['claim_report_markdown_sha256']

          records = {row['claim_id']: row for row in claim_records['records']}
          assert records['round-candidate']['evidence_status'] == 'INFERRED'
          assert records['round-candidate']['scope'] == {'level': 'DOMAIN_SPECIFIC', 'values': ['KOR_KLeague1']}
          assert records['round-predictive-value']['evidence_status'] == 'UNPROVEN'
          assert records['draw-signal-effectiveness']['evidence_status'] == 'UNPROVEN'
          assert records['draw-problem-solved']['evidence_status'] == 'UNPROVEN'
          assert records['training-authorization']['evidence_status'] == 'NOT_AUTHORIZED'
          assert records['round-run-authorization']['evidence_status'] == 'NOT_AUTHORIZED'
          assert report['cold_conclusion'].startswith('V5.0.3结构化结论已由当前准确HEAD的closure audit确定性生成')
          PY
      - name: Create measured workflow metadata before artifact upload
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from datetime import datetime, timezone
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-closure-audit-v503'
          closure = root / 'closure'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], encoding='utf-8').strip()
          audit = json.loads((closure / 'closure_audit.json').read_text(encoding='utf-8'))
          meta = json.loads((closure / 'metadata.json').read_text(encoding='utf-8'))
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'artifact_metadata.json':
                  files[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          artifact = {
              'schema_version': 'DRAW-SIGNAL-CLOSURE-ARTIFACT-V503-1.2',
              'observed_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'checkout_head': head,
              'evidence_head': head,
              'run_head': head,
              'previous_validated_head': os.environ['PREVIOUS_VALIDATED_HEAD'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_name': 'Football Draw Signal Closure Audit V5.0.3',
              'completed_before_metadata': [
                  'checkout', 'setup-python', 'exact-head-and-protected-asset-gates',
                  'historical-v502-tests', 'v503-production-counterexamples',
                  'full-closure-build', 'historical-v502-ledger-verification',
                  'deterministic-claim-verification',
              ],
              'artifact_upload_status_at_observed_at': 'PENDING_NOT_CLAIMED_AS_ACTUAL',
              'artifact_upload_proof_source': 'GitHub Actions artifact API after upload step completion',
              'provider_request_attempts': 0,
              'audit_code_external_request_attempts': 0,
              'external_request_attempts': 0,
              'external_request_attempts_scope': meta['external_request_attempts_scope'],
              'workflow_infrastructure_network_used': True,
              'workflow_infrastructure_network_scope': ['actions/checkout', 'actions/setup-python', 'actions/upload-artifact'],
              'api_football_key_accessed': False,
              'model_training': 0,
              'new_target_period_scoring': 0,
              'formal_weight': 0,
              'model_diff': 0,
              'formal_data_diff': 0,
              'config_diff': 0,
              'current_diff': 0,
              'decision': audit['decision'],
              'audit_sha256': audit['audit_sha256'],
              'rule_sha256': meta['rule_sha256'],
              'claim_records_sha256': meta['claim_records_sha256'],
              'claim_report_json_sha256': meta['claim_report_json_sha256'],
              'claim_report_markdown_sha256': meta['claim_report_markdown_sha256'],
              'files': files,
          }
          raw = json.dumps(artifact, ensure_ascii=False, indent=2) + '\n'
          (root / 'artifact_metadata.json').write_text(raw, encoding='utf-8')
          (closure / 'artifact_metadata.json').write_text(raw, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-draw-closure-audit-v503-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draw-closure-audit-v503
          retention-days: 30
          if-no-files-found: error

  windows-unicode-path-v503:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Full V5.0.3 audit in Windows Chinese path with native exit gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)

          function Invoke-CheckedNative {
            param(
              [Parameter(Mandatory=$true)][string]$Label,
              [Parameter(Mandatory=$true)][scriptblock]$Command
            )
            & $Command
            $code = $LASTEXITCODE
            if ($null -eq $code) { throw "$Label did not expose a native exit code" }
            if ($code -ne 0) { throw "$Label failed with exit code $code" }
          }

          $guardObserved = $false
          try {
            Invoke-CheckedNative -Label 'intentional native failure' -Command { python -X utf8 -c "import sys; sys.exit(1)" }
          }
          catch {
            if ($_.Exception.Message -notmatch 'intentional native failure failed with exit code 1') { throw }
            $guardObserved = $true
          }
          if (-not $guardObserved) { throw 'native exit-code guard counterexample did not fail closed' }

          Invoke-CheckedNative -Label 'outer exact HEAD' -Command { git rev-parse HEAD | Out-Null }
          $outerHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "outer exact HEAD read failed with exit code $LASTEXITCODE" }
          if ($outerHead -ne $env:EVIDENCE_HEAD) { throw 'exact HEAD mismatch' }

          $unicodeRoot = Join-Path $env:RUNNER_TEMP '足球项目维护\repo-pr77-v503'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'v503-windows-unicode-output'
          $inventory = Join-Path $outputRoot 'inventory'
          $closure = Join-Path $outputRoot 'closure'
          New-Item -ItemType Directory -Force -Path $outputRoot, $inventory, $closure | Out-Null
          Invoke-CheckedNative -Label 'git worktree add' -Command { git worktree add --detach "$unicodeRoot" $env:EVIDENCE_HEAD }
          try {
            Push-Location $unicodeRoot
            $env:PYTHONPATH = 'football-data/research;football-data/audit'
            Invoke-CheckedNative -Label 'V5.0.3 unit tests' -Command { python -X utf8 -m unittest football-data/tests/test_draw_signal_claim_contract_v503.py -v }
            Invoke-CheckedNative -Label 'V5.0.2 inventory under UTF-8 runtime' -Command { python -X utf8 football-data/research/draw_challenger_inventory_v502.py --output-dir "$inventory" }
            Invoke-CheckedNative -Label 'V5.0.3 closure build' -Command { python -X utf8 football-data/audit/draw_signal_closure_engine_v503.py --output-dir "$closure" }
            Invoke-CheckedNative -Label 'V5.0.2 ledger compatibility verification' -Command { python -X utf8 football-data/research/draw_signal_complete_ledger_v502.py --closure-dir "$closure" | Set-Content -Encoding UTF8 (Join-Path $outputRoot 'ledger_verify_stdout.json') }
            Invoke-CheckedNative -Label 'V5.0.3 claim verification' -Command { python -X utf8 football-data/audit/draw_signal_claim_contract_v503.py --closure-dir "$closure" --root . --verify-existing | Set-Content -Encoding UTF8 (Join-Path $outputRoot 'claim_verify_stdout.json') }

            $inventoryPath = Join-Path $inventory 'inventory.json'
            if (-not (Test-Path -LiteralPath $inventoryPath -PathType Leaf)) { throw 'inventory.json missing' }
            $inventoryObject = Get-Content -Raw -Encoding UTF8 $inventoryPath | ConvertFrom-Json -AsHashtable
            if ($inventoryObject['head'] -ne $env:EVIDENCE_HEAD) { throw 'inventory HEAD mismatch' }

            $closureVerificationPath = Join-Path $closure 'closure_verification.json'
            if (-not (Test-Path -LiteralPath $closureVerificationPath -PathType Leaf)) { throw 'closure_verification.json missing' }
            $closureVerification = Get-Content -Raw -Encoding UTF8 $closureVerificationPath | ConvertFrom-Json
            if ($closureVerification.status -ne 'PASS') { throw 'closure verification is not PASS' }

            $ledgerVerification = Get-Content -Raw -Encoding UTF8 (Join-Path $outputRoot 'ledger_verify_stdout.json') | ConvertFrom-Json
            if ($ledgerVerification.status -ne 'PASS') { throw 'historical ledger verification is not PASS' }
            $claimVerification = Get-Content -Raw -Encoding UTF8 (Join-Path $outputRoot 'claim_verify_stdout.json') | ConvertFrom-Json
            if ($claimVerification.status -ne 'PASS') { throw 'claim verifier is not PASS' }

            $receipt = Get-Content -Raw -Encoding UTF8 (Join-Path $closure 'audit_execution_receipt.json') | ConvertFrom-Json
            $audit = Get-Content -Raw -Encoding UTF8 (Join-Path $closure 'closure_audit.json') | ConvertFrom-Json
            $metadata = Get-Content -Raw -Encoding UTF8 (Join-Path $closure 'metadata.json') | ConvertFrom-Json
            if ($receipt.head -ne $env:EVIDENCE_HEAD) { throw 'receipt HEAD mismatch' }
            foreach ($obj in @($audit, $metadata, $receipt)) {
              if ($obj.provider_request_attempts -ne 0) { throw 'provider request count mismatch' }
              if ($obj.audit_code_external_request_attempts -ne 0) { throw 'audit-code external request count mismatch' }
              if ($obj.external_request_attempts -ne 0) { throw 'legacy compatibility request count mismatch' }
              if ($obj.external_request_attempts_scope -notlike 'V5.0.2_LEDGER_COMPATIBILITY:*') { throw 'legacy compatibility scope missing' }
            }
            Set-Content -Encoding UTF8 -Path (Join-Path $outputRoot 'native_exit_guard_self_test.txt') -Value 'PASS: intermediate native exit 1 was converted into a terminating PowerShell failure.'
          }
          finally {
            Pop-Location
            Invoke-CheckedNative -Label 'git worktree remove' -Command { git worktree remove --force "$unicodeRoot" }
          }
