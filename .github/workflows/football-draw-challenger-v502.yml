name: Football Draw Challenger V5.0.2 Research

on:
  push:
    branches: [research/draw-challenger-v502]
    paths:
      - "football-data/research/draw_challenger_*.py"
      - "football-data/tests/test_draw_challenger_*.py"
      - "football-data/research/contracts/draw_challenger_*.json"
      - ".github/workflows/football-draw-challenger-v502.yml"
  pull_request:
    branches: [main]
    paths:
      - "football-data/research/draw_challenger_*.py"
      - "football-data/tests/test_draw_challenger_*.py"
      - "football-data/research/contracts/draw_challenger_*.json"
      - ".github/workflows/football-draw-challenger-v502.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-draw-challenger-v502-${{ github.ref }}
  cancel-in-progress: false

env:
  EVIDENCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact head and no-provider static gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile football-data/research/draw_challenger_inventory_v502.py
          ! grep -R -nE 'API_FOOTBALL_KEY|api-sports|v3\.football\.api-sports|requests\.|httpx|aiohttp|urllib\.request' \
            football-data/research/draw_challenger_inventory_v502.py
      - name: Build read-only repository inventory and source bundle
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/draw-inventory"
          python football-data/research/draw_challenger_inventory_v502.py --output-dir "$out"
          mkdir -p "$out/source_bundle"
          files=(
            DRAW_AUDIT_HANDOFF.md
            football-data/validation/cache/v696_last_complete_season_1x2_rows.json
            football-data/validation/cache/v6169_joint_ipf_selection_rows.json
            football-data/benchmarks/v6_1x2_fixed1000_v6130.json
            football-data/benchmarks/v6_1x2_neutral_fixed1000_v6131.json
            football-data/validation/diagnose_1x2_accuracy_v696.py
            football-data/validation/evaluate_hierarchical_market_selector_v6474.py
            football-data/validation/v6_fresh_market_forward_challengers_v6492.py
            football-data/validation/v6_fullseason_2025_replay_v6506.py
            football-data/validation/v6_draw_residual_override_v670.py
            football-data/validation/v6_draw_triage_decision_v6508.py
            football-data/validation/v6_draw_risk_operating_point_v6509.py
            football-data/validation/validate_1x2_draw_risk_veto_v6130.py
            football-data/validation/generate_joint_ipf_selection_rows_v6169.py
            football-data/validation/evaluate_joint_ipf_selective_v6169.py
            football-data/engine/build_training_dataset.py
            football-data/engine/football_v460_engine.py
            football-data/engine/oof_matrix_calibration.py
            football-data/manifests/v6_draw_problem_resolution_v6510_status.json
            football-data/manifests/v6_draw_problem_resolution_v6512_status.json
            football-data/manifests/v6_draw_residual_override_v670_status.json
            football-data/manifests/v6_draw_risk_operating_point_v6509_status.json
            football-data/manifests/v6_1x2_accuracy_diagnostic_v696_status.json
          )
          for file in "${files[@]}"; do
            test -f "$file"
            mkdir -p "$out/source_bundle/$(dirname "$file")"
            cp "$file" "$out/source_bundle/$file"
          done
          (cd "$out/source_bundle" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$out/source_bundle_sha256.txt"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-inventory'
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          inv = json.loads((root / 'inventory.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert meta['checkout_head'] == inv['head'] == head == os.environ['EVIDENCE_HEAD']
          assert meta['formal_weight'] == 0
          assert meta['provider_network_used'] is False
          assert meta['external_request_attempts'] == 0
          assert meta['api_football_key_accessed'] is False
          assert meta['model_training'] == 0
          assert len(list((root / 'source_bundle').rglob('*'))) >= 20
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-draw-inventory-v502-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draw-inventory
          retention-days: 30
          if-no-files-found: error
