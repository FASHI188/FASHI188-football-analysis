# Independent route-aware closure audit; no model training or target-period scoring.
name: Football Draw Signal Closure Audit V5.0.2

on:
  push:
    branches: [research/draw-challenger-v502]
    paths:
      - "football-data/audit/draw_signal_asset_registry_v502.b85"
      - "football-data/audit/draw_signal_closure_engine_v502_r4.py"
      - "football-data/research/draw_challenger_*.py"
      - "football-data/research/draw_signal_*.py"
      - "football-data/tests/test_draw_signal_*.py"
      - ".github/workflows/football-draw-challenger-v502.yml"
  pull_request:
    branches: [main]
    paths:
      - "football-data/audit/draw_signal_asset_registry_v502.b85"
      - "football-data/audit/draw_signal_closure_engine_v502_r4.py"
      - "football-data/research/draw_challenger_*.py"
      - "football-data/research/draw_signal_*.py"
      - "football-data/tests/test_draw_signal_*.py"
      - ".github/workflows/football-draw-challenger-v502.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-draw-closure-audit-v502-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN: 605abf2d9f98c46f063106c7bd47193b96e588e4
  EVIDENCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  closure-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact-head no-provider and protected-asset gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          python -m py_compile \
            football-data/research/draw_challenger_inventory_v502.py \
            football-data/research/draw_signal_closure_engine_v502.py \
            football-data/research/draw_signal_closure_engine_v502_r3.py \
            football-data/audit/draw_signal_closure_engine_v502_r4.py \
            football-data/research/draw_signal_closure_audit_v502.py \
            football-data/research/draw_signal_complete_ledger_v502.py \
            football-data/tests/test_draw_signal_closure_audit_v502.py \
            football-data/tests/test_draw_signal_complete_ledger_v502.py
          test -s football-data/audit/draw_signal_asset_registry_v502.b85
          ! grep -R -nE 'API_FOOTBALL_KEY|api-sports|v3\.football\.api-sports|requests\.|httpx|aiohttp|urllib\.request' \
            football-data/research/draw_signal_closure_engine_v502_r3.py \
            football-data/audit/draw_signal_closure_engine_v502_r4.py \
            football-data/research/draw_signal_closure_audit_v502.py \
            football-data/research/draw_signal_complete_ledger_v502.py \
            football-data/tests/test_draw_signal_closure_audit_v502.py \
            football-data/tests/test_draw_signal_complete_ledger_v502.py
          changed="$(git diff --name-only "$BASE_MAIN"...HEAD)"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(models?|processed|team_strengths|config|CURRENT|formal_core_v460|oof_matrix_calibration_v461_status)'
      - name: Unit and adversarial tests for independent closure audit
        env:
          PYTHONPATH: football-data/research
        run: |
          python -m unittest football-data/tests/test_draw_signal_closure_audit_v502.py -v
          python -m unittest football-data/tests/test_draw_signal_complete_ledger_v502.py -v
      - name: Build route-aware read-only signal-closure audit
        shell: bash
        env:
          PYTHONPATH: football-data/research
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/draw-closure-audit"
          inventory="$root/inventory"
          closure="$root/closure"
          mkdir -p "$inventory" "$closure"
          python football-data/research/draw_challenger_inventory_v502.py --output-dir "$inventory"
          python football-data/research/draw_signal_closure_audit_v502.py --output-dir "$closure"
          python football-data/research/draw_signal_complete_ledger_v502.py --closure-dir "$closure"
          git status --short > "$root/git_status_after_audit.txt"
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'football-data/research')
          sys.path.insert(0, 'football-data/audit')
          import draw_signal_closure_engine_v502_r4 as core

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-closure-audit'
          audit = json.loads((root / 'closure' / 'closure_audit.json').read_text(encoding='utf-8'))
          meta = json.loads((root / 'closure' / 'metadata.json').read_text(encoding='utf-8'))
          feature = json.loads((root / 'closure' / 'feature_difference.json').read_text(encoding='utf-8'))
          complete = json.loads((root / 'closure' / 'complete_research_file_ledger.json').read_text(encoding='utf-8'))
          verification = json.loads((root / 'closure' / 'closure_verification.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()

          assert meta['checkout_head'] == audit['head'] == complete['head'] == head == os.environ['EVIDENCE_HEAD']
          assert verification['status'] == 'PASS'
          assert audit['decision'] in core.ALLOWED_DECISIONS
          assert meta['decision'] == audit['decision']
          assert audit['formal_weight'] == meta['formal_weight'] == 0
          assert audit['model_training'] == meta['model_training'] == 0
          assert audit['provider_network_used'] is False and meta['provider_network_used'] is False
          assert audit['external_request_attempts'] == meta['external_request_attempts'] == 0
          assert audit['api_football_key_accessed'] is False and meta['api_football_key_accessed'] is False

          coverage = audit['research_asset_coverage']
          assert coverage['all_covered'] is True
          assert coverage['missing'] == [] and coverage['extra'] == []
          assert coverage['inclusion_mismatch'] == [] and coverage['parse_failures'] == []
          assert complete['count'] == len(complete['rows'])
          assert all((row['included'] and row['inclusion_reason']) or ((not row['included']) and row['exclusion_reason']) for row in complete['rows'])

          route = audit['experiment_route_closure']
          if route['blocks_exhausted']:
              assert audit['decision'] != core.NEGATIVE_DECISION
          global_candidates = feature['EXISTING_PIT_SAFE_UNTESTED_FEATURES']
          domain_candidates = feature['DOMAIN_SPECIFIC_PIT_SAFE_UNTESTED_FEATURES']
          expected, prereg = core.decide_and_preregister(global_candidates, domain_candidates, route)
          assert audit['decision'] == expected
          assert audit['preregistration'] == prereg
          if expected == core.POSITIVE_DECISION:
              assert audit['preregistration']['run_authorized'] is False

          market_aliases = {'ahh','avgaha','avgahh','b365aha','b365ahh','b36ca','bfeaha','bfeahh','maxaha','maxahh','paha','pahh'}
          by_name = {row['field'].lower(): row for row in feature['fields']}
          assert market_aliases.issubset(by_name)
          assert all(by_name[name]['classification'] == 'RETROSPECTIVE_MARKET_REFERENCE_TIMESTAMP_UNPROVEN' for name in market_aliases)

          round_rows = [row for row in feature['fields'] if row['field'].lower() == 'round']
          assert len(round_rows) == 1
          round_row = round_rows[0]
          assert round_row['classification'] == 'PIT_SAFE_PREDICTION_TIME'
          assert round_row['qualifies_existing_pit_safe_untested'] is False
          assert round_row['qualifies_domain_specific_pit_safe_untested'] is True
          assert any(item['competition'] == 'KOR_KLeague1' and item['rows'] >= 500 and item['season_count'] >= 3 for item in round_row['eligible_domain_specific_scopes'])
          PY
      - name: Create exact-head artifact metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-closure-audit'
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          closure = json.loads((root / 'closure' / 'metadata.json').read_text(encoding='utf-8'))
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  files[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          metadata = {
              'checkout_head': head,
              'evidence_head': head,
              'run_head': head,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'decision': closure['decision'],
              'audit_sha256': closure['audit_sha256'],
              'formal_weight': 0,
              'provider_network_used': False,
              'external_request_attempts': 0,
              'api_football_key_accessed': False,
              'model_training': 0,
              'model_diff': 0,
              'formal_data_diff': 0,
              'config_diff': 0,
              'current_diff': 0,
              'files': files,
          }
          (root / 'artifact_metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-draw-closure-audit-v502-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draw-closure-audit
          retention-days: 30
          if-no-files-found: error
