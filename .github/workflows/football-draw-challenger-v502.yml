# V5.0.3 governance audit only; no training, scoring, provider, secret, or formal-asset mutation.
name: Football Draw Signal Closure Audit V5.0.3

on:
  push:
    branches: [research/draw-challenger-v502]
    paths:
      - "AGENTS.md"
      - "football-data/audit/football_draw_signal_closure_audit_v503.md"
      - "football-data/audit/draw_signal_claim_contract_v503.py"
      - "football-data/audit/draw_signal_closure_engine_v503.py"
      - "football-data/tests/test_draw_signal_claim_contract_v503.py"
      - ".github/workflows/football-draw-challenger-v502.yml"
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "football-data/audit/football_draw_signal_closure_audit_v503.md"
      - "football-data/audit/draw_signal_claim_contract_v503.py"
      - "football-data/audit/draw_signal_closure_engine_v503.py"
      - "football-data/tests/test_draw_signal_claim_contract_v503.py"
      - ".github/workflows/football-draw-challenger-v502.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-draw-closure-audit-v503-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_MAIN: 605abf2d9f98c46f063106c7bd47193b96e588e4
  PREVIOUS_VALIDATED_HEAD: 3330b1cdddbaaf34d9d9c496902e649b81870275
  EVIDENCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  closure-audit-v503:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact-head rule no-provider and protected-asset gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_HEAD"
          test -f AGENTS.md
          test -f football-data/audit/football_draw_signal_closure_audit_v503.md
          test "$(git ls-files -- football-data/audit/football_draw_signal_closure_audit_v503.md | wc -l)" -eq 1
          grep -Fq 'Football Draw Signal Closure Audit V5.0.3' football-data/audit/football_draw_signal_closure_audit_v503.md
          grep -Fq 'CURRENT_AUTHORITATIVE_RULE' football-data/audit/football_draw_signal_closure_audit_v503.md
          grep -Fq 'football-data/audit/football_draw_signal_closure_audit_v503.md' AGENTS.md
          python -m py_compile \
            football-data/research/draw_challenger_inventory_v502.py \
            football-data/research/draw_signal_closure_engine_v502.py \
            football-data/research/draw_signal_closure_engine_v502_r3.py \
            football-data/audit/draw_signal_closure_engine_v502_r4.py \
            football-data/audit/draw_signal_claim_contract_v503.py \
            football-data/audit/draw_signal_closure_engine_v503.py \
            football-data/research/draw_signal_complete_ledger_v502.py \
            football-data/tests/test_draw_signal_closure_audit_v502.py \
            football-data/tests/test_draw_signal_complete_ledger_v502.py \
            football-data/tests/test_draw_signal_claim_contract_v503.py
          ! grep -R -nE 'API_FOOTBALL_KEY|api-sports|v3\.football\.api-sports|requests\.|httpx|aiohttp|urllib\.request' \
            football-data/audit/draw_signal_claim_contract_v503.py \
            football-data/audit/draw_signal_closure_engine_v503.py \
            football-data/tests/test_draw_signal_claim_contract_v503.py
          changed="$(git diff --name-only "$BASE_MAIN"...HEAD)"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(models?|processed|team_strengths|config|CURRENT|formal_core_v460|oof_matrix_calibration_v461_status)'
      - name: Historical V5.0.2 audit tests
        env:
          PYTHONPATH: football-data/research
        run: |
          python -m unittest football-data/tests/test_draw_signal_closure_audit_v502.py -v
          python -m unittest football-data/tests/test_draw_signal_complete_ledger_v502.py -v
      - name: V5.0.3 claim-contract counterexample tests
        run: |
          python -m unittest football-data/tests/test_draw_signal_claim_contract_v503.py -v
      - name: Build V5.0.3 read-only closure and structured claims
        shell: bash
        env:
          PYTHONPATH: football-data/research:football-data/audit
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/draw-closure-audit-v503"
          inventory="$root/inventory"
          closure="$root/closure"
          mkdir -p "$inventory" "$closure"
          python football-data/research/draw_challenger_inventory_v502.py --output-dir "$inventory"
          python football-data/audit/draw_signal_closure_engine_v503.py --output-dir "$closure"
          python football-data/research/draw_signal_complete_ledger_v502.py --closure-dir "$closure"
          python football-data/audit/draw_signal_claim_contract_v503.py --closure-dir "$closure" --root . --verify-existing
          git status --short > "$root/git_status_after_audit.txt"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-closure-audit-v503'
          closure = root / 'closure'
          audit = json.loads((closure / 'closure_audit.json').read_text(encoding='utf-8'))
          meta = json.loads((closure / 'metadata.json').read_text(encoding='utf-8'))
          verification = json.loads((closure / 'closure_verification.json').read_text(encoding='utf-8'))
          claim_verification = json.loads((closure / 'claim_contract_verification.json').read_text(encoding='utf-8'))
          claim_records = json.loads((closure / 'claim_records.json').read_text(encoding='utf-8'))
          report = json.loads((closure / 'claim_report.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          assert head == os.environ['EVIDENCE_HEAD'] == audit['head'] == meta['checkout_head'] == claim_records['head']
          assert audit['rule_version'] == meta['rule_version'] == 'Football Draw Signal Closure Audit V5.0.3'
          assert audit['historical_relationship']['previous_version'] == 'Football Draw Signal Closure Audit V5.0.2'
          assert audit['historical_relationship']['previous_exact_head'] == os.environ['PREVIOUS_VALIDATED_HEAD']
          assert audit['historical_relationship']['silent_rewrite'] is False
          assert verification['status'] == claim_verification['status'] == 'PASS'
          assert report['accurate_object']['exact_new_head'] == head
          assert report['accurate_object']['previous_head'] == os.environ['PREVIOUS_VALIDATED_HEAD']
          assert audit['decision'] == 'PRE_REGISTRATION_REQUIRED_NO_TRAINING_YET'
          assert audit['preregistration']['status'] == 'PRE_REGISTERED_NOT_RUN'
          assert audit['preregistration']['run_authorized'] is False
          assert audit['preregistration']['formal_promotion_authorized'] is False
          assert audit['preregistration']['holdout_status'] == 'NOT_YET_PROVEN_UNTOUCHED'
          assert audit['formal_weight'] == meta['formal_weight'] == 0
          assert audit['model_training'] == meta['model_training'] == 0
          assert audit['new_target_period_scoring'] == meta['new_target_period_scoring'] == 0
          assert audit['provider_network_used'] is False and meta['provider_network_used'] is False
          assert audit['external_request_attempts'] == meta['external_request_attempts'] == 0
          assert audit['api_football_key_accessed'] is False and meta['api_football_key_accessed'] is False
          assert meta['model_diff'] == meta['formal_data_diff'] == meta['config_diff'] == meta['current_diff'] == 0
          assert audit['execution_boundary']['skipped_jobs'] == []
          assert audit['execution_boundary']['mock_used'] is False
          assert audit['execution_boundary']['real_network_requests'] == 0

          records = {row['claim_id']: row for row in claim_records['records']}
          assert records['round-candidate']['evidence_status'] == 'INFERRED'
          assert records['round-candidate']['scope'] == {'level': 'DOMAIN_SPECIFIC', 'values': ['KOR_KLeague1']}
          assert records['round-predictive-value']['evidence_status'] == 'UNPROVEN'
          assert records['draw-signal-effectiveness']['evidence_status'] == 'UNPROVEN'
          assert records['draw-problem-solved']['evidence_status'] == 'UNPROVEN'
          assert records['training-authorization']['evidence_status'] == 'NOT_AUTHORIZED'
          assert records['round-run-authorization']['evidence_status'] == 'NOT_AUTHORIZED'
          withdrawal = records['withdraw-exhausted']
          assert withdrawal['old_claim'] == 'EXISTING_DATA_DRAW_SIGNAL_EXHAUSTED_NO_NEW_TRAINING'
          assert '撤销' in withdrawal['withdrawal_statement']
          assert withdrawal['replacement_claim'] == 'PRE_REGISTRATION_REQUIRED_NO_TRAINING_YET'
          assert withdrawal['replacement_evidence_status'] == 'COMPUTED'
          assert report['cold_conclusion'].startswith('V5.0.3准确表述和证据边界合同已在准确HEAD完成验证')
          PY
      - name: Create exact-head V5.0.3 artifact metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'draw-closure-audit-v503'
          closure = root / 'closure'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          audit = json.loads((closure / 'closure_audit.json').read_text(encoding='utf-8'))
          meta = json.loads((closure / 'metadata.json').read_text(encoding='utf-8'))
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'artifact_metadata.json':
                  files[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          artifact = {
              'schema_version': 'DRAW-SIGNAL-CLOSURE-ARTIFACT-V503-1.0',
              'checkout_head': head,
              'evidence_head': head,
              'run_head': head,
              'previous_validated_head': os.environ['PREVIOUS_VALIDATED_HEAD'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_name': 'Football Draw Signal Closure Audit V5.0.3',
              'executed_job': 'closure-audit-v503',
              'skipped_jobs': [],
              'mock_used': False,
              'real_network_requests': 0,
              'provider_network_used': False,
              'external_request_attempts': 0,
              'api_football_key_accessed': False,
              'model_training': 0,
              'new_target_period_scoring': 0,
              'formal_weight': 0,
              'model_diff': 0,
              'formal_data_diff': 0,
              'config_diff': 0,
              'current_diff': 0,
              'decision': audit['decision'],
              'audit_sha256': audit['audit_sha256'],
              'rule_sha256': meta['rule_sha256'],
              'claim_records_sha256': meta['claim_records_sha256'],
              'files': files,
          }
          raw = json.dumps(artifact, ensure_ascii=False, indent=2) + '\n'
          (root / 'artifact_metadata.json').write_text(raw, encoding='utf-8')
          (closure / 'artifact_metadata.json').write_text(raw, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-draw-closure-audit-v503-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draw-closure-audit-v503
          retention-days: 30
          if-no-files-found: error
