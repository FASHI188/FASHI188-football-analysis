name: Football Draw Lineup Quality R3

on:
  push:
    branches: [research/draw-lineup-open-r1]
    paths:
      - '.github/workflows/football-draw-lineup-quality-r3.yml'
      - 'football-data/research/draw_lineup_quality_r3/**'
  pull_request:
    branches: [research/gold1000-r1-data-audit]
    paths:
      - '.github/workflows/football-draw-lineup-quality-r3.yml'
      - 'football-data/research/draw_lineup_quality_r3/**'

permissions:
  contents: read

concurrency:
  group: draw-lineup-quality-r3-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  component-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact research HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install frozen dependency
        run: python -m pip install --disable-pip-version-check --no-input scikit-learn==1.8.0
      - name: Compile component audit
        run: |
          python -m py_compile football-data/research/draw_lineup_quality_r2/run_epl_lineup_quality_r2.py
          python -m py_compile football-data/research/draw_lineup_quality_r3/run_component_audit_r3.py
      - name: Run post-R2 component audit
        run: |
          rm -rf lineup-component-evidence
          python football-data/research/draw_lineup_quality_r3/run_component_audit_r3.py \
            --audit football-data/research/draw_lineup_quality_r3/epl_lineup_quality_component_audit_r3.json \
            --r2-prereg football-data/research/draw_lineup_quality_r2/epl_lineup_quality_prereg_r2.json \
            --out lineup-component-evidence
      - name: Verify transparency and forward-only boundary
        env:
          CHECKED_OUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('lineup-component-evidence')
          receipt=json.loads((out/'EPL_LINEUP_QUALITY_COMPONENT_R3_receipt.json').read_text())
          result=json.loads((out/'EPL_LINEUP_QUALITY_COMPONENT_R3_result.json').read_text())
          assert receipt['dataset_rows']>=1200, receipt
          assert receipt['fold_metric_rows']==36, receipt
          assert receipt['source_downloads']==10, receipt
          assert receipt['historical_independent_claim_allowed'] is False, receipt
          assert receipt['2026_27_forward_required'] is True, receipt
          assert receipt['formal_weight']==0, receipt
          assert receipt['formal_model_data_config_current_writes']==[0,0,0,0], receipt
          assert result['post_hoc_historical_discovery'] is True, result
          assert result['independent_historical_validation'] is False, result
          assert result['promotion_allowed'] is False, result
          assert result['status'] in {'POST_HOC_FORWARD_CHALLENGER_FROZEN','NO_COMPONENT_FORWARD_CHALLENGER'}, result
          workflow={
            'schema_version':'EPL-LINEUP-QUALITY-COMPONENT-WORKFLOW-R3',
            'status':'COMPLETED_EXPLORATORY_FORWARD_ONLY',
            'checked_out_branch_head_sha':os.environ['CHECKED_OUT_SHA'],
            'run_id':os.environ['RUN_ID'],
            'external_football_api_credentials':0,
            'formal_weight':0,
            'formal_asset_writes':0,
            'historical_independent_claim_allowed':False,
            'future_2026_27_confirmation_required':True,
          }
          (out/'workflow_receipt.json').write_text(json.dumps(workflow,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest={'schema_version':'EPL-LINEUP-QUALITY-COMPONENT-FINAL-R3','files':{}}
          for path in sorted(out.iterdir()):
            if path.is_file() and path.name!='final_manifest.json':
              data=path.read_bytes()
              manifest['files'][path.name]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          (out/'final_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'receipt':receipt,'result_status':result['status']},ensure_ascii=False))
          PY
      - name: Upload component evidence
        uses: actions/upload-artifact@v4
        with:
          name: draw-lineup-quality-r3-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: lineup-component-evidence/
          if-no-files-found: error
          retention-days: 30
