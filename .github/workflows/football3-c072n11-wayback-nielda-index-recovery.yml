name: football3 C072-N11 archived Betfair index recovery

on:
  pull_request:
    branches:
      - football3/c072n10-multiline-pt-development-20260819
    paths:
      - '.github/workflows/football3-c072n11-wayback-nielda-index-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-label-index-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Recover archived directory index and probe linked files
        run: |
          set -euo pipefail
          mkdir -p artifacts/research/c072n11
          python - <<'PY'
          import html.parser, json, re, urllib.parse, urllib.request, time
          from pathlib import Path

          capture='https://web.archive.org/web/20110926073854id_/http://www.nielda.co.uk:80/bf/data/index.html'
          headers={'User-Agent':'football3-zero-label-source-audit/1.0'}
          def get(url,timeout=60):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(), r.headers.get('Content-Type','')
          class P(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a':
                      d=dict(attrs);h=d.get('href')
                      if h:self.links.append(h)
          errors=[]
          try:
              raw,ctype=get(capture)
              text=raw.decode('utf-8','replace')
          except Exception as e:
              raw=b'';ctype='';text='';errors.append({'stage':'index_fetch','error':type(e).__name__+': '+str(e)})
          p=P();p.feed(text)
          links=[]
          for h in p.links:
              if h.startswith(('#','?','javascript:','mailto:')):continue
              absu=urllib.parse.urljoin('http://www.nielda.co.uk/bf/data/index.html',h)
              if 'nielda.co.uk' not in absu:continue
              links.append(absu)
          links=sorted(set(links))
          probes=[]
          for u in links:
              if u.rstrip('/').endswith('/data') or u.endswith('index.html'):continue
              params=urllib.parse.urlencode({'url':u,'output':'json','filter':'statuscode:200','fl':'timestamp,original,mimetype,statuscode,digest,length','collapse':'digest'})
              cdx='https://web.archive.org/cdx/search/cdx?'+params
              try:
                  b,_=get(cdx,timeout=45); data=json.loads(b.decode('utf-8','replace'))
                  rows=[]
                  if data:
                      hd=data[0]; rows=[dict(zip(hd,x)) for x in data[1:]]
                  probes.append({'url':u,'captures':rows})
              except Exception as e:
                  probes.append({'url':u,'captures':[],'error':type(e).__name__+': '+str(e)})
              time.sleep(0.15)
          not_horses=[x for x in probes if 'not_horse' in x['url'].lower() or 'nothorse' in x['url'].lower()]
          payload={
              'schema_version':'C072N11_WAYBACK_NIELDA_INDEX_RECOVERY_V1',
              'project':'football3','zero_label':True,'outcome_values_accessed':0,'model_fit':0,
              'index_capture':capture,'index_bytes':len(raw),'index_content_type':ctype,
              'links_found':links,'probes':probes,'not_horses_candidates':not_horses,'errors':errors,
              'terminal':'ARCHIVED_DATA_FILES_FOUND' if any(x.get('captures') for x in not_horses) else ('INDEX_LINKS_FOUND' if links else 'INDEX_RECOVERY_STOP')
          }
          Path('artifacts/research/c072n11/wayback_nielda_index_recovery.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps({'terminal':payload['terminal'],'index_bytes':len(raw),'links':links,'not_horses_candidates':not_horses,'errors':errors},indent=2))
          PY
      - name: Enforce zero-label boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/research/c072n11/wayback_nielda_index_recovery.json').read_text())
          assert x['zero_label'] is True and x['outcome_values_accessed']==0 and x['model_fit']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072n11-wayback-nielda-index-recovery
          path: artifacts/research/c072n11/wayback_nielda_index_recovery.json
          if-no-files-found: error
          retention-days: 30
