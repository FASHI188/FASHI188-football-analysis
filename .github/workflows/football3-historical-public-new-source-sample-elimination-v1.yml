name: football3 Historical Public New Source Sample Elimination V1

on:
  push:
    branches: ['football3/historical-public-new-source-sample-elimination-v1']
    paths:
      - '.github/workflows/football3-historical-public-new-source-sample-elimination-v1.yml'
      - 'football-data/research/historical_public_new_source_sample_elimination_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PARENT_HEAD: 1a258d1da41bb5cac98e0db18e215a28ec1eb7ba
  GOVERNED_HEAD: 5d92a2135f5a3658f7f9391d5d8b928865b1b16c
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  B_HEAD: 9cb97764de1250fd08c6d0880559192e66352ce3
  PARENT_ARTIFACT_ID: '9971778580'
  PARENT_ARTIFACT_DIGEST: sha256:2f8a8b4899dba22f7783079c002bf11a65ce05d2f3e261e7ab948a8e379a2935
  STATSBOMB_OPEN_DATA_HEAD: b0bc9f22dd77c206ddedc1d742893b3bbe64baec
  OPTA_PUBLIC_SAMPLE_HEAD: 1b3faa7a030cc2210fe14086837217681eed865e
  OPTA_PUBLIC_SAMPLE_BLOB: d044caed1202f072845de6405ade7e52febb9160

jobs:
  seal-public-sample-elimination:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact lineage and frozen-boundary guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-public-new-source-sample-elimination-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$PARENT_HEAD" HEAD)" = "$PARENT_HEAD"
          test "$(git ls-remote origin refs/heads/football3/formal-gpt-runner-integration-v1 | cut -f1)" = "$GOVERNED_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/stage6-pre-b-preshot-deep-ppda-v1 | cut -f1)" = "$B_HEAD"
          changed="$(git diff --name-only "$PARENT_HEAD...HEAD")"
          if printf '%s\n' "$changed" | grep -E 'CURRENT|production_pointer|formal_enablement|stage6_pre_b_deep_ppda|stage6_pre_b_prospective|historical_fusion_v3_1_1_joint_score'; then
            echo 'forbidden frozen-path mutation' >&2; exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/football3-historical-public-new-source-sample-elimination-v1.yml|football-data/research/historical_public_new_source_sample_elimination_v1/*) ;;
              '') ;;
              *) echo "unexpected path: $p" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen elimination decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='football-data/research/historical_public_new_source_sample_elimination_v1/PUBLIC_NEW_SOURCE_SAMPLE_ELIMINATION.json'
          x=json.load(open(p))
          assert x['status']=='PUBLIC_NEW_SOURCE_SAMPLE_ELIMINATION_COMPLETE_COMMERCIAL_TARGET_PERIOD_SAMPLE_REQUIRED'
          assert x['parent_feasibility']['head']=='1a258d1da41bb5cac98e0db18e215a28ec1eb7ba'
          assert x['parent_feasibility']['artifact_id']==9971778580
          assert x['target_gate']['target_fixture_n']==5478
          assert x['target_gate']['minimum_bilateral_strict_pit_coverage']==0.98
          assert x['target_gate']['labels_required_for_this_stage'] is False
          assert x['target_gate']['model_fit_allowed_for_this_stage'] is False
          sb=x['public_samples'][0]
          assert sb['provider']=='Hudl StatsBomb'
          assert sb['pinned_commit']=='b0bc9f22dd77c206ddedc1d742893b3bbe64baec'
          assert sb['target_big5_competition_season_slot_n']==3
          assert sb['generous_full_season_fixture_upper_bound_n']==1140
          assert sb['generous_fixture_coverage_upper_bound'] < 0.98
          opta=x['public_samples'][1]
          assert opta['git_blob_sha']=='d044caed1202f072845de6405ade7e52febb9160'
          assert opta['sample_season']=='2011/2012'
          assert opta['target_period_fixture_n']==0
          wy=x['public_samples'][2]
          assert '2017/2018' in wy['public_dataset_scope']
          assert wy['target_period_fixture_n']==0
          d=x['decision']
          assert d['any_public_or_free_sample_certified_for_target_98pct_gate'] is False
          assert d['public_free_route_exhausted_for_current_target'] is True
          assert d['next_status']=='BLOCKED_ON_COMMERCIAL_TARGET_PERIOD_COVERAGE_MANIFEST_OR_VENDOR_SAMPLE'
          assert d['candidate_evaluation_allowed_now'] is False
          a=x['authorization']
          assert all(v is False for v in a.values())
          b=x['frozen_boundaries']
          assert b['historical_confirmation_2023']=='LOCKED_NOT_READ'
          assert b['prospective_1335']=='FORBIDDEN_NOT_TOUCHED'
          assert b['formal_v2_change'] is False and b['CURRENT_change'] is False
          PY

      - name: Verify parent provider-feasibility artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          test "$got" = "$PARENT_ARTIFACT_DIGEST"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" -o /tmp/parent.zip
          test "sha256:$(sha256sum /tmp/parent.zip | awk '{print $1}')" = "$PARENT_ARTIFACT_DIGEST"
          rm -rf _parent && mkdir _parent
          unzip -q /tmp/parent.zip -d _parent
          python - <<'PY'
          import json
          m=json.load(open('_parent/MANIFEST.json'))
          assert m['github_sha']=='1a258d1da41bb5cac98e0db18e215a28ec1eb7ba'
          assert m['status']=='NEW_PROVIDER_SOURCE_FEASIBILITY_COMPLETE_SAMPLE_REQUIRED'
          assert m['any_source_certified_now'] is False
          assert m['next_status']=='BLOCKED_ON_NEW_PROVIDER_SAMPLE_OR_ACCESS'
          assert m['provider_purchase_or_secret_authorized'] is False
          assert m['historical_confirmation_2023_opened'] is False
          assert m['prospective_1335_touched'] is False
          assert m['formal_model_changed'] is False and m['CURRENT_changed'] is False
          PY

      - name: Mechanically eliminate StatsBomb Open Data for target coverage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/hudl/open-data/${STATSBOMB_OPEN_DATA_HEAD}/data/competitions.json" -o /tmp/statsbomb_competitions.json
          python - <<'PY'
          import json, os, pathlib
          rows=json.load(open('/tmp/statsbomb_competitions.json'))
          big5={'1. Bundesliga','Premier League','La Liga','Ligue 1','Serie A'}
          seasons={'2020/2021','2021/2022','2022/2023'}
          slots=sorted({f"{r['competition_name']}|{r['season_name']}" for r in rows if r.get('competition_gender')=='male' and r.get('competition_name') in big5 and r.get('season_name') in seasons})
          expected=sorted(['La Liga|2020/2021','Ligue 1|2021/2022','Ligue 1|2022/2023'])
          assert slots==expected, (slots,expected)
          target_n=5478
          generous_upper=1140
          coverage=generous_upper/target_n
          assert coverage < 0.98
          out={
            'schema_version':'football3-public-source-mechanical-verification-v1',
            'statsbomb_open_data_head':os.environ['STATSBOMB_OPEN_DATA_HEAD'],
            'target_slots_present':slots,
            'target_slots_present_n':len(slots),
            'target_slots_total':15,
            'generous_full_season_fixture_upper_bound_n':generous_upper,
            'target_fixture_n':target_n,
            'generous_fixture_coverage_upper_bound':coverage,
            'statsbomb_open_data_target_98pct_gate':False
          }
          pathlib.Path('_verify').mkdir(exist_ok=True)
          pathlib.Path('_verify/public_source_mechanical_verification.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY

      - name: Verify authentic public Opta F24 sample is out of target period
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/iKhaled/MCFCAnalytics/${OPTA_PUBLIC_SAMPLE_HEAD}/Bolton_ManCityF24.xml" -o /tmp/Bolton_ManCityF24.xml
          test "$(git hash-object /tmp/Bolton_ManCityF24.xml)" = "$OPTA_PUBLIC_SAMPLE_BLOB"
          grep -q 'Opta::Feed::XML::Soccer::F24' /tmp/Bolton_ManCityF24.xml
          grep -q 'season_name="Season 2011/2012"' /tmp/Bolton_ManCityF24.xml
          grep -q '<Event ' /tmp/Bolton_ManCityF24.xml
          grep -q ' x="' /tmp/Bolton_ManCityF24.xml
          grep -q ' y="' /tmp/Bolton_ManCityF24.xml

      - name: Seal public-sample elimination evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{decision,parent_evidence,verification}
          cp football-data/research/historical_public_new_source_sample_elimination_v1/PUBLIC_NEW_SOURCE_SAMPLE_ELIMINATION.json _seal/decision/
          cp _parent/MANIFEST.json _seal/parent_evidence/NEW_PROVIDER_SOURCE_FEASIBILITY_MANIFEST.json
          cp _verify/public_source_mechanical_verification.json _seal/verification/
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal')
          d=json.load(open(root/'decision/PUBLIC_NEW_SOURCE_SAMPLE_ELIMINATION.json'))
          v=json.load(open(root/'verification/public_source_mechanical_verification.json'))
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          m={
            'schema_version':'football3-public-new-source-sample-elimination-artifact-v1',
            'github_sha':os.environ['GITHUB_SHA'],
            'parent_head':os.environ['PARENT_HEAD'],
            'status':d['status'],
            'public_free_route_exhausted':True,
            'statsbomb_generous_target_coverage_upper_bound':v['generous_fixture_coverage_upper_bound'],
            'opta_public_sample_target_period_fixture_n':0,
            'wyscout_public_sample_target_period_fixture_n':0,
            'any_public_or_free_sample_certified':False,
            'next_status':d['decision']['next_status'],
            'preferred_first_request':d['decision']['preferred_first_request'],
            'preferred_second_request':d['decision']['preferred_second_request'],
            'provider_purchase_authorized':False,
            'provider_secret_authorized':False,
            'historical_confirmation_2023_opened':False,
            'prospective_1335_touched':False,
            'formal_model_changed':False,
            'CURRENT_changed':False,
            'files':files
          }
          (root/'MANIFEST.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload sealed public-sample elimination
        uses: actions/upload-artifact@v4
        with:
          name: football3-public-new-source-sample-elimination-${{ github.sha }}
          path: _seal
          if-no-files-found: error
          retention-days: 90
