name: football3-nova-n10-referee-sky-remaining5-recovery

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_sky_remaining5_recovery_registry_v1.json'
      - 'governance/football3/nova_n10_referee_sky_remaining5_recovery_v1.py'
      - 'governance/football3/test_nova_n10_referee_sky_remaining5_recovery_v1.py'
      - '.github/workflows/football3-nova-n10-referee-sky-remaining5-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-nova-n10-referee-sky-remaining5-recovery-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-sky-remaining5-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile             governance/football3/nova_n10_referee_sky_season_inventory_v1.py             governance/football3/nova_n10_referee_sky_deep_pagination_v1.py             governance/football3/nova_n10_referee_sky_remaining5_recovery_v1.py             governance/football3/test_nova_n10_referee_sky_remaining5_recovery_v1.py
          PYTHONPATH=governance/football3             python governance/football3/test_nova_n10_referee_sky_remaining5_recovery_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 5 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Recover final five Sky publication gaps
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_sky_remaining5_recovery_v1.py             --registry governance/football3/nova_n10_referee_sky_remaining5_recovery_registry_v1.json             --ledger governance/football3/nova_n10_referee_aia_canonical_round_ledger_v1.json             --out _run 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/sky_remaining5_receipt.json'))
          assert r['classification'] in {'POSITIVE_SIGNAL_SOURCE_COVERAGE','PARTIAL_SOURCE_COVERAGE','STOP_DATA_COVERAGE'}
          assert r['target_rounds']==[6,8,23,27,34]
          assert r['target_round_n']==5
          assert r['page_cap']==20
          assert 33 <= r['combined_covered_round_n'] <= 38
          assert abs(r['combined_coverage'] - r['combined_covered_round_n']/38.0) < 1e-12
          assert r['raw_archive_html_persisted'] is False
          assert r['raw_article_prefix_persisted'] is False
          assert r['summary_text_read'] is False
          assert r['article_body_read'] is False
          assert r['referee_assignment_body_parsed'] is False
          assert r['independent_immutable_archive_witness'] is False
          assert r['formal_available_at_proven'] is False
          assert r['fixture_level_binding_complete'] is False
          assert r['referee_oof_allowed'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['match_payload_read'] is False
          assert r['standings_payload_read'] is False
          assert r['player_stats_payload_read'] is False
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          if r['classification']=='POSITIVE_SIGNAL_SOURCE_COVERAGE':
              assert r['combined_covered_round_n']==38
              assert r['remaining_gap_rounds']==[]
              assert r['archive_day_error_n']==0
              assert r['pagination_truncated_day_n']==0
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-sky-remaining5-recovery-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
