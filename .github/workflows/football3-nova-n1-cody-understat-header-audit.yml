name: football3-nova-n1-cody-understat-header-audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'governance/football3/nova_n1_cody_understat_header_audit_v1.py'
      - 'governance/football3/test_nova_n1_cody_understat_header_audit_v1.py'
      - '.github/workflows/football3-nova-n1-cody-understat-header-audit.yml'

permissions:
  contents: read

concurrency:
  group: football3-nova-n1-cody-understat-header-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  header_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact branch and unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = 'football3/nova-n1-lagged-deep-ppda-v1'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m py_compile \
            governance/football3/nova_n1_external_archive_header_audit_v1.py \
            governance/football3/nova_n1_cody_understat_header_audit_v1.py \
            governance/football3/test_nova_n1_cody_understat_header_audit_v1.py
          cd governance/football3
          python test_nova_n1_cody_understat_header_audit_v1.py -v

      - name: Audit Cody archive headers without data rows
        shell: bash
        run: |
          set -euo pipefail
          python governance/football3/nova_n1_cody_understat_header_audit_v1.py --out n1_cody_header_audit
          python - <<'PY'
          import json
          p=json.load(open('n1_cody_header_audit/cody_understat_header_audit.json',encoding='utf-8'))
          r=p['report']
          assert p['source_page_license_evidence']['declared_license']=='MIT'
          assert p['data_rows_opened']==0 and p['test_labels_read'] is False
          assert r['archive_data_rows_opened']==0 and r['archive_label_values_read']==0
          assert r['test_result_vault_opened'] is False and r['test_labels_read'] is False
          assert r['candidate']['target_leagues']==['Bundesliga','Serie A','Ligue 1']
          print(json.dumps({'status':r['status'],'schema_files':r.get('locked_schema_candidate_files',[])},sort_keys=True))
          PY

      - name: Upload Cody header-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: football3-nova-n1-cody-understat-header-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: n1_cody_header_audit/
          if-no-files-found: error
          retention-days: 90
