name: football3 Batch-001 unified historical S60 replay

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/runtime/run_batch001_unified_s60_replay.py
      - football-data/runtime/run_batch001_unified_s60_replay_v2.py
      - football-data/pipeline/s60_numerical_baseline.py
      - football-data/pipeline/runtime_authority.py
      - football-data/pipeline/unified_inference.py
      - football-data/identity/team_identity.py
      - football-data/pit/feature_store.py
      - football-data/assembly/feature_assembler.py
      - .github/workflows/football3-batch001-stage2-historical-s60-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch001-unified-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact governance HEAD
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked S60 runtime
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Materialize exact frozen R9b 20k source snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Download frozen R24 60k history artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Download immutable Batch-001 cohort
        uses: actions/download-artifact@v4
        with:
          name: football3-batch001-100match-lock
          path: football-data/experiments/batch001_stage2_historical_s60_replay/batch_lock_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32976447136
      - name: Prohibit direct R24 R23 R17 replay bypass
        run: |
          set -euo pipefail
          if grep -nE 'import run_experiment_r(24|23|17)|from .*top1_r(24|23|17)' \
            football-data/runtime/run_batch001_unified_s60_replay.py \
            football-data/runtime/run_batch001_unified_s60_replay_v2.py; then
            echo 'direct legacy replay bypass detected' >&2
            exit 1
          fi
      - name: Run locked 100 through unified S60 replay
        run: python football-data/runtime/run_batch001_unified_s60_replay_v2.py
      - name: Verify unified replay contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('football-data/runtime/results/batch001_unified_s60_replay')
          d = json.loads((p/'batch001_unified_s60_predictions_locked.json').read_text())
          r = json.loads((p/'receipt.json').read_text())
          assert d['status'] == 'PREDICTIONS_LOCKED_UNIFIED_S60_BASELINE_ONLY'
          assert d['rows'] == 100 and len(d['predictions']) == 100
          assert d['runtime_authority']['canonical_operational_baseline'] == 'S60'
          u = d['unified_contract']
          assert u['team_identity_resolver_used'] and u['shared_pit_store_used']
          assert u['feature_assembler_used'] and u['unified_inference_engine_used']
          assert u['activation_receipt_emitted_per_fixture']
          assert u['direct_r24_r23_r17_runtime_calls'] is False
          assert not u['lineup_numeric_1x2_enabled'] and not u['player_technical_numeric_1x2_enabled']
          assert not u['head_coach_numeric_1x2_enabled'] and not u['availability_numeric_1x2_enabled']
          assert r['rows'] == 100 and r['activation_receipts'] == 100
          assert r['canonical_operational_baseline'] == 'S60' and r['unified_pipeline'] is True
          for z in d['predictions']:
              assert abs(z['p_home'] + z['p_draw'] + z['p_away'] - 1.0) < 1e-9
              assert z['activation_receipt'].get('receipt_hash')
              assert z['component_chain'][0]['component_id'] == 'S60_stage_primary_numerical_baseline'
          print('BATCH001_UNIFIED_REPLAY_PASS')
          PY
      - name: Upload unified replay lock and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch001-unified-s60-replay
          path: football-data/runtime/results/batch001_unified_s60_replay/
          if-no-files-found: warn
          retention-days: 90

# Governance-only retrigger marker: replay identity diagnostic v4; no numerical contract change.
