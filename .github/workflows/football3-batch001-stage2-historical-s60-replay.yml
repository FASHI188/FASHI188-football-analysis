name: football3 Batch-001 stage2 historical S60 replay

on:
  push:
    branches:
      - football3/batch001-stage2-historical-s60-replay
    paths:
      - football-data/experiments/batch001_stage2_historical_s60_replay/run_stage2.py
      - .github/workflows/football3-batch001-stage2-historical-s60-replay.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  batch001-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Batch-001 stage2 branch
        uses: actions/checkout@v4
        with:
          ref: football3/batch001-stage2-historical-s60-replay
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Download immutable Batch-001 cohort
        uses: actions/download-artifact@v4
        with:
          name: football3-batch001-100match-lock
          path: football-data/experiments/batch001_stage2_historical_s60_replay/batch_lock_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32976447136
      - name: Run strict historical S60 replay
        run: python football-data/experiments/batch001_stage2_historical_s60_replay/run_stage2.py run
      - name: Verify Batch-001 stage2 contract
        run: python football-data/experiments/batch001_stage2_historical_s60_replay/run_stage2.py verify
      - name: Persist locked baseline predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch001_stage2_historical_s60_replay/results/batch001_s60_predictions_locked.json football-data/experiments/batch001_stage2_historical_s60_replay/data/mapping_audit_stage2.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[locked] football3 Batch-001 historical S60 predictions'
            git push origin HEAD:football3/batch001-stage2-historical-s60-replay
          fi
      - name: Upload Batch-001 stage2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch001-stage2-historical-s60-replay
          path: |
            football-data/experiments/batch001_stage2_historical_s60_replay/results/batch001_s60_predictions_locked.json
            football-data/experiments/batch001_stage2_historical_s60_replay/data/mapping_audit_stage2.json
          if-no-files-found: error
          retention-days: 90
