name: Football Beat The Bookie Coverage R39B

on:
  push:
    branches:
      - research/beat-the-bookie-timeseries-r39b
    paths:
      - '.github/workflows/football-beat-the-bookie-coverage-r39b.yml'
      - 'football-data/research/beat_the_bookie_r39/coverage_registration_r39b.json'
      - 'football-data/research/beat_the_bookie_r39/diagnose_hourly_coverage_r39b.py'
  pull_request:
    branches:
      - research/betfair-kaggle-timestamp-coverage-r39a
    paths:
      - '.github/workflows/football-beat-the-bookie-coverage-r39b.yml'
      - 'football-data/research/beat_the_bookie_r39/coverage_registration_r39b.json'
      - 'football-data/research/beat_the_bookie_r39/diagnose_hourly_coverage_r39b.py'

permissions:
  contents: read

concurrency:
  group: football-beat-the-bookie-coverage-r39b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-no-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify frozen coverage contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/beat_the_bookie_r39/diagnose_hourly_coverage_r39b.py
          python -m json.tool football-data/research/beat_the_bookie_r39/coverage_registration_r39b.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/beat_the_bookie_r39/coverage_registration_r39b.json').read_text())
          assert r['sanitization_contract']['workflow_must_remove_score_columns_before_python_coverage_process'] is True
          assert r['sanitization_contract']['matches_files_must_not_be_opened'] is True
          assert r['next_stage_gate']['target_matches']==100
          assert r['next_stage_gate']['result_labels_allowed_in_this_stage'] is False
          assert r['hard_limits']['formal_weight']==0
          print('PASS_R39B_COVERAGE_CONTRACT')
          PY

      - name: Download independent source
        run: |
          set -euo pipefail
          rm -rf r39b-source r39b-sanitized r39b-source.zip
          mkdir -p r39b-source r39b-sanitized
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset' \
            -o r39b-source.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('r39b-source.zip')
          wanted={'odds_series.csv.gz','odds_series_b.csv.gz'}
          names=set(z.namelist())
          assert wanted <= names, (wanted,names)
          for name in wanted: z.extract(name,'r39b-source')
          print({'extracted':sorted(wanted)})
          PY

      - name: Strip score columns before coverage process
        run: |
          set -euo pipefail
          for base in odds_series odds_series_b; do
            gzip -dc "r39b-source/${base}.csv.gz" \
              | cut -d',' -f1-3,6- \
              | gzip -c > "r39b-sanitized/${base}_no_scores.csv.gz"
          done
          python - <<'PY'
          import csv,gzip
          for base in ('odds_series','odds_series_b'):
              p=f'r39b-sanitized/{base}_no_scores.csv.gz'
              with gzip.open(p,'rt',encoding='utf-8-sig',newline='') as f:
                  h=next(csv.reader(f))
              assert h[:3]==['match_id','match_date','match_time']
              assert 'score_home' not in h and 'score_away' not in h
              assert len(h)==32*72*3+3, (base,len(h))
              print(base,len(h),'sanitized')
          PY
          rm -rf r39b-source r39b-source.zip

      - name: Run no-label hourly coverage diagnostic
        run: |
          set -euo pipefail
          rm -rf r39b-coverage-output
          python football-data/research/beat_the_bookie_r39/diagnose_hourly_coverage_r39b.py \
            --registration football-data/research/beat_the_bookie_r39/coverage_registration_r39b.json \
            --source-dir r39b-sanitized \
            --out-dir r39b-coverage-output

      - name: Verify boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('r39b-coverage-output/status.json').read_text())
          assert s['status'] in {
            'PASS_R39B_PREFERRED_HOURLY_TRAJECTORY_COVERAGE_NO_LABELS',
            'PASS_R39B_MINIMUM_HOURLY_TRAJECTORY_COVERAGE_NO_LABELS',
            'STOP_R39B_HOURLY_TRAJECTORY_COVERAGE_BELOW_100_NO_LABELS'
          }
          n=s['no_label_audit']
          assert n['original_score_columns_removed_before_python'] is True
          assert n['score_columns_present_in_python_input'] is False
          assert n['matches_files_opened']==0
          assert n['closing_odds_file_opened']==0
          assert n['score_values_accessed']==0
          assert n['result_values_accessed']==0
          assert n['prediction_metrics_computed']==0
          assert n['match_identities_locked']==0
          h=s['hard_limits']
          assert h['formal_weight']==0 and h['CURRENT_mutation']==0 and h['main_mutation']==0
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Upload R39B coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-beat-the-bookie-coverage-r39b-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: r39b-coverage-output/
          if-no-files-found: error
          retention-days: 30
