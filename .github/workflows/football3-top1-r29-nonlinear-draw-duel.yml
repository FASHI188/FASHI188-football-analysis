name: football3 top1 R29 nonlinear draw duel

on:
  push:
    branches:
      - football3/top1-r29-nonlinear-draw-duel
    paths:
      - football-data/experiments/top1_r29_nonlinear_draw_duel/run_experiment_r29.py
      - .github/workflows/football3-top1-r29-nonlinear-draw-duel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r29:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r29-nonlinear-draw-duel
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R29 nonlinear draw duel
        run: python football-data/experiments/top1_r29_nonlinear_draw_duel/run_experiment_r29.py run
      - name: Verify R29 contract
        run: python football-data/experiments/top1_r29_nonlinear_draw_duel/run_experiment_r29.py verify
      - name: Persist R29 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r29_nonlinear_draw_duel/results/summary_r29.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R29 nonlinear draw duel'
            git push origin HEAD:football3/top1-r29-nonlinear-draw-duel
          fi
      - name: Upload R29 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r29-nonlinear-draw-duel
          path: football-data/experiments/top1_r29_nonlinear_draw_duel/results/summary_r29.json
          if-no-files-found: error
          retention-days: 90
