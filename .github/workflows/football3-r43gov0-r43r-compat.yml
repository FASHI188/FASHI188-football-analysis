name: football3 R43GOV0 M5D R43R compatibility

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/r43r_football_residual.py
      - football-data/tests/test_r43r_football_residual_compat.py
      - .github/workflows/football3-r43gov0-r43r-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r43r-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Fetch exact pinned R43R source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r43r/source
          curl -L --fail --retry 3 -o /tmp/r43r/source/run_r43r0.py https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/b76ecc841e7b52320d73a7045874765386c2f8e6/football-data/experiments/r43r0_strong_shrink_football_residual/run_r43r0.py
          test "$(git hash-object /tmp/r43r/source/run_r43r0.py)" = "8748e795bb92780c47af934c3187db14c254a415"
      - name: Compile M5D R component
        run: |
          python -m py_compile football-data/components/r43r_football_residual.py
          python -m py_compile football-data/tests/test_r43r_football_residual_compat.py
      - name: Run exact source compatibility tests
        env:
          R43R_SOURCE_FILE: /tmp/r43r/source/run_r43r0.py
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43r_football_residual_compat.py' -v 2>&1 | tee /tmp/r43r_compat_test.log
      - name: Upload M5D diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5d-r43r-diagnostic
          path: /tmp/r43r_compat_test.log
          if-no-files-found: error
          retention-days: 30
      - name: Write M5D R gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5d_r43r_compat_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5d-r43r-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "source_component": "R43R0 strong-shrink football residual",
            "source_blob_sha": "8748e795bb92780c47af934c3187db14c254a415",
            "source_commit": "b76ecc841e7b52320d73a7045874765386c2f8e6",
            "residual_formula_migrated": true,
            "beta_fit_migrated": true,
            "ridge_penalty": 40.0,
            "beta_bounds": [-0.5, 0.5],
            "exact_source_compatibility": true,
            "enabled_by_default": false,
            "historical_architecture_gate_passed": false,
            "historical_breakthrough_candidate": false,
            "historical_action": "DO_NOT_PROMOTE_AND_DO_NOT_RETUNE_ON_THIS_SETTLED_OVERLAP",
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M5E_migrate_R43U_diagonal_gain_disabled"
          }
          JSON
      - name: Upload M5D R gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5d-r43r-compat-gate
          path: football-data/governance/r43gov0/results/m5d_r43r_compat_gate.json
          if-no-files-found: error
          retention-days: 90
