name: Football Betfair Draw Trajectory Pilot R2 Owner Command Dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-once:
    if: >-
      github.event.issue.number == 105 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/dispatch-betfair-draw-r2-final 57a9023352e24188bd2cbcd37bd896d8'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove no prior workflow_dispatch run exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              "/actions/workflows/football-betfair-draw-trajectory-pilot-run-r2.yml/runs"
              "?event=workflow_dispatch&per_page=10"
          )
          req=urllib.request.Request(
              url,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              payload=json.load(response)
          count=int(payload.get('total_count',0))
          if count != 0:
              raise SystemExit(f'blocked: existing workflow_dispatch run count={count}')
          print('no prior workflow_dispatch run exists')
          PY
      - name: Dispatch exact one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'ref':'main',
              'inputs':{'authorization_nonce':'57a9023352e24188bd2cbcd37bd896d8'},
          }).encode('utf-8')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/football-betfair-draw-trajectory-pilot-run-r2.yml/dispatches",
              data=payload,
              method='POST',
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f'unexpected dispatch status {response.status}')
              print('workflow_dispatch accepted')
          PY
      - name: Record accepted owner command
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body=(
              '## R2 one-time workflow dispatch accepted\n\n'
              '- duplicate-run guard: no prior workflow_dispatch run existed\n'
              '- command source: repository-owner comment on PR #105\n'
              '- target workflow: `football-betfair-draw-trajectory-pilot-run-r2.yml`\n'
              '- target ref: `main`\n'
              '- actual experiment event: `workflow_dispatch`\n'
              '- expected workflow run number: `1`\n'
              '- expected run attempt: `1`\n'
              '- no Betfair data or labels were read by this dispatcher.\n'
          )
          payload=json.dumps({'body':body}).encode('utf-8')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/105/comments",
              data=payload,
              method='POST',
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              print(response.status)
          PY
