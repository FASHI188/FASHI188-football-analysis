name: Football V5.1 Failure Domain Audit R9

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "football-data/config/v510_failure_domain_audit_r9.json"
      - "football-data/validation/evaluate_v510_failure_domain_audit_r9.py"
      - "football-data/validation/evaluate_v510_core_joint_chain_r8.py"
      - "football-data/validation/evaluate_v510_full_range_score_allocation_r4.py"
      - "football-data/validation/evaluate_v510_online_ensemble_ablation_r7.py"
      - "football-data/validation/evaluate_v510_nonlinear_continuation_boosting_r6.py"
      - "football-data/validation/evaluate_v510_prequential_algorithm_challenge_r3.py"
      - "football-data/validation/v510_historical_structure_features_r1.py"
      - "football-data/validation/v510_historical_structure_model_r1.py"
      - "football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py"
      - "football-data/processed/**/*.csv"
      - ".github/workflows/football-v510-failure-domain-audit-r9.yml"

permissions:
  contents: read

concurrency:
  group: football-v510-failure-domain-audit-r9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile R9 evaluator
        run: python -m py_compile football-data/validation/evaluate_v510_failure_domain_audit_r9.py
      - name: Run R9 self-test
        run: python football-data/validation/evaluate_v510_failure_domain_audit_r9.py --self-test
      - name: Materialize audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Evaluate R9 failure domains
        run: python football-data/validation/evaluate_v510_failure_domain_audit_r9.py
      - name: Show compact receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v510_failure_domain_audit_r9_status.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
            'status':x.get('status'),
            'reproduction':x.get('reproduction'),
            'dimension_summary':x.get('dimension_summary'),
            'robust_degradation_domains':x.get('robust_degradation_domains'),
            'ruling':x.get('ruling'),
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload R9 receipts
        uses: actions/upload-artifact@v4
        with:
          name: v510-failure-domain-audit-r9
          path: |
            football-data/manifests/v510_failure_domain_audit_r9_status.json
            football-data/manifests/v510_failure_domain_audit_r9_groups.csv
            football-data/manifests/v510_failure_domain_audit_r9_worst_domains.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no repository persistence
        run: |
          git status --short
          test -z "$(git diff --cached --name-only)"
