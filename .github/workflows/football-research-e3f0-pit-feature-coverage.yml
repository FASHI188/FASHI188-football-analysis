name: Football Research E3f-0 PIT Feature Coverage

on:
  pull_request:
    branches:
      - research/e3e1-draw-stability-audit
    paths:
      - "football-data/research/e3f0_pit_feature_coverage.py"
      - "football-data/research/e3f0_pit_feature_coverage_entry.py"
      - "football-data/research/contracts/e3f0_pit_feature_coverage_contract.md"
      - ".github/workflows/football-research-e3f0-pit-feature-coverage.yml"
  push:
    branches:
      - research/e3f0-pit-feature-coverage
    paths:
      - "football-data/research/e3f0_pit_feature_coverage.py"
      - "football-data/research/e3f0_pit_feature_coverage_entry.py"
      - "football-data/research/contracts/e3f0_pit_feature_coverage_contract.md"
      - ".github/workflows/football-research-e3f0-pit-feature-coverage.yml"

permissions:
  contents: read

concurrency:
  group: football-research-e3f0-pit-feature-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-pit-feature-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact research branch HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact research HEAD
        id: exact_head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "expected_head=${EXPECTED_HEAD}"
          echo "actual_head=${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"
          git diff --exit-code
          echo "sha=${actual_head}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2

      - name: Syntax check
        run: |
          python -m py_compile \
            football-data/research/e3f0_pit_feature_coverage.py \
            football-data/research/e3f0_pit_feature_coverage_entry.py

      - name: Verify coverage audit contract
        run: |
          set -euo pipefail
          contract=football-data/research/contracts/e3f0_pit_feature_coverage_contract.md
          test -f "${contract}"
          grep -F 'formal_weight: `0`' "${contract}"
          grep -F 'does not authorize model training' "${contract}"
          grep -F 'current-match shots' "${contract}"
          grep -F 'fixed full sample: `6,251` matches' "${contract}"

      - name: Run research-only E3f-0 coverage audit
        env:
          PYTHONPATH: football-data/engine:football-data/validation:football-data/research
          PYTHONUTF8: "1"
        run: |
          python football-data/research/e3f0_pit_feature_coverage_entry.py --print-summary

      - name: Verify source report HEAD and contracts
        if: success()
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("artifacts/research/e3f0_pit_feature_coverage/e3f0_pit_feature_coverage.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert report["research_status"] == "PASS"
          assert report["repository_head"] == actual
          assert report["sample"]["count"] == 6251
          assert report["b100"]["count"] == 100
          assert report["leakage_rules"]["new_candidate_model_fit"] is False
          assert report["verdict"]["training_allowed_next"] is False
          assert all(value == 0 for value in report["formal_mutation"].values())
          print({"actual_head": actual, "sample": 6251, "b100": 100})
          PY

      - name: Upload E3f-0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-e3f0-pit-feature-coverage-${{ steps.exact_head.outputs.sha }}
          path: artifacts/research/e3f0_pit_feature_coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected formal assets were not changed
        if: always()
        run: |
          git diff --exit-code -- football-data/models football-data/config football-data/processed football-data/raw
          git diff --exit-code
