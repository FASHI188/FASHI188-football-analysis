name: football3-nova-n10-referee-sky-combined-freeze

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_sky_combined_freeze_registry_v1.json'
      - 'governance/football3/nova_n10_referee_sky_combined_freeze_v1.py'
      - 'governance/football3/test_nova_n10_referee_sky_combined_freeze_v1.py'
      - '.github/workflows/football3-nova-n10-referee-sky-combined-freeze-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-nova-n10-referee-sky-combined-freeze-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-sky-combined-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile             governance/football3/nova_n10_referee_sky_combined_freeze_v1.py             governance/football3/test_nova_n10_referee_sky_combined_freeze_v1.py
          PYTHONPATH=governance/football3             python governance/football3/test_nova_n10_referee_sky_combined_freeze_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 6 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Freeze accepted parent artifacts into one 38-round ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_sky_combined_freeze_v1.py             --registry governance/football3/nova_n10_referee_sky_combined_freeze_registry_v1.json             --out _run 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/sky_combined_freeze_receipt.json'))
          assert r['status']=='N10_REFEREE_SKY_COMBINED_38_ROUND_FREEZE_COMPLETE'
          assert r['classification']=='POSITIVE_SIGNAL_SOURCE_COVERAGE_FROZEN'
          assert r['parent_artifact_n']==3
          assert r['artifact_digest_verified_n']==3
          assert r['parent_receipt_sha_verified_n']==3
          assert r['parent_evidence_sha_verified_n']==3
          assert r['round_n']==38 and r['coverage_round_n']==38 and r['coverage']==1.0
          assert r['identity_anomaly_rounds']==[23]
          assert r['network_source_reacquisition'] is False
          assert r['search_performed'] is False
          assert r['article_body_read'] is False
          assert r['referee_assignment_body_parsed'] is False
          assert r['match_payload_read'] is False and r['standings_payload_read'] is False and r['player_stats_payload_read'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['formal_available_at_proven'] is False
          assert r['fixture_level_binding_complete'] is False
          assert r['referee_oof_allowed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          ledger=json.load(open('_run/sky_combined_publication_ledger.json'))
          assert [x['round'] for x in ledger['rows']]==list(range(1,39))
          assert ledger['identity_anomaly_rounds']==[23]
          anom=json.load(open('_run/sky_identity_anomaly_ledger.json'))
          assert anom['anomaly_n']==1 and anom['anomaly_rounds']==[23]
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-sky-combined-freeze-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
