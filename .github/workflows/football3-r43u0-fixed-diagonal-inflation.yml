name: football3 R43U0 fixed diagonal inflation

on:
  push:
    branches:
      - football3/r43u0-fixed-diagonal-inflation
    paths:
      - football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py
      - .github/workflows/football3-r43u0-fixed-diagonal-inflation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43u0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43u0-fixed-diagonal-inflation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify inherited dependencies
        run: |
          test -f football-data/forward/v6_market_first_events_v651.json
          python -m py_compile football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py
          python -m py_compile football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py
      - name: Run R43U0 fixed diagonal inflation
        run: python football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py run
      - name: Verify R43U0 contract
        run: python football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py verify
      - name: Persist R43U0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43u0_fixed_diagonal_inflation/results/summary_r43u0_fixed_diagonal_inflation.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43U0 fixed diagonal inflation'
            git fetch origin football3/r43u0-fixed-diagonal-inflation
            git rebase origin/football3/r43u0-fixed-diagonal-inflation
            git push origin HEAD:football3/r43u0-fixed-diagonal-inflation
          fi
      - name: Upload R43U0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43u0-fixed-diagonal-inflation
          path: football-data/experiments/r43u0_fixed_diagonal_inflation/results/summary_r43u0_fixed_diagonal_inflation.json
          if-no-files-found: error
          retention-days: 90
