name: Football V6.49.6 Unseen-Domain Selector Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_unseen_domain_shadow_v6496.py"
      - ".github/workflows/football-v6496-unseen-domain-shadow.yml"

permissions:
  contents: write

concurrency:
  group: football-v6496-unseen-domain-shadow
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Synchronize latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile shadow audit
        run: python -m py_compile football-data/validation/v6_unseen_domain_shadow_v6496.py

      - name: Freeze or evaluate unseen-domain shadow
        run: python football-data/validation/v6_unseen_domain_shadow_v6496.py

      - name: Persist only shadow freeze and receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_unseen_domain_shadow_v6496_freeze.json \
            --allow-prefix football-data/manifests/v6_unseen_domain_shadow_v6496_status.json \
            --message-prefix "audit(football): persist V6.49.6 unseen-domain shadow"

      - name: Hard governance guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_unseen_domain_shadow_v6496_status.json')
          if not p.exists(): raise SystemExit('shadow receipt missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          g=x.get('governance') or {}
          if x.get('status') != 'PASS': raise SystemExit(str(x))
          if g.get('active_selector_change') is not False: raise SystemExit('active selector change forbidden')
          if g.get('probability_mutation') is not False: raise SystemExit('probability mutation forbidden')
          if g.get('threshold_change') is not False: raise SystemExit('threshold change forbidden')
          if g.get('historical_backfill') is not False: raise SystemExit('historical backfill forbidden')
          if g.get('formal_weight') != 0: raise SystemExit('formal weight must remain zero')
          if g.get('automatic_promotion') is not False: raise SystemExit('automatic promotion forbidden')
          print(json.dumps({'population':x.get('population'),'decision':(x.get('evaluation') or {}).get('decision')},ensure_ascii=False))
          PY

# Diagnostic only. V6.49.2 remains the unique active 1X2 forward chain.
# No unseen-domain shadow score can alter a pick, probability, threshold, or formal weight.
# Retrigger while the current UCL unseen-domain fixtures are still pre-kickoff; semantics unchanged.
