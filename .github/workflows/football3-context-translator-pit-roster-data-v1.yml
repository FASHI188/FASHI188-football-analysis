name: football3 Context Translator PIT roster data v1
on:
  push:
    branches: [football3/context-translator-pit-roster-data-v1]
    paths:
      - '.github/workflows/football3-context-translator-pit-roster-data-v1.yml'
      - 'football-data/research/context_translator_v1/pit_roster_data.py'
      - 'football-data/research/context_translator_v1/pit_roster_candidate_b_diagnostic.py'
      - 'football-data/research/context_translator_v1/test_pit_roster_data.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe public source archives without labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pit_roster_out
          python - <<'PY'
          import json,urllib.request,xml.etree.ElementTree as ET,hashlib,datetime
          ua={'User-Agent':'football3-research-pit-audit/1.0 (+public research; no result ingestion)'}
          def get(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=30) as r:return r.read(),dict(r.headers)
          out={'schema_version':'football3-pit-roster-source-probe-v1','collected_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':{}}
          for name,url in [('sportsmole_robots','https://www.sportsmole.co.uk/robots.txt'),('sportsmole_sitemap_index','https://www.sportsmole.co.uk/sitemap_index.xml')]:
              try:
                  b,h=get(url);out['sources'][name]={'ok':True,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':h.get('Content-Type'),'preview':b[:5000].decode('utf-8','replace')}
              except Exception as e:out['sources'][name]={'ok':False,'url':url,'error':repr(e)}
          sample='https://www.sportsmole.co.uk/football/wolfsburg/preview/wolfsburg-vs-hoffenheim-prediction-team-news-lineups_535813.html'
          cdx='https://web.archive.org/cdx/search/cdx?url='+urllib.parse.quote(sample,safe='')+'&output=json&fl=timestamp,original,statuscode,digest&filter=statuscode:200&from=2024&to=2024'
          try:
              b,h=get(cdx);out['sources']['wayback_cdx_sample']={'ok':True,'url':cdx,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'preview':b[:10000].decode('utf-8','replace')}
          except Exception as e:out['sources']['wayback_cdx_sample']={'ok':False,'url':cdx,'error':repr(e)}
          open('pit_roster_out/source_probe.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2)[:20000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-pit-roster-source-probe-${{ github.sha }}-${{ github.run_id }}
          path: pit_roster_out/
          if-no-files-found: error
          retention-days: 30
