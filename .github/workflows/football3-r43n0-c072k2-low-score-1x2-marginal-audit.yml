name: football3 R43N0 C072K2 low-score 1X2 marginal audit

on:
  push:
    branches:
      - football3/r43n0-c072k2-low-score-1x2-marginal-audit
    paths:
      - football-data/research/r43n0_c072k2_low_score_1x2_marginal_audit.py
      - .github/workflows/football3-r43n0-c072k2-low-score-1x2-marginal-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43n0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43n0-c072k2-low-score-1x2-marginal-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install pandas==2.2.3 numpy==2.1.3 scikit-learn==1.7.1
      - name: Verify frozen C072K2 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/research/evaluate_c072k2_joint_low_score_confirm.py)" = "cefad42f4913221b46f76763e80f7dd018b9ba57"
          test -f football-data/research/c072k2_confirmation_result.json
          python -m py_compile football-data/research/r43n0_c072k2_low_score_1x2_marginal_audit.py
      - name: Run R43N0 marginal audit
        run: python football-data/research/r43n0_c072k2_low_score_1x2_marginal_audit.py run
      - name: Verify R43N0 contract
        run: python football-data/research/r43n0_c072k2_low_score_1x2_marginal_audit.py verify
      - name: Persist R43N0 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/research/r43n0_c072k2_low_score_1x2_marginal_audit.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43N0 C072K2 low-score 1X2 marginal audit'
            git fetch origin football3/r43n0-c072k2-low-score-1x2-marginal-audit
            git rebase origin/football3/r43n0-c072k2-low-score-1x2-marginal-audit
            git push origin HEAD:football3/r43n0-c072k2-low-score-1x2-marginal-audit
          fi
      - name: Upload R43N0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43n0-c072k2-low-score-1x2-marginal-audit
          path: football-data/research/r43n0_c072k2_low_score_1x2_marginal_audit.json
          if-no-files-found: error
          retention-days: 90
