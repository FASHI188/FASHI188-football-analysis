name: Football R39M Snapshot Recovery Evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39m-snapshot-recovery-evaluation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39m-snapshot-recovery-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  snapshot-recovery-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Enforce unique first-attempt recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/football-r39m-snapshot-recovery-evaluation.yml/runs?branch=research%2Flineup-attack-recency-r39m&per_page=20" -o /tmp/recovery-runs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          cur=int(os.environ['GITHUB_RUN_ID']);runs=json.loads(Path('/tmp/recovery-runs.json').read_text()).get('workflow_runs',[])
          prior=[int(r['id']) for r in runs if int(r['id'])!=cur and r.get('head_branch')=='research/lineup-attack-recency-r39m']
          assert not prior,f'prior R39M snapshot recovery evaluation run(s) exist: {prior}'
          print('PASS_R39M_UNIQUE_FIRST_SNAPSHOT_RECOVERY_EVALUATION')
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify frozen science, binding, failed original evaluation and recovery preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json)" = "01046fb1412f434c973b6369169cc6059ff6f9d2"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json)" = "b87d52023815469592128c43d2dab0406765d54a"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json)" = "de2c4ba33d0ed2a0f85c76b96f63a875daf59615"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py)" = "a465ea1d3ff59db25f166d248f31f89ab62fdeb4"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluate_recency_r39m.py)" = "300d896d66ce554c62ec3acf96d208ae9f0c4531"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json)" = "d18347c5551049013dfe653c04fdfeb9183432ea"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py)" = "db9662313e92181e43edbadb050208215a445708"
          for rid in 31353952166 31354815583; do
            curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" -o "/tmp/run-${rid}.json"
            curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}/artifacts" -o "/tmp/art-${rid}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          fail=json.loads(Path('/tmp/run-31353952166.json').read_text());fa=json.loads(Path('/tmp/art-31353952166.json').read_text())
          pre=json.loads(Path('/tmp/run-31354815583.json').read_text());pa=json.loads(Path('/tmp/art-31354815583.json').read_text())
          assert fail['status']=='completed' and fail['conclusion']=='failure' and fa.get('artifacts',[])==[]
          assert pre['status']=='completed' and pre['conclusion']=='success' and pre['head_sha']=='cb19f513aae8b0c14fe9bf4a9e8c2748fb43cb02'
          arts=pa.get('artifacts',[]);assert len(arts)==1
          x=arts[0];assert x['id']==9050261095
          assert x.get('digest')=='sha256:f77233591f06bc9d9fbb7fbacf09e8a18b17bafe85a7748f0e1467bd83027c8c'
          print('PASS_R39M_SNAPSHOT_RECOVERY_AUTHORIZATION')
          PY
          python football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py \
            --self-test --prereg football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json \
            --contract football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json \
            --snapshot-binding football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json \
            --feature-snapshot /tmp/nonexistent --raw-dir /tmp --out-dir /tmp
      - name: Download and verify exact frozen feature snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf r39m-snapshot-input r39m-raw r39m-output
          mkdir -p r39m-snapshot-input r39m-raw r39m-output
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9050139416/zip" -o /tmp/r39m-snapshot.zip
          echo "d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575  /tmp/r39m-snapshot.zip" | sha256sum -c -
          unzip -q /tmp/r39m-snapshot.zip -d r39m-snapshot-input
          echo "da7f3c94292207342e4ae170492458af320eae0b685124123d186faf911ec6b4  r39m-snapshot-input/feature_snapshot_r39m.csv" | sha256sum -c -
          echo "a502fca9ede0c457db33c7dd129da5fe4b4d6947551594fd498378a3f95fe978  r39m-snapshot-input/snapshot_receipt_r39m.json" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39m-snapshot-input/snapshot_receipt_r39m.json').read_text())
          assert r['status']=='PASS_R39M_ZERO_LABEL_FROZEN_FEATURE_SNAPSHOT'
          assert r['rows']=={'all':9434,'preholdout':8161,'holdout_2526':1273,'fixed100':100}
          assert r['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert all(v==0 for v in r['zero_label_contract'].values())
          print('PASS_R39M_RECOVERY_EXACT_FEATURE_SNAPSHOT')
          PY
      - name: Download Football-Data result-label files only
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "r39m-raw/${season}_${div}.csv"
            done
          done
      - name: Execute frozen snapshot-bound R39M sequence
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py \
            --prereg football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json \
            --contract football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json \
            --snapshot-binding football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json \
            --feature-snapshot r39m-snapshot-input/feature_snapshot_r39m.csv \
            --raw-dir r39m-raw --out-dir r39m-output
      - name: Verify terminal scientific and label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39m-output/r39m_result.json').read_text())
          ff=json.loads(Path('r39m-output/feature_freeze_receipt_r39m.json').read_text())
          assert ff['feature_freeze_completed'] is True
          assert ff['input_mode']=='hash_locked_zero_label_feature_snapshot'
          assert ff['snapshot_artifact_id']==9050139416
          assert ff['snapshot_artifact_sha256']=='d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575'
          assert ff['snapshot_csv_sha256']=='da7f3c94292207342e4ae170492458af320eae0b685124123d186faf911ec6b4'
          assert ff['target_labels_accessed_before_feature_freeze']==0
          assert ff['preholdout_rows']==8161 and ff['holdout_pool_rows']==1273 and ff['fixed100_rows']==100
          assert ff['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          allowed={'STOP_R39M_BEFORE_POLICY_AND_HOLDOUT_RECENCY_NO_ROLLING_INCREMENT','STOP_R39M_BEFORE_HOLDOUT_RECENCY_NO_POLICY_INCREMENT','PASS_R39M_RECENCY_LINEUP_ATTACK_FIXED100_EXPLORATORY_ONLY','NO_R39M_RECENCY_LINEUP_ATTACK_INCREMENT_FIXED100'}
          assert r['status'] in allowed
          fr=json.loads(Path('r39m-output/final_freeze_receipt_r39m.json').read_text())
          if r['status'].startswith('STOP_R39M_BEFORE_'):
              assert r['holdout_labels_accessed']==0
              assert fr['final_freeze_completed'] is False
              assert fr['holdout_labels_accessed_before_freeze']==0
          else:
              assert r['holdout_labels_accessed']==100
              assert fr['final_freeze_completed'] is True
              assert fr['holdout_labels_accessed_before_freeze']==0
          print(json.dumps({'status':r['status'],'selected_dynamic':r.get('selected_dynamic'),'rolling_development':r.get('rolling_development'),'policy':r.get('policy'),'holdout':r.get('holdout'),'holdout_labels_accessed':r['holdout_labels_accessed']},indent=2))
          PY
      - name: Delete all downloaded source and snapshot inputs before artifact
        run: rm -rf r39m-raw r39m-snapshot-input /tmp/r39m-snapshot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39m-snapshot-recovery-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39m-output/
          if-no-files-found: error
          retention-days: 30
