name: football3-nova-free-history-source-discovery

on:
  pull_request:
  push:
    branches:
      - football3/nova-free-history-source-discovery-v1

permissions:
  contents: read

concurrency:
  group: football3-nova-free-history-source-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-free-history-source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile source governance
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            governance/football3/validate_nova_free_history_source_catalog_v1.py \
            governance/football3/test_nova_free_history_source_catalog_v1.py

      - name: Run source catalog tests
        shell: bash
        run: |
          set -euo pipefail
          cd governance/football3
          python test_nova_free_history_source_catalog_v1.py -v

      - name: Emit zero-label source discovery receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p free_history_source_receipt
          python governance/football3/validate_nova_free_history_source_catalog_v1.py \
            --catalog governance/football3/nova_free_history_source_catalog_v1.json \
            --receipt free_history_source_receipt/receipt.json
          python - <<'PY'
          import json
          p = json.load(open("free_history_source_receipt/receipt.json", encoding="utf-8"))
          assert p["status"] == "PASS"
          assert p["qualified_reusable_source_count"] >= 8
          assert p["n1_big3_status"] == "STOP_DATA_COVERAGE"
          assert p["labels_opened"] == 0
          assert p["formal_v2_changed"] is False
          assert p["current_changed"] is False
          assert p["production_changed"] is False
          PY

      - name: Upload source discovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: football3-nova-free-history-source-discovery-${{ github.sha }}-${{ github.run_id }}
          path: free_history_source_receipt/
          if-no-files-found: error
          retention-days: 90
