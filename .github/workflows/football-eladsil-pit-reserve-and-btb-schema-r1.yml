name: Football eladsil PIT reserve and BTB schema R1

on:
  push:
    branches: [research/anonymous-data-reserve-r1]
    paths:
      - '.github/workflows/football-eladsil-pit-reserve-and-btb-schema-r1.yml'

permissions:
  contents: read

jobs:
  eladsil-reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build PIT-safe sealed 400-match reserve from odds file only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/elad football-data/research/anonymous_data_reserve_r1/eladsil_pit_reserve
          curl -sS -L --fail --retry 2 --max-time 300 \
            'https://www.kaggle.com/api/v1/datasets/download/eladsil/football-games-odds' \
            -o /tmp/elad/source.zip
          # Extract ONLY the odds file; Results file is never opened.
          unzip -p /tmp/elad/source.zip Matches_Odds.csv > /tmp/elad/Matches_Odds.csv
          python -m pip -q install python-dateutil
          python - <<'PY'
          import csv,json,hashlib,math
          from pathlib import Path
          from collections import defaultdict
          from dateutil import parser

          ODDS_SHA='bfa14f07a11581ffd793b1f44d3e7c9203c631d26ac1c692fe71a77f66579298'
          p=Path('/tmp/elad/Matches_Odds.csv'); assert hashlib.sha256(p.read_bytes()).hexdigest()==ODDS_SHA
          outdir=Path('football-data/research/anonymous_data_reserve_r1/eladsil_pit_reserve')
          def d(s):
              try:return parser.parse(str(s))
              except:return None
          g={}; rows=0; bad=0; post_or_close=0
          with p.open('r',encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f)
              assert set(['match_id','date_start','competition_name','date_created','home_team_name','away_team_name','home_team_odd','away_team_odd','tie_odd']).issubset(r.fieldnames or [])
              for x in r:
                  rows+=1
                  try:
                      mid=str(x['match_id']).strip(); ks=d(x['date_start']); obs=d(x['date_created'])
                      vals=[float(x['home_team_odd']),float(x['tie_odd']),float(x['away_team_odd'])]
                      if not mid or ks is None or obs is None or not all(math.isfinite(v) and v>1 for v in vals): raise ValueError
                  except Exception:
                      bad+=1; continue
                  lead=(ks-obs).total_seconds()/3600.0
                  z=g.setdefault(mid,{'match_id':mid,'kickoff':ks,'competition':x['competition_name'],'home':x['home_team_name'],'away':x['away_team_name'],'all_obs':set(),'pit1h_obs':set(),'pit6h_obs':set(),'rows':0})
                  z['rows']+=1; z['all_obs'].add(obs)
                  if lead>=1: z['pit1h_obs'].add(obs)
                  else: post_or_close+=1
                  if lead>=6: z['pit6h_obs'].add(obs)

          def make_reserve(hours,key):
              out=[]
              for z in g.values():
                  ss=sorted(z[key])
                  if len(ss)<2: continue
                  last=ss[-1]; first=ss[0]
                  last_lead=(z['kickoff']-last).total_seconds()/3600
                  first_lead=(z['kickoff']-first).total_seconds()/3600
                  out.append({'match_id':z['match_id'],'competition':z['competition'],'home':z['home'],'away':z['away'],'kickoff':z['kickoff'].isoformat(),'distinct_pit_timestamps':len(ss),'first_quote_hours_before':first_lead,'last_quote_hours_before':last_lead})
              return out
          r1=make_reserve(1,'pit1h_obs'); r6=make_reserve(6,'pit6h_obs')
          # Stronger reserve uses >=6h, >=2 independent observed timestamps.
          reserve=r6
          seed='ELADSIL-PIT6H-RESERVE-20260817-R1'
          reserve=sorted(reserve,key=lambda m:hashlib.sha256(f"{seed}|{m['match_id']}".encode()).hexdigest())
          batch_size=400; batches=[]; used=0
          for i in range(0,len(reserve),batch_size):
              b=reserve[i:i+batch_size]
              if len(b)<300: break
              bid=f'ELAD-PIT6H-B{len(batches)+1:03d}'
              payload={'schema_version':'ELADSIL-PIT6H-BATCH-R1','batch_id':bid,'status':'SEALED_UNOPENED','batch_size':len(b),'source_odds_sha256':ODDS_SHA,
                       'pit_gate':'Matches_Odds only; >=2 valid full-1X2 timestamps each >=6h before date_start','selection_uses_outcomes':False,'outcome_values_dereferenced':0,'matches':b}
              q=outdir/f'{bid}.json'; q.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
              batches.append({'batch_id':bid,'n':len(b),'manifest_sha256':hashlib.sha256(q.read_bytes()).hexdigest()}); used+=len(b)
          def st(a):
              a=sorted(a)
              if not a:return None
              return {'min':a[0],'median':a[len(a)//2],'p90':a[int(.9*(len(a)-1))],'max':a[-1]}
          inv={'schema_version':'ELADSIL-PIT-RESERVE-INVENTORY-R1','source':'kaggle:eladsil/football-games-odds','source_odds_sha256':ODDS_SHA,'raw_odds_rows':rows,'bad_odds_rows':bad,
               'unique_match_ids':len(g),'matches_ge2_timestamps_Tminus1h':len(r1),'matches_ge2_timestamps_Tminus6h':len(r6),
               'reserve_gate':'T-6h >=2 timestamps','reserve_matches':len(reserve),'timestamp_count':st([x['distinct_pit_timestamps'] for x in reserve]),
               'last_quote_hours_before':st([x['last_quote_hours_before'] for x in reserve]),'sealed_batch_size':batch_size,'sealed_batches':len(batches),'sealed_matches':used,'tail_unsealed':len(reserve)-used,
               'batches':batches,'results_file_opened':False,'outcome_values_dereferenced':0,'hard_rule':'At most one preregistered sealed 300-500 match batch may open result labels per experiment; every other batch remains unopened.'}
          (outdir/'inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(inv,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eladsil-pit6h-reserve-r1
          path: football-data/research/anonymous_data_reserve_r1/eladsil_pit_reserve/*.json
          retention-days: 30

  btb-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect gzip CSV headers only, no data rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/btb football-data/research/anonymous_data_reserve_r1/beat_the_bookie_schema
          curl -sS -L --fail --retry 2 --max-time 300 \
            'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset' \
            -o /tmp/btb/source.zip
          python - <<'PY'
          import zipfile,gzip,io,json,hashlib,csv
          from pathlib import Path
          p=Path('/tmp/btb/source.zip'); out={'schema_version':'BTB-HEADER-ONLY-R1','zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'members':[],'data_rows_read':0,'outcome_values_dereferenced':0}
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if not n.endswith('.csv.gz'): continue
                  with z.open(n) as raw:
                      gz=gzip.GzipFile(fileobj=raw)
                      line=gz.readline().decode('utf-8-sig',errors='replace').rstrip('\r\n')
                  header=next(csv.reader([line])) if line else []
                  out['members'].append({'path':n,'compressed_member_bytes':z.getinfo(n).file_size,'header':header})
          Path('football-data/research/anonymous_data_reserve_r1/beat_the_bookie_schema/inventory.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beat-the-bookie-header-only-r1
          path: football-data/research/anonymous_data_reserve_r1/beat_the_bookie_schema/inventory.json
          retention-days: 30
