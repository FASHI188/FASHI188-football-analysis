name: football-v629-score-driven-random100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_score_driven_ordered_1x2_random100_v6290.py'
      - '.github/workflows/football-v629-score-driven-random100.yml'

permissions:
  contents: read

jobs:
  random100:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile
        run: |
          python -m py_compile football-data/validation/validate_score_driven_ordered_1x2_random100_v6290.py

      - name: Run V6.29 score-driven ordered-logit random100
        run: |
          python football-data/validation/validate_score_driven_ordered_1x2_random100_v6290.py

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6290-score-driven-ordered-1x2-random100-receipt
          path: football-data/manifests/v6_score_driven_ordered_1x2_random100_v6290_status.json
          if-no-files-found: error
