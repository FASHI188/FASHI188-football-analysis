name: football3 R43T0 dynamic bivariate residual state

on:
  push:
    branches:
      - football3/r43t0-dynamic-bivariate-residual-state
    paths:
      - football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py
      - .github/workflows/football3-r43t0-dynamic-bivariate-residual-state.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43t0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43t0-dynamic-bivariate-residual-state
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify frozen market dependency
        run: |
          test -f football-data/forward/v6_market_first_events_v651.json
          python -m py_compile football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py
          python -m py_compile football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py
      - name: Run R43T0 dynamic bivariate state
        run: python football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py run
      - name: Verify R43T0 contract
        run: python football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py verify
      - name: Persist R43T0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43t0_dynamic_bivariate_residual_state/results/summary_r43t0_dynamic_bivariate_residual_state.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43T0 dynamic bivariate residual state'
            git fetch origin football3/r43t0-dynamic-bivariate-residual-state
            git rebase origin/football3/r43t0-dynamic-bivariate-residual-state
            git push origin HEAD:football3/r43t0-dynamic-bivariate-residual-state
          fi
      - name: Upload R43T0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43t0-dynamic-bivariate-residual-state
          path: football-data/experiments/r43t0_dynamic_bivariate_residual_state/results/summary_r43t0_dynamic_bivariate_residual_state.json
          if-no-files-found: error
          retention-days: 90
