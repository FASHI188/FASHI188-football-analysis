name: football3 Batch-001 stage4a robust S70

on:
  push:
    branches:
      - football3/batch001-stage4a-robust-s70
    paths:
      - football-data/experiments/batch001_stage4a_robust_s70/run_stage4a.py
      - .github/workflows/football3-batch001-stage4a-robust-s70.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage4a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch001-stage4a-robust-s70
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Generate locked S70 robust predictions
        run: python football-data/experiments/batch001_stage4a_robust_s70/run_stage4a.py run
      - name: Verify Stage4A contract
        run: python football-data/experiments/batch001_stage4a_robust_s70/run_stage4a.py verify
      - name: Persist locked candidate predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch001_stage4a_robust_s70/results/batch001_stage4a_s70_robust_locked.json
          git commit -m '[locked] football3 Batch-001 S70 robust predictions' || true
          git push origin HEAD:football3/batch001-stage4a-robust-s70
      - name: Upload Stage4A artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch001-stage4a-robust-s70
          path: football-data/experiments/batch001_stage4a_robust_s70/results/batch001_stage4a_s70_robust_locked.json
          if-no-files-found: error
          retention-days: 90
