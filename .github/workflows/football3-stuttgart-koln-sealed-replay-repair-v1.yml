name: Football3 Stuttgart Koln Sealed Replay Repair V1

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-identity-repair-v1
    types: [edited, reopened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-stuttgart-koln-sealed-replay-repair-v1
  cancel-in-progress: false

jobs:
  sealed-replay:
    if: ${{ github.event.pull_request.head.ref == 'football3/formal-gpt-runner-request-carrier-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and pin exact frozen replay request
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources football-data/formal_gpt_gateway_v1/output
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          body=os.environ['PR_BODY']
          begin='<!-- football3-request-json -->'; end='<!-- /football3-request-json -->'
          if begin not in body or end not in body:
              raise SystemExit('request carrier markers missing')
          req=json.loads(body.split(begin,1)[1].split(end,1)[0].strip())
          expected={
              'schema_version':'football3-formal-gpt-gateway-v1',
              'mode':'predict',
              'request_id':'stuttgart-koln-frozen-replay-20260904-004',
              'match':{
                  'competition_id':'GER_Bundesliga','season':'2026/27',
                  'kickoff':'2026-09-04T18:30:00+00:00','cutoff':'2026-09-04T00:25:59+00:00',
                  'home_team_name':'VfB Stuttgart','away_team_name':'FC Koln',
              },
          }
          if req != expected:
              raise SystemExit('request does not exactly match audited frozen replay request')
          canonical=json.dumps(req,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          pathlib.Path('.runtime_sources/invocation_request.json').write_bytes(canonical)
          audit={
              'schema_version':'football3-gpt-request-transport-v1',
              'event':'pull_request','transport':'DRAFT_PR_BODY_EDIT_SEALED_REPLAY_REPAIR',
              'request_sha256':hashlib.sha256(canonical).hexdigest(),
              'pr_number':os.environ['PR_NUMBER'],'pr_head_ref':os.environ['PR_HEAD_REF'],
              'pr_base_ref':os.environ['PR_BASE_REF'],'code_ref':os.environ['BASE_SHA'],
              'commit_per_match_required':False,
              'source_refetch_allowed':False,
              'pinned_state_artifact_id':9918501049,
              'pinned_cutoff':'2026-09-04T00:25:59+00:00',
          }
          pathlib.Path('.runtime_sources/request_transport.json').write_text(json.dumps(audit,sort_keys=True,separators=(',',':'))+'\n')
          pathlib.Path('football-data/formal_gpt_gateway_v1/output/request_transport.json').write_text(json.dumps(audit,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(audit,sort_keys=True))
          PY

      - name: Restore only pinned frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .formal_state_cache/bundle .runtime_sources/understat .runtime_sources/confirmation
          for pair in '9918501049 state' '9798682425 understat' '9827606506 confirmation'; do
            set -- ${pair}; id="$1"; name="$2"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o ".runtime_sources/${name}.zip"
          done
          unzip -q .runtime_sources/state.zip -d .formal_state_cache/bundle
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle \
              --bundle "$PWD/.formal_state_cache/bundle" \
            | tee football-data/formal_gpt_gateway_v1/output/pre_replay_state_validate.txt
          python3 - <<'PY'
          import json, pathlib
          meta=json.loads(pathlib.Path('.formal_state_cache/bundle/bundle_meta.json').read_text())
          if meta.get('historical_cutoff') != '2026-09-04T00:25:59+00:00':
              raise SystemExit(f"wrong frozen cutoff: {meta.get('historical_cutoff')}")
          PY

      - name: Execute repaired exact-cutoff sealed replay
        id: execute
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 football-data/formal_gpt_gateway_v1/entry.py \
              --request "$PWD/.runtime_sources/invocation_request.json" \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --state-root "$PWD/.formal_state_cache" \
              --out "$PWD/football-data/formal_gpt_gateway_v1/output" \
            | tee football-data/formal_gpt_gateway_v1/output/stdout.txt

      - name: Enforce zero-refetch replay invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path('football-data/formal_gpt_gateway_v1/output')
          summary=json.loads((out/'summary.json').read_text())
          inp=json.loads((out/'runtime_input.json').read_text())
          ident=json.loads((out/'target_identity_audit.json').read_text())
          receipt=json.loads((out/'prediction_receipt.json').read_text())
          trigger=json.loads((out/'xg_trigger_audit.json').read_text())
          assert summary['status']=='PASS', summary
          assert summary['gateway_route']=='SEALED_EXACT_CUTOFF_REPLAY', summary
          assert summary['cutoff']=='2026-09-04T00:25:59+00:00', summary
          assert summary['acquisition_records']==0, summary
          assert summary['source_refetch_used'] is False, summary
          assert inp['cutoff']=='2026-09-04T00:25:59+00:00', inp
          assert inp['model_delta']==[], inp
          assert inp['delta_coverage']['acquisition_schema']=='SEALED_EXACT_CUTOFF_REPLAY', inp
          assert inp['delta_coverage']['state_preapplied_and_sealed'] is True, inp
          assert ident['home']['strength_team_id']=='gteam_9dc5bad7a55031b9', ident
          assert ident['home']['state_evidence'] is True, ident
          assert ident['home']['result_or_xg_used_for_identity'] if 'result_or_xg_used_for_identity' in ident['home'] else True
          assert ident['result_or_xg_used_for_identity'] is False, ident
          assert ident['model_parameters_or_weights_changed'] is False, ident
          assert trigger['model_parameters_or_weights_changed'] is False, trigger
          assert receipt['runtime_input_sha']==summary['input_sha'], (receipt,summary)
          assert receipt['state_sha256']==summary['state_sha'], (receipt,summary)
          assert receipt['state_bundle_sha']==summary['state_bundle_sha'], (receipt,summary)
          assert receipt['prediction_sha']==summary['prediction_sha'], (receipt,summary)
          assert receipt['receipt_sha']==summary['receipt_sha'], (receipt,summary)
          report={
              'schema_version':'football3-stuttgart-koln-sealed-replay-gate-v1',
              'status':'PASS','zero_refetch':True,'model_delta_n':0,
              'cutoff':summary['cutoff'],'gateway_route':summary['gateway_route'],
              'home_strength_team_id':ident['home']['strength_team_id'],
              'home_state_evidence':ident['home']['state_evidence'],
              'model_route':receipt['model_route'],'fallback_exact_v1':receipt['fallback_exact_v1'],
              'runtime_input_sha':receipt['runtime_input_sha'],'state_sha256':receipt['state_sha256'],
              'state_bundle_sha':receipt['state_bundle_sha'],'prediction_sha':receipt['prediction_sha'],
              'receipt_sha':receipt['receipt_sha'],
          }
          (out/'sealed_replay_gate.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Upload repaired sealed replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: stuttgart-koln-sealed-replay-repair-${{ github.run_id }}
          path: football-data/formal_gpt_gateway_v1/output/
          if-no-files-found: error
          retention-days: 90
