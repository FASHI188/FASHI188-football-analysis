name: Football C071-B Opportunity P(T) Development

on:
  push:
    branches:
      - research/c071b-opportunity-pt-development-20260818
    paths:
      - football-data/research/c071b_opportunity_pt_contract.json
      - football-data/research/evaluate_c071b_opportunity_pt_v2.py
      - football-data/research/evaluate_c071b_opportunity_pt_v3_timefix.py
      - football-data/research/C071B_IMPLEMENTATION_CORRECTION_01.json
      - .github/workflows/football-c071b-opportunity-pt-development.yml
  pull_request:
    paths:
      - football-data/research/c071b_opportunity_pt_contract.json
      - football-data/research/evaluate_c071b_opportunity_pt_v2.py
      - football-data/research/evaluate_c071b_opportunity_pt_v3_timefix.py
      - football-data/research/C071B_IMPLEMENTATION_CORRECTION_01.json
      - .github/workflows/football-c071b-opportunity-pt-development.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c071b-opportunity-pt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  development-pre2024-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install frozen scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 pyarrow==21.0.0 scikit-learn==1.7.1

      - name: Download and verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c071b_source"
          REV="f0cbe86bee3f28cc4b803f735a5287968741c471"
          BASE="https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/$REV"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c071b_source/fixtures.parquet" "$BASE/fixtures.parquet?download=true"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c071b_source/match_stats.parquet" "$BASE/match_stats.parquet?download=true"
          echo "7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7  $RUNNER_TEMP/c071b_source/fixtures.parquet" | sha256sum -c -
          echo "2fb85b14b4428e1a36efe6d651de4ca8f7a6169ecfa3edb9cda49cb5e58d97e9  $RUNNER_TEMP/c071b_source/match_stats.parquet" | sha256sum -c -

      - name: Run frozen C071-B development with datetime-unit correction
        run: |
          mkdir -p "$RUNNER_TEMP/c071b_out"
          PYTHONPATH=football-data/research python football-data/research/evaluate_c071b_opportunity_pt_v3_timefix.py \
            --fixtures "$RUNNER_TEMP/c071b_source/fixtures.parquet" \
            --stats "$RUNNER_TEMP/c071b_source/match_stats.parquet" \
            --out-dir "$RUNNER_TEMP/c071b_out"

      - name: Enforce sealed confirmation and governance boundary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c071b_out'/'summary.json').read_text())
          assert s['status']=='C071B_DEVELOPMENT_COMPLETE'
          b=s['label_boundary']
          assert b['labels_at_or_after_2024_returned']==0
          assert b['confirmation_identity_rows']==72180
          assert b['confirmation_target_goal_rows_read']==0
          assert b['confirmation_scored'] is False
          assert s['feature_contract']['provider_xg_used'] is False
          assert s['feature_contract']['closing_1x2_used'] is False
          assert s['boundary']['fresh_confirmation_claim_allowed'] is False
          assert s['boundary']['C070F_confirmation1597_opened'] is False
          assert s['boundary']['A05_opened'] is False
          assert s['boundary']['protected_opened'] is False
          assert s['boundary']['formal_weight']==0
          print(json.dumps(s,indent=2))
          PY

      - name: Upload C071-B corrected evidence
        uses: actions/upload-artifact@v4
        with:
          name: c071b-opportunity-pt-development-timefix
          retention-days: 30
          path: |
            ${{ runner.temp }}/c071b_out/summary.json
            ${{ runner.temp }}/c071b_out/sealed_confirmation_identity.csv
            football-data/research/c071b_opportunity_pt_contract.json
            football-data/research/C071B_IMPLEMENTATION_CORRECTION_01.json
