name: football3 Historical Fusion Score-Shape Mirror Transport

on:
  push:
    branches: ['football3/historical-fusion-score-shape-mirror-transport-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-score-shape-mirror-transport-v1.yml'
      - 'football-data/research/historical_fusion_score_shape_mirror_transport/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-score-shape-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_HEAD: 2d02de0de4da73412d90b019886f710beaf3ee85
  SEG4_HEAD: 3cc9098cd321ee4f1dd659b1a4f4db75c02555ed
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  ACCIDENTAL_V327_HEAD: 0ee5e8310dc7f35472fd6995994d9bebff784d2e
  CONTRACT_FREEZE_COMMIT: 98ff6459feaca4f1bd06d89cfe2f8e546e551e6c
  CONTRACT_BLOB: ec1089f57fd146c91d6e8db9c4616b1fe02832f9
  RUNNER_BLOB: 706478940c78f8b492b8c28459f9e60926f5c107
  TEST_BLOB: 4945749d668c4dccfb52b6ededd8b8ac9bb73b7f
  V324_CONTRACT_BLOB: e4e2670b44168078bc869e7b0889b99bbb2a79f1
  V324_RUNNER_BLOB: 218cfab50a23ca5f94e57c95b2357ae2c9d9ba8f
  V324_ARTIFACT_ID: '9888387173'
  V324_ARTIFACT_DIGEST: sha256:c14813b04a3f21f5cf8de0cf99d682b0e539f2011adb9212532af175509e6ad1
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact lineage contract freeze whitelist and formal guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-score-shape-mirror-transport-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          test "$(git rev-parse "${CONTRACT_FREEZE_COMMIT}^")" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-6-temporal-horizon-consensus-v1 | cut -f1)" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1 | cut -f1)" = "$SEG4_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_score_shape_mirror_transport
          D4=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          test "$(git hash-object "$D/V3_SCORE_SHAPE_MIRROR_TRANSPORT_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/v3_score_shape_mirror_transport.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_v3_score_shape_mirror_transport.py")" = "$TEST_BLOB"
          test "$(git hash-object "$D4/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json")" = "$V324_CONTRACT_BLOB"
          test "$(git hash-object "$D4/v3_2_4_segment4.py")" = "$V324_RUNNER_BLOB"
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_score_shape_mirror_transport')
          contract=str(d/'V3_SCORE_SHAPE_MIRROR_TRANSPORT_CONTRACT.json')
          freeze=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...{os.environ['CONTRACT_FREEZE_COMMIT']}"],text=True).splitlines())
          assert freeze=={contract},freeze
          allowed={
            '.github/workflows/football3-historical-fusion-score-shape-mirror-transport-v1.yml',
            contract,str(d/'v3_score_shape_mirror_transport.py'),str(d/'test_v3_score_shape_mirror_transport.py')
          }
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          assert not any(any(k in p for k in ('CURRENT','production_pointer','formal_enablement')) for p in got)
          c=json.loads((d/'V3_SCORE_SHAPE_MIRROR_TRANSPORT_CONTRACT.json').read_text())
          assert c['status']=='FROZEN_BEFORE_SCORE_SHAPE_TARGET_SCORING'
          assert c['macro_stage_role']=='PRE_MACRO_STAGE_7_SCORE_SHAPE_COMPONENT'
          assert c['objective']['not_macro_stage_7_integration'] is True
          assert c['lineage']['branch_parent_head']==os.environ['BASE_HEAD']
          assert c['lineage']['accidental_v3_2_7_head']==os.environ['ACCIDENTAL_V327_HEAD']
          assert c['lineage']['accidental_v3_2_7_role']=='SIDE_DIAGNOSTIC_ONLY_NOT_PARENT_NOT_INPUT'
          assert c['transport']['trainable_parameters']=='NONE' and c['transport']['threshold_grid']=='NONE'
          assert c['data_roles']['2023']=='CLOSED_FOR_THIS_COMPONENT'
          assert c['data_roles']['2024_25_and_2025_26_3504'].startswith('FORBIDDEN')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run seven structural tests
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_score_shape_mirror_transport
          python -m py_compile "$D/v3_score_shape_mirror_transport.py" "$D/test_v3_score_shape_mirror_transport.py"
          (cd "$D" && python test_v3_score_shape_mirror_transport.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify frozen predecessor and scientific inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v324art,v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower()
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python - "$zip" "$expected" <<'PY'
          import hashlib,sys
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==sys.argv[2].split(':',1)[-1].lower()
          PY
            unzip -tq "$zip"; unzip -q "$zip" -d "$dest"
          }
          verify_one "$V324_ARTIFACT_ID" "$V324_ARTIFACT_DIGEST" /tmp/v324.zip _inputs/v324art
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          python - <<'PY'
          import hashlib,json,os,pathlib
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m4=json.load(open('_inputs/v324art/artifact_manifest.json'))
          f4=json.load(open('_inputs/v324art/evidence/final_status.json'))
          assert m4['head']==os.environ['SEG4_HEAD']
          assert f4['status']=='V3_2_4_MINIMAL_BOUNDARY_PROJECTION_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT'
          assert f4['2023_opened'] is False and f4['3504_opened'] is False
          assert h('_inputs/v2/code/historical_xg_fusion_v2.py')=='1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          assert h('_inputs/xg/code/historical_xg_challenger.py')=='588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          assert h('_inputs/v1/pure_engine.py')=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_inputs/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          assert h('_inputs/v31/code/historical_fusion_v3_1.py')=='59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'
          PY

      - name: Run frozen score-shape component once
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_score_shape_mirror_transport
          D4=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          D3=football-data/research/historical_fusion_v3_2_3_temporal_transport
          rm -rf _run && mkdir _run
          python "$D/v3_score_shape_mirror_transport.py" \
            --contract "$D/V3_SCORE_SHAPE_MIRROR_TRANSPORT_CONTRACT.json" \
            --v324-contract "$D4/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json" --v324 "$D4/v3_2_4_segment4.py" \
            --v323-contract "$D3/V3_2_3_TEMPORAL_TRANSPORT_CONTRACT.json" --v323 "$D3/v3_2_3_segment3.py" \
            --v322 football-data/research/historical_fusion_v3_2_2_parity_boundary/v3_2_2_segment2.py \
            --v32dev football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair_execution/v3_2_development.py \
            --core football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair/v3_2_core.py \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json --out _run 2>&1 | tee /tmp/research_stdout.txt
          python - <<'PY'
          import json
          f=json.load(open('_run/final_status.json'))
          allowed={'SCORE_SHAPE_MIRROR_TRANSPORT_COMPONENT_READY_FOR_MACRO_INTEGRATION','SCORE_SHAPE_MIRROR_TRANSPORT_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT'}
          assert f['status'] in allowed,f['status']
          assert f['research_only'] is True and f['post_view'] is True and f['fresh_confirmation'] is False and f['promotion_allowed'] is False
          assert f['2023_opened'] is False and f['3504_opened'] is False
          assert f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed'] and not f['production_pointer_changed'] and not f['formal_enablement_changed'] and not f['formal_weights_changed']
          PY

      - name: Seal evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/evidence _seal/code _seal/contracts
          cp _run/*.json _seal/evidence/
          cp football-data/research/historical_fusion_score_shape_mirror_transport/v3_score_shape_mirror_transport.py _seal/code/
          cp football-data/research/historical_fusion_score_shape_mirror_transport/test_v3_score_shape_mirror_transport.py _seal/code/
          cp football-data/research/historical_fusion_score_shape_mirror_transport/V3_SCORE_SHAPE_MIRROR_TRANSPORT_CONTRACT.json _seal/contracts/
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal')
          payload=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='artifact_manifest.json':
                  b=p.read_bytes(); payload.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          f=json.load(open('_run/final_status.json'))
          m={'schema_version':'football3-score-shape-artifact-v1','head':os.environ['GITHUB_SHA'],'base_head':os.environ['BASE_HEAD'],'contract_freeze_commit':os.environ['CONTRACT_FREEZE_COMMIT'],'contract_blob':os.environ['CONTRACT_BLOB'],'runner_blob':os.environ['RUNNER_BLOB'],'test_blob':os.environ['TEST_BLOB'],'status':f['status'],'2023_opened':False,'3504_opened':False,'payload':payload}
          (root/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload immutable score-shape evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-score-shape-mirror-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: research-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download uploaded Artifact and verify digest manifest and terminal evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.research-and-seal.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.research-and-seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$got" "$EXPECTED_DIGEST" <<'PY'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower()
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/artifact.zip
          python - /tmp/artifact.zip "$EXPECTED_DIGEST" <<'PY'
          import hashlib,sys
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==sys.argv[2].split(':',1)[-1].lower()
          PY
          unzip -tq /tmp/artifact.zip
          rm -rf /tmp/readback && mkdir /tmp/readback && unzip -q /tmp/artifact.zip -d /tmp/readback
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('/tmp/readback')
          m=json.load(open(root/'artifact_manifest.json'))
          assert m['head']==os.environ['GITHUB_SHA']
          assert m['base_head']==os.environ['BASE_HEAD']
          assert m['contract_freeze_commit']==os.environ['CONTRACT_FREEZE_COMMIT']
          assert m['contract_blob']==os.environ['CONTRACT_BLOB'] and m['runner_blob']==os.environ['RUNNER_BLOB'] and m['test_blob']==os.environ['TEST_BLOB']
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name!='artifact_manifest.json'}
          expected={x['path'] for x in m['payload']}
          assert actual==expected,(actual^expected)
          for x in m['payload']:
              b=(root/x['path']).read_bytes()
              assert len(b)==x['bytes'] and hashlib.sha256(b).hexdigest()==x['sha256']
          f=json.load(open(root/'evidence/final_status.json'))
          assert f['status']==m['status']
          assert f['2023_opened'] is False and f['3504_opened'] is False
          assert f['formal_v2_unchanged'] and f['v3_1_1_unchanged']
          PY
