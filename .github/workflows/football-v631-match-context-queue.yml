name: football-v631-match-context-queue

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/config/v6_match_team_context_contract_v631.json'
      - 'football-data/forward/v6_match_team_context_events_v631.json'
      - 'football-data/validation/v6_seed_match_team_context_v6311.py'
      - 'football-data/validation/v6_match_team_context_queue_v6311.py'
      - '.github/workflows/football-v631-match-context-queue.yml'

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile
        run: |
          python -m py_compile \
            football-data/validation/v6_seed_match_team_context_v631.py \
            football-data/validation/v6_seed_match_team_context_v6311.py \
            football-data/validation/v6_match_team_context_queue_v631.py \
            football-data/validation/v6_match_team_context_queue_v6311.py

      - name: Validate persisted match-context ledger
        run: python football-data/validation/v6_match_team_context_queue_v6311.py

      - name: Generate repository-integrity diagnostic receipt
        if: always()
        run: |
          python football-data/validation/repository_integrity_v471.py --write-receipt --print-summary || true

      - name: Upload current queue and integrity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6311-match-context-validation
          path: |
            football-data/manifests/v6_match_team_context_queue_v631_status.json
            football-data/manifests/repository_integrity_v471_status.json
          if-no-files-found: error
