name: football3 V3.1.1 Historical Stress Score 2024-2026

on:
  push:
    branches: ['football3/v3-1-1-historical-replay-score-2024-2026-v1']
    paths:
      - '.github/workflows/football3-v3-1-1-historical-stress-score-2024-2026-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v311-historical-stress-${{ github.sha }}
  cancel-in-progress: false

env:
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  JOINT_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  V31_HEAD: 7689ec0726fbed6fd2474e1a237b49ab7ad768c7
  DATA_HEAD: 95757332b4ea3cd4d75db370d19ba83dfbf55601
  STRESS_CONTRACT_BLOB: ee0f55fdcaa5b63d11528625fd4f2e955385af4e
  STRESS_SCORER_BLOB: 01337474b78931838f83e571749711cb81ac744a
  STRESS_TEST_BLOB: 67aa293799f583313e346ea99cb23fa5b062af22
  DATA_ARTIFACT_ID: '9876641831'
  DATA_ARTIFACT_DIGEST: sha256:2422a1e4746452614032e5af8c6afcc7172eb0b644d237791fc038c0a6d3547c
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3
  JOINT_ARTIFACT_ID: '9856755439'
  JOINT_ARTIFACT_DIGEST: sha256:f118ffa5d09c40bbefc3f18788e534e4e6b7504744a6976f78f157ce09abf305

jobs:
  score-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      status: ${{ steps.score.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact HEAD lineage frozen refs and eight-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/v3-1-1-historical-replay-score-2024-2026-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$JOINT_HEAD" HEAD)" = "$JOINT_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$JOINT_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-low-variance-v1 | cut -f1)" = "$V31_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/v3-1-1-historical-replay-2024-2026-v1 | cut -f1)" = "$DATA_HEAD"
          test "$(git hash-object football-data/research/v3_1_1_historical_replay_2024_2026/HISTORICAL_STRESS_TEST_CONTRACT.json)" = "$STRESS_CONTRACT_BLOB"
          test "$(git hash-object football-data/research/v3_1_1_historical_replay_2024_2026/historical_stress_score.py)" = "$STRESS_SCORER_BLOB"
          test "$(git hash-object football-data/research/v3_1_1_historical_replay_2024_2026/test_historical_stress_score.py)" = "$STRESS_TEST_BLOB"
          python - <<'PY'
          import os,subprocess
          allowed={
            '.github/workflows/football3-v3-1-1-historical-replay-data-v1.yml',
            '.github/workflows/football3-v3-1-1-historical-stress-score-2024-2026-v1.yml',
            'football-data/research/v3_1_1_historical_replay_2024_2026/HISTORICAL_REPLAY_CONTRACT.json',
            'football-data/research/v3_1_1_historical_replay_2024_2026/HISTORICAL_STRESS_TEST_CONTRACT.json',
            'football-data/research/v3_1_1_historical_replay_2024_2026/download_understat_history.py',
            'football-data/research/v3_1_1_historical_replay_2024_2026/test_download_understat_history.py',
            'football-data/research/v3_1_1_historical_replay_2024_2026/historical_stress_score.py',
            'football-data/research/v3_1_1_historical_replay_2024_2026/test_historical_stress_score.py',
          }
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['JOINT_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          forbidden=('CURRENT','production_pointer','formal_enablement')
          assert not any(any(x in p for x in forbidden) for p in got),got
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fresh deterministic stress guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/v3_1_1_historical_replay_2024_2026/historical_stress_score.py football-data/research/v3_1_1_historical_replay_2024_2026/test_historical_stress_score.py
          python football-data/research/v3_1_1_historical_replay_2024_2026/test_historical_stress_score.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 8 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify frozen engines and completed-history artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{data,v2,xg,v1,old,usr1,v31,joint}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY'
          import sys
          n=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert n(sys.argv[1])==n(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$DATA_ARTIFACT_ID" "$DATA_ARTIFACT_DIGEST" /tmp/data.zip _inputs/data
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          verify_one "$JOINT_ARTIFACT_ID" "$JOINT_ARTIFACT_DIGEST" /tmp/joint.zip _inputs/joint
          python - <<'PY'
          import hashlib,json,pathlib
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          dm=json.load(open('_inputs/data/data/data_manifest.json'))
          assert dm['fixture_n']==3504
          assert dm['fixture_identity_sha256']=='60f14c0960b231b0e4fb0f90a0000e9c82e64f6e33c6b06e417f6902dc1ad13e'
          assert dm['process_update_skipped_n']==5
          assert h('_inputs/v2/code/historical_xg_fusion_v2.py')=='1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          assert h('_inputs/xg/code/historical_xg_challenger.py')=='588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          assert h('_inputs/v1/pure_engine.py')=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_inputs/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          assert h('_inputs/v31/code/historical_fusion_v3_1.py')=='59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'
          assert h('_inputs/joint/code/historical_fusion_v3_1_1_joint_score.py')=='b7f244e43a267e20552a722b3d2ef859adba208577e6cbbe7adc2989c2762696'
          PY

      - name: Authoritative completed-history POST_VIEW stress score
        id: score
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _run
          python football-data/research/v3_1_1_historical_replay_2024_2026/historical_stress_score.py \
            --stress-contract football-data/research/v3_1_1_historical_replay_2024_2026/HISTORICAL_STRESS_TEST_CONTRACT.json \
            --joint-contract _inputs/joint/contracts/V3_1_1_JOINT_SCORE_CONTRACT.json \
            --joint-engine _inputs/joint/code/historical_fusion_v3_1_1_joint_score.py \
            --v31-contract _inputs/v31/contracts/V3_1_RESEARCH_CONTRACT.json \
            --v31-engine _inputs/v31/code/historical_fusion_v3_1.py \
            --v31-final _inputs/v31/evidence/final_status.json \
            --usr1-engine _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2-engine _inputs/v2/code/historical_xg_fusion_v2.py \
            --xg-engine _inputs/xg/code/historical_xg_challenger.py \
            --v1-engine _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --data-dir _inputs/data/data \
            --out _run 2>&1 | tee /tmp/stress_stdout.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/historical_stress_result.json'))
          assert r['status'] in {'V3_1_1_HISTORICAL_STRESS_TEST_PASSED','V3_1_1_HISTORICAL_STRESS_TEST_FAILED'}
          assert r['classification']=='POST_VIEW_HISTORICAL_STRESS_TEST' and r['fresh_confirmation'] is False and r['promotion_allowed'] is False
          assert r['n']==3504 and r['fixture_identity_sha256']=='60f14c0960b231b0e4fb0f90a0000e9c82e64f6e33c6b06e417f6902dc1ad13e'
          assert r['pit_audit']['labels_used_for_training_or_selection'] is False
          assert r['matrix_audit']['matrix_shape']==[15,15] and r['matrix_audit']['cell_count']==225
          assert r['formal_v2_unchanged'] is True and r['CURRENT_changed'] is False and r['production_pointer_changed'] is False and r['formal_enablement_changed'] is False and r['formal_weights_changed'] is False
          PY
          status="$(python -c "import json;print(json.load(open('_run/historical_stress_result.json'))['status'])")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "slug=$(cat _run/artifact_slug.txt)" >> "$GITHUB_OUTPUT"

      - name: Seal historical stress artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{contracts,code,evidence}
          cp football-data/research/v3_1_1_historical_replay_2024_2026/HISTORICAL_STRESS_TEST_CONTRACT.json _seal/contracts/
          cp football-data/research/v3_1_1_historical_replay_2024_2026/historical_stress_score.py football-data/research/v3_1_1_historical_replay_2024_2026/test_historical_stress_score.py _seal/code/
          cp _run/* _seal/evidence/
          cp /tmp/tests.txt /tmp/stress_stdout.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('_seal'); files={}
          for p in sorted(r.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          x=json.load(open('_run/historical_stress_result.json'))
          m={'schema_version':'football3-v3-1-1-historical-stress-artifact-v1','status':x['status'],'head':os.environ['GITHUB_SHA'],
             'formal_v2_head':os.environ['FORMAL_HEAD'],'joint_candidate_head':os.environ['JOINT_HEAD'],'data_head':os.environ['DATA_HEAD'],
             'data_artifact_id':int(os.environ['DATA_ARTIFACT_ID']),'data_artifact_digest':os.environ['DATA_ARTIFACT_DIGEST'],
             'fixture_n':x['n'],'fixture_identity_sha256':x['fixture_identity_sha256'],'classification':'POST_VIEW_HISTORICAL_STRESS_TEST',
             'fresh_confirmation':False,'promotion_allowed':False,'formal_v2_unchanged':True,'CURRENT_changed':False,
             'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (r/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload historical stress artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-1-1-historical-stress-${{ steps.score.outputs.slug }}-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: score-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Remote ZIP digest CRC manifest exact-set SHA bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ART_ID: ${{ needs.score-and-seal.outputs.artifact_id }}
          DIGEST: ${{ needs.score-and-seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}")"
          md="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$md" "$DIGEST" <<'PY'
          import sys
          n=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert n(sys.argv[1])==n(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" -o /tmp/a.zip
          unzip -tq /tmp/a.zip
          rm -rf /tmp/a && mkdir /tmp/a && unzip -q /tmp/a.zip -d /tmp/a
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('/tmp/a'); m=json.load(open(r/'artifact_manifest.json'))
          assert m['head']==os.environ['GITHUB_SHA']
          assert m['status'] in {'V3_1_1_HISTORICAL_STRESS_TEST_PASSED','V3_1_1_HISTORICAL_STRESS_TEST_FAILED'}
          assert m['fixture_n']==3504 and m['fixture_identity_sha256']=='60f14c0960b231b0e4fb0f90a0000e9c82e64f6e33c6b06e417f6902dc1ad13e'
          expected=set(m['files'])|{'artifact_manifest.json'}
          got={p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file()}
          assert got==expected,(got,expected)
          for name,v in m['files'].items():
              b=(r/name).read_bytes(); assert len(b)==v['bytes']; assert hashlib.sha256(b).hexdigest()==v['sha256']
          x=json.load(open(r/'evidence/historical_stress_result.json'))
          assert x['status']==m['status'] and x['n']==3504
          PY
