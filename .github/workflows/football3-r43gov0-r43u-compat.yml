name: football3 R43GOV0 M5B R43U compatibility

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/r43u_fixed_diagonal.py
      - football-data/components/legacy_r43_registry.py
      - football-data/tests/test_r43u_component_compat.py
      - football-data/tests/test_legacy_r43_registry.py
      - .github/workflows/football3-r43gov0-r43u-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r43u-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Fetch exact pinned R43U source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/run_r43u0.py https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/f6bc7a6d483c39a9513506f3fe1096d0aecbc668/football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py
          test "$(git hash-object /tmp/run_r43u0.py)" = "4ad46cca4acb618068f6db2601cf96bad4109698"
      - name: Compile M5B U component
        run: |
          python -m py_compile football-data/components/r43u_fixed_diagonal.py
          python -m py_compile football-data/tests/test_r43u_component_compat.py
      - name: Run exact source compatibility and registry tests
        env:
          R43U_SOURCE_FILE: /tmp/run_r43u0.py
        run: |
          python -m unittest discover -s football-data/tests -p 'test_r43u_component_compat.py' -v
          python -m unittest discover -s football-data/tests -p 'test_legacy_r43_registry.py' -v
      - name: Write M5B U gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5b_r43u_compat_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5b-r43u-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "source_component": "R43U0 fixed diagonal inflation",
            "source_blob_sha": "4ad46cca4acb618068f6db2601cf96bad4109698",
            "source_commit": "f6bc7a6d483c39a9513506f3fe1096d0aecbc668",
            "diagonal_factor": 1.25,
            "bitwise_source_compatibility": true,
            "implementation_migrated": true,
            "enabled_by_default": false,
            "historical_architecture_gate_passed": true,
            "historical_full_volume_53pct_met": false,
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M5B_exact_R43T_migration_compatibility_only"
          }
          JSON
      - name: Upload M5B U gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5b-r43u-compat-gate
          path: football-data/governance/r43gov0/results/m5b_r43u_compat_gate.json
          if-no-files-found: error
          retention-days: 90
