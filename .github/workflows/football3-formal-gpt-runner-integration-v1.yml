name: Football3 Formal GPT Runner Integration V1
run-name: Football3 Formal GPT Runner Integration V1 ${{ inputs.expected_request_sha256 || github.sha }}

on:
  push:
    branches:
      - 'football3/formal-*'
    paths:
      - 'football-data/formal_gpt_gateway_v1/**'
      - 'football-data/formal_source_contract_v1.py'
      - 'football-data/formal_runtime_missing_input_probe_v1.py'
      - '.github/workflows/football3-formal-gpt-runner-integration-v1.yml'
  workflow_dispatch:
    inputs:
      request_pr_number:
        description: 'Optional permanent request-carrier PR number; when set, load the audited request from that Draft PR body'
        required: false
        type: string
      expected_request_sha256:
        description: 'Required with request_pr_number; binds workflow_dispatch to the exact canonical carrier request bytes'
        required: false
        type: string
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-formal-gpt-runner-integration-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal-request:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve immutable live canonical integration HEAD
        id: base_target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          REQUEST_CARRIER_REF: ${{ github.event.pull_request.head.ref || '' }}
          REQUEST_CARRIER_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          DISPATCH_REQUEST_PR: ${{ inputs.request_pr_number || '' }}
          EXPECTED_REQUEST_SHA256: ${{ inputs.expected_request_sha256 || '' }}
        run: |
          set -euo pipefail
          CANONICAL_BASE_REF='football3/formal-gpt-runner-integration-v1'
          RESOLUTION_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          REQUEST_PR_NUMBER="$EVENT_PR_NUMBER"
          CARRIER_BOUND=false

          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            echo 'PRODUCTION_DIRECT_PULL_REQUEST_EXECUTION_DISABLED' >&2
            exit 28
          elif [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$DISPATCH_REQUEST_PR" ]; then
            if [ "$GITHUB_REF_NAME" != "$CANONICAL_BASE_REF" ]; then
              echo "PRODUCTION_UNAUTHORIZED_DISPATCH_REF:event=$GITHUB_REF_NAME:required=$CANONICAL_BASE_REF" >&2
              exit 20
            fi
            if ! printf '%s' "$EXPECTED_REQUEST_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
              echo 'PRODUCTION_EXPECTED_REQUEST_SHA_MISSING' >&2
              exit 27
            fi
            REQUEST_PR_NUMBER="$DISPATCH_REQUEST_PR"
            PR_META="$(mktemp)"
            if ! curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${REQUEST_PR_NUMBER}" -o "$PR_META"; then
              echo 'PRODUCTION_REQUEST_CARRIER_RESOLUTION_FAILED' >&2
              exit 25
            fi
            if ! jq -e --arg base "$CANONICAL_BASE_REF" --arg carrier 'football3/formal-gpt-runner-request-carrier-v1' \
              'type=="object" and .state=="open" and .draft==true and .merged_at==null and .base.ref==$base and .head.ref==$carrier and .head.repo.full_name==.base.repo.full_name and (.base.sha|type)=="string" and (.base.sha|test("^[0-9a-f]{40}$")) and (.head.sha|type)=="string" and (.head.sha|test("^[0-9a-f]{40}$"))' \
              "$PR_META" >/dev/null; then
              echo 'PRODUCTION_REQUEST_CARRIER_INVALID_RESPONSE' >&2
              exit 26
            fi
            EVENT_BASE_REF="$(jq -r '.base.ref' "$PR_META")"
            EVENT_BASE_SHA="$(jq -r '.base.sha' "$PR_META")"
            REQUEST_CARRIER_REF="$(jq -r '.head.ref' "$PR_META")"
            REQUEST_CARRIER_HEAD="$(jq -r '.head.sha' "$PR_META")"
            CARRIER_BOUND=true
          fi

          if [ "$CARRIER_BOUND" = true ]; then
            if [ "$EVENT_BASE_REF" != "$CANONICAL_BASE_REF" ]; then
              echo "PRODUCTION_UNAUTHORIZED_BASE_REF:event=$EVENT_BASE_REF:required=$CANONICAL_BASE_REF" >&2
              exit 21
            fi
            if [ "$REQUEST_CARRIER_REF" != 'football3/formal-gpt-runner-request-carrier-v1' ]; then
              echo "PRODUCTION_UNAUTHORIZED_REQUEST_CARRIER:$REQUEST_CARRIER_REF" >&2
              exit 22
            fi
            BODY="$(mktemp)"
            LIVE_REF_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANONICAL_BASE_REF}"
            if ! curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "$LIVE_REF_URL" -o "$BODY"; then
              echo 'PRODUCTION_LIVE_BASE_REF_RESOLUTION_FAILED' >&2
              exit 23
            fi
            if ! jq -e --arg expected "refs/heads/${CANONICAL_BASE_REF}" \
              'type=="object" and .ref==$expected and .object.type=="commit" and (.object.sha|type)=="string" and (.object.sha|test("^[0-9a-f]{40}$"))' \
              "$BODY" >/dev/null; then
              echo 'PRODUCTION_LIVE_BASE_REF_INVALID_RESPONSE' >&2
              exit 24
            fi
            RESOLVED_LIVE_BASE_SHA="$(jq -r '.object.sha' "$BODY")"
          else
            CANONICAL_BASE_REF="$GITHUB_REF_NAME"
            EVENT_BASE_SHA=''
            REQUEST_CARRIER_REF=''
            REQUEST_CARRIER_HEAD=''
            REQUEST_PR_NUMBER=''
            RESOLVED_LIVE_BASE_SHA="$GITHUB_SHA"
          fi
          {
            echo "canonical_base_ref=$CANONICAL_BASE_REF"
            echo "event_base_sha=$EVENT_BASE_SHA"
            echo "resolved_live_base_sha=$RESOLVED_LIVE_BASE_SHA"
            echo "resolution_timestamp=$RESOLUTION_TIMESTAMP"
            echo "request_carrier_ref=$REQUEST_CARRIER_REF"
            echo "request_carrier_head=$REQUEST_CARRIER_HEAD"
            echo "request_pr_number=$REQUEST_PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.base_target.outputs.resolved_live_base_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable checkout and record base binding evidence
        id: checkout_binding
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources
          python3 football-data/formal_gpt_gateway_v1/production_base_binding_v1.py record-checkout \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-base-sha "${{ steps.base_target.outputs.event_base_sha }}" \
            --canonical-base-ref "${{ steps.base_target.outputs.canonical_base_ref }}" \
            --resolved-live-base-sha "${{ steps.base_target.outputs.resolved_live_base_sha }}" \
            --resolution-timestamp "${{ steps.base_target.outputs.resolution_timestamp }}" \
            --request-carrier-ref "${{ steps.base_target.outputs.request_carrier_ref }}" \
            --request-carrier-head "${{ steps.base_target.outputs.request_carrier_head }}" \
            --out .runtime_sources/production_base_binding.json

      - name: Build fully validated SHA-bound invocation request
        id: transport
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ steps.base_target.outputs.request_pr_number }}
          PR_HEAD_REF: ${{ steps.base_target.outputs.request_carrier_ref }}
          PR_HEAD_SHA: ${{ steps.base_target.outputs.request_carrier_head }}
          PR_BASE_REF: ${{ steps.base_target.outputs.canonical_base_ref }}
          DISPATCH_REQUEST_PR: ${{ inputs.request_pr_number || '' }}
          EXPECTED_REQUEST_SHA256: ${{ inputs.expected_request_sha256 || '' }}
          CANONICAL_EXECUTION_SHA: ${{ steps.base_target.outputs.resolved_live_base_sha }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$DISPATCH_REQUEST_PR" ]; then
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_REQUEST_PR}" \
              -o .runtime_sources/dispatch_carrier_pr.json
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_REQUEST_PR}/files?per_page=100&page=1" \
              -o .runtime_sources/dispatch_carrier_files.json
          fi
          PYTHONPATH="$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1:$PWD/football-data" python3 - <<'PY'
          import json, os, pathlib, re
          import request_contract_v1 as contract

          event=os.environ['GITHUB_EVENT_NAME']
          out=pathlib.Path('.runtime_sources/invocation_request.json')
          execution_out=pathlib.Path('.runtime_sources/execution_request.json')
          expected=os.environ.get('EXPECTED_REQUEST_SHA256','').strip()
          carrier_bound=(event=='workflow_dispatch' and bool(os.environ.get('DISPATCH_REQUEST_PR')))
          if event=='pull_request':
              raise SystemExit('PRODUCTION_DIRECT_PULL_REQUEST_EXECUTION_DISABLED')
          elif carrier_bound:
              if not re.fullmatch(r'[0-9a-f]{64}',expected):
                  raise SystemExit('PRODUCTION_EXPECTED_REQUEST_SHA_MISSING')
              meta=json.loads(pathlib.Path('.runtime_sources/dispatch_carrier_pr.json').read_text(encoding='utf-8'))
              files=json.loads(pathlib.Path('.runtime_sources/dispatch_carrier_files.json').read_text(encoding='utf-8'))
              if type(meta) is not dict or meta.get('state')!='open' or meta.get('draft') is not True or meta.get('merged_at') is not None:
                  raise SystemExit('PRODUCTION_REQUEST_CARRIER_INVALID_RESPONSE')
              base=meta.get('base') or {}; head=meta.get('head') or {}; head_repo=head.get('repo') or {}
              if base.get('ref')!='football3/formal-gpt-runner-integration-v1' or head.get('ref')!='football3/formal-gpt-runner-request-carrier-v1' or head_repo.get('full_name')!=os.environ['GITHUB_REPOSITORY']:
                  raise SystemExit('PRODUCTION_REQUEST_CARRIER_AUTHORITY_MISMATCH')
              if head.get('sha')!=os.environ.get('PR_HEAD_SHA'):
                  raise SystemExit('PRODUCTION_REQUEST_CARRIER_HEAD_MOVED')
              if type(files) is not list or [f.get('filename') for f in files if type(f) is dict] != ['FOOTBALL3_FORMAL_GPT_REQUEST_CARRIER.md'] or len(files)!=1:
                  raise SystemExit('PRODUCTION_REQUEST_CARRIER_CHANGED_FILES_UNAUTHORIZED')
              body=meta.get('body') or ''
              begin='<!-- football3-request-json -->'; end='<!-- /football3-request-json -->'
              if body.count(begin)!=1 or body.count(end)!=1:
                  raise SystemExit('PRODUCTION_REQUEST_CARRIER_MARKERS_INVALID')
              raw=body.split(begin,1)[1].split(end,1)[0].strip()
              try:
                  req=contract.parse_json(raw,carrier_request=True)
              except contract.FormalRequestContractError as exc:
                  raise SystemExit(f'PRODUCTION_REQUEST_CONTRACT:{exc.code}') from exc
              transport='DRAFT_PR_BODY_DISPATCH_SHA_BOUND'
          else:
              try:
                  req=contract.load_request(pathlib.Path('football-data/formal_gpt_gateway_v1/request.json'),carrier_request=False)
              except contract.FormalRequestContractError as exc:
                  raise SystemExit(f'PRODUCTION_REQUEST_CONTRACT:{exc.code}') from exc
              transport='COMMITTED_SELFTEST_REQUEST' if event=='push' else 'WORKFLOW_DISPATCH_DEFAULT_REQUEST'

          canonical=contract.canonical_bytes(req)
          actual=contract.request_sha256(req)
          if carrier_bound and actual != expected:
              raise SystemExit('PRODUCTION_REQUEST_SHA_MISMATCH')
          out.write_bytes(canonical)
          execution_out.write_bytes(contract.canonical_bytes(contract.execution_request(req)))
          audit={
              'schema_version':'football3-gpt-request-transport-v2',
              'event':event,'transport':transport,
              'request_id':req.get('request_id'),
              'request_sha256':actual,
              'expected_request_sha256':expected or None,
              'request_sha_verified':bool(carrier_bound and actual==expected),
              'pr_number':os.environ.get('PR_NUMBER') or None,
              'pr_head_ref':os.environ.get('PR_HEAD_REF') or None,
              'pr_head_sha':os.environ.get('PR_HEAD_SHA') or None,
              'pr_base_ref':os.environ.get('PR_BASE_REF') or None,
              'canonical_execution_sha':os.environ.get('CANONICAL_EXECUTION_SHA') or None,
              'code_ref':os.environ.get('GITHUB_SHA'),
              'commit_per_match_required':False,
          }
          pathlib.Path('.runtime_sources/request_transport.json').write_text(json.dumps(audit,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(audit,sort_keys=True))
          PY
          echo 'accepted=true' >> "$GITHUB_OUTPUT"

      - name: Bind request transport to production base evidence
        run: |
          set -euo pipefail
          python3 football-data/formal_gpt_gateway_v1/production_base_binding_v1.py bind-request \
            --binding .runtime_sources/production_base_binding.json \
            --request .runtime_sources/invocation_request.json \
            --transport .runtime_sources/request_transport.json
          PYTHONPATH="$PWD/football-data/formal_gpt_gateway_v1" python3 football-data/formal_gpt_gateway_v1/request_sha_binding_v1.py verify \
            --request .runtime_sources/invocation_request.json \
            --transport .runtime_sources/request_transport.json \
            --binding .runtime_sources/production_base_binding.json

      - name: Restore cutoff-aware eligible durable formal state Artifact
        id: durable_selector
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL3_GITHUB_API_STATS_PATH: ${{ github.workspace }}/.runtime_sources/github_api_stats.json
        run: |
          set -euo pipefail
          rm -rf .formal_state_cache
          mkdir -p .runtime_sources .formal_state_cache football-data/formal_gpt_gateway_v1/output
          if python3 - <<'PY'
          import json
          d=json.load(open('.runtime_sources/invocation_request.json'))
          raise SystemExit(0 if type(d.get('match')) is dict else 1)
          PY
          then
            echo 'prediction_required=true' >> "$GITHUB_OUTPUT"
            set +e
            PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
              python3 football-data/formal_gpt_gateway_v1/durable_state_selector_v1.py \
                --repo "$GITHUB_REPOSITORY" \
                --request "$PWD/.runtime_sources/invocation_request.json" \
                --cache-root "$PWD/.formal_state_cache" \
                --audit "$PWD/.runtime_sources/state_artifact_candidate.json" \
              > .runtime_sources/durable_selector_stdout.txt 2>&1
            rc=$?
            set -e
            cat .runtime_sources/durable_selector_stdout.txt
            if [ "$rc" -eq 0 ]; then
              echo 'selected=true' >> "$GITHUB_OUTPUT"
            else
              echo 'selected=false' >> "$GITHUB_OUTPUT"
              cp .runtime_sources/state_artifact_candidate.json football-data/formal_gpt_gateway_v1/output/state_recovery.json
              python3 - <<'PY'
          import json,pathlib
          audit=json.load(open('.runtime_sources/state_artifact_candidate.json'))
          gap={
              'schema_version':'football3-formal-durable-state-governance-v1',
              'status':'DATA_STATE_ANOMALY',
              'fallback_class':'DATA_STATE_ANOMALY',
              'fallback_reason':audit.get('reason') or 'DURABLE_SELECTOR_FAILED',
              'selector_status':audit.get('status'),
              'target_cutoff':audit.get('target_cutoff'),
              'competition_id':audit.get('competition_id'),
              'prediction_sha':None,'receipt_sha':None,
              'manual_or_auxiliary_fallback_used':False,'fail_closed':True,
          }
          pathlib.Path('football-data/formal_gpt_gateway_v1/output/formal_gap.json').write_text(json.dumps(gap,sort_keys=True,separators=(',',':'))+'\n')
          PY
            fi
          else
            echo 'prediction_required=false' >> "$GITHUB_OUTPUT"
            echo 'selected=not-required' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema_version":"football3-durable-state-selection-v1","status":"SKIPPED_NON_PREDICTION_MODE"}' > .runtime_sources/state_artifact_candidate.json
          fi
          cat .runtime_sources/state_artifact_candidate.json

      - name: Record explicit non-prediction selftest PASS SKIP
        if: ${{ steps.durable_selector.outputs.prediction_required != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p football-data/formal_gpt_gateway_v1/output
          cp .runtime_sources/request_transport.json football-data/formal_gpt_gateway_v1/output/request_transport.json
          cp .runtime_sources/state_artifact_candidate.json football-data/formal_gpt_gateway_v1/output/state_recovery.json
          python3 - <<'PY'
          import json,pathlib
          req=json.load(open('.runtime_sources/invocation_request.json'))
          transport=json.load(open('.runtime_sources/request_transport.json'))
          selector=json.load(open('.runtime_sources/state_artifact_candidate.json'))
          assert type(req.get('match')) is not dict
          assert selector.get('status')=='SKIPPED_NON_PREDICTION_MODE'
          receipt={
              'schema_version':'football3-formal-runner-non-prediction-selftest-v1',
              'status':'PASS','result':'SKIPPED_BUNDLE_DEPENDENT_GATEWAY',
              'reason':'NON_PREDICTION_MODE_DOES_NOT_REQUIRE_DURABLE_BUNDLE',
              'mode':req.get('mode'),'transport':transport.get('transport'),
              'selector_status':selector.get('status'),'prediction_required':False,
              'bundle_required':False,'gateway_prediction_executed':False,
              'prediction_sha':None,'fail_closed_relaxed':False,
          }
          pathlib.Path('football-data/formal_gpt_gateway_v1/output/non_prediction_selftest_receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Download byte-bound frozen FULL rebuild sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources/understat .runtime_sources/confirmation
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation

      - name: Execute frozen original formal runner through gateway
        id: execute
        if: ${{ steps.durable_selector.outputs.prediction_required == 'true' && steps.durable_selector.outputs.selected == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf football-data/formal_gpt_gateway_v1/output
          mkdir -p football-data/formal_gpt_gateway_v1/output .formal_state_cache
          cp .runtime_sources/request_transport.json football-data/formal_gpt_gateway_v1/output/request_transport.json
          cp .runtime_sources/state_artifact_candidate.json football-data/formal_gpt_gateway_v1/output/state_recovery.json
          export FOOTBALL3_DURABLE_SELECTOR_REQUIRED=1
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 football-data/formal_gpt_gateway_v1/entry.py \
              --request "$PWD/.runtime_sources/execution_request.json" \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --state-root "$PWD/.formal_state_cache" \
              --out "$PWD/football-data/formal_gpt_gateway_v1/output" \
            | tee football-data/formal_gpt_gateway_v1/output/stdout.txt

      - name: Validate real prediction contract
        if: ${{ steps.durable_selector.outputs.prediction_required == 'true' && steps.durable_selector.outputs.selected == 'true' && steps.execute.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -f .formal_state_cache/bundle/manifest.json
          test -f football-data/formal_gpt_gateway_v1/output/summary.json
          test -f football-data/formal_gpt_gateway_v1/output/prediction_receipt.json
          python3 - <<'PY'
          import json
          s=json.load(open('football-data/formal_gpt_gateway_v1/output/summary.json'))
          r=json.load(open('football-data/formal_gpt_gateway_v1/output/prediction_receipt.json'))
          assert s.get('status')=='PASS',s
          assert isinstance(s.get('prediction_sha'),str) and s['prediction_sha'],s
          assert r.get('prediction_sha')==s['prediction_sha'],(r.get('prediction_sha'),s.get('prediction_sha'))
          assert r.get('state_integrity_guard',{}).get('status')=='PASS',r.get('state_integrity_guard')
          print('REAL_PREDICTION_CONTRACT_PASS',s['prediction_sha'])
          PY

      - name: Record gateway outputs when summary exists
        id: gateway_summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p football-data/formal_gpt_gateway_v1/output
          cp .runtime_sources/production_base_binding.json football-data/formal_gpt_gateway_v1/output/production_base_binding.json
          cp .runtime_sources/request_transport.json football-data/formal_gpt_gateway_v1/output/request_transport.json
          test ! -f .runtime_sources/github_api_stats.json || cp .runtime_sources/github_api_stats.json football-data/formal_gpt_gateway_v1/output/github_api_stats.json
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('football-data/formal_gpt_gateway_v1/output/summary.json')
          d=json.loads(p.read_text()) if p.exists() else {'status':'NO_SUMMARY'}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"state_sha={str(d.get('state_bundle_sha') or 'no-state')}\n")
              f.write(f"status={d.get('status','UNKNOWN')}\n")
              f.write(f"path={d.get('calculation_path','NONE')}\n")
          PY

      - name: Probe missing input routes to FULL and fails closed
        if: ${{ always() && (steps.durable_selector.outputs.prediction_required != 'true' || steps.durable_selector.outputs.selected == 'true') }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_runtime_missing_input_probe_v1.py \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --work "$PWD/.formal_missing_probe" \
              --out "$PWD/football-data/formal_gpt_gateway_v1/output"

      - name: Validate persisted state bundle when present
        if: ${{ always() && hashFiles('.formal_state_cache/bundle/manifest.json') != '' }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle \
              --bundle "$PWD/.formal_state_cache/bundle" \
            | tee football-data/formal_gpt_gateway_v1/output/state_validate.txt

      - name: Final canonical integration HEAD drift guard and execution binding receipt
        if: ${{ always() && steps.checkout_binding.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 football-data/formal_gpt_gateway_v1/production_base_binding_v1.py finalize \
            --binding .runtime_sources/production_base_binding.json \
            --repo "$GITHUB_REPOSITORY" \
            --token "$GH_TOKEN" \
            --out-dir football-data/formal_gpt_gateway_v1/output \
            --stats .runtime_sources/github_api_stats.json \
            --prediction-required "${{ steps.durable_selector.outputs.prediction_required }}"
          PYTHONPATH="$PWD/football-data/formal_gpt_gateway_v1" python3 football-data/formal_gpt_gateway_v1/request_sha_binding_v1.py enrich \
            --transport .runtime_sources/request_transport.json \
            --binding .runtime_sources/production_base_binding.json \
            --out-dir football-data/formal_gpt_gateway_v1/output

      - name: Upload prediction or gap receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: formal-gpt-runner-receipt-${{ github.run_id }}
          path: football-data/formal_gpt_gateway_v1/output/
          if-no-files-found: error
          retention-days: 90

      - name: Upload complete reusable state bundle
        if: ${{ always() && hashFiles('.formal_state_cache/bundle/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: formal-gpt-runner-state-${{ github.run_id }}
          path: .formal_state_cache/bundle/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve durable selector failure as job failure
        if: ${{ always() && steps.durable_selector.outputs.prediction_required == 'true' && steps.durable_selector.outputs.selected != 'true' }}
        run: exit 1

      - name: Preserve main gateway failure as job failure
        if: ${{ always() && steps.execute.outcome == 'failure' }}
        run: exit 1
