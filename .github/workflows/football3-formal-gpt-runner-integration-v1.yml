name: Football3 Formal GPT Runner Integration V1

on:
  push:
    branches:
      - football3/formal-gpt-runner-integration-v1
    paths:
      - 'football-data/formal_gpt_gateway_v1/**'
      - 'football-data/formal_source_contract_v1.py'
      - 'football-data/formal_runtime_missing_input_probe_v1.py'
      - '.github/workflows/football3-formal-gpt-runner-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-formal-gpt-runner-integration-v1
  cancel-in-progress: false

jobs:
  formal-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore remote formal state bundle cache
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: .formal_state_cache
          key: football3-formal-state-v1-${{ github.sha }}
          restore-keys: |
            football3-formal-state-v1-

      - name: Restore durable state Artifact when cache misses
        if: ${{ steps.restore_state.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources .formal_state_cache/bundle
          rm -rf .formal_state_cache/bundle/*
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req) as r:
              data=json.load(r)
          candidates=[]
          for a in data.get('artifacts',[]):
              wr=a.get('workflow_run') or {}
              if (not a.get('expired') and str(a.get('name','')).startswith('formal-gpt-runner-state-')
                      and wr.get('head_branch')=='football3/formal-gpt-runner-integration-v1'):
                  candidates.append(a)
          candidates.sort(key=lambda a:(a.get('created_at',''),int(a.get('id',0))))
          out=pathlib.Path('.runtime_sources/state_artifact_candidate.json')
          if not candidates:
              out.write_text(json.dumps({'status':'NO_DURABLE_STATE_ARTIFACT'},sort_keys=True)+'\n')
          else:
              a=candidates[-1]
              out.write_text(json.dumps({'status':'FOUND','artifact_id':a['id'],'name':a['name'],
                                         'digest':a.get('digest'),'created_at':a.get('created_at')},sort_keys=True)+'\n')
          PY
          if python3 - <<'PY'
          import json
          d=json.load(open('.runtime_sources/state_artifact_candidate.json'))
          raise SystemExit(0 if d.get('status')=='FOUND' else 1)
          PY
          then
            ARTIFACT_ID="$(python3 -c "import json; print(json.load(open('.runtime_sources/state_artifact_candidate.json'))['artifact_id'])")"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o .runtime_sources/state.zip
            unzip -q .runtime_sources/state.zip -d .formal_state_cache/bundle
            if PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
                 python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle \
                   --bundle "$PWD/.formal_state_cache/bundle" \
                 > .runtime_sources/state_artifact_validate.txt 2>&1
            then
              python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('.runtime_sources/state_artifact_candidate.json')
          d=json.loads(p.read_text()); d['validation']='PASS'
          p.write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
            else
              cat .runtime_sources/state_artifact_validate.txt
              rm -rf .formal_state_cache/bundle
              python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('.runtime_sources/state_artifact_candidate.json')
          d=json.loads(p.read_text()); d['validation']='FAIL_REMOVED'
          p.write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
            fi
          fi

      - name: Download byte-bound frozen FULL rebuild sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources/understat .runtime_sources/confirmation
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" \
            -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" \
            -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation

      - name: Execute frozen original formal runner through gateway
        id: execute
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf football-data/formal_gpt_gateway_v1/output
          mkdir -p football-data/formal_gpt_gateway_v1/output .formal_state_cache
          if [ -f .runtime_sources/state_artifact_candidate.json ]; then
            cp .runtime_sources/state_artifact_candidate.json football-data/formal_gpt_gateway_v1/output/state_recovery.json
          fi
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 football-data/formal_gpt_gateway_v1/entry.py \
              --request "$PWD/football-data/formal_gpt_gateway_v1/request.json" \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --state-root "$PWD/.formal_state_cache" \
              --out "$PWD/football-data/formal_gpt_gateway_v1/output" \
            | tee football-data/formal_gpt_gateway_v1/output/stdout.txt

      - name: Record gateway outputs when summary exists
        id: gateway_summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('football-data/formal_gpt_gateway_v1/output/summary.json')
          d=json.loads(p.read_text()) if p.exists() else {'status':'NO_SUMMARY'}
          state_sha=str(d.get('state_bundle_sha') or 'no-state')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"state_sha={state_sha}\n")
              f.write(f"status={d.get('status','UNKNOWN')}\n")
              f.write(f"path={d.get('calculation_path','NONE')}\n")
          PY

      - name: Probe missing input routes to FULL and fails closed
        if: ${{ always() }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_runtime_missing_input_probe_v1.py \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --work "$PWD/.formal_missing_probe" \
              --out "$PWD/football-data/formal_gpt_gateway_v1/output"

      - name: Validate persisted state bundle when present
        if: ${{ always() && hashFiles('.formal_state_cache/bundle/manifest.json') != '' }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle \
              --bundle "$PWD/.formal_state_cache/bundle" \
            | tee football-data/formal_gpt_gateway_v1/output/state_validate.txt

      - name: Save remote formal state bundle cache
        if: ${{ always() && hashFiles('.formal_state_cache/bundle/manifest.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .formal_state_cache
          key: football3-formal-state-v1-${{ steps.gateway_summary.outputs.state_sha || 'recovered' }}-${{ github.run_id }}

      - name: Upload prediction/gap receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: formal-gpt-runner-receipt-${{ github.run_id }}
          path: football-data/formal_gpt_gateway_v1/output/
          if-no-files-found: error
          retention-days: 90

      - name: Upload complete reusable state bundle
        if: ${{ always() && hashFiles('.formal_state_cache/bundle/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: formal-gpt-runner-state-${{ github.run_id }}
          path: .formal_state_cache/bundle/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve main gateway failure as job failure
        if: ${{ always() && steps.execute.outcome == 'failure' }}
        run: exit 1
