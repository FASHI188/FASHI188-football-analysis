name: Football3 Formal GPT Runner Integration V1

on:
  push:
    branches:
      - football3/formal-gpt-runner-identity-repair-v1

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-formal-gpt-runner-xg-coverage-repair-v1
  cancel-in-progress: false

jobs:
  formal-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore pinned frozen model source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources/understat .runtime_sources/confirmation .formal_state_cache football-data/formal_gpt_gateway_v1/output
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" \
            -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" \
            -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation

      - name: Rebuild missing pretarget xg history and replay exact frozen delta
        run: |
          set -euo pipefail
          rm -rf .formal_state_cache/bundle football-data/formal_gpt_gateway_v1/output/*
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 football-data/formal_gpt_gateway_v1/xg_coverage_rebuild_replay_ger_v1.py \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --state-root "$PWD/.formal_state_cache" \
              --out "$PWD/football-data/formal_gpt_gateway_v1/output" \
            | tee football-data/formal_gpt_gateway_v1/output/stdout.txt

      - name: Enforce repaired Fusion V2 invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path('football-data/formal_gpt_gateway_v1/output')
          summary=json.loads((out/'summary.json').read_text())
          receipt=json.loads((out/'prediction_receipt.json').read_text())
          coverage=json.loads((out/'xg_coverage_repair_audit.json').read_text())
          proof=json.loads((out/'original_live_delta_exact_reuse_proof.json').read_text())
          ident=json.loads((out/'target_identity_audit.json').read_text())
          trigger=json.loads((out/'xg_trigger_audit.json').read_text())
          assert summary['status']=='PASS', summary
          assert summary['cutoff']=='2026-09-04T00:25:59+00:00', summary
          assert summary['fallback_exact_v1'] is False, summary
          assert receipt['fallback_exact_v1'] is False, receipt
          assert receipt['model_route']!='FROZEN_V1_EXACT_FALLBACK', receipt
          assert summary['fusion_weights']=={'xg':0.75,'frozen_v1':0.25}, summary
          assert summary['model_parameters_or_weights_changed'] is False, summary
          assert summary['post_target_information_used'] is False, summary
          assert summary['target_match_xg_used'] is False, summary
          assert coverage['files']['GER_Bundesliga']['joined_rows']==306, coverage
          assert coverage['files']['GER_Bundesliga']['formal_2025_26_rows']==306, coverage
          assert proof['byte_and_event_identity_to_original_run'] is True, proof
          assert proof['source_set_sha256']=='de20070f7fc5c49f5b7c45e0b6c028c0087d3c15cb6861b67fb57f0d626eac63', proof
          assert proof['records_sha256']=='6a02bb78f2bf453a67d2614b593e6860fcaf1968f964ba5b50fde6e9f86ef8e2', proof
          assert proof['records']==903, proof
          assert ident['home']['strength_team_id']=='gteam_9dc5bad7a55031b9', ident
          assert ident['home']['state_evidence'] is True, ident
          dyn=trigger['dynamic']
          assert dyn['fallback_exact_v1'] is False, dyn
          assert receipt['runtime_input_sha']==summary['runtime_input_sha']
          assert receipt['state_sha256']==summary['state_sha256']
          assert receipt['state_bundle_sha']==summary['state_bundle_sha']
          assert receipt['prediction_sha']==summary['prediction_sha']
          assert receipt['receipt_sha']==summary['receipt_sha']
          gate={
              'schema_version':'football3-xg-coverage-repair-gate-v1','status':'PASS',
              'fallback_exact_v1':False,'model_route':receipt['model_route'],
              'cutoff':summary['cutoff'],'source_set_sha256':proof['source_set_sha256'],
              'records_sha256':proof['records_sha256'],'records':proof['records'],
              'ger_2025_26_xg_joined':coverage['files']['GER_Bundesliga']['joined_rows'],
              'home_strength_team_id':ident['home']['strength_team_id'],
              'runtime_input_sha':receipt['runtime_input_sha'],'state_sha256':receipt['state_sha256'],
              'state_bundle_sha':receipt['state_bundle_sha'],'prediction_sha':receipt['prediction_sha'],
              'receipt_sha':receipt['receipt_sha'],
          }
          (out/'xg_coverage_repair_gate.json').write_text(json.dumps(gate,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(gate,sort_keys=True))
          PY

      - name: Validate repaired state bundle
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle \
              --bundle "$PWD/.formal_state_cache/bundle" \
            | tee football-data/formal_gpt_gateway_v1/output/state_validate.txt

      - name: Upload repaired Fusion V2 receipt
        uses: actions/upload-artifact@v4
        with:
          name: formal-gpt-runner-receipt-${{ github.run_id }}
          path: football-data/formal_gpt_gateway_v1/output/
          if-no-files-found: error
          retention-days: 90

      - name: Upload repaired state bundle
        uses: actions/upload-artifact@v4
        with:
          name: formal-gpt-runner-state-${{ github.run_id }}
          path: .formal_state_cache/bundle/
          if-no-files-found: error
          retention-days: 90
