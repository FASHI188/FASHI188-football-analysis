name: football3 Historical XG Fusion V2 Formal Wiring

on:
  push:
    branches: [football3/historical-xg-fusion-v2-formal-wiring-governed-v1]
    paths:
      - '.github/workflows/football3-full-stack-remediation.yml'
      - '.github/workflows/football3-historical-xg-fusion-v2-formal-wiring.yml'
      - 'football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json'
      - 'football-data/new_engine_v1/formal_fusion_v2.py'
      - 'football-data/new_engine_v1/test_formal_fusion_v2.py'
      - 'football-data/research/audit_football3_changed_scientific_files.py'
      - 'governance/football3/formal_wiring_contract_schema_v2.json'
      - 'governance/football3/test_validate_formal_wiring_contract_v2.py'
      - 'governance/football3/validate_formal_wiring_contract_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-historical-xg-fusion-v2-formal-wiring-governed-${{ github.sha }}
  cancel-in-progress: false

env:
  RESEARCH_BASE_HEAD: d3b3e322f78c48b91477ef6e11054e51ac00fd85
  HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256: '2000528df3a951252e9da83a81034431e3c4f5b5fb5d779e25de4302a5d0cebf'
  HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256: 'c61d695eeb5601bb74a5b6a673b71c28d17959730732e476d4361563b3436b58'
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  OLD_SOURCE_ARTIFACT_ID: '9798682425'
  OLD_SOURCE_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  CONF_SOURCE_ARTIFACT_ID: '9827606506'
  CONF_SOURCE_ARTIFACT_DIGEST: sha256:1358636754b33c70a82995b83943cb58a447e38650fef53ed308ff44c4087f1e

jobs:
  formal-wiring-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact cumulative lineage and nine-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-xg-fusion-v2-formal-wiring-governed-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$RESEARCH_BASE_HEAD" HEAD)" = "$RESEARCH_BASE_HEAD"
          python - <<'PY'
          import json, os, pathlib, subprocess
          contract=json.loads(pathlib.Path('football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json').read_text())
          allowed=set(contract['governance']['changed_file_whitelist'])
          assert len(allowed)==9 and len(allowed)<=12
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['RESEARCH_BASE_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(sorted(got),sorted(allowed))
          assert not any(any(x in p for x in ('CURRENT','PR334','R5')) for p in got)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen acceptance dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Compile cumulative governance and formal wiring surfaces
        run: |
          python -m py_compile \
            football-data/research/audit_football3_changed_scientific_files.py \
            governance/football3/validate_formal_wiring_contract_v2.py \
            governance/football3/test_validate_formal_wiring_contract_v2.py \
            football-data/new_engine_v1/pure_engine.py \
            football-data/historical_xg_challenger_v1/historical_xg_challenger.py \
            football-data/new_engine_v1/formal_fusion_v2.py \
            football-data/new_engine_v1/test_formal_fusion_v2.py

      - name: Validate non-market formal_wiring schema-v2 governance
        shell: bash
        run: |
          set -euo pipefail
          python governance/football3/validate_formal_wiring_contract_v2.py \
            --contract football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json \
            --schema governance/football3/formal_wiring_contract_schema_v2.json \
            --repo-root . \
            --base-head "$RESEARCH_BASE_HEAD" | tee /tmp/formal_governance.txt
          grep -q 'FORMAL_WIRING_GOVERNANCE_V2_PASS' /tmp/formal_governance.txt

      - name: Run governance positive and fail-closed negative tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q governance/football3/test_validate_formal_wiring_contract_v2.py | tee /tmp/governance_tests.txt

      - name: Run authoritative cumulative changed-scientific-files audit
        shell: bash
        env:
          PYTHONPATH: football-data/research
        run: |
          set -euo pipefail
          python football-data/research/audit_football3_changed_scientific_files.py \
            --base "$RESEARCH_BASE_HEAD" \
            --head HEAD \
            --expected-guard-canonical-ast-sha256 "$HDA_EXPECTED_GUARD_CANONICAL_AST_SHA256" \
            --expected-audit-canonical-ast-sha256 "$HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256" | tee /tmp/cumulative_scientific_audit.json
          grep -q '"status": "PASS"' /tmp/cumulative_scientific_audit.json

      - name: Prove adapter and test have zero dynamic import reflection authority
        shell: bash
        env:
          PYTHONPATH: football-data/research
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/static_authority_scan.json
          import ast,json,pathlib
          import audit_football3_changed_scientific_files as guard
          files=[
            pathlib.Path('football-data/new_engine_v1/formal_fusion_v2.py'),
            pathlib.Path('football-data/new_engine_v1/test_formal_fusion_v2.py'),
          ]
          tokens=['importlib','spec_from_file_location','module_from_spec','exec_module','getattr']
          report={}
          for path in files:
              text=path.read_text(encoding='utf-8')
              tree=ast.parse(text,filename=str(path))
              counts={token:text.count(token) for token in tokens}
              dynamic=guard.dynamic_authority_blockers(path)
              assert all(value==0 for value in counts.values()),(path,counts)
              assert dynamic==[],(path,dynamic)
              report[str(path)]={'token_counts':counts,'dynamic_authority_blockers':dynamic}
          print(json.dumps({'status':'FORMAL_WIRING_STATIC_AUTHORITY_SCAN_PASS','files':report},indent=2,sort_keys=True))
          PY
          grep -q 'FORMAL_WIRING_STATIC_AUTHORITY_SCAN_PASS' /tmp/static_authority_scan.json

      - name: Verify repository locks weights and non-enablement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('football-data')
          c=json.loads((root/'historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json').read_text())
          locks={}
          locks.update(c['governance']['immutable_market_governance_git_blobs'])
          locks.update(c['governance']['immutable_formal_source_git_blobs'])
          for path,expected in sorted(locks.items()):
              actual=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
              assert actual==expected,(path,actual,expected)
          v1=root/'new_engine_v1/pure_engine.py'
          assert hashlib.sha256(v1.read_bytes()).hexdigest()=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          identity=json.loads((root/'historical_xg_fusion_v2/data/XG_FUSION_V2_DATA_IDENTITY.json').read_text())
          lock=json.loads((root/'new_engine_v1/forward/model_lock.json').read_text())
          assert identity['frozen_v1']['head']=='22f639304d2e32fc952dbec2255153ee45dcd41a'
          assert identity['fusion_contract']['formula']=='normalize((1-w)*p_V1 + w*p_XG)'
          assert identity['formal_weight']==0 and identity['formal_enablement'] is False
          assert lock['formal_activation'] is False
          assert c['fusion']['xg_weight']==0.75 and c['fusion']['v1_weight']==0.25
          assert c['fusion']['xg_insufficient']=='FROZEN_V1_EXACT_FALLBACK'
          assert c['runtime']['formal_enablement'] is False
          assert c['runtime']['production_pointer_changed'] is False
          assert c['runtime']['prospective_queue'] is False
          assert c['governance']['training'] is False and c['governance']['tuning'] is False
          assert c['governance']['new_target_labels'] is False
          print('repository locks / weights / non-enablement: PASS')
          PY

      - name: Download and verify frozen acceptance inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/v1 _inputs/xg _inputs/old_source _inputs/conf_source
          verify_one() {
            id="$1"; expected="$2"; zip="$3"; dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            test "$got" = "$expected"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            actual="sha256:$(sha256sum "$zip" | awk '{print $1}')"
            test "$actual" = "$expected"
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$OLD_SOURCE_ARTIFACT_ID" "$OLD_SOURCE_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old_source
          verify_one "$CONF_SOURCE_ARTIFACT_ID" "$CONF_SOURCE_ARTIFACT_DIGEST" /tmp/conf.zip _inputs/conf_source
          python - <<'PY'
          import hashlib,json,pathlib
          v=pathlib.Path('_inputs/v1'); x=pathlib.Path('_inputs/xg'); o=pathlib.Path('_inputs/old_source'); c=pathlib.Path('_inputs/conf_source')
          vm=json.loads((v/'evidence/artifact_manifest.json').read_text())
          assert vm['head']=='22f639304d2e32fc952dbec2255153ee45dcd41a'
          repo=pathlib.Path('football-data/new_engine_v1/pure_engine.py')
          assert repo.read_bytes()==(v/'pure_engine.py').read_bytes()
          assert hashlib.sha256(repo.read_bytes()).hexdigest()=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          xm=json.loads((x/'artifact_manifest.json').read_text())
          assert xm['head']=='08a13ce01ddf7c3408b7b89d39d44c01a3b30c9b'
          assert xm['status']=='HISTORICAL_XG_CHALLENGER_REJECTED'
          assert pathlib.Path('football-data/historical_xg_challenger_v1/historical_xg_challenger.py').read_bytes()==(x/'code/historical_xg_challenger.py').read_bytes()
          assert hashlib.sha256((o/'understat_frozen.db').read_bytes()).hexdigest()=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          cm=json.loads((c/'artifact_manifest.json').read_text())
          assert cm['head']=='2607b6a1c6a01c3977dc4f740aa7dce67618b951'
          assert cm['no_scoring_performed'] is True
          PY

      - name: Run formal wiring contracts and adversarial tests
        shell: bash
        env:
          PYTHONPATH: football-data:football-data/research
        run: |
          set -euo pipefail
          python football-data/historical_xg_challenger_v1/test_historical_xg_challenger.py 2>&1 | tee /tmp/xg_tests.txt
          python football-data/historical_xg_fusion_v2/test_historical_xg_fusion_v2.py 2>&1 | tee /tmp/fusion_tests.txt
          python football-data/new_engine_v1/test_formal_fusion_v2.py 2>&1 | tee /tmp/wiring_tests.txt
          grep -q '^OK$' /tmp/xg_tests.txt
          grep -q '^OK$' /tmp/fusion_tests.txt
          grep -q '^OK$' /tmp/wiring_tests.txt

      - name: Re-run frozen historical development and confirmation acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run/dev _run/pred _run/score
          python football-data/historical_xg_fusion_v2/historical_xg_fusion_v2.py development \
            --xg-engine football-data/historical_xg_challenger_v1/historical_xg_challenger.py \
            --v1-engine _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old_source/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --parent-predictions _inputs/xg/evidence/frozen_predictions.jsonl \
            --out _run/dev | tee /tmp/development_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('_run/dev/development_result.json'))
          s=json.load(open('_run/dev/weight_selection.json'))
          assert d['all_development_gates_pass'] is True
          assert s['selected_weight']==0.75
          assert d['gates']['top1_delta_at_least_minus_0_0015'] is True
          assert d['gates']['fold_nondegrade_n']==8
          PY
          python football-data/historical_xg_fusion_v2/historical_xg_fusion_v2.py confirmation-predict \
            --xg-engine football-data/historical_xg_challenger_v1/historical_xg_challenger.py \
            --v1-engine _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old_source/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --development _run/dev/development_result.json \
            --identity _inputs/conf_source/confirmation_identity.jsonl \
            --vault _inputs/conf_source/confirmation_xg_result_vault.jsonl \
            --out _run/pred | tee /tmp/confirmation_predict_stdout.txt
          python football-data/historical_xg_fusion_v2/historical_xg_fusion_v2.py confirmation-score \
            --development _run/dev/development_result.json \
            --predictions _run/pred \
            --vault _inputs/conf_source/confirmation_xg_result_vault.jsonl \
            --out _run/score | tee /tmp/confirmation_score_stdout.txt
          python - <<'PY'
          import json
          p=json.load(open('_run/pred/pre_score_manifest.json'))
          f=json.load(open('_run/score/final_status.json'))
          assert p['selected_global_weight']==0.75
          assert p['cohort_n']==1752
          assert p['same_kickoff_predict_before_batch_label_read'] is True
          assert p['fallback_exact_v1'] is True
          assert f['status']=='HISTORICAL_XG_FUSION_V2_CANDIDATE_PASSED_PENDING_CODEX_RECHECK'
          assert f['formal_weight']==0 and f['formal_enablement'] is False and f['prospective_queue'] is False
          PY

      - name: Seal exact-head cumulative acceptance artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/changed _seal/evidence
          python - <<'PY'
          import json,pathlib,shutil
          contract=json.loads(pathlib.Path('football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json').read_text())
          root=pathlib.Path('_seal/changed')
          for rel in contract['governance']['changed_file_whitelist']:
              src=pathlib.Path(rel); dst=root/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
          PY
          cp /tmp/formal_governance.txt /tmp/governance_tests.txt /tmp/cumulative_scientific_audit.json /tmp/static_authority_scan.json \
             /tmp/xg_tests.txt /tmp/fusion_tests.txt /tmp/wiring_tests.txt /tmp/development_stdout.txt \
             /tmp/confirmation_predict_stdout.txt /tmp/confirmation_score_stdout.txt _seal/evidence/
          cp -R _run _seal/evidence/run
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal')
          contract=json.loads(pathlib.Path('football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json').read_text())
          governance_receipt={
            'schema_version':'football3-formal-wiring-governance-receipt-v3',
            'status':'FORMAL_WIRING_GOVERNANCE_V2_PASS',
            'head':os.environ['GITHUB_SHA'],
            'branch':os.environ['GITHUB_REF_NAME'],
            'cumulative_base_head':os.environ['RESEARCH_BASE_HEAD'],
            'changed_file_whitelist':contract['governance']['changed_file_whitelist'],
            'scientific_code_bindings':contract['governance']['scientific_code_bindings'],
            'dynamic_import_reflection_scan':'PASS_ZERO',
            'market_features':False,
            'market_inputs':[],
            'market_validator_semantics':'UNCHANGED',
            'training':False,
            'tuning':False,
            'new_target_labels':False,
            'formal_enablement':False,
            'production_pointer_changed':False,
          }
          (root/'governance_receipt.json').write_text(json.dumps(governance_receipt,indent=2,sort_keys=True)+'\n')
          files={}
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='artifact_manifest.json'):
              files[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'schema_version':'football3-historical-xg-fusion-v2-formal-wiring-artifact-v3',
            'status':'FORMAL_WIRING_GOVERNANCE_V2_PASS',
            'head':os.environ['GITHUB_SHA'],
            'branch':os.environ['GITHUB_REF_NAME'],
            'base_head':os.environ['RESEARCH_BASE_HEAD'],
            'xg_weight':0.75,
            'v1_weight':0.25,
            'formal_enablement':False,
            'production_pointer_changed':False,
            'prospective_queue':False,
            'historical_completed_only':True,
            'market_validator_semantics':'UNCHANGED',
            'new_target_labels':False,
            'changed_file_whitelist':contract['governance']['changed_file_whitelist'],
            'files':files,
          }
          (root/'artifact_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload full cumulative acceptance artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-historical-xg-fusion-v2-formal-wiring-self-acceptance-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          compression-level: 6

      - name: Terminal marker
        shell: bash
        run: |
          echo 'FORMAL_WIRING_GOVERNANCE_V2_PASS'
          echo "HEAD=${GITHUB_SHA}"
          echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "ARTIFACT_DIGEST=${{ steps.upload.outputs.artifact-digest }}"
