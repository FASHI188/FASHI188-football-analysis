name: football3 Historical XG Fusion V2 Formal Wiring Remediation Patcher

on:
  push:
    branches: [football3/historical-xg-fusion-v2-formal-wiring]
    paths:
      - '.github/workflows/football3-historical-xg-fusion-v2-formal-wiring.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: football3-historical-xg-fusion-v2-remediation-patcher-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_HEAD: d3b3e322f78c48b91477ef6e11054e51ac00fd85
  START_HEAD: 3016f6c7a0b77e0db310ad926011dfaa50c56e02
  HDA_EXPECTED_AUDIT_CANONICAL_AST_SHA256: c61d695eeb5601bb74a5b6a673b71c28d17959730732e476d4361563b3436b58

jobs:
  patch-governed-formal-wiring:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patcher commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact authorized start
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-xg-fusion-v2-formal-wiring'
          test "$(git rev-parse HEAD^)" = "$START_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install governance test dependency
        run: pip install --disable-pip-version-check pytest==8.4.1

      - name: Apply frozen ten-file remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast, base64, json
          from pathlib import Path
          
          def replace_once(path: str, old: str, new: str) -> None:
              p=Path(path); text=p.read_text(encoding="utf-8")
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"PATCH_PATTERN_MISMATCH {path} count={n} old={old[:120]!r}")
              p.write_text(text.replace(old,new,1), encoding="utf-8")
          
          replace_once('football-data/research/validate_football3_experiment.py', "REUSE_CLASSES = {'REPLICATION', 'REPRODUCTION'}\nFORBIDDEN_CALLS = ", "REUSE_CLASSES = {'REPLICATION', 'REPRODUCTION'}\n\nMARKET_EXPERIMENT_KIND = 'market_experiment'\nFORMAL_WIRING_KIND = 'formal_wiring'\nFORMAL_WIRING_IDENTITY_FIELDS = (\n    'fixture_id', 'competition_id', 'season', 'kickoff', 'home_team_id', 'away_team_id',\n)\nFORMAL_WIRING_FORBIDDEN_CAPABILITIES = {\n    'odds', 'provider', 'secret', 'training', 'tuning',\n    'new_target_labels', 'prospective_queue', 'dynamic_execution',\n}\nFORMAL_WIRING_FORBIDDEN_IMPORT_PREFIXES = {\n    'importlib', 'builtins', 'requests', 'urllib', 'http', 'socket',\n    'secrets', 'keyring', 'boto3', 'google.cloud',\n}\nFORMAL_WIRING_FORBIDDEN_CALLS = {\n    '__import__', 'eval', 'exec', 'compile', 'getattr', 'import_module',\n    'fit', 'fit_transform', 'train', 'tune', 'read_csv', 'read_parquet',\n    'read_sql', 'read_sql_query', 'urlopen', 'request',\n}\nFORMAL_WIRING_FORBIDDEN_IDENTIFIER_TOKENS = {\n    'odds', 'bookmaker', 'provider', 'provider_client', 'api_key', 'secret',\n    'labels', 'label', 'target_labels', 'new_target_labels', 'y_true',\n}\n\n\nFORBIDDEN_CALLS = ")
          replace_once('football-data/research/validate_football3_experiment.py', 'def validate_contract(c: dict) -> None:\n', "\ndef _experiment_kind(c: dict) -> str:\n    raw = c.get('experiment_kind')\n    if raw is None:\n        return MARKET_EXPERIMENT_KIND\n    if raw == MARKET_EXPERIMENT_KIND:\n        return MARKET_EXPERIMENT_KIND\n    if raw == FORMAL_WIRING_KIND:\n        return FORMAL_WIRING_KIND\n    fail(f'unknown experiment_kind: {raw!r}')\n\n\ndef _repo_relative_file(raw: object, name: str, *, prefix: str) -> str:\n    value = str(raw or '').strip()\n    if not value or 'REPLACE_ME' in value:\n        fail(f'{name} must be a concrete repo-relative path')\n    p = Path(value)\n    if p.is_absolute() or '..' in p.parts or not p.as_posix().startswith(prefix):\n        fail(f'{name} must stay under {prefix}')\n    return p.as_posix()\n\n\ndef _validate_formal_wiring_contract(c: dict) -> None:\n    fw = require(c, 'formal_wiring')\n    if not isinstance(fw, dict):\n        fail('formal_wiring must be an object')\n    if not _nonplaceholder(fw.get('purpose')):\n        fail('formal_wiring purpose required')\n    if fw.get('formal_enablement') is not False:\n        fail('formal_wiring must remain disabled')\n    if fw.get('production_pointer_changed') is not False:\n        fail('formal_wiring may not change production pointer')\n    if fw.get('historical_regression_only') is not True:\n        fail('formal_wiring accepts only already-consumed historical regression evidence')\n    if fw.get('prospective_queue') is not False:\n        fail('formal_wiring prospective queue forbidden')\n    if fw.get('new_confirmation') is not False:\n        fail('formal_wiring may not establish a new confirmation')\n    if fw.get('new_target_labels_read') != 0:\n        fail('formal_wiring may not read new target labels')\n\n    fixed = fw.get('fixed_weights')\n    if not isinstance(fixed, dict):\n        fail('formal_wiring fixed_weights required')\n    xg = _number(fixed.get('xg'), 'formal_wiring.fixed_weights.xg')\n    v1 = _number(fixed.get('v1'), 'formal_wiring.fixed_weights.v1')\n    if abs(xg - 0.75) > 1e-15 or abs(v1 - 0.25) > 1e-15 or abs(xg + v1 - 1.0) > 1e-15:\n        fail('formal_wiring fixed weights must remain XG=0.75 V1=0.25')\n\n    identity_fields = fw.get('identity_fields')\n    if tuple(identity_fields or ()) != FORMAL_WIRING_IDENTITY_FIELDS:\n        fail('formal_wiring identity_fields must match the frozen six-field identity')\n    if fw.get('identity_mismatch_policy') != 'FAIL_CLOSED':\n        fail('formal_wiring identity mismatch policy must be FAIL_CLOSED')\n\n    candidate_entry = _repo_relative_file(\n        fw.get('candidate_entry'),\n        'formal_wiring.candidate_entry',\n        prefix='football-data/',\n    )\n    runner = _repo_relative_file(\n        fw.get('formal_runner'),\n        'formal_wiring.formal_runner',\n        prefix='football-data/research/',\n    )\n    helpers = fw.get('execution_helpers')\n    if not isinstance(helpers, list) or not helpers:\n        fail('formal_wiring execution_helpers must be a nonempty list')\n    helper_paths = [\n        _repo_relative_file(x, 'formal_wiring.execution_helpers', prefix='football-data/')\n        for x in helpers\n    ]\n    if len(helper_paths) != len(set(helper_paths)):\n        fail('formal_wiring execution_helpers contains duplicates')\n    if candidate_entry not in helper_paths:\n        fail('formal_wiring candidate_entry must be an execution helper')\n    if runner in helper_paths:\n        fail('formal_wiring runner must be distinct from helpers')\n\n    allowed = fw.get('allowed_runtime_inputs')\n    if set(allowed or ()) != {'fixture_identity', 'frozen_v1_state', 'frozen_xg_state'}:\n        fail('formal_wiring allowed_runtime_inputs must be exactly frozen fixture/V1/XG state')\n    forbidden = fw.get('forbidden_capabilities')\n    if set(forbidden or ()) != FORMAL_WIRING_FORBIDDEN_CAPABILITIES:\n        fail('formal_wiring forbidden_capabilities must match default-deny contract')\n\n    evidence = require(c, 'frozen_evidence')\n    if not isinstance(evidence, dict):\n        fail('formal_wiring frozen_evidence required')\n    if evidence.get('historical_regression_status') != 'ALREADY_CONSUMED':\n        fail('formal_wiring historical evidence must be explicitly ALREADY_CONSUMED')\n    for key in ('development_n', 'outer_validation_n', 'historical_confirmation_n'):\n        _positive_int(evidence.get(key), f'frozen_evidence.{key}')\n    for key in ('historical_confirmation_active_n', 'historical_confirmation_fallback_n'):\n        _nonnegative_int(evidence.get(key), f'frozen_evidence.{key}')\n    if (\n        evidence.get('historical_confirmation_active_n', 0)\n        + evidence.get('historical_confirmation_fallback_n', 0)\n        != evidence.get('historical_confirmation_n')\n    ):\n        fail('formal_wiring historical confirmation active/fallback counts do not sum')\n    if not _nonplaceholder(evidence.get('research_baseline_head')):\n        fail('formal_wiring research baseline head required')\n    _sha64(evidence.get('frozen_v1_engine_sha256'), 'frozen_evidence.frozen_v1_engine_sha256')\n    if not _nonplaceholder(evidence.get('frozen_v1_head')):\n        fail('formal_wiring frozen V1 head required')\n\n    auth = require(c, 'authorization')\n    if auth.get('formal_enablement_requires_new_user_authorization') is not True:\n        fail('formal_wiring formal enablement must require new user authorization')\n    if auth.get('new_target_access_requires_explicit_user_authorization') is not True:\n        fail('formal_wiring new target access must require explicit user authorization')\n\n\ndef _formal_wiring_import_forbidden(module: str) -> bool:\n    root = str(module or '')\n    return any(root == x or root.startswith(x + '.') for x in FORMAL_WIRING_FORBIDDEN_IMPORT_PREFIXES)\n\n\ndef validate_formal_wiring_surface(path: Path) -> None:\n    try:\n        text = path.read_text(encoding='utf-8')\n        tree = ast.parse(text, filename=str(path))\n    except Exception as exc:\n        fail(f'formal_wiring surface unreadable: {path}: {exc}')\n\n    blockers: list[str] = []\n    for node in ast.walk(tree):\n        if isinstance(node, ast.Import):\n            for alias in node.names:\n                if _formal_wiring_import_forbidden(alias.name):\n                    blockers.append(f'forbidden import {alias.name} line {node.lineno}')\n        elif isinstance(node, ast.ImportFrom):\n            if _formal_wiring_import_forbidden(node.module or ''):\n                blockers.append(f'forbidden import {node.module} line {node.lineno}')\n        elif isinstance(node, ast.Call):\n            call_name = dotted_name(node.func).split('.')[-1]\n            if call_name in FORMAL_WIRING_FORBIDDEN_CALLS:\n                blockers.append(f'forbidden call {call_name} line {node.lineno}')\n        elif isinstance(node, ast.Name):\n            low = node.id.lower()\n            if low in FORMAL_WIRING_FORBIDDEN_IDENTIFIER_TOKENS or low.endswith('_labels'):\n                blockers.append(f'forbidden identifier {node.id} line {node.lineno}')\n        elif isinstance(node, ast.Attribute):\n            low = node.attr.lower()\n            if low in FORMAL_WIRING_FORBIDDEN_IDENTIFIER_TOKENS or low.endswith('_labels'):\n                blockers.append(f'forbidden attribute {node.attr} line {node.lineno}')\n        elif isinstance(node, ast.Constant) and isinstance(node.value, str):\n            low = node.value.lower()\n            if 'http://' in low or 'https://' in low or 'bookmaker' in low or 'provider://' in low:\n                blockers.append(f'forbidden external/market literal line {node.lineno}')\n    if blockers:\n        fail('formal_wiring execution surface denied: ' + '; '.join(sorted(set(blockers))))\n\n\ndef _module_bool_constant(tree: ast.Module, name: str) -> bool | None:\n    for node in tree.body:\n        if not isinstance(node, (ast.Assign, ast.AnnAssign)):\n            continue\n        targets = node.targets if isinstance(node, ast.Assign) else [node.target]\n        if not any(isinstance(t, ast.Name) and t.id == name for t in targets):\n            continue\n        value = node.value\n        if isinstance(value, ast.Constant) and isinstance(value.value, bool):\n            return value.value\n    return None\n\n\ndef _validate_formal_wiring_runner(\n    path: Path,\n    tree: ast.Module,\n    c: dict,\n    contract_path: Path,\n) -> None:\n    fw = c['formal_wiring']\n    declared = _module_string_constant(tree, 'FOOTBALL3_EXPERIMENT_CONTRACT')\n    if not declared:\n        fail('formal_wiring runner missing FOOTBALL3_EXPERIMENT_CONTRACT constant')\n    declared_path = Path(declared)\n    if declared_path.is_absolute() or '..' in declared_path.parts:\n        fail('formal_wiring runner contract path must be repo-relative and non-traversing')\n    if (REPO_ROOT / declared_path).resolve() != contract_path.resolve():\n        fail('formal_wiring runner declared contract does not match validator --contract path')\n    expected_runner = (REPO_ROOT / fw['formal_runner']).resolve()\n    if path.resolve() != expected_runner:\n        fail('formal_wiring validator runner path does not match frozen formal_runner')\n    if _module_bool_constant(tree, 'FORMAL_ENABLEMENT') is not False:\n        fail('formal_wiring runner must pin FORMAL_ENABLEMENT=False')\n    if _module_bool_constant(tree, 'PROSPECTIVE_QUEUE') is not False:\n        fail('formal_wiring runner must pin PROSPECTIVE_QUEUE=False')\n    validate_formal_wiring_surface(path)\n\n    call_names = {\n        dotted_name(n.func).split('.')[-1]\n        for n in ast.walk(tree)\n        if isinstance(n, ast.Call)\n    }\n    if not {'new_candidate_state', 'predict_formal_batch'}.issubset(call_names):\n        fail('formal_wiring runner must call fixed new_candidate_state and predict_formal_batch')\n\n    for helper in fw['execution_helpers']:\n        helper_path = (REPO_ROOT / helper).resolve()\n        try:\n            helper_path.relative_to(REPO_ROOT.resolve())\n        except ValueError:\n            fail('formal_wiring helper escapes repository')\n        if not helper_path.is_file():\n            fail(f'formal_wiring helper missing: {helper}')\n        validate_formal_wiring_surface(helper_path)\n        helper_tree = ast.parse(helper_path.read_text(encoding='utf-8'), filename=str(helper_path))\n        helper_contract = _module_string_constant(helper_tree, 'FOOTBALL3_EXPERIMENT_HELPER_FOR')\n        if helper_contract != contract_path.resolve().relative_to(REPO_ROOT.resolve()).as_posix():\n            fail(f'formal_wiring helper does not bind active contract: {helper}')\n\n\ndef validate_contract(c: dict) -> None:\n")
          replace_once('football-data/research/validate_football3_experiment.py', "    if any(x in branch.upper() for x in ('C073','C074','C075','C076','C077','C078','C079')):\n        fail('quarantined/derived lineage token in football3 branch')\n\n    q = require(c, 'scientific_question')\n", "    if any(x in branch.upper() for x in ('C073','C074','C075','C076','C077','C078','C079')):\n        fail('quarantined/derived lineage token in football3 branch')\n\n    kind = _experiment_kind(c)\n    if kind == FORMAL_WIRING_KIND:\n        _validate_formal_wiring_contract(c)\n        return\n\n    q = require(c, 'scientific_question')\n")
          replace_once('football-data/research/validate_football3_experiment.py', "def validate_external_audit_artifacts(c: dict, contract_path: Path) -> None:\n    base=contract_path.resolve().parent; data=c['data_plan']\n", "def validate_external_audit_artifacts(c: dict, contract_path: Path) -> None:\n    if _experiment_kind(c) == FORMAL_WIRING_KIND:\n        return\n    base=contract_path.resolve().parent; data=c['data_plan']\n")
          replace_once('football-data/research/validate_football3_experiment.py', "def validate_runner(path: Path, contract_path: Path | None = None) -> None:\n    text=path.read_text(encoding='utf-8')\n    try: tree=ast.parse(text,filename=str(path))\n    except SyntaxError as e: fail(f'runner syntax error: {e}')\n    c=load_contract(contract_path) if contract_path is not None else None\n\n    imported_core=False\n", "def validate_runner(path: Path, contract_path: Path | None = None) -> None:\n    text=path.read_text(encoding='utf-8')\n    try: tree=ast.parse(text,filename=str(path))\n    except SyntaxError as e: fail(f'runner syntax error: {e}')\n    c=load_contract(contract_path) if contract_path is not None else None\n    if c is not None and _experiment_kind(c) == FORMAL_WIRING_KIND:\n        _validate_formal_wiring_runner(path, tree, c, contract_path)\n        return\n\n    imported_core=False\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "HDA_GUARD_PATH = 'football-data/research/audit_football3_changed_scientific_files.py'\n", "HDA_GUARD_PATH = 'football-data/research/audit_football3_changed_scientific_files.py'\nVALIDATOR_PATH = 'football-data/research/validate_football3_experiment.py'\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "DEDICATED_EXEMPT_PRODUCTION_CONTRACTS = {\n    'football-data/research/football3_hda.py',\n    'football-data/research/audit_football3_changed_scientific_files.py',\n    'football-data/research/run_football3_hda_zero_label_audit.py',\n}\n", "DEDICATED_EXEMPT_PRODUCTION_CONTRACTS = {\n    'football-data/research/football3_hda.py',\n    'football-data/research/audit_football3_changed_scientific_files.py',\n    'football-data/research/run_football3_hda_zero_label_audit.py',\n    'football-data/research/validate_football3_experiment.py',\n}\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "        'DEDICATED_EXEMPT_PRODUCTION_CONTRACTS': {\n            'football-data/research/football3_hda.py',\n            'football-data/research/audit_football3_changed_scientific_files.py',\n            'football-data/research/run_football3_hda_zero_label_audit.py',\n        },\n", "        'DEDICATED_EXEMPT_PRODUCTION_CONTRACTS': {\n            'football-data/research/football3_hda.py',\n            'football-data/research/audit_football3_changed_scientific_files.py',\n            'football-data/research/run_football3_hda_zero_label_audit.py',\n            'football-data/research/validate_football3_experiment.py',\n        },\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', 'def _strict_module_ast_contract_blockers(\n', "\ndef _validator_frozen_semantic_blockers(tree: ast.Module, path: Path) -> list[str]:\n    blockers: list[str] = []\n    scalar_expectations = {\n        'MARKET_EXPERIMENT_KIND': 'market_experiment',\n        'FORMAL_WIRING_KIND': 'formal_wiring',\n    }\n    for name, expected in scalar_expectations.items():\n        ok, actual = _literal_top_level_assignment(tree, name)\n        if not ok or actual != expected:\n            blockers.append(\n                f'{path}: FROZEN_SEMANTIC_ASSERTION_FAILED {name}; expected={expected!r} actual={actual!r}'\n            )\n    expected_forbidden = {\n        'odds', 'provider', 'secret', 'training', 'tuning',\n        'new_target_labels', 'prospective_queue', 'dynamic_execution',\n    }\n    ok, actual = _literal_top_level_assignment(tree, 'FORMAL_WIRING_FORBIDDEN_CAPABILITIES')\n    if not ok or actual != expected_forbidden:\n        blockers.append(\n            f'{path}: FROZEN_SEMANTIC_ASSERTION_FAILED FORMAL_WIRING_FORBIDDEN_CAPABILITIES; '\n            f'expected={sorted(expected_forbidden)} actual={actual!r}'\n        )\n    return blockers\n\n\ndef _strict_module_ast_contract_blockers(\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "    if semantic_checker is _guard_frozen_semantic_blockers:\n        blockers.extend(_guard_frozen_semantic_blockers(tree, path))\n    elif semantic_checker is _audit_frozen_semantic_blockers:\n        blockers.extend(_audit_frozen_semantic_blockers(tree, path))\n    else:\n", "    if semantic_checker is _guard_frozen_semantic_blockers:\n        blockers.extend(_guard_frozen_semantic_blockers(tree, path))\n    elif semantic_checker is _audit_frozen_semantic_blockers:\n        blockers.extend(_audit_frozen_semantic_blockers(tree, path))\n    elif semantic_checker is _validator_frozen_semantic_blockers:\n        blockers.extend(_validator_frozen_semantic_blockers(tree, path))\n    else:\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', 'def hda_audit_module_blockers(\n', "\ndef validator_module_blockers(\n    path: Path,\n    *,\n    expected_canonical_ast_sha256: str,\n) -> list[str]:\n    expected = _require_external_canonical_ast_sha256(\n        expected_canonical_ast_sha256,\n        label='expected validator canonical AST SHA-256',\n    )\n    return _strict_module_ast_contract_blockers(\n        path,\n        expected_canonical_ast_sha256=expected,\n        contract_name='FOOTBALL3_VALIDATOR_DEDICATED_AST_CONTRACT_CANONICAL_V1',\n        semantic_checker=_validator_frozen_semantic_blockers,\n    )\n\n\ndef hda_audit_module_blockers(\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "    ap.add_argument('--expected-guard-canonical-ast-sha256', required=True)\n    ap.add_argument('--expected-audit-canonical-ast-sha256', required=True)\n", "    ap.add_argument('--expected-guard-canonical-ast-sha256', required=True)\n    ap.add_argument('--expected-audit-canonical-ast-sha256', required=True)\n    ap.add_argument('--expected-validator-canonical-ast-sha256', required=True)\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "        expected_audit_canonical_ast_sha256 = _require_external_canonical_ast_sha256(\n            args.expected_audit_canonical_ast_sha256,\n            label='expected audit canonical AST SHA-256',\n        )\n", "        expected_audit_canonical_ast_sha256 = _require_external_canonical_ast_sha256(\n            args.expected_audit_canonical_ast_sha256,\n            label='expected audit canonical AST SHA-256',\n        )\n        expected_validator_canonical_ast_sha256 = _require_external_canonical_ast_sha256(\n            args.expected_validator_canonical_ast_sha256,\n            label='expected validator canonical AST SHA-256',\n        )\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', "    blockers.extend(\n        hda_audit_module_blockers(\n            Path(HDA_AUDIT_PATH),\n            expected_canonical_ast_sha256=expected_audit_canonical_ast_sha256,\n        )\n    )\n\n    active = set(active_v2_contracts())\n", "    blockers.extend(\n        hda_audit_module_blockers(\n            Path(HDA_AUDIT_PATH),\n            expected_canonical_ast_sha256=expected_audit_canonical_ast_sha256,\n        )\n    )\n    blockers.extend(\n        validator_module_blockers(\n            Path(VALIDATOR_PATH),\n            expected_canonical_ast_sha256=expected_validator_canonical_ast_sha256,\n        )\n    )\n\n    active = set(active_v2_contracts())\n")
          replace_once('football-data/research/audit_football3_changed_scientific_files.py', '        # Dynamic execution/import/reflection authority is a hard blocker before any\n        # infrastructure exemption. Synthetic tests are the only surface allowed to hold\n        # malicious examples, and those examples are parsed by the guard rather than executed.\n        if file_name != HDA_TEST_PATH:\n', '        # Dedicated production surfaces are admitted only by exact externally supplied\n        # canonical-AST identity above; do not re-interpret their frozen internals through\n        # the generic capability scanner.\n        if file_name in DEDICATED_EXEMPT_PRODUCTION_CONTRACTS:\n            continue\n\n        # Dynamic execution/import/reflection authority is a hard blocker before any\n        # ordinary infrastructure exemption. Synthetic tests are the only surface allowed\n        # to hold malicious examples, and those examples are parsed rather than executed.\n        if file_name != HDA_TEST_PATH:\n')
          t=Path("football-data/research/FOOTBALL3_EXPERIMENT_CONTRACT_TEMPLATE_V2.json")
          obj=json.loads(t.read_text(encoding="utf-8"))
          obj["experiment_kind"]="market_experiment"
          t.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          payloads={'adapter': ' djFfZW5naW5lCg...TRUNCATED_FOR_DISPLAY...','tests':'...','runner':'...','contract':'...','wiring':'...'}
          out={
          "football-data/new_engine_v1/formal_fusion_v2.py":"adapter",
          "football-data/new_engine_v1/test_formal_fusion_v2.py":"tests",
          "football-data/research/run_historical_xg_fusion_v2_formal_wiring.py":"runner",
          "football-data/research/experiments/HISTORICAL_XG_FUSION_V2_FORMAL_WIRING_V2.json":"contract",
          "football-data/historical_xg_fusion_v2/contracts/FORMAL_FUSION_V2_WIRING.json":"wiring",
          }
          for path,key in out.items():
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(base64.b64decode(payloads[key]).decode("utf-8"),encoding="utf-8")
          print("PATCH_APPLIED")
          PY

      - name: Compile and run schema and formal-wiring tests
        shell: bash
        env:
          PYTHONPATH: football-data:football-data/research
        run: |
          set -euo pipefail
          python -m py_compile             football-data/research/validate_football3_experiment.py             football-data/research/audit_football3_changed_scientific_files.py             football-data/research/run_historical_xg_fusion_v2_formal_wiring.py             football-data/new_engine_v1/formal_fusion_v2.py             football-data/new_engine_v1/test_formal_fusion_v2.py
          pytest -q football-data/research/test_validate_football3_experiment.py
