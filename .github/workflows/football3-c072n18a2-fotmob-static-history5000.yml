name: football3-c072n18a2-fotmob-static-history5000

on:
  pull_request:
    paths:
      - 'football-data/research/C072N18A2_FOTMOB_STATIC_HISTORY5000_ACQUISITION_CONTRACT.md'
      - 'football-data/research/acquire_c072n18a2_fotmob_static_history5000.py'
      - '.github/workflows/football3-c072n18a2-fotmob-static-history5000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-static-history5000:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Acquire frozen six-asset history source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python football-data/research/acquire_c072n18a2_fotmob_static_history5000.py

      - name: Assert exact 5000 and zero target use
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('football-data/research/_n18a2_fotmob_history5000/fotmob_n18a2_history5000_summary.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          assert x['status'] == 'PASS_FOTMOB_STATIC_HISTORY5000', x
          assert x['selected_match_count'] == 5000, x
          assert x['persisted_outcome_fields'] == 0, x
          assert x['model_fits'] == 0, x
          assert x['target_scores'] == 0, x
          assert len(x['frozen_assets']) == 6, x
          print('C072N18A2_HISTORY5000_PASS')
          PY

      - name: Assert no raw CSV retained in artifact directory
        run: |
          if find football-data/research/_n18a2_fotmob_history5000 -type f -name '*.csv' | grep -q .; then
            echo 'raw CSV unexpectedly retained' >&2
            exit 1
          fi

      - name: Upload processed source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-c072n18a2-fotmob-history5000-${{ github.sha }}-${{ github.run_id }}
          path: football-data/research/_n18a2_fotmob_history5000/
          if-no-files-found: warn
          retention-days: 30
