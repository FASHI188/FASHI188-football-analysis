name: Football fabul0us OU25 B04 settlement from freeze artifact R1

on:
  push:
    branches: [research/fabulous-ou25-b01-input-audit-r1]
    paths:
      - '.github/workflows/football-fabulous-ou25-b04-settlement-from-freeze-artifact-r1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football-fabulous-ou25-b04-settlement-from-freeze-artifact-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  immutable-freeze-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install settlement dependencies only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 pyarrow==21.0.0

      - name: Download immutable B04 freeze artifact and verify ZIP digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b04freeze /tmp/fab
          curl -sS -L --fail --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FASHI188/FASHI188-football-analysis/actions/artifacts/9277646065/zip' \
            -o /tmp/b04freeze.zip
          test "$(sha256sum /tmp/b04freeze.zip | awk '{print $1}')" = '6ea9db8397e07087731a02c11c084196ab8b2e5356d43e7be0b593405e3ea221'
          unzip -q /tmp/b04freeze.zip -d /tmp/b04freeze

      - name: Restore and hard-verify all frozen B04 locks before labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_input_audit_r1
          mkdir -p football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_r1
          cp -a /tmp/b04freeze/fabulous_ou25_b04_input_audit_r1/. football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_input_audit_r1/
          cp -a /tmp/b04freeze/fabulous_ou25_b04_market_direct_t_r1/. football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_r1/
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('football-data/research/anonymous_data_reserve_r1')
          inp=root/'fabulous_ou25_b04_input_audit_r1'; frz=root/'fabulous_ou25_b04_market_direct_t_r1'
          manifest='ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'
          packet='6f54c961c411263ecbd9cf7afe3a5c6ed565d25b5429dc32affcdc900d41ed5a'
          pred='441fe70c4cf40fd55cfc4cf6ff8baff69910f2171b2cce4c730704fc2611bf00'
          prereg='8a7caa4d29e6770b8cc30079f6f013eb133e9c281423e3fb407c46701549e705'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          s=json.loads((inp/'summary.json').read_text())
          assert s['status']=='ZERO_LABEL_COMPLETE' and s['b04_n']==359 and s['b04_hash_match'] is True
          assert s['b04_manifest_sha256_reconstructed']==manifest
          assert s['target_labels_accessed']==0 and s['target_outcome_columns_read']==[]
          assert sha(inp/'B04_pre_match_inputs_all_cutoffs.json')==packet
          assert sha(frz/'B04_frozen_predictions.csv')==pred
          assert sha(frz/'preregistration_and_prediction_lock.json')==prereg
          lock=json.loads((frz/'preregistration_and_prediction_lock.json').read_text())
          assert lock['status']=='PREDICTIONS_FROZEN_LABELS_UNOPENED'
          assert lock['target']['batch_id']=='FAB-OU25-PIT-B04' and lock['target']['batch_manifest_sha256']==manifest
          assert lock['target']['n']==359 and lock['target']['target_labels_accessed']==0
          assert lock['model']['selected_C']==0.1
          assert lock['model']['baseline_features']==['logit_pH','logit_pD','logit_pA']
          assert lock['model']['candidate_features']==['logit_pH','logit_pD','logit_pA','ou25_logit_over']
          assert lock['science_gate']['PASS']=='point delta < 0 AND calendar-date/bootstrap90 upper bound < 0'
          print('B04_IMMUTABLE_FREEZE_LOCKS_VERIFIED_BEFORE_LABELS')
          PY

      - name: Download pinned fixture identity source without reading outcome columns locally
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/fixtures.parquet?download=true' \
            -o /tmp/fab/fixtures.parquet
          test "$(sha256sum /tmp/fab/fixtures.parquet | awk '{print $1}')" = '7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7'

      - name: One-shot open B04 labels through target-only 10-ID filters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          import pandas as pd
          import pyarrow.parquet as pq
          pred=pd.read_csv('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_r1/B04_frozen_predictions.csv')
          ids=sorted(pred.fixture_id.astype(int).tolist())
          assert len(ids)==359 and len(set(ids))==359
          nonout=['id','date_utc','league_id','home_team_id','away_team_id','is_played']
          local=pq.read_table('/tmp/fab/fixtures.parquet',columns=nonout).to_pandas()
          local=local[local.id.isin(ids)].set_index('id')
          assert len(local)==359
          endpoint='https://datasets-server.huggingface.co/filter'; collected={}; successful_queries=0
          for start in range(0,359,10):
              chunk=ids[start:start+10]
              where=' OR '.join(f'"id"={i}' for i in chunk)
              params={'dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train','where':where,'offset':'0','length':'20'}
              url=endpoint+'?'+urllib.parse.urlencode(params)
              for attempt in range(1,7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'football-research-target-only-settlement/1.4'})
                      with urllib.request.urlopen(req,timeout=90) as r: x=json.load(r)
                      break
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as e:
                      print(f'B04_BATCH_RETRY start={start} attempt={attempt} error={e}',flush=True)
                      if attempt==6: raise
                      time.sleep(min(2**attempt,20))
              assert x.get('partial',False) is False
              rows=x.get('rows',[]); got={int(z['row']['id']) for z in rows}
              assert got==set(chunk),(start,len(rows),sorted(set(chunk)-got),sorted(got-set(chunk)))
              for z in rows:
                  row=z['row']; fid=int(row['id']); ref=local.loc[fid]
                  assert int(row['league_id'])==int(ref['league_id'])
                  assert int(row['home_team_id'])==int(ref['home_team_id'])
                  assert int(row['away_team_id'])==int(ref['away_team_id'])
                  assert bool(row['is_played'])==bool(ref['is_played'])
                  assert pd.to_datetime(row['date_utc'],utc=True)==pd.to_datetime(ref['date_utc'],utc=True)
                  collected[fid]={'fixture_id':fid,'goals_home':int(row['goals_home']),'goals_away':int(row['goals_away']),'is_played':bool(row['is_played'])}
              successful_queries+=1
              print(f'B04_BATCH_SUCCESS start={start} n={len(chunk)} cumulative={len(collected)}',flush=True)
              time.sleep(0.1)
          assert set(collected)==set(ids)
          canonical='\n'.join(map(str,ids))+'\n'
          receipt={'schema_version':'FAB-OU25-B04-TARGET-ONLY-LABEL-RECEIPT-R1','status':'B04_TARGET_ONLY_LABELS_OPENED','dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train','filter_endpoint':endpoint,'filter_query_count':successful_queries,'max_requested_ids_per_query':10,'requested_fixture_count':359,'returned_fixture_count':359,'requested_fixture_set_sha256':hashlib.sha256(canonical.encode()).hexdigest(),'non_target_rows_returned':0,'non_B04_fixture_ids_requested':0,'identity_match_to_pinned_fixture_source':True,'pinned_fixture_source_sha256':'7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7','labels':[collected[i] for i in ids]}
          assert successful_queries==36
          p=Path('/tmp/fab/B04_labels_target_only.json'); p.write_text(json.dumps(receipt,ensure_ascii=False,separators=(',',':'))+'\n')
          print('B04_TARGET_ONLY_LABEL_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          print('B04_LABELS_OPENED=359 NON_TARGET=0',flush=True)
          PY

      - name: Settle unchanged B04 preregistered science gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('football-data/validation/settle_fabulous_ou25_b02_market_direct_t_r1.py').read_text(encoding='utf-8')
          required=[
            "EXPECTED_B02_MANIFEST_SHA = '5f642afc51175ae693d45cb0393a78b3b2d5bd8bc8fb5b1a67567f21a3a906e2'",
            "EXPECTED_PACKET_SHA = 'b5c8019a06fa0b75ba9b205a552beabc1e84e7877e1095d86c2e8125bfc2d6ed'",
            "EXPECTED_PRED_SHA = '9b771c9466842e97fe8984945cc9b2c9f26d6531bab27f7f871305b6e2c8c008'",
            "EXPECTED_LOCK_SHA = '0dd9d39157578b2f3c0d78b66df6bfff5896c6d1a729609bc2ab34cd0d5e45ab'",
            "BOOTSTRAP_SEED = 20260817",
            "BOOTSTRAP_REPS = 20000",
          ]
          for x in required: assert x in src, x
          out=src.replace('B02','B04').replace('b02','b04')
          out=out.replace("EXPECTED_B04_MANIFEST_SHA = '5f642afc51175ae693d45cb0393a78b3b2d5bd8bc8fb5b1a67567f21a3a906e2'","EXPECTED_B04_MANIFEST_SHA = 'ac9252cd22e45807d0e4d839cdfcf61c9330de0b459995c237ca6a9f2237d9e3'")
          out=out.replace("EXPECTED_PACKET_SHA = 'b5c8019a06fa0b75ba9b205a552beabc1e84e7877e1095d86c2e8125bfc2d6ed'","EXPECTED_PACKET_SHA = '6f54c961c411263ecbd9cf7afe3a5c6ed565d25b5429dc32affcdc900d41ed5a'")
          out=out.replace("EXPECTED_PRED_SHA = '9b771c9466842e97fe8984945cc9b2c9f26d6531bab27f7f871305b6e2c8c008'","EXPECTED_PRED_SHA = '441fe70c4cf40fd55cfc4cf6ff8baff69910f2171b2cce4c730704fc2611bf00'")
          out=out.replace("EXPECTED_LOCK_SHA = '0dd9d39157578b2f3c0d78b66df6bfff5896c6d1a729609bc2ab34cd0d5e45ab'","EXPECTED_LOCK_SHA = '8a7caa4d29e6770b8cc30079f6f013eb133e9c281423e3fb407c46701549e705'")
          out=out.replace("lock['target']['n'] == 400","lock['target']['n'] == 359")
          out=out.replace("if len(pred) != 400 or pred['fixture_id'].nunique() != 400:","if len(pred) != 359 or pred['fixture_id'].nunique() != 359:")
          out=out.replace("receipt['requested_fixture_count'] == 400","receipt['requested_fixture_count'] == 359")
          out=out.replace("receipt['returned_fixture_count'] == 400","receipt['returned_fixture_count'] == 359")
          out=out.replace("receipt['B03_B04_fixture_ids_requested']", "receipt['non_B04_fixture_ids_requested']")
          out=out.replace("if len(labels) != 400 or labels['fixture_id'].nunique() != 400:","if len(labels) != 359 or labels['fixture_id'].nunique() != 359:")
          out=out.replace("'rows': 400,","'rows': 359,")
          out=out.replace("'B04_labels_opened_in_this_run': 400,","'B04_labels_opened_in_this_run': 359,")
          out=out.replace("'B03_B04_fixture_ids_requested': 0,","'non_B04_fixture_ids_requested': 0,")
          out=out.replace("'B01_state_before_run': 'VIEWED_PREVIOUSLY',\n        'B01_labels_read_in_this_run': 0,","'prior_B01_B02_B03_state_before_run': 'VIEWED_PREVIOUSLY',\n        'prior_B01_B02_B03_labels_read_in_this_run': 0,")
          out=out.replace("'label_columns_materialized_for_non_B04_rows_in_this_run': 0,","'label_columns_materialized_for_non_B04_rows_in_this_run': 0,")
          out=out.replace('max 40 requested IDs per query','max 10 requested IDs per query')
          out=out.replace("'B01_state_after_run': 'VIEWED',\n        'B04_state_after_run': 'VIEWED',\n        'B03_B04_state_after_run': 'UNOPENED_BY_TARGET_ONLY_QUERY',","'prior_B01_B02_B03_state_after_run': 'VIEWED',\n        'B04_state_after_run': 'VIEWED',\n        'sealed_reserve_state_after_run': 'ALL_B01_B02_B03_B04_VIEWED',")
          assert "BOOTSTRAP_SEED = 20260817" in out and "BOOTSTRAP_REPS = 20000" in out
          assert "assert lock['model']['selected_C'] == 0.1" in out
          assert "assert lock['science_gate']['PASS'] == 'point delta < 0 AND calendar-date/bootstrap90 upper bound < 0'" in out
          assert "'locked_rule': 'PASS iff LL point delta < 0 AND calendar-date block-bootstrap90 upper < 0 AND Brier point delta <= 0 AND RPS point delta <= 0'" in out
          runtime=Path('football-data/validation/_runtime_settle_fabulous_ou25_b04_market_direct_t_r1.py')
          runtime.write_text(out,encoding='utf-8')
          PY
          python football-data/validation/_runtime_settle_fabulous_ou25_b04_market_direct_t_r1.py
          rm -f football-data/validation/_runtime_settle_fabulous_ou25_b04_market_direct_t_r1.py

      - name: Verify and print aggregate B04 settlement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_settlement_r1/settlement_summary.json')
          x=json.loads(p.read_text())
          assert x['settlement_scope']['B04_labels_opened_in_this_run']==359
          assert x['settlement_scope']['non_B04_fixture_ids_requested']==0
          assert x['settlement_scope']['label_columns_materialized_for_non_B04_rows_in_this_run']==0
          assert x['governance']['B04_state_after_run']=='VIEWED'
          assert x['governance']['sealed_reserve_state_after_run']=='ALL_B01_B02_B03_B04_VIEWED'
          assert x['governance']['post_result_parameter_search_allowed_on_B04'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY

      - name: Upload aggregate B04 settlement only
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-ou25-b04-settlement-from-freeze-artifact-r1-${{ github.sha }}
          path: football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b04_market_direct_t_settlement_r1/settlement_summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm no tracked runtime mutation
        shell: bash
        run: |
          rm -rf football-data/validation/__pycache__
          rm -f football-data/validation/_runtime_settle_fabulous_ou25_b04_market_direct_t_r1.py
          git diff --exit-code
          git diff --cached --exit-code
