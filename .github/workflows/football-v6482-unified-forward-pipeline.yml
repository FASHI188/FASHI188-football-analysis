name: Football V6.49.4 Unified 17-Domain Forward Pipeline MANUAL_ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-v6494-unified-forward-pipeline-manual
  cancel-in-progress: true

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze manual acquisition batch start
        shell: bash
        run: echo "BATCH_START_UTC=$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')" >> "$GITHUB_ENV"
      - name: Compile current execution chain
        run: |
          python -m py_compile football-data/validation/audit_current_research_scope_v6494.py
          python -m py_compile football-data/validation/v6_full17_identity_registry_v6482.py
          python -m py_compile football-data/validation/v6_full17_capture_identity_v6484.py
          python -m py_compile football-data/validation/v6_full17_kambi_capture_v6484.py
          python -m py_compile football-data/validation/v6_market_first_forward_v652.py
          python -m py_compile football-data/validation/v6_fresh_market_forward_challengers_v6492.py
          python -m py_compile football-data/validation/v6_match_context_pit_ledger_v6310.py
          python -m py_compile football-data/validation/v6_market_first_result_resolver_v651.py
          python -m py_compile football-data/validation/audit_unified_forward_pipeline_v6482.py
      - name: Run manual forward chain in ephemeral checkout
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python football-data/validation/audit_current_research_scope_v6494.py
          python football-data/validation/v6_full17_identity_registry_v6482.py
          python football-data/validation/v6_full17_capture_identity_v6484.py
          python football-data/validation/v6_full17_kambi_capture_v6484.py --batch-start-utc "$BATCH_START_UTC"
          python football-data/validation/v6_market_first_forward_v652.py
          python football-data/validation/v6_fresh_market_forward_challengers_v6492.py
          python football-data/validation/v6_match_context_pit_ledger_v6310.py
          python football-data/validation/v6_market_first_result_resolver_v651.py
          python football-data/validation/audit_unified_forward_pipeline_v6482.py
      - name: Confirm no repository persistence
        run: git status --short
