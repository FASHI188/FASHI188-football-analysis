name: football3 R43E2 hierarchical draw coach older20k

on:
  push:
    branches:
      - football3/r43e2-hierarchical-draw-coach-older20k
    paths:
      - 'football-data/experiments/r43e2_hierarchical_draw_coach_older20k/**'
      - '.github/workflows/football3-r43e2-hierarchical-draw-coach-older20k.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43e2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43e2-hierarchical-draw-coach-older20k
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R43E2 hierarchical draw coach test
        run: python football-data/experiments/r43e2_hierarchical_draw_coach_older20k/run_r43e2.py run
      - name: Verify R43E2 contract
        run: python football-data/experiments/r43e2_hierarchical_draw_coach_older20k/run_r43e2.py verify
      - name: Persist R43E2 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43e2_hierarchical_draw_coach_older20k/results/summary_r43e2_hierarchical_draw_coach_older20k.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43E2 hierarchical draw coach older20k'
            git fetch origin football3/r43e2-hierarchical-draw-coach-older20k
            git rebase origin/football3/r43e2-hierarchical-draw-coach-older20k
            git push origin HEAD:football3/r43e2-hierarchical-draw-coach-older20k
          fi
      - name: Upload R43E2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43e2-hierarchical-draw-coach-older20k
          path: football-data/experiments/r43e2_hierarchical_draw_coach_older20k/results/summary_r43e2_hierarchical_draw_coach_older20k.json
          if-no-files-found: error
          retention-days: 90
