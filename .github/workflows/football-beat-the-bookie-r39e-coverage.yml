name: Football Beat The Bookie R39E Full72h Coverage

on:
  push:
    branches: [research/beat-the-bookie-r39e-full72h-trajectory]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39e-coverage.yml'
      - 'football-data/research/beat_the_bookie_r39/coverage_registration_r39e.json'
      - 'football-data/research/beat_the_bookie_r39/diagnose_full72h_coverage_r39e.py'
  pull_request:
    branches: [research/beat-the-bookie-r39d-draw-boundary]
    paths:
      - '.github/workflows/football-beat-the-bookie-r39e-coverage.yml'
      - 'football-data/research/beat_the_bookie_r39/coverage_registration_r39e.json'
      - 'football-data/research/beat_the_bookie_r39/diagnose_full72h_coverage_r39e.py'

permissions:
  contents: read

jobs:
  zero-label-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify frozen coverage contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/beat_the_bookie_r39/diagnose_full72h_coverage_r39e.py
          python -m json.tool football-data/research/beat_the_bookie_r39/coverage_registration_r39e.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/beat_the_bookie_r39/coverage_registration_r39e.json').read_text())
          assert r['selection_rule_after_coverage_only']['preferred_order']==['STRICT_COMMON5_ALL72','PER_HOUR5_ALL72','PER_HOUR5_AT_LEAST60_PLUS_FINAL6','SIX_HOURLY_GRID5']
          assert r['selection_rule_after_coverage_only']['labels_may_not_influence_lane_selection'] is True
          assert r['no_label_contract']['score_values_accessed']==0
          assert r['hard_limits']['formal_weight']==0
          print('PASS_R39E_COVERAGE_CONTRACT')
          PY
      - name: Download independent source
        run: |
          set -euo pipefail
          rm -rf r39e-source r39e-sanitized r39e-output r39e-source.zip
          mkdir -p r39e-source r39e-sanitized
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset' -o r39e-source.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('r39e-source.zip');wanted=('odds_series.csv.gz','odds_series_b.csv.gz');names=set(z.namelist());assert set(wanted)<=names
          for n in wanted:z.extract(n,'r39e-source')
          PY
      - name: Strip score columns before Python
        run: |
          set -euo pipefail
          for base in odds_series odds_series_b; do
            gzip -dc "r39e-source/${base}.csv.gz" | cut -d',' -f1-3,6- | gzip -c > "r39e-sanitized/${base}_no_scores.csv.gz"
          done
          rm -rf r39e-source r39e-source.zip
      - name: Run full72h coverage audit
        run: |
          set -euo pipefail
          python football-data/research/beat_the_bookie_r39/diagnose_full72h_coverage_r39e.py \
            --registration football-data/research/beat_the_bookie_r39/coverage_registration_r39e.json \
            --source-dir r39e-sanitized --out-dir r39e-output
      - name: Verify zero-label result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39e-output/coverage_status_r39e.json').read_text())
          assert r['status'] in {'PASS_R39E_FULL72H_COVERAGE_LANE_SELECTED_NO_LABELS','STOP_R39E_FULL72H_COVERAGE_NO_LANE'}
          n=r['no_label_audit'];assert n['score_values_accessed']==0 and n['result_values_accessed']==0 and n['model_fit']==0 and n['match_identity_lock']==0
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-beat-the-bookie-r39e-coverage-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: r39e-output/
          if-no-files-found: error
          retention-days: 30
