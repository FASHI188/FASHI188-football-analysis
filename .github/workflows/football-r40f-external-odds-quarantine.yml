name: Football R40F External Odds Quarantine

on:
  pull_request:
    branches:
      - research/betfair-kaggle-timestamp-coverage-r39a
    paths:
      - '.github/workflows/football-r40f-external-odds-quarantine.yml'

permissions:
  contents: read

jobs:
  zero-label-quarantine-audit:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact R40F zero-label contract
        run: |
          set -euo pipefail
          python -m json.tool football-data/research/beat_the_bookie_r39/external_odds_quarantine_registration_r40f.json >/dev/null
          python -m py_compile football-data/research/beat_the_bookie_r39/audit_external_odds_quarantine_r40f.py
          test "$(git hash-object football-data/research/beat_the_bookie_r39/external_odds_quarantine_registration_r40f.json)" = "208580008633c3b454bd8ed9082cfa03f85d2fe4"
          test "$(git hash-object football-data/research/beat_the_bookie_r39/audit_external_odds_quarantine_r40f.py)" = "86f20c0226c8ad5291a438d5df894578589ea266"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/beat_the_bookie_r39/external_odds_quarantine_registration_r40f.json').read_text())
          assert r['status']=='PRE_REGISTERED_ZERO_LABEL_EXTERNAL_ODDS_QUARANTINE_AUDIT'
          assert r['parent_r40e']['verdict']=='STOP_R40E_EXTERNAL_ODDS_PIT_COVERAGE'
          assert r['parent_r40e']['verdict_must_not_be_overridden'] is True
          assert r['hard_limits']['result_labels_allowed'] is False
          assert r['hard_limits']['result_file_extraction_allowed'] is False
          assert r['hard_limits']['fifth_fixed100_authorized'] is False
          print('PASS_R40F_ZERO_LABEL_CONTRACT')
          PY

      - name: Download exact independent archive
        run: |
          set -euo pipefail
          rm -rf r40f-source r40f-output r40f-archive.zip
          mkdir -p r40f-source r40f-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/eladsil/football-games-odds' \
            -o r40f-archive.zip
          echo '20baff7a0d65fc667225187430af7b13eab4b27e56695a8bc4f907e8c498f6f9  r40f-archive.zip' | sha256sum -c -

      - name: Extract odds only; result file forbidden
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil, zipfile
          from pathlib import PurePosixPath
          z=zipfile.ZipFile('r40f-archive.zip')
          members=z.namelist()
          odds=[m for m in members if PurePosixPath(m).name.casefold()=='matches_odds.csv']
          results=[m for m in members if PurePosixPath(m).name.casefold()=='matches_results.csv']
          assert len(odds)==1, odds
          assert len(results)==1, results
          with z.open(odds[0]) as src, open('r40f-source/Matches_Odds.csv','wb') as dst:
              shutil.copyfileobj(src,dst)
          print('result member present but not extracted:', results[0])
          PY
          test -s r40f-source/Matches_Odds.csv
          test ! -e r40f-source/Matches_Results.csv
          echo 'bfa14f07a11581ffd793b1f44d3e7c9203c631d26ac1c692fe71a77f66579298  r40f-source/Matches_Odds.csv' | sha256sum -c -
          rm -f r40f-archive.zip

      - name: Apply deterministic pre-match quarantine audit
        run: |
          set -euo pipefail
          python football-data/research/beat_the_bookie_r39/audit_external_odds_quarantine_r40f.py \
            --registration football-data/research/beat_the_bookie_r39/external_odds_quarantine_registration_r40f.json \
            --odds-csv r40f-source/Matches_Odds.csv \
            --out-dir r40f-output

      - name: Verify R40F hard boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r40f-output/external_odds_quarantine_status_r40f.json').read_text())
          assert r['parent_r40e_verdict_preserved']=='STOP_R40E_EXTERNAL_ODDS_PIT_COVERAGE'
          n=r['no_label_audit']
          assert n['result_file_extracted'] is False
          assert n['result_values_accessed']==0
          assert n['model_fits']==0 and n['prediction_metrics']==0
          assert n['thresholds_selected']==0 and n['identity_locks_created']==0
          assert n['fifth_fixed100_accessed']==0
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY

      - name: Delete downloaded odds bytes before evidence upload
        if: always()
        run: rm -rf r40f-source r40f-archive.zip

      - name: Upload aggregate R40F quarantine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-r40f-external-odds-quarantine-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: r40f-output/
          if-no-files-found: error
          retention-days: 30
