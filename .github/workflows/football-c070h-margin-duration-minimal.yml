name: Football C070-H Margin Duration Minimal

on:
  pull_request:
    paths:
      - football-data/research/c070h_margin_duration_minimal_contract.json
      - football-data/research/evaluate_c070h_margin_duration_minimal.py
      - .github/workflows/football-c070h-margin-duration-minimal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine-first-two-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 scipy==1.16.1 scikit-learn==1.7.1
      - name: Download pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c070h_source"
          curl -L --fail --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/c070h_source/database.sqlite" "https://huggingface.co/datasets/julien-c/kaggle-hugomathien-soccer/resolve/80e14cc7aa624cc266470f43a626652dabdfb80a/database.sqlite?download=true"
          echo "4df8569777d59fdd690754b1cc8ca1f7989baf65f2eaddd0f1368285f11139a9  $RUNNER_TEMP/c070h_source/database.sqlite" | sha256sum -c -
      - name: Reproduce identities
        env:
          C070F_DB: ${{ runner.temp }}/c070h_source/database.sqlite
          C070F_OUT: ${{ runner.temp }}/c070h_identity
        run: python football-data/research/c070f_fresh4000_identity_freeze.py
      - name: Run C070-H
        run: |
          mkdir -p "$RUNNER_TEMP/c070h_out"
          python football-data/research/evaluate_c070h_margin_duration_minimal.py --db "$RUNNER_TEMP/c070h_source/database.sqlite" --manifest "$RUNNER_TEMP/c070h_identity/c070f_4000_identity_manifest.csv" --out "$RUNNER_TEMP/c070h_out/summary.json"
      - name: Enforce boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c070h_out'/'summary.json').read_text())
          assert s['status']=='C070H_POSTVIEW_REFINEMENT_COMPLETE'
          assert s['payload_boundary']['confirmation_payload_opened'] is False
          assert s['payload_boundary']['confirmation_score_rows_read']==0
          assert s['payload_boundary']['confirmation_event_rows_read']==0
          assert s['boundary']['independent_evidence'] is False
          assert s['boundary']['confirmation_scored'] is False
          assert s['boundary']['formal_weight']==0
          print(json.dumps(s,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: c070h-margin-duration-minimal
          retention-days: 30
          path: |
            ${{ runner.temp }}/c070h_out/summary.json
            football-data/research/c070h_margin_duration_minimal_contract.json
