name: football3 R43C0 fatigue rotation lineup

on:
  push:
    branches:
      - football3/r43c0-fatigue-rotation-lineup
    paths:
      - 'football-data/experiments/r43c0_fatigue_rotation_lineup/**'
      - '.github/workflows/football3-r43c0-fatigue-rotation-lineup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43c0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43c0-fatigue-rotation-lineup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore R9b 20k source spine
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43C0 fatigue rotation lineup
        run: python football-data/experiments/r43c0_fatigue_rotation_lineup/run_r43c0.py run
      - name: Verify R43C0 contract
        run: python football-data/experiments/r43c0_fatigue_rotation_lineup/run_r43c0.py verify
      - name: Persist R43C0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43c0_fatigue_rotation_lineup/results/summary_r43c0_fatigue_rotation_lineup.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43C0 fatigue rotation lineup'
            git fetch origin football3/r43c0-fatigue-rotation-lineup
            git rebase origin/football3/r43c0-fatigue-rotation-lineup
            git push origin HEAD:football3/r43c0-fatigue-rotation-lineup
          fi
      - name: Upload R43C0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43c0-fatigue-rotation-lineup
          path: football-data/experiments/r43c0_fatigue_rotation_lineup/results/summary_r43c0_fatigue_rotation_lineup.json
          if-no-files-found: error
          retention-days: 90
