name: C078-A Development Observer

on:
  pull_request:
    paths:
      - .github/workflows/c078a_observer.yml

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: f315602600f605baf85cc7a9c5253ff734a82d22
      TARGET_WORKFLOW_NAME: C078-A Full-Support Direct-T NB2 Development
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for unique frozen development run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p relay
          found=0
          for i in $(seq 1 120); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
              -o relay/runs.json
            count=$(jq --arg n "$TARGET_WORKFLOW_NAME" '[.workflow_runs[] | select(.name==$n)] | length' relay/runs.json)
            if [ "$count" -gt 1 ]; then
              echo "More than one frozen C078-A run exists for $TARGET_SHA" >&2
              exit 2
            fi
            if [ "$count" -eq 1 ]; then
              jq --arg n "$TARGET_WORKFLOW_NAME" '.workflow_runs[] | select(.name==$n)' relay/runs.json > relay/run_meta.json
              found=1
              status=$(jq -r '.status' relay/run_meta.json)
              echo "target run=$(jq -r '.id' relay/run_meta.json) status=$status"
              if [ "$status" = "completed" ]; then break; fi
            fi
            sleep 10
          done
          test "$found" -eq 1
          test "$(jq -r '.status' relay/run_meta.json)" = "completed"

      - name: Relay jobs and artifact
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(jq -r '.id' relay/run_meta.json)
          conclusion=$(jq -r '.conclusion' relay/run_meta.json)
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" -o relay/jobs.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" -o relay/artifacts.json
          if [ "$conclusion" = "success" ]; then
            count=$(jq '[.artifacts[] | select(.name=="c078a-full-support-directt-development")] | length' relay/artifacts.json)
            test "$count" -eq 1
            artifact_id=$(jq -r '.artifacts[] | select(.name=="c078a-full-support-directt-development") | .id' relay/artifacts.json)
            jq '.artifacts[] | select(.name=="c078a-full-support-directt-development")' relay/artifacts.json > relay/artifact_meta.json
            curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$artifact_id/zip" -o relay/result.zip
            mkdir -p relay/extracted
            unzip -q relay/result.zip -d relay/extracted
            summary=$(find relay/extracted -type f -name summary.json | head -n1)
            test -n "$summary"
            cp "$summary" relay/scientific_summary.json
          else
            curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id/logs" -o relay/failed_run_logs.zip || true
          fi
          jq '{id,name,event,status,conclusion,head_sha,run_number,created_at,updated_at}' relay/run_meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: c078a-development-observer-relay
          retention-days: 30
          if-no-files-found: error
          path: relay/
