name: football3 R43D1 beta-binomial score dispersion

on:
  push:
    branches:
      - football3/r43d1-beta-binomial-score-dispersion-prev20k
    paths:
      - 'football-data/experiments/r43d1_beta_binomial_score_dispersion_prev20k/**'
      - '.github/workflows/football3-r43d1-beta-binomial-score-dispersion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43d1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43d1-beta-binomial-score-dispersion-prev20k
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R43D1 disjoint score-dispersion challenge
        run: python football-data/experiments/r43d1_beta_binomial_score_dispersion_prev20k/run_r43d1_fast.py run
      - name: Verify R43D1 contract
        run: python football-data/experiments/r43d1_beta_binomial_score_dispersion_prev20k/run_r43d1_fast.py verify
      - name: Persist R43D1 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43d1_beta_binomial_score_dispersion_prev20k/results/summary_r43d1_beta_binomial_score_dispersion.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43D1 beta-binomial score dispersion'
            git fetch origin football3/r43d1-beta-binomial-score-dispersion-prev20k
            git rebase origin/football3/r43d1-beta-binomial-score-dispersion-prev20k
            git push origin HEAD:football3/r43d1-beta-binomial-score-dispersion-prev20k
          fi
      - name: Upload R43D1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43d1-beta-binomial-score-dispersion-prev20k
          path: football-data/experiments/r43d1_beta_binomial_score_dispersion_prev20k/results/summary_r43d1_beta_binomial_score_dispersion.json
          if-no-files-found: error
          retention-days: 90
