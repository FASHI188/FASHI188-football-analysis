name: Football R40I0 Result Identity Audit

on:
  pull_request:
    branches:
      - research/beat-the-bookie-timeseries-r39b
    paths:
      - '.github/workflows/football-r40i0-result-identity-audit.yml'

permissions:
  contents: read

jobs:
  result-header-and-identity-only:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact R40I0 zero-label result contract
        run: |
          set -euo pipefail
          python -m json.tool football-data/research/beat_the_bookie_r39/result_identity_audit_registration_r40i0.json >/dev/null
          python -m py_compile football-data/research/beat_the_bookie_r39/audit_result_identity_r40i0.py
          test "$(git hash-object football-data/research/beat_the_bookie_r39/result_identity_audit_registration_r40i0.json)" = "024e5e4453edb2d34359cb613989c2f12cbf651b"
          test "$(git hash-object football-data/research/beat_the_bookie_r39/audit_result_identity_r40i0.py)" = "120199c7c25cc325d44594c24286ceda56146d46"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/beat_the_bookie_r39/result_identity_audit_registration_r40i0.json').read_text())
          assert r['status']=='PRE_REGISTERED_RESULT_HEADER_AND_IDENTITY_ONLY_AUDIT'
          assert r['parent_r40h1']['status']=='PASS_R40H1_EXTERNAL_ZERO_LABEL_PREDICTION_FREEZE'
          assert r['hard_limits']['score_or_outcome_values_allowed'] is False
          assert r['hard_limits']['prediction_metrics_allowed'] is False
          assert r['coverage_gate']['header_first_field_must_equal']=='match_id'
          print('PASS_R40I0_ZERO_LABEL_RESULT_CONTRACT')
          PY

      - name: Download exact independent archive
        run: |
          set -euo pipefail
          rm -rf r40i0-source r40i0-output r40i0-archive.zip r40i0-result-header.txt r40i0-result-ids.csv
          mkdir -p r40i0-source r40i0-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/eladsil/football-games-odds' \
            -o r40i0-archive.zip
          echo '20baff7a0d65fc667225187430af7b13eab4b27e56695a8bc4f907e8c498f6f9  r40i0-archive.zip' | sha256sum -c -

      - name: Extract odds and physically reduce result table to header plus first field only
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil,zipfile
          from pathlib import PurePosixPath
          z=zipfile.ZipFile('r40i0-archive.zip')
          members=z.namelist()
          odds=[m for m in members if PurePosixPath(m).name.casefold()=='matches_odds.csv']
          results=[m for m in members if PurePosixPath(m).name.casefold()=='matches_results.csv']
          assert len(odds)==1, odds
          assert len(results)==1, results
          with z.open(odds[0]) as src, open('r40i0-source/Matches_Odds.csv','wb') as dst:
              shutil.copyfileobj(src,dst)
          print(results[0])
          PY
          test -s r40i0-source/Matches_Odds.csv
          echo 'bfa14f07a11581ffd793b1f44d3e7c9203c631d26ac1c692fe71a77f66579298  r40i0-source/Matches_Odds.csv' | sha256sum -c -
          unzip -p r40i0-archive.zip Matches_Results.csv | sed -n '1p' > r40i0-result-header.txt
          unzip -p r40i0-archive.zip Matches_Results.csv | cut -d',' -f1 > r40i0-result-ids.csv
          test -s r40i0-result-header.txt
          test -s r40i0-result-ids.csv
          test "$(head -n 1 r40i0-result-ids.csv | tr -d '\r')" = 'match_id'
          rm -f r40i0-archive.zip
          test ! -e r40i0-source/Matches_Results.csv

      - name: Audit result identity coverage with no score/outcome fields visible
        run: |
          set -euo pipefail
          python football-data/research/beat_the_bookie_r39/audit_result_identity_r40i0.py \
            --registration football-data/research/beat_the_bookie_r39/result_identity_audit_registration_r40i0.json \
            --odds-csv r40i0-source/Matches_Odds.csv \
            --result-header-file r40i0-result-header.txt \
            --result-id-file r40i0-result-ids.csv \
            --out-dir r40i0-output

      - name: Verify R40I0 hard boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('r40i0-output/result_identity_audit_status_r40i0.json').read_text())
          assert s['status']=='PASS_R40I0_RESULT_HEADER_AND_IDENTITY_AUDIT', s['status']
          assert s['gates']['frozen_identity_hashes_exact']
          assert s['gates']['header_first_field_match_id']
          assert s['gates']['eligible_result_id_coverage']
          assert s['gates']['duplicate_result_match_ids_zero']
          n=s['no_label_audit']
          assert n['score_or_outcome_values_accessed']==0
          assert n['model_fits']==0 and n['prediction_metrics']==0 and n['thresholds_selected']==0
          assert n['internal_fifth_fixed100_accessed']==0
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Delete source and sanitized identity bytes before evidence upload
        if: always()
        run: rm -rf r40i0-source r40i0-archive.zip r40i0-result-header.txt r40i0-result-ids.csv

      - name: Upload R40I0 aggregate result-identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-r40i0-result-identity-audit-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: r40i0-output/
          if-no-files-found: error
          retention-days: 30
