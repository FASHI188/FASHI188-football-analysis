name: Football V5.1 Fixed100 Market Residual R34

on:
  push:
    branches:
      - research/v511-fixed100-market-residual-r34
    paths:
      - '.github/workflows/football-v511-fixed100-market-residual-r34.yml'
      - 'football-data/config/v511_fixed100_market_residual_r34.json'
      - 'football-data/validation/evaluate_v511_fixed100_market_residual_r34.py'
  pull_request:
    branches:
      - research/v510-context-market-prototype-r1
    paths:
      - '.github/workflows/football-v511-fixed100-market-residual-r34.yml'
      - 'football-data/config/v511_fixed100_market_residual_r34.json'
      - 'football-data/validation/evaluate_v511_fixed100_market_residual_r34.py'

permissions:
  contents: read

concurrency:
  group: football-v511-fixed100-market-residual-r34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed100-exploration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify frozen research inputs
        run: |
          set -euo pipefail
          python -m py_compile football-data/validation/evaluate_v510_market_residual_1x2_r1.py
          python -m py_compile football-data/validation/evaluate_v511_fixed100_market_residual_r34.py
          python -m json.tool football-data/config/v511_fixed100_market_residual_r34.json >/dev/null
          test -f football-data/benchmarks/v6_1x2_neutral_fixed1000_v6131.json
          test -f football-data/config/v510_context_market_prototype_r1.json
      - name: Run deterministic candidate self-test
        run: |
          set -euo pipefail
          python football-data/validation/evaluate_v511_fixed100_market_residual_r34.py --self-test
      - name: Run fixed 100-match exploration
        run: |
          set -euo pipefail
          rm -rf r34-output
          python football-data/validation/evaluate_v511_fixed100_market_residual_r34.py \
            --config football-data/config/v511_fixed100_market_residual_r34.json \
            --out-dir r34-output
      - name: Verify result and hard boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('r34-output')
          result=json.loads((root/'status.json').read_text(encoding='utf-8'))
          assert result['status'] in {
              'PROMISING_FIXED100_POINT_SIGNAL_EXPLORATION_ONLY',
              'NO_FIXED100_POINT_IMPROVEMENT_EXPLORATION_ONLY',
          }
          source=result['source']
          assert source['source_rows']==1000
          assert source['market_complete_eligible_rows']>=100
          assert (
              source['market_complete_eligible_rows']
              + sum(source['pre_result_exclusions'].values())
              == source['source_rows']
          )
          assert source['external_collection']==0
          sample=result['sample']
          assert sample['rows']==100
          assert sample['selection_uses_labels'] is False
          assert sample['selection_frozen_before_any_label_parsing'] is True
          assert sample['no_resampling_after_result'] is True
          execution=result['execution']
          assert execution['prequential_predictions_over_all_market_complete_rows'] is True
          assert execution['prequential_prediction_rows']==source['market_complete_eligible_rows']
          assert execution['same_day_predictions_frozen_before_updates'] is True
          assert execution['candidate_catalog_fixed_before_scoring'] is True
          assert execution['test_labels_used_to_remove_candidates'] is False
          assert set(result['metrics'])=={
              'market','full_residual','linear_residual_25','linear_residual_50',
              'linear_residual_75','log_pool_50','draw_only_full','draw_only_half',
          }
          assert all(value['rows']==100 for value in result['metrics'].values())
          hard=result['hard_limits']
          assert hard['formal_weight']==0
          assert hard['formal_promotion_allowed'] is False
          assert hard['independent_confirmation_claim_allowed'] is False
          assert hard['current_match_probability_allowed'] is False
          assert hard['current_match_direction_allowed'] is False
          assert hard['unified_matrix_allowed'] is False
          assert hard['exact_score_allowed'] is False
          assert hard['ev_allowed'] is False
          assert hard['provider_requests']==0
          assert hard['external_collection']==0
          assert hard['CURRENT_mutation']==0
          assert hard['formal_model_data_config_mutation']==0
          assert hard['main_mutation']==0
          assert {path.name for path in root.iterdir()}=={
              'status.json','candidate_summary.csv',
              'fixed100_predictions.csv','manifest.json'
          }
          print(json.dumps({
              'status':result['status'],
              'source':source,
              'sample':sample,
              'descriptive_best':result['descriptive_best'],
              'promising_point_candidates':result['promising_point_candidates'],
              'metrics':result['metrics'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Confirm isolated research diff
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          base='5cea629865231fcadf7c2d6a64ab2a125628a3f6'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',f'{base}...HEAD'],
              text=True,
          ).splitlines())
          expected={
              '.github/workflows/football-v511-fixed100-market-residual-r34.yml',
              'football-data/config/v511_fixed100_market_residual_r34.json',
              'football-data/validation/evaluate_v511_fixed100_market_residual_r34.py',
          }
          assert changed==expected,(changed,expected)
          print({'changed':sorted(changed),'formal_asset_changes':0})
          PY
      - name: Upload fixed100 research evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-v511-fixed100-market-residual-r34-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: r34-output/
          if-no-files-found: error
          retention-days: 30
