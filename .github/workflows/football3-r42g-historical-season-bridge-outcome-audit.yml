name: football3 R42G historical season bridge outcome audit

on:
  push:
    branches:
      - football3/r42g-historical-season-bridge-outcome-audit
    paths:
      - football-data/experiments/r42g_historical_season_bridge_outcome_audit/**
      - .github/workflows/football3-r42g-historical-season-bridge-outcome-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r42g-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r42g-historical-season-bridge-outcome-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R42G outcome audit
        run: python football-data/experiments/r42g_historical_season_bridge_outcome_audit/run_r42g_outcome_audit.py run
      - name: Verify R42G contract
        run: python football-data/experiments/r42g_historical_season_bridge_outcome_audit/run_r42g_outcome_audit.py verify
      - name: Persist R42G evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r42g_historical_season_bridge_outcome_audit/results/summary_r42g_outcome_audit.json
          git add football-data/experiments/r42g_historical_season_bridge_outcome_audit/results/oos_records_r42g.jsonl
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R42G historical season bridge outcome audit'
            git fetch origin football3/r42g-historical-season-bridge-outcome-audit
            git rebase origin/football3/r42g-historical-season-bridge-outcome-audit
            git push origin HEAD:football3/r42g-historical-season-bridge-outcome-audit
          fi
      - name: Upload R42G artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r42g-historical-season-bridge-outcome-audit
          path: |
            football-data/experiments/r42g_historical_season_bridge_outcome_audit/results/summary_r42g_outcome_audit.json
            football-data/experiments/r42g_historical_season_bridge_outcome_audit/results/oos_records_r42g.jsonl
          if-no-files-found: error
          retention-days: 90
