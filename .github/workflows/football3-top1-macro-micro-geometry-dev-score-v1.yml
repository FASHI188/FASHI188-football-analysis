name: football3 Top1 macro-micro geometry dev score v1

on:
  push:
    branches:
      - football3/historical-top1-macro-micro-geometry-v1
    paths:
      - football-data/research/top1_macro_micro_geometry_v1/TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_CONTRACT_V1.json
      - football-data/research/top1_macro_micro_geometry_v1/score_top1_macro_micro_geometry_v1.py
      - football-data/research/top1_macro_micro_geometry_v1/test_score_top1_macro_micro_geometry_v1.py
      - .github/workflows/football3-top1-macro-micro-geometry-dev-score-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-top1-macro-micro-geometry-dev-score-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PARENT_HEAD: c542f24bd879619e2d897fdcc2e9c55cf401b87c
  CONTRACT_BLOB: c86e975efea73d1a36d3737fae2da259c8e2985f
  SCORER_BLOB: 31689caacc6946b2a36ec626478e0a1968d9f5d3
  TEST_BLOB: 69f32027efd954345c1ed4f839a22525ddf74d1c
  STRESS_ARTIFACT_ID: '9876751277'
  STRESS_ARTIFACT_SHA256: bc2fa9c21f55de74f180331d3d0cc5007c496ed426a38cd1613f29375188049a
  HISTORY_ARTIFACT_ID: '9876641831'
  HISTORY_ARTIFACT_SHA256: 2422a1e4746452614032e5af8c6afcc7172eb0b644d237791fc038c0a6d3547c

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Governance and frozen-code guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-top1-macro-micro-geometry-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$PARENT_HEAD" HEAD
          test "$(git hash-object football-data/research/top1_macro_micro_geometry_v1/TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_CONTRACT_V1.json)" = "$CONTRACT_BLOB"
          test "$(git hash-object football-data/research/top1_macro_micro_geometry_v1/score_top1_macro_micro_geometry_v1.py)" = "$SCORER_BLOB"
          test "$(git hash-object football-data/research/top1_macro_micro_geometry_v1/test_score_top1_macro_micro_geometry_v1.py)" = "$TEST_BLOB"
          python - <<'PY'
          import os, subprocess
          allowed = {
            '.github/workflows/football3-top1-macro-micro-geometry-dev-score-v1.yml',
            'football-data/research/top1_macro_micro_geometry_v1/TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_CONTRACT_V1.json',
            'football-data/research/top1_macro_micro_geometry_v1/score_top1_macro_micro_geometry_v1.py',
            'football-data/research/top1_macro_micro_geometry_v1/test_score_top1_macro_micro_geometry_v1.py',
          }
          got = set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['PARENT_HEAD']}..HEAD"], text=True).splitlines())
          assert got == allowed, (got, allowed)
          forbidden = ('CURRENT','production_pointer','formal_enablement')
          assert not any(any(x in p for x in forbidden) for p in got), got
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and unit-test frozen scorer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            football-data/research/top1_macro_micro_geometry_v1/score_top1_macro_micro_geometry_v1.py \
            football-data/research/top1_macro_micro_geometry_v1/test_score_top1_macro_micro_geometry_v1.py
          python football-data/research/top1_macro_micro_geometry_v1/test_score_top1_macro_micro_geometry_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 6 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{stress,history}
          fetch_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
            echo "${expected}  ${zip}" | sha256sum -c -
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          fetch_one "$STRESS_ARTIFACT_ID" "$STRESS_ARTIFACT_SHA256" /tmp/stress.zip _inputs/stress
          fetch_one "$HISTORY_ARTIFACT_ID" "$HISTORY_ARTIFACT_SHA256" /tmp/history.zip _inputs/history
          test -s _inputs/stress/evidence/predictions_label_free.jsonl
          test -s _inputs/history/data/fixtures.jsonl
          test -s _inputs/history/data/label_vault.jsonl

      - name: Run frozen decision-layer development score
        id: score
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python football-data/research/top1_macro_micro_geometry_v1/score_top1_macro_micro_geometry_v1.py \
            --contract football-data/research/top1_macro_micro_geometry_v1/TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_CONTRACT_V1.json \
            --stress-dir _inputs/stress \
            --history-dir _inputs/history \
            --out _run 2>&1 | tee /tmp/score_stdout.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/development_score_result.json'))
          assert r['status'] in {'TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_PASS','TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_FAIL'}
          assert r['classification']=='POST_VIEW_DEVELOPMENT_SINGLE_DECISION_MECHANISM_NO_TRAINING_NO_TUNING'
          assert r['pooled']['n']==3504
          assert r['pooled']['decision_change_count']==129
          assert r['pooled']['candidate_draw_top1_count']==127
          assert r['fresh_confirmation'] is False and r['promotion_allowed'] is False
          assert r['training_performed'] is False and r['tuning_performed'] is False
          assert r['parameter_search_performed'] is False and r['candidate_selection_performed'] is False and r['threshold_search_performed'] is False
          assert r['formal_weight_changed'] is False and r['CURRENT_changed'] is False and r['production_pointer_changed'] is False and r['formal_enablement_changed'] is False
          assert r['probability_vector_changed'] is False and r['joint_matrix_changed'] is False
          PY
          echo "status=$(python -c "import json;print(json.load(open('_run/development_score_result.json'))['status'])")" >> "$GITHUB_OUTPUT"

      - name: Seal score artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{contracts,code,evidence}
          cp football-data/research/top1_macro_micro_geometry_v1/TOP1_MACRO_MICRO_GEOMETRY_DEV_SCORE_CONTRACT_V1.json _seal/contracts/
          cp football-data/research/top1_macro_micro_geometry_v1/score_top1_macro_micro_geometry_v1.py _seal/code/
          cp football-data/research/top1_macro_micro_geometry_v1/test_score_top1_macro_micro_geometry_v1.py _seal/code/
          cp _run/* _seal/evidence/
          cp /tmp/tests.txt /tmp/score_stdout.txt _seal/evidence/
          (cd _seal && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload development score artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-macro-micro-geometry-dev-score-v1-${{ steps.score.outputs.status }}-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90
