name: Football V6.21.6 Team-Total Mode-Sum Evaluation
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_team_total_mode_sum_forward_eval_v6216.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6216-team-total-mode-sum
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen Team-Total mode-sum evaluation
        run: |
          python -m py_compile football-data/validation/v6_team_total_mode_sum_forward_eval_v6216.py
          PYTHONPATH=football-data/validation python football-data/validation/v6_team_total_mode_sum_forward_eval_v6216.py
      - name: Persist evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_team_total_mode_sum_forward_eval_v6216_status.json
          git add "$p"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.21.6 Team-Total mode-sum evaluation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
