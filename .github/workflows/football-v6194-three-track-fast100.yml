name: Football V6.21.0 Kambi Special-Market Inventory
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_kambi_special_market_inventory_v6210.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6210-special-market-inventory
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen raw-market inventory
        shell: bash
        run: |
          python -m py_compile football-data/validation/v6_kambi_special_market_inventory_v6210.py
          python football-data/validation/v6_kambi_special_market_inventory_v6210.py
      - name: Persist inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_kambi_special_market_inventory_v6210_status.json
          git add "$p"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.21.0 Kambi special-market inventory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
