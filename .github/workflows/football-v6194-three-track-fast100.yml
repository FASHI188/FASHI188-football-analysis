name: Football V6.20.5 Pure Independent Fast100
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_pure_independent_three_track_fast100_v6205.py"
      - "football-data/engine/three_track_conflict_gate_v6202.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6205-pure-independent-fast100
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run and always write diagnostic
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          : > /tmp/v6205.log
          python -m pip install --quiet scikit-learn >> /tmp/v6205.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then
            python -m py_compile football-data/engine/three_track_conflict_gate_v6202.py >> /tmp/v6205.log 2>&1
            code=$?
          fi
          if [ "$code" = "0" ]; then
            python -m py_compile football-data/validation/v6_pure_independent_three_track_fast100_v6205.py >> /tmp/v6205.log 2>&1
            code=$?
          fi
          if [ "$code" = "0" ]; then
            python football-data/validation/v6_pure_independent_three_track_fast100_v6205.py >> /tmp/v6205.log 2>&1
            code=$?
          fi
          cat /tmp/v6205.log
          echo "fast100_exit_code=$code" >> "$GITHUB_ENV"
          FAST100_EXIT_CODE="$code" python - <<'PY'
          import json, os
          from pathlib import Path
          log = Path('/tmp/v6205.log').read_text(encoding='utf-8', errors='replace')
          payload = {
              'schema_version': 'V6.20.5-execution-diagnostic-r2',
              'exit_code': int(os.environ.get('FAST100_EXIT_CODE','2')),
              'model_receipt_exists': Path('football-data/manifests/v6_pure_independent_three_track_fast100_v6205_status.json').exists(),
              'log_tail': log[-16000:],
          }
          out = Path('football-data/manifests/v6_pure_independent_three_track_fast100_v6205_execution_status.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          exit 0
      - name: Persist V6.20.5 receipts and diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in \
            football-data/manifests/v6_pure_independent_three_track_fast100_v6205_status.json \
            football-data/manifests/v6_pure_independent_three_track_fast100_v6205_execution_status.json; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.20.5 execution result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce pass
        run: test "${fast100_exit_code:-2}" = "0"
