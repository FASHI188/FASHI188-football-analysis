name: Football V6.20.5 Pure Independent Fast100
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_pure_independent_three_track_fast100_v6205.py"
      - "football-data/engine/three_track_conflict_gate_v6202.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6205-pure-independent-fast100
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sklearn
        run: python -m pip install --quiet scikit-learn
      - name: Compile Fast100
        run: |
          python -m py_compile football-data/engine/three_track_conflict_gate_v6202.py
          python -m py_compile football-data/validation/v6_pure_independent_three_track_fast100_v6205.py
      - name: Run pure-independent Fast100
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          python football-data/validation/v6_pure_independent_three_track_fast100_v6205.py
          code=$?
          echo "fast100_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Persist V6.20.5 receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_pure_independent_three_track_fast100_v6205_status.json
          if [ -f "$p" ]; then git add "$p"; fi
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.20.5 pure-independent Fast100"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce pass
        run: test "${fast100_exit_code:-2}" = "0"
