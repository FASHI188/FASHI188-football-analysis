name: Football V6.22.3 Coherent Special-Market Projection Selftest
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_coherent_special_market_projection_v6223.py"
      - "football-data/validation/v6_coherent_special_market_projection_selftest_v6223.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6223-coherent-special-market-selftest
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V6.22.3 on one real frozen Kambi snapshot
        env:
          PYTHONPATH: football-data/validation
        shell: bash
        run: |
          set +e
          python -m py_compile football-data/validation/v6_coherent_special_market_projection_v6223.py football-data/validation/v6_coherent_special_market_projection_selftest_v6223.py > /tmp/v6223.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then python football-data/validation/v6_coherent_special_market_projection_selftest_v6223.py >> /tmp/v6223.log 2>&1; code=$?; fi
          cat /tmp/v6223.log
          echo "exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Persist V6.22.3 receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_coherent_special_market_projection_v6223_status.json
          if [ -f "$p" ]; then git add "$p"; fi
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.22.3 coherent special-market selftest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce pass
        run: test "${exit_code:-2}" = "0"
