name: Football V6.22.5 OO-EPC De-Vig Screen
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_oo_epc_devig_screen_v6225.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6225-oo-epc-screen
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixed historical OO-EPC screen
        shell: bash
        run: |
          python -m py_compile football-data/validation/v6_oo_epc_devig_screen_v6225.py
          python football-data/validation/v6_oo_epc_devig_screen_v6225.py
      - name: Persist V6.22.5 receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_oo_epc_devig_screen_v6225_status.json
          git add "$p"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.22.5 OO-EPC de-vig screen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
