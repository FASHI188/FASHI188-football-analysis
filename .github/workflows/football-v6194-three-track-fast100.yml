name: Football V6.22.0 Correct-Score Surface Inventory
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_correct_score_surface_inventory_v6220.py"
      - ".github/workflows/football-v6194-three-track-fast100.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6220-correct-score-inventory
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory frozen Correct-Score surfaces
        run: |
          python -m py_compile football-data/validation/v6_correct_score_surface_inventory_v6220.py
          python football-data/validation/v6_correct_score_surface_inventory_v6220.py
      - name: Persist V6.22.0 inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_correct_score_surface_inventory_v6220_status.json
          git add "$p"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.22.0 Correct-Score surface inventory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
