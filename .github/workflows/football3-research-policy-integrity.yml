name: Football3 Research Policy Integrity

on:
  pull_request:
    branches:
      - 'football3/**'
    paths:
      - 'football-data/research/FOOTBALL3_INDEPENDENT_CURRENT.md'
      - 'football-data/research/FOOTBALL3_RESEARCH_POLICY_V3.json'
      - 'football-data/research/FOOTBALL_GLOBAL_CONSUMPTION_REGISTRY_V1.json'
      - 'football-data/research/validate_football3_research_policy_v3.py'
      - '.github/workflows/football3-research-policy-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate football3 V3 lineage, current state, consumption and seals
        run: python football-data/research/validate_football3_research_policy_v3.py
