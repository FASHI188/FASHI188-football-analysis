name: football3 Batch-001 stage3b lineup history

on:
  push:
    branches:
      - football3/batch001-stage3b-lineup-history
    paths:
      - football-data/experiments/batch001_stage3b_lineup_history/build_stage3b.py
      - .github/workflows/football3-batch001-stage3b-lineup-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage3b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch001-stage3b-lineup-history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Build historical lineup/player features
        run: python football-data/experiments/batch001_stage3b_lineup_history/build_stage3b.py run
      - name: Verify Stage3B contract
        run: python football-data/experiments/batch001_stage3b_lineup_history/build_stage3b.py verify
      - name: Persist locked Stage3B pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch001_stage3b_lineup_history/results/batch001_stage3b_lineup_history_locked.json
          git commit -m '[locked] football3 Batch-001 Stage3B lineup history' || true
          git push origin HEAD:football3/batch001-stage3b-lineup-history
      - name: Upload Stage3B artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch001-stage3b-lineup-history
          path: football-data/experiments/batch001_stage3b_lineup_history/results/batch001_stage3b_lineup_history_locked.json
          if-no-files-found: error
          retention-days: 90
