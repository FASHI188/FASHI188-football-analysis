name: football3 Historical Fusion V3.2.4 Minimal Boundary Projection

on:
  push:
    branches: ['football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-2-4-minimal-boundary-projection-v1.yml'
      - 'football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v324-${{ github.sha }}
  cancel-in-progress: false

env:
  SEG3_HEAD: da08db7b0c2afd0c3b70c0fd73a4e2f4a28f3b48
  SEG3_SCIENCE_HEAD: 755610432bc50c01146d61297c41060c080b10c9
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  CONTRACT_BLOB: e4e2670b44168078bc869e7b0889b99bbb2a79f1
  RUNNER_BLOB: 2f1945bd680ec1eb229ca7f52fe94edbff846b33
  TEST_BLOB: 3eae564519691aa41acf00b3cdd17cec0396be41
  V323_CONTRACT_BLOB: ea5a91c6c68254a931b7ff13fa837fed02d95032
  V323_RUNNER_BLOB: 653e012ef179554ceeef19f5952c6fa9454e534a
  V323_ARTIFACT_ID: '9887477239'
  V323_ARTIFACT_DIGEST: sha256:85b48353d0e0206160f83ff080dc046115d82427810fa52f2a5e5ce72c3e47a7
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact lineage whitelist and frozen scientific bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$SEG3_HEAD" HEAD)" = "$SEG3_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-3-temporal-transport-v1 | cut -f1)" = "$SEG3_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          D3=football-data/research/historical_fusion_v3_2_3_temporal_transport
          test "$(git hash-object "$D/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/v3_2_4_segment4.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_v3_2_4_segment4.py")" = "$TEST_BLOB"
          test "$(git hash-object "$D3/V3_2_3_TEMPORAL_TRANSPORT_CONTRACT.json")" = "$V323_CONTRACT_BLOB"
          test "$(git hash-object "$D3/v3_2_3_segment3.py")" = "$V323_RUNNER_BLOB"
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection')
          allowed={'.github/workflows/football3-historical-fusion-v3-2-4-minimal-boundary-projection-v1.yml',str(d/'V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json'),str(d/'v3_2_4_segment4.py'),str(d/'test_v3_2_4_segment4.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['SEG3_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          assert not any(any(x in p for x in ('CURRENT','production_pointer','formal_enablement')) for p in got)
          c=json.loads((d/'V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json').read_text())
          assert c['status']=='FROZEN_BEFORE_V3_2_4_TARGET_SCORING'
          assert c['direction_generator']['no_parameter_selection_in_v3_2_4'] is True
          assert c['projection']['new_learned_gate']=='NONE' and c['projection']['new_threshold_grid']=='NONE'
          assert c['data_roles']['2024_25_and_2025_26_3504'].startswith('FORBIDDEN')
          assert c['lineage']['segment3_branch_head']==os.environ['SEG3_HEAD']
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run structural invariants
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          python -m py_compile "$D/v3_2_4_segment4.py" "$D/test_v3_2_4_segment4.py"
          (cd "$D" && python test_v3_2_4_segment4.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify frozen scientific inputs and V3.2.3 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v323art,v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower()
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python - "$zip" "$expected" <<'PY'
          import hashlib,sys
          got=hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(); exp=sys.argv[2].split(':',1)[-1].lower(); assert got==exp,(got,exp)
          PY
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$V323_ARTIFACT_ID" "$V323_ARTIFACT_DIGEST" /tmp/v323.zip _inputs/v323art
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          python - <<'PY'
          import hashlib,json,pathlib,os
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert h('_inputs/v2/code/historical_xg_fusion_v2.py')=='1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          assert h('_inputs/xg/code/historical_xg_challenger.py')=='588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          assert h('_inputs/v1/pure_engine.py')=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_inputs/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          assert h('_inputs/v31/code/historical_fusion_v3_1.py')=='59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'
          m=json.load(open('_inputs/v323art/artifact_manifest.json')); assert m['head']==os.environ['SEG3_SCIENCE_HEAD'] and m['status']=='V3_2_3_TEMPORAL_TRANSPORT_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT'
          r=json.load(open('_inputs/v323art/evidence/rolling_2021_2022.json')); z=[x for x in r['families'] if x['family']=='T2']; assert len(z)==1
          assert z[0]['params']=={'cap':0.02,'draw_lambda':16.0,'draw_scale':0.25,'half_life':1.0,'side_lambda':4.0,'side_scale':0.25,'support_tau':1.5}
          d=z[0]['pooled']['deltas']; assert d['wrong_to_correct']==10 and d['correct_to_wrong']==6
          assert abs(d['global_top1_delta']-0.0010952902519166807)<1e-15 and abs(d['parity_top1_delta']-0.00646203554119551)<1e-15
          f=json.load(open('_inputs/v323art/evidence/final_status.json')); assert f['2023_opened'] is False and f['3504_opened'] is False
          PY

      - name: Frozen V3.2.4 minimum-boundary research
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          D3=football-data/research/historical_fusion_v3_2_3_temporal_transport
          rm -rf _run && mkdir _run
          python "$D/v3_2_4_segment4.py" \
            --contract "$D/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json" \
            --v323-contract "$D3/V3_2_3_TEMPORAL_TRANSPORT_CONTRACT.json" \
            --v323 "$D3/v3_2_3_segment3.py" \
            --v322 football-data/research/historical_fusion_v3_2_2_parity_boundary/v3_2_2_segment2.py \
            --v32dev football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair_execution/v3_2_development.py \
            --core football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair/v3_2_core.py \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py \
            --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py \
            --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --out _run 2>&1 | tee /tmp/research_stdout.txt
          python - <<'PY'
          import json
          f=json.load(open('_run/final_status.json'))
          allowed={'V3_2_4_MINIMAL_BOUNDARY_PROJECTION_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT','V3_2_4_MINIMAL_BOUNDARY_PROJECTION_2023_DIAGNOSTIC_FAILED_NO_RESCUE','V3_2_4_MINIMAL_BOUNDARY_PROJECTION_RESEARCH_CANDIDATE_READY_PROSPECTIVE_CONFIRMATION_REQUIRED'}
          assert f['status'] in allowed and f['research_only'] and f['post_view'] and not f['fresh_confirmation'] and not f['promotion_allowed']
          assert f['3504_opened'] is False and f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed'] and not f['production_pointer_changed'] and not f['formal_enablement_changed'] and not f['formal_weights_changed']
          pre=json.load(open('_run/pre2023_row_receipt.json')); assert pre['max_source_season_loaded']==2022
          if f['status']=='V3_2_4_MINIMAL_BOUNDARY_PROJECTION_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT': assert f['2023_opened'] is False
          else: assert f['2023_opened'] is True
          PY

      - name: Seal research artifact
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          rm -rf _seal && mkdir -p _seal/contracts _seal/code _seal/evidence
          cp "$D/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json" _seal/contracts/
          cp "$D/v3_2_4_segment4.py" "$D/test_v3_2_4_segment4.py" _seal/code/
          cp _run/*.json _seal/evidence/
          cp /tmp/tests.txt /tmp/research_stdout.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('_seal'); files={}
          for p in sorted(r.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          f=json.load(open('_run/final_status.json'))
          m={'schema_version':'football3-v3-2-4-artifact-v1','status':f['status'],'head':os.environ['GITHUB_SHA'],'segment3_head':os.environ['SEG3_HEAD'],'segment3_science_head':os.environ['SEG3_SCIENCE_HEAD'],'v311_head':os.environ['V311_HEAD'],'formal_v2_head':os.environ['FORMAL_HEAD'],'contract_blob':os.environ['CONTRACT_BLOB'],'runner_blob':os.environ['RUNNER_BLOB'],'research_only':True,'post_view':True,'fresh_confirmation':False,'promotion_allowed':False,'2023_opened':f['2023_opened'],'3504_opened':False,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (r/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload V3.2.4 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-2-4-minimal-boundary-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: research-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download remote artifact and verify digest manifest payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.research-and-seal.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.research-and-seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$got" "$ARTIFACT_DIGEST" <<'PY'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower(); assert norm(sys.argv[1])==norm(sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/a.zip
          python - /tmp/a.zip "$ARTIFACT_DIGEST" <<'PY'
          import hashlib,sys
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==sys.argv[2].split(':',1)[-1].lower()
          PY
          rm -rf /tmp/a && mkdir /tmp/a && unzip -q /tmp/a.zip -d /tmp/a
          python - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('/tmp/a'); m=json.loads((r/'artifact_manifest.json').read_text())
          for rel,rec in m['files'].items():
              p=r/rel; assert p.exists(),rel; assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256']; assert p.stat().st_size==rec['bytes']
          f=json.loads((r/'evidence/final_status.json').read_text()); assert f['status']==m['status']; assert f['3504_opened'] is False
          print(json.dumps({'status':f['status'],'artifact_manifest_verified':True,'2023_opened':f['2023_opened']},sort_keys=True))
          PY
