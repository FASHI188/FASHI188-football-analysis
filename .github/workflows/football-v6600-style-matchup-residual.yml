name: football-v6600-style-matchup-residual

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_style_matchup_residual_full500_v6600.py'
      - '.github/workflows/football-v6600-style-matchup-residual.yml'

permissions:
  contents: write

jobs:
  validate-style-matchup-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 catboost==1.2.10 scipy==1.14.1
      - name: Compile
        run: python -m py_compile football-data/validation/validate_style_matchup_residual_full500_v6600.py
      - name: Run strict historical style-matchup gate
        shell: bash
        run: |
          set +e
          python football-data/validation/validate_style_matchup_residual_full500_v6600.py 2>&1 | tee football-data/manifests/v6600_style_matchup_residual.log
          status=${PIPESTATUS[0]}
          echo "validator_exit_status=${status}" | tee -a football-data/manifests/v6600_style_matchup_residual.log
          exit ${status}
      - name: Persist V6.60 receipt
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
          git add football-data/manifests/v6_style_matchup_residual_full500_v6600_status.json
          if git diff --cached --quiet; then
            echo "V6.60 receipt already persisted"
          else
            git commit -m "research(football): persist V6.60 style matchup receipt"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Upload V6.60 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6600-style-matchup-residual
          path: |
            football-data/manifests/v6600_style_matchup_residual.log
            football-data/manifests/v6_style_matchup_residual_full500_v6600_status.json
          if-no-files-found: warn
