name: football3-c072n18a-sofascore-shotxg-history5000

on:
  pull_request:
    paths:
      - 'football-data/research/C072N18A_SOFASCORE_SHOTXG_HISTORY5000_SOURCE_CONTRACT.md'
      - 'football-data/research/download_c072n18a_sofascore_shotxg_history5000.py'
      - '.github/workflows/football3-c072n18a-sofascore-shotxg-history5000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-history5000:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install frozen HTTP transport
        run: python -m pip install --disable-pip-version-check 'curl_cffi==0.15.0'

      - name: Execute frozen zero-target acquisition
        run: python football-data/research/download_c072n18a_sofascore_shotxg_history5000.py

      - name: Assert exact 5000 and no target scoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('football-data/research/_n18a_sofascore_history5000/sofascore_n18a_history5000_summary.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          assert x['status'] == 'PASS_HISTORY5000', x
          assert x['selected_matches'] == 5000, x
          assert x['persisted_outcome_fields'] == 0, x
          assert x['model_fits'] == 0, x
          assert x['target_scores'] == 0, x
          print('N18A_HISTORY5000_CONTRACT_PASS')
          PY

      - name: Upload frozen source or technical receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-c072n18a-sofascore-history5000-${{ github.sha }}-${{ github.run_id }}
          path: football-data/research/_n18a_sofascore_history5000/
          if-no-files-found: warn
          retention-days: 30
