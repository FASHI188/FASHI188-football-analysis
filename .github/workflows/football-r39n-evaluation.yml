name: Football R39N Evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39n-evaluation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39n-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  snapshot-bound-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Enforce unique first-attempt R39N evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/football-r39n-evaluation.yml/runs?branch=research%2Flineup-market-value-r39n&per_page=20" -o /tmp/r39n-runs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          cur=int(os.environ['GITHUB_RUN_ID'])
          runs=json.loads(Path('/tmp/r39n-runs.json').read_text()).get('workflow_runs',[])
          prior=[int(r['id']) for r in runs if int(r['id'])!=cur and r.get('head_branch')=='research/lineup-market-value-r39n']
          assert not prior,f'prior R39N evaluation run(s) exist: {prior}'
          print('PASS_R39N_UNIQUE_FIRST_EVALUATION')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'

      - name: Verify frozen science and zero-label Preflight authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:football-data/research/lineup_market_value_r39n/preregistration_r39n.json)" = "96236a99c5bc849e866ae44c2a0e0eb7e6264eed"
          test "$(git rev-parse HEAD:football-data/research/lineup_market_value_r39n/source_registration_r39n.json)" = "a396716d75c289d0ac3474f502d36a55a2ad9a10"
          test "$(git rev-parse HEAD:football-data/research/lineup_market_value_r39n/feature_snapshot_binding_r39n.json)" = "1e7416ff8b782b8fd6372bc2fed31d2bceec5dde"
          test "$(git rev-parse HEAD:football-data/research/lineup_market_value_r39n/evaluator_contract_r39n.json)" = "f6141ab5fa4581d71b02abe19c1a7a8c5fa318a7"
          test "$(git rev-parse HEAD:football-data/research/lineup_market_value_r39n/evaluate_snapshot_r39n.py)" = "2a7073e047bbd8e49eb6057c170e96d9f04b35cc"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31355722528" -o /tmp/preflight-run.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31355722528/artifacts" -o /tmp/preflight-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/preflight-run.json').read_text())
          a=json.loads(Path('/tmp/preflight-artifacts.json').read_text()).get('artifacts',[])
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='ee4d38cd4785ca776bed9ca7c6426985a5cc70d5'
          assert len(a)==1
          x=a[0]
          assert x['id']==9050541740
          assert x.get('digest')=='sha256:fbb18c7b5ec96800bfee694d5c698821b541cd701d08212c9cccb73327107f3e'
          print('PASS_R39N_PREFLIGHT_AUTHORIZATION_METADATA')
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9050541740/zip" -o /tmp/r39n-preflight.zip
          echo "fbb18c7b5ec96800bfee694d5c698821b541cd701d08212c9cccb73327107f3e  /tmp/r39n-preflight.zip" | sha256sum -c -
          rm -rf /tmp/r39n-preflight && mkdir -p /tmp/r39n-preflight
          unzip -q /tmp/r39n-preflight.zip -d /tmp/r39n-preflight
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/r39n-preflight/preflight_receipt_r39n.json').read_text())
          expected={
            'football-data/research/lineup_market_value_r39n/preregistration_r39n.json':'96236a99c5bc849e866ae44c2a0e0eb7e6264eed',
            'football-data/research/lineup_market_value_r39n/source_registration_r39n.json':'a396716d75c289d0ac3474f502d36a55a2ad9a10',
            'football-data/research/lineup_market_value_r39n/feature_snapshot_binding_r39n.json':'1e7416ff8b782b8fd6372bc2fed31d2bceec5dde',
            'football-data/research/lineup_market_value_r39n/evaluator_contract_r39n.json':'f6141ab5fa4581d71b02abe19c1a7a8c5fa318a7',
            'football-data/research/lineup_market_value_r39n/evaluate_snapshot_r39n.py':'2a7073e047bbd8e49eb6057c170e96d9f04b35cc'}
          assert r['status']=='PASS_R39N_ZERO_LABEL_EVALUATOR_PREFLIGHT'
          assert r['scientific_blobs']==expected
          assert r['r39n_snapshot_artifact_id']==9050468369
          assert r['r39n_snapshot_artifact_sha256']=='02b018ac4587ce7237607a1ebe81558f059e4db298223a7e5f4e5088d7611d99'
          assert r['r39l_benchmark_snapshot_artifact_id']==9050139416
          assert r['r39l_benchmark_snapshot_artifact_sha256']=='d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575'
          assert r['real_target_labels_accessed']==0 and r['model_fit_on_real_labels']==0 and r['fixed100_labels_accessed']==0
          print('PASS_R39N_EXACT_ZERO_LABEL_PREFLIGHT_RECEIPT')
          PY
          python football-data/research/lineup_market_value_r39n/evaluate_snapshot_r39n.py --self-test

      - name: Download and verify exact frozen R39N and R39L feature snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf r39n-input r39l-input r39n-raw r39n-output
          mkdir -p r39n-input r39l-input r39n-raw r39n-output
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9050468369/zip" -o /tmp/r39n-snapshot.zip
          echo "02b018ac4587ce7237607a1ebe81558f059e4db298223a7e5f4e5088d7611d99  /tmp/r39n-snapshot.zip" | sha256sum -c -
          unzip -q /tmp/r39n-snapshot.zip -d r39n-input
          echo "fb304ad55d21ffcb53f7623c82ecfb3f13d4db838aa8788446c6eafc8abd5a18  r39n-input/feature_snapshot_r39n.csv" | sha256sum -c -
          echo "444d6c55abe86fbdef28c1871c76173bcb65f70157055bcc9ca809b33e8cbc56  r39n-input/snapshot_receipt_r39n.json" | sha256sum -c -
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9050139416/zip" -o /tmp/r39l-snapshot.zip
          echo "d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575  /tmp/r39l-snapshot.zip" | sha256sum -c -
          unzip -q /tmp/r39l-snapshot.zip -d r39l-input
          echo "da7f3c94292207342e4ae170492458af320eae0b685124123d186faf911ec6b4  r39l-input/feature_snapshot_r39m.csv" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          n=json.loads(Path('r39n-input/snapshot_receipt_r39n.json').read_text())
          assert n['status']=='PASS_R39N_ZERO_LABEL_VALUATION_SNAPSHOT'
          assert n['feature_eligible']=={'all':9434,'preholdout':8161,'holdout_2526':1273,'fixed100':100}
          assert n['strict_valuation_lag_violations']==0 and all(v==0 for v in n['zero_label_contract'].values())
          m=json.loads(Path('r39l-input/snapshot_receipt_r39m.json').read_text())
          assert m['status']=='PASS_R39M_ZERO_LABEL_FROZEN_FEATURE_SNAPSHOT'
          assert m['rows']=={'all':9434,'preholdout':8161,'holdout_2526':1273,'fixed100':100}
          assert all(v==0 for v in m['zero_label_contract'].values())
          print('PASS_R39N_EXACT_HASH_LOCKED_FEATURE_INPUTS')
          PY

      - name: Download Football-Data result-label files only
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "r39n-raw/${season}_${div}.csv"
            done
          done

      - name: Execute frozen snapshot-bound R39N sequence
        run: |
          set -euo pipefail
          python football-data/research/lineup_market_value_r39n/evaluate_snapshot_r39n.py \
            --prereg football-data/research/lineup_market_value_r39n/preregistration_r39n.json \
            --contract football-data/research/lineup_market_value_r39n/evaluator_contract_r39n.json \
            --snapshot-binding football-data/research/lineup_market_value_r39n/feature_snapshot_binding_r39n.json \
            --r39n-snapshot r39n-input/feature_snapshot_r39n.csv \
            --r39l-snapshot r39l-input/feature_snapshot_r39m.csv \
            --raw-dir r39n-raw --out-dir r39n-output

      - name: Verify terminal scientific and label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39n-output/r39n_result.json').read_text())
          ff=json.loads(Path('r39n-output/feature_freeze_receipt_r39n.json').read_text())
          assert ff['feature_freeze_completed'] is True
          assert ff['input_mode']=='hash_locked_R39N_plus_R39L_benchmark_snapshots'
          assert ff['R39N_snapshot_artifact_id']==9050468369
          assert ff['R39N_snapshot_csv_sha256']=='fb304ad55d21ffcb53f7623c82ecfb3f13d4db838aa8788446c6eafc8abd5a18'
          assert ff['R39L_snapshot_artifact_id']==9050139416
          assert ff['R39L_snapshot_csv_sha256']=='da7f3c94292207342e4ae170492458af320eae0b685124123d186faf911ec6b4'
          assert ff['target_labels_accessed_before_feature_freeze']==0
          assert ff['preholdout_rows']==8161 and ff['holdout_pool_rows']==1273 and ff['fixed100_rows']==100
          assert ff['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          allowed={
            'STOP_R39N_BEFORE_POLICY_AND_HOLDOUT_XI_VALUE_NO_ROLLING_INCREMENT',
            'STOP_R39N_BEFORE_HOLDOUT_XI_VALUE_NO_POLICY_INCREMENT',
            'PASS_R39N_ACTUAL_XI_VALUE_FIXED100_EXPLORATORY_ONLY',
            'NO_R39N_ACTUAL_XI_VALUE_INCREMENT_FIXED100'}
          assert r['status'] in allowed
          fr=json.loads(Path('r39n-output/final_freeze_receipt_r39n.json').read_text())
          if r['status'].startswith('STOP_R39N_BEFORE_'):
              assert r['holdout_labels_accessed']==0
              assert fr['final_freeze_completed'] is False
              assert fr['holdout_labels_accessed_before_freeze']==0
          else:
              assert r['holdout_labels_accessed']==100
              assert fr['final_freeze_completed'] is True
              assert fr['holdout_labels_accessed_before_freeze']==0
          print(json.dumps({'status':r['status'],'selected_L2':r.get('selected_L2'),'rolling_gate_pass':r.get('rolling_gate_pass'),'rolling_development':r.get('rolling_development'),'policy':r.get('policy'),'holdout':r.get('holdout'),'holdout_labels_accessed':r['holdout_labels_accessed']},indent=2))
          PY

      - name: Delete all downloaded source and snapshot inputs before artifact
        run: rm -rf r39n-raw r39n-input r39l-input /tmp/r39n-snapshot.zip /tmp/r39l-snapshot.zip /tmp/r39n-preflight.zip /tmp/r39n-preflight

      - uses: actions/upload-artifact@v4
        with:
          name: football-r39n-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39n-output/
          if-no-files-found: error
          retention-days: 30
