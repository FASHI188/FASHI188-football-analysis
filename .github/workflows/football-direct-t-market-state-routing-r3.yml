name: Football Direct-T Market-State Routing R3

on:
  pull_request:
    paths:
      - "football-data/config/direct_t_market_state_routing_r3.json"
      - "football-data/validation/evaluate_direct_t_market_state_routing_r3.py"
      - "football-data/validation/run_direct_t_market_state_routing_r3.py"
      - "football-data/research/direct_t_market_state_routing_r3/**"
      - ".github/workflows/football-direct-t-market-state-routing-r3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-direct-t-market-state-routing-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/engine:football-data/validation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile frozen R3 path
        run: |
          python -m py_compile \
            football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py \
            football-data/validation/evaluate_viewed_common_cohort_oracle_r1.py \
            football-data/validation/evaluate_direct_t_oracle_learnability_r1.py \
            football-data/validation/evaluate_direct_t_expected_loss_routing_r2.py \
            football-data/validation/evaluate_direct_t_market_state_routing_r3.py \
            football-data/validation/run_direct_t_market_state_routing_r3.py
      - name: Rebuild exact audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Reproduce frozen parent diagnostic identities
        run: python football-data/validation/evaluate_viewed_common_cohort_oracle_r1.py
      - name: Run frozen market coverage gate and R3 if eligible
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/direct-t-market-state-routing-r3
          python football-data/validation/run_direct_t_market_state_routing_r3.py \
            2>&1 | tee /tmp/direct-t-market-state-routing-r3/traceback.log
      - name: Upload R3 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: direct-t-market-state-routing-r3-failure-log
          path: /tmp/direct-t-market-state-routing-r3/traceback.log
          if-no-files-found: error
          retention-days: 30
      - name: Verify frozen boundaries and coverage-gated status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/direct_t_market_state_routing_r3/summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['source_contract']['parent_rows']==1584
          assert x['source_contract']['parent_identity_sha256']=='0e7c57c5168280cd8b3264fe3c04d46d5caa51b6b6f4218aee84826bf7d7908c'
          assert x['source_contract']['new_target_label_access']==0
          assert x['source_contract']['b05_b07_labels_opened'] is False
          b=x['boundary']
          assert b['market_evidence_not_strict_pit'] is True
          assert b['scientific_pass_claim_allowed'] is False
          assert b['confirmation_pass_claim_allowed'] is False
          assert b['future_oos_label_open_authorized'] is False
          assert b['formal_weight']==0 and b['main_mutation'] is False
          if x['routing_metrics_computed']:
              assert x['status']=='POSTVIEW_DIRECT_T_MARKET_STATE_ROUTING_R3_COMPLETE_NO_PROMOTION'
              assert x['market_coverage']['passed'] is True
              assert x['primary_mechanism_family']=='relative_geometry_market49'
              assert x['router_families']['relative_geometry_market49']['feature_count']==49
              assert x['router_families']['relative_geometry_core_market96']['feature_count']==96
              assert x['router_families']['relative_all_market132']['feature_count']==132
              assert abs(x['parent_reproduction']['full_1584_common_baseline_logloss']-1.852486746078988)<1e-12
              assert abs(x['parent_reproduction']['full_1584_row_oracle_logloss']-1.817277840385054)<1e-12
          else:
              assert x['status']=='STOP_MARKET10_COVERAGE_GATE_BEFORE_ROUTING_METRICS'
              assert x['market_coverage']['passed'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
      - name: Upload R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: direct-t-market-state-routing-r3
          path: football-data/manifests/direct_t_market_state_routing_r3/
          if-no-files-found: error
          retention-days: 30
      - name: Confirm runtime-only manifests
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
