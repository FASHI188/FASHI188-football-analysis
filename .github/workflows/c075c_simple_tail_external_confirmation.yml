name: Football C075-C Simple Tail External Confirmation

on:
  push:
    branches:
      - research/c075c-simple-tail-external-confirmation-20260819
    paths:
      - research/c075c_simple_tail_external_confirmation_contract.json
      - research/evaluate_c075c_simple_tail_external_confirmation.py
      - .github/workflows/c075c_simple_tail_external_confirmation.yml
  pull_request:
    paths:
      - research/c075c_simple_tail_external_confirmation_contract.json
      - research/evaluate_c075c_simple_tail_external_confirmation.py
      - .github/workflows/c075c_simple_tail_external_confirmation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c075c-simple-tail-confirmation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  external-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install frozen scientific runtime
        run: python -m pip install numpy==2.2.6 pandas==2.3.2

      - name: Clone and pin independent external source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/openfootball/football.json.git external-openfootball
          git -C external-openfootball checkout ea767ac28cf9a2d737bb3e4ce65aa4b1f4ac9361
          test "$(git -C external-openfootball rev-parse HEAD)" = "ea767ac28cf9a2d737bb3e4ce65aa4b1f4ac9361"

      - name: Run one-shot frozen external exact-tail confirmation
        run: |
          mkdir -p artifacts/c075c_external_confirmation
          python research/evaluate_c075c_simple_tail_external_confirmation.py \
            --source-root external-openfootball \
            --out-dir artifacts/c075c_external_confirmation

      - name: Enforce score-selection and governance boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/c075c_external_confirmation/summary.json').read_text())
          assert s['schema_version']=='C075C_SIMPLE_TAIL_EXTERNAL_CONFIRMATION_V1R1'
          assert s['external_identity']['count']==3407
          assert s['external_identity']['sha256']=='6667088228846b992b1ec51d84347c31081a0e4eb86721a4a76b36ff421283d8'
          q=s['score_projection_boundary']
          assert q['decoded_frozen_match_objects']==3407
          assert q['decoded_nonfrozen_match_objects']==0
          assert q['post_cutoff_2025_score_objects_decoded']==0
          assert q['missing_replacement_count']==0
          assert q['external_parameter_refit'] is False
          assert q['external_recalibration'] is False
          b=s['protected_boundaries']
          assert b['C071_reserve_52180_opened'] is False
          assert b['C070F_confirmation1597_opened'] is False
          assert b['A05_opened'] is False
          assert b['protected_opened'] is False
          assert b['T_ge_7_D_given_T_tested'] is False
          assert b['unified_matrix_generated'] is False
          if s['status']!='STOP_COVERAGE_EXTERNAL_LABELS_CONSUMED':
              assert s['pooled_external']['exact_tail_scores']['unenumerated_tail_residual'] <= 1e-8
              assert s['pooled_external']['exact_tail_scores']['probability_sum_abs_residual'] <= 1e-10
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Upload C075-C external evidence
        uses: actions/upload-artifact@v4
        with:
          name: c075c-simple-tail-external-confirmation
          retention-days: 30
          path: |
            artifacts/c075c_external_confirmation/summary.json
            artifacts/c075c_external_confirmation/tail_confirmation_rows.csv
            artifacts/c075c_external_confirmation/score_projection_accounting.csv
            research/c075c_simple_tail_external_confirmation_contract.json
