name: Football Draw R41 Third-Period Zero-Label Coverage

on:
  push:
    branches: [research/draw-pit-availability-zero-label-20260814]
    paths:
      - 'football-data/research/draw_pit_availability_r41_2025_26_zero_label_audit_20260814.py'
      - '.github/workflows/football-draw-r41-third-period-zero-label.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draw-r41-third-period-zero-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Clone public FPL history
        run: git clone --quiet https://github.com/vaastav/Fantasy-Premier-League.git external-fpl
      - name: Run R41 2025/26 zero-label coverage audit
        run: >-
          python football-data/research/draw_pit_availability_r41_2025_26_zero_label_audit_20260814.py
          --source-dir external-fpl
          --out r41-third-period-audit
      - uses: actions/upload-artifact@v4
        with:
          name: draw-r41-2025-26-zero-label-coverage
          path: r41-third-period-audit/
