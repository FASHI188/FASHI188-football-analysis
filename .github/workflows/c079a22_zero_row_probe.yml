name: C079-A2.2 Zero-Row wpDataTables Probe

on:
  push:
    branches: [research/c079a2-footiqo-endpoint-audit-20260820]
    paths:
      - research/probe_c079a22_wpdatatable_zero_row.py
      - .github/workflows/c079a22_zero_row_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: python -m pip install requests==2.32.5
      - name: Probe public Odds endpoints with length zero
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python research/probe_c079a22_wpdatatable_zero_row.py --out-dir "$RUNNER_TEMP/out"
      - name: Enforce zero-row boundary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'out'/'summary.json').read_text())
          assert s['schema_version']=='C079A22_ZERO_ROW_PROBE_V1'
          b=s['hard_boundary']; assert b['requested_length']==0
          for k in ['odds_rows_requested','odds_row_values_persisted','score_rows_requested','score_values_parsed','result_targets_computed','authentication_attempted','premium_bypass_attempted','model_fit']:
              assert b[k] is False,(k,b[k])
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c079a22-zero-row-probe
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/out/summary.json
            research/probe_c079a22_wpdatatable_zero_row.py
