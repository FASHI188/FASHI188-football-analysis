name: Football C072-C xG Total Scalar

on:
  push:
    branches:
      - research/c072c-xg-total-scalar-20260818
    paths:
      - football-data/research/c072c_xg_total_scalar_contract.json
      - football-data/research/evaluate_c072c_xg_total_scalar.py
      - .github/workflows/football-c072c-xg-total-scalar.yml
  pull_request:
    paths:
      - football-data/research/c072c_xg_total_scalar_contract.json
      - football-data/research/evaluate_c072c_xg_total_scalar.py
      - .github/workflows/football-c072c-xg-total-scalar.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c072c-xg-total-scalar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  postview-refinement-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install frozen scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 scikit-learn==1.7.1
      - name: Run C072-C frozen one-scalar refinement
        run: |
          mkdir -p "$RUNNER_TEMP/c072c_out"
          PYTHONPATH=football-data/research python football-data/research/evaluate_c072c_xg_total_scalar.py --out-dir "$RUNNER_TEMP/c072c_out"
      - name: Enforce post-view and sealed-confirmation boundary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c072c_out'/'summary.json').read_text())
          assert s['status']=='C072C_POSTVIEW_REFINEMENT_COMPLETE'
          assert s['scalar']['search_performed'] is False
          assert s['boundary']['postview_only'] is True
          assert s['boundary']['fresh_confirmation_claim_allowed'] is False
          assert s['boundary']['C071_confirmation72180_opened'] is False
          assert s['boundary']['C070F_confirmation1597_opened'] is False
          assert s['boundary']['A05_opened'] is False
          assert s['boundary']['protected_opened'] is False
          assert s['boundary']['formal_weight']==0
          print(json.dumps(s,indent=2))
          PY
      - name: Upload C072-C evidence
        uses: actions/upload-artifact@v4
        with:
          name: c072c-xg-total-scalar
          retention-days: 30
          path: |
            ${{ runner.temp }}/c072c_out/summary.json
            football-data/research/c072c_xg_total_scalar_contract.json
