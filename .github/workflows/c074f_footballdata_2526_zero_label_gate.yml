name: C074-F Football-Data 2025-26 zero-label source gate

on:
  pull_request:
    paths:
      - 'research/C074F_CONTRACT.md'
      - 'research/c074f_footballdata_2526_zero_label_gate.py'
      - '.github/workflows/c074f_footballdata_2526_zero_label_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-label-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3

      - name: Run C074-F zero-label source and coverage gate
        run: |
          python research/c074f_footballdata_2526_zero_label_gate.py \
            --out artifacts/c074f_source_gate
          cp research/C074F_CONTRACT.md artifacts/c074f_source_gate/C074F_CONTRACT.md

      - name: Upload C074-F artifact
        uses: actions/upload-artifact@v4
        with:
          name: c074f-footballdata-2526-zero-label-source-gate
          path: artifacts/c074f_source_gate/
          if-no-files-found: error
          retention-days: 30
