name: football3 Celje vs Slovan pure-model frozen inference r1

on:
  push:
    branches:
      - football3/once-celje-slovan-20260826-r1
    paths:
      - .github/workflows/football3-once-celje-slovan-20260826-r1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: football-data/engine
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze 90m-safe 2026/27 UCL qualifying history
        run: |
          python - <<'PY'
          import ast, csv, json, re, subprocess
          from pathlib import Path

          source_commit = 'c0205f580e803a89dbca7198b7189afce5fc2ce8'
          source_path = '.github/workflows/football3-once-celje-slovan-20260826.yml'
          text = subprocess.check_output(['git','show',f'{source_commit}:{source_path}'], text=True)
          found = re.search(r"matches = (\[.*?\n\s*\])\n\s*assert len\(matches\) == 79", text, re.S)
          if not found:
              raise SystemExit('frozen 79-match source block not found')
          matches = ast.literal_eval(found.group(1))
          assert len(matches) == 79, len(matches)

          path = Path('football-data/processed/UEFA_ChampionsLeague/main_tournament_90min_safe.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig', newline='')))
          fieldnames = list(rows[0].keys())
          assert not any(r['season'] == '2026/27' for r in rows)
          for date, home, away, hg, ag, stage in matches:
              row = {k: '' for k in fieldnames}
              row.update({
                  'competition_id':'UEFA_ChampionsLeague',
                  'season':'2026/27','source_season':'2026-27','stage':stage,
                  'source_code':'uefa_official_frozen_pre_kickoff_20260825',
                  'Date':date,'Time':'','HomeTeam':home,'AwayTeam':away,
                  'FTHG':str(hg),'FTAG':str(ag),
                  'FTR':'H' if hg > ag else 'D' if hg == ag else 'A',
                  'HTHG':'','HTAG':''
              })
              rows.append(row)
          with path.open('w', encoding='utf-8', newline='') as fh:
              w = csv.DictWriter(fh, fieldnames=fieldnames)
              w.writeheader(); w.writerows(rows)

          target = [r for r in rows if r['season'] == '2026/27']
          celje_home = [r for r in target if r['HomeTeam'] == 'Celje']
          slovan_away = [r for r in target if r['AwayTeam'] == 'Slovan Bratislava']
          assert len(target) == 79
          assert len(celje_home) == 2 and len(slovan_away) == 2
          assert all(r['Date'] < '2026-08-26' for r in target)
          receipt = {
              'status':'FROZEN_PRE_KICKOFF_90M_SAFE_BACKFILL',
              'competition_id':'UEFA_ChampionsLeague','season':'2026/27',
              'target_fixture':'Celje vs Slovan Bratislava',
              'safe_history_rows':79,'celje_home_rows':2,'slovan_away_rows':2,
              'frozen_source_commit':source_commit,
              'excluded_ambiguous_extra_time_rows':[
                  '2026-07-14 KuPS Kuopio vs Vardar',
                  '2026-07-28 GNK Dinamo vs Thun',
                  '2026-08-11 Bodø/Glimt vs Union SG',
                  '2026-08-11 N.E.C. vs Olympiacos'
              ],
              'celje_egnatia_20260728_used_90m_score':'1-1; verified by Celje official report',
              'pure_model_input':True,'market_snapshot_used':False,'odds_used':False
          }
          Path('/tmp/celje_slovan_pre_kickoff_backfill.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          print('UCL_90M_SAFE_BACKFILL_OK rows=79 celje_home=2 slovan_away=2')
          PY

      - name: Write pure-model strictly pre-kickoff input
        run: |
          cat > /tmp/celje_slovan_input.json <<'JSON'
          {
            "competition_id": "UEFA_ChampionsLeague",
            "season": "2026/27",
            "home_team": "Celje",
            "away_team": "Slovan Bratislava",
            "cutoff_utc": "2026-08-26T18:55:00Z"
          }
          JSON
          cat /tmp/celje_slovan_input.json

      - name: Run proven CURRENT universal router
        run: |
          test -f football-data/engine/run_universal_prediction_candidate_v1.py
          python football-data/engine/run_universal_prediction_candidate_v1.py \
            --input /tmp/celje_slovan_input.json \
            --output /tmp/celje_slovan_output.json
          cat /tmp/celje_slovan_output.json

      - name: Assert pure stable-current-season route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inp = json.loads(Path('/tmp/celje_slovan_input.json').read_text(encoding='utf-8'))
          p = json.loads(Path('/tmp/celje_slovan_output.json').read_text(encoding='utf-8'))
          if 'market_snapshot' in inp:
              raise SystemExit('market snapshot unexpectedly present')
          route = p.get('universal_router') or {}
          state = (p.get('cold_start_candidate') or {}).get('state')
          if route.get('route') != 'STABLE_CURRENT_SEASON' or state != 'STABLE_CURRENT_SEASON':
              raise SystemExit(f'unexpected route/state: {route} / {state}')
          if int(p.get('history_matches', -1)) != 79:
              raise SystemExit(f"unexpected history_matches={p.get('history_matches')}")
          one = (p.get('probabilities') or {}).get('one_x_two')
          if not one:
              raise SystemExit('1X2 missing from model output')
          team_sample = p.get('team_sample') or {}
          if float(team_sample.get('home_raw_matches', 0)) < 2 or float(team_sample.get('away_raw_matches', 0)) < 2:
              raise SystemExit(f'target venue samples below stable threshold: {team_sample}')
          print('ROUTE=', json.dumps(route, ensure_ascii=False, sort_keys=True))
          print('MODEL_1X2=', json.dumps(one, ensure_ascii=False, sort_keys=True))
          print('TEAM_SAMPLE=', json.dumps(team_sample, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload immutable inference output
        uses: actions/upload-artifact@v4
        with:
          name: football3-celje-slovan-20260826-pure-model-frozen-r1
          path: |
            /tmp/celje_slovan_input.json
            /tmp/celje_slovan_output.json
            /tmp/celje_slovan_pre_kickoff_backfill.json
          if-no-files-found: error
          retention-days: 30
