name: football3 Celje vs Slovan pure-model frozen inference r2

on:
  push:
    branches:
      - football3/once-celje-slovan-20260826-r1
    paths:
      - .github/workflows/football3-once-celje-slovan-20260826-r1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: football-data/engine:football-data/validation
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze 90m-safe 2026/27 UCL qualifying history
        run: |
          python - <<'PY'
          import ast, csv, json, re, subprocess
          from pathlib import Path

          source_commit = 'c0205f580e803a89dbca7198b7189afce5fc2ce8'
          source_path = '.github/workflows/football3-once-celje-slovan-20260826.yml'
          text = subprocess.check_output(['git','show',f'{source_commit}:{source_path}'], text=True)
          found = re.search(r"matches = (\[.*?\n\s*\])\n\s*assert len\(matches\) == 79", text, re.S)
          if not found:
              raise SystemExit('frozen 79-match source block not found')
          matches = ast.literal_eval(found.group(1))
          assert len(matches) == 79, len(matches)

          path = Path('football-data/processed/UEFA_ChampionsLeague/main_tournament_90min_safe.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig', newline='')))
          fieldnames = list(rows[0].keys())
          assert not any(r['season'] == '2026/27' for r in rows)
          for date, home, away, hg, ag, stage in matches:
              row = {k: '' for k in fieldnames}
              row.update({
                  'competition_id':'UEFA_ChampionsLeague',
                  'season':'2026/27','source_season':'2026-27','stage':stage,
                  'source_code':'uefa_official_frozen_pre_kickoff_20260825',
                  'Date':date,'Time':'','HomeTeam':home,'AwayTeam':away,
                  'FTHG':str(hg),'FTAG':str(ag),
                  'FTR':'H' if hg > ag else 'D' if hg == ag else 'A',
                  'HTHG':'','HTAG':''
              })
              rows.append(row)
          with path.open('w', encoding='utf-8', newline='') as fh:
              w = csv.DictWriter(fh, fieldnames=fieldnames)
              w.writeheader(); w.writerows(rows)

          target = [r for r in rows if r['season'] == '2026/27']
          celje_home = [r for r in target if r['HomeTeam'] == 'Celje']
          slovan_away = [r for r in target if r['AwayTeam'] == 'Slovan Bratislava']
          assert len(target) == 79
          assert len(celje_home) == 2 and len(slovan_away) == 2
          assert all(r['Date'] < '2026-08-26' for r in target)
          receipt = {
              'status':'FROZEN_PRE_KICKOFF_90M_SAFE_BACKFILL',
              'competition_id':'UEFA_ChampionsLeague','season':'2026/27',
              'target_fixture':'Celje vs Slovan Bratislava',
              'safe_history_rows':79,'celje_home_rows':2,'slovan_away_rows':2,
              'frozen_source_commit':source_commit,
              'excluded_ambiguous_extra_time_rows':[
                  '2026-07-14 KuPS Kuopio vs Vardar',
                  '2026-07-28 GNK Dinamo vs Thun',
                  '2026-08-11 Bodø/Glimt vs Union SG',
                  '2026-08-11 N.E.C. vs Olympiacos'
              ],
              'celje_egnatia_20260728_used_90m_score':'1-1; verified by Celje official report',
              'pure_model_input':True,'market_snapshot_used':False,'odds_used':False
          }
          Path('/tmp/celje_slovan_pre_kickoff_backfill.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          print('UCL_90M_SAFE_BACKFILL_OK rows=79 celje_home=2 slovan_away=2')
          PY

      - name: Write pure-model strictly pre-kickoff input
        run: |
          cat > /tmp/celje_slovan_input.json <<'JSON'
          {
            "competition_id": "UEFA_ChampionsLeague",
            "season": "2026/27",
            "home_team": "Celje",
            "away_team": "Slovan Bratislava",
            "cutoff_utc": "2026-08-26T18:55:00Z"
          }
          JSON
          cat /tmp/celje_slovan_input.json

      - name: Validate next-season PIT hyperparameter rollforward and run unchanged model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from formal_cold_start_candidate_v1 import predict_cold_start_from_history
          from formal_next_season_parameter_rollforward_v470 import build_one
          from football_v460_engine import _merge_parameters, current_season_history, load_config
          from platform_core import atomic_write_json, parse_iso_datetime, read_processed_matches, sha256_json

          inp = json.loads(Path('/tmp/celje_slovan_input.json').read_text(encoding='utf-8'))
          assert 'market_snapshot' not in inp
          cutoff = parse_iso_datetime(inp['cutoff_utc'], 'cutoff_utc')

          roll = build_one(
              'UEFA_ChampionsLeague',
              {'source_season':'2025/26','target_season':'2026/27'},
          )
          if roll.get('status') != 'NEXT_SEASON_PARAMETERS_FROZEN':
              raise SystemExit(f'rollforward failed: {roll}')
          if roll.get('team_strength_rollforward') is not False or roll.get('probability_change') is not False:
              raise SystemExit(f'rollforward invariant failed: {roll}')

          formal_config = load_config()
          complete_params = _merge_parameters(formal_config, roll['selected_parameters'])
          if set(complete_params) != set(formal_config['default_parameters']):
              raise SystemExit('complete PIT parameter set mismatch')

          matches = read_processed_matches(inp['competition_id'])
          target_season, history = current_season_history(matches, cutoff, inp['season'])
          if target_season != inp['season'] or len(history) != 79:
              raise SystemExit(f'unexpected target history: season={target_season} rows={len(history)}')

          out = predict_cold_start_from_history(
              history,
              inp['competition_id'], inp['season'], inp['home_team'], inp['away_team'], cutoff,
              stable_selected_parameters=complete_params,
          )
          out['oneoff_execution_audit'] = {
              'route':'STABLE_CURRENT_SEASON_WITH_VALIDATED_NEXT_SEASON_PIT_ROLLFORWARD',
              'source_season':roll['source_season'],
              'target_season':roll['target_season'],
              'parameter_sha256_partial_rollforward':roll['parameter_sha256'],
              'complete_parameter_sha256':sha256_json(complete_params),
              'source_model_sha256':roll['source_model_sha256'],
              'source_validation_report_sha256':roll['source_validation_report_sha256'],
              'team_strength_rollforward':False,
              'target_strength_history_only':'2026/27 UCL qualifying matches strictly before cutoff',
              'market_snapshot_used':False,
              'odds_used':False,
              'manual_probability_adjustment':False,
          }
          atomic_write_json(Path('/tmp/celje_slovan_output.json'), out)
          Path('/tmp/celje_slovan_parameter_rollforward.json').write_text(
              json.dumps(roll, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Assert pure stable-current-season model output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inp = json.loads(Path('/tmp/celje_slovan_input.json').read_text(encoding='utf-8'))
          p = json.loads(Path('/tmp/celje_slovan_output.json').read_text(encoding='utf-8'))
          if 'market_snapshot' in inp:
              raise SystemExit('market snapshot unexpectedly present')
          state = (p.get('cold_start_candidate') or {}).get('state')
          if state != 'STABLE_CURRENT_SEASON':
              raise SystemExit(f'unexpected state: {state}')
          if int(p.get('history_matches', -1)) != 79:
              raise SystemExit(f"unexpected history_matches={p.get('history_matches')}")
          one = (p.get('probabilities') or {}).get('one_x_two')
          if not one:
              raise SystemExit('1X2 missing from model output')
          team_sample = p.get('team_sample') or {}
          if float(team_sample.get('home_raw_matches', 0)) != 2 or float(team_sample.get('away_raw_matches', 0)) != 2:
              raise SystemExit(f'target venue samples mismatch: {team_sample}')
          if (p.get('cold_start_candidate') or {}).get('historical_odds_read') is not False:
              raise SystemExit('historical odds audit is not false')
          audit = p.get('oneoff_execution_audit') or {}
          required_false = ['team_strength_rollforward','market_snapshot_used','odds_used','manual_probability_adjustment']
          if any(audit.get(k) is not False for k in required_false):
              raise SystemExit(f'pure-model audit failed: {audit}')
          print('MODEL_1X2=', json.dumps(one, ensure_ascii=False, sort_keys=True))
          print('TEAM_SAMPLE=', json.dumps(team_sample, ensure_ascii=False, sort_keys=True))
          print('EXECUTION_AUDIT=', json.dumps(audit, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload immutable inference output
        uses: actions/upload-artifact@v4
        with:
          name: football3-celje-slovan-20260826-pure-model-frozen-r2
          path: |
            /tmp/celje_slovan_input.json
            /tmp/celje_slovan_output.json
            /tmp/celje_slovan_pre_kickoff_backfill.json
            /tmp/celje_slovan_parameter_rollforward.json
          if-no-files-found: error
          retention-days: 30
