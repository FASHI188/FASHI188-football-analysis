name: football3 R43F2 context lineup oldest20k replication

on:
  push:
    branches:
      - football3/r43f2-context-lineup-oldest20k-replication
    paths:
      - 'football-data/experiments/r43f2_context_lineup_oldest20k_replication/**'
      - '.github/workflows/football3-r43f2-context-lineup-oldest20k-replication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43f2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43f2-context-lineup-oldest20k-replication
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R43F2 frozen replication
        run: python football-data/experiments/r43f2_context_lineup_oldest20k_replication/run_r43f2.py run
      - name: Verify R43F2 contract
        run: python football-data/experiments/r43f2_context_lineup_oldest20k_replication/run_r43f2.py verify
      - name: Persist R43F2 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43f2_context_lineup_oldest20k_replication/results/summary_r43f2_context_lineup_oldest20k.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43F2 context lineup oldest20k replication'
            git fetch origin football3/r43f2-context-lineup-oldest20k-replication
            git rebase origin/football3/r43f2-context-lineup-oldest20k-replication
            git push origin HEAD:football3/r43f2-context-lineup-oldest20k-replication
          fi
      - name: Upload R43F2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43f2-context-lineup-oldest20k-replication
          path: football-data/experiments/r43f2_context_lineup_oldest20k_replication/results/summary_r43f2_context_lineup_oldest20k.json
          if-no-files-found: error
          retention-days: 90
