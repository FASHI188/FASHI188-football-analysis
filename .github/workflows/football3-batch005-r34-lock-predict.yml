name: football3 Batch005 R34 lock predict

on:
  push:
    branches:
      - football3/batch005-r34-away-load-lock-reveal
    paths:
      - football-data/experiments/batch005_r34_away_load/lock_predict_batch005.py
      - .github/workflows/football3-batch005-r34-lock-predict.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock_predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/batch005-r34-away-load-lock-reveal
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Lock Batch005 safe cohort
        run: python football-data/experiments/batch005_r34_away_load/lock_predict_batch005.py lock
      - name: Verify Batch005 cohort lock
        run: python football-data/experiments/batch005_r34_away_load/lock_predict_batch005.py verify_lock
      - name: Lock frozen R34 predictions
        run: python football-data/experiments/batch005_r34_away_load/lock_predict_batch005.py predict
      - name: Verify Batch005 prediction lock
        run: python football-data/experiments/batch005_r34_away_load/lock_predict_batch005.py verify_predict
      - name: Persist Batch005 lock and predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch005_r34_away_load/results/batch005_locked_100.json
          git add football-data/experiments/batch005_r34_away_load/results/batch005_predictions_locked.json
          git commit -m '[generated] football3 Batch005 R34 prediction lock'
          git push origin HEAD:football3/batch005-r34-away-load-lock-reveal
      - name: Upload Batch005 prediction lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch005-r34-predictions-locked
          path: |
            football-data/experiments/batch005_r34_away_load/results/batch005_locked_100.json
            football-data/experiments/batch005_r34_away_load/results/batch005_predictions_locked.json
          if-no-files-found: error
          retention-days: 90
