name: football3 top1 R26 R21 context audit

on:
  push:
    branches:
      - football3/top1-r26-r21-context-audit
    paths:
      - football-data/experiments/top1_r26_r21_context_audit/run_experiment_r26.py
      - .github/workflows/football3-top1-r26-r21-context-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r26:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r26-r21-context-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R26 R21 context audit
        run: python football-data/experiments/top1_r26_r21_context_audit/run_experiment_r26.py run
      - name: Verify R26 contract
        run: python football-data/experiments/top1_r26_r21_context_audit/run_experiment_r26.py verify
      - name: Persist R26 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r26_r21_context_audit/results/summary_r26.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R26 R21 context audit'
            git push origin HEAD:football3/top1-r26-r21-context-audit
          fi
      - name: Upload R26 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r26-r21-context-audit
          path: football-data/experiments/top1_r26_r21_context_audit/results/summary_r26.json
          if-no-files-found: error
          retention-days: 90
