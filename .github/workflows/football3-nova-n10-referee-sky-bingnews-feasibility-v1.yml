name: football3-nova-n10-referee-sky-bingnews-feasibility

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_sky_bingnews_feasibility_registry_v1.json'
      - 'governance/football3/nova_n10_referee_sky_bingnews_feasibility_v1.py'
      - 'governance/football3/test_nova_n10_referee_sky_bingnews_feasibility_v1.py'
      - '.github/workflows/football3-nova-n10-referee-sky-bingnews-feasibility-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-nova-n10-referee-sky-bingnews-feasibility-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-sky-bingnews-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile             governance/football3/nova_n10_referee_sky_combined_freeze_v1.py             governance/football3/nova_n10_referee_sky_pit_binding_v1.py             governance/football3/nova_n10_referee_sky_arquivo_feasibility_v1.py             governance/football3/nova_n10_referee_sky_bingnews_feasibility_v1.py             governance/football3/test_nova_n10_referee_sky_bingnews_feasibility_v1.py
          PYTHONPATH=governance/football3             python governance/football3/test_nova_n10_referee_sky_bingnews_feasibility_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 6 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Audit Bing News RSS metadata on frozen Sky samples
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_sky_bingnews_feasibility_v1.py             --registry governance/football3/nova_n10_referee_sky_bingnews_feasibility_registry_v1.json             --out _run 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/sky_bingnews_feasibility_receipt.json'))
          assert r['classification'] in {'POSITIVE_SIGNAL_SOURCE_FEASIBILITY','STOP_DATA_COVERAGE'}
          assert r['sample_rounds']==[8,24,34]
          assert r['sample_n']==3
          assert r['rss_description_html_used'] is False
          assert r['bing_article_body_read'] is False
          assert r['sky_article_body_read'] is False
          assert r['rss_pubdate_is_formal_observed_at'] is False
          assert r['referee_assignment_body_parsed'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          assert r['formal_available_at_proven'] is False
          assert r['referee_oof_allowed'] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-sky-bingnews-feasibility-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
