name: Football HF PIT6H reserve seal R1

on:
  push:
    branches: [research/anonymous-data-reserve-r1]
    paths:
      - '.github/workflows/football-hf-reserve-pit6h-seal-r1.yml'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build PIT-safe zero-label reserve and sealed 400-match batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfpit football-data/research/anonymous_data_reserve_r1/hf_pit6h_reserve
          curl -sS -L --fail --retry 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/odds.parquet?download=true' \
            -o /tmp/hfpit/odds.parquet
          curl -sS -L --fail --retry 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/fixtures.parquet?download=true' \
            -o /tmp/hfpit/fixtures.parquet
          python -m pip -q install pyarrow
          python - <<'PY'
          import json,hashlib,math,statistics
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          import pyarrow.parquet as pq

          ODDS_SHA='33286ac0c288a2dfd149a1cb26db92eba2ddb33fec74b30967607035592d720d'
          FIX_SHA='7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7'
          odds_p=Path('/tmp/hfpit/odds.parquet'); fix_p=Path('/tmp/hfpit/fixtures.parquet')
          assert hashlib.sha256(odds_p.read_bytes()).hexdigest()==ODDS_SHA
          assert hashlib.sha256(fix_p.read_bytes()).hexdigest()==FIX_SHA
          outdir=Path('football-data/research/anonymous_data_reserve_r1/hf_pit6h_reserve')

          def utc(x):
              if x is None: return None
              if isinstance(x,datetime):
                  return x.replace(tzinfo=timezone.utc) if x.tzinfo is None else x.astimezone(timezone.utc)
              s=str(x).strip().replace('Z','+00:00')
              try:
                  d=datetime.fromisoformat(s)
                  return d.replace(tzinfo=timezone.utc) if d.tzinfo is None else d.astimezone(timezone.utc)
              except Exception:
                  return None

          # Only fixture identity/time/completion-status fields are opened. Goals/result/btts are never read.
          ft=pq.read_table(fix_p,columns=['id','date_utc','is_played','league_id','home_team_id','away_team_id'])
          fixes={}
          for fid,dt,played,lid,hid,aid in zip(*(ft[c].to_pylist() for c in ['id','date_utc','is_played','league_id','home_team_id','away_team_id'])):
              if fid is None: continue
              k=utc(dt)
              if k is None: continue
              fixes[int(fid)]={'kickoff':k,'is_played':bool(played),'league_id':lid,'home_team_id':hid,'away_team_id':aid}

          ot=pq.read_table(odds_p,columns=['fixture_id','home_win','draw','away_win','bookmaker','source','known_at'])
          cols={c:ot[c].to_pylist() for c in ['fixture_id','home_win','draw','away_win','bookmaker','source','known_at']}
          thresholds=[0,1,6,24]
          eligible_by_h={h:{} for h in thresholds}
          rows_valid=0; rows_fixture_missing=0; rows_unplayed=0; rows_bad_time=0; rows_bad_odds=0
          hours_before=[]
          for fid,hw,dr,aw,bm,src,ka in zip(*(cols[c] for c in ['fixture_id','home_win','draw','away_win','bookmaker','source','known_at'])):
              if fid is None or int(fid) not in fixes:
                  rows_fixture_missing+=1; continue
              f=fixes[int(fid)]
              if not f['is_played']:
                  rows_unplayed+=1; continue
              kt=utc(ka)
              if kt is None:
                  rows_bad_time+=1; continue
              try:
                  vals=[float(hw),float(dr),float(aw)]
                  if not all(math.isfinite(x) and x>1.0 for x in vals): raise ValueError
              except Exception:
                  rows_bad_odds+=1; continue
              rows_valid+=1
              hb=(f['kickoff']-kt).total_seconds()/3600.0
              hours_before.append(hb)
              for h in thresholds:
                  if hb>=h:
                      d=eligible_by_h[h].setdefault(int(fid),{'bookmakers':set(),'rows':0,'sources':set()})
                      d['rows']+=1
                      if bm is not None: d['bookmakers'].add(str(bm))
                      if src is not None: d['sources'].add(str(src))

          counts={}
          for h in thresholds:
              d=eligible_by_h[h]
              counts[str(h)]={
                'fixtures_ge1_valid_quote':len(d),
                'fixtures_ge2_bookmakers':sum(1 for x in d.values() if len(x['bookmakers'])>=2),
                'fixtures_ge3_bookmakers':sum(1 for x in d.values() if len(x['bookmakers'])>=3)
              }

          # Final reserve gate: completed historical fixture + valid full 1X2 quote(s) known >=6h pre-kickoff + >=2 bookmakers.
          pit=eligible_by_h[6]
          ids=[fid for fid,d in pit.items() if len(d['bookmakers'])>=2]
          seed='HF-PIT6H-RESERVE-20260817-R1'
          ids=sorted(ids,key=lambda fid:hashlib.sha256(f'{seed}|{fid}'.encode()).hexdigest())
          batch_size=400
          batches=[]
          used=0
          for i in range(0,len(ids),batch_size):
              b=ids[i:i+batch_size]
              if len(b)<300: break
              bid=f'HF-PIT6H-B{len(batches)+1:03d}'
              payload={
                'schema_version':'HF-PIT6H-SEALED-BATCH-R1',
                'batch_id':bid,
                'batch_size':len(b),
                'fixture_ids':b,
                'status':'SEALED_UNOPENED',
                'selection_uses_outcomes':False,
                'pit_gate':'is_played=true; valid 1X2 decimal odds >1; known_at <= kickoff-6h; >=2 bookmakers',
                'outcome_columns_dereferenced':[],
                'outcome_values_dereferenced':0
              }
              p=outdir/f'{bid}.json'; p.write_text(json.dumps(payload,indent=2)+'\n')
              batches.append({'batch_id':bid,'n':len(b),'manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              used+=len(b)

          inv={
            'schema_version':'HF-PIT6H-RESERVE-INVENTORY-R1',
            'source':'huggingface:eatpizzanot/soccer-dataset',
            'source_hashes':{'odds.parquet':ODDS_SHA,'fixtures.parquet':FIX_SHA},
            'anonymous_download':True,
            'fixture_fields_dereferenced':['id','date_utc','is_played','league_id','home_team_id','away_team_id'],
            'forbidden_fixture_fields_not_dereferenced':['goals_home','goals_away','btts'],
            'odds_fields_dereferenced':['fixture_id','home_win','draw','away_win','bookmaker','source','known_at'],
            'valid_odds_rows_on_played_fixtures':rows_valid,
            'diagnostic_counts':{'fixture_missing':rows_fixture_missing,'unplayed':rows_unplayed,'bad_time':rows_bad_time,'bad_odds':rows_bad_odds},
            'pit_coverage_by_hours_before_kickoff':counts,
            'final_gate_hours_before_kickoff':6,
            'final_gate_min_bookmakers':2,
            'final_eligible_matches':len(ids),
            'sealed_batch_size':batch_size,
            'sealed_batches':len(batches),
            'sealed_matches':used,
            'unsealed_tail_matches':len(ids)-used,
            'batches':batches,
            'outcome_values_dereferenced':0,
            'hard_rule':'Per experiment, outcome labels may be opened for at most one preregistered sealed batch of 300-500 matches. All other batches remain unopened.'
          }
          if hours_before:
              s=sorted(hours_before)
              def q(p): return s[min(len(s)-1,max(0,int((len(s)-1)*p)))]
              inv['valid_quote_hours_before_kickoff']={'min':s[0],'p05':q(.05),'median':q(.5),'p95':q(.95),'max':s[-1]}
          (outdir/'inventory.json').write_text(json.dumps(inv,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(inv,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-pit6h-sealed-reserve-r1
          path: football-data/research/anonymous_data_reserve_r1/hf_pit6h_reserve/*.json
          retention-days: 30
