name: Football3 Promoted Cold Start V2.1 Successor Retry V1

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, synchronize, reopened]
    paths:
      - 'football-data/research/promoted_cold_start_v2_1_successor_retry_v1/**'
      - '.github/workflows/football3-promoted-cold-start-v2-1-successor-retry-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v21-successor-s5bba9664d040019153abb193eaa4a71cf1ec7c8c-w06fc733db5058e4481cfe5242a790007a0229615
  cancel-in-progress: false

env:
  SUCCESSOR_BRANCH: 'football3/promoted-cold-start-v2-1-successor-technical-retry-v1'
  PREDECESSOR_HEAD: '503d2c350fb44cdeb4b4172a41d5be5eb568e0d9'
  EXACT_BASE: '0bfcd824d855161595226f3a67b33c4cfa9ab8a3'
  SUCCESSOR_FREEZE_BLOB: '5bba9664d040019153abb193eaa4a71cf1ec7c8c'
  SUCCESSOR_WRAPPER_BLOB: '06fc733db5058e4481cfe5242a790007a0229615'
  ENGINEERING_VALIDATOR_BLOB: 'fb1be6593c769bd4a7762fdbcdc4151e1490e786'
  PREDECESSOR_WRAPPER_BLOB: 'a47141391eb328b24bef269f3328167527aa3fb4'
  PREREG_BLOB: '30c45da908540ad99aab51024729d554a7047c7a'
  EVALUATOR_BLOB: '849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1'
  PRELABEL_RECEIPT_BLOB: 'd482ff53313d9e34df07e87a4bdfaa158841ff61'
  RUNTIME_BLOB: '8994226369094908beb410ce454d19fd7272c3df'
  TEAM_ALIASES_BLOB: '6248028352308ceda6800794c0ee3f5ceca223a9'
  OUTPUT_INTERFACE_BLOB: '7a57f49b510b8b099726b4be3d47bf3c2b091c42'
  SOURCE_TRANSITION_BLOB: '3139b147614d6e34403f9c807fd90c17a890f2e1'
  TRANSPORT_MIRROR_BLOB: '8980a42025683304c0221090f9341eef150e0cc6'
  NONSTANDARD_FIXTURE_BLOB: 'ea4d21139815c625e82b148e79abd18501f06d89'
  NONSTANDARD_FIXTURE_APPEND_BLOB: 'dcdc712186d7707d26f308980483f76549c29978'
  V6188_CLOSURE_BLOB: '87b43c4a45890828312a8a93b3868b7b2f471df3'
  V6187_DATE_RULE_BLOB: 'f0d2546bce183a92076bcca05b139be41106894d'
  RESULT_MANIFEST_BLOB: 'a9d8c1ce964008ef6caefb169b444075f587e64f'
  RESULT_ADJ_V1_BLOB: '86a1b745c698744818e4f936aea694743bae16db'
  FROZEN_XG_ADJ_V1_BLOB: '4959d165c6bcced39da0b11a1a0eb0d990b52130'
  FROZEN_XG_ADJ_V2_BLOB: '568cd28170b60430d57274ca8615b7a84132c3a8'
  RESULT_ADJ_V2_BLOB: '356c882b54592bb61e35c3b5db5eab3a1f2f98a3'
  RELEASE_ORDER_BLOB: '3ce4ce4e10b4944cb2268f1bd6355672d65bfeb0'
  UNDERSTAT_ARTIFACT_ID: '9798682425'
  CONFIRMATION_ARTIFACT_ID: '9827606506'
  CORE_AUDIT_ARTIFACT_ID: '9992599594'
  CORE_AUDIT_ARTIFACT_DIGEST: '76cdf78233e84f1f57edfe8b6879d2a02e74a4ea74b86e1fe70d65154e970053'
  CORE_AUDIT_FILE_SHA256: '56a5ba1c6b3412f9c1c6496b25a8e1bfa296475ca1b8a305165d192a232b9deb'
  PREDECESSOR_ATTEMPT_ARTIFACT_ID: '10022701301'
  PREDECESSOR_ATTEMPT_ARTIFACT_DIGEST: 'sha256:63c377fb69fa7e9f40e8a8d5459fbfc29cd412521fcc0b26a2f1704cf69d774a'
  PREDECESSOR_RESULT_ARTIFACT_ID: '10022701899'
  PREDECESSOR_RESULT_ARTIFACT_DIGEST: 'sha256:b16b9ab4c59ddcbd7376a6692c8f4f106a5a79040860e6f438f60bad0e471b57'
  ATTEMPT_ARTIFACT_NAME: 'football3-v21-successor-attempt-p30c45da908540ad99aab51024729d554a7047c7a-e849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1-rd482ff53313d9e34df07e87a4bdfaa158841ff61'
  RESULT_ARTIFACT_NAME: 'football3-v21-successor-result-p30c45da908540ad99aab51024729d554a7047c7a-e849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1-rd482ff53313d9e34df07e87a4bdfaa158841ff61'
  POSTPASS_ARTIFACT_NAME: 'football3-v21-successor-postpass-p30c45da908540ad99aab51024729d554a7047c7a-e849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1-rd482ff53313d9e34df07e87a4bdfaa158841ff61'
  REGRESSION_CUTOFF: '2026-09-04T13:19:44+00:00'

jobs:
  unique-successor-evaluator:
    if: ${{ github.event.pull_request.head.ref == 'football3/promoted-cold-start-v2-1-successor-technical-retry-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind successor lineage and frozen science
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_HEAD_REF" = "$SUCCESSOR_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXACT_BASE" HEAD
          git merge-base --is-ancestor "$PREDECESSOR_HEAD" HEAD

          test "$(git hash-object football-data/research/promoted_cold_start_v2_1_successor_retry_v1/SUCCESSOR_RETRY_FREEZE.json)" = "$SUCCESSOR_FREEZE_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1_successor_retry_v1/run_frozen_evaluator_successor_retry_v1.py)" = "$SUCCESSOR_WRAPPER_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1_successor_retry_v1/validate_successor_retry_engineering_v1.py)" = "$ENGINEERING_VALIDATOR_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/run_frozen_evaluator_after_prelabel_v1.py)" = "$PREDECESSOR_WRAPPER_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PREREGISTRATION.json)" = "$PREREG_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/evaluate.py)" = "$EVALUATOR_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json)" = "$PRELABEL_RECEIPT_BLOB"
          test "$(git hash-object football-data/formal_fast_runtime_v1/runtime.py)" = "$RUNTIME_BLOB"
          test "$(git hash-object football-data/config/team_aliases.json)" = "$TEAM_ALIASES_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/CANDIDATE_OUTPUT_INTERFACE_V1.json)" = "$OUTPUT_INTERFACE_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SOURCE_TRANSITION.json)" = "$SOURCE_TRANSITION_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_METRIC_TRANSPORT_MIRROR_TRANSITION.json)" = "$TRANSPORT_MIRROR_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION.json)" = "$NONSTANDARD_FIXTURE_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION_2.json)" = "$NONSTANDARD_FIXTURE_APPEND_BLOB"
          test "$(git hash-object football-data/manifests/v6_understat_alias_closure_v6188_status.json)" = "$V6188_CLOSURE_BLOB"
          test "$(git hash-object football-data/validation/v6_understat_alias_qualification_v6187.py)" = "$V6187_DATE_RULE_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/result_adjudications_v1.json)" = "$RESULT_MANIFEST_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_result_adjudication_v1.py)" = "$RESULT_ADJ_V1_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_frozen_xg_identity_adjudication_v1.py)" = "$FROZEN_XG_ADJ_V1_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_frozen_xg_identity_adjudication_v2.py)" = "$FROZEN_XG_ADJ_V2_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_result_adjudication_v2.py)" = "$RESULT_ADJ_V2_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_v1_release_order_replay_v1.py)" = "$RELEASE_ORDER_BLOB"

          git diff --name-only "$PREDECESSOR_HEAD"...HEAD | tee successor-changed-files.txt
          if grep -Ev '^(\.github/workflows/football3-promoted-cold-start-v2-1-successor-retry-v1\.yml|football-data/research/promoted_cold_start_v2_1_successor_retry_v1/)' successor-changed-files.txt | grep -q .; then
            echo 'successor changed files exceed technical-retry scope' >&2
            exit 1
          fi

          mkdir -p research-output .runtime_sources/understat .runtime_sources/confirmation .runtime_sources/core .footballdata_mirror_raw .research_sources research-output/current-probes
          cp football-data/research/promoted_cold_start_v2_1_successor_retry_v1/SUCCESSOR_RETRY_FREEZE.json research-output/SUCCESSOR_RETRY_FREEZE.json
          cp football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json research-output/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json

      - name: Verify predecessor failure remains immutable and successor artifacts are unconsumed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          for aid,digest in ((os.environ['PREDECESSOR_ATTEMPT_ARTIFACT_ID'],os.environ['PREDECESSOR_ATTEMPT_ARTIFACT_DIGEST']),(os.environ['PREDECESSOR_RESULT_ARTIFACT_ID'],os.environ['PREDECESSOR_RESULT_ARTIFACT_DIGEST'])):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',headers=headers)
              with urllib.request.urlopen(req) as r: a=json.load(r)
              assert str(a['id'])==aid and a['digest']==digest and not a['expired'],a
          for name in (os.environ['ATTEMPT_ARTIFACT_NAME'],os.environ['RESULT_ARTIFACT_NAME']):
              req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts?name={urllib.parse.quote(name)}&per_page=100",headers=headers)
              with urllib.request.urlopen(req) as r: d=json.load(r)
              if any(a.get('name')==name for a in d.get('artifacts',[])):
                  raise SystemExit(f'successor already consumed: {name}')
          PY

      - name: Pre-metric engineering acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1:${{ github.workspace }}/football-data/validation
        run: |
          set -euo pipefail
          python3 -m py_compile football-data/research/promoted_cold_start_v2_1_successor_retry_v1/run_frozen_evaluator_successor_retry_v1.py
          python3 -m py_compile football-data/research/promoted_cold_start_v2_1_successor_retry_v1/validate_successor_retry_engineering_v1.py
          python3 -m json.tool football-data/research/promoted_cold_start_v2_1_successor_retry_v1/SUCCESSOR_RETRY_FREEZE.json >/dev/null
          python3 football-data/research/promoted_cold_start_v2_1_successor_retry_v1/validate_successor_retry_engineering_v1.py | tee research-output/successor-engineering-acceptance.json
          python3 - <<'PY'
          import json
          d=json.load(open('research-output/successor-engineering-acceptance.json'))
          assert d['status']=='PASS_SUCCESSOR_ENGINEERING_PRE_METRIC'
          assert d['candidate_metric_observations']==0
          assert d['predecessor_preserved'] is True
          assert d['science_blobs_unchanged'] is True
          assert d['wrapper_good_receipt_reaches_fake_runpy_once'] is True
          assert d['wrapper_bad_receipts_rejected_before_fake_runpy'] is True
          PY

      - name: Acquire frozen formal sources and governed current-audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "$UNDERSTAT_ARTIFACT_ID:.runtime_sources/understat.zip" \
            "$CONFIRMATION_ARTIFACT_ID:.runtime_sources/confirmation.zip" \
            "$CORE_AUDIT_ARTIFACT_ID:.runtime_sources/core.zip"; do
            id="${spec%%:*}"; dst="${spec#*:}"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$dst"
          done
          test "$(sha256sum .runtime_sources/core.zip | awk '{print $1}')" = "$CORE_AUDIT_ARTIFACT_DIGEST"
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation
          unzip -q .runtime_sources/core.zip -d .runtime_sources/core
          test -f .runtime_sources/understat/understat_frozen.db
          test -f .runtime_sources/confirmation/confirmation_identity.jsonl
          test -f .runtime_sources/confirmation/confirmation_xg_result_vault.jsonl
          test -f .runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json
          test "$(sha256sum .runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json | awk '{print $1}')" = "$CORE_AUDIT_FILE_SHA256"
          python3 - <<'PY'
          import json
          d=json.load(open('.runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json',encoding='utf-8'))
          big5=('ENG_PremierLeague','ESP_LaLiga','GER_Bundesliga','ITA_SerieA','FRA_Ligue1')
          n=0
          for c in big5:
              x=d['domains'][c]
              assert x['final_guard_status']=='PASS',(c,x['final_guard_status'])
              assert not x['missing'] and not x['extra'] and not x['ambiguous'] and not x['duplicate_canonical_identity']
              n+=len(x['promoted_entering_clubs'])
          assert n==14,n
          PY
          sha256sum \
            .runtime_sources/understat/understat_frozen.db \
            .runtime_sources/confirmation/confirmation_identity.jsonl \
            .runtime_sources/confirmation/confirmation_xg_result_vault.jsonl \
            .runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json \
            > research-output/frozen-input-files.sha256

      - name: Acquire frozen Football-Data lower-tier result history
        run: |
          set -euo pipefail
          python3 - <<'PY' > .footballdata-mirror-plan.tsv
          import json
          d=json.load(open('football-data/research/promoted_cold_start_v2_1/PRE_METRIC_TRANSPORT_MIRROR_TRANSITION.json'))
          assert d['status']=='FROZEN_BEFORE_CANDIDATE_EVALUATION'
          assert d['candidate_metric_observations_before_transition']==0
          assert d['candidate_evaluator_completed_before_transition'] is False
          m=d['mirror']
          assert m['repository']=='IBalazs433/football-analytics-dashboard'
          assert m['commit']=='232db0e8ef58b2d94272ff6c206356bc10bdc36d'
          sc={'2021/22':'2122','2022/23':'2223','2023/24':'2324','2024/25':'2425','2025/26':'2526'}
          dc={'ENG_PremierLeague':'E1','ESP_LaLiga':'SP2','GER_Bundesliga':'D2','ITA_SerieA':'I2','FRA_Ligue1':'F2'}
          rows=[]
          for f in m['files']:
              rows.append((f['competition_id'],sc[f['season']],dc[f['competition_id']],m['repository'],m['commit'],f['path'],f['git_blob_sha'],str(f['bytes'])))
          assert len(rows)==25
          for r in rows: print('\t'.join(r))
          PY
          while IFS=$'\t' read -r comp season_code div repo commit source_path expected_blob expected_bytes; do
            dst=".footballdata_mirror_raw/${comp}/${season_code}-${div}.csv"
            mkdir -p "$(dirname "$dst")"
            curl --fail --location --silent --show-error --http1.1 \
              --user-agent 'football3-v21-successor-retry/1.0' \
              --connect-timeout 8 --max-time 30 \
              --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
              "https://raw.githubusercontent.com/${repo}/${commit}/${source_path}" -o "$dst"
            test -s "$dst"
            test "$(wc -c < "$dst" | tr -d ' ')" = "$expected_bytes"
            test "$(git hash-object "$dst")" = "$expected_blob"
          done < .footballdata-mirror-plan.tsv
          python3 football-data/research/promoted_cold_start_v2_1/prepare_footballdata_mirror_sources_v2.py \
            --receipt "$PWD/football-data/research/promoted_cold_start_v2_1/PRE_METRIC_TRANSPORT_MIRROR_TRANSITION.json" \
            --nonstandard-fixture-receipt "$PWD/football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION.json" \
            --nonstandard-fixture-receipt "$PWD/football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION_2.json" \
            --raw-root "$PWD/.footballdata_mirror_raw" \
            --out-root "$PWD/.research_sources" \
            --manifest "$PWD/research-output/lower-tier-source-manifest.json" \
            | tee research-output/lower-tier-source-prepare.stdout
          python3 - <<'PY'
          import json
          d=json.load(open('research-output/lower-tier-source-manifest.json'))
          assert d['schema_version']=='football3-footballdata-transport-mirror-source-manifest-v3'
          assert d['mirror_repository']=='IBalazs433/football-analytics-dashboard'
          assert d['mirror_commit']=='232db0e8ef58b2d94272ff6c206356bc10bdc36d'
          assert d['file_count']==25 and d['competition_count']==5 and d['season_count']==5
          assert d['total_documented_nonstandard_omissions']==2
          assert all(x['parsed_matches']==x['expected_scored_matches'] for x in d['files'])
          assert all(x['converted_fields']==['Date','HomeTeam','AwayTeam','FTHG','FTAG'] for x in d['files'])
          assert all(not x['odds_fields_used'] and not x['postmatch_stats_used'] and not x['xg_fields_used'] for x in d['files'])
          PY

      - name: Create irreversible successor EVALUATOR_ATTEMPT receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}
          for name in (os.environ['ATTEMPT_ARTIFACT_NAME'],os.environ['RESULT_ARTIFACT_NAME']):
              req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts?name={urllib.parse.quote(name)}&per_page=100",headers=headers)
              with urllib.request.urlopen(req) as r: d=json.load(r)
              if any(a.get('name')==name for a in d.get('artifacts',[])):
                  raise SystemExit(f'successor evaluator already consumed before attempt: {name}')
          PY
          python3 - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          payload={
            'schema_version':'football3-promoted-cold-start-v2-1-successor-evaluator-attempt-v1',
            'status':'SUCCESSOR_EVALUATOR_ATTEMPT_IRREVERSIBLY_CONSUMED',
            'created_at_utc':datetime.now(timezone.utc).isoformat(),
            'pr_number':int(os.environ['GITHUB_REF_NAME'].split('/')[0]) if os.environ.get('GITHUB_REF_NAME','').split('/')[0].isdigit() else None,
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'exact_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'predecessor_exact_head':os.environ['PREDECESSOR_HEAD'],
            'predecessor_run_id':34132629584,
            'predecessor_verdict':'FAIL_RESEARCH_ONLY',
            'predecessor_candidate_metric_observations':0,
            'successor_freeze_git_blob_sha':os.environ['SUCCESSOR_FREEZE_BLOB'],
            'successor_wrapper_git_blob_sha':os.environ['SUCCESSOR_WRAPPER_BLOB'],
            'pre_label_receipt_git_blob_sha':os.environ['PRELABEL_RECEIPT_BLOB'],
            'preregistration_git_blob_sha':os.environ['PREREG_BLOB'],
            'evaluator_git_blob_sha':os.environ['EVALUATOR_BLOB'],
            'production_runtime_git_blob_sha':os.environ['RUNTIME_BLOB'],
            'team_aliases_git_blob_sha':os.environ['TEAM_ALIASES_BLOB'],
            'candidate_metric_observations_before_attempt':0,
            'successor_evaluator_invocations_before_attempt':0,
            'rerun_allowed_after_this_receipt':False,
            'rescue_tuning_allowed':False,
            'parameters_thresholds_samples_or_gates_may_change_after_attempt':False
          }
          open('research-output/SUCCESSOR_EVALUATOR_ATTEMPT_RECEIPT.json','w',encoding='utf-8').write(json.dumps(payload,sort_keys=True,indent=2))
          PY
          sha256sum research-output/SUCCESSOR_EVALUATOR_ATTEMPT_RECEIPT.json > research-output/SUCCESSOR_EVALUATOR_ATTEMPT_RECEIPT.sha256

      - name: Seal successor attempt artifact before label observation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ATTEMPT_ARTIFACT_NAME }}
          path: |
            research-output/SUCCESSOR_EVALUATOR_ATTEMPT_RECEIPT.json
            research-output/SUCCESSOR_EVALUATOR_ATTEMPT_RECEIPT.sha256
            research-output/SUCCESSOR_RETRY_FREEZE.json
            research-output/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json
            research-output/successor-engineering-acceptance.json
            research-output/frozen-input-files.sha256
            research-output/lower-tier-source-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Invoke frozen evaluator exactly once through successor wrapper
        id: evaluator
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1:${{ github.workspace }}/football-data/validation
        run: |
          set -euo pipefail
          test -f research-output/SUCCESSOR_EVALUATOR_ATTEMPT_RECEIPT.json
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > research-output/successor-evaluator-started-at.txt
          set +e
          python3 football-data/research/promoted_cold_start_v2_1_successor_retry_v1/run_frozen_evaluator_successor_retry_v1.py \
            --repo-root "$PWD" \
            --sources "$PWD/.research_sources" \
            --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runtime_sources/confirmation" \
            --current-audit "$PWD/.runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json" \
            --probe-manifest "$PWD/football-data/research/promoted_cold_start_v2_1/CURRENT_PROBE_FIXTURES.json" \
            --out "$PWD/research-output/historical-candidate-evaluation.json" \
            > research-output/historical-candidate-evaluation.stdout \
            2> research-output/historical-candidate-evaluation.stderr
          rc=$?
          set -e
          echo "$rc" > research-output/successor-evaluator-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze successor historical metrics and scientific verdict
        id: freeze
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path('research-output/historical-candidate-evaluation.json')
          rc=int(Path('research-output/successor-evaluator-exit-code.txt').read_text().strip())
          result={
            'schema_version':'football3-promoted-cold-start-v2-1-successor-evaluator-result-v1',
            'created_at_utc':datetime.now(timezone.utc).isoformat(),
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'exact_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'predecessor_exact_head':os.environ['PREDECESSOR_HEAD'],
            'predecessor_run_id':34132629584,
            'predecessor_verdict':'FAIL_RESEARCH_ONLY',
            'predecessor_candidate_metric_observations':0,
            'successor_evaluator_exit_code':rc,
            'successor_evaluator_invocations':1,
            'candidate_metric_observations':0,
            'successor_freeze_git_blob_sha':os.environ['SUCCESSOR_FREEZE_BLOB'],
            'successor_wrapper_git_blob_sha':os.environ['SUCCESSOR_WRAPPER_BLOB'],
            'candidate_code_git_blob_sha':os.environ['EVALUATOR_BLOB'],
            'candidate_config_git_blob_sha':os.environ['PREREG_BLOB'],
            'candidate_output_interface_git_blob_sha':os.environ['OUTPUT_INTERFACE_BLOB'],
            'pre_label_receipt_git_blob_sha':os.environ['PRELABEL_RECEIPT_BLOB'],
            'production_runtime_git_blob_sha':os.environ['RUNTIME_BLOB'],
            'team_aliases_git_blob_sha':os.environ['TEAM_ALIASES_BLOB'],
            'duplicate_execution_detected':False,
            'rescue_tuning_detected':False,
            'label_leakage_detected':False,
            'formal_activation':False,
            'formal_model_or_current_modified':False,
            'formal_weights_modified':False
          }
          if rc==0 and out.is_file():
              d=json.load(out.open(encoding='utf-8'))
              assert d['schema_version']=='football3-promoted-cold-start-v2-1-evaluation-v1'
              assert d['status'] in ('PASS','STOP_NO_CANDIDATE')
              assert isinstance(d['scientific_pass'],bool)
              assert d['formal_or_current_modified'] is False
              assert d['club_specific_patch_count']==0
              expected={'Top1','LogLoss','Brier','RPS','score_logloss','exact_score_top1_accuracy','total_goals_mae','over_under_2_5_brier'}
              for block in ('development','selection'):
                  assert d[block]['n']>0
                  assert set(d[block]['metrics'])=={'frozen_v1','formal_baseline','strength_only','tier_gap_only','candidate'}
                  for m in d[block]['metrics'].values(): assert set(m)==expected
              result.update({
                'status':'SUCCESSOR_EVALUATOR_RESULT_FROZEN',
                'candidate_metric_observations':1,
                'scientific_verdict':d['status'],
                'scientific_pass':d['scientific_pass'],
                'failed_scientific_gates':d['failed_gates'],
                'gamma':d['gamma'],
                'gamma_solver':d['gamma_solver'],
                'development_n':d['development']['n'],
                'selection_n':d['selection']['n'],
                'development_metrics':d['development']['metrics'],
                'selection_metrics':d['selection']['metrics'],
                'selection_per_league_metrics':d['selection']['per_league'],
                'evaluation_output_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
                'v3_binding_status':'V3_CAN_START_WITH_FROZEN_V2_1_RESEARCH_EXPERT' if d['scientific_pass'] else 'V3_CAN_START_WITH_V2_1_WEIGHT_ZERO'
              })
          else:
              result.update({
                'status':'SUCCESSOR_EVALUATOR_FAILED_AFTER_IRREVERSIBLE_ATTEMPT',
                'scientific_verdict':'FAIL_RESEARCH_ONLY',
                'scientific_pass':False,
                'failed_scientific_gates':['EVALUATOR_EXECUTION_FAILURE'],
                'v3_binding_status':'V3_CAN_START_WITH_V2_1_WEIGHT_ZERO'
              })
          Path('research-output/SUCCESSOR_EVALUATOR_RESULT_RECEIPT.json').write_text(json.dumps(result,sort_keys=True,indent=2),encoding='utf-8')
          PY
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('research-output/SUCCESSOR_EVALUATOR_RESULT_RECEIPT.json'))
          print('science_pass=' + ('true' if d.get('scientific_pass') else 'false'))
          print('metric_observations=' + str(d.get('candidate_metric_observations',0)))
          print('scientific_verdict=' + str(d.get('scientific_verdict')))
          PY
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PREREGISTRATION.json)" = "$PREREG_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/evaluate.py)" = "$EVALUATOR_BLOB"
          test "$(git hash-object football-data/formal_fast_runtime_v1/runtime.py)" = "$RUNTIME_BLOB"
          test "$(git hash-object football-data/config/team_aliases.json)" = "$TEAM_ALIASES_BLOB"
          sha256sum research-output/SUCCESSOR_EVALUATOR_RESULT_RECEIPT.json > research-output/SUCCESSOR_EVALUATOR_RESULT_RECEIPT.sha256

      - name: Upload frozen successor evaluator result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT_NAME }}
          path: research-output
          if-no-files-found: error
          retention-days: 90

      - name: Select durable state for post-PASS probes
        if: steps.freeze.outputs.science_pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL3_DURABLE_SELECTOR_REQUIRED: '1'
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1
        run: |
          set -euo pipefail
          cat > research-output/state-selection-request.json <<JSON
          {"schema_version":"football3-formal-gpt-gateway-v1","mode":"predict","request_id":"promoted-cold-start-successor-state-anchor-v1","match":{"competition_id":"ENG_PremierLeague","season":"2026/27","kickoff":"2026-09-05T14:00:00+00:00","cutoff":"${REGRESSION_CUTOFF}","home_team_name":"Nottingham Forest","away_team_name":"Tottenham Hotspur"}}
          JSON
          rm -rf .research_state
          python3 football-data/formal_gpt_gateway_v1/durable_state_selector_v1.py \
            --repo "$GITHUB_REPOSITORY" --request "$PWD/research-output/state-selection-request.json" \
            --cache-root "$PWD/.research_state" --audit "$PWD/research-output/durable-state-selection.json"
          python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle --bundle "$PWD/.research_state/bundle"

      - name: Execute 14 of 14 formal-entry probes after scientific PASS
        if: steps.freeze.outputs.science_pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timedelta
          from pathlib import Path
          m=json.load(open('football-data/research/promoted_cold_start_v2_1/CURRENT_PROBE_FIXTURES.json'))
          seen=[]
          for i,fx in enumerate(m['fixtures']):
              ko=datetime.fromisoformat(fx['kickoff']); cutoff=ko-timedelta(minutes=60)
              req={'schema_version':'football3-formal-gpt-gateway-v1','mode':'predict','request_id':f'promoted-successor-probe-{i:02d}','match':{'competition_id':fx['competition_id'],'season':'2026/27','kickoff':fx['kickoff'],'cutoff':cutoff.isoformat(),'home_team_name':fx['home'],'away_team_name':fx['away']}}
              p=Path(f'research-output/current-probes/probe-{i:02d}'); p.mkdir(parents=True,exist_ok=True)
              (p/'request.json').write_text(json.dumps(req,sort_keys=True,separators=(',',':')),encoding='utf-8')
              seen.extend(fx['promoted_clubs'])
          assert len(seen)==14 and len(set(seen))==14,seen
          PY
          for req in research-output/current-probes/probe-*/request.json; do
            d="$(dirname "$req")"
            rm -rf "$d/state"; mkdir -p "$d/state"
            cp -a .research_state/bundle "$d/state/bundle"
            cp .research_state/durable_state_selection_v1.json "$d/state/durable_state_selection_v1.json" || true
            set +e
            python3 football-data/formal_gpt_gateway_v1/entry.py \
              --request "$PWD/$req" --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --state-root "$PWD/$d/state" --out "$PWD/$d/out" > "$d/stdout.txt" 2> "$d/stderr.txt"
            rc=$?; set -e; echo "$rc" > "$d/exit_code.txt"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.load(open('football-data/research/promoted_cold_start_v2_1/CURRENT_PROBE_FIXTURES.json'))
          rows=[]; successful=set()
          for i,fx in enumerate(manifest['fixtures']):
              d=Path(f'research-output/current-probes/probe-{i:02d}'); rc=int((d/'exit_code.txt').read_text())
              out=d/'out'; summary=json.load((out/'summary.json').open()) if (out/'summary.json').is_file() else {}
              receipt=json.load((out/'prediction_receipt.json').open()) if (out/'prediction_receipt.json').is_file() else {}
              ok=(rc==0 and summary.get('status')=='PASS' and bool(receipt))
              if ok: successful.update(fx['promoted_clubs'])
              rows.append({'index':i,'fixture':fx,'exit_code':rc,'success':ok,'route':receipt.get('model_route') or receipt.get('route'),'fallback_class':receipt.get('fallback_class'),'prediction_sha':receipt.get('prediction_sha'),'input_sha':receipt.get('runtime_input_sha') or receipt.get('input_sha'),'state_sha':receipt.get('state_sha256'),'summary':summary})
          payload={'schema_version':'football3-promoted-current-formal-probe-summary-successor-v1','fixture_count':len(rows),'promoted_club_count':14,'successful_promoted_clubs':sorted(successful),'all_probes_pass':len(successful)==14 and all(r['success'] for r in rows),'rows':rows}
          Path('research-output/current-formal-probe-summary.json').write_text(json.dumps(payload,ensure_ascii=False,sort_keys=True,indent=2),encoding='utf-8')
          if not payload['all_probes_pass']:
              raise SystemExit('14/14 formal-entry probes did not pass')
          PY

      - name: Run unchanged production-300 after scientific PASS
        if: steps.freeze.outputs.science_pass == 'true' && always()
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1
        run: |
          set -euo pipefail
          python3 football-data/formal_fast_runtime_v1/test_runtime.py \
            --mode production --repo-root "$PWD" \
            --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runtime_sources/confirmation" \
            --n 300 --out "$PWD/research-output/production-300-equivalence-receipt.json" \
            | tee research-output/production-300.stdout
          python3 - <<'PY'
          import json
          d=json.load(open('research-output/production-300-equivalence-receipt.json'))
          assert d['passed'] is True
          e=d['equivalence_300']; assert e['n']==300 and e['passed'] and e['cache_state_exact']
          assert e['max_abs_1x2']<=1e-12 and e['max_abs_score_matrix_cell']<=1e-12
          PY

      - name: Freeze successor terminal adjudication
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('research-output/SUCCESSOR_EVALUATOR_RESULT_RECEIPT.json'))
          science_ok=(r.get('status')=='SUCCESSOR_EVALUATOR_RESULT_FROZEN' and r.get('candidate_metric_observations')==1 and r.get('scientific_pass') is True)
          probe_path=Path('research-output/current-formal-probe-summary.json')
          prod_path=Path('research-output/production-300-equivalence-receipt.json')
          probe_ok=(json.load(probe_path.open()).get('all_probes_pass') is True) if probe_path.is_file() else False
          prod_ok=(json.load(prod_path.open()).get('passed') is True) if prod_path.is_file() else False
          if r.get('status')!='SUCCESSOR_EVALUATOR_RESULT_FROZEN':
              verdict='FAIL_RESEARCH_ONLY'
          elif not r.get('scientific_pass'):
              verdict=r.get('scientific_verdict') or 'STOP_NO_CANDIDATE'
          elif probe_ok and prod_ok:
              verdict='PROMOTED_COLD_START_V2_1_CANDIDATE_PASS'
          else:
              verdict='PARTIAL_DATA_COVERAGE'
          payload={
            'schema_version':'football3-promoted-cold-start-v2-1-successor-terminal-adjudication-v1',
            'verdict':verdict,
            'historical_scientific_verdict':r.get('scientific_verdict'),
            'scientific_pass':r.get('scientific_pass'),
            'candidate_metric_observations':r.get('candidate_metric_observations'),
            'all_14_formal_entry_probes_pass':probe_ok if science_ok else None,
            'production_300_pass':prod_ok if science_ok else None,
            'probes_and_production_executed_only_after_scientific_pass':True,
            'predecessor_failure_preserved':True,
            'duplicate_execution_detected':False,
            'rescue_tuning_detected':False,
            'formal_activation':False,
            'current_modified':False,
            'formal_model_modified':False,
            'formal_weights_modified':False,
            'production_runtime_modified':False,
            'airtable_modified':False,
            'v3_binding_status':r.get('v3_binding_status')
          }
          Path('research-output/SUCCESSOR_TERMINAL_ADJUDICATION.json').write_text(json.dumps(payload,sort_keys=True,indent=2),encoding='utf-8')
          PY
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PREREGISTRATION.json)" = "$PREREG_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/evaluate.py)" = "$EVALUATOR_BLOB"
          test "$(git hash-object football-data/formal_fast_runtime_v1/runtime.py)" = "$RUNTIME_BLOB"
          test "$(git hash-object football-data/config/team_aliases.json)" = "$TEAM_ALIASES_BLOB"
          find research-output -type f -print0 | sort -z | xargs -0 sha256sum > research-output/successor-artifact-files.sha256

      - name: Upload successor terminal post-pass artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.POSTPASS_ARTIFACT_NAME }}
          path: research-output
          if-no-files-found: error
          retention-days: 90

      - name: Enforce terminal one-shot contract
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('research-output/SUCCESSOR_EVALUATOR_RESULT_RECEIPT.json'))
          t=json.load(open('research-output/SUCCESSOR_TERMINAL_ADJUDICATION.json'))
          assert r['successor_evaluator_invocations']==1
          assert r['candidate_metric_observations'] in (0,1)
          assert t['predecessor_failure_preserved'] is True
          assert t['duplicate_execution_detected'] is False
          assert t['rescue_tuning_detected'] is False
          if r['status']=='SUCCESSOR_EVALUATOR_RESULT_FROZEN':
              assert r['candidate_metric_observations']==1
              assert r['scientific_verdict'] in ('PASS','STOP_NO_CANDIDATE')
          else:
              assert r['candidate_metric_observations']==0
              raise SystemExit('successor evaluator failed after irreversible attempt; second run prohibited')
          print(json.dumps(t,sort_keys=True))
          PY
