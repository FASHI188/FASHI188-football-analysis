name: Football V6.49.5 Context Conditioned 1X2 Audit MANUAL_ONLY

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6495-context-conditioned-selector-manual
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile context audit
        run: python -m py_compile football-data/validation/v6_context_conditioned_selector_forward_v6495.py
      - name: Run manually approved context audit
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_context_conditioned_selector_forward_v6495.py
      - name: Persist manual-run immutable audit ledger
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/forward/v6_context_conditioned_selector_events_v6495.json \
            --allow-prefix football-data/manifests/v6_context_conditioned_selector_v6495_status.json \
            --message-prefix "audit(football): persist manually approved context-conditioned audit"
