name: Football V6.49.5 Context Conditioned 1X2 Audit MANUAL_ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-v6495-context-conditioned-selector-manual
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile context audit
        run: python -m py_compile football-data/validation/v6_context_conditioned_selector_forward_v6495.py
      - name: Run manually approved context audit in ephemeral checkout
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_context_conditioned_selector_forward_v6495.py
      - name: Confirm no repository persistence
        run: git status --short
