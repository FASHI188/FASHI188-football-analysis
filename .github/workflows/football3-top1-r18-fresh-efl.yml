name: football3 top1 R18 fresh EFL confirmation

on:
  push:
    branches:
      - football3/top1-r18-fresh-efl-confirmation
    paths:
      - football-data/experiments/top1_r18_fresh_efl/run_experiment_r18.py
      - .github/workflows/football3-top1-r18-fresh-efl.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r18-fresh-efl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r18-fresh-efl-confirmation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run R18 fresh EFL confirmation
        run: python football-data/experiments/top1_r18_fresh_efl/run_experiment_r18.py run
      - name: Verify R18 contract
        run: python football-data/experiments/top1_r18_fresh_efl/run_experiment_r18.py verify
      - name: Persist R18 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r18_fresh_efl/results/summary_r18.json football-data/experiments/top1_r18_fresh_efl/data/fresh_cohort_r18.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R18 fresh EFL confirmation'
            git push origin HEAD:football3/top1-r18-fresh-efl-confirmation
          fi
      - name: Upload R18 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r18-fresh-efl-confirmation
          path: |
            football-data/experiments/top1_r18_fresh_efl/results/summary_r18.json
            football-data/experiments/top1_r18_fresh_efl/data/fresh_cohort_r18.json
          if-no-files-found: error
          retention-days: 90
