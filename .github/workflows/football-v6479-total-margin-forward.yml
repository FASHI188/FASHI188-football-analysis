name: Football V6.47.9 Total-Margin Forward

on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_total_margin_forward_v6479.py"
      - "football-data/validation/evaluate_direct_total_margin_matrix_v6477.py"
      - "football-data/validation/audit_total_margin_capacity_ablation_v6478.py"
      - "football-data/manifests/v6_total_margin_capacity_ablation_v6478_status.json"
      - "football-data/forward/v6_market_first_events_v651.json"
      - "football-data/forward/inbox/market_first_results_v651.json"
      - "football-data/processed/**"
      - ".github/workflows/football-v6479-total-margin-forward.yml"
  workflow_dispatch:
  schedule:
    - cron: "29 * * * *"

permissions:
  contents: write

concurrency:
  group: football-v6479-total-margin-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile football-data/validation/v6_total_margin_forward_v6479.py
      - env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_margin_forward_v6479.py
      - name: Persist no-backfill forward state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            football-data/manifests/v6_total_margin_forward_v6479_freeze.json \
            football-data/forward/v6_total_margin_events_v6479.json \
            football-data/manifests/v6_total_margin_forward_v6479_status.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.47.9 total-margin forward state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
