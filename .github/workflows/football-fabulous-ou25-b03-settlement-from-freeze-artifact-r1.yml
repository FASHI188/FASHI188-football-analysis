name: Football fabul0us OU25 B03 settlement from freeze artifact R1

on:
  push:
    branches: [research/fabulous-ou25-b01-input-audit-r1]
    paths:
      - '.github/workflows/football-fabulous-ou25-b03-settlement-from-freeze-artifact-r1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football-fabulous-ou25-b03-settlement-from-freeze-artifact-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  immutable-freeze-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install settlement dependencies only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 pyarrow==21.0.0

      - name: Download immutable B03 freeze artifact and verify ZIP digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b03freeze /tmp/fab
          curl -sS -L --fail --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FASHI188/FASHI188-football-analysis/actions/artifacts/9277190607/zip' \
            -o /tmp/b03freeze.zip
          test "$(sha256sum /tmp/b03freeze.zip | awk '{print $1}')" = 'a330959d178802c3d9f9fdd405d90af13ab4e5bba41dcbfa3e2b3428d3c37436'
          unzip -q /tmp/b03freeze.zip -d /tmp/b03freeze
          find /tmp/b03freeze -maxdepth 3 -type f -print | sort

      - name: Restore and hard-verify all four frozen B03 locks before labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_input_audit_r1
          mkdir -p football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_market_direct_t_r1
          cp -a /tmp/b03freeze/fabulous_ou25_b03_input_audit_r1/. football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_input_audit_r1/
          cp -a /tmp/b03freeze/fabulous_ou25_b03_market_direct_t_r1/. football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_market_direct_t_r1/
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('football-data/research/anonymous_data_reserve_r1')
          inp=root/'fabulous_ou25_b03_input_audit_r1'
          frz=root/'fabulous_ou25_b03_market_direct_t_r1'
          manifest='9c82bdc7ea139021f0bef444a2b7cf9c55d9793704ff5d0eeaa3008737295cf9'
          packet='7c1437b3a20df9ecb9dc0422988558d2cda93c167113c552cd7e4c760bed0ffc'
          pred='f6dd9831ff0d70f6cd56e84a0d643f56422e67bb963fb1bb51b1d06308c50655'
          prereg='8bf9af77c4877a2dacc3403d413dc2723ba96183f0c33d012fb79f9916107c3a'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          s=json.loads((inp/'summary.json').read_text())
          assert s['status']=='ZERO_LABEL_COMPLETE'
          assert s['b03_n']==400 and s['b03_manifest_sha256_reconstructed']==manifest and s['b03_hash_match'] is True
          assert s['target_labels_accessed']==0 and s['target_outcome_columns_read']==[]
          assert sha(inp/'B03_pre_match_inputs_all_cutoffs.json')==packet
          assert sha(frz/'B03_frozen_predictions.csv')==pred
          assert sha(frz/'preregistration_and_prediction_lock.json')==prereg
          lock=json.loads((frz/'preregistration_and_prediction_lock.json').read_text())
          assert lock['status']=='PREDICTIONS_FROZEN_LABELS_UNOPENED'
          assert lock['target']['batch_id']=='FAB-OU25-PIT-B03'
          assert lock['target']['batch_manifest_sha256']==manifest and lock['target']['n']==400
          assert lock['target']['target_labels_accessed']==0
          assert lock['model']['selected_C']==0.1
          assert lock['model']['baseline_features']==['logit_pH','logit_pD','logit_pA']
          assert lock['model']['candidate_features']==['logit_pH','logit_pD','logit_pA','ou25_logit_over']
          assert lock['science_gate']['PASS']=='point delta < 0 AND calendar-date/bootstrap90 upper bound < 0'
          print('B03_IMMUTABLE_FREEZE_FOUR_LOCKS_VERIFIED_BEFORE_LABELS')
          PY

      - name: Download pinned fixture identity source without reading outcome columns locally
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/fixtures.parquet?download=true' \
            -o /tmp/fab/fixtures.parquet
          test "$(sha256sum /tmp/fab/fixtures.parquet | awk '{print $1}')" = '7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7'

      - name: One-shot open B03 labels through target-only 10-ID filters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          import pandas as pd
          import pyarrow.parquet as pq
          pred=pd.read_csv('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_market_direct_t_r1/B03_frozen_predictions.csv')
          ids=sorted(pred.fixture_id.astype(int).tolist())
          assert len(ids)==400 and len(set(ids))==400
          nonout=['id','date_utc','league_id','home_team_id','away_team_id','is_played']
          local=pq.read_table('/tmp/fab/fixtures.parquet',columns=nonout).to_pandas()
          local=local[local.id.isin(ids)].set_index('id')
          assert len(local)==400
          endpoint='https://datasets-server.huggingface.co/filter'; collected={}; successful_queries=0
          for start in range(0,400,10):
              chunk=ids[start:start+10]
              where=' OR '.join(f'"id"={i}' for i in chunk)
              params={'dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train','where':where,'offset':'0','length':'20'}
              url=endpoint+'?'+urllib.parse.urlencode(params)
              for attempt in range(1,7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'football-research-target-only-settlement/1.3'})
                      with urllib.request.urlopen(req,timeout=90) as r: x=json.load(r)
                      break
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as e:
                      print(f'B03_BATCH_RETRY start={start} attempt={attempt} error={e}',flush=True)
                      if attempt==6: raise
                      time.sleep(min(2**attempt,20))
              assert x.get('partial',False) is False
              rows=x.get('rows',[]); got={int(z['row']['id']) for z in rows}
              assert got==set(chunk),(start,len(rows),sorted(set(chunk)-got),sorted(got-set(chunk)))
              for z in rows:
                  row=z['row']; fid=int(row['id']); ref=local.loc[fid]
                  assert int(row['league_id'])==int(ref['league_id'])
                  assert int(row['home_team_id'])==int(ref['home_team_id'])
                  assert int(row['away_team_id'])==int(ref['away_team_id'])
                  assert bool(row['is_played'])==bool(ref['is_played'])
                  assert pd.to_datetime(row['date_utc'],utc=True)==pd.to_datetime(ref['date_utc'],utc=True)
                  collected[fid]={'fixture_id':fid,'goals_home':int(row['goals_home']),'goals_away':int(row['goals_away']),'is_played':bool(row['is_played'])}
              successful_queries+=1
              print(f'B03_BATCH_SUCCESS start={start} n={len(chunk)} cumulative={len(collected)}',flush=True)
              time.sleep(0.1)
          assert set(collected)==set(ids)
          canonical='\n'.join(map(str,ids))+'\n'
          receipt={'schema_version':'FAB-OU25-B03-TARGET-ONLY-LABEL-RECEIPT-R1','status':'B03_TARGET_ONLY_LABELS_OPENED','dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train','filter_endpoint':endpoint,'filter_query_count':successful_queries,'max_requested_ids_per_query':10,'requested_fixture_count':400,'returned_fixture_count':400,'requested_fixture_set_sha256':hashlib.sha256(canonical.encode()).hexdigest(),'non_target_rows_returned':0,'B04_fixture_ids_requested':0,'identity_match_to_pinned_fixture_source':True,'pinned_fixture_source_sha256':'7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7','labels':[collected[i] for i in ids]}
          p=Path('/tmp/fab/B03_labels_target_only.json'); p.write_text(json.dumps(receipt,ensure_ascii=False,separators=(',',':'))+'\n')
          print('B03_TARGET_ONLY_LABEL_RECEIPT_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          print('B03_LABELS_OPENED=400 NON_TARGET=0 B04_QUERIED=0',flush=True)
          PY

      - name: Settle the unchanged B03 preregistered science gate
        run: python football-data/validation/settle_fabulous_ou25_b03_market_direct_t_r1.py

      - name: Verify and print aggregate B03 settlement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_market_direct_t_settlement_r1/settlement_summary.json')
          x=json.loads(p.read_text())
          assert x['settlement_scope']['B03_labels_opened_in_this_run']==400
          assert x['settlement_scope']['B04_fixture_ids_requested']==0
          assert x['settlement_scope']['label_columns_materialized_for_non_B03_rows_in_this_run']==0
          assert x['governance']['B03_state_after_run']=='VIEWED'
          assert x['governance']['B04_state_after_run']=='UNOPENED_BY_TARGET_ONLY_QUERY'
          assert x['governance']['post_result_parameter_search_allowed_on_B03'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY

      - name: Upload aggregate B03 settlement only
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-ou25-b03-settlement-from-freeze-artifact-r1-${{ github.sha }}
          path: football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b03_market_direct_t_settlement_r1/settlement_summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm no tracked runtime mutation
        shell: bash
        run: |
          rm -rf football-data/validation/__pycache__
          git diff --exit-code
          git diff --cached --exit-code
