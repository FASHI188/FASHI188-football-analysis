name: football3 Historical Score Shape 2023 Confirmation V1

on:
  push:
    branches: ['football3/historical-expanded-pit-dev-v1']
    paths:
      - '.github/workflows/football3-historical-score-shape-2023-confirmation-v1.yml'
      - 'football-data/research/historical_score_shape_confirmation_2023_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_HEAD: 9cb97764de1250fd08c6d0880559192e66352ce3
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  CANDIDATE_HEAD: d69d26eec85aede15aaea8b8984889cfd857054a
  CANDIDATE_ARTIFACT_ID: '9962841264'
  CANDIDATE_ARTIFACT_DIGEST: sha256:14c1c64f0a0888c87a1fba5ca3e1c65d47b9f15272e6d5289487071f6c88fcfc
  FROZEN_PARAMS_SHA256: 150823927d56c82e8044d7a484ea61725a36c31ce8b6824cb589a11af39dd64e
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  confirm-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact lineage and frozen-path isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-expanded-pit-dev-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          changed="$(git diff --name-only "$BASE_HEAD...HEAD")"
          if printf '%s\n' "$changed" | grep -E 'CURRENT|production_pointer|formal_enablement|stage6_pre_b_deep_ppda|stage6_pre_b_prospective_governance|historical_fusion_v3_1_1_joint_score'; then
            echo 'forbidden frozen-path mutation' >&2
            exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/football3-historical-expanded-pit-dev-v1.yml|.github/workflows/football3-historical-direction-screen-v1.yml|.github/workflows/football3-historical-baseline-residual-v1.yml|.github/workflows/football3-historical-score-shape-candidate-v1.yml|.github/workflows/football3-historical-score-shape-2023-confirmation-v1.yml|football-data/research/historical_expanded_pit_v1/*|football-data/research/historical_direction_screen_v1/*|football-data/research/historical_baseline_residual_v1/*|football-data/research/historical_score_shape_candidate_v1/*|football-data/research/historical_score_shape_confirmation_2023_v1/*) ;;
              *) echo "unexpected changed path: $p" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural and one-shot contract guard
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_score_shape_confirmation_2023_v1
          python -m py_compile "$D/run_score_shape_2023_confirmation.py"
          python - <<'PY'
          import json
          c=json.load(open('football-data/research/historical_score_shape_confirmation_2023_v1/SCORE_SHAPE_2023_CONFIRMATION_CONTRACT.json'))
          assert c['status']=='FROZEN_BEFORE_ONE_SHOT_2023_LABEL_REVEAL'
          assert c['candidate']['name']=='importance_low2'
          assert c['candidate']['candidate_source_head']=='d69d26eec85aede15aaea8b8984889cfd857054a'
          assert c['candidate']['artifact_id']=='9962841264'
          assert c['candidate']['frozen_params_sha256']=='150823927d56c82e8044d7a484ea61725a36c31ce8b6824cb589a11af39dd64e'
          assert c['data_roles']['confirmation_labels'].startswith('2023 Big5 exactly 1752')
          assert c['data_roles']['prospective_1335'].startswith('FORBIDDEN')
          assert c['pit_rules']['candidate_parameters_never_refit_on_2023'] is True
          assert c['frozen_boundaries']['no_new_future_queue'] is True
          PY

      - name: Download exact frozen candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _candidate && mkdir _candidate
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          test "$got" = "$CANDIDATE_ARTIFACT_DIGEST"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" -o /tmp/candidate.zip
          test "sha256:$(sha256sum /tmp/candidate.zip | awk '{print $1}')" = "$CANDIDATE_ARTIFACT_DIGEST"
          unzip -tq /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d _candidate
          test -f _candidate/evidence/FROZEN_SCORE_SHAPE_PARAMS.json
          test "$(sha256sum _candidate/evidence/FROZEN_SCORE_SHAPE_PARAMS.json | awk '{print $1}')" = "$FROZEN_PARAMS_SHA256"
          python - <<'PY'
          import json
          f=json.load(open('_candidate/evidence/FROZEN_SCORE_SHAPE_PARAMS.json'))
          assert f['candidate']=='importance_low2'
          assert f['fitted_on_consumed_history_seasons']==[2020,2021,2022]
          assert f['fit_n']==5478
          assert f['historical_confirmation_2023_labels_opened'] is False
          assert f['prospective_1335_data_touched'] is False
          PY

      - name: Download and verify six frozen model inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            test "$got" = "$expected"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          test "$(sha256sum _inputs/v2/code/historical_xg_fusion_v2.py | awk '{print $1}')" = '1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          test "$(sha256sum _inputs/xg/code/historical_xg_challenger.py | awk '{print $1}')" = '588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          test "$(sha256sum _inputs/v1/pure_engine.py | awk '{print $1}')" = 'cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          test "$(sha256sum _inputs/old/understat_frozen.db | awk '{print $1}')" = 'f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          test "$(sha256sum _inputs/usr1/code/historical_fusion_v3_upset_safe.py | awk '{print $1}')" = '1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          test "$(sha256sum _inputs/v31/code/historical_fusion_v3_1.py | awk '{print $1}')" = '59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'

      - name: One-shot reveal and score 2023 historical confirmation
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_score_shape_confirmation_2023_v1
          rm -rf _run && mkdir _run
          python "$D/run_score_shape_2023_confirmation.py" \
            --contract "$D/SCORE_SHAPE_2023_CONFIRMATION_CONTRACT.json" \
            --frozen-params _candidate/evidence/FROZEN_SCORE_SHAPE_PARAMS.json \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py \
            --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py \
            --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --out _run 2>&1 | tee /tmp/confirmation_stdout.txt
          python - <<'PY'
          import json
          x=json.load(open('_run/score_shape_2023_confirmation_result.json'))
          assert x['status'] in {'HISTORICAL_SCORE_SHAPE_2023_CONFIRMATION_PASS_RESEARCH_ONLY','HISTORICAL_SCORE_SHAPE_2023_CONFIRMATION_REJECTED_NO_RESCUE'}
          assert x['confirmation_n']==1752
          assert x['candidate']=='importance_low2'
          assert x['candidate_params_sha256']=='150823927d56c82e8044d7a484ea61725a36c31ce8b6824cb589a11af39dd64e'
          assert x['historical_confirmation_2023_labels_opened'] is True
          assert x['prospective_1335_data_touched'] is False
          assert x['research_only'] is True and x['promotion_allowed'] is False
          assert x['formal_v2_unchanged'] is True and x['frozen_v3_1_1_unchanged'] is True and x['stage6_b_unchanged'] is True
          assert x['CURRENT_changed'] is False and x['production_pointer_changed'] is False and x['formal_enablement_changed'] is False
          assert x['new_future_queue_created'] is False
          PY

      - name: Seal one-shot evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{contract,code,evidence}
          D=football-data/research/historical_score_shape_confirmation_2023_v1
          cp "$D/SCORE_SHAPE_2023_CONFIRMATION_CONTRACT.json" _seal/contract/
          cp "$D/run_score_shape_2023_confirmation.py" _seal/code/
          cp _candidate/evidence/FROZEN_SCORE_SHAPE_PARAMS.json _seal/evidence/
          cp _run/score_shape_2023_confirmation_result.json /tmp/confirmation_stdout.txt _seal/evidence/
          cp _inputs/old/understat_freeze_receipt.json _inputs/old/understat_identity_manifest.json _seal/evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          x=json.load(open('_run/score_shape_2023_confirmation_result.json'))
          m={'schema_version':'football3-score-shape-2023-confirmation-artifact-v1','github_sha':os.environ['GITHUB_SHA'],'base_head':os.environ['BASE_HEAD'],'candidate_head':os.environ['CANDIDATE_HEAD'],'candidate_artifact_id':os.environ['CANDIDATE_ARTIFACT_ID'],'candidate_params_sha256':os.environ['FROZEN_PARAMS_SHA256'],'status':x['status'],'confirmation_n':x['confirmation_n'],'historical_confirmation_2023_labels_opened':True,'prospective_1335_data_touched':False,'files':files}
          (root/'MANIFEST.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload sealed 2023 confirmation evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-score-shape-2023-confirmation-${{ github.sha }}
          path: _seal
          if-no-files-found: error
          retention-days: 90
