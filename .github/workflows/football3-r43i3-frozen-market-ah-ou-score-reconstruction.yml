name: football3 R43I3 frozen market AH-OU score reconstruction

on:
  push:
    branches:
      - football3/r43i0-market-forward-settlement-20260828
    paths:
      - football-data/experiments/r43i3_frozen_market_ah_ou_score_reconstruction/**
      - .github/workflows/football3-r43i3-frozen-market-ah-ou-score-reconstruction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43i3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43i0-market-forward-settlement-20260828
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scipy
        run: python -m pip install --disable-pip-version-check scipy
      - name: Compile R43I3
        run: python -m py_compile football-data/experiments/r43i3_frozen_market_ah_ou_score_reconstruction/run_r43i3.py
      - name: Run R43I3 frozen AH-OU score reconstruction
        run: python football-data/experiments/r43i3_frozen_market_ah_ou_score_reconstruction/run_r43i3.py run
      - name: Verify R43I3 discovery contract
        run: python football-data/experiments/r43i3_frozen_market_ah_ou_score_reconstruction/run_r43i3.py verify
      - name: Persist R43I3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add football-data/experiments/r43i3_frozen_market_ah_ou_score_reconstruction/results/summary_r43i3_frozen_market_ah_ou_score_reconstruction.json
          if git diff --cached --quiet; then
            echo 'No evidence delta'
          else
            git commit -m '[r43i3] persist frozen AH-OU score reconstruction discovery'
            git push origin HEAD:football3/r43i0-market-forward-settlement-20260828
          fi
      - name: Upload R43I3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43i3-frozen-market-ah-ou-score-reconstruction
          path: football-data/experiments/r43i3_frozen_market_ah_ou_score_reconstruction/results/summary_r43i3_frozen_market_ah_ou_score_reconstruction.json
          if-no-files-found: error
          retention-days: 90
