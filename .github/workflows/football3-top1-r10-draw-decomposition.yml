name: football3 Top1 R10 draw decomposition

on:
  push:
    branches:
      - football3/top1-r10-draw-decomposition
    paths:
      - football-data/experiments/top1_r10_draw_decomp/run_experiment_r10.py
      - .github/workflows/football3-top1-r10-draw-decomposition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r10-draw-decomposition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R10 branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r10-draw-decomposition
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Rebuild and hash-verify exact R9b frozen snapshot
        run: python football-data/experiments/top1_r10_draw_decomp/run_experiment_r10.py freeze
      - name: Run K1 versus draw-decomposition J1
        run: python football-data/experiments/top1_r10_draw_decomp/run_experiment_r10.py run
      - name: Verify R10 strict-prior no-market contract
        run: python football-data/experiments/top1_r10_draw_decomp/run_experiment_r10.py verify
      - name: Persist R10 manifest and result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r10_draw_decomp/data/source_manifest_r10.json football-data/experiments/top1_r10_draw_decomp/results/summary_r10.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r10] freeze R9b snapshot link and draw decomposition result'
            git push origin HEAD:football3/top1-r10-draw-decomposition
          fi
      - name: Upload immutable R10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r10-draw-decomposition
          path: |
            football-data/experiments/top1_r10_draw_decomp/data/source_manifest_r10.json
            football-data/experiments/top1_r10_draw_decomp/results/summary_r10.json
          if-no-files-found: error
          retention-days: 30