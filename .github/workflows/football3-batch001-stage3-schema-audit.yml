name: football3 Batch-001 stage3 schema audit

on:
  push:
    branches:
      - football3/batch001-stage3-prior-structured-enrichment
    paths:
      - football-data/experiments/batch001_stage3_prior_structured_enrichment/audit_schema_stage3.py
      - .github/workflows/football3-batch001-stage3-schema-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage3-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch001-stage3-prior-structured-enrichment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Audit schemas only
        run: python football-data/experiments/batch001_stage3_prior_structured_enrichment/audit_schema_stage3.py
      - name: Persist schema audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch001_stage3_prior_structured_enrichment/results/schema_stage3.json
          git commit -m '[audit] football3 Batch-001 Stage3 schemas' || true
          git push origin HEAD:football3/batch001-stage3-prior-structured-enrichment
