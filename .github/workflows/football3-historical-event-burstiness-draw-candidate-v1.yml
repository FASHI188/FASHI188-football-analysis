name: football3 Historical Event Burstiness Draw Candidate V1

on:
  push:
    branches: ['football3/historical-event-burstiness-draw-candidate-v1']
    paths:
      - '.github/workflows/football3-historical-event-burstiness-draw-candidate-v1.yml'
      - 'football-data/research/historical_event_burstiness_draw_candidate_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ANCHOR_HEAD: 5821a9710f50205a162ae356aa4aa4ea041ac559
  PARENT_RESIDUAL_ARTIFACT_ID: '9964771947'
  PARENT_RESIDUAL_ARTIFACT_DIGEST: sha256:880cde7fb6b1857f59b01b9ec81dc6ae1dcdccdae073751b6039acb88d26487c
  B_HEAD: 9cb97764de1250fd08c6d0880559192e66352ce3
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  score-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact lineage and isolation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-event-burstiness-draw-candidate-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$ANCHOR_HEAD" HEAD)" = "$ANCHOR_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-event-temporal-process-residual-v1 | cut -f1)" = "$ANCHOR_HEAD"
          test "$(git ls-remote origin refs/heads/football3/stage6-pre-b-preshot-deep-ppda-v1 | cut -f1)" = "$B_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          changed="$(git diff --name-only "$ANCHOR_HEAD...HEAD")"
          if printf '%s\n' "$changed" | grep -E 'CURRENT|production_pointer|formal_enablement|stage6_pre_b_deep_ppda|stage6_pre_b_prospective|historical_fusion_v3_1_1_joint_score|historical_event_temporal_process_residual_v1'; then
            echo 'forbidden frozen-path mutation' >&2; exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/football3-historical-event-burstiness-draw-candidate-v1.yml|football-data/research/historical_event_burstiness_draw_candidate_v1/*) ;;
              *) echo "unexpected path: $p" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen contract and runner guard
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_event_burstiness_draw_candidate_v1
          python -m py_compile "$D/run_event_burstiness_draw_candidate.py"
          python - <<'PY'
          import json
          c=json.load(open('football-data/research/historical_event_burstiness_draw_candidate_v1/EVENT_BURSTINESS_DRAW_CANDIDATE_CONTRACT.json'))
          assert c['status']=='FROZEN_BEFORE_CANDIDATE_SCORING'
          assert c['parent_residual']['required_family']=='chance_burstiness'
          assert c['feature']['feature_missing_policy']=='EXACT_FALLBACK_FROZEN_STAGE6_B'
          assert c['candidate_transform']['no_hyperparameter_search'] is True
          assert c['candidate_transform']['no_threshold_search'] is True
          assert c['candidate_transform']['no_post_result_rescue'] is True
          assert c['authorization']['open_2023_labels_allowed'] is False
          assert c['authorization']['touch_prospective_1335_allowed'] is False
          assert c['development_gates']['season_top1_nondegrade_required']==2
          PY
      - name: Download and verify parent residual evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _parent && mkdir _parent
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_RESIDUAL_ARTIFACT_ID}")"
          got="$(printf '%s' "$meta" | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          test "$got" = "$PARENT_RESIDUAL_ARTIFACT_DIGEST"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_RESIDUAL_ARTIFACT_ID}/zip" -o /tmp/parent.zip
          test "sha256:$(sha256sum /tmp/parent.zip | awk '{print $1}')" = "$PARENT_RESIDUAL_ARTIFACT_DIGEST"
          unzip -tq /tmp/parent.zip; unzip -q /tmp/parent.zip -d _parent
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('_parent')
          m=json.load(open(root/'MANIFEST.json'))
          assert m['github_sha']=='5821a9710f50205a162ae356aa4aa4ea041ac559'
          assert m['candidate_eligible_families']==['chance_burstiness']
          assert m['historical_confirmation_2023_labels_opened'] is False
          assert m['prospective_1335_data_touched'] is False
          for p,sha in m['files'].items():
              assert hashlib.sha256((root/p).read_bytes()).hexdigest()==sha
          x=json.load(open(root/'evidence'/'event_temporal_process_residual.json'))
          assert x['classification']['chance_burstiness']=='ROBUST_DRAW_POST_B_RESIDUAL'
          PY
      - name: Download and verify six frozen model inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
            test "$got" = "$expected"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip"; unzip -q "$zip" -d "$dest"
          }
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
      - name: Score frozen candidate and final consumed-history parameter fit
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_event_burstiness_draw_candidate_v1
          rm -rf _run && mkdir _run
          python "$D/run_event_burstiness_draw_candidate.py" \
            --contract "$D/EVENT_BURSTINESS_DRAW_CANDIDATE_CONTRACT.json" \
            --parent-residual _parent/evidence/event_temporal_process_residual.json \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py \
            --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py \
            --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --out _run 2>&1 | tee /tmp/stdout.txt
          python - <<'PY'
          import json
          x=json.load(open('_run/event_burstiness_draw_candidate_result.json'))
          assert x['status'] in ('EVENT_BURSTINESS_DRAW_CANDIDATE_DEV_PASS','EVENT_BURSTINESS_DRAW_CANDIDATE_DEV_FAIL')
          assert x['development_scoring_seasons']==[2021,2022]
          assert x['development_scoring_n']==3652
          assert x['historical_confirmation_2023_labels_opened'] is False
          assert x['prospective_1335_data_touched'] is False
          assert x['formal_v2_changed'] is False and x['frozen_v3_1_1_changed'] is False and x['stage6_b_changed'] is False
          assert x['CURRENT_changed'] is False and x['production_pointer_changed'] is False and x['formal_enablement_changed'] is False
          assert x['promotion_allowed'] is False
          assert x['status']==('EVENT_BURSTINESS_DRAW_CANDIDATE_DEV_PASS' if all(x['gates'].values()) else 'EVENT_BURSTINESS_DRAW_CANDIDATE_DEV_FAIL')
          PY
      - name: Seal candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _seal && mkdir -p _seal/{contract,code,evidence,parent_identity}
          D=football-data/research/historical_event_burstiness_draw_candidate_v1
          cp "$D/EVENT_BURSTINESS_DRAW_CANDIDATE_CONTRACT.json" _seal/contract/
          cp "$D/run_event_burstiness_draw_candidate.py" _seal/code/
          cp _run/event_burstiness_draw_candidate_result.json _run/event_burstiness_draw_final_params.json /tmp/stdout.txt _seal/evidence/
          cp _parent/MANIFEST.json _seal/parent_identity/PARENT_RESIDUAL_MANIFEST.json
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('_seal')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          x=json.load(open('_run/event_burstiness_draw_candidate_result.json'))
          p=json.load(open('_run/event_burstiness_draw_final_params.json'))
          m={'schema_version':'football3-event-burstiness-draw-candidate-artifact-v1','github_sha':os.environ['GITHUB_SHA'],'anchor_head':os.environ['ANCHOR_HEAD'],'status':x['status'],'failed_gates':x['failed_gates'],'feature_active_share':x['feature_active_share'],'pooled_deltas':x['pooled']['deltas'],'exact_score_delta':x['exact_score']['delta'],'final_parameter_receipt':p,'historical_confirmation_2023_labels_opened':False,'prospective_1335_data_touched':False,'promotion_allowed':False,'files':files}
          (root/'MANIFEST.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload sealed candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-event-burstiness-draw-candidate-${{ github.sha }}
          path: _seal
          if-no-files-found: error
          retention-days: 90
