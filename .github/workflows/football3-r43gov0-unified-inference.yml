name: football3 R43GOV0 M4 unified inference governance

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/pipeline/unified_inference.py
      - football-data/pipeline/v500_baseline_adapter.py
      - football-data/tests/test_unified_inference_v500_compat.py
      - .github/workflows/football3-r43gov0-unified-inference.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-inference-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Compile M4 plumbing
        run: |
          python -m py_compile football-data/pipeline/unified_inference.py
          python -m py_compile football-data/pipeline/v500_baseline_adapter.py
          python -m py_compile football-data/tests/test_unified_inference_v500_compat.py
      - name: Run M1-M4 governance tests
        run: |
          python -m unittest discover -s football-data/tests -p 'test_team_identity.py' -v
          python -m unittest discover -s football-data/tests -p 'test_pit_feature_store.py' -v
          python -m unittest discover -s football-data/tests -p 'test_feature_assembler.py' -v
          python -m unittest discover -s football-data/tests -p 'test_unified_inference_v500_compat.py' -v
      - name: Write M4 gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m4_unified_inference_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m4-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "v500_blob_sha": "9c302506c49aa1847e60cd7896fc1a80f3b6b457",
            "shared_modes": ["dataset", "replay", "live"],
            "v500_matrix_boundary_preserved": true,
            "compatibility_sample": "NOR_Eliteserien:2024:2024-04-27:Rosenborg:Bodo/Glimt",
            "compatibility_sample_source": "already_consumed_R43AA0",
            "fresh_confirmatory_test_claim": false,
            "r43aa0_retuned": false,
            "probable_lineup_numeric_effect_enabled": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "score_components_enabled_beyond_v500": false,
            "next_step": "M5_extract_existing_R43Q_R_T_U_Y_components_without_enabling_them"
          }
          JSON
      - name: Upload M4 unified inference gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m4-unified-inference-gate
          path: football-data/governance/r43gov0/results/m4_unified_inference_gate.json
          if-no-files-found: error
          retention-days: 90
