name: Football3 NextGen Market PIT Preregistration

on:
  push:
    branches:
      - football3/nextgen-market-pit-prereg-v1
    paths:
      - 'governance/football3/nextgen_market_pit_prereg_contract_v1.json'
      - 'governance/football3/validate_nextgen_market_pit_prereg_v1.py'
      - 'governance/football3/test_validate_nextgen_market_pit_prereg_v1.py'
      - '.github/workflows/football3-nextgen-market-pit-prereg-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: football3-nextgen-market-pit-prereg-${{ github.sha }}
  cancel-in-progress: false

env:
  EXACT_BASE: '4227ce96b02e586e1ac40f4c709ca1c4c30d9649'
  FORMAL_HEAD: 'e12f5d1193be5d81f60301cf34ab2140e11712a9'
  FORMAL_V2_BLOB: 'a5ed26d5ffd4a2875cb9c658cfaa28665a8b7871'
  FORMAL_V2_TEST_BLOB: '61b25cd403fa1d9efa0dfcbc1643e0f17621944e'
  FORMAL_POINTER_BLOB: 'f07743f9c873d415fad9612f3225f64c64b10542'
  FORMAL_GATEWAY_ENTRY_BLOB: 'b41b0ede2db99c116b90270a32cd04dd240eb655'
  FORMAL_RECEIPT_DISTRIBUTION_BLOB: '2c5be3fa953cc9848f331cf8a2bb3600f93b420e'
  RETROSPECTIVE_REPLAY_BLOB: 'fda1b62c739ab86996370ae6db0bce69677156f9'
  CURRENT_SHA256: '71d54a6fd227ad2bbdddea9d0e42b88cea2022efef8faf26c7483cd99d5b8731'

jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact base integration HEAD and four-file scope
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXACT_BASE" HEAD)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/formal-gpt-runner-integration-v1 | cut -f1)" = "$EXACT_BASE"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/football3-nextgen-market-pit-prereg-v1.yml',
              'governance/football3/nextgen_market_pit_prereg_contract_v1.json',
              'governance/football3/validate_nextgen_market_pit_prereg_v1.py',
              'governance/football3/test_validate_nextgen_market_pit_prereg_v1.py',
          }
          got = set(subprocess.check_output(['git','diff','--name-only','4227ce96b02e586e1ac40f4c709ca1c4c30d9649...HEAD'], text=True).splitlines())
          assert got == expected, (sorted(got), sorted(expected))
          PY
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Prove formal V2 and formal entry surfaces are immutable
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "football-data/new_engine_v1/formal_fusion_v2.py:$FORMAL_V2_BLOB" \
            "football-data/new_engine_v1/test_formal_fusion_v2.py:$FORMAL_V2_TEST_BLOB" \
            "football-data/config/formal_model_pointer_historical_xg_fusion_v2.json:$FORMAL_POINTER_BLOB" \
            "football-data/formal_gpt_gateway_v1/entry.py:$FORMAL_GATEWAY_ENTRY_BLOB" \
            "football-data/formal_gpt_gateway_v1/formal_receipt_distribution_contract_v1.py:$FORMAL_RECEIPT_DISTRIBUTION_BLOB" \
            "football-data/formal_gpt_gateway_v1/current_v2_retrospective_replay_v1.py:$RETROSPECTIVE_REPLAY_BLOB"
          do
            path="${spec%%:*}"
            expected="${spec##*:}"
            test "$(git rev-parse "$EXACT_BASE:$path")" = "$expected"
            test "$(git hash-object "$path")" = "$expected"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Static contract and permanent tests
        shell: bash
        env:
          PYTHONPATH: governance/football3
        run: |
          set -euo pipefail
          python -m py_compile \
            governance/football3/validate_nextgen_market_pit_prereg_v1.py \
            governance/football3/test_validate_nextgen_market_pit_prereg_v1.py
          python governance/football3/validate_nextgen_market_pit_prereg_v1.py --repo-root . | tee /tmp/prereg-validator.txt
          python governance/football3/test_validate_nextgen_market_pit_prereg_v1.py 2>&1 | tee /tmp/prereg-tests.txt
          grep -q 'Ran 16 tests' /tmp/prereg-tests.txt
          grep -q '^OK$' /tmp/prereg-tests.txt

      - name: Existing formal V2 permanent regression
        shell: bash
        env:
          PYTHONPATH: football-data:football-data/research
        run: |
          set -euo pipefail
          python football-data/new_engine_v1/test_formal_fusion_v2.py 2>&1 | tee /tmp/formal-v2-tests.txt
          grep -q 'Ran 13 tests' /tmp/formal-v2-tests.txt
          grep -q '^OK$' /tmp/formal-v2-tests.txt

      - name: Seal exact-HEAD STOP_DATA_COVERAGE evidence
        id: names
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.identity.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          rm -rf _seal
          mkdir -p _seal/code _seal/contract _seal/evidence _seal/workflow
          cp governance/football3/validate_nextgen_market_pit_prereg_v1.py _seal/code/
          cp governance/football3/test_validate_nextgen_market_pit_prereg_v1.py _seal/code/
          cp governance/football3/nextgen_market_pit_prereg_contract_v1.json _seal/contract/
          cp .github/workflows/football3-nextgen-market-pit-prereg-v1.yml _seal/workflow/
          cp /tmp/prereg-validator.txt _seal/evidence/
          cp /tmp/prereg-tests.txt _seal/evidence/
          cp /tmp/formal-v2-tests.txt _seal/evidence/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('_seal')
          receipt = {
              'schema_version': 'football3-nextgen-market-pit-prereg-receipt-v1',
              'status': 'STOP_DATA_COVERAGE',
              'candidate_id': 'V3-C1-PIT-MARKET-TOTALS',
              'candidate_head': os.environ['CANDIDATE_SHA'],
              'canonical_exact_base': os.environ['EXACT_BASE'],
              'formal_model_head': os.environ['FORMAL_HEAD'],
              'current_sha256': os.environ['CURRENT_SHA256'],
              'research_only': True,
              'candidate_status': 'NOT_AVAILABLE',
              'weight': 0,
              'matrix_delta': 0,
              'new_target_labels_read': False,
              'training_performed': False,
              'tuning_performed': False,
              'provider_calls_performed': False,
              'paid_historical_credential_present_in_audited_repo_status': False,
              'acquired_market_rows': 0,
              'formal_v2_unchanged': True,
              'current_changed': False,
              'formal_pointer_changed': False,
              'formal_weights_changed': False,
              'production_changed': False,
              'selector_changed': False,
              'state_changed': False,
              'formal_route_changed': False,
              'formal_fallback_changed': False
          }
          (out / 'evidence' / 'candidate1_prereg_receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          files = {}
          for path in sorted(out.rglob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  files[path.relative_to(out).as_posix()] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          manifest = {
              'schema_version': 'football3-nextgen-market-pit-prereg-artifact-v1',
              'status': receipt['status'],
              'candidate_id': receipt['candidate_id'],
              'candidate_head': receipt['candidate_head'],
              'canonical_exact_base': receipt['canonical_exact_base'],
              'formal_model_head': receipt['formal_model_head'],
              'current_sha256': receipt['current_sha256'],
              'changed_file_count': 4,
              'files': files
          }
          (out / 'artifact_manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          PY
          artifact_name="football3-nextgen-market-pit-prereg-${CANDIDATE_SHA}-${GITHUB_RUN_ID}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload preregistration artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: _seal
          if-no-files-found: error
          retention-days: 30

  remote-readback:
    needs: validate-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.validate-and-seal.outputs.artifact_name }}
          path: _readback

      - name: Verify artifact digest internal HEAD and sealed STOP receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate-and-seal.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate-and-seal.outputs.artifact_digest }}
          CANDIDATE_SHA: ${{ needs.validate-and-seal.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          python - "$meta" "$ARTIFACT_DIGEST" <<'PY'
          import json, sys
          meta=json.loads(sys.argv[1]); expected=sys.argv[2]
          normalize=lambda x: x if x.startswith('sha256:') else 'sha256:'+x
          assert normalize(meta.get('digest')) == normalize(expected)
          assert meta.get('expired') is False
          PY
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('_readback')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          receipt=json.loads((root/'evidence'/'candidate1_prereg_receipt.json').read_text())
          assert manifest['status']=='STOP_DATA_COVERAGE'
          assert manifest['candidate_head']==os.environ['CANDIDATE_SHA']
          assert manifest['canonical_exact_base']==os.environ['EXACT_BASE']
          assert receipt['status']=='STOP_DATA_COVERAGE'
          assert receipt['candidate_status']=='NOT_AVAILABLE'
          assert receipt['weight']==0 and receipt['matrix_delta']==0
          assert receipt['new_target_labels_read'] is False
          assert receipt['training_performed'] is False and receipt['tuning_performed'] is False
          assert receipt['acquired_market_rows']==0
          expected_files=set(manifest['files'])
          actual_files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name!='artifact_manifest.json'}
          assert actual_files==expected_files
          for rel, meta in manifest['files'].items():
              data=(root/rel).read_bytes()
              assert hashlib.sha256(data).hexdigest()==meta['sha256'], rel
              assert len(data)==meta['bytes'], rel
          print('NEXTGEN_MARKET_PIT_PREREG_REMOTE_READBACK_PASS')
          PY
