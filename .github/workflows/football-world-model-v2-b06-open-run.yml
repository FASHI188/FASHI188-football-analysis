name: Football World Model V2 B06 Open Run

on:
  pull_request:
    paths:
      - "football-data/research/world_model_v2/b06_open_run_contract.json"
      - "football-data/validation/evaluate_world_model_v2_b06.py"
      - ".github/workflows/football-world-model-v2-b06-open-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install frozen runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.2

      - name: Verify frozen B06 open-run contract before target access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('football-data/research/world_model_v2/b06_open_run_contract.json').read_text())
          assert c['status']=='FROZEN_BEFORE_B06_TARGET_ACCESS'
          assert c['package']['selected_rows']==400
          assert c['package']['authoritative_identity_blob_sha']=='a6d5d8dc02e5a7d484ca68a6c8990c086374e981'
          assert c['model_transport']['reuse_parent_v2_model_code'] is True
          assert c['model_transport']['hyperparameter_search'] is False
          assert c['split_and_leakage']['chronological_burn_in_fraction']==0.45
          assert c['split_and_leakage']['folds']==3
          assert c['split_and_leakage']['same_date_predict_all_before_update'] is True
          assert c['hard_boundary']['b05_opened'] is False
          assert c['hard_boundary']['laliga_reserved_confirmation_opened'] is False
          print('B06 open-run contract verified')
          PY

      - name: Compile frozen evaluator
        run: |
          python -m py_compile \
            football-data/research/world_model_v2/wmv2_source.py \
            football-data/research/world_model_v2/wmv2_model.py \
            football-data/validation/evaluate_world_model_v2.py \
            football-data/validation/evaluate_world_model_v2_b06.py

      - name: Open B06 targets and evaluate once
        run: |
          mkdir -p /tmp/wmv2-b06-run
          python football-data/validation/evaluate_world_model_v2_b06.py \
            --output /tmp/wmv2-b06-run/result.json \
            | tee /tmp/wmv2-b06-run/stdout.log

      - name: Verify research boundary and terminal verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/wmv2-b06-run/result.json').read_text())
          assert r['status'] in {'RESEARCH_SIGNAL_PASS_RETROSPECTIVE_ONLY','FAIL_RESEARCH_ONLY','STOP_DATA_COVERAGE'}
          b=r['boundary']
          assert b['formal_weight']==0
          assert b['b05_opened'] is False
          assert b['reserved_confirmation_panel_opened'] is False
          assert b['automatic_confirmation'] is False
          assert b['automatic_promotion'] is False
          assert b['new_protected_labels_opened']==400
          assert r['b06']['identity_rows']==400
          assert r['b06']['unselected_match_metadata_structured_parse'] is False
          if r['status']!='STOP_DATA_COVERAGE':
              assert len(r['development_gate']['checks'])==5
              assert r['split']['test_matches']>=100
              assert min(r['split']['fold_counts'].values())>=30
          print(json.dumps({'status':r['status'],'gate':r.get('development_gate'),'split':r.get('split')},indent=2))
          PY

      - name: Upload frozen B06 scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: world-model-v2-b06-run-${{ github.sha }}
          path: /tmp/wmv2-b06-run/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm no repository writeback
        run: git diff --exit-code && test -z "$(git status --porcelain)"
