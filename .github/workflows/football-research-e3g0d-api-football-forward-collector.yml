name: Football Research E3g-0D API-Football Forward Collector
on:
  pull_request:
    branches: [research/e3g0c-zero-cost-budget-forward-design]
    types: [opened, synchronize, reopened]
    paths: [football-data/research/e3g0d_*.py, football-data/research/contracts/e3g0d_api_football_forward_collection_contract.md, .github/workflows/football-research-e3g0d-api-football-forward-collector.yml]
  workflow_dispatch:
    inputs:
      collector_mode: {required: true, default: preflight, type: choice, options: [self-test, preflight, status-check, build-plan, odds, injuries, lineup-window]}
      target_date: {required: false, type: string}
      league_id: {required: true, default: '39', type: string}
      season_id: {required: true, default: '2026', type: string}
      fixture_limit: {required: true, default: '1', type: string}
      max_requests: {required: true, default: '3', type: string}
      plan_artifact_id: {required: false, type: string}
      plan_sha256: {required: false, type: string}
      dry_run: {required: true, default: true, type: boolean}
      no_network: {required: true, default: true, type: boolean}
      upload_artifact: {required: true, default: false, type: boolean}
      allow_schedule: {required: true, default: false, type: boolean}
  schedule:
    - cron: '5 0 * * *'
    - cron: '10 */3 * * *'
    - cron: '20 */4 * * *'
    - cron: '*/15 10-22 * * *'
permissions:
  contents: read
env:
  ROOT: football-data/research
  COLLECTOR: football-data/research/e3g0d_api_football_forward_collector.py
  ARCHIVE: football-data/research/e3g0d_api_football_archive_helper.py
  CONTRACT: football-data/research/contracts/e3g0d_api_football_forward_collection_contract.md
  BASE_SHA: 9376cbb2c6af6945a4a1be709b606d928c28a826
  API_FOOTBALL_COLLECTOR_ENABLED: ${{ vars.API_FOOTBALL_COLLECTOR_ENABLED || 'false' }}
  API_FOOTBALL_SCHEDULE_ENABLED: ${{ vars.API_FOOTBALL_SCHEDULE_ENABLED || 'false' }}

jobs:
  validate-implementation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR HEAD
        env: {EXPECTED_HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: No-key and no-provider-network validation
        run: |
          set -euo pipefail
          unset API_FOOTBALL_KEY GH_TOKEN
          python -m py_compile "$ROOT"/e3g0d_*.py
          for x in 'formal_weight: `0`' IMPLEMENTED_NOT_LIVE GPT_REMEDIATED_PENDING_CODEX_RECHECK pre-request-reservation 'full commit SHA' 'plan-index Artifact' 'Artifact digest is mandatory' 'no credentialed API call' 'do not start E3g-1'; do grep -Fq "$x" "$CONTRACT"; done
          python "$COLLECTOR" --mode self-test --output-dir "$RUNNER_TEMP/v/c" --print-summary
          python "$ARCHIVE" self-test --archive-root "$RUNNER_TEMP/v/a" --print-summary
          python "$COLLECTOR" --mode preflight --output-dir "$RUNNER_TEMP/v/p" --date 2026-08-15 --league 39 --season 2026 --fixture-limit 1 --max-requests 3 --dry-run true --no-network true --upload-artifact false --allow-schedule false --retention 30 --print-summary
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'v'
          c=json.loads((r/'c/self_test_result.json').read_text());a=json.loads((r/'a/archive_helper_self_test.json').read_text());p=json.loads(next((r/'p/run_receipts').glob('*.json')).read_text())
          ck=['different_target_dates_share_same_request_day_quota','target_date_cannot_bypass_daily_cap','failed_run_quota_receipt_written','retry_attempts_counted','failed_collector_job_remains_failed','secret_redaction_on_failure','selected_plan_index_required','snapshot_records_selected_plan_identity','append_only','online_final_freeze_prohibited']
          ak=['artifact_pagination_all_pages','quota_reservations_beyond_first_page_counted','durable_quota_reservation_precedes_provider','quota_upload_failure_cannot_undercount','artifact_digest_required','plan_index_binding_enforced','plan_index_missing_fails_closed','pagination_failure_is_fail_closed','plan_sha_verified_before_collection','plan_source_raw_sha_chain_verified','retention_metadata_matches_workflow','archive_interval_compatible_with_retention']
          assert c['self_test']==a['self_test']=='PASS' and all(c[k]=='PASS' for k in ck) and all(a[k]=='PASS' for k in ak)
          assert c['no_provider_network'] and not a['network_used'] and c['formal_weight']==c['model_fits']==c['candidate_probabilities']==0
          assert p['deployment_status']=='IMPLEMENTED_NOT_LIVE' and p['request_attempts']==0 and not p['guard']['network_requested']
          w=Path('.github/workflows/football-research-e3g0d-api-football-forward-collector.yml').read_text()
          refs=re.findall(r'^\s*- uses:\s*(actions/[^@\s]+)@([^\s]+)',w,re.M);assert refs and all(re.fullmatch(r'[0-9a-f]{40}',x) for _,x in refs)
          assert len(re.findall(r'^\s*persist-credentials:\s*false',w,re.M))==2 and w.count('secrets.API_FOOTBALL_'+'KEY')==1
          blocks=[];lines=w.splitlines();i=0
          while i<len(lines):
           m=re.match(r'^(\s*)run:\s*\|\s*$',lines[i])
           if not m:i+=1;continue
           n=len(m.group(1));i+=1;b=[]
           while i<len(lines) and (not lines[i].strip() or len(lines[i])-len(lines[i].lstrip())>n):b.append(lines[i]);i+=1
           blocks.append('\n'.join(b))
          text='\n'.join(blocks);assert text.count('$'+'{{ inputs.')==0 and text.count('$'+'{{ steps.')==0
          live=w.rsplit('  collect-forward-snapshots:',1)[1];assert live.index('id: reservation_upload')<live.index('id: collector') and "steps.reservation_upload.outcome == 'success'" in live
          helper=Path('football-data/research/e3g0d_api_football_archive_helper.py').read_text();assert 'group: e3g0d-api-football-live-main' in live and 'selected_plan_identity.json' in live and 'plan_artifact_digest' in helper and 'plan_index_artifact_digest' in helper
          assert not re.search(r'retention-days:\s*2',w) and len(re.findall(r'retention-days:\s*30',w))>=6
          print(json.dumps({'direct_inputs_in_run':0,'direct_step_outputs_in_run':0,'mutable_action_refs':0},sort_keys=True))
          PY
          ! grep -R 'SECRET_SHOULD_NEVER_APPEAR' "$RUNNER_TEMP/v"
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"; test "$(printf '%s\n' "$files"|sed '/^$/d'|wc -l)" -eq 9
          for f in e3g0d_common.py e3g0d_http.py e3g0d_store.py e3g0d_collect.py e3g0d_archive_core.py e3g0d_api_football_forward_collector.py e3g0d_api_football_archive_helper.py; do printf '%s\n' "$files"|grep -Fxq "football-data/research/$f"; done
          printf '%s\n' "$files"|grep -Fxq "$CONTRACT"; printf '%s\n' "$files"|grep -Fxq '.github/workflows/football-research-e3g0d-api-football-forward-collector.yml'
          ! printf '%s\n' "$files"|grep -E '(^|/)(models?|data/formal|config|CURRENT|score|btts|total.?goal)'
      - name: Write validation metadata
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          n=datetime.now(timezone.utc);(Path(os.environ['RUNNER_TEMP'])/'v/artifact_metadata.json').write_text(json.dumps({'artifact_name':f"football-e3g0d-validation-{os.environ['GITHUB_SHA']}",'retention_days':30,'created_at_utc':n.isoformat(),'expires_at_utc':(n+timedelta(days=30)).isoformat(),'deployment_status':'IMPLEMENTED_NOT_LIVE','remediation_status':'GPT_REMEDIATED_PENDING_CODEX_RECHECK','real_api_calls':0,'formal_weight':0},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'football-e3g0d-validation-${{ github.event.pull_request.head.sha }}', path: '${{ runner.temp }}/v', retention-days: 30, if-no-files-found: error}

  collect-forward-snapshots:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.API_FOOTBALL_COLLECTOR_ENABLED == 'true' && vars.API_FOOTBALL_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: read, actions: read}
    concurrency:
      group: e3g0d-api-football-live-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Resolve controls
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CRON: ${{ github.event.schedule }}
          I_MODE: ${{ inputs.collector_mode }}
          I_TARGET: ${{ inputs.target_date }}
          I_LEAGUE: ${{ inputs.league_id }}
          I_SEASON: ${{ inputs.season_id }}
          I_LIMIT: ${{ inputs.fixture_limit }}
          I_MAX: ${{ inputs.max_requests }}
          I_PLAN_ID: ${{ inputs.plan_artifact_id }}
          I_PLAN_SHA: ${{ inputs.plan_sha256 }}
          I_DRY: ${{ inputs.dry_run }}
          I_NET: ${{ inputs.no_network }}
          I_UPLOAD: ${{ inputs.upload_artifact }}
          I_ALLOW: ${{ inputs.allow_schedule }}
        run: |
          python - <<'PY'
          import datetime,os,re
          def v(name,pat,empty=False):
           x=str(os.getenv(name,'') or '')
           if any(c in x for c in '\r\n\0') or (x and not re.fullmatch(pat,x)) or (not x and not empty):raise SystemExit('invalid '+name)
           return x
          event=v('EVENT',r'workflow_dispatch|schedule');day=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          if event=='workflow_dispatch':
           mode=v('I_MODE',r'[a-z-]+');target=v('I_TARGET',r'\d{4}-\d{2}-\d{2}',True) or day;datetime.date.fromisoformat(target)
           league=v('I_LEAGUE',r'\d{1,6}');season=v('I_SEASON',r'\d{4}');limit=v('I_LIMIT',r'\d{1,2}');maximum=v('I_MAX',r'\d{1,2}');pid=v('I_PLAN_ID',r'\d+',True);psha=v('I_PLAN_SHA',r'[0-9a-fA-F]{64}',True).lower();dry=v('I_DRY',r'true|false');net=v('I_NET',r'true|false');upload=v('I_UPLOAD',r'true|false');allow=v('I_ALLOW',r'true|false')
          else:
           mode,limit,maximum={'5 0 * * *':('build-plan','10','1'),'10 */3 * * *':('odds','10','2'),'20 */4 * * *':('injuries','10','2'),'*/15 10-22 * * *':('lineup-window','10','6')}[v('CRON',r'[0-9*/ ,\-]+')];target,league,season,pid,psha,dry,net,upload,allow=day,'39','2026','','','false','false','true','true'
          live=mode in {'build-plan','odds','injuries','lineup-window'}
          if event=='workflow_dispatch' and live and (int(limit)>1 or int(maximum)>3):raise SystemExit('trial envelope exceeded')
          ok=live and v('REF',r'refs/heads/[A-Za-z0-9._/-]+')=='refs/heads/main' and os.getenv('API_FOOTBALL_COLLECTOR_ENABLED')=='true' and dry=='false' and net=='false' and upload=='true' and (event=='workflow_dispatch' or (os.getenv('API_FOOTBALL_SCHEDULE_ENABLED')=='true' and allow=='true'))
          exp=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(days=30)).replace(microsecond=0).isoformat().replace('+00:00','Z')
          out={'request_day':day,'mode':mode,'target':target,'league':league,'season':season,'limit':limit,'max':maximum,'plan_id':pid,'plan_sha':psha,'upload':upload,'allow':allow,'ok':str(ok).lower(),'expires':exp}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
           for k,x in out.items():f.write(f'{k}={x}\n')
          PY
      - name: No-network preflight
        if: steps.c.outputs.ok != 'true' && steps.c.outputs.mode != 'status-check'
        env: {TARGET: '${{ steps.c.outputs.target }}', LEAGUE: '${{ steps.c.outputs.league }}', SEASON: '${{ steps.c.outputs.season }}', LIMIT: '${{ steps.c.outputs.limit }}', MAX: '${{ steps.c.outputs.max }}', EXPIRES: '${{ steps.c.outputs.expires }}'}
        run: python "$COLLECTOR" --mode preflight --output-dir "$RUNNER_TEMP/out" --date "$TARGET" --league "$LEAGUE" --season "$SEASON" --fixture-limit "$LIMIT" --max-requests "$MAX" --dry-run true --no-network true --upload-artifact false --allow-schedule false --retention 30 --expires "$EXPIRES" --print-summary
      - name: Read-only status
        if: steps.c.outputs.mode == 'status-check'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python "$ARCHIVE" status --repository "$GITHUB_REPOSITORY" --archive-root "$RUNNER_TEMP/out" --print-summary
      - name: Read reservation ledger
        if: steps.c.outputs.ok == 'true'
        id: q
        env: {GH_TOKEN: '${{ github.token }}', DAY: '${{ steps.c.outputs.request_day }}'}
        run: |
          python "$ARCHIVE" quota-used --repository "$GITHUB_REPOSITORY" --archive-root "$RUNNER_TEMP/q" --request-day-utc "$DAY" --print-summary > "$RUNNER_TEMP/q.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          n=int(json.loads((Path(os.environ['RUNNER_TEMP'])/'q.json').read_text())['requests_used_today']);assert 0<=n<=90
          open(os.environ['GITHUB_OUTPUT'],'a').write(f'used={n}\n')
          PY
      - name: Resolve plan and index
        if: steps.c.outputs.ok == 'true' && steps.c.outputs.mode != 'build-plan'
        env: {GH_TOKEN: '${{ github.token }}', TARGET: '${{ steps.c.outputs.target }}', LEAGUE: '${{ steps.c.outputs.league }}', SEASON: '${{ steps.c.outputs.season }}', PID: '${{ steps.c.outputs.plan_id }}', PSHA: '${{ steps.c.outputs.plan_sha }}'}
        run: |
          a=(resolve-plan --repository "$GITHUB_REPOSITORY" --archive-root "$RUNNER_TEMP/plan" --target-date-utc "$TARGET" --league "$LEAGUE" --season "$SEASON" --print-summary); [[ -z "$PID" ]]||a+=(--artifact-id "$PID"); [[ -z "$PSHA" ]]||a+=(--plan-sha256 "$PSHA"); python "$ARCHIVE" "${a[@]}" > "$RUNNER_TEMP/selected-plan.json"; test -s "$RUNNER_TEMP/plan/selected_plan_identity.json"
      - name: Prepare quota reservation
        id: reservation
        if: steps.c.outputs.ok == 'true'
        env: {DAY: '${{ steps.c.outputs.request_day }}', TARGET: '${{ steps.c.outputs.target }}', MAX: '${{ steps.c.outputs.max }}', USED: '${{ steps.q.outputs.used }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/reservation"; python - <<'PY'
          import json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          n=int(os.environ['MAX']);used=int(os.environ['USED']);assert 1<=n<=20 and used+n<=90;now=datetime.now(timezone.utc)
          v={'schema_version':'E3G0D-QUOTA-RESERVATION-1.0','deployment_status':'IMPLEMENTED_NOT_LIVE','request_day_utc':os.environ['DAY'],'target_date_utc':os.environ['TARGET'],'reservation_id':f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}",'reserved_attempts':n,'requests_used_before_reservation':used,'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'run_head':os.environ['GITHUB_SHA'],'created_at_utc':now.isoformat(),'retention_days':30,'expires_at_utc':(now+timedelta(days=30)).isoformat(),'append_only':True,'formal_weight':0}
          (Path(os.environ['RUNNER_TEMP'])/'reservation/quota_reservation.json').write_text(json.dumps(v,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: reservation_upload
        if: steps.c.outputs.ok == 'true' && steps.reservation.outcome == 'success'
        with: {name: 'football-e3g0d-quota-reservation-${{ steps.c.outputs.request_day }}-${{ github.run_id }}-${{ github.run_attempt }}', path: '${{ runner.temp }}/reservation', retention-days: 30, if-no-files-found: error}
      - name: Credentialed collector
        id: collector
        if: steps.c.outputs.ok == 'true' && steps.reservation_upload.outcome == 'success'
        continue-on-error: true
        env: {API_FOOTBALL_KEY: '${{ secrets.API_FOOTBALL_KEY }}', MODE: '${{ steps.c.outputs.mode }}', TARGET: '${{ steps.c.outputs.target }}', LEAGUE: '${{ steps.c.outputs.league }}', SEASON: '${{ steps.c.outputs.season }}', LIMIT: '${{ steps.c.outputs.limit }}', MAX: '${{ steps.c.outputs.max }}', USED: '${{ steps.q.outputs.used }}', EXPIRES: '${{ steps.c.outputs.expires }}', DAY: '${{ steps.c.outputs.request_day }}'}
        run: |
          set +e; a=(--mode "$MODE" --output-dir "$RUNNER_TEMP/out" --date "$TARGET" --league "$LEAGUE" --season "$SEASON" --fixture-limit "$LIMIT" --max-requests "$MAX" --requests-used-today "$USED" --timeout 15 --retries 1 --backoff 8 --dry-run false --no-network false --upload-artifact true --allow-schedule true --retention 30 --expires "$EXPIRES" --expected-request-day-utc "$DAY" --print-summary); [[ "$MODE" == build-plan ]]||a+=(--selected-plan-identity "$RUNNER_TEMP/plan/selected_plan_identity.json"); python "$COLLECTOR" "${a[@]}"; code=$?; r="$(find "$RUNNER_TEMP/out/run_receipts" -name '*.json' -type f|head -1)"; echo "receipt=$r" >> "$GITHUB_OUTPUT"; RECEIPT="$r" python - <<'PY'
          import json,os
          v=json.load(open(os.environ['RECEIPT']));f=open(os.environ['GITHUB_OUTPUT'],'a')
          for k in ('plan_sha256','request_day_utc'):f.write(f"{k}={v.get(k) or ''}\n")
          PY
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: plan_upload
        if: steps.collector.outcome == 'success' && steps.c.outputs.mode == 'build-plan'
        continue-on-error: true
        with: {name: 'football-e3g0d-plan-${{ steps.c.outputs.target }}-league-${{ steps.c.outputs.league }}-season-${{ steps.c.outputs.season }}-sha256-${{ steps.collector.outputs.plan_sha256 }}', path: '${{ runner.temp }}/out', retention-days: 30, if-no-files-found: error}
      - name: Build plan-index binding
        id: plan_index
        if: steps.plan_upload.outcome == 'success'
        continue-on-error: true
        env: {RECEIPT: '${{ steps.collector.outputs.receipt }}', AID: '${{ steps.plan_upload.outputs.artifact-id }}', ADIGEST: '${{ steps.plan_upload.outputs.artifact-digest }}', ANAME: 'football-e3g0d-plan-${{ steps.c.outputs.target }}-league-${{ steps.c.outputs.league }}-season-${{ steps.c.outputs.season }}-sha256-${{ steps.collector.outputs.plan_sha256 }}', PSHA: '${{ steps.collector.outputs.plan_sha256 }}', DAY: '${{ steps.c.outputs.request_day }}', TARGET: '${{ steps.c.outputs.target }}', LEAGUE: '${{ steps.c.outputs.league }}', SEASON: '${{ steps.c.outputs.season }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/index"; python - <<'PY'
          import json,os,re
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',os.environ['ADIGEST']);assert re.fullmatch(r'[0-9a-f]{64}',os.environ['PSHA']);r=json.load(open(os.environ['RECEIPT']));src=(r.get('snapshots') or [{}])[0].get('sha256');assert re.fullmatch(r'[0-9a-f]{64}',str(src or ''));now=datetime.now(timezone.utc)
          v={'schema_version':'E3G0D-PLAN-INDEX-1.1','plan_artifact_id':int(os.environ['AID']),'plan_artifact_name':os.environ['ANAME'],'plan_artifact_digest':os.environ['ADIGEST'],'plan_sha256':os.environ['PSHA'],'source_raw_response_sha256':src,'workflow_run_id':os.environ['GITHUB_RUN_ID'],'run_head':os.environ['GITHUB_SHA'],'request_day_utc':os.environ['DAY'],'target_date_utc':os.environ['TARGET'],'competition_id':int(os.environ['LEAGUE']),'season_id':int(os.environ['SEASON']),'created_at_utc':now.isoformat(),'retention_days':30,'expires_at_utc':(now+timedelta(days=30)).isoformat(),'append_only':True,'formal_weight':0};(Path(os.environ['RUNNER_TEMP'])/'index/plan_index_receipt.json').write_text(json.dumps(v,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: plan_index_upload
        if: steps.plan_index.outcome == 'success'
        continue-on-error: true
        with: {name: 'football-e3g0d-plan-index-${{ steps.plan_upload.outputs.artifact-id }}-${{ github.run_id }}', path: '${{ runner.temp }}/index', retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: snapshot_upload
        if: steps.collector.outcome == 'success' && steps.c.outputs.mode != 'build-plan'
        continue-on-error: true
        with: {name: 'football-e3g0d-${{ steps.c.outputs.mode }}-${{ steps.c.outputs.target }}-${{ github.run_id }}', path: '${{ runner.temp }}/out', retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.c.outputs.ok != 'true' && steps.c.outputs.mode != 'status-check'
        with: {name: 'football-e3g0d-no-network-${{ github.run_id }}', path: '${{ runner.temp }}/out', retention-days: 30, if-no-files-found: error}
      - name: Preserve failure
        if: always() && steps.c.outputs.ok == 'true'
        env: {MODE: '${{ steps.c.outputs.mode }}', COLLECTOR: '${{ steps.collector.outcome }}', RESERVATION: '${{ steps.reservation_upload.outcome }}', PLAN: '${{ steps.plan_upload.outcome }}', INDEX: '${{ steps.plan_index_upload.outcome }}', SNAPSHOT: '${{ steps.snapshot_upload.outcome }}'}
        run: |
          [[ "$RESERVATION" == success && "$COLLECTOR" == success ]]||exit 2
          [[ "$MODE" != build-plan || ( "$PLAN" == success && "$INDEX" == success ) ]]||exit 2
          [[ "$MODE" == build-plan || "$SNAPSHOT" == success ]]||exit 2
