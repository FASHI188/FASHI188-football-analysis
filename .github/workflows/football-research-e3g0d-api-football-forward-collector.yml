name: Football Research E3g-0D API-Football Forward Collector
on:
  pull_request: {branches: [research/e3g0c-zero-cost-budget-forward-design], types: [opened, synchronize, reopened], paths: ['football-data/research/e3g0d_*.py', 'football-data/research/contracts/e3g0d_api_football_forward_collection_contract.md', '.github/workflows/football-research-e3g0d-api-football-forward-collector.yml']}
  workflow_dispatch:
    inputs:
      collector_mode: {required: true, default: preflight, type: choice, options: [self-test, preflight, status-check, build-plan, odds, injuries, lineup-window]}
      target_date: {required: false, type: string}
      league_id: {required: true, default: '39', type: string}
      season_id: {required: true, default: '2026', type: string}
      fixture_limit: {required: true, default: '1', type: string}
      max_requests: {required: true, default: '3', type: string}
      plan_artifact_id: {required: false, type: string}
      plan_sha256: {required: false, type: string}
      dry_run: {required: true, default: true, type: boolean}
      no_network: {required: true, default: true, type: boolean}
      upload_artifact: {required: true, default: false, type: boolean}
      allow_schedule: {required: true, default: false, type: boolean}
  schedule: [{cron: '5 0 * * *'}, {cron: '10 */3 * * *'}, {cron: '20 */4 * * *'}, {cron: '*/15 10-22 * * *'}]
permissions: {contents: read}
env:
  ROOT: football-data/research
  COLLECTOR: football-data/research/e3g0d_api_football_forward_collector.py
  ARCHIVE: football-data/research/e3g0d_api_football_archive_helper_secure.py
  RUNTIME: football-data/research/e3g0d_runtime.py
  RUNTIME_TESTS: football-data/research/e3g0d_runtime_tests.py
  JOB: football-data/research/e3g0d_workflow_job.py
  WORKFLOW_FILE: .github/workflows/football-research-e3g0d-api-football-forward-collector.yml
  BASE_SHA: 9376cbb2c6af6945a4a1be709b606d928c28a826
  EVIDENCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  API_FOOTBALL_COLLECTOR_ENABLED: ${{ vars.API_FOOTBALL_COLLECTOR_ENABLED || 'false' }}
  API_FOOTBALL_SCHEDULE_ENABLED: ${{ vars.API_FOOTBALL_SCHEDULE_ENABLED || 'false' }}
jobs:
  validate-implementation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Exact-head no-key validation
        env: {EXPECTED_HEAD: '${{ env.EVIDENCE_HEAD }}', EVENT_SHA: '${{ github.sha }}'}
        run: |
          set -euo pipefail; test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"; unset API_FOOTBALL_KEY GH_TOKEN; mkdir -p "$RUNNER_TEMP/v"
          python -m py_compile "$ROOT"/e3g0d_*.py
          python "$COLLECTOR" --mode self-test --output-dir "$RUNNER_TEMP/v/c"
          python "$ARCHIVE" self-test --archive-root "$RUNNER_TEMP/v/a"
          python "$RUNTIME_TESTS" --workflow "$WORKFLOW_FILE" --output "$RUNNER_TEMP/v/runtime_security_validation.json"
          python "$COLLECTOR" --mode preflight --output-dir "$RUNNER_TEMP/v/p" --date 2026-08-15 --league 39 --season 2026 --fixture-limit 1 --max-requests 3 --dry-run true --no-network true --upload-artifact false --allow-schedule false --retention 30 --run-head "$EXPECTED_HEAD" --run-id "$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'v'; c=json.loads((r/'c/self_test_result.json').read_text()); a=json.loads((r/'a/archive_helper_self_test.json').read_text()); t=json.loads((r/'runtime_security_validation.json').read_text()); p=json.loads(next((r/'p/run_receipts').glob('*.json')).read_text()); h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert h==os.environ['EXPECTED_HEAD']==p['run_head'] and p['request_attempts']==0; assert c['self_test']==a['self_test']==t['self_test']=='PASS' and c['no_provider_network'] and not a['network_used']; assert all(all(v=='PASS' for v in t[k].values()) for k in ('digest_format_tests','artifact_redirect_tests','malicious_input_tests','quota_fault_tests','production_quota_ledger_tests')); assert t['workflow_uses_tested_production_functions']==t['production_quota_ledger_binding']=='PASS' and t['real_provider_request_attempts']==t['formal_weight']==0
          lineup=t['lineup_no_due_prepare_integration']; assert lineup['due_check_calls']==1 and lineup['needs_requests']=='false' and lineup['reservation']==0 and lineup['provider_request_attempts']==0 and lineup['no_network_due_receipt']==lineup['gate_expected_no_request_success']=='PASS'
          assert t['workflow_timeouts']=={'validate-implementation':20,'collect-forward-snapshots':25}; quota=t['production_quota_ledger_values']; assert quota['requests_used_today']==6 and quota['quota_reservation_count']==2 and quota['artifact_pages']==3
          w=Path(os.environ['WORKFLOW_FILE']).read_text(); blocks=[]; lines=w.splitlines(); i=0
          while i<len(lines):
           m=re.match(r'^(\s*)run:\s*\|\s*$',lines[i])
           if not m:i+=1;continue
           n=len(m.group(1));i+=1;b=[]
           while i<len(lines) and (not lines[i].strip() or len(lines[i])-len(lines[i].lstrip())>n):b.append(lines[i]);i+=1
           blocks.append('\n'.join(b))
          assert ('$'+'{{') not in '\n'.join(blocks); (r/'security_validation.json').write_text(json.dumps({'checkout_head':h,'evidence_head':h,'event_sha':os.environ['EVENT_SHA'],**t},sort_keys=True)+'\n')
          PY
          files="$(git diff --name-only "$BASE_SHA"...HEAD)"; test "$(printf '%s\n' "$files"|sed '/^$/d'|wc -l)" -eq 15; ! printf '%s\n' "$files"|grep -E '(^|/)(models?|data/formal|config|CURRENT|score|btts|total.?goal)'
      - name: Metadata
        env: {EXPECTED_HEAD: '${{ env.EVIDENCE_HEAD }}'}
        run: python -c 'import json,os,pathlib;h=os.environ["EXPECTED_HEAD"];pathlib.Path(os.environ["RUNNER_TEMP"]+"/v/artifact_metadata.json").write_text(json.dumps({"checkout_head":h,"evidence_head":h,"run_head":h,"event_sha":os.environ["GITHUB_SHA"],"workflow_run_id":os.environ["GITHUB_RUN_ID"],"workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"deployment_status":"IMPLEMENTED_NOT_LIVE","remediation_status":"GPT_REMEDIATED_PENDING_CODEX_RECHECK","real_provider_request_attempts":0,"formal_weight":0})+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'football-e3g0d-validation-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/v', retention-days: 30, if-no-files-found: error}
  collect-forward-snapshots:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.API_FOOTBALL_COLLECTOR_ENABLED == 'true' && vars.API_FOOTBALL_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: read, actions: read}
    concurrency: {group: e3g0d-api-football-live-main, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.EVIDENCE_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Prepare
        id: prepare
        env: {EVENT_NAME: '${{ github.event_name }}', REF_VALUE: '${{ github.ref }}', CRON_VALUE: '${{ github.event.schedule }}', INPUT_MODE: '${{ inputs.collector_mode }}', INPUT_TARGET: '${{ inputs.target_date }}', INPUT_LEAGUE: '${{ inputs.league_id }}', INPUT_SEASON: '${{ inputs.season_id }}', INPUT_LIMIT: '${{ inputs.fixture_limit }}', INPUT_MAX: '${{ inputs.max_requests }}', INPUT_PLAN_ID: '${{ inputs.plan_artifact_id }}', INPUT_PLAN_SHA: '${{ inputs.plan_sha256 }}', INPUT_DRY: '${{ inputs.dry_run }}', INPUT_NETWORK: '${{ inputs.no_network }}', INPUT_UPLOAD: '${{ inputs.upload_artifact }}', INPUT_ALLOW: '${{ inputs.allow_schedule }}', EXPECTED_HEAD: '${{ env.EVIDENCE_HEAD }}', ARCHIVE: '${{ env.ARCHIVE }}'}
        run: python "$JOB" prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: reservation_upload
        if: steps.prepare.outputs.ok == 'true' && steps.prepare.outputs.needs_requests == 'true'
        with: {name: 'football-e3g0d-quota-reservation-${{ steps.prepare.outputs.request_day }}-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/reservation', retention-days: 30, if-no-files-found: error}
      - name: Collect and preserve evidence
        id: collect
        if: steps.reservation_upload.outcome == 'success'
        continue-on-error: true
        env: {API_FOOTBALL_KEY: '${{ secrets.API_FOOTBALL_KEY }}', CONTROLS_OK: '${{ steps.prepare.outputs.ok }}', NEEDS_REQUESTS: '${{ steps.prepare.outputs.needs_requests }}', RESERVATION_UPLOAD: '${{ steps.reservation_upload.outcome }}', COLLECTOR: '${{ env.COLLECTOR }}', MODE: '${{ steps.prepare.outputs.mode }}', TARGET: '${{ steps.prepare.outputs.target }}', LEAGUE: '${{ steps.prepare.outputs.league }}', SEASON: '${{ steps.prepare.outputs.season }}', LIMIT: '${{ steps.prepare.outputs.limit }}', MAXIMUM: '${{ steps.prepare.outputs.max }}', USED: '${{ steps.prepare.outputs.used }}', DAY: '${{ steps.prepare.outputs.request_day }}', HEAD_VALUE: '${{ steps.prepare.outputs.evidence_head }}', RUN_VALUE: '${{ steps.prepare.outputs.run_id }}', ATTEMPT_VALUE: '${{ steps.prepare.outputs.run_attempt }}', EXPIRES: '${{ steps.prepare.outputs.expires }}', RESERVATION_ID: '${{ steps.prepare.outputs.reservation_id }}', RESERVATION_SHA: '${{ steps.prepare.outputs.reservation_sha256 }}', RESERVATION_ARTIFACT_ID: '${{ steps.reservation_upload.outputs.artifact-id }}', RESERVATION_ARTIFACT_DIGEST: '${{ steps.reservation_upload.outputs.artifact-digest }}', RESERVATION_ARTIFACT_NAME: 'football-e3g0d-quota-reservation-${{ steps.prepare.outputs.request_day }}-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', RESERVED: '${{ steps.prepare.outputs.max }}', MODE_VALUE: '${{ steps.prepare.outputs.mode }}', REQUEST_DAY: '${{ steps.prepare.outputs.request_day }}'}
        run: python "$JOB" collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: plan_upload
        if: steps.collect.outcome == 'success' && steps.prepare.outputs.mode == 'build-plan'
        continue-on-error: true
        with: {name: 'football-e3g0d-plan-${{ steps.prepare.outputs.target }}-league-${{ steps.prepare.outputs.league }}-season-${{ steps.prepare.outputs.season }}-sha256-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ steps.collect.outputs.plan_sha256 }}', path: '${{ runner.temp }}/out', retention-days: 30, if-no-files-found: error}
      - name: Plan index
        id: plan_index
        if: steps.plan_upload.outcome == 'success'
        env: {RECEIPT: '${{ steps.collect.outputs.receipt }}', ARTIFACT_ID: '${{ steps.plan_upload.outputs.artifact-id }}', ARTIFACT_DIGEST: '${{ steps.plan_upload.outputs.artifact-digest }}', ARTIFACT_NAME: 'football-e3g0d-plan-${{ steps.prepare.outputs.target }}-league-${{ steps.prepare.outputs.league }}-season-${{ steps.prepare.outputs.season }}-sha256-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ steps.collect.outputs.plan_sha256 }}', PLAN_SHA: '${{ steps.collect.outputs.plan_sha256 }}', TARGET: '${{ steps.prepare.outputs.target }}', REQUEST_DAY: '${{ steps.prepare.outputs.request_day }}', LEAGUE: '${{ steps.prepare.outputs.league }}', SEASON: '${{ steps.prepare.outputs.season }}', HEAD_VALUE: '${{ steps.prepare.outputs.evidence_head }}', RUN_VALUE: '${{ steps.prepare.outputs.run_id }}', ATTEMPT_VALUE: '${{ steps.prepare.outputs.run_attempt }}', EXPIRES: '${{ steps.prepare.outputs.expires }}'}
        run: python "$JOB" plan-index
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: plan_index_upload
        if: steps.plan_index.outcome == 'success'
        continue-on-error: true
        with: {name: 'football-e3g0d-plan-index-${{ steps.plan_upload.outputs.artifact-id }}-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/index', retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: snapshot_upload
        if: steps.collect.outcome == 'success' && steps.prepare.outputs.mode != 'build-plan'
        continue-on-error: true
        with: {name: 'football-e3g0d-snapshot-${{ steps.prepare.outputs.mode }}-${{ env.EVIDCNCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/out', retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: final_receipt_upload
        if: always() && steps.reservation_upload.outcome == 'success'
        continue-on-error: true
        with: {name: 'football-e3g0d-quota-receipt-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/final-evidence', retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: partial_failure_upload
        if: always() && steps.reservation_upload.outcome == 'success' && steps.collect.outcome != 'success'
        continue-on-error: true
        with: {name: 'football-e3g0d-partial-failure-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/final-evidence', retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: no_network_upload
        if: steps.prepare.outputs.ok != 'true' || steps.prepare.outputs.needs_requests == 'false'
        continue-on-error: true
        with: {name: 'football-e3g0d-no-network-${{ env.EVIDENCE_HEAD }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}', path: '${{ runner.temp }}/no-network', retention-days: 30, if-no-files-found: error}
      - name: Gate
        if: always()
        env: {MODE_VALUE: '${{ steps.prepare.outputs.mode }}', OK_VALUE: '${{ steps.prepare.outputs.ok }}', BLOCKED_LIVE: '${{ steps.prepare.outputs.blocked_live }}', NEEDS_REQUESTS: '${{ steps.prepare.outputs.needs_requests }}', RESERVATION_UPLOAD: '${{ steps.reservation_upload.outcome }}', COLLECTOR_OUTCOME: '${{ steps.collect.outcome }}', EVIDENCE_MANIFEST: '${{ steps.collect.outcome }}', PLAN_UPLOAD: '${{ steps.plan_upload.outcome }}', PLAN_INDEX_UPLOAD: '${{ steps.plan_index_upload.outcome }}', SNAPSHOT_UPLOAD: '${{ steps.snapshot_upload.outcome }}', FINAL_RECEIPT_UPLOAD: '${{ steps.final_receipt_upload.outcome }}', NO_NETWORK_UPLOAD: '${{ steps.no_network_upload.outcome }}'}
        run: python "$JOB" gate
