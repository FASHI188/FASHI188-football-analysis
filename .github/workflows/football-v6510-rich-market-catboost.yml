name: football-v6510-rich-market-catboost

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_rich_market_catboost_full500_v6510.py'
      - '.github/workflows/football-v6510-rich-market-catboost.yml'
      - 'football-data/manifests/full500_v6493/**'

permissions:
  contents: write

jobs:
  validate-rich-market-catboost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 catboost==1.2.10 scipy==1.14.1

      - name: Compile
        run: python -m py_compile football-data/validation/validate_rich_market_catboost_full500_v6510.py

      - name: Run historical gate then A100 only if passed
        shell: bash
        run: |
          set +e
          python football-data/validation/validate_rich_market_catboost_full500_v6510.py 2>&1 | tee football-data/manifests/v6510_rich_market_catboost.log
          status=${PIPESTATUS[0]}
          echo "validator_exit_status=${status}" | tee -a football-data/manifests/v6510_rich_market_catboost.log
          exit ${status}

      - name: Persist V6.51 receipt
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_rich_market_catboost_full500_v6510_status.json
          if git diff --cached --quiet; then
            echo "V6.51 receipt already persisted"
          else
            git commit -m "research(football): persist V6.51 rich-market CatBoost receipt"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload V6.51 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6510-rich-market-catboost
          path: |
            football-data/manifests/v6510_rich_market_catboost.log
            football-data/manifests/v6_rich_market_catboost_full500_v6510_status.json
          if-no-files-found: warn
