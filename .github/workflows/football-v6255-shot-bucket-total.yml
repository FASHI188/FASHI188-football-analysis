name: Football V6.25.5 Direct Bucket Shot Total Head

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_shot_bucket_residual_v6255.py"
      - ".github/workflows/football-v6255-shot-bucket-total.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile challenger
        run: python -m py_compile football-data/validation/v6_total_shot_bucket_residual_v6255.py
      - name: Run strict-PIT direct bucket shot screen
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_shot_bucket_residual_v6255.py
      - name: Persist audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_shot_bucket_residual_v6255_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.5 direct bucket shot total"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Research-only challenger; no CURRENT/runtime mutation.
