name: football3 Top1 multiscale form full coverage R8

on:
  push:
    branches:
      - football3/top1-20k-opponent-veto-r1
    paths:
      - football-data/experiments/top1_r8_multiscale/run_experiment_r8.py
      - .github/workflows/football3-top1-r8-multiscale-fullcoverage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r8-multiscale-full-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-20k-opponent-veto-r1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Freeze German historical pure-results sample
        run: python football-data/experiments/top1_r8_multiscale/run_experiment_r8.py freeze
      - name: Run 100 percent coverage multiscale comparison
        run: python football-data/experiments/top1_r8_multiscale/run_experiment_r8.py run
      - name: Verify no-market untouched-test contract
        run: python football-data/experiments/top1_r8_multiscale/run_experiment_r8.py verify
      - name: Persist R8 data and result to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r8_multiscale/data football-data/experiments/top1_r8_multiscale/results
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r8] freeze German history and multiscale full-coverage result'
            git push origin HEAD:football3/top1-20k-opponent-veto-r1
          fi
      - name: Upload immutable R8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r8-multiscale-fullcoverage
          path: |
            football-data/experiments/top1_r8_multiscale/data/source_manifest_r8.json
            football-data/experiments/top1_r8_multiscale/results/summary_r8.json
          if-no-files-found: error
          retention-days: 30
