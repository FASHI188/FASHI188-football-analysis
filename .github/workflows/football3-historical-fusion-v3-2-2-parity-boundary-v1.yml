name: football3 Historical Fusion V3.2.2 Parity Boundary

on:
  push:
    branches: ['football3/historical-fusion-v3-2-2-parity-boundary-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-2-2-parity-boundary-v1.yml'
      - 'football-data/research/historical_fusion_v3_2_2_parity_boundary/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v322-${{ github.sha }}
  cancel-in-progress: false

env:
  SEG1_PARENT_HEAD: 24e62ad95d7dd405257db0c533596481038a62fb
  V32_TERMINAL_HEAD: 66765da92a378b4f2bc9023ce3b5e26c354effd4
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  CONTRACT_BLOB: 2cc8b23f1418251e70f37ae3be1f370be9fd2c27
  RUNNER_BLOB: 6e0c2e363db0b0756ae33dc5eb75fec2fc916bdb
  TEST_BLOB: c798f05f9c84b18d86434159cb164a5030bab047
  RUNNER_SOURCE_SHA256: 553d62ce977ee72335e4c23c4e66342b98ee8c402213be708dfa79381b1c2315
  V32DEV_BLOB: d91d8cf1a4bc2b00d1edb5c3ec001eaec08b7f8d
  V32CORE_BLOB: 3412620e887e70c828747396064a93f10a5edb3a
  V311_ENGINE_BLOB: 5a530708bcf1607cb210e869006e4aa5a8e626ad
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact lineage contract whitelist and immutable scientific bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-2-2-parity-boundary-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$SEG1_PARENT_HEAD" HEAD)" = "$SEG1_PARENT_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-1-weak-side-safety-v1 | cut -f1)" = "$SEG1_PARENT_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-three-fault-dynamic-joint-repair-v1 | cut -f1)" = "$V32_TERMINAL_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_v3_2_2_parity_boundary
          test "$(git hash-object "$D/V3_2_2_PARITY_BOUNDARY_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/v3_2_2_segment2.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_v3_2_2_segment2.py")" = "$TEST_BLOB"
          test "$(git hash-object football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair_execution/v3_2_development.py)" = "$V32DEV_BLOB"
          test "$(git hash-object football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair/v3_2_core.py)" = "$V32CORE_BLOB"
          test "$(git hash-object football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py)" = "$V311_ENGINE_BLOB"
          python - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,subprocess,zlib
          d=pathlib.Path('football-data/research/historical_fusion_v3_2_2_parity_boundary')
          allowed={'.github/workflows/football3-historical-fusion-v3-2-2-parity-boundary-v1.yml',str(d/'V3_2_2_PARITY_BOUNDARY_CONTRACT.json'),str(d/'v3_2_2_segment2.py'),str(d/'test_v3_2_2_segment2.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['SEG1_PARENT_HEAD']}...HEAD"],text=True).splitlines())
          assert got==allowed,(got,allowed)
          assert not any(any(x in p for x in ('CURRENT','production_pointer','formal_enablement')) for p in got)
          c=json.loads((d/'V3_2_2_PARITY_BOUNDARY_CONTRACT.json').read_text())
          assert c['status']=='FROZEN_BEFORE_V3_2_2_TARGET_SCORING'
          assert c['data_roles']['2024_25_and_2025_26_3504'].startswith('FORBIDDEN')
          assert c['candidate_A']['structural_weak_side_rule'].startswith('P_weak_after ==')
          assert c['candidate_B']['structural_weak_side_rule'].startswith('P_weak_after >=')
          tree=ast.parse((d/'v3_2_2_segment2.py').read_text()); payload=None
          for n in tree.body:
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='_PAYLOAD' for t in n.targets): payload=ast.literal_eval(n.value)
          assert payload is not None
          src=zlib.decompress(base64.b85decode(payload)); assert hashlib.sha256(src).hexdigest()==os.environ['RUNNER_SOURCE_SHA256']
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run structural invariants
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_2_parity_boundary
          python -m py_compile "$D/v3_2_2_segment2.py" "$D/test_v3_2_2_segment2.py"
          (cd "$D" && python test_v3_2_2_segment2.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 9 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify six frozen scientific input artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY'
          import sys
          norm=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$expected"
            unzip -tq "$zip"
            unzip -q "$zip" -d "$dest"
          }
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          python - <<'PY'
          import hashlib,pathlib
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert h('_inputs/v2/code/historical_xg_fusion_v2.py')=='1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          assert h('_inputs/xg/code/historical_xg_challenger.py')=='588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          assert h('_inputs/v1/pure_engine.py')=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_inputs/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          assert h('_inputs/v31/code/historical_fusion_v3_1.py')=='59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'
          PY

      - name: Frozen V3.2.2 parity-boundary research
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_2_parity_boundary
          rm -rf _run && mkdir _run
          python "$D/v3_2_2_segment2.py" \
            --contract "$D/V3_2_2_PARITY_BOUNDARY_CONTRACT.json" \
            --v32dev football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair_execution/v3_2_development.py \
            --core football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair/v3_2_core.py \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py \
            --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py \
            --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py \
            --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db \
            --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json \
            --out _run 2>&1 | tee /tmp/research_stdout.txt
          python - <<'PY'
          import json
          f=json.load(open('_run/final_status.json'))
          allowed={'V3_2_2_PARITY_BOUNDARY_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT','V3_2_2_PARITY_BOUNDARY_2023_DIAGNOSTIC_FAILED_NO_RESCUE','V3_2_2_PARITY_BOUNDARY_RESEARCH_CANDIDATE_READY_PROSPECTIVE_CONFIRMATION_REQUIRED'}
          assert f['status'] in allowed
          assert f['research_only'] is True and f['post_view'] is True and f['fresh_confirmation'] is False and f['promotion_allowed'] is False
          assert f['3504_opened'] is False and f['formal_v2_unchanged'] is True and f['v3_1_1_unchanged'] is True
          assert f['CURRENT_changed'] is False and f['production_pointer_changed'] is False and f['formal_enablement_changed'] is False and f['formal_weights_changed'] is False
          pre=json.load(open('_run/pre2023_row_receipt.json')); assert pre['max_source_season_loaded']==2022 and 2023 not in pre['counts'] and '2023' not in pre['counts']
          if f['status']=='V3_2_2_PARITY_BOUNDARY_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT':
              assert f['2023_opened'] is False and f['source_max_season_loaded']==2022
          else:
              assert f['2023_opened'] is True
          PY

      - name: Seal research artifact
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_2_parity_boundary
          rm -rf _seal && mkdir -p _seal/contracts _seal/code _seal/evidence
          cp "$D/V3_2_2_PARITY_BOUNDARY_CONTRACT.json" _seal/contracts/
          cp "$D/v3_2_2_segment2.py" "$D/test_v3_2_2_segment2.py" _seal/code/
          cp _run/*.json _seal/evidence/
          cp /tmp/tests.txt /tmp/research_stdout.txt _seal/evidence/
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('_seal'); files={}
          for p in sorted(r.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          f=json.load(open('_run/final_status.json'))
          m={'schema_version':'football3-v3-2-2-artifact-v1','status':f['status'],'head':os.environ['GITHUB_SHA'],'segment1_parent_head':os.environ['SEG1_PARENT_HEAD'],'v32_terminal_head':os.environ['V32_TERMINAL_HEAD'],'v311_head':os.environ['V311_HEAD'],'formal_v2_head':os.environ['FORMAL_HEAD'],'contract_blob':os.environ['CONTRACT_BLOB'],'runner_blob':os.environ['RUNNER_BLOB'],'test_blob':os.environ['TEST_BLOB'],'research_only':True,'post_view':True,'fresh_confirmation':False,'promotion_allowed':False,'2023_opened':f['2023_opened'],'3504_opened':False,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (r/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload V3.2.2 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-2-2-parity-boundary-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: research-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ART_ID: ${{ needs.research-and-seal.outputs.artifact_id }}
      DIGEST: ${{ needs.research-and-seal.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Download remote artifact and verify digest manifest payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}")"
          md="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$md" "$DIGEST" <<'PY'
          import sys
          norm=lambda x:x if x.startswith('sha256:') else 'sha256:'+x
          assert norm(sys.argv[1])==norm(sys.argv[2])
          PY
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" -o /tmp/a.zip
          python - "$DIGEST" <<'PY'
          import hashlib,sys
          exp=sys.argv[1]; exp=exp if exp.startswith('sha256:') else 'sha256:'+exp
          got='sha256:'+hashlib.sha256(open('/tmp/a.zip','rb').read()).hexdigest(); assert got==exp,(got,exp)
          PY
          unzip -tq /tmp/a.zip
          rm -rf /tmp/r && mkdir /tmp/r && unzip -q /tmp/a.zip -d /tmp/r
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('/tmp/r'); m=json.loads((r/'artifact_manifest.json').read_text())
          assert m['head']==os.environ['GITHUB_SHA'] and m['contract_blob']==os.environ['CONTRACT_BLOB']
          assert m['segment1_parent_head']==os.environ['SEG1_PARENT_HEAD'] and m['v32_terminal_head']==os.environ['V32_TERMINAL_HEAD']
          assert m['v311_head']==os.environ['V311_HEAD'] and m['formal_v2_head']==os.environ['FORMAL_HEAD']
          assert m['3504_opened'] is False and m['formal_v2_unchanged'] is True and m['v3_1_1_unchanged'] is True
          exp=set(m['files']); got={p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file()}-{'artifact_manifest.json'}; assert got==exp,(got^exp)
          for rel,meta in m['files'].items():
              b=(r/rel).read_bytes(); assert len(b)==meta['bytes'] and hashlib.sha256(b).hexdigest()==meta['sha256'],rel
          f=json.loads((r/'evidence/final_status.json').read_text()); assert f['status']==m['status']; assert f['3504_opened'] is False
          pre=json.loads((r/'evidence/pre2023_row_receipt.json').read_text()); assert pre['max_source_season_loaded']==2022
          PY
