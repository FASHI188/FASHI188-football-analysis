name: football3 score R6 posthoc fresh audit

on:
  push:
    branches:
      - football3/score-r6-posthoc-fresh-audit
    paths:
      - football-data/experiments/score_r6_posthoc_fresh_audit/run_score_r6.py
      - .github/workflows/football3-score-r6-posthoc-fresh-audit.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  score-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/score-r6-posthoc-fresh-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Download frozen R25 cohort artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r25-fresh-s60-confirmation
          path: football-data/experiments/score_r6_posthoc_fresh_audit/r25_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32941250515
      - name: Download frozen R26b cohort artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r26b-unseen-fd-fresh-s60
          path: football-data/experiments/score_r6_posthoc_fresh_audit/r26b_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32942144995
      - name: Run Score R6
        run: python football-data/experiments/score_r6_posthoc_fresh_audit/run_score_r6.py run
      - name: Verify Score R6 contract
        run: python football-data/experiments/score_r6_posthoc_fresh_audit/run_score_r6.py verify
      - name: Persist Score R6 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/score_r6_posthoc_fresh_audit/results/summary_score_r6.json
          if ! git diff --cached --quiet; then
            git commit -m '[generated] football3 score R6 posthoc fresh audit'
            git push origin HEAD:football3/score-r6-posthoc-fresh-audit
          fi
      - name: Upload Score R6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-score-r6-posthoc-fresh-audit
          path: football-data/experiments/score_r6_posthoc_fresh_audit/results/summary_score_r6.json
          if-no-files-found: error
          retention-days: 90
