name: football3 New Engine V1 zero-label forward registry

on:
  push:
    branches:
      - football3/new-engine-v1
    paths:
      - 'football-data/new_engine_v1/forward/**'
      - 'football-data/new_engine_v1/forward_capture_projection.py'
      - 'football-data/new_engine_v1/forward_record.py'
      - 'football-data/new_engine_v1/test_forward_record.py'
      - 'football-data/new_engine_v1/historical_gate_reaudit.py'
      - 'football-data/new_engine_v1/contracts/FORWARD_PREREG.md'
      - '.github/workflows/football3-new-engine-v1-forward.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-new-engine-v1-forward-${{ github.sha }}
  cancel-in-progress: false

jobs:
  forward-zero-label:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact forward HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind frozen candidate and allowed final diff
        shell: bash
        run: |
          set -euo pipefail
          ANCHOR=7c1815c47102412e88f72189e2b8f837d9b73a42
          CANDIDATE=7986b5b528338d1d359f1287677f4ab92e453f39
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ANCHOR" HEAD
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          test "$(sha256sum football-data/new_engine_v1/pure_engine.py | awk '{print $1}')" = "cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318"
          test "$(sha256sum football-data/new_engine_v1/contracts/VALIDATION_PREREG.md | awk '{print $1}')" = "cf83987c37a375d03acbc06c696a102ffe13fd8ac460c50ec6e6d631111f8d3a"
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          test "$(git hash-object football-data/validation/v6_full17_kambi_capture_v6484.py)" = "4e75c572799988a4a89ecc92e2b727a46516cd2d"
          test "$(git hash-object football-data/validation/v6_full17_kambi_capture_v6482.py)" = "8add75cec408425ec4d126b143297f3574b79025"
          test "$(git hash-object football-data/config/v6_full17_capture_identity_v6484.json)" = "cdf999077cd9fb4a96f6ead4fdd8f9933f5d0e66"
          test "$(git hash-object football-data/config/v6_full17_kambi_group_aliases_v6482.json)" = "1e35c692123c26d6e3f9aa12c2e7a2463eface1f"
          bad="$(git diff --name-only "$ANCHOR"...HEAD | grep -Ev '^(football-data/new_engine_v1/|\.github/workflows/football3-new-engine-v1\.yml$|\.github/workflows/football3-new-engine-v1-forward\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo "out-of-whitelist final diff:" >&2
            echo "$bad" >&2
            exit 1
          fi
          if grep -Eiq 'bayesian_dynamic_state_oof_v500|v500_baseline_adapter|legacy_r43_registry|odds|market' football-data/new_engine_v1/pure_engine.py; then
            echo 'pure core independence boundary violated' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.3.2 scipy==1.16.1

      - name: Compile and test forward boundary
        run: |
          python -m py_compile football-data/new_engine_v1/forward_capture_projection.py
          python -m py_compile football-data/new_engine_v1/forward_record.py
          python -m py_compile football-data/new_engine_v1/historical_gate_reaudit.py
          cd football-data/new_engine_v1
          python -m unittest test_new_engine.py test_forward_record.py -v

      - name: Restore prior zero-label state on rerun
        if: ${{ github.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$((GITHUB_RUN_ATTEMPT-1))
          name="football3-new-engine-v1-forward-${GITHUB_SHA}-${GITHUB_RUN_ID}-attempt-${previous}"
          rm -rf /tmp/prior
          mkdir -p /tmp/prior
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir /tmp/prior
          test -f /tmp/prior/state/ledger.jsonl
          test -f /tmp/prior/state/status.json
          test -f /tmp/prior/historical_gate_reaudit.json
          mkdir -p football-data/new_engine_v1/forward football-data/new_engine_v1/evidence
          cp /tmp/prior/state/ledger.jsonl football-data/new_engine_v1/forward/ledger.jsonl
          cp /tmp/prior/state/status.json football-data/new_engine_v1/forward/status.json
          if [ -f /tmp/prior/state/latest_audit.json ]; then cp /tmp/prior/state/latest_audit.json football-data/new_engine_v1/forward/latest_audit.json; fi
          for f in /tmp/prior/state/checkpoint_*.json; do [ -e "$f" ] || continue; cp "$f" football-data/new_engine_v1/forward/; done
          cp /tmp/prior/historical_gate_reaudit.json football-data/new_engine_v1/evidence/historical_gate_reaudit.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('football-data/new_engine_v1/evidence/historical_gate_reaudit.json')
          s=Path('football-data/new_engine_v1/forward/status.json')
          audit=json.loads(a.read_text()); status=json.loads(s.read_text())
          digest=hashlib.sha256(a.read_bytes()).hexdigest()
          assert audit['candidate_source_head']=='7986b5b528338d1d359f1287677f4ab92e453f39'
          assert audit['corrected_scientific_status']=='MODEL_CANDIDATE_PASSED'
          assert status['same_match_reaudit_sha256']==digest
          assert status['outcomes_read'] is False and status['labels_present'] is False
          assert int(status['enrolled_rows']) <= 300
          PY

      - name: Reproduce historical evidence for first prospective gate
        if: ${{ github.run_attempt == 1 }}
        run: python football-data/new_engine_v1/historical_eval.py

      - name: Reaudit preregistered same-match scientific gate
        if: ${{ github.run_attempt == 1 }}
        run: |
          cd football-data/new_engine_v1
          python historical_gate_reaudit.py

      - name: Verify corrected gate before any fresh capture
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('football-data/new_engine_v1/evidence/historical_gate_reaudit.json')
          x=json.loads(p.read_text())
          assert x['candidate_source_head']=='7986b5b528338d1d359f1287677f4ab92e453f39'
          assert x['corrected_scientific_status']=='MODEL_CANDIDATE_PASSED'
          assert all(x['checks'].values())
          assert x['same_match_underdog']['passed'] is True
          print(json.dumps({'corrected_scientific_status':x['corrected_scientific_status'],'same_match_underdog':x['same_match_underdog'],'reaudit_sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY

      - name: Wait until preregistered forward lock is active
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from pathlib import Path
          lock=json.loads(Path('football-data/new_engine_v1/forward/model_lock.json').read_text())
          target=datetime.fromisoformat(lock['forward_not_before_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
          now=datetime.now(timezone.utc)
          wait=max(0.0,(target-now).total_seconds())
          if wait > 900:
              raise SystemExit(f'forward lock unexpectedly more than 15 minutes ahead: {wait:.1f}s')
          if wait:
              print(f'waiting {wait:.1f}s for forward lock')
              time.sleep(wait+1.0)
          PY

      - name: Capture fresh public Kambi PIT
        run: python football-data/validation/v6_full17_kambi_capture_v6484.py

      - name: Strip market data into safe pure-model projection
        run: python football-data/new_engine_v1/forward_capture_projection.py

      - name: Append zero-label prospective predictions
        run: python football-data/new_engine_v1/forward_record.py

      - name: Verify zero-label and pure-input contracts
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('football-data/new_engine_v1')
          safe=json.loads((base/'forward/safe_capture_candidates.json').read_text())
          forbidden_safe=re.compile(r'(odds|probability|one_x_two|asian_handicap|over_under)',re.I)
          for row in safe.get('events') or []:
              assert not any(forbidden_safe.search(str(k)) for k in row), row
          forbidden={'home_goals','away_goals','result','outcome','score','status_result','settled'}
          rows=[]
          for line in (base/'forward/ledger.jsonl').read_text().splitlines():
              if not line.strip(): continue
              row=json.loads(line); rows.append(row)
              assert not (forbidden & set(row))
              assert row['labels_present'] is False and row['outcomes_read'] is False
              assert row['candidate_source_head']=='7986b5b528338d1d359f1287677f4ab92e453f39'
          status=json.loads((base/'forward/status.json').read_text())
          assert status['labels_present'] is False and status['outcomes_read'] is False
          assert status['enrolled_rows']==len(rows) and len(rows)<=300
          print(json.dumps({'safe_event_count':safe.get('safe_event_count'),'enrolled_rows':len(rows),'rows_added_cycle':status.get('rows_added_cycle'),'forward_status':status.get('forward_status')},indent=2))
          PY

      - name: Assemble self-contained exact-HEAD forward artifact
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forward_artifact
          mkdir -p /tmp/forward_artifact/state
          cp football-data/new_engine_v1/forward/ledger.jsonl /tmp/forward_artifact/state/
          cp football-data/new_engine_v1/forward/status.json /tmp/forward_artifact/state/
          cp football-data/new_engine_v1/forward/latest_audit.json /tmp/forward_artifact/state/
          for f in football-data/new_engine_v1/forward/checkpoint_*.json; do [ -e "$f" ] || continue; cp "$f" /tmp/forward_artifact/state/; done
          cp football-data/new_engine_v1/forward/safe_capture_candidates.json /tmp/forward_artifact/
          cp football-data/new_engine_v1/forward/model_lock.json /tmp/forward_artifact/
          cp football-data/new_engine_v1/contracts/FORWARD_PREREG.md /tmp/forward_artifact/
          cp football-data/new_engine_v1/evidence/historical_gate_reaudit.json /tmp/forward_artifact/
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('/tmp/forward_artifact')
          files={}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  data=p.read_bytes()
                  files[str(p.relative_to(root))]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          manifest={
              'schema_version':'football3-new-engine-v1-forward-artifact-v1',
              'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'parent':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
              'branch':os.environ['GITHUB_REF_NAME'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'candidate_source_head':'7986b5b528338d1d359f1287677f4ab92e453f39',
              'candidate_source_artifact_digest':'sha256:8dc51ac1f9b9352b2a61bbdf7d3ffa46ca2aa6c13cc390af783f5df2112ac3c3',
              'outcomes_read':False,
              'labels_present':False,
              'pycache_in_manifest':False,
              'files':files,
          }
          (root/'artifact_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Upload zero-label prospective evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: football3-new-engine-v1-forward-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/forward_artifact/
          if-no-files-found: error
          retention-days: 90
