name: Football Market6 Total Parity Diagnostic R7

on:
  pull_request:
    paths:
      - "football-data/config/market6_total_parity_diagnostic_r7.json"
      - "football-data/validation/evaluate_market6_total_parity_diagnostic_r7.py"
      - "football-data/research/market6_total_parity_diagnostic_r7/**"
      - ".github/workflows/football-market6-total-parity-diagnostic-r7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-market6-total-parity-diagnostic-r7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/engine:football-data/validation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile frozen R7 path
        run: |
          python -m py_compile \
            football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py \
            football-data/validation/v510_historical_structure_features_r1.py \
            football-data/validation/v510_historical_structure_model_r1.py \
            football-data/validation/evaluate_even_t_gd0_market_diagnostic_r5.py \
            football-data/validation/evaluate_market6_total_parity_diagnostic_r7.py
      - name: Rebuild exact audited runtime ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run frozen market6 total-parity diagnostic R7
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/market6-total-parity-diagnostic-r7
          python football-data/validation/evaluate_market6_total_parity_diagnostic_r7.py \
            2>&1 | tee /tmp/market6-total-parity-diagnostic-r7/traceback.log
      - name: Upload R7 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: market6-total-parity-diagnostic-r7-failure-log
          path: /tmp/market6-total-parity-diagnostic-r7/traceback.log
          if-no-files-found: error
          retention-days: 30
      - name: Verify frozen research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/market6_total_parity_diagnostic_r7/summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='POSTVIEW_MARKET6_TOTAL_PARITY_DIAGNOSTIC_R7_COMPLETE_NO_PROMOTION'
          assert x['data_identity']['rows']==26873
          assert x['data_identity']['competitions']==16
          assert x['target']['draw_requires_even_total'] is True
          b=x['boundary']
          assert b['component_diagnostic_only'] is True
          assert b['market_evidence_not_strict_pit'] is True
          assert b['direct_t_mutation'] is False
          assert b['hda_probability_mutation'] is False
          assert b['score_probability_mutation'] is False
          assert b['forced_draw'] is False
          assert b['threshold_search'] is False
          assert b['new_target_label_access']==0
          assert b['b05_b07_labels_opened'] is False
          assert b['future_oos_label_open_authorized'] is False
          assert b['formal_weight']==0
          assert b['main_mutation'] is False
          assert x['development_signal']['scientific_pass'] is False
          assert x['development_signal']['future_oos_label_open_authorized'] is False
          print(json.dumps({
            'verdict':x['scientific_verdict'],
            'coverage':x['coverage'],
            'pooled':x['metrics']['pooled'],
            'diagnosis':x['diagnosis'],
            'bootstrap':x['bootstrap'],
            'development_signal':x['development_signal'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload R7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: market6-total-parity-diagnostic-r7
          path: football-data/manifests/market6_total_parity_diagnostic_r7/
          if-no-files-found: error
          retention-days: 30
      - name: Confirm runtime-only manifests
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
