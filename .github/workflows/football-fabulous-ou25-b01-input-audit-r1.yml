name: Football fabul0us OU25 B01 input audit R1

on:
  push:
    branches: [research/fabulous-ou25-b01-input-audit-r1]
    paths:
      - 'football-data/validation/audit_fabulous_ou25_b01_inputs_r1.py'
      - '.github/workflows/football-fabulous-ou25-b01-input-audit-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-fabulous-ou25-b01-input-audit-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-label-input-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0 rapidfuzz==3.14.0 Unidecode==1.4.0

      - name: Download pinned market and kickoff identity sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fab
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 900 \
            'https://huggingface.co/datasets/fabul0us/football_odds_2023-24/resolve/211feb35f9dcd270bd7a1b27b39a8b1f45f239aa/match_odds.csv?download=true' \
            -o /tmp/fab/match_odds.csv
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/fixtures.parquet?download=true' \
            -o /tmp/fab/fixtures.parquet
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/teams.parquet?download=true' \
            -o /tmp/fab/teams.parquet

      - name: Compile zero-label audit
        run: python -m py_compile football-data/validation/audit_fabulous_ou25_b01_inputs_r1.py

      - name: Reconstruct sealed B01 and audit PIT market inputs
        run: python football-data/validation/audit_fabulous_ou25_b01_inputs_r1.py

      - name: Assert hard zero-label boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b01_input_audit_r1/summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='ZERO_LABEL_COMPLETE'
          assert x['reserve_reconstructed_n']==1559
          assert x['b01_n']==400
          assert x['b01_hash_match'] is True
          assert x['target_labels_accessed']==0
          assert x['target_outcome_columns_read']==[]
          assert x['model_fits']==0
          assert x['scoring']==0
          assert x['threshold_tuning']==0
          assert x['effect_test_authorized'] is False
          print(json.dumps(x, ensure_ascii=False, indent=2))
          PY

      - name: Upload pre-match input packet only
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-ou25-b01-input-audit-r1-${{ github.sha }}
          path: football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b01_input_audit_r1/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm no tracked runtime mutation
        shell: bash
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b01_input_audit_r1/' || true)"
