name: Football R55 Baseline Environment Fingerprint Probe

on:
  push:
    branches:
      - research/r55-ou-matched300-20260814
    paths:
      - football-data/research/r55_baseline_env_fingerprint_probe_20260816.py
      - .github/workflows/football-r55-baseline-env-fingerprint-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-r55-baseline-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install candidate original numerical environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Download already-verified frozen archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output archive.1.1.zip \
            'https://github.com/FASHI188/FASHI188-football-analysis/releases/download/football-data-archive-v1/archive.1.1.zip'
      - name: Reproduce R55 baseline fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          python football-data/research/r55_baseline_env_fingerprint_probe_20260816.py --archive archive.1.1.zip
