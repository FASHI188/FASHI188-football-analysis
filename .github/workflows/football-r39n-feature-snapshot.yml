name: Football R39N Feature Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39n-feature-snapshot.yml'
      - 'football-data/research/lineup_market_value_r39n/**'

permissions:
  contents: read

concurrency:
  group: r39n-feature-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zero-label-valuation-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify zero-label R39N contract and strict cutoff self-test
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/lineup_market_value_r39n/export_valuation_snapshot_r39n.py
          python - <<'PY'
          import importlib.util,json
          from datetime import date
          from pathlib import Path
          p=json.loads(Path('football-data/research/lineup_market_value_r39n/preregistration_r39n.json').read_text())
          s=json.loads(Path('football-data/research/lineup_market_value_r39n/source_registration_r39n.json').read_text())
          assert p['preregistration_status']=='HYPOTHESIS_AND_FEATURE_ALGORITHM_FROZEN_BEFORE_TARGET_LABEL_ACCESS'
          assert p['blind_binding']['fixed100_labels_accessed_before_r39n']==0
          assert p['valuation_point_in_time_contract']['same_day_valuation_forbidden'] is True
          assert p['valuation_point_in_time_contract']['future_valuation_forbidden'] is True
          assert p['valuation_point_in_time_contract']['imputation']=='none'
          assert p['feature_contract']['full_dimension']==14
          assert all(v==0 for v in s['no_target_label_contract'].values())
          path=Path('football-data/research/lineup_market_value_r39n/export_valuation_snapshot_r39n.py')
          spec=importlib.util.spec_from_file_location('r39n',path);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          import numpy as np
          idx={'1':(np.asarray([date(2024,1,1).toordinal(),date(2024,1,2).toordinal()],dtype=np.int32),np.asarray([10.0,99.0]))}
          v,d=m.prior_value(idx,'1',date(2024,1,2));assert v==10.0 and d==date(2024,1,1).toordinal()
          v,d=m.prior_value(idx,'1',date(2024,1,1));assert v is None and d is None
          print('PASS_R39N_ZERO_LABEL_STRICT_VALUATION_CUTOFF')
          PY
      - name: Download and sanitize Transfermarkt identity, lineup and valuation tables
        run: |
          set -euo pipefail
          rm -rf r39n-tm r39n-market r39n-snapshot player_scores.zip /tmp/r39n-*.csv
          mkdir -p r39n-tm r39n-market r39n-snapshot
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39n-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39n-lineups.csv
          unzip -p player_scores.zip player_valuations.csv > /tmp/r39n-valuations.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39n-games.csv','r39n-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39n-lineups.csv','r39n-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39n-valuations.csv','r39n-tm/valuations_prior.csv',['player_id','date','market_value_in_eur'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing:raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39n-games.csv /tmp/r39n-lineups.csv /tmp/r39n-valuations.csv player_scores.zip
      - name: Download and sanitize Football-Data closing-market identity only
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="/tmp/r39n-${season}_${div}.csv";out="r39n-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing:raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
              rm -f "$raw"
            done
          done
      - name: Export zero-label actual-XI valuation feature snapshot
        run: |
          set -euo pipefail
          python football-data/research/lineup_market_value_r39n/export_valuation_snapshot_r39n.py \
            --registration football-data/research/lineup_market_value_r39n/source_registration_r39n.json \
            --r39i-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39n-market --games r39n-tm/games_identity.csv --lineups r39n-tm/lineups_identity.csv \
            --valuations r39n-tm/valuations_prior.csv --out-dir r39n-snapshot
      - name: Verify zero-label terminal contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          r=json.loads(Path('r39n-snapshot/snapshot_receipt_r39n.json').read_text())
          assert r['identity_lane_before_valuation_filter']=={'preholdout':8161,'holdout_2526':1273,'fixed100':100,'fixed100_identity_sha256':'f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'}
          assert r['strict_valuation_lag_violations']==0
          assert all(v==0 for v in r['zero_label_contract'].values())
          assert r['status'] in {'PASS_R39N_ZERO_LABEL_VALUATION_SNAPSHOT','STOP_R39N_ZERO_LABEL_VALUATION_COVERAGE_OR_LAG_GATE'}
          with Path('r39n-snapshot/feature_snapshot_r39n.csv').open('r',encoding='utf-8',newline='') as f:
              rd=csv.reader(f);header=next(rd);n=sum(1 for _ in rd)
          assert n==r['feature_eligible']['all'] and len(header)==23
          print(json.dumps(r,indent=2))
          PY
      - name: Delete mutable source inputs before artifact
        run: rm -rf r39n-tm r39n-market
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39n-zero-label-valuation-snapshot-${{ github.sha }}-${{ github.run_id }}
          path: r39n-snapshot/
          if-no-files-found: error
          retention-days: 30
