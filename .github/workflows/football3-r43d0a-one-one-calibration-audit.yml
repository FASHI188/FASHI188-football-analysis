name: football3 R43D0A one-one calibration audit

on:
  push:
    branches:
      - football3/r43d0a-one-one-calibration-audit
    paths:
      - 'football-data/experiments/r43d0a_one_one_calibration_audit/**'
      - '.github/workflows/football3-r43d0a-one-one-calibration-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43d0a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43d0a-one-one-calibration-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore R9b 20k source spine
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43D0A calibration audit
        run: python football-data/experiments/r43d0a_one_one_calibration_audit/run_r43d0a.py run
      - name: Verify R43D0A contract
        run: python football-data/experiments/r43d0a_one_one_calibration_audit/run_r43d0a.py verify
      - name: Persist R43D0A evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43d0a_one_one_calibration_audit/results/summary_r43d0a_one_one_calibration.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43D0A one-one calibration audit'
            git fetch origin football3/r43d0a-one-one-calibration-audit
            git rebase origin/football3/r43d0a-one-one-calibration-audit
            git push origin HEAD:football3/r43d0a-one-one-calibration-audit
          fi
      - name: Upload R43D0A artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43d0a-one-one-calibration-audit
          path: football-data/experiments/r43d0a_one_one_calibration_audit/results/summary_r43d0a_one_one_calibration.json
          if-no-files-found: error
          retention-days: 90
