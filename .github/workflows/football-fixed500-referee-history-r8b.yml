name: Football Fixed500 Referee History R8B

on:
  push:
    branches: ["research/fixed500-existing-market-t-r1"]
    paths:
      - "football-data/validation/diagnose_fixed500_referee_history_r8b.py"
      - ".github/workflows/football-fixed500-referee-history-r8b.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-fixed500-referee-history-r8b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/fixed500-existing-market-t-r1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile
        run: |
          python -m py_compile football-data/validation/diagnose_fixed500_referee_history_r8.py
          python -m py_compile football-data/validation/diagnose_fixed500_referee_history_r8b.py
      - name: Rebuild audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run same-fixed500 referee-history two-tier test
        run: python football-data/validation/diagnose_fixed500_referee_history_r8b.py
      - name: Verify boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/fixed500_referee_history_r8b.json').read_text(encoding='utf-8'))
          assert x['sample']['parent_fixed500_n']==500
          assert x['sample']['new_sample_consumed'] is False
          assert x['sample']['latest_position4_confirmation_opened'] is False
          assert x['coverage']['tiers']==[3,5]
          assert x['feature_contract']['tier_selection_rule']=='report both; no post-result tier selection'
          assert x['feature_contract']['same_day_freeze_before_updates'] is True
          assert x['feature_contract']['current_match_result_used_as_current_feature'] is False
          assert x['feature_contract']['only_prior_referee_matches_update_state'] is True
          assert x['feature_contract']['model_family_unchanged'] is True
          assert x['interpretation_guard']['R8_initial_failure_revealed_only_coverage_not_performance'] is True
          assert x['interpretation_guard']['do_not_cherry_pick_coverage_tier'] is True
          assert x['governance']['post_result_threshold_search'] is False
          assert x['governance']['new_data_collection'] is False
          print(json.dumps({'verdict':x['scientific_verdict'],'sample':x['sample'],'coverage':x['coverage'],'decision':x['decision'],'tiers':x['tiers']},ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixed500-referee-history-r8b
          path: |
            football-data/manifests/fixed500_referee_history_r8b.json
            football-data/manifests/fixed500_referee_history_r8b_rows.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no tracked runtime mutation
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
