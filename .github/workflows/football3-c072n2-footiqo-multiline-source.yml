name: football3-c072n2-footiqo-multiline-source

on:
  pull_request:
    branches:
      - football3/c072m2-oddsportal-multiline-zero-label-source-20260819
    paths:
      - 'football-data/research/C072N2_FOOTIQO_MULTILINE_ZERO_LABEL_SOURCE_CONTRACT.md'
      - 'football-data/research/audit_c072n2_footiqo_multiline_source.py'
      - '.github/workflows/football3-c072n2-footiqo-multiline-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4
      - name: Frozen contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072N2_FOOTIQO_MULTILINE_ZERO_LABEL_SOURCE_CONTRACT.md').read_text()
          assert 'Historical Odds: 1X2, Over/Under Goals, BTTS' in c
          assert 'C073-C077 remain quarantined' in c
          assert 'target/result values materialized = 0' in c
          print('N2 contract guard: PASS')
          PY
      - name: Run zero-label multi-line source audit
        run: python football-data/research/audit_c072n2_footiqo_multiline_source.py
      - name: Boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072n2_source_summary.json').read_text())
          assert x['target_result_values_materialized'] == 0
          assert x['model_fit'] == 0
          assert x['model_score'] == 0
          assert x['C073_C077_quarantined'] is True
          assert x['C070F_confirmation1597_opened'] is False
          print('N2 boundaries: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072n2-footiqo-multiline-source-audit
          path: football-data/research/c072n2_source_summary.json
          if-no-files-found: error
