name: football-r44l2-training-support-gate

on:
  push:
    branches:
      - research/r44l2-lineup-role-opportunity-300
    paths:
      - 'football-data/research/r44l2_lineup_role_opportunity_300/run_training_support_gate_r44l2.py'
      - '.github/workflows/football-r44l2-training-support-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training-support-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pushed HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record execution identity
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          git status --short
      - name: Run label-free 380-match training support gate
        run: |
          python football-data/research/r44l2_lineup_role_opportunity_300/run_training_support_gate_r44l2.py r44l2_training_support_output
      - name: Upload training-support evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44l2-training-support-${{ github.sha }}
          path: r44l2_training_support_output/
          if-no-files-found: error
          retention-days: 30
