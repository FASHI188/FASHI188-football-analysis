name: football3 Historical Fusion V3.2.6 Temporal Horizon Consensus

on:
  push:
    branches: ['football3/historical-fusion-v3-2-6-temporal-horizon-consensus-v1']
    paths:
      - '.github/workflows/football3-historical-fusion-v3-2-6-temporal-horizon-consensus-v1.yml'
      - 'football-data/research/historical_fusion_v3_2_6_temporal_horizon_consensus/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v326-${{ github.sha }}
  cancel-in-progress: false

env:
  SEG5_HEAD: 0bcde1dd56a0901dda420cd3cfaa6c09b9265ce5
  SEG4_HEAD: 3cc9098cd321ee4f1dd659b1a4f4db75c02555ed
  SEG3_SCIENCE_HEAD: 755610432bc50c01146d61297c41060c080b10c9
  V311_HEAD: a90762a97515f3edd564e8ad204db0d0d4231494
  FORMAL_HEAD: e12f5d1193be5d81f60301cf34ab2140e11712a9
  CONTRACT_BLOB: 9505ba3bfe221df111444ea0ea10b4f835a23ba5
  RUNNER_BLOB: 947ec2e074b4d74039a3127b813441bdcbc72edf
  TEST_BLOB: 5321ae39edcacbc680cbbfd6218fa43b8695a455
  V324_CONTRACT_BLOB: e4e2670b44168078bc869e7b0889b99bbb2a79f1
  V324_RUNNER_BLOB: 218cfab50a23ca5f94e57c95b2357ae2c9d9ba8f
  V325_ARTIFACT_ID: '9888831388'
  V325_ARTIFACT_DIGEST: sha256:f5b5ddc83f07156425812a4e83c26a6c48e25a452a83d5e5400e03cc2a4ac2d7
  V324_ARTIFACT_ID: '9888387173'
  V324_ARTIFACT_DIGEST: sha256:c14813b04a3f21f5cf8de0cf99d682b0e539f2011adb9212532af175509e6ad1
  V2_ARTIFACT_ID: '9828471485'
  V2_ARTIFACT_DIGEST: sha256:b0b57c910f305978661d026d836a0d16dc3037fcb21c451a535ef4e4a05210bb
  XG_ARTIFACT_ID: '9826787329'
  XG_ARTIFACT_DIGEST: sha256:64e9242201006b71265f35a0199d07b1fe1bde1fa68d1c1073310ce40f30ca7e
  V1_ARTIFACT_ID: '9732754224'
  V1_ARTIFACT_DIGEST: sha256:5f0af0c428f19492715669c8e4fb2451ee94bf373f17f5560ff1a42114375bcb
  OLD_ARTIFACT_ID: '9798682425'
  OLD_ARTIFACT_DIGEST: sha256:01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba
  USR1_ARTIFACT_ID: '9848912219'
  USR1_ARTIFACT_DIGEST: sha256:eed8de4ef193b9991f2aad71c5a7a3db65821bf7cc37bd0adb8cb521a615c99a
  V31_ARTIFACT_ID: '9855441319'
  V31_ARTIFACT_DIGEST: sha256:2e46d18491e1ef31dfa4bf6f0992ee23b72d46389dda22ce7f07465f21bca4e3

jobs:
  research-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact lineage whitelist and frozen scientific bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/historical-fusion-v3-2-6-temporal-horizon-consensus-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$SEG5_HEAD" HEAD)" = "$SEG5_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-5-prequential-regret-firewall-v1 | cut -f1)" = "$SEG5_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-2-4-minimal-boundary-projection-v1 | cut -f1)" = "$SEG4_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-fusion-v3-1-1-joint-score-v1 | cut -f1)" = "$V311_HEAD"
          test "$(git ls-remote origin refs/heads/football3/historical-xg-fusion-v2-formal-activation-v1 | cut -f1)" = "$FORMAL_HEAD"
          D=football-data/research/historical_fusion_v3_2_6_temporal_horizon_consensus
          D4=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          test "$(git hash-object "$D/V3_2_6_TEMPORAL_HORIZON_CONSENSUS_CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$D/v3_2_6_segment6.py")" = "$RUNNER_BLOB"
          test "$(git hash-object "$D/test_v3_2_6_segment6.py")" = "$TEST_BLOB"
          test "$(git hash-object "$D4/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json")" = "$V324_CONTRACT_BLOB"
          test "$(git hash-object "$D4/v3_2_4_segment4.py")" = "$V324_RUNNER_BLOB"
          python - <<'PY2'
          import json,os,pathlib,subprocess
          d=pathlib.Path('football-data/research/historical_fusion_v3_2_6_temporal_horizon_consensus')
          allowed={'.github/workflows/football3-historical-fusion-v3-2-6-temporal-horizon-consensus-v1.yml',str(d/'V3_2_6_TEMPORAL_HORIZON_CONSENSUS_CONTRACT.json'),str(d/'v3_2_6_segment6.py'),str(d/'test_v3_2_6_segment6.py')}
          got=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['SEG5_HEAD']}...HEAD"],text=True).splitlines()); assert got==allowed,(got,allowed)
          c=json.loads((d/'V3_2_6_TEMPORAL_HORIZON_CONSENSUS_CONTRACT.json').read_text())
          assert c['status']=='FROZEN_BEFORE_V3_2_6_TARGET_SCORING'
          assert c['consensus']['training_half_life_seasons']==[1.0,2.0,4.0]
          assert c['consensus']['threshold_grid']=='NONE' and c['consensus']['probability_averaging'] is False and c['consensus']['no_result_feedback'] is True
          assert c['data_roles']['2024_25_and_2025_26_3504'].startswith('FORBIDDEN')
          assert c['lineage']['segment5_branch_head']==os.environ['SEG5_HEAD'] and c['lineage']['segment4_branch_head']==os.environ['SEG4_HEAD']
          PY2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run structural invariants
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_6_temporal_horizon_consensus
          python -m py_compile "$D/v3_2_6_segment6.py" "$D/test_v3_2_6_segment6.py"
          (cd "$D" && python test_v3_2_6_segment6.py) 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 7 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt

      - name: Download and verify frozen scientific inputs and predecessor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _inputs && mkdir -p _inputs/{v325art,v324art,v2,xg,v1,old,usr1,v31}
          verify_one() {
            id="$1" expected="$2" zip="$3" dest="$4"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            python - "$got" "$expected" <<'PY2'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower(); assert norm(sys.argv[1])==norm(sys.argv[2]),(sys.argv[1],sys.argv[2])
          PY2
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            python - "$zip" "$expected" <<'PY2'
          import hashlib,sys
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==sys.argv[2].split(':',1)[-1].lower()
          PY2
            unzip -tq "$zip"; unzip -q "$zip" -d "$dest"
          }
          verify_one "$V325_ARTIFACT_ID" "$V325_ARTIFACT_DIGEST" /tmp/v325.zip _inputs/v325art
          verify_one "$V324_ARTIFACT_ID" "$V324_ARTIFACT_DIGEST" /tmp/v324.zip _inputs/v324art
          verify_one "$V2_ARTIFACT_ID" "$V2_ARTIFACT_DIGEST" /tmp/v2.zip _inputs/v2
          verify_one "$XG_ARTIFACT_ID" "$XG_ARTIFACT_DIGEST" /tmp/xg.zip _inputs/xg
          verify_one "$V1_ARTIFACT_ID" "$V1_ARTIFACT_DIGEST" /tmp/v1.zip _inputs/v1
          verify_one "$OLD_ARTIFACT_ID" "$OLD_ARTIFACT_DIGEST" /tmp/old.zip _inputs/old
          verify_one "$USR1_ARTIFACT_ID" "$USR1_ARTIFACT_DIGEST" /tmp/usr1.zip _inputs/usr1
          verify_one "$V31_ARTIFACT_ID" "$V31_ARTIFACT_DIGEST" /tmp/v31.zip _inputs/v31
          python - <<'PY2'
          import hashlib,json,pathlib,os
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert h('_inputs/v2/code/historical_xg_fusion_v2.py')=='1e840d8d37a72761a269bfb80f7a4ce74c9b67344e6f6a5b2f3a87374c8f2d8b'
          assert h('_inputs/xg/code/historical_xg_challenger.py')=='588cad84f59e8a6b31297984c2c9015af5275f209dea8d4e3a3d71183e762ba2'
          assert h('_inputs/v1/pure_engine.py')=='cc2c2c3eca421ad6d277107b8f1212656b2e943cc179e7f394ac53e916c3f318'
          assert h('_inputs/old/understat_frozen.db')=='f102eae39b4036a4c24e5b75b9cee551064cf1e7d4fd028966cd62a5784d8681'
          assert h('_inputs/usr1/code/historical_fusion_v3_upset_safe.py')=='1707ad6b6e1339ac08b90038d595c1ea299ec4c92940643b6c404633a67c878b'
          assert h('_inputs/v31/code/historical_fusion_v3_1.py')=='59485a959940ad0e1f5357842731634acc88957dc1b7f8f029cf4cca8d05b402'
          m5=json.load(open('_inputs/v325art/artifact_manifest.json')); f5=json.load(open('_inputs/v325art/evidence/final_status.json'))
          assert m5['head']==os.environ['SEG5_HEAD'] and f5['status']=='V3_2_5_PREQUENTIAL_REGRET_FIREWALL_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT' and f5['2023_opened'] is False and f5['3504_opened'] is False
          m4=json.load(open('_inputs/v324art/artifact_manifest.json')); f4=json.load(open('_inputs/v324art/evidence/final_status.json'))
          assert m4['head']==os.environ['SEG4_HEAD'] and f4['status']=='V3_2_4_MINIMAL_BOUNDARY_PROJECTION_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT' and f4['2023_opened'] is False and f4['3504_opened'] is False
          PY2

      - name: Frozen V3.2.6 temporal-horizon consensus research
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_6_temporal_horizon_consensus
          D4=football-data/research/historical_fusion_v3_2_4_minimal_boundary_projection
          D3=football-data/research/historical_fusion_v3_2_3_temporal_transport
          rm -rf _run && mkdir _run
          python "$D/v3_2_6_segment6.py" \
            --contract "$D/V3_2_6_TEMPORAL_HORIZON_CONSENSUS_CONTRACT.json" \
            --v324-contract "$D4/V3_2_4_MINIMAL_BOUNDARY_PROJECTION_CONTRACT.json" --v324 "$D4/v3_2_4_segment4.py" \
            --v323-contract "$D3/V3_2_3_TEMPORAL_TRANSPORT_CONTRACT.json" --v323 "$D3/v3_2_3_segment3.py" \
            --v322 football-data/research/historical_fusion_v3_2_2_parity_boundary/v3_2_2_segment2.py \
            --v32dev football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair_execution/v3_2_development.py \
            --core football-data/research/historical_fusion_v3_2_three_fault_dynamic_joint_repair/v3_2_core.py \
            --v311 football-data/research/historical_fusion_v3_1_1_joint_score/historical_fusion_v3_1_1_joint_score.py \
            --v31 _inputs/v31/code/historical_fusion_v3_1.py --usr1 _inputs/usr1/code/historical_fusion_v3_upset_safe.py \
            --v2 _inputs/v2/code/historical_xg_fusion_v2.py --xg _inputs/xg/code/historical_xg_challenger.py \
            --v1 _inputs/v1/pure_engine.py --v1-result _inputs/v1/evidence/historical_oos_result.json \
            --db _inputs/old/understat_frozen.db --xg-identity _inputs/xg/data/XG_DATA_IDENTITY.json --out _run 2>&1 | tee /tmp/research_stdout.txt
          python - <<'PY2'
          import json
          f=json.load(open('_run/final_status.json'))
          allowed={'V3_2_6_TEMPORAL_HORIZON_CONSENSUS_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT','V3_2_6_TEMPORAL_HORIZON_CONSENSUS_2023_DIAGNOSTIC_FAILED_NO_RESCUE','V3_2_6_TEMPORAL_HORIZON_CONSENSUS_RESEARCH_CANDIDATE_READY_PROSPECTIVE_CONFIRMATION_REQUIRED'}
          assert f['status'] in allowed and f['research_only'] and f['post_view'] and not f['fresh_confirmation'] and not f['promotion_allowed']
          assert f['3504_opened'] is False and f['formal_v2_unchanged'] and f['v3_1_1_unchanged'] and not f['CURRENT_changed'] and not f['production_pointer_changed'] and not f['formal_enablement_changed'] and not f['formal_weights_changed']
          pre=json.load(open('_run/pre2023_row_receipt.json')); assert pre['max_source_season_loaded']==2022
          if f['status']=='V3_2_6_TEMPORAL_HORIZON_CONSENSUS_REJECTED_NO_RESCUE_ON_CONSUMED_DEVELOPMENT': assert f['2023_opened'] is False
          else: assert f['2023_opened'] is True
          PY2

      - name: Seal research artifact
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/research/historical_fusion_v3_2_6_temporal_horizon_consensus
          rm -rf _seal && mkdir -p _seal/contracts _seal/code _seal/evidence
          cp "$D/V3_2_6_TEMPORAL_HORIZON_CONSENSUS_CONTRACT.json" _seal/contracts/
          cp "$D/v3_2_6_segment6.py" "$D/test_v3_2_6_segment6.py" _seal/code/
          cp _run/*.json _seal/evidence/; cp /tmp/tests.txt /tmp/research_stdout.txt _seal/evidence/
          python - <<'PY2'
          import hashlib,json,os,pathlib
          r=pathlib.Path('_seal'); files={}
          for p in sorted(r.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files[p.relative_to(r).as_posix()]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          f=json.load(open('_run/final_status.json'))
          m={'schema_version':'football3-v3-2-6-artifact-v1','status':f['status'],'head':os.environ['GITHUB_SHA'],'segment5_head':os.environ['SEG5_HEAD'],'segment4_head':os.environ['SEG4_HEAD'],'segment3_science_head':os.environ['SEG3_SCIENCE_HEAD'],'v311_head':os.environ['V311_HEAD'],'formal_v2_head':os.environ['FORMAL_HEAD'],'contract_blob':os.environ['CONTRACT_BLOB'],'runner_blob':os.environ['RUNNER_BLOB'],'research_only':True,'post_view':True,'fresh_confirmation':False,'promotion_allowed':False,'2023_opened':f['2023_opened'],'3504_opened':False,'formal_v2_unchanged':True,'v3_1_1_unchanged':True,'CURRENT_changed':False,'production_pointer_changed':False,'formal_enablement_changed':False,'formal_weights_changed':False,'files':files}
          (r/'artifact_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY2

      - name: Upload V3.2.6 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-2-6-temporal-consensus-${{ github.sha }}-${{ github.run_id }}
          path: _seal
          if-no-files-found: error
          retention-days: 90

  remote-readback:
    needs: research-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download remote artifact and verify digest manifest payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.research-and-seal.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.research-and-seal.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"; got="$(printf '%s' "$meta" | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          python - "$got" "$ARTIFACT_DIGEST" <<'PY2'
          import sys
          norm=lambda s:s.split(':',1)[-1].lower(); assert norm(sys.argv[1])==norm(sys.argv[2])
          PY2
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/a.zip
          python - /tmp/a.zip "$ARTIFACT_DIGEST" <<'PY2'
          import hashlib,sys
          assert hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()==sys.argv[2].split(':',1)[-1].lower()
          PY2
          rm -rf /tmp/a && mkdir /tmp/a && unzip -q /tmp/a.zip -d /tmp/a
          python - <<'PY2'
          import hashlib,json,pathlib
          r=pathlib.Path('/tmp/a'); m=json.loads((r/'artifact_manifest.json').read_text())
          for rel,rec in m['files'].items():
              p=r/rel; assert p.exists(),rel; assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256']; assert p.stat().st_size==rec['bytes']
          f=json.loads((r/'evidence/final_status.json').read_text()); assert f['status']==m['status']; assert f['3504_opened'] is False
          print(json.dumps({'status':f['status'],'artifact_manifest_verified':True,'2023_opened':f['2023_opened']},sort_keys=True))
          PY2
