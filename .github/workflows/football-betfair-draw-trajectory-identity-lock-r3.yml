name: Football Betfair Draw Trajectory Identity Lock R3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/betfair-draw-trajectory-pilot-run-r2

permissions:
  contents: read

jobs:
  freeze-before-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify scripts
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/betfair_draw_trajectory_pilot_r1/diagnose_coverage_r3a.py
          python -m py_compile football-data/research/betfair_draw_trajectory_pilot_r1/freeze_identity_lock_r3.py
      - name: Checkout pinned public source without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git -c credential.helper= clone --filter=blob:none --no-checkout https://github.com/marcosf63/bet.git source-public
          git -C source-public checkout --detach 90f818e2ad78aa3c624a0fe251c3e60fcfb0ccff
      - name: Freeze exact 63 identities before labels
        run: |
          set -euo pipefail
          mkdir -p artifacts/research/betfair_draw_trajectory_identity_lock_r3
          python football-data/research/betfair_draw_trajectory_pilot_r1/freeze_identity_lock_r3.py --source-checkout source-public --output artifacts/research/betfair_draw_trajectory_identity_lock_r3/identity_lock.json
      - name: Verify zero-label lock boundary
        if: always()
        run: |
          set -euo pipefail
          rm -rf source-public
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/research/betfair_draw_trajectory_identity_lock_r3/identity_lock.json').read_text())
          assert r['status']=='LOCKED_BEFORE_WINNER_LABEL_ACCESS' and r['eligible_count']==63
          assert r['winner_labels_read']==0 and r['post_kickoff_messages_parsed']==0
          assert r['model_fits']==0 and r['thresholds_selected']==0 and r['formal_weight']==0
          assert r['formal_model_changes']==r['formal_data_changes']==r['formal_config_changes']==r['CURRENT_changes']==0
          PY
      - name: Upload anonymous identity lock only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-betfair-draw-trajectory-identity-lock-r3-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/research/betfair_draw_trajectory_identity_lock_r3/identity_lock.json
          if-no-files-found: error
          retention-days: 30
