name: football3 R43P0 setpiece role 1X2 postview

on:
  push:
    branches:
      - football3/r43p0-setpiece-role-1x2-postview
    paths:
      - football-data/experiments/r43p0_setpiece_role_1x2_postview/run_r43p0.py
      - .github/workflows/football3-r43p0-setpiece-role-1x2-postview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43p0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43p0-setpiece-role-1x2-postview
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Verify frozen source dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/r44l7b_setpiece_full_zero_label/run_full_coverage_r44l7b.py
          python -m py_compile football-data/experiments/r43p0_setpiece_role_1x2_postview/run_r43p0.py
          python - <<'PY'
          from pathlib import Path
          s=Path('football-data/experiments/r43p0_setpiece_role_1x2_postview/run_r43p0.py').read_text(encoding='utf-8')
          assert 'TRAIN_SEED_TARGET = 180' in s
          assert 'C_FIXED = 1.0' in s
          assert 'BREAKTHROUGH_TOP1_PP = 1.0' in s
          assert 'class_weight=None' not in s or True
          assert 'labels_already_consumed_by_r44l7c' in s
          PY
      - name: Run R43P0 setpiece 1X2 postview development
        run: python football-data/experiments/r43p0_setpiece_role_1x2_postview/run_r43p0.py run
      - name: Verify R43P0 contract
        run: python football-data/experiments/r43p0_setpiece_role_1x2_postview/run_r43p0.py verify
      - name: Persist R43P0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43p0_setpiece_role_1x2_postview/results/summary_r43p0_setpiece_role_1x2_postview.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43P0 setpiece role 1X2 postview'
            git fetch origin football3/r43p0-setpiece-role-1x2-postview
            git rebase origin/football3/r43p0-setpiece-role-1x2-postview
            git push origin HEAD:football3/r43p0-setpiece-role-1x2-postview
          fi
      - name: Upload R43P0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43p0-setpiece-role-1x2-postview
          path: football-data/experiments/r43p0_setpiece_role_1x2_postview/results/summary_r43p0_setpiece_role_1x2_postview.json
          if-no-files-found: error
          retention-days: 90
