name: Football Fear-of-Draw Mispricing R1

on:
  push:
    branches:
      - research/fear-draw-markov-ordered-mispricing-r1
    paths:
      - '.github/workflows/football-fear-draw-mispricing-r1.yml'
      - 'football-data/research/fear_draw_mispricing_r1/**'
  pull_request:
    branches:
      - research/gold1000-r1-data-audit
    paths:
      - '.github/workflows/football-fear-draw-mispricing-r1.yml'
      - 'football-data/research/fear_draw_mispricing_r1/**'

permissions:
  contents: read

concurrency:
  group: fear-draw-mispricing-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrospective-method-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Compile evaluator
        run: |
          python -m py_compile football-data/research/fear_draw_mispricing_r1/run_markov_ordered_mispricing_r1.py
          python -m json.tool football-data/research/fear_draw_mispricing_r1/preregistration.json >/dev/null
      - name: Run retrospective method-class replication
        env:
          CHECKED_OUT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKED_OUT_HEAD"
          rm -rf artifacts/research/fear_draw_mispricing_r1
          python football-data/research/fear_draw_mispricing_r1/run_markov_ordered_mispricing_r1.py \
            --repo-root . \
            --prereg football-data/research/fear_draw_mispricing_r1/preregistration.json \
            --out artifacts/research/fear_draw_mispricing_r1
      - name: Verify result boundary and exact head
        env:
          CHECKED_OUT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/research/fear_draw_mispricing_r1/result.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['checked_out_head']==os.environ['CHECKED_OUT_HEAD']
          assert r['formal_weight']==0
          assert r['formal_promotion'] is False
          assert r['method_class_replication_not_exact_paper_replication'] is True
          assert r['test_is_new_blind_holdout'] is False
          assert r['hard_limits']['provider_api_calls']==0
          assert r['hard_limits']['current_rule_mutation']==0
          assert r['hard_limits']['formal_model_data_config_mutation']==0
          assert r['status'] in {
              'PASS_RETROSPECTIVE_DRAW_MISPRICING_SCREEN_R1',
              'FAIL_RETROSPECTIVE_DRAW_MISPRICING_SCREEN_R1'
          }
          print(json.dumps({
              'status':r['status'],
              'draw_gate_pass':r['primary_draw_gate_pass'],
              'draw_policy':r['selected_policy']['D'],
              'draw_test':r['test_betting_results']['D'],
              'test_metrics':r['probability_metrics']['test'],
          },ensure_ascii=False))
          PY
      - name: Confirm no protected formal asset changes
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','research/gold1000-r1-data-audit...HEAD'],text=True).splitlines()
          allowed=(
              '.github/workflows/football-fear-draw-mispricing-r1.yml',
              'football-data/research/fear_draw_mispricing_r1/preregistration.json',
              'football-data/research/fear_draw_mispricing_r1/run_markov_ordered_mispricing_r1.py',
          )
          assert sorted(changed)==sorted(allowed), changed
          print({'changed':changed,'formal_asset_changes':0})
          PY
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-fear-draw-mispricing-r1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/research/fear_draw_mispricing_r1/
          if-no-files-found: error
          retention-days: 30
