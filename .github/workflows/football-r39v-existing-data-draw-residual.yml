name: Football R39V Existing Data Draw Residual

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/football-r39v-existing-data-draw-residual.yml'
      - 'football-data/research/existing_data_draw_residual_r39v/**'

permissions:
  contents: read

jobs:
  disjoint-fixed100-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify R39V preregistration and frozen R39U dependency
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/existing_data_draw_residual_r39v/evaluate_r39v.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path('football-data/research/existing_data_draw_residual_r39v/preregistration_r39v.json').read_text())
          assert p['schema_version']=='R39V-EXISTING-DATA-DRAW-RESIDUAL-1.0'
          assert p['sample']['size']==100
          assert p['sample']['required_overlap_with_r39u']==0
          assert p['algorithm']['candidate_k']==[15,25,50]
          assert p['algorithm']['abstention'] is False
          assert p['algorithm']['manual_draw_boost'] is False
          assert p['algorithm']['post_discovery_tuning_on_r39v'] is False
          h=p['hard_boundaries']
          assert h['external_network_requests']==0 and h['football_api_requests']==0
          assert h['new_data_collection'] is False
          assert h['formal_model_mutation'] is False and h['formal_data_mutation'] is False
          assert h['current_rule_mutation'] is False and h['main_mutation'] is False
          got=subprocess.check_output(['git','rev-parse','HEAD:football-data/research/existing_data_analog_r39u/evaluate_analog_r39u.py'],text=True).strip()
          assert got=='16bdecdd508b780318628ec58224168dfa849e99', got
          print('PASS_R39V_PREREG_AND_R39U_DEPENDENCY')
          PY

      - name: Execute disjoint fixed100 replication
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r39v-output"
          python football-data/research/existing_data_draw_residual_r39v/evaluate_r39v.py \
            --prereg football-data/research/existing_data_draw_residual_r39v/preregistration_r39v.json \
            --root . \
            --out "$RUNNER_TEMP/r39v-output"

      - name: Verify R39V result and hard boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r39v-output'
          p=root/'r39v_result.json'; raw=p.read_bytes(); r=json.loads(raw)
          assert r['terminal'] in {'PASS_R39V_INVERSE_DRAW_RANKING_REPLICATED','FAIL_R39V_INVERSE_DRAW_RANKING_NOT_REPLICATED'}
          assert len(r['sample_keys'])==100 and len(set(r['sample_keys']))==100
          assert r['r39u_overlap']==0
          assert set(r['diagnostics'])=={'15','25','50'}
          for k,d in r['diagnostics'].items():
              assert 0<=d['base_draw_auc']<=1 and 0<=d['inverse_draw_auc']<=1
              m=d['base_metrics']; assert m['n']==100
              assert sum(m['predicted_counts'].values())==100
              assert sum(m['actual_counts'].values())==100
          h=r['hard_boundaries']
          assert h['external_network_requests']==0 and h['football_api_requests']==0
          assert h['new_data_collection'] is False and h['main_mutation'] is False
          want=(root/'r39v_result.sha256').read_text().strip()
          assert want==hashlib.sha256(raw).hexdigest()
          print(json.dumps({'terminal':r['terminal'],'replicated':r['replicated'],'sample_sha':r['r39v_fixed100_identity_sha256'],'diagnostics':r['diagnostics'],'gate':r['gate']},indent=2))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r39v-existing-data-draw-residual-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39v-output
          retention-days: 30
          if-no-files-found: error
