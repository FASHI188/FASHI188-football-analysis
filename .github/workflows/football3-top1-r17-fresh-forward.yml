name: football3 Top1 R17 fresh forward confirmation

on:
  push:
    branches:
      - football3/top1-r17-fresh-forward-20260705
    paths:
      - football-data/experiments/top1_r17_fresh_forward/run_experiment_r17.py
      - football-data/experiments/top1_r17_fresh_forward/diagnose_r17.py
      - .github/workflows/football3-top1-r17-fresh-forward.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r17-fresh-forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R17 branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r17-fresh-forward-20260705
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Run locked models on fresh post-July-4 Understat cohort
        run: python football-data/experiments/top1_r17_fresh_forward/diagnose_r17.py
      - name: Persist compact diagnostic on failure
        if: failure()
        run: |
          if [ -f football-data/experiments/top1_r17_fresh_forward/data/diagnostic_r17.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add football-data/experiments/top1_r17_fresh_forward/data/diagnostic_r17.json
            git commit -m '[diagnostic top1-r17] persist compact failure reason' || true
            git push origin HEAD:football3/top1-r17-fresh-forward-20260705
          fi
      - name: Verify R17 fresh-forward contract
        run: python football-data/experiments/top1_r17_fresh_forward/run_experiment_r17.py verify
      - name: Persist fresh cohort and result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r17_fresh_forward/data/fresh_cohort_r17.json football-data/experiments/top1_r17_fresh_forward/results/summary_r17.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r17] persist fresh forward confirmation'
            git push origin HEAD:football3/top1-r17-fresh-forward-20260705
          fi
      - name: Upload immutable R17 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r17-fresh-forward
          path: |
            football-data/experiments/top1_r17_fresh_forward/data/fresh_cohort_r17.json
            football-data/experiments/top1_r17_fresh_forward/results/summary_r17.json
          if-no-files-found: error
          retention-days: 90
