name: Football V5.1 Historical Blind Context Screen10 R29

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "football-data/config/v511_historical_blind_context_screen10_r29.json"
      - "football-data/validation/build_v511_historical_blind_context_screen10_r29.py"
      - "football-data/validation/evaluate_v511_market_draw_screen10_r22.py"
      - "football-data/processed/**/*.csv"
      - ".github/workflows/football-v511-historical-blind-context-screen10-r29.yml"

permissions:
  contents: read

concurrency:
  group: football-v511-historical-blind-context-screen10-r29-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-blind-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.16.3
      - name: Compile R22 and R29
        run: |
          python -m py_compile football-data/validation/evaluate_v511_market_draw_screen10_r22.py
          python -m py_compile football-data/validation/build_v511_historical_blind_context_screen10_r29.py
      - name: Run R29 self-test
        run: python football-data/validation/build_v511_historical_blind_context_screen10_r29.py --self-test
      - name: Build fixed blind packet
        run: python football-data/validation/build_v511_historical_blind_context_screen10_r29.py
      - name: Validate blind isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('football-data/manifests/v511_historical_blind_context_screen10_r29_status.json').read_text(encoding='utf-8'))
          public=json.loads(Path('football-data/manifests/v511_historical_blind_context_screen10_r29_public.json').read_text(encoding='utf-8'))
          hidden=json.loads(Path('football-data/manifests/v511_historical_blind_context_screen10_r29_hidden_labels.json').read_text(encoding='utf-8'))
          assert status['status']=='PASS_R29_FIXED_SAMPLE_BLIND_PACKET_BUILT'
          assert status['pairs']==10
          assert status['public_candidates']==20
          assert status['public_packet_contains_score_fields'] is False
          assert status['public_packet_contains_label_fields'] is False
          assert len(public['pairs'])==10
          assert len(hidden['labels'])==10
          assert status['label_seal_sha256']==public['label_seal_sha256']
          assert status['ruling']['resampling_allowed'] is False
          assert status['ruling']['pass_pairs']==6
          assert status['hard_limits']['model_training_performed'] is False
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
      - name: Upload R29 packet
        uses: actions/upload-artifact@v4
        with:
          name: v511-historical-blind-context-screen10-r29
          path: |
            football-data/manifests/v511_historical_blind_context_screen10_r29_status.json
            football-data/manifests/v511_historical_blind_context_screen10_r29_public.json
            football-data/manifests/v511_historical_blind_context_screen10_r29_public.csv
            football-data/manifests/v511_historical_blind_context_screen10_r29_hidden_labels.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no repository persistence
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git diff --cached --name-only)"
