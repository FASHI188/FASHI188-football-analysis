name: football3 Top1 R11 draw logit shift diagnostic

on:
  push:
    branches:
      - football3/top1-r11-draw-logit-shift
    paths:
      - football-data/experiments/top1_r11_draw_shift/run_experiment_r11.py
      - .github/workflows/football3-top1-r11-draw-logit-shift.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r11-draw-logit-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R11 branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r11-draw-logit-shift
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Rebuild exact R9b snapshot through R10 hash gate
        run: python football-data/experiments/top1_r11_draw_shift/run_experiment_r11.py freeze
      - name: Select draw shift on validation and score test
        run: python football-data/experiments/top1_r11_draw_shift/run_experiment_r11.py run
      - name: Verify R11 selection and no-market contract
        run: python football-data/experiments/top1_r11_draw_shift/run_experiment_r11.py verify
      - name: Persist R11 manifest and result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r11_draw_shift/data/source_manifest_r11.json football-data/experiments/top1_r11_draw_shift/results/summary_r11.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r11] persist draw-shift diagnostic result'
            git push origin HEAD:football3/top1-r11-draw-logit-shift
          fi
      - name: Upload immutable R11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r11-draw-logit-shift
          path: |
            football-data/experiments/top1_r11_draw_shift/data/source_manifest_r11.json
            football-data/experiments/top1_r11_draw_shift/results/summary_r11.json
          if-no-files-found: error
          retention-days: 30