name: Football V6.50.0 KL-Coherent Joint Matrix Challenge

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_kl_joint_projection_v6500.py"
      - ".github/workflows/football-v6500-kl-joint-projection.yml"

permissions:
  contents: write

concurrency:
  group: football-v6500-kl-joint-projection
  cancel-in-progress: false

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile KL challenge
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python -m py_compile football-data/validation/v6_kl_joint_projection_v6500.py
      - name: Freeze or settle prospective KL-coherent matrices
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_kl_joint_projection_v6500.py
      - name: Persist only KL challenge ledger and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_kl_joint_projection_v6500_freeze.json \
            --allow-prefix football-data/forward/v6_kl_joint_projection_events_v6500.json \
            --allow-prefix football-data/manifests/v6_kl_joint_projection_v6500_status.json \
            --message-prefix "audit(football): persist V6.50.0 KL-coherent joint matrix challenge"
      - name: Hard KL governance and convergence guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_kl_joint_projection_v6500_status.json')
          if not p.exists(): raise SystemExit('KL status missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          if x.get('status') != 'PASS': raise SystemExit(str(x))
          g=x.get('governance') or {}
          if g.get('source_probability_mutation') is not False: raise SystemExit('source probability mutation forbidden')
          if g.get('source_matrix_mutation') is not False: raise SystemExit('source matrix mutation forbidden')
          if g.get('selector_mutation') is not False: raise SystemExit('selector mutation forbidden')
          if g.get('historical_backfill') is not False: raise SystemExit('historical backfill forbidden')
          if g.get('formal_weight') != 0: raise SystemExit('formal weight must remain zero')
          if g.get('automatic_promotion') is not False or g.get('current_rule_change') is not False: raise SystemExit('automatic promotion/CURRENT change forbidden')
          d=x.get('projection_diagnostics') or {}
          if d.get('count',0) and d.get('all_converged') is not True: raise SystemExit('projection convergence failed')
          if float(d.get('max_total_constraint_residual') or 0.0) > 1e-9: raise SystemExit('total constraint residual failed')
          if float(d.get('max_result_constraint_residual') or 0.0) > 1e-9: raise SystemExit('result constraint residual failed')
          if float(d.get('max_probability_sum_residual') or 0.0) > 1e-9: raise SystemExit('probability conservation failed')
          print(json.dumps({
            'prediction_scan':x.get('prediction_scan'),
            'settlement_scan':x.get('settlement_scan'),
            'projection_diagnostics':d,
            'evaluation':x.get('evaluation')
          },ensure_ascii=False))
          PY

# Research-only challenge. V6.49.2 remains the unique active forward chain.
# This workflow can only append prospective KL projections and matching source-settlement receipts.
