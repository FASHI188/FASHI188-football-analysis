name: Football V6.50.0 KL-Coherent Joint Matrix Challenge

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_kl_joint_projection_v6500.py"
      - "football-data/validation/v6_kl_shape_audit_v6502.py"
      - ".github/workflows/football-v6500-kl-joint-projection.yml"

permissions:
  contents: write

concurrency:
  group: football-v6500-kl-joint-projection
  cancel-in-progress: false

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile KL challenge and shape audit
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python -m py_compile football-data/validation/v6_kl_joint_projection_v6500.py
          python -m py_compile football-data/validation/v6_kl_shape_audit_v6502.py
      - name: Freeze or settle prospective KL-coherent matrices
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_kl_joint_projection_v6500.py
      - name: Independently audit projected score-shape and constraints
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_kl_shape_audit_v6502.py
      - name: Persist only KL challenge ledger and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_kl_joint_projection_v6500_freeze.json \
            --allow-prefix football-data/forward/v6_kl_joint_projection_events_v6500.json \
            --allow-prefix football-data/manifests/v6_kl_joint_projection_v6500_status.json \
            --allow-prefix football-data/manifests/v6_kl_shape_audit_v6502_status.json \
            --message-prefix "audit(football): persist V6.50.2 KL shape and V6.50.0 joint matrix"
      - name: Hard KL governance convergence and shape guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_kl_joint_projection_v6500_status.json')
          s=Path('football-data/manifests/v6_kl_shape_audit_v6502_status.json')
          if not p.exists() or not s.exists(): raise SystemExit('KL or shape status missing')
          x=json.loads(p.read_text(encoding='utf-8')); q=json.loads(s.read_text(encoding='utf-8'))
          if x.get('status') != 'PASS' or q.get('status') != 'PASS': raise SystemExit('KL/shape status failed')
          g=x.get('governance') or {}; sg=q.get('governance') or {}
          if g.get('source_probability_mutation') is not False or g.get('source_matrix_mutation') is not False or g.get('selector_mutation') is not False: raise SystemExit('source mutation forbidden')
          if g.get('historical_backfill') is not False or g.get('formal_weight') != 0 or g.get('automatic_promotion') is not False or g.get('current_rule_change') is not False: raise SystemExit('KL governance failed')
          if sg.get('probability_mutation') is not False or sg.get('matrix_mutation') is not False or sg.get('formal_weight') != 0: raise SystemExit('shape audit mutation forbidden')
          d=x.get('projection_diagnostics') or {}; ca=q.get('constraint_audit') or {}
          if d.get('count',0) and d.get('all_converged') is not True: raise SystemExit('projection convergence failed')
          if float(d.get('max_total_constraint_residual') or 0.0) > 1e-9 or float(d.get('max_result_constraint_residual') or 0.0) > 1e-9 or float(d.get('max_probability_sum_residual') or 0.0) > 1e-9: raise SystemExit('KL residual failed')
          if float(ca.get('max_total_delta_from_f06') or 0.0) > 1e-9 or float(ca.get('max_result_delta_from_f05') or 0.0) > 1e-9: raise SystemExit('shape constraint cross-check failed')
          if q.get('prediction_count') != d.get('count'): raise SystemExit('shape count mismatch')
          print(json.dumps({'prediction_scan':x.get('prediction_scan'),'settlement_scan':x.get('settlement_scan'),'projection_diagnostics':d,'score_shape':q.get('score_shape'),'evaluation':x.get('evaluation')},ensure_ascii=False))
          PY

# Research-only challenge. V6.49.2 remains the unique active forward chain.
# V6.50.2 is an independent audit only and cannot mutate the projected or source matrices.
