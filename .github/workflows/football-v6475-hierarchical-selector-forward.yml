name: Football V6.47.5 Hierarchical Selector Forward

on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_hierarchical_selector_forward_v6475.py"
      - "football-data/validation/evaluate_hierarchical_market_selector_v6474.py"
      - "football-data/manifests/v6_hierarchical_market_selector_v6474_status.json"
      - "football-data/forward/v6_market_first_events_v651.json"
      - "football-data/forward/inbox/market_first_results_v651.json"
      - ".github/workflows/football-v6475-hierarchical-selector-forward.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: football-v6475-hierarchical-selector-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile football-data/validation/evaluate_hierarchical_market_selector_v6474.py football-data/validation/v6_hierarchical_selector_forward_v6475.py
      - name: Run no-backfill prospective selector
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_hierarchical_selector_forward_v6475.py
      - name: Persist prospective selector state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            football-data/manifests/v6_hierarchical_selector_forward_v6475_freeze.json \
            football-data/forward/v6_hierarchical_selector_events_v6475.json \
            football-data/manifests/v6_hierarchical_selector_forward_v6475_status.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.47.5 hierarchical selector forward state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
