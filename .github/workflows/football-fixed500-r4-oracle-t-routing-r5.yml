name: Football Fixed500 R4 Oracle-T Routing R5

on:
  push:
    branches: ["research/fixed500-existing-market-t-r1"]
    paths:
      - "football-data/validation/diagnose_fixed500_r4_oracle_t_routing_r5.py"
      - ".github/workflows/football-fixed500-r4-oracle-t-routing-r5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/fixed500-existing-market-t-r1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile
        run: python -m py_compile football-data/validation/diagnose_fixed500_r4_oracle_t_routing_r5.py
      - name: Rebuild audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run same-fixed500 R5 oracle routing diagnostic
        run: python football-data/validation/diagnose_fixed500_r4_oracle_t_routing_r5.py
      - name: Verify diagnostic boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/fixed500_r4_oracle_t_routing_r5.json').read_text(encoding='utf-8'))
          assert x['sample']['parent_fixed500_n']==500
          assert x['sample']['synchronized_cohort_n']==220
          assert x['sample']['actual_draws_full_220']==64
          assert x['sample']['parity_diagnostic_T0_6_n'] > 0
          assert x['sample']['parity_diagnostic_actual_draws'] + x['sample']['excluded_T7plus_draws'] == 64
          assert x['sample']['new_sample_consumed'] is False
          assert x['sample']['latest_position4_confirmation_opened'] is False
          assert x['architecture']['manual_threshold'] is False
          assert x['architecture']['forced_draw'] is False
          assert x['interpretation_guard']['oracle_information_used'] is True
          assert x['interpretation_guard']['formal_performance_claim'] is False
          assert x['governance']['post_result_threshold_search'] is False
          assert x['governance']['new_data_collection'] is False
          print(json.dumps({'verdict':x['scientific_verdict'],'sample':x['sample'],'draw_ranking':x['draw_ranking'],'guard':x['interpretation_guard']},ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixed500-r4-oracle-t-routing-r5
          path: |
            football-data/manifests/fixed500_r4_oracle_t_routing_r5.json
            football-data/manifests/fixed500_r4_oracle_t_routing_r5_rows.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no tracked runtime mutation
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
