name: football3 trial7 R42K pseudo-prematch
on:
  push:
    branches: [football3/trial7-r42h-pseudoprematch-20260828]
    paths:
      - 'football-data/experiments/trial7_r42k_pseudoprematch_20260828/**'
      - '.github/workflows/football3-trial7-r42k-pseudoprematch-20260828.yml'
permissions:
  contents: write
jobs:
  trial7:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/trial7-r42h-pseudoprematch-20260828
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k spine
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run result-blinded seven-match replay
        run: python football-data/experiments/trial7_r42k_pseudoprematch_20260828/run_trial7_r42k.py run
      - name: Verify trial contract
        run: python football-data/experiments/trial7_r42k_pseudoprematch_20260828/run_trial7_r42k.py verify
      - name: Persist immutable trial predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/trial7_r42k_pseudoprematch_20260828/results/trial7_r42k_pseudoprematch_predictions.json
          if git diff --cached --quiet; then
            echo 'No prediction changes to commit'
          else
            git commit -m '[locked] football3 trial7 R42K result-blinded pseudo-prematch predictions'
            git push origin HEAD:football3/r43-trial7-r42h-pseudoprematch-20260828 || git push origin HEAD:football3/trial7-r42h-pseudoprematch-20260828
          fi
      - name: Upload trial artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-trial7-r42k-pseudoprematch-20260828
          path: football-data/experiments/trial7_r42k_pseudoprematch_20260828/results/trial7_r42k_pseudoprematch_predictions.json
          retention-days: 90
