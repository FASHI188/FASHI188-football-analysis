name: football3 one-off Anyang vs Incheon pure-model frozen inference r1

on:
  push:
    branches:
      - football3/once-anyang-incheon-20260826-r1
    paths:
      - .github/workflows/football3-once-anyang-incheon-20260826-r1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: football-data/engine
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze completed K League results through 2026-08-25
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          path = Path('football-data/processed/KOR_KLeague1/official_results.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig', newline='')))
          fieldnames = list(rows[0].keys())
          base_2026 = [r for r in rows if r['season'] == '2026']
          assert len(base_2026) == 120, len(base_2026)
          assert max(r['Date'] for r in base_2026) == '2026-07-26'

          matches = [
            ('2026-08-01','19:30','강원','부천',0,3,21),
            ('2026-08-01','19:30','전북','서울',0,0,21),
            ('2026-08-01','19:30','포항','김천',0,1,21),
            ('2026-08-02','19:30','대전','광주',2,0,21),
            ('2026-08-02','19:30','제주','인천',3,3,21),
            ('2026-08-02','19:30','울산','안양',3,1,21),
            ('2026-08-08','20:00','김천','서울',0,0,22),
            ('2026-08-08','20:00','포항','울산',0,2,22),
            ('2026-08-08','20:00','전북','제주',1,3,22),
            ('2026-08-08','20:00','안양','대전',1,2,22),
            ('2026-08-08','20:00','부천','광주',0,0,22),
            ('2026-08-15','19:30','서울','대전',4,2,23),
            ('2026-08-15','19:30','광주','포항',1,2,23),
            ('2026-08-15','19:30','제주','안양',2,0,23),
            ('2026-08-16','19:30','부천','전북',3,2,23),
            ('2026-08-16','19:30','인천','김천',1,1,23),
            ('2026-08-16','19:30','울산','강원',2,3,23),
            ('2026-08-22','19:30','부천','포항',3,0,24),
            ('2026-08-22','19:30','제주','김천',0,0,24),
            ('2026-08-22','19:30','전북','울산',1,0,24),
            ('2026-08-22','19:30','안양','서울',0,7,24),
            ('2026-08-23','19:30','광주','인천',0,1,24),
            ('2026-08-23','19:30','대전','강원',3,0,24),
            ('2026-08-25','19:30','서울','부천',1,0,25),
            ('2026-08-25','19:30','김천','전북',0,0,25),
            ('2026-08-25','19:30','제주','포항',1,2,25),
          ]
          existing = {(r['Date'], r['HomeTeam'], r['AwayTeam']) for r in rows}
          added = []
          next_id = max(int(r['game_id']) for r in base_2026 if r['game_id'].isdigit()) + 1
          for date, time, home, away, hg, ag, rnd in matches:
            key = (date, home, away)
            if key in existing:
              continue
            ftr = 'H' if hg > ag else 'D' if hg == ag else 'A'
            row = {k: '' for k in fieldnames}
            row.update({
              'competition_id':'KOR_KLeague1','season':'2026','source_season':'2026',
              'stage':'regular_rounds_1_33','source_code':'frozen_pre_kickoff_crosscheck_20260826',
              'Date':date,'Time':time,'HomeTeam':home,'AwayTeam':away,
              'FTHG':str(hg),'FTAG':str(ag),'FTR':ftr,'game_id':str(next_id),
              'meet_name':'하나은행 K리그1 2026','round':str(rnd),'venue':''
            })
            rows.append(row); added.append(row); existing.add(key); next_id += 1

          assert len(added) == 26, len(added)
          final_2026 = [r for r in rows if r['season'] == '2026']
          assert len(final_2026) == 146, len(final_2026)
          assert max(r['Date'] for r in final_2026) == '2026-08-25'
          assert all(r['Date'] < '2026-08-26' for r in added)

          anyang = [r for r in final_2026 if r['HomeTeam']=='안양' or r['AwayTeam']=='안양']
          incheon = [r for r in final_2026 if r['HomeTeam']=='인천' or r['AwayTeam']=='인천']
          assert len(anyang) == 24 and len(incheon) == 22, (len(anyang), len(incheon))

          with path.open('w', encoding='utf-8', newline='') as fh:
            w = csv.DictWriter(fh, fieldnames=fieldnames)
            w.writeheader(); w.writerows(rows)
          Path('/tmp/anyang_incheon_pre_kickoff_backfill.json').write_text(json.dumps({
            'status':'FROZEN_PRE_KICKOFF_BACKFILL',
            'base_2026_rows':120,'added_completed_rows':26,'final_2026_rows':146,
            'max_result_date':'2026-08-25','target_match_date':'2026-08-26',
            'postponed_excluded':'2026-08-08 Gangwon-Incheon -> 2026-09-27',
            'anyang_history_rows':len(anyang),'incheon_history_rows':len(incheon),
            'pure_model_input':True,'market_snapshot_used':False,'odds_used':False,
            'manual_probability_adjustment':False,'added_rows':added
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FROZEN_BACKFILL_OK base=120 added=26 final=146 anyang=24 incheon=22')
          PY

      - name: Write pure-model strictly pre-kickoff input
        run: |
          cat > /tmp/anyang_incheon_input.json <<'JSON'
          {
            "competition_id": "KOR_KLeague1",
            "season": "2026",
            "home_team": "안양",
            "away_team": "인천",
            "cutoff_utc": "2026-08-26T10:25:00Z"
          }
          JSON

      - name: Run CURRENT universal router
        run: |
          test -f football-data/engine/run_universal_prediction_candidate_v1.py
          python football-data/engine/run_universal_prediction_candidate_v1.py \
            --input /tmp/anyang_incheon_input.json \
            --output /tmp/anyang_incheon_output.json
          cat /tmp/anyang_incheon_output.json

      - name: Assert pure formal route and fresh pre-kickoff history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inp = json.loads(Path('/tmp/anyang_incheon_input.json').read_text(encoding='utf-8'))
          p = json.loads(Path('/tmp/anyang_incheon_output.json').read_text(encoding='utf-8'))
          if 'market_snapshot' in inp:
              raise SystemExit('market snapshot unexpectedly present')
          route = p.get('universal_router') or {}
          if route.get('route') != 'FORMAL_V460' or route.get('downgraded'):
              raise SystemExit(f'formal route not reached: {route}')
          if int(p.get('history_matches', -1)) != 146:
              raise SystemExit(f"unexpected history_matches={p.get('history_matches')}")
          probs = p.get('probabilities') or {}
          one = probs.get('one_x_two') or p.get('one_x_two')
          if one is None or abs(sum(float(v) for v in one.values()) - 1.0) > 1e-9:
              raise SystemExit(f'bad 1X2: {one}')
          team_sample = p.get('team_sample') or {}
          if float(team_sample.get('home_raw_matches', 0)) <= 0 or float(team_sample.get('away_raw_matches', 0)) <= 0:
              raise SystemExit(f'target venue samples missing: {team_sample}')
          top = p.get('top_scores') or []
          if not top:
              raise SystemExit('top_scores missing')
          print('ROUTE=', json.dumps(route, ensure_ascii=False, sort_keys=True))
          print('PURE_MODEL_1X2=', json.dumps(one, ensure_ascii=False, sort_keys=True))
          print('TOP_SCORES=', json.dumps(top[:10], ensure_ascii=False))
          print('TEAM_SAMPLE=', json.dumps(team_sample, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload immutable inference output
        uses: actions/upload-artifact@v4
        with:
          name: football3-anyang-incheon-20260826-pure-model-frozen-r1
          path: |
            /tmp/anyang_incheon_input.json
            /tmp/anyang_incheon_output.json
            /tmp/anyang_incheon_pre_kickoff_backfill.json
          if-no-files-found: error
          retention-days: 30
