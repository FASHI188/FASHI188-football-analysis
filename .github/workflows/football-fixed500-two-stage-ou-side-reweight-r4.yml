name: Football Fixed500 Two-Stage OU Side Reweight R4

on:
  push:
    branches: ["research/fixed500-existing-market-t-r1"]
    paths:
      - "football-data/validation/diagnose_fixed500_two_stage_ou_side_reweight_r4.py"
      - ".github/workflows/football-fixed500-two-stage-ou-side-reweight-r4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-fixed500-two-stage-ou-side-reweight-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/fixed500-existing-market-t-r1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile
        run: python -m py_compile football-data/validation/diagnose_fixed500_two_stage_ou_side_reweight_r4.py
      - name: Rebuild audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run same-fixed500 two-stage end-to-end reweight test
        run: python football-data/validation/diagnose_fixed500_two_stage_ou_side_reweight_r4.py
      - name: Verify hard boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/fixed500_two_stage_ou_side_reweight_r4.json').read_text(encoding='utf-8'))
          assert x['sample']['parent_fixed500_n']==500
          assert x['sample']['synchronized_cohort_n']==220
          assert x['sample']['new_sample_consumed'] is False
          assert x['sample']['latest_position4_confirmation_opened'] is False
          assert x['architecture']['inference_uses_realized_T'] is False
          assert x['architecture']['manual_threshold'] is False
          assert x['architecture']['forced_draw'] is False
          assert x['decision_checks']['T_marginal_identical_by_construction'] is True
          assert x['decision_checks']['conditional_probability_conservation_max_residual'] < 1e-12
          assert x['interpretation_guard']['formal_PIT_claim'] is False
          assert x['interpretation_guard']['end_to_end_inference_uses_true_result_or_true_T'] is False
          assert x['governance']['provider_requests']==0
          assert x['governance']['new_data_collection'] is False
          print(json.dumps({
            'verdict':x['scientific_verdict'],
            'sample':x['sample'],
            'total':x['total_layer'],
            'hda':x['metrics']['hda'],
            'draw_probability':x['metrics']['draw_probability'],
            'exact_score':x['metrics']['exact_score'],
            'draw_diagnostics':x['draw_diagnostics'],
            'decision_checks':x['decision_checks'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixed500-two-stage-ou-side-reweight-r4
          path: |
            football-data/manifests/fixed500_two_stage_ou_side_reweight_r4.json
            football-data/manifests/fixed500_two_stage_ou_side_reweight_r4_rows.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no tracked runtime mutation
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
