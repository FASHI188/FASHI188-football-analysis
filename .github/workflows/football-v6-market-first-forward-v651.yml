name: football-v6-market-first-forward-v651
on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"
  push:
    paths:
      - "football-data/validation/v6_market_first_forward_v651.py"
      - "football-data/validation/v6_market_first_forward_v652.py"
      - "football-data/validation/v6_market_first_forward_readiness_v651.py"
      - "football-data/validation/v6_market_first_forward_inventory_v652.py"
      - "football-data/validation/v6_correct_score_market_forward_v6215.py"
      - ".github/workflows/football-v6-market-first-forward-v651.yml"
      - "football-data/evidence/markets_prospective/**"
permissions:
  contents: read
concurrency:
  group: football-v6-market-first-forward-v651
  cancel-in-progress: true
jobs:
  evaluate:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Compile market-first epoch, Correct-Score forward challenger and diagnostics
        run: |
          python -m py_compile football-data/validation/v6_market_first_forward_v651.py
          python -m py_compile football-data/validation/v6_market_first_forward_v652.py
          python -m py_compile football-data/validation/v6_market_first_forward_readiness_v651.py
          python -m py_compile football-data/validation/v6_market_first_forward_inventory_v652.py
          python -m py_compile football-data/validation/v6_special_market_forward_eval_v6211.py
          python -m py_compile football-data/validation/v6_correct_score_market_forward_v6215.py
      - name: Freeze new market-first predictions with legacy settlement disabled
        run: python football-data/validation/v6_market_first_forward_v652.py
      - name: Freeze post-epoch Correct-Score market rankings with no backfill
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/v6_correct_score_market_forward_v6215.py
      - name: Explain post-freeze evidence readiness without changing the epoch
        run: python football-data/validation/v6_market_first_forward_readiness_v651.py
      - name: Audit frozen prediction coverage before outcomes
        run: python football-data/validation/v6_market_first_forward_inventory_v652.py
      - name: Persist immutable prediction sidecars and diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_market_first_forward_freeze_v651.json \
            --allow-prefix football-data/forward/v6_market_first_events_v651.json \
            --allow-prefix football-data/manifests/v6_market_first_forward_evaluation_v651_status.json \
            --allow-prefix football-data/manifests/v6_market_first_forward_readiness_v651_status.json \
            --allow-prefix football-data/manifests/v6_market_first_forward_inventory_v652_status.json \
            --allow-prefix football-data/manifests/v6_correct_score_market_forward_freeze_v6215.json \
            --allow-prefix football-data/forward/v6_correct_score_market_predictions_v6215.json \
            --allow-prefix football-data/manifests/v6_correct_score_market_forward_v6215_status.json \
            --message-prefix "audit(football): persist market-first plus V6.21.5 Correct-Score epoch"
      - name: Enforce integrity, frozen-window and no-backfill Correct-Score semantics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('football-data/manifests/v6_market_first_forward_freeze_v651.json')
          l=Path('football-data/forward/v6_market_first_events_v651.json')
          p=Path('football-data/manifests/v6_market_first_forward_evaluation_v651_status.json')
          r=Path('football-data/manifests/v6_market_first_forward_readiness_v651_status.json')
          i=Path('football-data/manifests/v6_market_first_forward_inventory_v652_status.json')
          sf=Path('football-data/manifests/v6_correct_score_market_forward_freeze_v6215.json')
          sp=Path('football-data/manifests/v6_correct_score_market_forward_v6215_status.json')
          if not all(x.exists() for x in (f,l,p,r,i,sf,sp)): raise SystemExit('forward outputs missing')
          x=json.loads(p.read_text()); y=json.loads(r.read_text()); z=json.loads(i.read_text()); q=json.loads(sf.read_text()); qs=json.loads(sp.read_text())
          if x.get('status')!='PASS' or z.get('status')!='PASS' or qs.get('status')!='PASS': raise SystemExit(str({'market':x,'inventory':z,'score':qs}))
          if q.get('status')!='PASS_FROZEN_NO_BACKFILL' or (q.get('governance') or {}).get('no_backfill') is not True: raise SystemExit('Correct-Score freeze contract missing')
          if (qs.get('governance') or {}).get('prediction_mutation') is not False or (qs.get('governance') or {}).get('formal_weight')!=0: raise SystemExit('Correct-Score governance missing')
          if y.get('status') not in {'PASS','WARN_NO_ELIGIBLE_POST_FREEZE_MARKET_MATCHES'}: raise SystemExit(str(y))
          print(json.dumps({'market_predictions':x.get('prediction_count'),'score_freeze':q.get('freeze_at_utc'),'score_predictions':qs.get('prediction_count'),'score_settled':qs.get('settled_count'),'score_top1':qs.get('top1_accuracy'),'score_top3':qs.get('top3_accuracy')},ensure_ascii=False))
          PY
      - name: Refresh V6.9 system registry after market-first epoch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run football-v6-system-issue-registry-v690.yml --ref main
# V6.21.5 is a ranking challenger only; V5.0.1 and V6.5.1 probability rules remain unchanged.
