name: football-v6-market-first-forward-v651
on:
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"
  push:
    paths:
      - "football-data/validation/v6_market_first_forward_v651.py"
      - "football-data/validation/v6_market_first_forward_v652.py"
      - "football-data/validation/v6_market_first_forward_readiness_v651.py"
      - "football-data/validation/v6_market_first_forward_inventory_v652.py"
      - "football-data/validation/v6_correct_score_market_forward_v6215.py"
      - "football-data/validation/v6_team_total_mode_sum_forward_v6217.py"
      - "football-data/validation/v6_oo_epc_devig_screen_v6225.py"
      - "football-data/validation/v6_oo_epc_market_forward_v6226.py"
      - ".github/workflows/football-v6-market-first-forward-v651.yml"
      - "football-data/evidence/markets_prospective/**"
permissions:
  contents: read
concurrency:
  group: football-v6-market-first-forward-v651
  cancel-in-progress: true
jobs:
  evaluate:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Compile market-first epoch and independent challengers
        run: |
          python -m py_compile football-data/validation/v6_market_first_forward_v651.py
          python -m py_compile football-data/validation/v6_market_first_forward_v652.py
          python -m py_compile football-data/validation/v6_market_first_forward_readiness_v651.py
          python -m py_compile football-data/validation/v6_market_first_forward_inventory_v652.py
          python -m py_compile football-data/validation/v6_special_market_forward_eval_v6211.py
          python -m py_compile football-data/validation/v6_team_total_market_forward_eval_v6213.py
          python -m py_compile football-data/validation/v6_team_total_mode_sum_forward_eval_v6216.py
          python -m py_compile football-data/validation/v6_correct_score_market_forward_v6215.py
          python -m py_compile football-data/validation/v6_team_total_mode_sum_forward_v6217.py
          python -m py_compile football-data/validation/v6_oo_epc_devig_screen_v6225.py
          python -m py_compile football-data/validation/v6_oo_epc_market_forward_v6226.py
      - name: Freeze new market-first predictions with legacy settlement disabled
        run: python football-data/validation/v6_market_first_forward_v652.py
      - name: Freeze post-epoch Correct-Score market rankings with no backfill
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/v6_correct_score_market_forward_v6215.py
      - name: Freeze post-epoch Team-Total exact-total point rankings with no backfill
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/v6_team_total_mode_sum_forward_v6217.py
      - name: Freeze Kambi multiplicative versus OO-EPC probabilities with no started-event backfill
        env:
          PYTHONPATH: football-data/validation
        run: python football-data/validation/v6_oo_epc_market_forward_v6226.py
      - name: Explain post-freeze evidence readiness without changing the epoch
        run: python football-data/validation/v6_market_first_forward_readiness_v651.py
      - name: Audit frozen prediction coverage before outcomes
        run: python football-data/validation/v6_market_first_forward_inventory_v652.py
      - name: Persist immutable prediction sidecars and diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_market_first_forward_freeze_v651.json \
            --allow-prefix football-data/forward/v6_market_first_events_v651.json \
            --allow-prefix football-data/manifests/v6_market_first_forward_evaluation_v651_status.json \
            --allow-prefix football-data/manifests/v6_market_first_forward_readiness_v651_status.json \
            --allow-prefix football-data/manifests/v6_market_first_forward_inventory_v652_status.json \
            --allow-prefix football-data/manifests/v6_correct_score_market_forward_freeze_v6215.json \
            --allow-prefix football-data/forward/v6_correct_score_market_predictions_v6215.json \
            --allow-prefix football-data/manifests/v6_correct_score_market_forward_v6215_status.json \
            --allow-prefix football-data/manifests/v6_team_total_mode_sum_forward_freeze_v6217.json \
            --allow-prefix football-data/forward/v6_team_total_mode_sum_predictions_v6217.json \
            --allow-prefix football-data/manifests/v6_team_total_mode_sum_forward_v6217_status.json \
            --allow-prefix football-data/manifests/v6_oo_epc_market_forward_epoch_v6226.json \
            --allow-prefix football-data/forward/v6_oo_epc_market_predictions_v6226.json \
            --allow-prefix football-data/manifests/v6_oo_epc_market_forward_v6226_status.json \
            --message-prefix "audit(football): persist market-first plus score total and OO-EPC epochs"
      - name: Enforce integrity and no-backfill challenger semantics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('football-data/manifests/v6_market_first_forward_freeze_v651.json')
          p=Path('football-data/manifests/v6_market_first_forward_evaluation_v651_status.json')
          r=Path('football-data/manifests/v6_market_first_forward_readiness_v651_status.json')
          i=Path('football-data/manifests/v6_market_first_forward_inventory_v652_status.json')
          sf=Path('football-data/manifests/v6_correct_score_market_forward_freeze_v6215.json')
          sp=Path('football-data/manifests/v6_correct_score_market_forward_v6215_status.json')
          tf=Path('football-data/manifests/v6_team_total_mode_sum_forward_freeze_v6217.json')
          tp=Path('football-data/manifests/v6_team_total_mode_sum_forward_v6217_status.json')
          oe=Path('football-data/manifests/v6_oo_epc_market_forward_epoch_v6226.json')
          op=Path('football-data/manifests/v6_oo_epc_market_forward_v6226_status.json')
          if not all(x.exists() for x in (f,p,r,i,sf,sp,tf,tp,oe,op)): raise SystemExit('forward outputs missing')
          x=json.loads(p.read_text()); y=json.loads(r.read_text()); z=json.loads(i.read_text())
          q=json.loads(sf.read_text()); qs=json.loads(sp.read_text()); t=json.loads(tf.read_text()); ts=json.loads(tp.read_text()); o=json.loads(op.read_text()); e=json.loads(oe.read_text())
          if x.get('status')!='PASS' or z.get('status')!='PASS' or qs.get('status')!='PASS' or ts.get('status')!='PASS' or o.get('status')!='PASS': raise SystemExit(str({'market':x,'inventory':z,'score':qs,'total':ts,'oo':o}))
          if q.get('status')!='PASS_FROZEN_NO_BACKFILL' or (q.get('governance') or {}).get('no_backfill') is not True: raise SystemExit('Correct-Score freeze contract missing')
          if t.get('status')!='PASS_FROZEN_NO_BACKFILL' or (t.get('governance') or {}).get('no_backfill') is not True: raise SystemExit('Team-Total freeze contract missing')
          og=o.get('governance') or {}; eg=e.get('governance') or {}
          if og.get('no_started_event_backfill') is not True or og.get('formal_probability_change') is not False or eg.get('historical_backfill') is not False: raise SystemExit('OO-EPC prospective contract missing')
          if y.get('status') not in {'PASS','WARN_NO_ELIGIBLE_POST_FREEZE_MARKET_MATCHES'}: raise SystemExit(str(y))
          print(json.dumps({'market_predictions':x.get('prediction_count'),'score_predictions':qs.get('prediction_count'),'total_predictions':ts.get('prediction_count'),'oo_predictions':o.get('prediction_count'),'oo_settled':o.get('settled_count'),'oo_delta':o.get('delta_oo_minus_multiplicative')},ensure_ascii=False))
          PY
      - name: Refresh V6.9 system registry after market-first epoch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run football-v6-system-issue-registry-v690.yml --ref main
# V6.21.5, V6.21.7 and V6.22.6 are research challengers only; V5.0.1 formal probabilities remain unchanged.
