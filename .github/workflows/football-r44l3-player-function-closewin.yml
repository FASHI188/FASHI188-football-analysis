name: Football R44L3 Player Function Close-Win Screen

on:
  push:
    branches:
      - research/r44l3-player-function-closewin-screen
    paths:
      - "football-data/research/r44l3_player_function_closewin/**"
      - ".github/workflows/football-r44l3-player-function-closewin.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football-r44l3-player-function-closewin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fixed analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Recover frozen PR81 R2 player-quality artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r44l3_r2
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8848368411/zip" \
            -o /tmp/r44l3_r2.zip
          echo "025bf7c11ca01dcda720977777af404079e26feb992bf6ed51cc27b5ba285946  /tmp/r44l3_r2.zip" | sha256sum --check
          unzip -q /tmp/r44l3_r2.zip -d /tmp/r44l3_r2
      - name: Compile R44L3
        run: python -m py_compile football-data/research/r44l3_player_function_closewin/r44l3_player_function_closewin_screen.py
      - name: Run viewed-history close-win information screen
        run: |
          set -euo pipefail
          rm -rf /tmp/r44l3_out
          python football-data/research/r44l3_player_function_closewin/r44l3_player_function_closewin_screen.py \
            --r2-dir /tmp/r44l3_r2 \
            --out /tmp/r44l3_out
      - name: Show deterministic audit
        run: |
          cat /tmp/r44l3_out/audit.json
          cat /tmp/r44l3_out/consistency_summary.csv
          cat /tmp/r44l3_out/bootstrap_summary.csv
          head -n 21 /tmp/r44l3_out/univariate_player_separation.csv
      - name: Assert no runtime repository writeback
        run: test "$(git status --porcelain | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: football-r44l3-player-function-closewin-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/r44l3_out
          retention-days: 30
          if-no-files-found: error
