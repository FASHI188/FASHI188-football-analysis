name: Football C072-B Shot-Quality P(T) Development

on:
  push:
    branches:
      - research/c072b-shotquality-pt-development-20260818
    paths:
      - football-data/research/c072b_shotquality_pt_contract.json
      - football-data/research/evaluate_c072b_shotquality_pt.py
      - .github/workflows/football-c072b-shotquality-pt-development.yml
  pull_request:
    paths:
      - football-data/research/c072b_shotquality_pt_contract.json
      - football-data/research/evaluate_c072b_shotquality_pt.py
      - .github/workflows/football-c072b-shotquality-pt-development.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-c072b-shotquality-pt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  retrospective-chrono-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install frozen scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pandas==2.3.2 scikit-learn==1.7.1
      - name: Run C072-B frozen retrospective development
        run: |
          mkdir -p "$RUNNER_TEMP/c072b_out"
          PYTHONPATH=football-data/research python football-data/research/evaluate_c072b_shotquality_pt.py --out-dir "$RUNNER_TEMP/c072b_out"
      - name: Enforce governance boundary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'c072b_out'/'summary.json').read_text())
          assert s['status']=='C072B_DEVELOPMENT_COMPLETE'
          assert s['feature_contract']['shot_outcome_used'] is False
          assert s['feature_contract']['same_date_update'] is False
          assert s['boundary']['retrospective_only'] is True
          assert s['boundary']['fresh_confirmation_claim_allowed'] is False
          assert s['boundary']['C071_confirmation72180_opened'] is False
          assert s['boundary']['C070F_confirmation1597_opened'] is False
          assert s['boundary']['A05_opened'] is False and s['boundary']['protected_opened'] is False
          assert s['boundary']['formal_weight']==0
          print(json.dumps(s,indent=2))
          PY
      - name: Upload C072-B evidence
        uses: actions/upload-artifact@v4
        with:
          name: c072b-shotquality-pt-development
          retention-days: 30
          path: |
            ${{ runner.temp }}/c072b_out/summary.json
            football-data/research/c072b_shotquality_pt_contract.json
