name: Football R39I Evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39i-evaluation.yml'

permissions:
  contents: read

jobs:
  discrete-shock-fixed100:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify exact frozen contract before data or labels
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/prematch_shock_r39i/evaluate_discrete_shock_r39i.py football-data/research/prematch_shock_r39i/audit_lineup_coverage_r39i.py
          python football-data/research/prematch_shock_r39i/evaluate_discrete_shock_r39i.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/prematch_shock_r39i/preregistration_r39i.json').read_text())
          assert p['source_binding']['coverage_run_id']==31346607748
          assert p['source_binding']['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert p['source_binding']['fixed100_labels_accessed_before_evaluation']==0
          assert p['target_and_offset']['market_draw_logit_coefficient']==1.0
          assert p['full_feature_dimension']==28
          assert p['hard_limits']['formal_weight']==0
          print('PASS_R39I_FROZEN_EVALUATION_CONTRACT')
          PY
      - name: Download Transfermarkt and physically strip result/performance columns
        run: |
          set -euo pipefail
          rm -rf r39i-tm r39i-market r39i-raw r39i-output player_scores.zip
          mkdir -p r39i-tm r39i-market r39i-raw r39i-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/game_lineups.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/games.csv','r39i-tm/games_allowed.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name','home_club_manager_name','away_club_manager_name']),
            ('/tmp/game_lineups.csv','r39i-tm/lineups_allowed.csv',['game_id','player_id','club_id','type','position','number','team_captain'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
                  if missing: raise SystemExit(f'{src} missing {missing}')
                  assert not {'home_club_goals','away_club_goals','goals','assists','minutes_played','yellow_cards','red_cards'} & set(keep)
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in r:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/games.csv /tmp/game_lineups.csv player_scores.zip
      - name: Download Football-Data and isolate market-only from sealed result files
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="r39i-raw/${season}_${div}.csv";market="r39i-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$market" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
              if missing: raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in r:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
            done
          done
      - name: Execute frozen R39I label-order sequence
        run: |
          set -euo pipefail
          python football-data/research/prematch_shock_r39i/evaluate_discrete_shock_r39i.py \
            --prereg football-data/research/prematch_shock_r39i/preregistration_r39i.json \
            --coverage-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39i-market --raw-dir r39i-raw \
            --games r39i-tm/games_allowed.csv --lineups r39i-tm/lineups_allowed.csv \
            --out-dir r39i-output
      - name: Verify terminal label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39i-output/r39i_result.json').read_text())
          allowed={'STOP_R39I_BEFORE_LABELS_FEATURE_OR_LAG_GATE','STOP_R39I_BEFORE_HOLDOUT_LABEL_ACCESS_DISCRETE_SHOCK_NO_INCREMENT','STOP_R39I_BEFORE_HOLDOUT_LABEL_ACCESS_NO_POLICY_LANE','PASS_R39I_DISCRETE_SHOCK_FIXED100_EXPLORATORY_ONLY','NO_R39I_DISCRETE_SHOCK_INCREMENT_FIXED100'}
          assert r['status'] in allowed
          access=r['holdout_labels_accessed']
          if r['status'].startswith('STOP_'): assert access==0
          else: assert access==100
          f=json.loads(Path('r39i-output/freeze_receipt_r39i.json').read_text())
          assert f['holdout_labels_accessed_before_freeze']==0
          assert f['strict_lag_audit']['leakage_violations']==0
          print(json.dumps({'status':r['status'],'training_labels_accessed':r['training_labels_accessed'],'holdout_labels_accessed':access,'validation':r.get('validation'),'policy':r.get('policy'),'holdout':r.get('holdout')},indent=2))
          PY
      - name: Delete all raw/source inputs before artifact
        run: rm -rf r39i-tm r39i-market r39i-raw
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39i-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39i-output/
          if-no-files-found: error
          retention-days: 30
