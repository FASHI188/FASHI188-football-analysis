name: football3 Top1 remaining full coverage priors R5

on:
  push:
    branches:
      - football3/top1-20k-opponent-veto-r1
    paths:
      - football-data/experiments/top1_r5_remaining/run_experiment_r5.py
      - .github/workflows/football3-top1-r5-fullcoverage-priors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r5-full-coverage-priors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-20k-opponent-veto-r1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calibration runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Freeze exact remaining unused rows
        run: python football-data/experiments/top1_r5_remaining/run_experiment_r5.py freeze
      - name: Run full coverage prior experiment
        run: python football-data/experiments/top1_r5_remaining/run_experiment_r5.py run
      - name: Verify 100 percent coverage and no-market contract
        run: python football-data/experiments/top1_r5_remaining/run_experiment_r5.py verify
      - name: Persist R5 data and result to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r5_remaining/data football-data/experiments/top1_r5_remaining/results
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r5] freeze remaining unused rows and full-coverage prior result'
            git push origin HEAD:football3/top1-20k-opponent-veto-r1
          fi
      - name: Upload immutable R5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r5-fullcoverage-priors
          path: |
            football-data/experiments/top1_r5_remaining/data/source_manifest_r5.json
            football-data/experiments/top1_r5_remaining/results/summary_r5.json
          if-no-files-found: error
          retention-days: 30
