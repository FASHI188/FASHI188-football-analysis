name: Football V6.50.6 Full-Season 2025 Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_fullseason_2025_replay_v6506.py"
      - ".github/workflows/football-v6506-fullseason-2025-replay.yml"
  pull_request:
    branches: [main]
    paths:
      - "football-data/validation/v6_fullseason_2025_replay_v6506.py"
      - ".github/workflows/football-v6506-fullseason-2025-replay.yml"
      - "football-data/manifests/v6_fullseason_2025_replay_v6506_pr_trigger.txt"

permissions:
  contents: write

concurrency:
  group: football-v6506-fullseason-2025-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile replay
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python -m py_compile football-data/validation/v6_fullseason_2025_replay_v6506.py
      - name: Run strict 2025 full-season retrospective replay
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_fullseason_2025_replay_v6506.py
      - name: Persist research receipt only
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_fullseason_2025_replay_v6506_status.json \
            --message-prefix "audit(football): persist V6.50.6 2025 full-season replay"
      - name: Hard retrospective-governance guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_fullseason_2025_replay_v6506_status.json')
          if not p.exists(): raise SystemExit('V6.50.6 receipt missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          if x.get('status') not in {'PASS_RETROSPECTIVE_DIAGNOSTIC','PARTIAL_DOMAIN_COVERAGE'}: raise SystemExit(str(x.get('status')))
          g=x.get('governance') or {}
          if g.get('research_only') is not True or g.get('formal_weight')!=0: raise SystemExit('research governance drift')
          if g.get('current_rule_change') is not False or g.get('formal_probability_change') is not False or g.get('formal_threshold_change') is not False: raise SystemExit('formal mutation forbidden')
          if g.get('no_target_result_used_for_parameter_selection') is not True: raise SystemExit('target leakage guard failed')
          if g.get('market_based_results_are_retrospective_reference_only') is not True or g.get('cannot_promote_from_this_replay') is not True: raise SystemExit('retrospective classification drift')
          d=x.get('data') or {}
          if int(d.get('base_target_count') or 0)<=0: raise SystemExit('empty replay')
          print(json.dumps({
            'status':x.get('status'),
            'base_n':d.get('base_target_count'),
            'market_n':d.get('market_1x2_count'),
            'selector_n':d.get('selector_selected_count'),
            'ou_joint_n':d.get('ou25_joint_count'),
            'target_domains':d.get('target_domain_count'),
            'selector_accuracy':((x.get('f05_market_and_selector') or {}).get('selector_selected') or {}).get('accuracy'),
            'raw_total_top1':((x.get('raw_f06_fullseason') or {}).get('metrics') or {}).get('total_top1_accuracy'),
            'ou_total_top1':((x.get('ou_kl_total_same_subset') or {}).get('ou_kl_candidate') or {}).get('top1_accuracy'),
            'joint_score_top1':((x.get('joint_matrix_same_subset') or {}).get('ou_result_joint_candidate') or {}).get('exact_score_top1_accuracy')
          },ensure_ascii=False))
          PY

# PR execution is read-only/observable; only non-PR execution may persist the retrospective receipt.
# Never promotion evidence; CURRENT V5.0.1 stays unchanged.
