name: Football V6.50.6 Full-Season 2025 Replay

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6506-fullseason-2025-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evaluation code
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python -m py_compile football-data/validation/v6_fullseason_2025_replay_v6506.py
          python -m py_compile football-data/validation/v6_fullseason_2025_replay_v6506_evalfix.py
      - name: Run strict 2025 full-season retrospective replay with corrected scorecards
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_fullseason_2025_replay_v6506_evalfix.py
      - name: Upload complete replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: v6506-fullseason-2025-replay-receipt
          path: football-data/manifests/v6_fullseason_2025_replay_v6506_status.json
          if-no-files-found: error
          retention-days: 3
      - name: Persist research receipt only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_fullseason_2025_replay_v6506_status.json \
            --message-prefix "audit(football): persist V6.50.6 corrected 1X2 scorecards"
      - name: Hard retrospective-governance guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_fullseason_2025_replay_v6506_status.json')
          if not p.exists(): raise SystemExit('V6.50.6 receipt missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          g=x.get('governance') or {}
          if g.get('research_only') is not True or g.get('formal_weight')!=0: raise SystemExit('research governance drift')
          if g.get('market_based_results_are_retrospective_reference_only') is not True: raise SystemExit('retrospective classification drift')
          s=x.get('f05_market_and_selector') or {}
          full=s.get('FULL_1X2') or {}
          selective=s.get('SELECTIVE_1X2') or {}
          required=('confusion_matrix','per_class_precision','per_class_recall','per_class_f1','macro_f1','balanced_accuracy')
          if full.get('scorecard_type')!='FULL_1X2' or full.get('abstain_allowed') is not False: raise SystemExit('FULL_1X2 scorecard missing')
          if selective.get('scorecard_type')!='SELECTIVE_1X2' or selective.get('abstain_allowed') is not True: raise SystemExit('SELECTIVE_1X2 scorecard missing')
          if any(k not in full for k in required) or any(k not in selective for k in required): raise SystemExit('classification metrics missing')
          if 'accuracy_coverage_curve' not in selective: raise SystemExit('accuracy-coverage curve missing')
          print(json.dumps({'status':x.get('status'),'FULL_1X2':full.get('accuracy'),'SELECTIVE_1X2':selective.get('accuracy'),'coverage':selective.get('coverage')},ensure_ascii=False))
          PY

# Manual dispatch only. Evaluation-code edits must not auto-rerun the 5524-match replay.
# This workflow adds metrics only; it changes no model, threshold, probability, or CURRENT rule.
