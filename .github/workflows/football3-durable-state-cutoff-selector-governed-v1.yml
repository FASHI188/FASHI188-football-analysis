name: Football3 Durable State Cutoff Selector Governed V1

on:
  push:
    branches:
      - football3/durable-state-cutoff-selector-governed-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-durable-state-cutoff-selector-governed-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governed-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove candidate authority and protected model surfaces unchanged
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/durable-state-cutoff-selector-governed-v1'
          git diff --name-only a1a8f8aab170d10a57e1c107dac5524cc31a6a9a...HEAD | tee changed_files.txt
          if grep -E '(^|/)(formal_fusion_v2\.py|pure_engine\.py|historical_xg_challenger\.py|CURRENT|formal_pointer\.json|model_lock\.json)$' changed_files.txt; then
            echo 'protected formal model/CURRENT surface changed' >&2
            exit 1
          fi
          printf 'candidate_validation_only=true\nready=false\nmerge=false\nproduction_activation=false\nairtable_write=false\n' > authority.txt

      - name: Compile durable governance modules
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 -m py_compile \
              football-data/formal_gpt_gateway_v1/durable_state_contract_v1.py \
              football-data/formal_gpt_gateway_v1/durable_state_selector_v1.py \
              football-data/formal_gpt_gateway_v1/formal_durable_state_governance_v1.py \
              football-data/formal_gpt_gateway_v1/test_durable_state_governance_v1.py \
              football-data/formal_gpt_gateway_v1/test_durable_state_cross_league_v1.py \
              football-data/formal_gpt_gateway_v1/entry.py

      - name: Run selector transition cache fallback and fail-closed regressions
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 football-data/formal_gpt_gateway_v1/test_durable_state_governance_v1.py \
            > durable_state_governance_regression.json
          python3 - <<'PY'
          import json
          d=json.load(open('durable_state_governance_regression.json'))
          assert d['passed'] is True
          assert d['betis_four_cutoff_generic_regression']['fixture']['result_fields_present'] is False
          assert d['all_formal_scope_selector_smoke']['n'] == 16
          required={'corrupt_manifest','discontinuous_delta','stale_cache'}
          assert set(d['deep_fail_closed']['rejected']) == required
          print('DURABLE_GOVERNANCE_UNIT_REGRESSION_PASS', d['receipt_sha256'])
          PY

      - name: Download byte-bound frozen FULL rebuild sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources/understat .runtime_sources/confirmation
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" \
            -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" \
            -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation
          sha256sum .runtime_sources/understat/understat_frozen.db \
                    .runtime_sources/confirmation/confirmation_identity.jsonl \
                    .runtime_sources/confirmation/confirmation_xg_result_vault.jsonl \
            | tee frozen_source_sha256.txt

      - name: Run existing production 300 equivalence and automatic FAST FULL routing
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_fast_runtime_v1/test_runtime.py \
              --mode production \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --n 300 \
              --out "$PWD/production_300_equivalence_receipt.json" \
            | tee production_300_equivalence_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('production_300_equivalence_receipt.json'))
          assert d['passed'] is True
          assert d['equivalence_300']['n'] == 300
          assert d['equivalence_300']['max_abs_1x2'] <= 1e-12
          assert d['equivalence_300']['max_abs_score_matrix_cell'] <= 1e-12
          assert d['automatic_routing']['passed'] is True
          print('PRODUCTION_300_EQUIVALENCE_PASS', d['receipt_sha256'])
          PY

      - name: Run Big5 FAST FULL and LaLiga delta empty-delta matrix
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1" \
            python3 football-data/formal_gpt_gateway_v1/test_durable_state_cross_league_v1.py \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --out "$PWD/durable_state_cross_league_matrix.json" \
            | tee durable_state_cross_league_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('durable_state_cross_league_matrix.json'))
          assert d['passed'] is True
          rows=d['big5_fast_full_matrix']
          assert {r['competition_id'] for r in rows} == {'ENG_PremierLeague','ESP_LaLiga','GER_Bundesliga','ITA_SerieA','FRA_Ligue1'}
          for r in rows:
              assert r['fast_path']=='FAST_PATH'
              assert r['full_path']=='FULL_REBUILD_PATH'
              assert r['empty_delta_path']=='FAST_PATH'
              assert r['non_empty_delta_n']>0
              assert r['fast_full_state_exact'] is True
              assert r['empty_full_state_exact'] is True
          la=d['la_liga_delta_and_empty_delta']
          assert la['non_empty_delta_n']>0 and la['empty_delta_n']==0
          print('BIG5_FAST_FULL_MATRIX_PASS', d['receipt_sha256'])
          PY

      - name: Prove implementation is generic and official runner patch is wired
        run: |
          set -euo pipefail
          ! grep -RinE 'Real Betis|Betis|Real Madrid' \
            football-data/formal_gpt_gateway_v1/durable_state_contract_v1.py \
            football-data/formal_gpt_gateway_v1/durable_state_selector_v1.py \
            football-data/formal_gpt_gateway_v1/formal_durable_state_governance_v1.py
          grep -q 'formal_durable_state_governance_v1' football-data/formal_gpt_gateway_v1/entry.py
          if [ -f .github/workflows/football3-formal-gpt-runner-integration-v1.yml ]; then
            grep -q 'durable_state_selector_v1.py' .github/workflows/football3-formal-gpt-runner-integration-v1.yml
            ! grep -q "candidates.sort(key=lambda a:(a.get('created_at'" .github/workflows/football3-formal-gpt-runner-integration-v1.yml
          fi

      - name: Build governed validation receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          def load(p): return json.loads(pathlib.Path(p).read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          unit=load('durable_state_governance_regression.json')
          eq=load('production_300_equivalence_receipt.json')
          matrix=load('durable_state_cross_league_matrix.json')
          core={
            'schema_version':'football3-durable-state-governed-validation-receipt-v1',
            'head':head,
            'unit_sha256':unit['receipt_sha256'],
            'production_300_sha256':eq['receipt_sha256'],
            'cross_league_sha256':matrix['receipt_sha256'],
            'formal_head':eq['formal_head'],
            'current_sha256':eq.get('current_sha256'),
            'betis_result_read':False,
            'training_or_tuning_used':False,
            'model_parameters_or_weights_changed':False,
            'formal_current_or_production_pointer_changed':False,
            'ready_or_merge_authorized':False,
            'passed':True,
          }
          raw=json.dumps(core,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          receipt={**core,'receipt_sha256':hashlib.sha256(raw).hexdigest()}
          pathlib.Path('durable_state_governed_validation_receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
          sha256sum durable_state_governance_regression.json \
                    production_300_equivalence_receipt.json \
                    durable_state_cross_league_matrix.json \
                    durable_state_governed_validation_receipt.json \
            | tee validation_file_sha256.txt

      - name: Upload governed validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: football3-durable-state-cutoff-selector-governed-${{ github.run_id }}
          path: |
            authority.txt
            changed_files.txt
            frozen_source_sha256.txt
            durable_state_governance_regression.json
            production_300_equivalence_receipt.json
            production_300_equivalence_stdout.txt
            durable_state_cross_league_matrix.json
            durable_state_cross_league_stdout.txt
            durable_state_governed_validation_receipt.json
            validation_file_sha256.txt
          if-no-files-found: error
          retention-days: 90
