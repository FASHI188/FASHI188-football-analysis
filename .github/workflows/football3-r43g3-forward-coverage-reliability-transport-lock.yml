name: football3 R43G3 forward coverage reliability transport lock

on:
  push:
    branches:
      - football3/r43g3-forward-coverage-reliability-transport-lock
    paths:
      - football-data/experiments/r43g3_forward_coverage_reliability_transport_lock/**
      - .github/workflows/football3-r43g3-forward-coverage-reliability-transport-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43g3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43g3-forward-coverage-reliability-transport-lock
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Verify frozen dependency runners
        shell: bash
        run: |
          set -euo pipefail
          echo 'b860c1dfc86230a0da842cce2a8b78a02e1239eb191efeab30ad4ed1fb087cc5  football-data/experiments/r42k_r42h_v1_half_shrink_oldest20k/run_r42k_half_shrink.py' | sha256sum -c -
          echo '17155fe709877801299b1b8f2d965cb11da4cb81c5d2fc5733cf7536bbe2faad  football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py' | sha256sum -c -
          echo '615277fa8728c2cb7d42c48190348d38eb0955c6  football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/results/r42l_r1_mw2_half_technical_transport_lock.json' | git hash-object --stdin >/dev/null 2>&1 || true
          python -m py_compile football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/run_r42l_mw2_forward_lock.py
          python -m py_compile football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/run_r42l_mw2_forward_lock_r1.py
          python -m py_compile football-data/experiments/r43g3_forward_coverage_reliability_transport_lock/run_r43g3.py
      - name: Verify immutable R42L source blob
        shell: bash
        run: |
          set -euo pipefail
          GOT=$(git hash-object football-data/experiments/r42l_r42f_r42h_half_shrink_mw2_lock/results/r42l_r1_mw2_half_technical_transport_lock.json)
          test "$GOT" = '615277fa8728c2cb7d42c48190348d38eb0955c6'
      - name: Reconstruct frozen R42H dependency
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/experiments/r42h_player_technical_translation
          cat "$D"/encoded/run_r42h.py.gz.b64.part0 "$D"/encoded/run_r42h.py.gz.b64.part1 | base64 -d | gzip -d > "$D"/run_r42h_player_technical_translation.py
          echo 'b7bf4bd5fbfd61936e8de52fa09e5b81f748389cb9e0d2de6f33641c1d394a45  '"$D"'/run_r42h_player_technical_translation.py' | sha256sum -c -
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43G3 true-forward lock
        run: python football-data/experiments/r43g3_forward_coverage_reliability_transport_lock/run_r43g3.py run
      - name: Verify R43G3 contract
        run: python football-data/experiments/r43g3_forward_coverage_reliability_transport_lock/run_r43g3.py verify
      - name: Persist R43G3 prematch evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43g3_forward_coverage_reliability_transport_lock/results/r43g3_forward_coverage_reliability_transport_lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[locked] football3 R43G3 forward coverage reliability transport lock'
            git fetch origin football3/r43g3-forward-coverage-reliability-transport-lock
            git rebase origin/football3/r43g3-forward-coverage-reliability-transport-lock
            git push origin HEAD:football3/r43g3-forward-coverage-reliability-transport-lock
          fi
      - name: Upload R43G3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43g3-forward-coverage-reliability-transport-lock
          path: football-data/experiments/r43g3_forward_coverage_reliability_transport_lock/results/r43g3_forward_coverage_reliability_transport_lock.json
          if-no-files-found: error
          retention-days: 90
