name: Football V6.24.2 Total Goal Modal Collapse Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_goal_modal_collapse_diagnostic_v6242.py"
      - ".github/workflows/football-v6242-total-modal-collapse-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile diagnostic
        run: python -m py_compile football-data/validation/v6_total_goal_modal_collapse_diagnostic_v6242.py
      - name: Run strict-PIT diagnostic
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_goal_modal_collapse_diagnostic_v6242.py
      - name: Persist diagnostic receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_goal_modal_collapse_diagnostic_v6242_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.24.2 total modal-collapse diagnostic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Research diagnostic only; no CURRENT/runtime mutation.
