name: Football Platform Integrity Read-Only

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "football-data/config/**"
      - "football-data/schemas/**"
      - "football-data/engine/**"
      - "football-data/validation/**"
      - "football-data/tests/**"
      - ".github/workflows/football-platform-integrity.yml"
  push:
    branches: [main]
    paths:
      - "football-data/config/**"
      - "football-data/schemas/**"
      - "football-data/engine/**"
      - "football-data/validation/**"
      - "football-data/tests/**"
      - ".github/workflows/football-platform-integrity.yml"
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: read

concurrency:
  group: football-platform-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository-wide fail-closed preflight
        run: python football-data/validation/repository_integrity_runtime_v473.py --strict-exit --print-summary
      - name: Run platform tests without persistence
        env:
          PYTHONPATH: football-data/engine
        run: |
          python -m unittest discover -s football-data/tests -p "test_platform*.py" -v
          python -m unittest discover -s football-data/tests -p "test_team_strengths.py" -v
          python -m unittest discover -s football-data/tests -p "test_prediction_pipeline.py" -v
      - name: Verify checkout remains non-persistent
        run: |
          git status --short
          echo "No repository writeback is performed by this workflow."
