name: Football Draw PIT Availability Zero-Label Audit

on:
  push:
    branches: [research/draw-pit-availability-zero-label-20260814]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Clone public FPL history
        run: git clone --quiet https://github.com/vaastav/Fantasy-Premier-League.git external-fpl
      - name: Run zero-label audit
        run: python football-data/research/draw_pit_availability_zero_label_audit_20260814.py --source-dir external-fpl --out audit-output
      - uses: actions/upload-artifact@v4
        with:
          name: draw-pit-availability-zero-label-audit
          path: audit-output/
