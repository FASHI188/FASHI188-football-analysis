name: Football V6.50.4 Simplex Direct Total Challenge

on:
  workflow_dispatch:
  schedule:
    - cron: "32 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_simplex_direct_total_v6504.py"
      - ".github/workflows/football-v6504-simplex-direct-total.yml"
permissions:
  contents: write
concurrency:
  group: football-v6504-simplex-direct-total
  cancel-in-progress: true
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile simplex challenger
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python -m py_compile football-data/validation/v6_simplex_direct_total_v6504.py
      - name: Calibrate then freeze prospective simplex totals
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_simplex_direct_total_v6504.py
      - name: Persist only simplex challenge ledger and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_simplex_direct_total_v6504_freeze.json \
            --allow-prefix football-data/forward/v6_simplex_direct_total_events_v6504.json \
            --allow-prefix football-data/manifests/v6_simplex_direct_total_v6504_status.json \
            --message-prefix "audit(football): persist V6.50.4 simplex direct-total challenge"
      - name: Hard calibration timing and governance guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_simplex_direct_total_v6504_status.json')
          if not p.exists(): raise SystemExit('V6.50.4 status missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          if x.get('status')!='PASS': raise SystemExit(str(x))
          f=x.get('freeze') or {}; c=f.get('calibration') or {}; d=c.get('development_design') or {}; t=f.get('timing_audit') or {}; g=x.get('governance') or {}; pd=x.get('prospective_diagnostics') or {}
          w=c.get('chosen_weights') or {}; s=sum(float(w.get(k) or 0.0) for k in ('comp','strength','full'))
          if abs(s-1.0)>1e-9 or any(float(w.get(k) or 0.0)<0 for k in ('comp','strength','full')): raise SystemExit('simplex weights invalid')
          if d.get('strictly_before_recent_two_season_fixed1000_window_by_domain') is not True or d.get('same_day_predict_before_update') is not True: raise SystemExit('time-order development guard failed')
          if t.get('calibration_completed_before_freeze_timestamp') is not True or t.get('per_event_timestamp_sampled_after_candidate_computation') is not True: raise SystemExit('prospective timing guard failed')
          if pd.get('count',0) and float(pd.get('minimum_actual_lead_hours_at_freeze') or 0.0)<1.0: raise SystemExit('actual lead below one hour')
          if (c.get('fixed1000_diagnostic') or {}).get('classification')!='RETROSPECTIVE_DIAGNOSTIC_ONLY_NOT_PROMOTION_EVIDENCE': raise SystemExit('fixed1000 governance failed')
          if g.get('source_probability_mutation') is not False or g.get('source_matrix_mutation') is not False or g.get('historical_backfill') is not False or g.get('formal_weight')!=0 or g.get('automatic_promotion') is not False or g.get('current_rule_change') is not False: raise SystemExit('governance failed')
          print(json.dumps({'chosen_weights':w,'development':c.get('chosen_development_metrics'),'fixed1000':c.get('fixed1000_diagnostic'),'prospective':pd,'evaluation':x.get('evaluation')},ensure_ascii=False))
          PY

# Recent-total context may improve individualization only if development proper scores support it.
# Diversity itself is never a promotion criterion; formal weight remains zero.
