# PAUSED_FOR_REPOSITORY_GOVERNANCE
name: Governance CI V5.1 Capability Adjudication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/governance/verify_v510_capabilities.py --target ci.yml --require-archived
