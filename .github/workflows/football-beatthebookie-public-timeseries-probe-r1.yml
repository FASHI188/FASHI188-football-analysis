name: Football BeatTheBookie public time-series probe R1

on:
  push:
    branches:
      - research/beatthebookie-public-timeseries-zero-label-r1
    paths:
      - '.github/workflows/football-beatthebookie-public-timeseries-probe-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Probe anonymous public mirrors only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p football-data/research/beatthebookie_public_timeseries_probe_r1
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          probes = [
            {
              'name': 'kaggle_v2_download_api',
              'url': 'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset?datasetVersionNumber=2'
            },
            {
              'name': 'google_drive_public_folder',
              'url': 'https://drive.google.com/drive/folders/0B3zgn2ueCERNWnJRSnpIQTBDWEU?usp=sharing'
            },
            {
              'name': 'legacy_dropbox_odds_series',
              'url': 'https://www.dropbox.com/s/gqp3m6o5zsd8v63/odds_series.zip?dl=1'
            }
          ]
          rows=[]
          for p in probes:
              cmd=['curl','-sS','-L','-I','--max-time','30','-o','-','-w','\n__FINAL__%{http_code}|%{url_effective}|%{content_type}|%{size_download}\n',p['url']]
              cp=subprocess.run(cmd,text=True,capture_output=True)
              text=(cp.stdout or '') + ('\nSTDERR:'+cp.stderr if cp.stderr else '')
              rows.append({'name':p['name'],'returncode':cp.returncode,'raw_headers':text[-12000:]})
          out={'schema_version':'BEATTHEBOOKIE-ANON-MIRROR-PROBE-R1','account_credentials_used':False,'rows':rows}
          Path('football-data/research/beatthebookie_public_timeseries_probe_r1/probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload anonymous mirror probe
        uses: actions/upload-artifact@v4
        with:
          name: football-beatthebookie-anon-mirror-probe-${{ github.sha }}-${{ github.run_id }}
          path: football-data/research/beatthebookie_public_timeseries_probe_r1/probe.json
          if-no-files-found: error
          retention-days: 30
