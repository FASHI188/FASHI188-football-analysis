name: Football Beat The Bookie R39E Bookmaker Continuity

on:
  pull_request:
    branches:
      - research/betfair-kaggle-timestamp-coverage-r39a
    paths:
      - '.github/workflows/football-beat-the-bookie-r39e-bookmaker-continuity.yml'

permissions:
  contents: read

jobs:
  t24-t1-common-bookmakers-no-labels:
    if: ${{ github.run_attempt == 1 && github.run_number == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify frozen contract
        run: |
          set -euo pipefail
          python -m json.tool football-data/research/beat_the_bookie_r39/bookmaker_continuity_registration_r39e.json >/dev/null
          python -m py_compile football-data/research/beat_the_bookie_r39/audit_bookmaker_continuity_r39e.py
          test "$(git hash-object football-data/research/beat_the_bookie_r39/bookmaker_continuity_registration_r39e.json)" = "891646f861691388ae03f1bfd0b1dd71cc3aeaf9"
          test "$(git hash-object football-data/research/beat_the_bookie_r39/audit_bookmaker_continuity_r39e.py)" = "01aecb3df971d9b78992af8f5a7434aa01eaef53"
      - name: Download exact source and remove score columns
        run: |
          set -euo pipefail
          rm -rf r39e-source r39e-sanitized r39e-output r39e-source.zip
          mkdir -p r39e-source r39e-sanitized r39e-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset' -o r39e-source.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('r39e-source.zip')
          for n in ('odds_series.csv.gz','odds_series_b.csv.gz'): z.extract(n,'r39e-source')
          PY
          echo 'cc6e0ad9b818d9d8a06e857d65d8dd8f32d8d7a21d9b9b49a5c27d4e9eb1c722  r39e-source/odds_series.csv.gz' | sha256sum -c -
          echo '3d24e8c8021559b03afa17194a3748929e48b27311fea5da045e7f0040c957c5  r39e-source/odds_series_b.csv.gz' | sha256sum -c -
          for base in odds_series odds_series_b; do
            gzip -dc "r39e-source/${base}.csv.gz" | cut -d',' -f1-3,6- | gzip -c > "r39e-sanitized/${base}_no_scores.csv.gz"
          done
          rm -rf r39e-source r39e-source.zip
      - name: Audit all-hours bookmaker continuity with zero labels
        run: |
          set -euo pipefail
          python football-data/research/beat_the_bookie_r39/audit_bookmaker_continuity_r39e.py \
            --registration football-data/research/beat_the_bookie_r39/bookmaker_continuity_registration_r39e.json \
            --source-dir r39e-sanitized --out-dir r39e-output
      - name: Verify no-label boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39e-output/bookmaker_continuity_status_r39e.json').read_text())
          assert r['status']=='PASS_R39E_BOOKMAKER_CONTINUITY_AUDIT_NO_LABELS'
          assert r['population']['training_eligible_rows']==49511
          assert r['population']['holdout_eligible_rows']==10734
          n=r['no_label_audit']
          assert n['score_values_accessed']==0 and n['result_values_accessed']==0
          assert n['prediction_metrics_computed']==0 and n['model_fits']==0 and n['identity_locks_created']==0
          assert n['holdout_individual_identities_output']==0 and n['T0_accessed']==0
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Delete source and upload aggregate evidence
        if: always()
        run: rm -rf r39e-sanitized
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-beat-the-bookie-r39e-bookmaker-continuity-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: r39e-output/
          if-no-files-found: error
          retention-days: 30
