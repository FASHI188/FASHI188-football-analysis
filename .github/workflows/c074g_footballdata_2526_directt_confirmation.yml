name: C074-G Football-Data 2025-26 Direct-T confirmation

on:
  pull_request:
    paths:
      - 'research/C074G_CONTRACT.md'
      - 'research/c074g_footballdata_2526_directt_confirmation.py'
      - '.github/workflows/c074g_footballdata_2526_directt_confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2

      - name: Run frozen 2025-26 forward confirmation
        run: |
          python research/c074g_footballdata_2526_directt_confirmation.py \
            --out artifacts/c074g_confirmation
          cp research/C074G_CONTRACT.md artifacts/c074g_confirmation/C074G_CONTRACT.md

      - name: Upload C074-G artifact
        uses: actions/upload-artifact@v4
        with:
          name: c074g-footballdata-2526-directt-confirmation
          path: artifacts/c074g_confirmation/
          if-no-files-found: error
          retention-days: 30
