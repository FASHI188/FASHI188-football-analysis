name: football3 Batch-002 draw boundary diagnostic
on:
  push:
    branches: [football3/batch002-draw-boundary-diagnostic]
    paths:
      - football-data/experiments/batch002_draw_boundary_diagnostic/run_diagnostic.py
      - .github/workflows/football3-batch002-draw-boundary-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch002-draw-boundary-diagnostic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run draw boundary diagnostic
        run: python football-data/experiments/batch002_draw_boundary_diagnostic/run_diagnostic.py
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch002_draw_boundary_diagnostic/results/summary_batch002_draw_boundary.json
          git commit -m '[diagnostic] football3 Batch-002 draw boundary' || true
          git fetch origin football3/batch002-draw-boundary-diagnostic
          git rebase origin/football3/batch002-draw-boundary-diagnostic
          git push origin HEAD:football3/batch002-draw-boundary-diagnostic
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch002-draw-boundary-diagnostic
          path: football-data/experiments/batch002_draw_boundary_diagnostic/results/summary_batch002_draw_boundary.json
          if-no-files-found: error
          retention-days: 90
