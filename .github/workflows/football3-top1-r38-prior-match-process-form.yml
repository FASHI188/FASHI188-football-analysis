name: football3 top1 R38 prior match process form

on:
  push:
    branches:
      - football3/top1-r38-prior-match-process-form
    paths:
      - football-data/experiments/top1_r38_prior_match_process_form/run_experiment_r38.py
      - .github/workflows/football3-top1-r38-prior-match-process-form.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r38:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r38-prior-match-process-form
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R38 prior match process form
        run: python football-data/experiments/top1_r38_prior_match_process_form/run_experiment_r38.py run
      - name: Verify R38 contract
        run: python football-data/experiments/top1_r38_prior_match_process_form/run_experiment_r38.py verify
      - name: Persist R38 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r38_prior_match_process_form/results/summary_r38.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R38 prior match process form'
            git fetch origin football3/top1-r38-prior-match-process-form
            git rebase origin/football3/top1-r38-prior-match-process-form
            git push origin HEAD:football3/top1-r38-prior-match-process-form
          fi
      - name: Upload R38 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r38-prior-match-process-form
          path: football-data/experiments/top1_r38_prior_match_process_form/results/summary_r38.json
          if-no-files-found: error
          retention-days: 90
