name: C074-H untouched 2025-26 tail zero-label gate

on:
  pull_request:
    paths:
      - 'research/C074H_CONTRACT.md'
      - 'research/c074h_2526_untouched_tail_zero_label_gate.py'
      - '.github/workflows/c074h_2526_untouched_tail_zero_label_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-label-tail-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3
      - name: Run frozen zero-label tail source gate
        run: |
          python research/c074h_2526_untouched_tail_zero_label_gate.py --out artifacts/c074h_tail_zero_label
          cp research/C074H_CONTRACT.md artifacts/c074h_tail_zero_label/C074H_CONTRACT.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: c074h-untouched-2526-tail-zero-label
          path: artifacts/c074h_tail_zero_label/
          if-no-files-found: error
          retention-days: 30
