name: Football R39T PremierLeague Forward Window Capture

on:
  push:
    branches:
      - research/premierleague-forward-windows-r39t
    paths:
      - 'football-data/research/premierleague_forward_windows_r39t/trigger_r39t.json'

permissions:
  contents: read

concurrency:
  group: football-r39t-forward-window-capture
  cancel-in-progress: false

jobs:
  forward-window-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact R39T frozen contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/premierleague_forward_windows_r39t/capture_window_r39t.py
          python -m py_compile football-data/research/premierleague_rendered_lineup_r39s/detect_confirmed_xi_r39s.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('football-data/research/premierleague_forward_windows_r39t')
          c=json.loads((root/'contract_r39t.json').read_text())
          t=json.loads((root/'trigger_r39t.json').read_text())
          assert c['schema_version']=='R39T-PL-FORWARD-WINDOWS-1.0'
          assert c['research_only'] is True and c['formal_weight']==0
          assert c['fixture']['match_id']==2645195
          assert c['fixture']['scheduled_kickoff_utc']=='2026-08-21T19:00:00Z'
          assert list(c['windows'])==['T90','T60','T30','T15']
          assert t['mode'] in c['trigger_contract']['allowed_modes']
          f=c['frozen_detector']
          for path,key in [(f['contract_path'],'contract_git_blob_sha'),(f['implementation_path'],'implementation_git_blob_sha')]:
              got=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
              assert got==f[key], (path,got,f[key])
          b=c['hard_boundaries']
          assert b['blind100_labels_accessed']==b['research_target_labels_used']==b['model_fits']==b['candidate_probabilities']==0
          assert b['football_api_requests']==b['api_keys_used']==0
          assert b['main_mutation'] is False and b['current_rule_mutation'] is False
          print('PASS_R39T_FROZEN_CONTRACT',t['mode'])
          PY

      - name: Execute PRECHECK or exact frozen window
        run: |
          set -euo pipefail
          python football-data/research/premierleague_forward_windows_r39t/capture_window_r39t.py \
            --contract football-data/research/premierleague_forward_windows_r39t/contract_r39t.json \
            --trigger football-data/research/premierleague_forward_windows_r39t/trigger_r39t.json \
            --output "$RUNNER_TEMP/r39t-window"

      - name: Verify receipt hard boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r39t-window'
          files=list(root.glob('*receipt*_r39t.json'))
          assert len(files)==1, files
          p=files[0]; raw=p.read_bytes(); r=json.loads(raw)
          assert r['football_api_requests']==r['api_keys_used']==0
          assert r['blind100_labels_accessed']==r['research_target_labels_used']==r['model_fits']==r['candidate_probabilities']==0
          assert r['formal_weight']==0
          sha_file=Path(str(p).replace('.json','.sha256'))
          assert sha_file.read_text().strip()==hashlib.sha256(raw).hexdigest()
          if r['schema_version']=='R39T-PRECHECK-RECEIPT-1.0':
              assert r['terminal']=='PASS_R39T_ZERO_NETWORK_PRECHECK' and r['network_requests']==0
          else:
              assert r['schema_version']=='R39T-WINDOW-CAPTURE-RECEIPT-1.0'
              assert r['terminal']=='PASS_R39T_WINDOW_CAPTURE'
              assert r['window'] in {'T90','T60','T30','T15'}
              assert re.fullmatch(r'[0-9a-f]{64}',r['rendered_dom_sha256'])
              doms=list(root.glob('*_rendered_dom__sha256_*.html'))
              assert len(doms)==1 and hashlib.sha256(doms[0].read_bytes()).hexdigest()==r['rendered_dom_sha256']
              if r['usable_as_confirmed_xi_feature']:
                  assert r['detector_state']=='CONFIRMED_XI' and r['starter_count']==22
                  assert len(r['home_starters'])==11 and len(r['away_starters'])==11
              else:
                  assert r['detector_state'] in {'PRE_ANNOUNCEMENT_SQUADS','UNKNOWN_FAIL_CLOSED'}
          print(json.dumps({'terminal':r['terminal'],'schema_version':r['schema_version'],'window':r.get('window'),'state':r.get('detector_state'),'starter_count':r.get('starter_count')},sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r39t-forward-window-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39t-window
          retention-days: 30
          if-no-files-found: error
