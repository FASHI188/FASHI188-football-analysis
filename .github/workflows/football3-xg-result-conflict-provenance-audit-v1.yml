name: Football3 XG Result Conflict Provenance Audit V1

on:
  push:
    branches:
      - football3/durable-state-cutoff-selector-governed-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-xg-result-conflict-provenance-audit-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify bound repair ancestry and protected surfaces
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5d44be4da1acd85c448bb043470e727f4de034b2 HEAD
          git diff --name-only 5d44be4da1acd85c448bb043470e727f4de034b2...HEAD | tee provenance_changed_files.txt
          if grep -E '(^|/)(formal_fusion_v2\.py|pure_engine\.py|historical_xg_challenger\.py|CURRENT|formal_pointer\.json|model_lock\.json)$' provenance_changed_files.txt; then
            echo 'protected scientific surface changed' >&2
            exit 1
          fi
          printf 'draft=true\nready=false\nmerge=false\nproduction_activation=false\nairtable_write=false\n' > provenance_authority.txt

      - name: Download frozen production source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .runtime_sources/understat .runtime_sources/confirmation
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" \
            -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" \
            -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation
          sha256sum .runtime_sources/understat/understat_frozen.db \
                    .runtime_sources/confirmation/confirmation_identity.jsonl \
                    .runtime_sources/confirmation/confirmation_xg_result_vault.jsonl \
            | tee provenance_source_sha256.txt

      - name: Reproduce conflict and emit row-level provenance
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1" \
            python3 football-data/formal_gpt_gateway_v1/audit_xg_result_conflict_provenance_v1.py \
              --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --out "$PWD/xg_result_conflict_provenance.json" \
            > provenance_stdout.txt 2> provenance_stderr.txt
          rc=$?
          set -e
          test "$rc" = '2'
          python3 - <<'PY'
          import json
          d=json.load(open('xg_result_conflict_provenance.json'))
          assert d['status']=='CONFLICT_REPRODUCED_FAIL_CLOSED'
          assert d['target_fixture_id']=='8ac7540a70af27118955481e'
          assert d['processed_result'] != d['xg_result']
          assert d['resolution_status']=='REQUIRES_AUTHORITATIVE_ADJUDICATION'
          assert d['conflict_gate_relaxed'] is False
          assert d['sample_deleted'] is False
          assert d['score_changed'] is False
          assert d['authoritative_adjudication'] is None
          print('PROVENANCE_CONFLICT_REPRODUCED', d['receipt_sha256'])
          PY
          sha256sum xg_result_conflict_provenance.json | tee provenance_receipt_file_sha256.txt

      - name: Upload provenance audit
        uses: actions/upload-artifact@v4
        with:
          name: football3-xg-result-conflict-provenance-${{ github.run_id }}
          path: |
            provenance_changed_files.txt
            provenance_authority.txt
            provenance_source_sha256.txt
            provenance_stdout.txt
            provenance_stderr.txt
            xg_result_conflict_provenance.json
            provenance_receipt_file_sha256.txt
          if-no-files-found: error
          retention-days: 90
