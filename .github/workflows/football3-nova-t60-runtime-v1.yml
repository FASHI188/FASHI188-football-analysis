name: football3-nova-t60-runtime

on:
  pull_request:
    paths:
      - 'governance/football3/nova_t60_runtime_activation_v1.json'
      - 'governance/football3/nova_t60_runtime_v1.py'
      - 'governance/football3/test_nova_t60_runtime_v1.py'
      - '.github/workflows/football3-nova-t60-runtime-v1.yml'
  push:
    branches: [main]
    paths:
      - 'governance/football3/nova_t60_runtime_activation_v1.json'
      - 'governance/football3/nova_t60_runtime_v1.py'
      - 'governance/football3/test_nova_t60_runtime_v1.py'
      - '.github/workflows/football3-nova-t60-runtime-v1.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-nova-t60-runtime-main
  cancel-in-progress: false

env:
  T60_IMPLEMENTATION_HEAD: bb3231932245016a51ffa838651a27cf192dc3e3
  T60_ARTIFACT_PREFIX: football3-nova-t60-runtime-state-

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout activation bridge exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout pinned T-60 implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ env.T60_IMPLEMENTATION_HEAD }}
          path: .t60_impl
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Static compile
        run: |
          set -euo pipefail
          python -m py_compile governance/football3/nova_t60_runtime_v1.py governance/football3/test_nova_t60_runtime_v1.py
      - name: Runtime contract tests
        run: |
          set -euo pipefail
          cd governance/football3
          python test_nova_t60_runtime_v1.py -v 2>&1 | tee /tmp/t60_runtime_tests.txt
          grep -q 'Ran 5 tests' /tmp/t60_runtime_tests.txt
          grep -q '^OK$' /tmp/t60_runtime_tests.txt
      - name: Live seven-league source validation
        run: |
          set -euo pipefail
          rm -rf live_source && mkdir -p live_source
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python .t60_impl/governance/football3/nova_t60_source_precheck_v1.py \
            --routes .t60_impl/governance/football3/nova_t60_source_routes_v1.json \
            --out-dir live_source \
            --observed-at "$OBSERVED_AT"
          python - <<'PY'
          import json
          p=json.load(open('live_source/receipt.json',encoding='utf-8'))
          assert p['status']=='T60_SOURCE_PRECHECK_PASS'
          assert p['competition_count']==7
          assert set(p['competitions'])=={'EPL','La_liga','Bundesliga','Serie_A','Ligue_1','J1','K1'}
          assert p['result_fields_read']==0 and p['secret_required'] is False
          assert p['retroactive_coverage_fabrication'] is False
          PY

  runtime:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout activated main bridge
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout pinned T-60 implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ env.T60_IMPLEMENTATION_HEAD }}
          path: .t60_impl
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Acquire live source projection
        run: |
          set -euo pipefail
          rm -rf live_source && mkdir -p live_source
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python .t60_impl/governance/football3/nova_t60_source_precheck_v1.py \
            --routes .t60_impl/governance/football3/nova_t60_source_routes_v1.json \
            --out-dir live_source \
            --observed-at "$OBSERVED_AT"
      - name: Restore latest immutable runtime state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf prior && mkdir -p prior
          python - <<'PY'
          import io, json, os, urllib.parse, urllib.request, zipfile
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; current=int(os.environ['CURRENT_RUN_ID']); prefix=os.environ['T60_ARTIFACT_PREFIX']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'football3-nova-t60-runtime'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return r.read()
          arts=json.loads(get(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100'))['artifacts']
          candidates=[a for a in arts if a['name'].startswith(prefix) and not a['expired'] and int(a.get('workflow_run',{}).get('id',-1)) != current]
          candidates.sort(key=lambda a:a['created_at'], reverse=True)
          if candidates:
              raw=get(candidates[0]['archive_download_url'])
              with zipfile.ZipFile(io.BytesIO(raw)) as z: z.extractall('prior')
              print('RESTORED_ARTIFACT', candidates[0]['id'], candidates[0]['name'])
          else:
              wf=urllib.parse.quote('football3-nova-t60-runtime-v1.yml', safe='')
              runs=json.loads(get(f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?per_page=20'))['workflow_runs']
              previous=[r for r in runs if int(r['id']) != current and r['status']=='completed' and r['conclusion']=='success' and r.get('head_branch')=='main']
              if previous:
                  raise SystemExit('PRIOR_RUNTIME_ARTIFACT_MISSING_DO_NOT_REINITIALIZE')
              print('FIRST_AUTHORITATIVE_RUNTIME_RUN_NO_PRIOR_STATE')
          PY
      - name: Run authoritative T-60 runtime tick
        run: |
          set -euo pipefail
          rm -rf runtime_out && mkdir -p runtime_out
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PRIOR_ARG=()
          if [ -f prior/runtime_state.json ]; then PRIOR_ARG=(--prior-dir prior); fi
          python governance/football3/nova_t60_runtime_v1.py \
            --config governance/football3/nova_t60_runtime_activation_v1.json \
            --source-dir live_source \
            "${PRIOR_ARG[@]}" \
            --out-dir runtime_out \
            --now "$NOW" \
            --implementation-head "$T60_IMPLEMENTATION_HEAD"
          python - <<'PY'
          import json
          p=json.load(open('runtime_out/receipt.json',encoding='utf-8'))
          assert p['status'] in {'T60_RUNTIME_ACTIVATED','T60_RUNTIME_TICK_PASS'}
          assert p['replay_coverage_start_at']
          assert p['result_fields_read']==0
          assert p['retroactive_coverage_fabrication'] is False
          assert p['formal_v2_changed'] is False and p['current_changed'] is False and p['production_changed'] is False
          assert p['candidate_weight']==0 and p['matrix_delta']==0
          PY
      - name: Upload immutable runtime state chain
        uses: actions/upload-artifact@v4
        with:
          name: football3-nova-t60-runtime-state-${{ github.run_id }}
          path: runtime_out/
          if-no-files-found: error
          retention-days: 90
