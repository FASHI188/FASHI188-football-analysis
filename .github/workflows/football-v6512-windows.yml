name: Football V6.51.2 Windows
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-v6512-windows.yml"
permissions:
  contents: write
concurrency:
  group: football-v6512-windows
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run corrected V6.51.2
        run: |
          PYTHONPATH=football-data/engine:football-data/validation python -m py_compile football-data/validation/v6_draw_rank_attack_nb_v6512.py football-data/validation/v6_draw_rank_attack_nb_v6512r2.py
          PYTHONPATH=football-data/engine:football-data/validation python football-data/validation/v6_draw_rank_attack_nb_v6512r2.py
      - name: Persist research receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_draw_rank_attack_nb_v6512_status.json \
            --message-prefix "audit(football): persist V6.51.2 rank-attack draw challenge"

# Research fallback only; formal weight remains zero. Trigger after workflow registration.
