name: football3 score R4 overdispersion

on:
  push:
    branches:
      - football3/score-r4-overdispersion
    paths:
      - football-data/experiments/score_r4_overdispersion/run_score_r4.py
      - .github/workflows/football3-score-r4-overdispersion.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  score-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/score-r4-overdispersion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R24 scale artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003
      - name: Run Score R4
        run: python football-data/experiments/score_r4_overdispersion/run_score_r4.py run
      - name: Verify Score R4 contract
        run: python football-data/experiments/score_r4_overdispersion/run_score_r4.py verify
      - name: Persist Score R4 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/score_r4_overdispersion/results/summary_score_r4.json
          if ! git diff --cached --quiet; then
            git commit -m '[generated] football3 score R4 overdispersion result'
            git push origin HEAD:football3/score-r4-overdispersion
          fi
      - name: Upload Score R4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-score-r4-overdispersion
          path: football-data/experiments/score_r4_overdispersion/results/summary_score_r4.json
          if-no-files-found: error
          retention-days: 90
