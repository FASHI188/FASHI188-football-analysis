name: User Pure S60 Live 2026-08-29

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - 'football-data/forward/inbox/user_s60_live_20260829.json'

permissions:
  contents: read

jobs:
  s60-live-pure-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger HEAD
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked S60 runtime
        run: |
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Run frozen S60 architecture prospectively with zero target labels
        env:
          S60_LIVE_INPUT: football-data/forward/inbox/user_s60_live_20260829.json
          S60_LIVE_OUT: s60_live_out
        run: python football-data/forward/run_user_s60_live_20260829.py
      - name: Verify pure-model contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('s60_live_out')
          d = json.loads((p/'s60_live_predictions.json').read_text())
          r = json.loads((p/'receipt.json').read_text())
          assert d['status'] == 'S60_LIVE_PURE_MODEL_COMPLETE'
          assert d['classification'] == 'TRUE_PROSPECTIVE_ZERO_TARGET_LABEL_PURE_MODEL'
          assert d['model_definition']['name'] == 'S60'
          assert d['model_definition']['manual_probability_adjustment'] is False
          assert d['model_definition']['market_probability_fallback'] is False
          assert d['information_boundary']['target_result_fields_loaded'] is False
          assert d['information_boundary']['target_xg_loaded'] is False
          assert d['information_boundary']['target_market_prices_loaded'] is False
          assert d['information_boundary']['target_lineup_evidence_loaded'] is False
          assert d['information_boundary']['target_rows_used_to_update_state'] is False
          assert r['rows'] == 6
          assert len(d['rows']) == 6
          for z in d['rows']:
              s = z['p_home'] + z['p_draw'] + z['p_away']
              assert abs(s - 1.0) < 1e-9
          print('PURE_S60_LIVE_CONTRACT_OK')
          print(json.dumps(r, sort_keys=True))
          PY
      - name: Upload pure S60 predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-s60-live-20260829-6
          path: s60_live_out/
          if-no-files-found: warn
          retention-days: 30
