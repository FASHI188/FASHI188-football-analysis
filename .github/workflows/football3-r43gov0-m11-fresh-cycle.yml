name: football3 R43GOV0 M11 fresh forward capture-lock cycle

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - 'football-data/governance/r43gov0/m11_cycle_heartbeat.txt'
  workflow_dispatch:

concurrency:
  group: football3-r43gov0-m11-fresh-cycle
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  m11-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2 pyarrow==18.1.0

      - name: Capture fresh atomic Kambi PIT snapshots
        id: capture
        shell: bash
        run: |
          set +e
          python football-data/validation/v6_full17_kambi_capture_v6484.py
          rc=$?
          echo "capture_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gate M11 prospective eligibility
        id: probe_gate
        env:
          CAPTURE_RC: ${{ steps.capture.outputs.capture_rc }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root = Path('football-data')
          manifest_path = root / 'manifests' / 'v6_full17_kambi_capture_v6482_status.json'
          outdir = Path('m11_probe')
          outdir.mkdir(parents=True, exist_ok=True)
          lock_utc = datetime(2026, 8, 29, 14, 12, 17, tzinfo=timezone.utc)

          def iso(v):
              x = datetime.fromisoformat(str(v).replace('Z', '+00:00'))
              if x.tzinfo is None:
                  raise ValueError(f'timezone missing: {v}')
              return x.astimezone(timezone.utc)

          gate = {
              'schema_version': 'football3-r43gov0-m11-prospective-kambi-probe-v1',
              'status': 'BLOCKED_CAPTURE_MANIFEST_MISSING',
              'prereg_lock_commit': '5ad4d48acee540dc2f6bb651228b202b06a4f713',
              'prereg_lock_utc': lock_utc.isoformat(),
              'prediction_cutoff': 'T_minus_60_minutes',
              'prediction_cutoff_tolerance_minutes': 0,
              'same_snapshot_1x2_ah_ou_required': True,
              'outcome_data_read': False,
              'capture_rc': int(os.environ.get('CAPTURE_RC') or -999),
              'candidates': [],
              'errors': [],
          }
          if not manifest_path.exists():
              gate['errors'].append('capture manifest not written')
          else:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              gate['capture_manifest_status'] = manifest.get('status')
              gate['target_group_event_count'] = int(manifest.get('target_group_event_count') or 0)
              gate['not_started_target_event_count'] = int(manifest.get('not_started_target_event_count') or 0)
              gate['identity_resolved_count'] = int(manifest.get('identity_resolved_count') or 0)
              gate['identity_unresolved_count'] = int(manifest.get('identity_unresolved_count') or 0)
              gate['detail_or_market_fail_count'] = int(manifest.get('detail_or_market_fail_count') or 0)
              gate['formal_snapshot_count_available'] = int(manifest.get('formal_snapshot_count_available') or 0)
              valid = []
              for row in manifest.get('events') or []:
                  rel = row.get('formal_snapshot_path')
                  if not rel:
                      continue
                  p = root / rel
                  if not p.exists():
                      gate['errors'].append(f'missing formal snapshot:{rel}')
                      continue
                  s = json.loads(p.read_text(encoding='utf-8'))
                  try:
                      observed = iso(s['source_observed_at_utc'])
                      kickoff = iso(s['kickoff_utc'])
                      surfaces = s['surface_observed_at_utc']
                      surface_times = [iso(surfaces[k]) for k in ('one_x_two','asian_handicap','over_under')]
                      atomic = all(t == observed for t in surface_times)
                      complete = (
                          all(k in s['one_x_two'] for k in ('home','draw','away')) and
                          all(k in s['asian_handicap'] for k in ('line','home','away')) and
                          all(k in s['over_under'] for k in ('line','over','under'))
                      )
                      after_lock = observed >= lock_utc
                      before_cutoff = observed <= kickoff - timedelta(minutes=60)
                      if atomic and complete and after_lock and before_cutoff:
                          valid.append({
                              'competition_id': s['competition_id'],
                              'home_team': s['home_team'],
                              'away_team': s['away_team'],
                              'kickoff_utc': s['kickoff_utc'],
                              'observed_at_utc': s['source_observed_at_utc'],
                              'provider_event_id': row.get('event_id'),
                              'formal_snapshot_path': rel,
                              'snapshot_sha256': s.get('raw_snapshot_sha256') or hashlib.sha256(p.read_bytes()).hexdigest(),
                          })
                  except Exception as exc:
                      gate['errors'].append(f'{rel}:{type(exc).__name__}:{exc}')
              valid.sort(key=lambda x: (x['kickoff_utc'], str(x['provider_event_id'])))
              gate['fresh_atomic_t60_eligible_count'] = len(valid)
              gate['candidates'] = valid[:300]
              status = str(manifest.get('status') or '')
              if status == 'LISTVIEW_FAIL_CLOSED':
                  gate['status'] = 'BLOCKED_EXTERNAL_DATA'
                  gate['errors'].append(str(manifest.get('error') or 'Kambi listView failed'))
              elif gate['target_group_event_count'] == 0:
                  gate['status'] = 'WAIT_NO_TARGET_EVENTS'
              elif gate['formal_snapshot_count_available'] == 0:
                  gate['status'] = 'BLOCKED_NO_ATOMIC_PIT'
              elif valid:
                  gate['status'] = 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
              else:
                  gate['status'] = 'WAIT_NO_T60_ELIGIBLE_FRESH_SNAPSHOT'
          (outdir / 'gate.json').write_text(json.dumps(gate, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"status={gate['status']}\n")
          print(json.dumps({k: gate.get(k) for k in (
              'status','capture_manifest_status','target_group_event_count','identity_resolved_count',
              'identity_unresolved_count','detail_or_market_fail_count','formal_snapshot_count_available',
              'fresh_atomic_t60_eligible_count','capture_rc')}, ensure_ascii=False, indent=2))
          PY

      - name: Materialize exact frozen R9b 20k source snapshot
        if: steps.probe_gate.outputs.status == 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze

      - name: Download frozen R24 60k history artifact
        if: steps.probe_gate.outputs.status == 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r24-history-scale-curve
          path: football-data/experiments/top1_r25_fresh_s60_confirmation/r24_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939928003

      - name: Materialize exact frozen R43Q source blob
        if: steps.probe_gate.outputs.status == 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
        run: |
          mkdir -p /tmp/r43q/football-data/experiments/r43q0_sharp_market_score_base
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/FASHI188/FASHI188-football-analysis/d738d5066d5c5a79eb4ee5856c034ee239521706/football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py \
            --output /tmp/r43q/football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py
          test "$(git hash-object /tmp/r43q/football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py)" = "299b86ed07e49af0b9ec5c7632f519e91e836158"

      - name: Apply safe deterministic identity alias overlay
        if: steps.probe_gate.outputs.status == 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('football-data/runtime/run_m11_fresh_forward_lockbox.py')
          s=p.read_text(encoding='utf-8')
          marker='    fixed = {\n'
          aliases='''        "pec zwolle": "zwolle",\n        "nec nijmegen": "nijmegen",\n        "atletico madrid": "ath madrid",\n        "gimnasia la plata": "gimnasia l p",\n        "gimnasia (mendoza)": "gimnasia mendoza",\n        "red bull bragantino": "bragantino",\n        "atlanta united": "atlanta utd",\n        "d c united": "dc united",\n        "vasco da gama": "vasco",\n        "talleres (cordoba)": "talleres cordoba",\n        "hammarby if": "hammarby",\n        "leeds united": "leeds",\n        "sc freiburg": "freiburg",\n        "athletico pr": "atletico paranaense",\n        "ifk goteborg": "goteborg",\n        "viking fk": "viking",\n        "hamarkameratene": "ham kam",\n        "kristiansund bk": "kristiansund",\n        "manchester united": "man united",\n        "ipswich town": "ipswich",\n        "feyenoord rotterdam": "feyenoord",\n        "ajax amsterdam": "ajax",\n        "c d nacional": "nacional",\n        "belgrano (cordoba)": "belgrano",\n        "atletico tucuman": "atl tucuman",\n        "stade rennais": "rennes",\n        "as monaco": "monaco",\n'''
          if marker not in s:
              raise SystemExit('alias fixed-dict marker missing')
          s=s.replace(marker, marker+aliases, 1)

          fallback_marker='''                mapped[event_id] = rec\n        audits.append(rec)\n    receipt = {\n'''
          fallback='''                mapped[event_id] = rec\n        if rec["status"] == "UNRESOLVED" and not rec.get("fixture_candidates") and LOCKBOX.exists():\n            prior = json.loads(LOCKBOX.read_text(encoding="utf-8"))\n            known_leagues = sorted({\n                str(r.get("hf_league_id")) for r in (prior.get("rows") or [])\n                if str(r.get("competition_id")) == cid and r.get("hf_league_id") is not None\n            })\n            if len(known_leagues) == 1:\n                known_league = known_leagues[0]\n                fq = fixtures[fixtures["league_id"].astype(str) == known_league]\n                seen_ids = set(fq["home_team_id"].astype(str)) | set(fq["away_team_id"].astype(str))\n                home_in_league = sorted(set(home_ids) & seen_ids)\n                away_in_league = sorted(set(away_ids) & seen_ids)\n                if len(home_in_league) == 1 and len(away_in_league) == 1:\n                    rec.update({\n                        "status": "RESOLVED_SAFE_COMPETITION_LEAGUE_HISTORY",\n                        "selection_rule": "unique_exact_team_ids_in_frozen_competition_league_metadata",\n                        "fixture_id": f"kambi:{event_id}",\n                        "hf_kickoff_utc": kickoff.isoformat(),\n                        "league_id": known_league,\n                        "home_team_id": home_in_league[0],\n                        "away_team_id": away_in_league[0],\n                    })\n                    mapped[event_id] = rec\n        if (rec["status"] == "UNRESOLVED" and len(home_ids) == 1 and len(away_ids) == 1\n                and not rec.get("fixture_candidates")):\n            rec.update({\n                "status": "RESOLVED_SAFE_TEAM_IDS_PROVIDER_FIXTURE",\n                "selection_rule": "unique_exact_registry_team_ids_provider_fixture_identity",\n                "fixture_id": f"kambi:{event_id}",\n                "hf_kickoff_utc": kickoff.isoformat(),\n                "league_id": cid,\n                "home_team_id": home_ids[0],\n                "away_team_id": away_ids[0],\n            })\n            mapped[event_id] = rec\n        audits.append(rec)\n    receipt = {\n'''
          if fallback_marker not in s:
              raise SystemExit('safe mapping fallback marker missing')
          s=s.replace(fallback_marker, fallback, 1)
          s=s.replace('"mapping_method": "safe_hf_fixture_metadata_exact_pair",', '"mapping_method": "safe_exact_team_identity_no_fuzzy",', 1)
          p.write_text(s,encoding='utf-8')
          print('safe deterministic identity overlay applied: 27 aliases + frozen league metadata disambiguation')
          PY

      - name: Run M11 fresh four-config lockbox
        if: steps.probe_gate.outputs.status == 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
        run: |
          python football-data/runtime/run_m11_fresh_forward_lockbox.py \
            --probe-root . \
            --r43q-source /tmp/r43q/football-data/experiments/r43q0_sharp_market_score_base/run_r43q0.py

      - name: Verify M11 contract
        if: steps.probe_gate.outputs.status == 'PASS_FRESH_ATOMIC_PIT_AVAILABLE'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('football-data/runtime/results/m11_fresh_forward_lockbox/gate.json').read_text())
          assert str(g['status']).startswith(('PASS','WARN')), g
          if 'all_locked_rows_have_four_configs' in g:
              assert g['all_locked_rows_have_four_configs'] is True
              assert g['all_locked_rows_market_at_or_before_T60'] is True
              assert g['all_locked_rows_prediction_at_or_before_T60'] is True
              assert g['fresh_outcomes_read'] is False
          print(json.dumps({k:g.get(k) for k in ['status','probe_candidates','safe_identity_mapped','new_rows_locked','total_enrolled_rows','mapping_unresolved_count','numerical_error_count']},indent=2))
          PY

      - name: Persist fresh lockbox and normalized evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- football-data/runtime/run_m11_fresh_forward_lockbox.py || true
          git add football-data/forward/m11_fresh_forward_300_lockbox.json || true
          git add football-data/evidence/markets_prospective || true
          git add football-data/evidence/direct_provider_probes/kambi/full17 || true
          if git diff --cached --quiet; then
            echo 'No M11 persistent changes'
          else
            git commit -m 'football3: persist M11 fresh forward cycle'
            git push origin HEAD:football3/r43gov0-unified-governance-audit
          fi

      - name: Upload M11 cycle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m11-fresh-cycle
          path: |
            m11_probe/gate.json
            football-data/manifests/v6_full17_kambi_capture_v6482_status.json
            football-data/runtime/results/m11_fresh_forward_lockbox/gate.json
            football-data/forward/m11_fresh_forward_300_lockbox.json
          if-no-files-found: warn
          retention-days: 90
