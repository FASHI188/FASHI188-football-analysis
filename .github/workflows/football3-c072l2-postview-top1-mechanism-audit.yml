name: football3-c072l2-postview-top1-mechanism-audit

on:
  pull_request:
    branches:
      - football3/c072k2-joint-low-score-confirm-20260819
    paths:
      - 'football-data/research/C072L2_POSTVIEW_TOP1_MECHANISM_AUDIT.md'
      - 'football-data/research/audit_c072l2_postview_top1_mechanism.py'
      - '.github/workflows/football3-c072l2-postview-top1-mechanism-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==2.1.3 scikit-learn==1.7.1
      - name: Diagnostic-only contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072L2_POSTVIEW_TOP1_MECHANISM_AUDIT.md').read_text()
          assert 'Diagnostic only' in c
          assert 'No model fit changes.' in c
          assert 'No score-specific or Draw/0-0/1-1 boost.' in c
          assert 'C073-C077 remain quarantined' in c
          print('L2 diagnostic guard: PASS')
          PY
      - name: Run post-view audit
        run: python football-data/research/audit_c072l2_postview_top1_mechanism.py
      - name: Boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072l2_top1_mechanism_summary.json').read_text())
          b=x['boundary']
          assert x['scientific_confirmation'] is False
          assert b['model_recipe_changed'] is False
          assert b['tuning_performed'] is False
          assert b['score_boost'] is False
          assert b['C073_C077_quarantined'] is True
          assert b['C070F_confirmation1597_opened'] is False
          print('L2 boundaries: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072l2-top1-mechanism-audit
          path: football-data/research/c072l2_top1_mechanism_summary.json
