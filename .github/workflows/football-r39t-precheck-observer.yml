name: Football R39T Precheck Observer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/football-r39t-precheck-observer.yml'

permissions:
  contents: read
  actions: read

env:
  AUTHORIZED_PRECHECK_HEAD: ba4199aa3c8bfe6efa096866c85eb143117748e4
  TARGET_WORKFLOW: football-r39t-forward-window-capture.yml

jobs:
  observe-r39t-precheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Audit exact zero-network precheck
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r39t-precheck-observer"
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          from pathlib import Path
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; head=os.environ['AUTHORIZED_PRECHECK_HEAD']; wf=os.environ['TARGET_WORKFLOW']
          base='https://api.github.com'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'FASHI188-r39t-precheck-observer'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read())
          q=urllib.parse.urlencode({'branch':'research/premierleague-forward-windows-r39t','event':'push','per_page':20})
          selected=None
          for _ in range(60):
              data=get('/repos/'+repo+'/actions/workflows/'+wf+'/runs?'+q)
              matches=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==head]
              if len(matches)==1:
                  selected=matches[0]
                  if selected.get('status')=='completed': break
              time.sleep(5)
          if selected is None: raise SystemExit('R39T_PRECHECK_RUN_NOT_FOUND')
          rid=int(selected['id'])
          jobs=get(f'/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs',[])
          arts=get(f'/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100').get('artifacts',[])
          steps=[{'job_id':j.get('id'),'job_name':j.get('name'),'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for j in jobs for s in (j.get('steps') or [])]
          failed=[s for s in steps if s.get('conclusion')=='failure']
          rarts=[a for a in arts if str(a.get('name','')).startswith('football-r39t-forward-window-')]
          receipt={'schema_version':'R39T-PRECHECK-OBSERVER-1.0','authorized_precheck_head':head,'precheck_run_id':rid,'run_status':selected.get('status'),'run_conclusion':selected.get('conclusion'),'first_failed_step':failed[0]['name'] if failed else None,'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs],'steps':steps,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'digest':a.get('digest'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired')} for a in rarts],'artifact_count':len(rarts),'precheck_pass_claimed':selected.get('conclusion')=='success' and len(rarts)==1,'football_api_requests':0,'formal_weight':0}
          out=Path(os.environ['RUNNER_TEMP'])/'r39t-precheck-observer/observer_receipt.json';out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'run_id':rid,'status':receipt['run_status'],'conclusion':receipt['run_conclusion'],'first_failed_step':receipt['first_failed_step'],'artifact_count':receipt['artifact_count'],'precheck_pass_claimed':receipt['precheck_pass_claimed']},sort_keys=True))
          if receipt['run_status']!='completed': raise SystemExit('R39T_PRECHECK_NOT_TERMINAL')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r39t-precheck-observer-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39t-precheck-observer
          retention-days: 30
          if-no-files-found: error
