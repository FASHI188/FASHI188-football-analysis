name: Football V6.25.3 Shot Feature Smoke

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_shot_feature_offset_v6253_smoke.py"
      - ".github/workflows/football-v6253-shot-feature-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run smoke
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_shot_feature_offset_v6253_smoke.py
      - name: Persist smoke receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_shot_feature_offset_v6253_smoke_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.3 shot-feature smoke"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
