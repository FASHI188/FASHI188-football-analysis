name: Football3 V3 C3 Sealed Historical OOS Coverage V1
on:
  push:
    branches: [football3/v3-c3-sealed-historical-oos-v1]
    paths:
      - governance/football3/v3_c3_sealed_historical_oos_contract_v1.json
      - governance/football3/v3_c3_historical_oos_coverage_audit_v1.json
      - governance/football3/test_v3_c3_sealed_historical_oos_contract_v1.py
      - governance/football3/validate_v3_c3_sealed_historical_oos_v1.py
      - .github/workflows/football3-v3-c3-sealed-historical-oos-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  zero-label-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile governance/football3/validate_v3_c3_sealed_historical_oos_v1.py governance/football3/test_v3_c3_sealed_historical_oos_contract_v1.py
      - name: Permanent tests
        run: |
          python -m pip install pytest
          pytest -q governance/football3/test_v3_c3_sealed_historical_oos_contract_v1.py
      - name: Zero-label coverage validator
        run: python governance/football3/validate_v3_c3_sealed_historical_oos_v1.py | tee coverage_validator.json
      - name: Seal evidence
        uses: actions/upload-artifact@v4
        with:
          name: football3-v3-c3-sealed-historical-oos-v1
          path: |
            governance/football3/v3_c3_sealed_historical_oos_contract_v1.json
            governance/football3/v3_c3_historical_oos_coverage_audit_v1.json
            coverage_validator.json
          if-no-files-found: error
