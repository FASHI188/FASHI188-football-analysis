name: Football XI FotMob Direct Page Capture R1

on:
  workflow_dispatch:
  push:
    branches:
      - research/xi-availability-multitimepoint-r1
    paths:
      - football-data/research/eng_pl_2026_27_mw1_fotmob_match_pages_freeze_20260816.json
      - football-data/research/xi_fotmob_direct_page_capture_r1.py
      - .github/workflows/football-xi-fotmob-direct-page-capture-r1.yml

permissions:
  contents: read

concurrency:
  group: football-xi-fotmob-direct-page-capture-r1
  cancel-in-progress: true

jobs:
  zero-label-direct-page-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/xi-availability-multitimepoint-r1
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile direct page probe
        run: python -m py_compile football-data/research/xi_fotmob_direct_page_capture_r1.py

      - name: Run zero-label direct FotMob target-page capture
        shell: bash
        run: |
          set +e
          python football-data/research/xi_fotmob_direct_page_capture_r1.py
          rc=$?
          echo "CAPTURE_EXIT_CODE=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Show structural adjudication
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('football-data/research/artifacts/xi_fotmob_direct_page_capture_r1/capture_status.json')
          if not p.exists():
              raise SystemExit('capture_status.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          keys = [
              'verdict','fetched_page_count','identity_bound_page_count',
              'next_surface_page_count','next_data_parsed_page_count',
              'pages_with_availability_markers','pages_with_lineup_markers','errors',
              'confirmed_xi_claim','scientific_claim'
          ]
          print(json.dumps({k:d.get(k) for k in keys}, ensure_ascii=False, indent=2))
          for row in d.get('page_rows') or []:
              print(json.dumps({
                  'match_id': row.get('match_id'),
                  'raw_sha256': row.get('raw_sha256'),
                  'observed_at_utc': row.get('observed_at_utc'),
                  'retrieved_at_utc': row.get('retrieved_at_utc'),
                  'next_surface': row.get('next_surface'),
                  'next_data_parsed': row.get('next_data_parsed'),
                  'availability_marker_counts': row.get('availability_marker_counts'),
                  'lineup_marker_counts': row.get('lineup_marker_counts'),
                  'prediction_marker_counts': row.get('prediction_marker_counts'),
                  'actual_xi_marker_counts': row.get('actual_xi_marker_counts'),
              }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload raw zero-label target-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-fotmob-direct-page-capture-r1
          path: football-data/research/artifacts/xi_fotmob_direct_page_capture_r1/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce capture verdict
        if: always()
        shell: bash
        run: |
          if [ "${CAPTURE_EXIT_CODE:-99}" -ne 0 ]; then
            echo "direct FotMob page capture STOP: ${CAPTURE_EXIT_CODE:-99}"
            exit "${CAPTURE_EXIT_CODE:-99}"
          fi

      - name: Confirm research-only no repository persistence
        if: always()
        run: git status --short
