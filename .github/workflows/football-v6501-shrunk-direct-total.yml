name: Football V6.50.1 Shrunk Direct Total Challenge

on:
  workflow_dispatch:
  schedule:
    - cron: "57 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_shrunk_direct_total_v6501.py"
      - ".github/workflows/football-v6501-shrunk-direct-total.yml"

permissions:
  contents: write

concurrency:
  group: football-v6501-shrunk-direct-total
  cancel-in-progress: true

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile shrunk direct-total challenge
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python -m py_compile football-data/validation/v6_shrunk_direct_total_v6501.py
      - name: Calibrate on pre-test history then timestamp and freeze prospective totals
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_shrunk_direct_total_v6501.py
      - name: Persist only shrunk-total challenge ledger and receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_shrunk_direct_total_v6501_freeze.json \
            --allow-prefix football-data/forward/v6_shrunk_direct_total_events_v6501.json \
            --allow-prefix football-data/manifests/v6_shrunk_direct_total_v6501_status.json \
            --message-prefix "audit(football): persist V6.50.1-r2 shrunk direct-total challenge"
      - name: Hard time-order and governance guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_shrunk_direct_total_v6501_status.json')
          if not p.exists(): raise SystemExit('V6.50.1 status missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          if x.get('status') != 'PASS' or x.get('schema_version') != 'V6.50.1-shrunk-direct-total-status-r2': raise SystemExit(str(x))
          f=x.get('freeze') or {}; c=f.get('calibration') or {}; d=c.get('development_design') or {}; ta=f.get('timing_audit') or {}; g=x.get('governance') or {}
          if f.get('schema_version') != 'V6.50.1-shrunk-direct-total-freeze-r2': raise SystemExit('old timing schema forbidden')
          if ta.get('calibration_completed_before_freeze_timestamp') is not True or ta.get('per_event_timestamp_sampled_after_candidate_computation') is not True: raise SystemExit('prospective timestamp audit failed')
          if d.get('strictly_before_recent_two_season_fixed1000_window_by_domain') is not True or d.get('same_day_predict_before_update') is not True: raise SystemExit('development time-order guard failed')
          if c.get('selection_rule') != 'minimum development total log loss, then RPS, then lower weight': raise SystemExit('weight selection rule drift')
          w=float(c.get('chosen_weight')); fixed=c.get('fixed1000_diagnostic') or {}; pd=x.get('prospective_diagnostics') or {}
          if w < 0 or w > 1: raise SystemExit('invalid shrink weight')
          if fixed.get('classification') != 'RETROSPECTIVE_DIAGNOSTIC_ONLY_NOT_PROMOTION_EVIDENCE': raise SystemExit('fixed1000 governance failed')
          if pd.get('count',0) and float(pd.get('minimum_actual_lead_hours_at_freeze') or 0.0) < 1.0: raise SystemExit('actual event lead below one hour')
          if g.get('source_probability_mutation') is not False or g.get('source_matrix_mutation') is not False: raise SystemExit('source mutation forbidden')
          if g.get('historical_backfill') is not False or g.get('formal_weight') != 0 or g.get('automatic_promotion') is not False or g.get('current_rule_change') is not False: raise SystemExit('forward governance failed')
          print(json.dumps({'chosen_weight':w,'development':c.get('chosen_development_metrics'),'fixed1000':fixed,'prospective':pd,'evaluation':x.get('evaluation')},ensure_ascii=False))
          PY

# Research only. Calibration must finish before any prospective timestamp is sampled.
# A slower job can lose a fixture; it may never move the freeze time backwards to keep it.
