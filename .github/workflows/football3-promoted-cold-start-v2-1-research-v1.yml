name: Football3 Promoted Cold Start V2.1 Research V1

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [reopened, synchronize]
    paths:
      - 'football-data/research/promoted_cold_start_v2_1/**'
      - '.github/workflows/football3-promoted-cold-start-v2-1-research-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-v21-evaluator-pr350-rd482ff53313d9e34df07e87a4bdfaa158841ff61
  cancel-in-progress: false

env:
  PR_NUMBER: '350'
  RESEARCH_BRANCH: 'football3/promoted-cold-start-v2-1-research-clean-v1'
  EXACT_BASE: '0bfcd824d855161595226f3a67b33c4cfa9ab8a3'
  PRELABEL_FREEZE_COMMIT: 'f238837e6b9635caaf009755d49fb64b46cf5622'
  WRAPPER_COMMIT: '3df1ce60568826ed19f81df177d947b47c748408'
  PREREG_BLOB: '30c45da908540ad99aab51024729d554a7047c7a'
  EVALUATOR_BLOB: '849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1'
  PRELABEL_RECEIPT_BLOB: 'd482ff53313d9e34df07e87a4bdfaa158841ff61'
  RUNTIME_BLOB: '8994226369094908beb410ce454d19fd7272c3df'
  TEAM_ALIASES_BLOB: '6248028352308ceda6800794c0ee3f5ceca223a9'
  OUTPUT_INTERFACE_BLOB: '7a57f49b510b8b099726b4be3d47bf3c2b091c42'
  WRAPPER_BLOB: 'a47141391eb328b24bef269f3328167527aa3fb4'
  SOURCE_TRANSITION_BLOB: '3139b147614d6e34403f9c807fd90c17a890f2e1'
  TRANSPORT_MIRROR_BLOB: '8980a42025683304c0221090f9341eef150e0cc6'
  NONSTANDARD_FIXTURE_BLOB: 'ea4d21139815c625e82b148e79abd18501f06d89'
  NONSTANDARD_FIXTURE_APPEND_BLOB: 'dcdc712186d7707d26f308980483f76549c29978'
  V6188_CLOSURE_BLOB: '87b43c4a45890828312a8a93b3868b7b2f471df3'
  V6187_DATE_RULE_BLOB: 'f0d2546bce183a92076bcca05b139be41106894d'
  RESULT_MANIFEST_BLOB: 'a9d8c1ce964008ef6caefb169b444075f587e64f'
  RESULT_ADJ_V1_BLOB: '86a1b745c698744818e4f936aea694743bae16db'
  FROZEN_XG_ADJ_V1_BLOB: '4959d165c6bcced39da0b11a1a0eb0d990b52130'
  FROZEN_XG_ADJ_V2_BLOB: '568cd28170b60430d57274ca8615b7a84132c3a8'
  RESULT_ADJ_V2_BLOB: '356c882b54592bb61e35c3b5db5eab3a1f2f98a3'
  RELEASE_ORDER_BLOB: '3ce4ce4e10b4944cb2268f1bd6355672d65bfeb0'
  UNDERSTAT_ARTIFACT_ID: '9798682425'
  CONFIRMATION_ARTIFACT_ID: '9827606506'
  CORE_AUDIT_ARTIFACT_ID: '9992599594'
  CORE_AUDIT_ARTIFACT_DIGEST: '76cdf78233e84f1f57edfe8b6879d2a02e74a4ea74b86e1fe70d65154e970053'
  CORE_AUDIT_FILE_SHA256: '56a5ba1c6b3412f9c1c6496b25a8e1bfa296475ca1b8a305165d192a232b9deb'
  ATTEMPT_ARTIFACT_NAME: 'football3-v21-evaluator-attempt-pr350-p30c45da908540ad99aab51024729d554a7047c7a-e849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1-rd482ff53313d9e34df07e87a4bdfaa158841ff61'
  RESULT_ARTIFACT_NAME: 'football3-v21-evaluator-result-pr350-p30c45da908540ad99aab51024729d554a7047c7a-e849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1-rd482ff53313d9e34df07e87a4bdfaa158841ff61'

jobs:
  unique-frozen-evaluator:
    if: ${{ github.event.pull_request.number == 350 && github.event.pull_request.head.ref == 'football3/promoted-cold-start-v2-1-research-clean-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact PR head, frozen science, and pre-label hard gates
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          test "$EVENT_PR_NUMBER" = "$PR_NUMBER"
          case "$EVENT_ACTION" in reopened|synchronize) ;; *) echo "unexpected PR action: $EVENT_ACTION" >&2; exit 1 ;; esac
          test "$EVENT_HEAD_REF" = "$RESEARCH_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXACT_BASE" HEAD
          git merge-base --is-ancestor "$PRELABEL_FREEZE_COMMIT" HEAD
          git merge-base --is-ancestor "$WRAPPER_COMMIT" HEAD

          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PREREGISTRATION.json)" = "$PREREG_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/evaluate.py)" = "$EVALUATOR_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json)" = "$PRELABEL_RECEIPT_BLOB"
          test "$(git hash-object football-data/formal_fast_runtime_v1/runtime.py)" = "$RUNTIME_BLOB"
          test "$(git hash-object football-data/config/team_aliases.json)" = "$TEAM_ALIASES_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/CANDIDATE_OUTPUT_INTERFACE_V1.json)" = "$OUTPUT_INTERFACE_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/run_frozen_evaluator_after_prelabel_v1.py)" = "$WRAPPER_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SOURCE_TRANSITION.json)" = "$SOURCE_TRANSITION_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_METRIC_TRANSPORT_MIRROR_TRANSITION.json)" = "$TRANSPORT_MIRROR_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION.json)" = "$NONSTANDARD_FIXTURE_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION_2.json)" = "$NONSTANDARD_FIXTURE_APPEND_BLOB"
          test "$(git hash-object football-data/manifests/v6_understat_alias_closure_v6188_status.json)" = "$V6188_CLOSURE_BLOB"
          test "$(git hash-object football-data/validation/v6_understat_alias_qualification_v6187.py)" = "$V6187_DATE_RULE_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/result_adjudications_v1.json)" = "$RESULT_MANIFEST_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_result_adjudication_v1.py)" = "$RESULT_ADJ_V1_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_frozen_xg_identity_adjudication_v1.py)" = "$FROZEN_XG_ADJ_V1_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_frozen_xg_identity_adjudication_v2.py)" = "$FROZEN_XG_ADJ_V2_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_result_adjudication_v2.py)" = "$RESULT_ADJ_V2_BLOB"
          test "$(git hash-object football-data/formal_gpt_gateway_v1/formal_v1_release_order_replay_v1.py)" = "$RELEASE_ORDER_BLOB"

          git diff --name-only "$EXACT_BASE"...HEAD | tee research-changed-files.txt
          if grep -E '(^|/)(CURRENT|formal_fusion_v2.py|historical_xg_challenger.py|pure_engine.py|team_aliases.json)$|historical_xg_fusion_v2/.*/(model|parameter|weight)|formal_fast_runtime_v1/runtime.py$|formal_gpt_gateway_v1/(entry|gateway).py$' research-changed-files.txt; then
            echo 'protected science/runtime drift detected' >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          p='football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='PASS_PRE_LABEL_HARD_GATES'
          assert d['hard_gates']=={'joined':5330,'expected_joined':5330,'missing':0,'extra':0,'ambiguous':0,'duplicate':0,'time_leakage':0,'pass':True}
          science=d.get('science_lock') or {}
          assert science['candidate_metrics_computed'] is False
          assert science['candidate_evaluator_invoked'] is False
          assert science['candidate_parameters_or_gates_modified'] is False
          assert science['candidate_sample_or_cohort_modified'] is False
          assert science['preregistration_modified'] is False
          assert science['evaluator_modified'] is False
          assert science['production_runtime_modified'] is False
          assert science['team_aliases_modified'] is False
          assert science['formal_model_or_current_modified'] is False
          o=json.load(open('football-data/research/promoted_cold_start_v2_1/CANDIDATE_OUTPUT_INTERFACE_V1.json',encoding='utf-8'))
          assert o['status']=='FROZEN_BEFORE_UNIQUE_EVALUATOR_ATTEMPT'
          assert o['source_of_truth']['preregistration_git_blob_sha']=='30c45da908540ad99aab51024729d554a7047c7a'
          assert o['source_of_truth']['evaluator_git_blob_sha']=='849e92d36b3f9838b3d931ad80c03ad3ce1eb8c1'
          assert o['source_of_truth']['pre_label_receipt_git_blob_sha']=='d482ff53313d9e34df07e87a4bdfaa158841ff61'
          PY

          test ! -e football-data/research/promoted_cold_start_v2_1/EVALUATOR_ATTEMPT_RECEIPT.json
          test ! -e football-data/research/promoted_cold_start_v2_1/EVALUATOR_RESULT_RECEIPT.json
          mkdir -p research-output .runtime_sources/understat .runtime_sources/confirmation .runtime_sources/core .footballdata_mirror_raw .research_sources

      - name: Refuse any prior evaluator attempt or result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          for name in (os.environ['ATTEMPT_ARTIFACT_NAME'],os.environ['RESULT_ARTIFACT_NAME']):
              url=f"https://api.github.com/repos/{repo}/actions/artifacts?name={urllib.parse.quote(name)}&per_page=100"
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r: d=json.load(r)
              exact=[a for a in d.get('artifacts',[]) if a.get('name')==name]
              if exact:
                  raise SystemExit(f'evaluator already consumed by artifact {name}: {[a.get("id") for a in exact]}')
          PY

      - name: Acquire frozen formal sources and governed current-audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "$UNDERSTAT_ARTIFACT_ID:.runtime_sources/understat.zip" \
            "$CONFIRMATION_ARTIFACT_ID:.runtime_sources/confirmation.zip" \
            "$CORE_AUDIT_ARTIFACT_ID:.runtime_sources/core.zip"; do
            id="${spec%%:*}"; dst="${spec#*:}"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$dst"
          done
          test "$(sha256sum .runtime_sources/core.zip | awk '{print $1}')" = "$CORE_AUDIT_ARTIFACT_DIGEST"
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation
          unzip -q .runtime_sources/core.zip -d .runtime_sources/core
          test -f .runtime_sources/understat/understat_frozen.db
          test -f .runtime_sources/confirmation/confirmation_identity.jsonl
          test -f .runtime_sources/confirmation/confirmation_xg_result_vault.jsonl
          test -f .runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json
          test "$(sha256sum .runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json | awk '{print $1}')" = "$CORE_AUDIT_FILE_SHA256"
          python3 - <<'PY'
          import json
          p='.runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json'
          d=json.load(open(p,encoding='utf-8'))
          big5=('ENG_PremierLeague','ESP_LaLiga','GER_Bundesliga','ITA_SerieA','FRA_Ligue1')
          n=0
          for c in big5:
              x=d['domains'][c]
              assert x['final_guard_status']=='PASS',(c,x['final_guard_status'])
              assert not x['missing'] and not x['extra'] and not x['ambiguous'] and not x['duplicate_canonical_identity']
              n+=len(x['promoted_entering_clubs'])
          assert n==14,n
          PY
          sha256sum \
            .runtime_sources/understat/understat_frozen.db \
            .runtime_sources/confirmation/confirmation_identity.jsonl \
            .runtime_sources/confirmation/confirmation_xg_result_vault.jsonl \
            .runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json \
            > research-output/frozen-input-files.sha256

      - name: Acquire frozen Football-Data lower-tier result history
        run: |
          set -euo pipefail
          python3 - <<'PY' > .footballdata-mirror-plan.tsv
          import json
          d=json.load(open('football-data/research/promoted_cold_start_v2_1/PRE_METRIC_TRANSPORT_MIRROR_TRANSITION.json'))
          assert d['status']=='FROZEN_BEFORE_CANDIDATE_EVALUATION'
          assert d['candidate_metric_observations_before_transition']==0
          assert d['candidate_evaluator_completed_before_transition'] is False
          m=d['mirror']
          assert m['repository']=='IBalazs433/football-analytics-dashboard'
          assert m['commit']=='232db0e8ef58b2d94272ff6c206356bc10bdc36d'
          sc={'2021/22':'2122','2022/23':'2223','2023/24':'2324','2024/25':'2425','2025/26':'2526'}
          dc={'ENG_PremierLeague':'E1','ESP_LaLiga':'SP2','GER_Bundesliga':'D2','ITA_SerieA':'I2','FRA_Ligue1':'F2'}
          rows=[]
          for f in m['files']:
              rows.append((f['competition_id'],sc[f['season']],dc[f['competition_id']],m['repository'],m['commit'],f['path'],f['git_blob_sha'],str(f['bytes'])))
          assert len(rows)==25
          for r in rows: print('\t'.join(r))
          PY
          while IFS=$'\t' read -r comp season_code div repo commit source_path expected_blob expected_bytes; do
            dst=".footballdata_mirror_raw/${comp}/${season_code}-${div}.csv"
            mkdir -p "$(dirname "$dst")"
            curl --fail --location --silent --show-error --http1.1 \
              --user-agent 'football3-v21-frozen-evaluator/1.0' \
              --connect-timeout 8 --max-time 30 \
              --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
              "https://raw.githubusercontent.com/${repo}/${commit}/${source_path}" -o "$dst"
            test -s "$dst"
            test "$(wc -c < "$dst" | tr -d ' ')" = "$expected_bytes"
            test "$(git hash-object "$dst")" = "$expected_blob"
          done < .footballdata-mirror-plan.tsv
          python3 football-data/research/promoted_cold_start_v2_1/prepare_footballdata_mirror_sources_v2.py \
            --receipt "$PWD/football-data/research/promoted_cold_start_v2_1/PRE_METRIC_TRANSPORT_MIRROR_TRANSITION.json" \
            --nonstandard-fixture-receipt "$PWD/football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION.json" \
            --nonstandard-fixture-receipt "$PWD/football-data/research/promoted_cold_start_v2_1/PRE_METRIC_NONSTANDARD_FIXTURE_ADJUDICATION_2.json" \
            --raw-root "$PWD/.footballdata_mirror_raw" \
            --out-root "$PWD/.research_sources" \
            --manifest "$PWD/research-output/lower-tier-source-manifest.json" \
            | tee research-output/lower-tier-source-prepare.stdout
          python3 - <<'PY'
          import json
          d=json.load(open('research-output/lower-tier-source-manifest.json'))
          assert d['schema_version']=='football3-footballdata-transport-mirror-source-manifest-v3'
          assert d['mirror_repository']=='IBalazs433/football-analytics-dashboard'
          assert d['mirror_commit']=='232db0e8ef58b2d94272ff6c206356bc10bdc36d'
          assert d['file_count']==25 and d['competition_count']==5 and d['season_count']==5
          assert d['total_documented_nonstandard_omissions']==2
          assert all(x['parsed_matches']==x['expected_scored_matches'] for x in d['files'])
          assert all(x['converted_fields']==['Date','HomeTeam','AwayTeam','FTHG','FTAG'] for x in d['files'])
          assert all(not x['odds_fields_used'] and not x['postmatch_stats_used'] and not x['xg_fields_used'] for x in d['files'])
          PY

      - name: Create irreversible EVALUATOR_ATTEMPT receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          for name in (os.environ['ATTEMPT_ARTIFACT_NAME'],os.environ['RESULT_ARTIFACT_NAME']):
              url=f"https://api.github.com/repos/{repo}/actions/artifacts?name={urllib.parse.quote(name)}&per_page=100"
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r: d=json.load(r)
              if any(a.get('name')==name for a in d.get('artifacts',[])):
                  raise SystemExit(f'evaluator already consumed before attempt receipt: {name}')
          PY
          python3 - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          payload={
            'schema_version':'football3-promoted-cold-start-v2-1-evaluator-attempt-v1',
            'status':'EVALUATOR_ATTEMPT_IRREVERSIBLY_CONSUMED',
            'created_at_utc':datetime.now(timezone.utc).isoformat(),
            'pr_number':350,
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'exact_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'pre_label_receipt_git_blob_sha':os.environ['PRELABEL_RECEIPT_BLOB'],
            'preregistration_git_blob_sha':os.environ['PREREG_BLOB'],
            'evaluator_git_blob_sha':os.environ['EVALUATOR_BLOB'],
            'production_runtime_git_blob_sha':os.environ['RUNTIME_BLOB'],
            'team_aliases_git_blob_sha':os.environ['TEAM_ALIASES_BLOB'],
            'candidate_output_interface_git_blob_sha':os.environ['OUTPUT_INTERFACE_BLOB'],
            'wrapper_git_blob_sha':os.environ['WRAPPER_BLOB'],
            'attempt_artifact_name':os.environ['ATTEMPT_ARTIFACT_NAME'],
            'result_artifact_name':os.environ['RESULT_ARTIFACT_NAME'],
            'candidate_metric_observations_before_attempt':0,
            'evaluator_invocations_before_attempt':0,
            'rerun_allowed_after_this_receipt':False,
            'rescue_tuning_allowed':False,
            'parameters_or_thresholds_may_change_after_attempt':False,
            'sample_or_cohort_may_change_after_attempt':False
          }
          open('research-output/EVALUATOR_ATTEMPT_RECEIPT.json','w',encoding='utf-8').write(json.dumps(payload,sort_keys=True,indent=2))
          PY
          cp football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json research-output/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json
          cp football-data/research/promoted_cold_start_v2_1/CANDIDATE_OUTPUT_INTERFACE_V1.json research-output/CANDIDATE_OUTPUT_INTERFACE_V1.json
          sha256sum research-output/EVALUATOR_ATTEMPT_RECEIPT.json > research-output/EVALUATOR_ATTEMPT_RECEIPT.sha256

      - name: Seal evaluator attempt artifact before label observation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ATTEMPT_ARTIFACT_NAME }}
          path: |
            research-output/EVALUATOR_ATTEMPT_RECEIPT.json
            research-output/EVALUATOR_ATTEMPT_RECEIPT.sha256
            research-output/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json
            research-output/CANDIDATE_OUTPUT_INTERFACE_V1.json
            research-output/frozen-input-files.sha256
            research-output/lower-tier-source-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Invoke frozen evaluator exactly once through runpy wrapper
        id: evaluator
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data:${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1:${{ github.workspace }}/football-data/validation
        run: |
          set -euo pipefail
          test -f research-output/EVALUATOR_ATTEMPT_RECEIPT.json
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > research-output/evaluator-started-at.txt
          set +e
          python3 football-data/research/promoted_cold_start_v2_1/run_frozen_evaluator_after_prelabel_v1.py \
            --repo-root "$PWD" \
            --sources "$PWD/.research_sources" \
            --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
            --confirmation-dir "$PWD/.runtime_sources/confirmation" \
            --current-audit "$PWD/.runtime_sources/core/cross-season-audit/cross_season_team_state_audit.json" \
            --probe-manifest "$PWD/football-data/research/promoted_cold_start_v2_1/CURRENT_PROBE_FIXTURES.json" \
            --out "$PWD/research-output/historical-candidate-evaluation.json" \
            > research-output/historical-candidate-evaluation.stdout \
            2> research-output/historical-candidate-evaluation.stderr
          rc=$?
          set -e
          echo "$rc" > research-output/evaluator-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze historical scientific verdict and V3 binding receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path('research-output/historical-candidate-evaluation.json')
          rc=int(Path('research-output/evaluator-exit-code.txt').read_text().strip())
          result={
            'schema_version':'football3-promoted-cold-start-v2-1-evaluator-result-v1',
            'created_at_utc':datetime.now(timezone.utc).isoformat(),
            'pr_number':350,
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'exact_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'evaluator_exit_code':rc,
            'evaluator_invocations':1,
            'candidate_metric_observations':0,
            'pre_label_receipt_git_blob_sha':os.environ['PRELABEL_RECEIPT_BLOB'],
            'candidate_code_git_blob_sha':os.environ['EVALUATOR_BLOB'],
            'candidate_config_git_blob_sha':os.environ['PREREG_BLOB'],
            'candidate_output_interface_git_blob_sha':os.environ['OUTPUT_INTERFACE_BLOB'],
            'production_runtime_git_blob_sha':os.environ['RUNTIME_BLOB'],
            'team_aliases_git_blob_sha':os.environ['TEAM_ALIASES_BLOB'],
            'attempt_artifact_name':os.environ['ATTEMPT_ARTIFACT_NAME'],
            'result_artifact_name':os.environ['RESULT_ARTIFACT_NAME'],
            'duplicate_execution_detected':False,
            'rescue_tuning_detected':False,
            'label_leakage_detected':False,
            'formal_activation':False,
            'formal_model_or_current_modified':False,
            'formal_weights_modified':False
          }
          if rc==0 and out.is_file():
              d=json.load(out.open(encoding='utf-8'))
              assert d['schema_version']=='football3-promoted-cold-start-v2-1-evaluation-v1'
              assert d['status'] in ('PASS','STOP_NO_CANDIDATE')
              assert isinstance(d['scientific_pass'],bool)
              assert d['formal_or_current_modified'] is False
              assert d['club_specific_patch_count']==0
              expected_metrics={'Top1','LogLoss','Brier','RPS','score_logloss','exact_score_top1_accuracy','total_goals_mae','over_under_2_5_brier'}
              for block in ('development','selection'):
                  assert d[block]['n']>0
                  assert set(d[block]['metrics'])=={'frozen_v1','formal_baseline','strength_only','tier_gap_only','candidate'}
                  for m in d[block]['metrics'].values(): assert set(m)==expected_metrics
              result.update({
                'status':'EVALUATOR_RESULT_FROZEN',
                'candidate_metric_observations':1,
                'scientific_verdict':d['status'],
                'scientific_pass':d['scientific_pass'],
                'failed_scientific_gates':d['failed_gates'],
                'gamma':d['gamma'],
                'gamma_solver':d['gamma_solver'],
                'development_n':d['development']['n'],
                'selection_n':d['selection']['n'],
                'development_metrics':d['development']['metrics'],
                'selection_metrics':d['selection']['metrics'],
                'selection_per_league_metrics':d['selection']['per_league'],
                'evaluation_output_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
                'v3_binding_status':'V3_CAN_START_WITH_FROZEN_V2_1_RESEARCH_EXPERT' if d['status']=='PASS' else 'V3_CAN_START_WITH_V2_1_WEIGHT_ZERO'
              })
          else:
              result.update({
                'status':'EVALUATOR_FAILED_AFTER_IRREVERSIBLE_ATTEMPT',
                'scientific_verdict':'FAIL_RESEARCH_ONLY',
                'scientific_pass':False,
                'failed_scientific_gates':['EVALUATOR_EXECUTION_FAILURE'],
                'v3_binding_status':'V3_CAN_START_WITH_V2_1_WEIGHT_ZERO'
              })
          Path('research-output/EVALUATOR_RESULT_RECEIPT.json').write_text(json.dumps(result,sort_keys=True,indent=2),encoding='utf-8')
          print(json.dumps({k:result.get(k) for k in ('status','scientific_verdict','candidate_metric_observations','v3_binding_status','exact_head')},sort_keys=True))
          PY

          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PREREGISTRATION.json)" = "$PREREG_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/evaluate.py)" = "$EVALUATOR_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/PRE_LABEL_SEMANTIC_CLOSURE_RECEIPT.json)" = "$PRELABEL_RECEIPT_BLOB"
          test "$(git hash-object football-data/formal_fast_runtime_v1/runtime.py)" = "$RUNTIME_BLOB"
          test "$(git hash-object football-data/config/team_aliases.json)" = "$TEAM_ALIASES_BLOB"
          test "$(git hash-object football-data/research/promoted_cold_start_v2_1/CANDIDATE_OUTPUT_INTERFACE_V1.json)" = "$OUTPUT_INTERFACE_BLOB"
          sha256sum research-output/EVALUATOR_RESULT_RECEIPT.json > research-output/EVALUATOR_RESULT_RECEIPT.sha256
          find research-output -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > research-output/artifact-files.sha256

      - name: Upload frozen evaluator result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT_NAME }}
          path: research-output
          if-no-files-found: error
          retention-days: 90

      - name: Final historical-verdict gate only
        if: always()
        run: |
          set -euo pipefail
          test -f research-output/EVALUATOR_RESULT_RECEIPT.json
          python3 - <<'PY'
          import json
          d=json.load(open('research-output/EVALUATOR_RESULT_RECEIPT.json'))
          assert d['candidate_metric_observations'] in (0,1)
          if d['status']!='EVALUATOR_RESULT_FROZEN':
              raise SystemExit('unique evaluator attempt failed; rerun prohibited')
          assert d['candidate_metric_observations']==1
          assert d['scientific_verdict'] in ('PASS','STOP_NO_CANDIDATE')
          print(json.dumps({'scientific_verdict':d['scientific_verdict'],'candidate_metric_observations':1,'v3_binding_status':d['v3_binding_status']},sort_keys=True))
          PY
