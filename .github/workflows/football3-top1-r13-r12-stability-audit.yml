name: football3 Top1 R13 R12 stability audit

on:
  push:
    branches:
      - football3/top1-r13-r12-stability-audit
    paths:
      - football-data/experiments/top1_r13_r12_stability/run_experiment_r13.py
      - .github/workflows/football3-top1-r13-r12-stability-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r13-stability-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R13 branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r13-r12-stability-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn scipy
      - name: Reproduce R12 and run chronological stability audit
        run: python football-data/experiments/top1_r13_r12_stability/run_experiment_r13.py run
      - name: Verify R13 diagnostic contract
        run: python football-data/experiments/top1_r13_r12_stability/run_experiment_r13.py verify
      - name: Persist R13 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r13_r12_stability/results/summary_r13.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated top1-r13] persist R12 stability audit'
            git push origin HEAD:football3/top1-r13-r12-stability-audit
          fi
      - name: Upload immutable R13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r13-r12-stability-audit
          path: football-data/experiments/top1_r13_r12_stability/results/summary_r13.json
          if-no-files-found: error
          retention-days: 30
