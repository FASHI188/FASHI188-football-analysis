name: football3 R43AD0 team discipline coverage audit

on:
  push:
    branches:
      - football3/r43ad0-team-discipline-coverage-audit
    paths:
      - football-data/experiments/r43ad0_team_discipline_coverage_audit/run_r43ad0.py
      - .github/workflows/football3-r43ad0-team-discipline-coverage-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43ad0-team-discipline-coverage-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy scikit-learn
      - name: Restore frozen R9 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run zero-model R43AD0 discipline coverage audit
        run: python football-data/experiments/r43ad0_team_discipline_coverage_audit/run_r43ad0.py run
      - name: Verify R43AD0 contract
        run: python football-data/experiments/r43ad0_team_discipline_coverage_audit/run_r43ad0.py verify
      - name: Persist R43AD0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43ad0_team_discipline_coverage_audit/results/summary_r43ad0.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43AD0 team discipline coverage evidence'
            git fetch origin football3/r43ad0-team-discipline-coverage-audit
            git rebase origin/football3/r43ad0-team-discipline-coverage-audit
            git push origin HEAD:football3/r43ad0-team-discipline-coverage-audit
          fi
      - name: Upload R43AD0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43ad0-team-discipline-coverage-audit
          path: football-data/experiments/r43ad0_team_discipline_coverage_audit/results/summary_r43ad0.json
          if-no-files-found: error
          retention-days: 90
