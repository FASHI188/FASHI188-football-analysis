name: Football R39I Lineup Coverage

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39i-lineup-coverage.yml'
      - 'football-data/research/prematch_shock_r39i/coverage_registration_r39i.json'
      - 'football-data/research/prematch_shock_r39i/audit_lineup_coverage_r39i.py'

permissions:
  contents: read

jobs:
  zero-label-lineup-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify zero-label contract
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/prematch_shock_r39i/audit_lineup_coverage_r39i.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('football-data/research/prematch_shock_r39i/coverage_registration_r39i.json').read_text())
          assert r['identity_lock']['holdout_season']=='2526'
          assert r['identity_lock']['seed']==51145 and r['identity_lock']['labels_read']==0
          assert r['prior_blind_sets']['overlap_by_season_design']==0
          assert all(v==0 for v in r['no_label_contract'].values())
          assert r['hard_limits']['formal_weight']==0
          print('PASS_R39I_LINEUP_COVERAGE_CONTRACT')
          PY
      - name: Download and sanitize Transfermarkt identity plus lineup tables
        run: |
          set -euo pipefail
          rm -rf r39i-tm r39i-fd r39i-out player_scores.zip
          mkdir -p r39i-tm r39i-fd r39i-out
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/game_lineups.csv
          python - <<'PY'
          import csv
          specs=[('/tmp/games.csv','r39i-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),('/tmp/game_lineups.csv','r39i-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
                  if missing: raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in r:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/games.csv /tmp/game_lineups.csv player_scores.zip
      - name: Download and sanitize Football-Data market identity
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="/tmp/${season}_${div}.csv";out="r39i-fd/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
              if missing: raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in r:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
              rm -f "$raw"
            done
          done
      - name: Audit lineup coverage and lock 2025/26 fixed100
        run: |
          set -euo pipefail
          python football-data/research/prematch_shock_r39i/audit_lineup_coverage_r39i.py \
            --registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --games r39i-tm/games_identity.csv --lineups r39i-tm/lineups_identity.csv \
            --football-dir r39i-fd --out-dir r39i-out
      - name: Verify zero-label terminal state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39i-out/lineup_coverage_and_lock_r39i.json').read_text())
          assert all(v==0 for v in r['no_label_audit'].values())
          assert r['status'] in {'PASS_R39I_LINEUP_COVERAGE_AND_FIXED100_LOCK_ZERO_LABEL','STOP_R39I_LINEUP_COVERAGE_INSUFFICIENT'}
          if r['status'].startswith('PASS_'):
              assert r['fixed100_rows']==100 and r['fixed100_identity_sha256']
          print(json.dumps({k:r[k] for k in ('status','complete_preholdout_rows','complete_2526_rows','fixed100_rows','fixed100_identity_sha256','lineup_type_counts')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39i-lineup-coverage-${{ github.sha }}-${{ github.run_id }}
          path: r39i-out/
          if-no-files-found: error
          retention-days: 30
