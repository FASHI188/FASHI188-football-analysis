name: Football Fixed500 Rich OU T R2

on:
  push:
    branches: ["research/fixed500-existing-market-t-r1"]
    paths:
      - "football-data/validation/diagnose_fixed500_rich_ou_t_r2.py"
      - ".github/workflows/football-fixed500-rich-ou-t-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-fixed500-rich-ou-t-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/fixed500-existing-market-t-r1
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile
        run: python -m py_compile football-data/validation/diagnose_fixed500_rich_ou_t_r2.py
      - name: Rebuild audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run same-fixed500 rich-OU T test
        run: python football-data/validation/diagnose_fixed500_rich_ou_t_r2.py
      - name: Verify boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/fixed500_rich_ou_t_r2.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['sample']['parent_fixed500_n']==500
          assert x['sample']['new_sample_consumed'] is False
          assert x['sample']['latest_position4_confirmation_opened'] is False
          assert x['interpretation_guard']['retrospective_information_ceiling_only'] is True
          assert x['interpretation_guard']['formal_PIT_claim'] is False
          assert x['feature_contract']['same_cohort_for_all_packs'] is True
          assert x['governance']['provider_requests']==0
          assert x['governance']['new_data_collection'] is False
          print(json.dumps({
            'sample':x['sample'],
            'direct_t':x['metrics']['direct_t'],
            'boot_rich_single':x['metrics']['bootstrap_rich_minus_single'],
            'boot_rich_core':x['metrics']['bootstrap_rich_minus_core'],
            'boot_full_rich':x['metrics']['bootstrap_richfull_minus_rich'],
            'parity':x['metrics']['parity'],
            'hda':x['metrics']['hda'],
            'score':x['metrics']['exact_score'],
            'draw':x['draw_diagnostics'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixed500-rich-ou-t-r2
          path: |
            football-data/manifests/fixed500_rich_ou_t_r2.json
            football-data/manifests/fixed500_rich_ou_t_r2_rows.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no tracked runtime mutation
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
