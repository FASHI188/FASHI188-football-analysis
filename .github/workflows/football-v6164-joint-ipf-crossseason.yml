name: Football V6.19.0 Architecture Order Isolation
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/validate_architecture_order_v6190.py"
      - "football-data/validation/validate_joint_market_ipf_crossseason_v6164.py"
      - ".github/workflows/football-v6164-joint-ipf-crossseason.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v6190-architecture-order
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile architecture isolation
        run: python -m py_compile football-data/validation/validate_architecture_order_v6190.py
      - name: Run strict daily-PIT architecture isolation
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          python football-data/validation/validate_architecture_order_v6190.py
          code=$?
          echo "architecture_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Persist V6.19.0 receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          p=football-data/manifests/v6_architecture_order_v6190_status.json
          if [ -f "$p" ]; then git add "$p"; fi
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.19.0 architecture-order isolation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce pass
        run: test "${architecture_exit_code:-2}" = "0"
