name: C074-I untouched 2025-26 exact-tail confirmation

on:
  pull_request:
    paths:
      - 'research/C074I_CONTRACT.md'
      - 'research/c074i_2526_frozen_exact_tail_confirmation.py'
      - '.github/workflows/c074i_2526_frozen_exact_tail_confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-tail-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3
      - name: Run frozen exact-tail forward confirmation
        run: |
          python research/c074i_2526_frozen_exact_tail_confirmation.py --out artifacts/c074i_exact_tail_confirmation
          cp research/C074I_CONTRACT.md artifacts/c074i_exact_tail_confirmation/C074I_CONTRACT.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: c074i-untouched-2526-exact-tail-confirmation
          path: artifacts/c074i_exact_tail_confirmation/
          if-no-files-found: error
          retention-days: 30
