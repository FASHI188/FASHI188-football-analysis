name: football3 R43V0 low event generation expert
on:
  push:
    branches: [football3/r43v0-low-event-generation-expert]
    paths:
      - football-data/experiments/r43v0_low_event_generation_expert/run_r43v0.py
      - .github/workflows/football3-r43v0-low-event-generation-expert.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r43v0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43v0-low-event-generation-expert
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify inherited dependencies
        run: |
          python -m py_compile football-data/experiments/r43t0_dynamic_bivariate_residual_state/run_r43t0.py
          python -m py_compile football-data/experiments/r43u0_fixed_diagonal_inflation/run_r43u0.py
          python -m py_compile football-data/experiments/r43v0_low_event_generation_expert/run_r43v0.py
      - name: Run R43V0 low event expert
        run: python football-data/experiments/r43v0_low_event_generation_expert/run_r43v0.py run
      - name: Verify R43V0 contract
        run: python football-data/experiments/r43v0_low_event_generation_expert/run_r43v0.py verify
      - name: Persist R43V0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43v0_low_event_generation_expert/results/summary_r43v0_low_event_generation_expert.json
          if ! git diff --cached --quiet; then
            git commit -m '[generated] football3 R43V0 low event generation expert'
            git fetch origin football3/r43v0-low-event-generation-expert
            git rebase origin/football3/r43v0-low-event-generation-expert
            git push origin HEAD:football3/r43v0-low-event-generation-expert
          fi
      - name: Upload R43V0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43v0-low-event-generation-expert
          path: football-data/experiments/r43v0_low_event_generation_expert/results/summary_r43v0_low_event_generation_expert.json
          if-no-files-found: error
          retention-days: 90
