name: football3 top1 R33 prior player continuity

on:
  push:
    branches:
      - football3/top1-r33-prior-player-continuity
    paths:
      - football-data/experiments/top1_r33_prior_player_continuity/run_experiment_r33.py
      - .github/workflows/football3-top1-r33-prior-player-continuity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r33:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r33-prior-player-continuity
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R33 prior player continuity
        run: python football-data/experiments/top1_r33_prior_player_continuity/run_experiment_r33.py run
      - name: Verify R33 contract
        run: python football-data/experiments/top1_r33_prior_player_continuity/run_experiment_r33.py verify
      - name: Persist R33 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r33_prior_player_continuity/results/summary_r33.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R33 prior player continuity'
            git push origin HEAD:football3/top1-r33-prior-player-continuity
          fi
      - name: Upload R33 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r33-prior-player-continuity
          path: football-data/experiments/top1_r33_prior_player_continuity/results/summary_r33.json
          if-no-files-found: error
          retention-days: 90
