name: Football R39M Snapshot Recovery Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39m-snapshot-preflight.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39m-snapshot-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zero-label-snapshot-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify frozen scientific and recovery blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json)" = "01046fb1412f434c973b6369169cc6059ff6f9d2"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json)" = "b87d52023815469592128c43d2dab0406765d54a"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json)" = "de2c4ba33d0ed2a0f85c76b96f63a875daf59615"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py)" = "a465ea1d3ff59db25f166d248f31f89ab62fdeb4"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluate_recency_r39m.py)" = "300d896d66ce554c62ec3acf96d208ae9f0c4531"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json)" = "018102cec3e1776c00062d118f2963eeee052e3e"
          test "$(git rev-parse HEAD:football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py)" = "db9662313e92181e43edbadb050208215a445708"
          python -m py_compile football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json').read_text())
          assert b['scientific_design_changed'] is False and b['sample_changed'] is False and b['gates_changed'] is False and b['blind_set_changed'] is False
          assert b['source_drift_audit']['first_evaluation_run_id']==31353952166
          assert b['source_drift_audit']['first_evaluation_preholdout_labels_loaded']==0
          assert b['source_drift_audit']['first_evaluation_fixed100_labels_loaded']==0
          s=b['frozen_snapshot'];assert s['artifact_id']==9050139416
          assert s['artifact_sha256']=='d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575'
          assert s['snapshot_csv_sha256']=='c800b200ca22307ca4a9804797f513296b705eaf91b3586a0a9bd463083e0317'
          assert s['rows']=={'all':9434,'preholdout':8161,'holdout_2526':1273,'fixed100':100}
          assert s['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert all(v==0 for v in s['zero_label_contract'].values())
          print('PASS_R39M_SNAPSHOT_BINDING_ZERO_LABEL_CONTRACT')
          PY
      - name: Verify failed first evaluation had no scientific artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31353952166" -o /tmp/fail-run.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31353952166/artifacts" -o /tmp/fail-art.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/fail-run.json').read_text());a=json.loads(Path('/tmp/fail-art.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='failure'
          assert a.get('artifacts',[])==[]
          print('PASS_R39M_FIRST_EVALUATION_TECHNICAL_FAILURE_NO_ARTIFACT')
          PY
      - name: Download and verify exact frozen feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r39m-snapshot-input
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9050139416/zip" -o /tmp/r39m-snapshot.zip
          echo "d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575  /tmp/r39m-snapshot.zip" | sha256sum -c -
          unzip -q /tmp/r39m-snapshot.zip -d r39m-snapshot-input
          echo "c800b200ca22307ca4a9804797f513296b705eaf91b3586a0a9bd463083e0317  r39m-snapshot-input/feature_snapshot_r39m.csv" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39m-snapshot-input/snapshot_receipt_r39m.json').read_text())
          assert r['status']=='PASS_R39M_ZERO_LABEL_FROZEN_FEATURE_SNAPSHOT'
          assert r['snapshot_csv_sha256']=='c800b200ca22307ca4a9804797f513296b705eaf91b3586a0a9bd463083e0317'
          assert r['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert all(v==0 for v in r['zero_label_contract'].values())
          print('PASS_R39M_EXACT_FROZEN_FEATURE_ARTIFACT')
          PY
      - name: Run snapshot evaluator self-test and label-order audit
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py \
            --self-test \
            --prereg football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json \
            --contract football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json \
            --snapshot-binding football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json \
            --feature-snapshot r39m-snapshot-input/feature_snapshot_r39m.csv --raw-dir /tmp --out-dir /tmp
          python - <<'PY'
          from pathlib import Path
          src=Path('football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py').read_text()
          feature_write=src.index("feature_freeze_receipt_r39m.json').write_text")
          pre_label=src.index("labels=rl.load_labels(a.raw_dir")
          final_write=src.index("final_freeze_receipt_r39m.json').write_text",pre_label)
          hold_label=src.index("hlab=rl.load_labels(a.raw_dir,{'2526'}",final_write)
          assert feature_write < pre_label < final_write < hold_label
          print('PASS_R39M_SNAPSHOT_LABEL_ORDER_AUDIT')
          PY
      - name: Persist recovery preflight receipt
        run: |
          set -euo pipefail
          mkdir -p r39m-snapshot-preflight
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          files=['football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json','football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json','football-data/research/lineup_attack_recency_r39m/evaluator_contract_r39m.json','football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py','football-data/research/lineup_attack_recency_r39m/evaluate_recency_r39m.py','football-data/research/lineup_attack_recency_r39m/feature_snapshot_binding_r39m.json','football-data/research/lineup_attack_recency_r39m/evaluate_recency_snapshot_r39m.py']
          out={'status':'PASS_R39M_SNAPSHOT_RECOVERY_ZERO_LABEL_PREFLIGHT','generated_at_utc':datetime.now(timezone.utc).isoformat(),'blobs':{p:subprocess.check_output(['git','rev-parse',f'HEAD:{p}'],text=True).strip() for p in files},'snapshot_artifact_id':9050139416,'snapshot_artifact_sha256':'d9e1827db18c0c908ca57b819d7e4cc18f3b2da2554a6ead344d0d85e5607575','snapshot_csv_sha256':'c800b200ca22307ca4a9804797f513296b705eaf91b3586a0a9bd463083e0317','real_target_labels_accessed':0,'model_fit_on_real_labels':0,'fixed100_labels_accessed':0,'formal_weight':0}
          Path('r39m-snapshot-preflight/preflight_receipt_r39m.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39m-snapshot-recovery-preflight-${{ github.sha }}-${{ github.run_id }}
          path: r39m-snapshot-preflight/
          if-no-files-found: error
          retention-days: 30
