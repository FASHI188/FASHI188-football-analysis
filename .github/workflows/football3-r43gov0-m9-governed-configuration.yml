name: football3 R43GOV0 M9 governed configuration

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/pipeline/governed_configuration.py
      - football-data/pipeline/unified_inference.py
      - football-data/pipeline/v500_baseline_adapter.py
      - football-data/components/r43_native_matrix_components.py
      - football-data/assembly/feature_assembler.py
      - football-data/governance/feature_integration_truth.py
      - football-data/tests/test_governed_configuration.py
      - .github/workflows/football3-r43gov0-m9-governed-configuration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Verify governance isolation frozen V500 and no junk markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json|football-data/forward/r43y0_draw_calibration_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
          if find football-data/governance -maxdepth 1 -type f \( -name 'M7_*' -o -name '.m7_marker' -o -name 'README_M7.txt' -o -name 'FEATURE_TRUTH_VERSION' \) | grep -q .; then
            echo 'accidental M7 marker file remains' >&2
            exit 1
          fi

      - name: Compile M9 governed configuration
        run: |
          python -m py_compile football-data/pipeline/governed_configuration.py
          python -m py_compile football-data/tests/test_governed_configuration.py

      - name: Run M9 governed configuration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_governed_configuration.py' -v 2>&1 | tee /tmp/m9_test.log

      - name: Run M8 market binding regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43q_pit_market_binding.py' -v 2>&1 | tee /tmp/m9_m8_regression.log

      - name: Run M7 truth regression
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=football-data python -m unittest football-data/tests/test_feature_integration_truth.py -v 2>&1 | tee /tmp/m9_m7_regression.log

      - name: Upload M9 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m9-governed-configuration-diagnostic
          path: |
            /tmp/m9_test.log
            /tmp/m9_m8_regression.log
            /tmp/m9_m7_regression.log
          if-no-files-found: error
          retention-days: 30

      - name: Write M9 gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m9_governed_configuration_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m9-governed-configuration-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "formal_profile": "formal_default_v500",
            "formal_profile_baseline": "V500_frozen_unchanged",
            "formal_profile_market_numeric_enabled": false,
            "formal_profile_research_components_enabled": false,
            "research_profile": "r43q_pit_market_research_candidate",
            "research_profile_is_formal_default": false,
            "research_profile_market_pit_numeric_enabled": true,
            "research_profile_market_experiment_passed": false,
            "research_profile_r43q_historical_architecture_gate_passed": false,
            "research_profile_enabled_components_require_second_explicit_opt_in": true,
            "lineup_numeric_enabled": false,
            "player_technical_numeric_enabled": false,
            "head_coach_numeric_enabled": false,
            "availability_numeric_enabled": false,
            "dataset_replay_live_use_same_configuration_builder": true,
            "accidental_m7_marker_files_removed": true,
            "fresh_confirmatory_test_claim": false,
            "formal_promotion_allowed": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M10_final_rebuild_governance_gate_and_artifact"
          }
          JSON

      - name: Upload M9 gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m9-governed-configuration-gate
          path: football-data/governance/r43gov0/results/m9_governed_configuration_gate.json
          if-no-files-found: error
          retention-days: 90
