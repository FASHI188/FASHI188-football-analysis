name: Football Direct-T Parity GD Fixed500 R1

on:
  push:
    branches: ["research/direct-t-parity-gd-fixed500-20260816"]
    paths:
      - "football-data/config/direct_t_parity_gd_fixed500_r1.json"
      - "football-data/validation/evaluate_direct_t_parity_gd_fixed500_r1.py"
      - "football-data/validation/diagnose_direct_t_parity_gd_fixed500_oracles_r1.py"
      - "football-data/validation/diagnose_direct_t_ou25_fixed500_info_ceiling_r1.py"
      - "football-data/validation/audit_v6503_settlement_gaps_r1.py"
      - ".github/workflows/football-direct-t-parity-gd-fixed500-r1.yml"
  pull_request:
    branches: ["research/direct-t-gd-fixed200-20260816"]
    paths:
      - "football-data/config/direct_t_parity_gd_fixed500_r1.json"
      - "football-data/validation/evaluate_direct_t_parity_gd_fixed500_r1.py"
      - "football-data/validation/diagnose_direct_t_parity_gd_fixed500_oracles_r1.py"
      - "football-data/validation/diagnose_direct_t_ou25_fixed500_info_ceiling_r1.py"
      - "football-data/validation/audit_v6503_settlement_gaps_r1.py"
      - ".github/workflows/football-direct-t-parity-gd-fixed500-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-direct-t-parity-gd-fixed500-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile frozen evaluator and diagnostics
        run: |
          python -m py_compile football-data/validation/evaluate_direct_t_parity_gd_fixed500_r1.py
          python -m py_compile football-data/validation/diagnose_direct_t_parity_gd_fixed500_oracles_r1.py
          python -m py_compile football-data/validation/diagnose_direct_t_ou25_fixed500_info_ceiling_r1.py
          python -m py_compile football-data/validation/audit_v6503_settlement_gaps_r1.py
      - name: Rebuild audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Audit frozen V6503 settlement gaps
        run: python football-data/validation/audit_v6503_settlement_gaps_r1.py
      - name: Verify settlement gap audit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/v6503_settlement_gap_audit_r1.json').read_text(encoding='utf-8'))
          assert x['classification']=='REPOSITORY_LOCAL_READ_ONLY_SETTLEMENT_GAP_DIAGNOSTIC'
          assert x['event_count']>=x['unmatched_count']
          g=x['governance']
          assert g['formal_weight']==0
          assert g['provider_requests']==0
          assert g['new_data_collection'] is False
          assert g['new_outcome_source_opened'] is False
          assert g['latest_confirmation_block_opened'] is False
          assert g['model_fit_performed'] is False
          assert g['parameter_search_performed'] is False
          assert g['formal_asset_changes']==0
          print(json.dumps({
              'event_count':x['event_count'],
              'result_inbox_count':x['result_inbox_count'],
              'status_counts':x['status_counts'],
              'unmatched_count':x['unmatched_count'],
              'unmatched_reason_signals':x['unmatched_reason_signals'],
              'unmatched_by_competition':x['unmatched_by_competition'],
              'unmatched_by_date':x['unmatched_by_date'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Run frozen fixed500 evaluation
        run: python football-data/validation/evaluate_direct_t_parity_gd_fixed500_r1.py
      - name: Verify frozen contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/direct_t_parity_gd_fixed500_r1_status.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='COMPLETED_RESEARCH_ONLY'
          assert x['formal_weight']==0
          s=x['sample']
          assert s['n']==500
          assert s['labels_used_for_identity_selection'] is False
          assert s['overlap_with_PR196_fixed200']==0
          assert s['latest_position4_confirmation_opened'] is False
          d=x['decision_checks']
          assert d['post_result_parameter_search'] is False
          assert d['forced_draw'] is False
          assert d['manual_threshold'] is False
          g=x['governance']
          assert g['formal_weight']==0
          assert g['provider_requests']==0
          assert g['new_data_collection'] is False
          assert g['open_latest_2025_26_confirmation'] is False
          assert g['formal_model_mutation'] is False
          assert g['formal_data_mutation'] is False
          assert g['formal_config_mutation'] is False
          assert g['current_mutation'] is False
          assert g['main_mutation'] is False
          print(json.dumps({
              'verdict':x['scientific_verdict'],
              'sample':x['sample'],
              'direct_total':x['metrics']['direct_total'],
              'parity_head':x['metrics']['parity_head'],
              'hda':x['metrics']['hda'],
              'exact_score':x['metrics']['exact_score'],
              'draw_diagnostics':x['draw_diagnostics'],
              'decision_checks':x['decision_checks'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Run post-result oracle diagnostics on same fixed500
        run: python football-data/validation/diagnose_direct_t_parity_gd_fixed500_oracles_r1.py
      - name: Verify oracle diagnostic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/direct_t_parity_gd_fixed500_oracles_r1.json').read_text(encoding='utf-8'))
          y=json.loads(Path('football-data/manifests/direct_t_parity_gd_fixed500_r1_status.json').read_text(encoding='utf-8'))
          assert x['classification']=='POST_RESULT_SAME_SAMPLE_DIAGNOSTIC_ONLY'
          assert x['sample_n']==500
          assert x['sample_identity_sha256']==y['sample']['sample_identity_sha256']
          assert x['new_sample_consumed'] is False
          assert x['frozen_verdict_unchanged'] is True
          assert x['governance']['formal_weight']==0
          assert x['governance']['provider_requests']==0
          assert x['governance']['new_data_collection'] is False
          assert x['governance']['latest_position4_confirmation_opened'] is False
          assert x['governance']['formal_asset_changes']==0
          print(json.dumps({'metrics':x['metrics'],'draw_diagnostics':x['draw_diagnostics']},ensure_ascii=False,indent=2))
          PY
      - name: Run retrospective OU2.5 information-ceiling diagnostic
        run: python football-data/validation/diagnose_direct_t_ou25_fixed500_info_ceiling_r1.py
      - name: Verify OU2.5 diagnostic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/direct_t_ou25_fixed500_info_ceiling_r1.json').read_text(encoding='utf-8'))
          y=json.loads(Path('football-data/manifests/direct_t_parity_gd_fixed500_r1_status.json').read_text(encoding='utf-8'))
          assert x['classification']=='POST_RESULT_SAME_FIXED500_RETROSPECTIVE_MARKET_DIAGNOSTIC_ONLY'
          assert x['sample']['parent_fixed500_n']==500
          assert x['sample']['parent_fixed500_identity_sha256']==y['sample']['sample_identity_sha256']
          assert x['sample']['new_sample_consumed'] is False
          assert x['sample']['labels_used_for_coverage_selection'] is False
          assert x['sample']['latest_position4_confirmation_opened'] is False
          assert x['market_boundary']['formal_PIT_claim'] is False
          assert x['market_boundary']['retrospective_reference_only'] is True
          assert x['fit_contract']['fixed500_parameter_selection'] is False
          assert x['fit_contract']['fixed500_feature_selection'] is False
          assert x['fit_contract']['fixed500_threshold_selection'] is False
          assert x['fit_contract']['post_result_parameter_search'] is False
          assert x['interpretation_guard']['can_authorize_promotion'] is False
          assert x['interpretation_guard']['frozen_PR197_verdict_changed'] is False
          g=x['governance']
          assert g['formal_weight']==0 and g['provider_requests']==0 and g['new_data_collection'] is False
          assert g['latest_position4_confirmation_opened'] is False
          assert g['formal_model_mutation'] is False and g['formal_data_mutation'] is False
          assert g['formal_config_mutation'] is False and g['current_mutation'] is False and g['main_mutation'] is False
          print(json.dumps({
              'sample':x['sample'],
              'direct_t':x['metrics']['direct_t'],
              'parity':x['metrics']['parity'],
              'hda':x['metrics']['hda_from_same_conditional_gd'],
              'exact_score':x['metrics']['exact_score_from_same_conditional_gd'],
              'draw_diagnostics':x['draw_diagnostics'],
              'interpretation_guard':x['interpretation_guard'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload fixed500 evidence
        uses: actions/upload-artifact@v4
        with:
          name: direct-t-parity-gd-fixed500-r1-${{ github.sha }}
          path: |
            football-data/manifests/v6503_settlement_gap_audit_r1.json
            football-data/manifests/direct_t_parity_gd_fixed500_r1_status.json
            football-data/manifests/direct_t_parity_gd_fixed500_r1_rows.csv
            football-data/manifests/direct_t_parity_gd_fixed500_oracles_r1.json
            football-data/manifests/direct_t_parity_gd_fixed500_oracles_r1_rows.csv
            football-data/manifests/direct_t_ou25_fixed500_info_ceiling_r1.json
            football-data/manifests/direct_t_ou25_fixed500_info_ceiling_r1_rows.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no tracked runtime mutation
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
