name: Football Codecov Coverage Smoke

on:
  pull_request:
    paths:
      - 'scripts/governance/**'
      - '.github/workflows/football-codecov-coverage.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/governance/**'
      - '.github/workflows/football-codecov-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: football-codecov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-smoke:
    name: Governance coverage upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install coverage
        run: python -m pip install coverage

      - name: Run governance coverage smoke
        working-directory: scripts/governance
        run: |
          python -m coverage run --branch test_quality_security_guard.py
          python -m coverage xml -o ../../coverage.xml

      - name: Upload coverage to Codecov with OIDC
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
