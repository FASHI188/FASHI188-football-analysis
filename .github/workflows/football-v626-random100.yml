name: football-v626-random100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_three_stage_random100_v6264.py'
      - 'football-data/validation/validate_three_stage_1x2_logpool_random100_v6265.py'
      - 'football-data/validation/validate_three_stage_1x2_online_hedge_random100_v6266.py'
      - 'football-data/validation/validate_three_stage_1x2_priorseason_residual_random100_v6267.py'
      - 'football-data/validation/validate_three_stage_1x2_conditional_gate_random100_v6268.py'
      - 'football-data/engine/three_stage_core_v6260.py'
      - '.github/workflows/football-v626-random100.yml'

permissions:
  contents: read

jobs:
  random100:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile
        run: |
          python -m py_compile \
            football-data/engine/three_stage_core_v6260.py \
            football-data/validation/validate_three_stage_random100_v6264.py \
            football-data/validation/validate_three_stage_1x2_logpool_random100_v6265.py \
            football-data/validation/validate_three_stage_1x2_online_hedge_random100_v6266.py \
            football-data/validation/validate_three_stage_1x2_priorseason_residual_random100_v6267.py \
            football-data/validation/validate_three_stage_1x2_conditional_gate_random100_v6268.py

      - name: Run base three-stage fixed-seed random100
        run: |
          python football-data/validation/validate_three_stage_random100_v6264.py

      - name: Run no-tune 1X2 log-pool random100
        run: |
          python football-data/validation/validate_three_stage_1x2_logpool_random100_v6265.py

      - name: Run leakage-safe online 1X2 Hedge random100
        run: |
          python football-data/validation/validate_three_stage_1x2_online_hedge_random100_v6266.py

      - name: Run prior-season-frozen 1X2 residual random100
        run: |
          python football-data/validation/validate_three_stage_1x2_priorseason_residual_random100_v6267.py

      - name: Run prior-season conditional disagreement gate random100
        run: |
          python football-data/validation/validate_three_stage_1x2_conditional_gate_random100_v6268.py

      - name: Upload diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v626-random100-receipts
          path: |
            football-data/manifests/v6_three_stage_random100_v6264_status.json
            football-data/manifests/v6_three_stage_1x2_logpool_random100_v6265_status.json
            football-data/manifests/v6_three_stage_1x2_online_hedge_random100_v6266_status.json
            football-data/manifests/v6_three_stage_1x2_priorseason_residual_random100_v6267_status.json
            football-data/manifests/v6_three_stage_1x2_conditional_gate_random100_v6268_status.json
          if-no-files-found: error
