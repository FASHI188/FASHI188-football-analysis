name: football-v626-random100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_three_stage_score_structure_random100_v6271.py'
      - 'football-data/validation/validate_three_stage_random100_v6264.py'
      - 'football-data/engine/three_stage_core_v6260.py'
      - '.github/workflows/football-v626-random100.yml'

permissions:
  contents: read

jobs:
  random100:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile score-structure challenge
        run: |
          python -m py_compile \
            football-data/engine/three_stage_core_v6260.py \
            football-data/validation/validate_three_stage_random100_v6264.py \
            football-data/validation/validate_three_stage_score_structure_random100_v6271.py

      - name: Run V6.27.1 score-structure Fast100
        run: |
          python football-data/validation/validate_three_stage_score_structure_random100_v6271.py

      - name: Upload V6.27.1 Fast100 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6271-fast100-receipt
          path: football-data/manifests/v6_three_stage_score_structure_random100_v6271_status.json
          if-no-files-found: error
