name: Football R39O Feature Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39o-feature-snapshot.yml'
      - 'football-data/research/lineup_surprise_position_r39o/preregistration_r39o.json'
      - 'football-data/research/lineup_surprise_position_r39o/export_feature_snapshot_r39o.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39o-feature-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zero-label-feature-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify frozen zero-label design and source-audit authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/lineup_surprise_position_r39o/export_feature_snapshot_r39o.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/lineup_surprise_position_r39o/preregistration_r39o.json').read_text())
          assert p['preregistration_status']=='HYPOTHESIS_FEATURES_AND_GATES_FROZEN_BEFORE_TARGET_LABEL_ACCESS'
          assert p['blind_binding']['fixed100_labels_accessed_before_r39o']==0
          assert p['point_in_time_contract']['minimum_valued_starters_per_lineup']==9
          assert p['point_in_time_contract']['minimum_valid_prior_lineups_for_baseline']==3
          assert p['feature_contract']['full_dimension']==14
          assert p['feature_contract']['absolute_XI_value_levels_forbidden_in_R39O_candidate'] is True
          assert p['zero_label_snapshot_gate']['expected_feature_eligible_from_source_audit']=={'all':9412,'preholdout':8145,'holdout_2526':1267,'fixed100':100}
          print('PASS_R39O_FROZEN_ZERO_LABEL_DESIGN')
          PY
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31359100982" -o /tmp/audit-run.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31359100982/artifacts" -o /tmp/audit-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/audit-run.json').read_text());a=json.loads(Path('/tmp/audit-artifacts.json').read_text()).get('artifacts',[])
          assert r['status']=='completed' and r['conclusion']=='success'
          assert len(a)==1 and a[0]['id']==9051713726
          assert a[0].get('digest')=='sha256:7626e0820699c904bb23a967c81e9aff3d7954b1a44fda766e7882305de55f7e'
          print('PASS_R39O_SOURCE_AUDIT_AUTHORIZATION')
          PY
      - name: Download and sanitize exact Transfermarkt source lane
        run: |
          set -euo pipefail
          rm -rf r39o-tm r39o-market r39o-snapshot player_scores.zip /tmp/r39o-*.csv
          mkdir -p r39o-tm r39o-market r39o-snapshot
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39o-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39o-lineups.csv
          unzip -p player_scores.zip player_valuations.csv > /tmp/r39o-valuations.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39o-games.csv','r39o-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39o-lineups.csv','r39o-tm/lineups_identity_position.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39o-valuations.csv','r39o-tm/valuations_prior.csv',['player_id','date','market_value_in_eur'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing:raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39o-games.csv /tmp/r39o-lineups.csv /tmp/r39o-valuations.csv player_scores.zip
      - name: Download and sanitize exact Football-Data market identity lane
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="/tmp/r39o-${season}_${div}.csv";out="r39o-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing:raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
              rm -f "$raw"
            done
          done
      - name: Export frozen zero-label R39O feature snapshot
        run: |
          set -euo pipefail
          python football-data/research/lineup_surprise_position_r39o/export_feature_snapshot_r39o.py \
            --prereg football-data/research/lineup_surprise_position_r39o/preregistration_r39o.json \
            --r39i-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39o-market --games r39o-tm/games_identity.csv \
            --lineups r39o-tm/lineups_identity_position.csv --valuations r39o-tm/valuations_prior.csv \
            --out-dir r39o-snapshot
      - name: Verify zero-label feature snapshot gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          r=json.loads(Path('r39o-snapshot/snapshot_receipt_r39o.json').read_text())
          assert r['status']=='PASS_R39O_ZERO_LABEL_FEATURE_SNAPSHOT'
          assert r['rows']=={'all':9412,'preholdout':8145,'holdout_2526':1267,'fixed100':100}
          assert r['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert r['unknown_target_position_counts']=={}
          assert r['strict_valuation_lag_violations']==0
          assert all(v==0 for v in r['zero_label_contract'].values())
          with Path('r39o-snapshot/feature_snapshot_r39o.csv').open('r',encoding='utf-8',newline='') as f:
              rd=csv.reader(f);header=next(rd);n=sum(1 for _ in rd)
          assert n==9412 and len(header)==21
          print(json.dumps(r,indent=2))
          PY
      - name: Delete mutable source inputs before artifact
        run: rm -rf r39o-tm r39o-market
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39o-zero-label-feature-snapshot-${{ github.sha }}-${{ github.run_id }}
          path: r39o-snapshot/
          if-no-files-found: error
          retention-days: 30
