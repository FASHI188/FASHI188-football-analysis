name: football3-nova-n10-referee-sky-gdelt-residual-pit

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_sky_gdelt_residual_pit_registry_v1.json'
      - 'governance/football3/nova_n10_referee_sky_gdelt_residual_pit_v1.py'
      - 'governance/football3/test_nova_n10_referee_sky_gdelt_residual_pit_v1.py'
      - '.github/workflows/football3-nova-n10-referee-sky-gdelt-residual-pit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-nova-n10-referee-sky-gdelt-residual-pit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-sky-gdelt-residual-pit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile             governance/football3/nova_n10_referee_aia_gdelt_gkg_daily_v1.py             governance/football3/nova_n10_referee_sky_combined_freeze_v1.py             governance/football3/nova_n10_referee_sky_pit_binding_v1.py             governance/football3/nova_n10_referee_sky_arquivo_feasibility_v1.py             governance/football3/nova_n10_referee_sky_gdelt_daily_feasibility_v1.py             governance/football3/nova_n10_referee_sky_gdelt_residual_pit_v1.py             governance/football3/test_nova_n10_referee_sky_gdelt_residual_pit_v1.py
          PYTHONPATH=governance/football3             python governance/football3/test_nova_n10_referee_sky_gdelt_residual_pit_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 6 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Sweep only residual PIT-window GDELT days
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_sky_gdelt_residual_pit_v1.py             --registry governance/football3/nova_n10_referee_sky_gdelt_residual_pit_registry_v1.json             --out _run 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/sky_gdelt_residual_pit_receipt.json'))
          assert r['classification'] in {'POSITIVE_SIGNAL_SOURCE_FEASIBILITY','STOP_DATA_COVERAGE'}
          assert r['target_rounds']==[8,11,12,14,15,16,17,19,20,21,22,23,25,27,28,32,34]
          assert r['target_round_n']==17
          assert r['excluded_prior_sample_rounds']==[9,24,38]
          assert r['publication_day_requery_performed'] is False
          assert r['prior_sample_round_requery_performed'] is False
          assert r['full_gkg_rows_persisted'] is False
          assert r['matching_full_lines_persisted'] is False
          assert r['article_body_read'] is False
          assert r['referee_assignment_body_parsed'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          assert r['day_level_observation_only'] is True
          assert r['exact_observation_time_proven'] is False
          assert r['formal_available_at_proven'] is False
          assert r['referee_oof_allowed'] is False
          if r['gdelt_for_sky_closed']:
              assert r['positive_round_n']==0
              assert r['external_error_day_n']==0
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-sky-gdelt-residual-pit-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
