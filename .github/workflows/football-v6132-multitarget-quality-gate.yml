name: Football V6.13.2 Multi-target Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/audit_multitarget_quality_gate_v6132.py"
      - "football-data/manifests/v6170_formalprior_multiline_forward_status.json"
      - "football-data/manifests/v6_coherent_special_market_forward_v6224_status.json"
      - ".github/workflows/football-v6132-multitarget-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6132-multitarget-quality-gate
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile football-data/validation/audit_multitarget_quality_gate_v6132.py
      - name: Audit candidates
        run: python football-data/validation/audit_multitarget_quality_gate_v6132.py
      - name: Persist audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_multitarget_quality_gate_v6132_status.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.13.2 multi-target quality gate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
