name: football-v6500-full500-fast100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_full500_fast100_baselines_v6500.py'
      - '.github/workflows/football-v6500-full500-fast100.yml'
      - 'football-data/manifests/full500_v6493/**'

permissions:
  contents: write

jobs:
  validate-full500-fast100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 catboost==1.2.10 scipy==1.14.1

      - name: Compile
        run: python -m py_compile football-data/validation/validate_full500_fast100_baselines_v6500.py

      - name: Validate new Full500 A_FAST100 once
        shell: bash
        run: |
          set +e
          python football-data/validation/validate_full500_fast100_baselines_v6500.py 2>&1 | tee football-data/manifests/v6500_full500_fast100.log
          status=${PIPESTATUS[0]}
          echo "validator_exit_status=${status}" | tee -a football-data/manifests/v6500_full500_fast100.log
          exit ${status}

      - name: Persist V6.50 receipt
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_full500_fast100_baselines_v6500_status.json
          if git diff --cached --quiet; then
            echo "V6.50 receipt already persisted"
          else
            git commit -m "research(football): persist V6.50 Full500 A100 receipt"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload V6.50 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6500-full500-fast100
          path: |
            football-data/manifests/v6500_full500_fast100.log
            football-data/manifests/v6_full500_fast100_baselines_v6500_status.json
          if-no-files-found: warn
