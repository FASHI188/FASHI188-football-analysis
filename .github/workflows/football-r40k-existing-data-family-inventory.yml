name: Football R40K Existing Data Family Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/football-r40k-existing-data-family-inventory.yml'
      - 'football-data/research/existing_data_family_inventory_r40k/**'

permissions:
  contents: read

jobs:
  path-only-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Compile inventory
        run: python -m py_compile football-data/research/existing_data_family_inventory_r40k/inventory_r40k.py
      - name: Run path-only inventory
        run: |
          set -euo pipefail
          rm -rf /tmp/r40k-output
          python football-data/research/existing_data_family_inventory_r40k/inventory_r40k.py
      - name: Verify zero-content boundary
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/r40k-output');p=root/'r40k_inventory.json';raw=p.read_bytes();r=json.loads(raw)
          assert r['status']=='PASS_R40K_PATH_ONLY_DATA_INVENTORY'
          h=r['hard_boundaries'];assert h['file_contents_read']==0 and h['data_rows_read']==0 and h['target_label_values_read']==0 and h['model_fits']==0 and h['candidate_probabilities']==0
          assert h['external_network_requests']==0 and h['football_api_requests']==0 and h['new_data_collection'] is False and h['formal_weight']==0
          assert h['formal_model_mutation'] is False and h['formal_data_mutation'] is False and h['current_rule_mutation'] is False and h['main_mutation'] is False
          assert (root/'r40k_inventory.sha256').read_text().strip()==hashlib.sha256(raw).hexdigest()
          print(json.dumps({'total_files':r['total_files'],'data_extension_files':r['data_extension_files'],'nonresearch_data_files':r['nonresearch_data_files'],'top_level_summary':r['top_level_summary'],'family_counts':{k:{'file_count':v['file_count'],'bytes':v['bytes']} for k,v in r['family_summary'].items()},'largest_nonresearch_data_files':r['largest_nonresearch_data_files'][:50]},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r40k-data-family-inventory-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/r40k-output
          retention-days: 30
          if-no-files-found: error
