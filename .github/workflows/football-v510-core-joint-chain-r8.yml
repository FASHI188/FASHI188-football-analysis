name: Football V5.1 Core Joint Chain R8

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "football-data/config/v510_core_joint_chain_r8.json"
      - "football-data/validation/evaluate_v510_core_joint_chain_r8.py"
      - "football-data/validation/evaluate_v510_online_ensemble_ablation_r7.py"
      - "football-data/validation/evaluate_v510_full_range_score_allocation_r4.py"
      - "football-data/validation/evaluate_v510_nonlinear_continuation_boosting_r6.py"
      - "football-data/validation/evaluate_v510_prequential_algorithm_challenge_r3.py"
      - "football-data/validation/evaluate_v510_historical_tail_mapping_r1.py"
      - "football-data/validation/v510_historical_structure_features_r1.py"
      - "football-data/validation/v510_historical_structure_model_r1.py"
      - "football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py"
      - "football-data/processed/**/*.csv"
      - ".github/workflows/football-v510-core-joint-chain-r8.yml"

permissions:
  contents: read

concurrency:
  group: football-v510-core-joint-chain-r8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile R8 evaluator
        run: python -m py_compile football-data/validation/evaluate_v510_core_joint_chain_r8.py
      - name: Run R8 self-test
        run: python football-data/validation/evaluate_v510_core_joint_chain_r8.py --self-test
      - name: Materialize audited historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Evaluate R8 core joint chain
        run: python football-data/validation/evaluate_v510_core_joint_chain_r8.py
      - name: Show compact receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v510_core_joint_chain_r8_status.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          pooled=x.get('pooled', {})
          print(json.dumps({
            'status':x.get('status'),
            'evidence_class':x.get('evidence_class'),
            'state_contract':x.get('state_contract'),
            'test_rows':pooled.get('test_rows'),
            'core_rows':pooled.get('core_test_rows_T0_to_T6'),
            'tail_rows':pooled.get('tail_test_rows_T7plus'),
            'joint_candidate_delta_minus_baseline':pooled.get('joint_candidate_delta_minus_baseline'),
            'joint_candidate_bootstrap_vs_baseline_90':pooled.get('joint_candidate_bootstrap_vs_baseline_90'),
            'joint_candidate_bootstrap_vs_total_only_90':pooled.get('joint_candidate_bootstrap_vs_total_only_90'),
            'joint_candidate_bootstrap_vs_allocation_only_90':pooled.get('joint_candidate_bootstrap_vs_allocation_only_90'),
            'core_conditional_score_delta':pooled.get('core_conditional_score_delta'),
            'core_conditional_result_delta':pooled.get('core_conditional_result_delta'),
            'audits':x.get('audits'),
            'stability':x.get('stability'),
            'ruling':x.get('ruling'),
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload R8 receipts
        uses: actions/upload-artifact@v4
        with:
          name: v510-core-joint-chain-r8
          path: |
            football-data/manifests/v510_core_joint_chain_r8_status.json
            football-data/manifests/v510_core_joint_chain_r8_stability.csv
          if-no-files-found: error
          retention-days: 30
      - name: Confirm no repository persistence
        run: |
          git status --short
          test -z "$(git diff --cached --name-only)"
