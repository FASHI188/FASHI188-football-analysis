name: football3 Candidate C Historical Lineup Oracle v1 identity enumeration

on:
  push:
    branches: [football3/context-translator-lineup-oracle-v1]
    paths:
      - '.github/workflows/football3-context-translator-lineup-oracle-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_HEAD: 'a58c530501e51a29ac448ed2ee2f50f36795d2d9'
  COHORT_SHA: '4663d6a534840e4b80975ee104e86bed0b5402cb332ee28d46c9cac4da2c9cba'
  BASE_ARTIFACT_ID: '9798682425'
  BASE_ARTIFACT_DIGEST: '01b655b2748b1e601d82c61e12d763ed50c2db40c3b3b8802aec807c6ac6acba'

jobs:
  enumerate_identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch and unchanged Oracle scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'football3/context-translator-lineup-oracle-v1'
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          git diff --quiet "$BASE_HEAD" HEAD -- football-data/new_engine_v2_joint_score
          git diff --quiet "$BASE_HEAD" HEAD -- football-data/research/context_translator_v1/candidate_c.py
          git diff --quiet "$BASE_HEAD" HEAD -- football-data/research/context_translator_v1/candidate_b.py
          git diff --quiet "$BASE_HEAD" HEAD -- CURRENT 2>/dev/null || exit 1
      - name: Download frozen label-free cohort base
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {data}=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:Number(process.env.BASE_ARTIFACT_ID),archive_format:'zip'});
            fs.writeFileSync('base.zip',Buffer.from(data));
      - name: Enumerate frozen cohort teams and official PL 2023-24 teams read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -tq base.zip >/dev/null
          mkdir base_freeze identity_enum
          unzip -q base.zip -d base_freeze
          python - <<'PY'
          import hashlib,json,pathlib,urllib.parse,urllib.request
          COHORT_SHA='4663d6a534840e4b80975ee104e86bed0b5402cb332ee28d46c9cac4da2c9cba'
          BASE='https://sdp-prem-prod.premier-league-prod.pulselive.com'
          teams_url=BASE+'/api/v1/competitions/8/seasons/2023/teams?_limit=60'
          matches_base=BASE+'/api/v2/matches?competition=8&season=2023&_limit=100'
          cm=json.load(open('base_freeze/cohort_manifest.json'))
          assert cm['cohort_identity_sha256']==COHORT_SHA and cm['n']==300
          c={}
          for r in cm['rows']:
              for side in ('home','away'):
                  c[str(r[f'{side}_team_id'])]=str(r[f'{side}_team'])
          assert len(c)==20
          cohort=[{'cohort_team_id':k,'cohort_team_name':v} for k,v in sorted(c.items(),key=lambda z:z[1])]
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'football3-oracle-identity-enum/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.read()
          traw=get(teams_url)
          pathlib.Path('identity_enum/official_teams_raw.json').write_bytes(traw)
          tp=json.loads(traw); teams=tp.get('data',tp)
          assert isinstance(teams,list) and len(teams)==20, len(teams)
          official=[]
          for t in teams:
              official.append({'premier_league_official_team_id':str(t['id']),'premier_league_official_name':str(t.get('name') or ''),'short_name':str(t.get('shortName') or ''),'abbr':str(t.get('abbr') or ''),'source_url':BASE+f"/api/v1/competitions/8/teams/{t['id']}",'season_membership_source_url':teams_url})
          ids=[x['premier_league_official_team_id'] for x in official]
          assert len(set(ids))==20
          matches=[]; match_receipts=[]; nxt=None
          for page in range(10):
              url=matches_base if not nxt else matches_base+'&_next='+urllib.parse.quote(str(nxt),safe='')
              raw=get(url)
              pathlib.Path(f'identity_enum/official_matches_{page:02d}.json').write_bytes(raw)
              p=json.loads(raw); data=p.get('data')
              assert isinstance(data,list)
              matches.extend(data)
              match_receipts.append({'page':page,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'n':len(data)})
              nxt=(p.get('pagination') or {}).get('_next')
              if not nxt: break
          assert len(matches)==380, len(matches)
          mids=[str(m.get('matchId') or m.get('id')) for m in matches]
          assert len(set(mids))==380
          match_team_ids=sorted({str((m.get(s) or {}).get('id')) for m in matches for s in ('homeTeam','awayTeam')})
          assert set(match_team_ids)==set(ids),(match_team_ids,ids)
          out={'schema_version':'football3-pl-2023-24-team-identity-enumeration-v1','cohort_sha256':COHORT_SHA,'cohort_team_n':20,'cohort_teams':cohort,'official_team_n':20,'official_teams':sorted(official,key=lambda x:x['premier_league_official_name']),'official_season_team_ids':sorted(ids),'match_index_n':380,'match_index_team_ids':match_team_ids,'teams_source_url':teams_url,'matches_source_base_url':matches_base,'teams_raw_sha256':hashlib.sha256(traw).hexdigest(),'match_page_receipts':match_receipts,'matches_pages_aggregate_sha256':hashlib.sha256(json.dumps(match_receipts,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'labels_read':0,'scorer_invoked':False,'api_key_used':False,'secret_used':False}
          raw=json.dumps(out,sort_keys=True,ensure_ascii=False,indent=2).encode()+b'\n'
          pathlib.Path('identity_enum/identity_enumeration.json').write_bytes(raw)
          print(json.dumps(out,sort_keys=True))
          PY
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('identity_enum/identity_enumeration.json'); x=json.load(open(p))
          assert x['cohort_team_n']==20 and x['official_team_n']==20 and x['match_index_n']==380
          assert x['labels_read']==0 and x['scorer_invoked'] is False and x['api_key_used'] is False and x['secret_used'] is False
          print('IDENTITY_ENUMERATION_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lineup-oracle-identity-enumeration-${{ github.sha }}-${{ github.run_id }}
          path: identity_enum/
          if-no-files-found: error
          retention-days: 90
