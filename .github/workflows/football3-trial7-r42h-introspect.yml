name: football3 trial7 R42H introspect
on:
  push:
    branches: [football3/trial7-r42h-pseudoprematch-20260828]
    paths:
      - 'football-data/research/diagnostics/trial7_posthoc_feature_attribution.py'
      - '.github/workflows/football3-trial7-r42h-introspect.yml'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/trial7-r42h-pseudoprematch-20260828
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - run: python football-data/research/diagnostics/trial7_posthoc_feature_attribution.py
