name: Football3 Formal Prematch State Identity Contract Hotfix V1

on:
  push:
    branches:
      - 'football3/formal-prematch-state-identity-contract-hotfix-v1'
    paths:
      - 'football-data/formal_gpt_gateway_v1/formal_durable_state_governance_v1.py'
      - 'football-data/formal_gpt_gateway_v1/formal_future_fixture_identity_bridge_v1.py'
      - 'football-data/formal_gpt_gateway_v1/test_prematch_state_identity_contract_v1.py'
      - '.github/workflows/football3-formal-prematch-state-identity-contract-hotfix-v1.yml'
  pull_request:
    branches:
      - 'football3/formal-gpt-runner-integration-v1'
    paths:
      - 'football-data/formal_gpt_gateway_v1/formal_durable_state_governance_v1.py'
      - 'football-data/formal_gpt_gateway_v1/formal_future_fixture_identity_bridge_v1.py'
      - 'football-data/formal_gpt_gateway_v1/test_prematch_state_identity_contract_v1.py'
      - '.github/workflows/football3-formal-prematch-state-identity-contract-hotfix-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile changed formal contract modules
        run: |
          python3 -m py_compile \
            football-data/formal_gpt_gateway_v1/formal_durable_state_governance_v1.py \
            football-data/formal_gpt_gateway_v1/formal_future_fixture_identity_bridge_v1.py \
            football-data/formal_gpt_gateway_v1/test_prematch_state_identity_contract_v1.py
      - name: Run permanent prematch contract regression
        env:
          PYTHONPATH: ${{ github.workspace }}/football-data/formal_fast_runtime_v1:${{ github.workspace }}/football-data/formal_gpt_gateway_v1:${{ github.workspace }}/football-data
        run: python3 football-data/formal_gpt_gateway_v1/test_prematch_state_identity_contract_v1.py
