name: Football R39H Evaluation

on:
  push:
    branches: [research/fundamental-market-residual-r39h]
    paths:
      - '.github/workflows/football-r39h-evaluation.yml'
  pull_request:
    paths:
      - '.github/workflows/football-r39h-evaluation.yml'

permissions:
  contents: read

jobs:
  lagged-fundamental-fixed100:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify exact frozen contract before data or label access
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/fundamental_r39h/evaluate_fundamental_residual_r39h.py
          python football-data/research/fundamental_r39h/evaluate_fundamental_residual_r39h.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/fundamental_r39h/preregistration_r39h.json').read_text())
          assert p['source_binding']['fixed100_identity_sha256']=='1c87503823f858e03c34ee42c2b3847460da466f59ee4ffa2dfac4628c6169eb'
          assert p['source_binding']['fixed100_labels_accessed_before_r39h_evaluation']==0
          assert p['target_and_offset']['market_draw_logit_coefficient']==1.0
          assert p['strict_lag_contract']['current_match_understat_performance_excluded'] is True
          assert p['label_order_contract']['holdout_labels_before_model_and_policy_freeze']==0
          assert p['hard_limits']['formal_weight']==0
          print('PASS_R39H_FROZEN_EVALUATION_CONTRACT')
          PY
      - name: Download Understat and persist only allowed lagged performance fields
        run: |
          set -euo pipefail
          rm -rf r39h-understat r39h-market r39h-raw r39h-output understat.zip
          mkdir -p r39h-understat r39h-market r39h-raw r39h-output
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/codytipton/understat-data' -o understat.zip
          unzip -p understat.zip game_stats.csv > /tmp/game_stats.csv
          python - <<'PY'
          import csv
          keep=['id','league','season','club_name','home_away','xG','xGA','npxG','npxGA','ppda','ppda_allowed','deep','deep_allowed','xpts','date','npxGD']
          with open('/tmp/game_stats.csv','r',encoding='utf-8-sig',newline='') as f, open('r39h-understat/game_stats_allowed.csv','w',encoding='utf-8',newline='') as g:
              r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
              if missing: raise SystemExit('missing '+repr(missing))
              forbidden={'scored','missed','result','wins','draws','loses','pts'}
              assert not forbidden.intersection(keep)
              w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
              for row in r:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/game_stats.csv understat.zip
      - name: Download Football-Data and build market-only plus sealed raw inputs
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425; do
            for div in E0 D1 I1 SP1 F1; do
              url="https://www.football-data.co.uk/mmz4281/${season}/${div}.csv"
              raw="r39h-raw/${season}_${div}.csv"
              market="r39h-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o "$raw"
              python - "$raw" "$market" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f, open(dst,'w',encoding='utf-8',newline='') as g:
              r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
              if missing: raise SystemExit('missing '+repr(missing))
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in r:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
            done
          done
      - name: Execute unique frozen R39H sequence
        run: |
          set -euo pipefail
          python football-data/research/fundamental_r39h/evaluate_fundamental_residual_r39h.py \
            --prereg football-data/research/fundamental_r39h/preregistration_r39h.json \
            --market-dir r39h-market --raw-dir r39h-raw \
            --understat r39h-understat/game_stats_allowed.csv --out-dir r39h-output
      - name: Verify label order and terminal boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39h-output/r39h_result.json').read_text())
          allowed={'STOP_R39H_BEFORE_HOLDOUT_LABEL_ACCESS_FUNDAMENTAL_RESIDUAL_NO_INCREMENT','STOP_R39H_BEFORE_HOLDOUT_LABEL_ACCESS_NO_POLICY_LANE','PASS_R39H_LAGGED_FUNDAMENTAL_RESIDUAL_FIXED100_EXPLORATORY_ONLY','NO_R39H_LAGGED_FUNDAMENTAL_RESIDUAL_INCREMENT_FIXED100'}
          assert r['status'] in allowed
          access=r['holdout_labels_accessed']
          if r['status'].startswith('STOP_R39H_BEFORE_'): assert access==0
          else: assert access==100
          f=json.loads(Path('r39h-output/freeze_receipt_r39h.json').read_text())
          assert f['holdout_labels_accessed_before_freeze']==0
          assert f['strict_lag_audit']['violations']==0
          print(json.dumps({'status':r['status'],'holdout_labels_accessed':access,'validation':f['validation'],'policy':f.get('policy')},indent=2))
          PY
      - name: Delete raw sources before artifact
        run: rm -rf r39h-understat r39h-market r39h-raw
      - name: Upload aggregate R39H evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-r39h-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39h-output/
          if-no-files-found: error
          retention-days: 30
