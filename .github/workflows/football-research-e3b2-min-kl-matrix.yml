name: Football Research E3b-2 Minimum-KL Unified Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "research/market-joint-direct-outcome-e3b1"
    types: [opened, synchronize, reopened, edited]
    paths:
      - "football-data/research/e3b2_min_kl_unified_matrix.py"
      - "football-data/research/e3b2_exact_constraint_infeasibility_audit.py"
      - ".github/workflows/football-research-e3b2-min-kl-matrix.yml"
  push:
    branches:
      - "research/e3b2-min-kl-unified-matrix"
    paths:
      - "football-data/research/e3b2_min_kl_unified_matrix.py"
      - "football-data/research/e3b2_exact_constraint_infeasibility_audit.py"
      - ".github/workflows/football-research-e3b2-min-kl-matrix.yml"

permissions:
  contents: read

concurrency:
  group: football-research-e3b2-min-kl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-min-kl-unified-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact research branch HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact research HEAD
        id: exact_head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "expected_head=${EXPECTED_HEAD}"
          echo "actual_head=${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"
          git diff --exit-code
          echo "sha=${actual_head}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1

      - name: Syntax check
        run: |
          python -m py_compile football-data/research/e3b2_min_kl_unified_matrix.py
          python -m py_compile football-data/research/e3b2_exact_constraint_infeasibility_audit.py

      - name: Run research-only E3b-2 exact projection
        env:
          PYTHONPATH: football-data/engine:football-data/validation:football-data/research
          PYTHONUTF8: "1"
        run: |
          python football-data/research/e3b2_min_kl_unified_matrix.py --print-summary

      - name: Build complete exact-constraint infeasibility audit
        if: always()
        env:
          PYTHONPATH: football-data/engine:football-data/validation:football-data/research
          PYTHONUTF8: "1"
        run: |
          python football-data/research/e3b2_exact_constraint_infeasibility_audit.py --print-summary

      - name: Upload E3b-2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-e3b2-min-kl-${{ steps.exact_head.outputs.sha }}
          path: artifacts/research/e3b2_min_kl_unified_matrix/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected formal assets were not changed
        if: always()
        run: |
          git diff --exit-code -- football-data/models football-data/config football-data/processed football-data/raw
          git diff --exit-code
