name: football3 top1 R35 calendar kickoff context

on:
  push:
    branches:
      - football3/top1-r35-calendar-kickoff-context
    paths:
      - football-data/experiments/top1_r35_calendar_kickoff_context/run_experiment_r35.py
      - .github/workflows/football3-top1-r35-calendar-kickoff-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r35:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r35-calendar-kickoff-context
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R35 calendar kickoff context
        run: python football-data/experiments/top1_r35_calendar_kickoff_context/run_experiment_r35.py run
      - name: Verify R35 contract
        run: python football-data/experiments/top1_r35_calendar_kickoff_context/run_experiment_r35.py verify
      - name: Persist R35 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r35_calendar_kickoff_context/results/summary_r35.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R35 calendar kickoff context'
            git fetch origin football3/top1-r35-calendar-kickoff-context
            git rebase origin/football3/top1-r35-calendar-kickoff-context
            git push origin HEAD:football3/top1-r35-calendar-kickoff-context
          fi
      - name: Upload R35 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r35-calendar-kickoff-context
          path: football-data/experiments/top1_r35_calendar_kickoff_context/results/summary_r35.json
          if-no-files-found: error
          retention-days: 90
