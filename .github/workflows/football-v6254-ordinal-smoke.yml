name: Football V6.25.4 Ordinal Smoke
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_total_shot_ordinal_residual_v6254_smoke.py"
      - ".github/workflows/football-v6254-ordinal-smoke.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run smoke
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_shot_ordinal_residual_v6254_smoke.py
      - name: Save receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_total_shot_ordinal_residual_v6254_smoke_status.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.4 ordinal smoke"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
