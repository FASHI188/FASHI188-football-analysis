name: football3 top1 R23 fresh 40k confirmation

on:
  push:
    branches:
      - football3/top1-r23-fresh-40k-confirmation
    paths:
      - football-data/experiments/top1_r23_fresh_40k_confirmation/run_experiment_r23.py
      - football-data/experiments/top1_r23_fresh_40k_confirmation/driver_r23.py
      - .github/workflows/football3-top1-r23-fresh-40k-confirmation.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  r23:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r23-fresh-40k-confirmation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Materialize exact frozen R9b snapshot
        run: python football-data/experiments/top1_r12_draw_features/run_experiment_r12.py freeze
      - name: Download locked R22 40k artifact
        uses: actions/download-artifact@v4
        with:
          name: football3-top1-r22-history-scale-40k
          path: football-data/experiments/top1_r23_fresh_40k_confirmation/r22_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FASHI188/FASHI188-football-analysis
          run-id: 32939310382
      - name: Run R23 fresh 40k confirmation
        run: python football-data/experiments/top1_r23_fresh_40k_confirmation/driver_r23.py
      - name: Persist compact R23 diagnostic on failure
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f football-data/experiments/top1_r23_fresh_40k_confirmation/results/error_r23.json football-data/experiments/top1_r23_fresh_40k_confirmation/data/diagnostic_r23.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m '[diagnostic] football3 R23 compact failure receipt'
            git push origin HEAD:football3/top1-r23-fresh-40k-confirmation
          fi
      - name: Verify R23 contract
        run: python football-data/experiments/top1_r23_fresh_40k_confirmation/run_experiment_r23.py verify
      - name: Persist R23 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r23_fresh_40k_confirmation/results/summary_r23.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R23 fresh 40k confirmation'
            git push origin HEAD:football3/top1-r23-fresh-40k-confirmation
          fi
      - name: Upload R23 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r23-fresh-40k-confirmation
          path: |
            football-data/experiments/top1_r23_fresh_40k_confirmation/results/summary_r23.json
            football-data/experiments/top1_r23_fresh_40k_confirmation/data/fresh_cohort_r23.json
          if-no-files-found: error
          retention-days: 90
