name: football3-c072n18c-market-anchored-nb2-development

on:
  pull_request:
    paths:
      - 'football-data/research/C072N18C_MARKET_ANCHORED_NB2_PT_DEVELOPMENT_CONTRACT.md'
      - 'football-data/research/run_c072n18c_market_anchored_nb2_development.py'
      - '.github/workflows/football3-c072n18c-market-anchored-nb2-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n18c-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install frozen dependencies
        run: |
          pip install --disable-pip-version-check \
            requests==2.32.4 beautifulsoup4==4.13.4 rapidfuzz==3.14.1 \
            numpy==2.3.2 scipy==1.16.1

      - name: Rebuild immutable N18B2 zero-label cohort
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python football-data/research/run_c072n18b2_zero_label_unique_fuzzy_team_map.py

      - name: Execute frozen N18C development one-shot
        run: python football-data/research/run_c072n18c_market_anchored_nb2_development.py

      - name: Assert terminal scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/research/_c072n18c_development/c072n18c_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['terminal_verdict'] in {
              'C072N18C_MARKET_ANCHORED_NB2_DEVELOPMENT_PASS',
              'C072N18C_MARKET_ANCHORED_NB2_DEVELOPMENT_PARK',
          }, x
          assert x['development_rows_opened']==400, x
          assert x['strict_oos_rows']==278, x
          assert x['requested_dev_ids']==400, x
          assert x['confirmation150_opened'] is False, x
          assert x['confirmation_ids_requested']==0, x
          assert x['confirmation_numeric_goal_values_materialized']==0, x
          assert x['C070F_confirmation1597_opened'] is False, x
          assert x['sealed_reserves_opened'] is False, x
          assert x['C073_C077_scientific_results_used'] is False, x
          print(x['terminal_verdict'])
          PY

      - name: Upload N18C development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-c072n18c-development-${{ github.sha }}-${{ github.run_id }}
          path: football-data/research/_c072n18c_development/
          if-no-files-found: warn
          retention-days: 30
