name: Football V6.25.10 Full Total Softmax

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_pooled_dynamic_shot_softmax_v62510.py"
      - ".github/workflows/football-v62510-full-softmax.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile challenger
        run: python -m py_compile football-data/validation/v6_total_pooled_dynamic_shot_softmax_v62510.py
      - name: Run V6.25.10 strict-PIT full-total challenger
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_pooled_dynamic_shot_softmax_v62510.py
      - name: Persist audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_pooled_dynamic_shot_softmax_v62510_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.10 full-total softmax"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

