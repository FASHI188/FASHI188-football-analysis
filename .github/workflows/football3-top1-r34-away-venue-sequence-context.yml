name: football3 top1 R34 away venue sequence context

on:
  push:
    branches:
      - football3/top1-r34-away-venue-sequence-context
    paths:
      - football-data/experiments/top1_r34_away_venue_sequence_context/run_experiment_r34.py
      - .github/workflows/football3-top1-r34-away-venue-sequence-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r34:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r34-away-venue-sequence-context
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore frozen R9b 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R34 venue travel context
        run: python football-data/experiments/top1_r34_away_venue_sequence_context/run_experiment_r34.py run
      - name: Verify R34 contract
        run: python football-data/experiments/top1_r34_away_venue_sequence_context/run_experiment_r34.py verify
      - name: Persist R34 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r34_away_venue_sequence_context/results/summary_r34.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R34 venue travel context'
            git push origin HEAD:football3/top1-r34-away-venue-sequence-context
          fi
      - name: Upload R34 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r34-away-venue-sequence-context
          path: football-data/experiments/top1_r34_away_venue_sequence_context/results/summary_r34.json
          if-no-files-found: error
          retention-days: 90
