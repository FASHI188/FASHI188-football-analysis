name: C078-E2 Fresh Market Tail Calibration

on:
  push:
    branches: [research/c078e-fresh-tail-calibration-20260820]
    paths:
      - research/C078E2_MARKET_IMPLIED_TAIL_CALIBRATION_CONTRACT.md
      - research/c078e2_market_tail_calibration.py
      - .github/workflows/c078e2_market_tail_calibration.yml

permissions:
  actions: read
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.2.6 pandas==2.3.2 scipy==1.16.1
      - name: Download immutable C078-D market-only artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c078d_art"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9388656670/zip" -o "$RUNNER_TEMP/c078d.zip"
          unzip -q "$RUNNER_TEMP/c078d.zip" -d "$RUNNER_TEMP/c078d_art"
          find "$RUNNER_TEMP/c078d_art" -name market_snapshot.csv -type f | head -n1 > "$RUNNER_TEMP/market_path.txt"
          test -s "$RUNNER_TEMP/market_path.txt"
      - name: Download current 2025/26 source bytes transiently
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current"
          for code in E1 E2 E3 SC0 SC1 SC2 SC3 D2 I2 SP2 F2 P1; do
            curl -L --fail --retry 5 --retry-delay 2 -o "$RUNNER_TEMP/current/${code}.csv" "https://www.football-data.co.uk/mmz4281/2526/${code}.csv"
          done
      - name: Execute frozen early-only calibration
        run: |
          mkdir -p "$RUNNER_TEMP/c078e2_out"
          MARKET=$(cat "$RUNNER_TEMP/market_path.txt")
          python research/c078e2_market_tail_calibration.py --market-snapshot "$MARKET" --current-dir "$RUNNER_TEMP/current" --out-dir "$RUNNER_TEMP/c078e2_out"
      - name: Enforce late-label seal
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'c078e2_out'/'summary.json'; s=json.loads(p.read_text())
          assert s['schema_version']=='C078E2_MARKET_TAIL_CALIBRATION_V1'
          assert s['status'] in {'STOP_CALIBRATION_COVERAGE','CALIBRATION_FAIL_PARK','CALIBRATION_PASS_FREEZE_GAMMA'}
          assert s['late_numeric_score_access_count']==0
          if 'label_boundary' in s:
              assert s['label_boundary']['late_numeric_score_access_count']==0
              assert s['label_boundary']['late_score_values_stored'] is False
              assert s['label_boundary']['late_score_values_hashed'] is False
              assert s['label_boundary']['late_goal_totals_computed'] is False
          if s['status']=='CALIBRATION_PASS_FREEZE_GAMMA': assert all(s['gate'].values()),s['gate']
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c078e2-fresh-tail-calibration
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/c078e2_out/summary.json
            ${{ runner.temp }}/c078e2_out/frozen_gamma.json
            research/C078E2_MARKET_IMPLIED_TAIL_CALIBRATION_CONTRACT.md
            research/c078e2_market_tail_calibration.py

