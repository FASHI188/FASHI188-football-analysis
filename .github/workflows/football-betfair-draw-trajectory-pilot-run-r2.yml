name: Football Betfair Draw Trajectory Pilot One-Time Run R2

on:
  workflow_dispatch:
    inputs:
      authorization_nonce:
        description: Exact frozen one-time authorization nonce
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: betfair-draw-trajectory-pilot-one-time-r2
  cancel-in-progress: false

jobs:
  one-time-frozen-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1203f8684f53e61fc11a631d837e08581bbaf7fa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preflight one-time guards before external access
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$RUN_NUMBER" = 1
          test "$RUN_ATTEMPT" = 1
          test "$AUTHORIZATION_NONCE" = 57a9023352e24188bd2cbcd37bd896d8
          python -m py_compile football-data/research/betfair_draw_trajectory_pilot_r1/run_pilot_once_r2.py
          rm -rf artifacts/research/betfair_draw_trajectory_pilot_run_r2
          mkdir -p artifacts/research/betfair_draw_trajectory_pilot_run_r2
          python football-data/research/betfair_draw_trajectory_pilot_r1/run_pilot_once_r2.py preflight \
            --prereg football-data/research/betfair_draw_trajectory_pilot_r1/preregistration.json \
            --authorization football-data/research/betfair_draw_trajectory_pilot_r1/run_authorization_r2.json \
            --consumed-marker football-data/research/betfair_draw_trajectory_pilot_r1/run_consumed_marker_r2.json \
            --event-name "$EVENT_NAME" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --authorization-nonce "$AUTHORIZATION_NONCE" \
            --preflight-out artifacts/research/betfair_draw_trajectory_pilot_run_r2/preflight.json
      - name: Checkout pinned public source without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git -c credential.helper= clone --filter=blob:none --no-checkout \
            https://github.com/marcosf63/bet.git source-public
          git -C source-public checkout --detach 90f818e2ad78aa3c624a0fe251c3e60fcfb0ccff
          test "$(git -C source-public rev-parse HEAD)" = 90f818e2ad78aa3c624a0fe251c3e60fcfb0ccff
      - name: Lock synchronized identities then compare once
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
        run: |
          set -euo pipefail
          python football-data/research/betfair_draw_trajectory_pilot_r1/run_pilot_once_r2.py run \
            --prereg football-data/research/betfair_draw_trajectory_pilot_r1/preregistration.json \
            --authorization football-data/research/betfair_draw_trajectory_pilot_r1/run_authorization_r2.json \
            --consumed-marker football-data/research/betfair_draw_trajectory_pilot_r1/run_consumed_marker_r2.json \
            --event-name "$EVENT_NAME" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --authorization-nonce "$AUTHORIZATION_NONCE" \
            --source-checkout source-public \
            --lock-out artifacts/research/betfair_draw_trajectory_pilot_run_r2/identity_lock.json \
            --final-out artifacts/research/betfair_draw_trajectory_pilot_run_r2/final.json
      - name: Verify isolated research boundary and remove raw checkout
        if: always()
        run: |
          set -euo pipefail
          rm -rf source-public
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='7db94eda443c4285343ffc9bc99de906190bf88a'
          expected={
            '.github/workflows/football-betfair-draw-trajectory-pilot-run-r2.yml',
            '.github/workflows/football-betfair-draw-trajectory-pilot-run-r2-preflight.yml',
            'football-data/research/betfair_draw_trajectory_pilot_r1/run_authorization_r2.json',
            'football-data/research/betfair_draw_trajectory_pilot_r1/run_consumed_marker_r2.json',
            'football-data/research/betfair_draw_trajectory_pilot_r1/run_pilot_once_r2.py',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          root=Path('artifacts/research/betfair_draw_trajectory_pilot_run_r2')
          final_path=root/'final.json'
          if final_path.exists():
              final=json.loads(final_path.read_text(encoding='utf-8'))
              assert final['model_fits']==0
              assert final['thresholds_selected']==0
              assert final['formal_weight']==0
              assert final['formal_model_changes']==0
              assert final['formal_data_changes']==0
              assert final['formal_config_changes']==0
              assert final['CURRENT_changes']==0
              assert final['rerun_allowed'] is False
              assert final.get('raw_or_per_market_data_persisted_or_uploaded',False) is False
              print(json.dumps(final,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload aggregate and identity-hash receipts only
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: football-betfair-draw-trajectory-pilot-run-r2-1203f8684f53e61fc11a631d837e08581bbaf7fa-${{ github.run_id }}
          path: artifacts/research/betfair_draw_trajectory_pilot_run_r2
          if-no-files-found: warn
          retention-days: 30
      - name: Publish aggregate run receipt to PR 105
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root=Path('artifacts/research/betfair_draw_trajectory_pilot_run_r2')
          final=None
          if (root/'final.json').exists():
              final=json.loads((root/'final.json').read_text(encoding='utf-8'))
          body=(
              '## R2 one-time experiment run receipt\n\n'
              f"- run: `{os.environ['RUN_ID']}`\n"
              f"- attempt: `{os.environ['RUN_ATTEMPT']}`\n"
              f"- job status: `{os.environ['JOB_STATUS']}`\n"
              f"- execution HEAD: `1203f8684f53e61fc11a631d837e08581bbaf7fa`\n"
              f"- artifact ID: `{os.environ.get('ARTIFACT_ID','')}`\n"
              f"- artifact digest: `{os.environ.get('ARTIFACT_DIGEST','')}`\n"
          )
          if final is None:
              body+='- final receipt: unavailable; inspect workflow failure stage.\n'
          else:
              body+='\n```json\n'+json.dumps(final,ensure_ascii=False,indent=2,sort_keys=True)+'\n```\n'
          payload=json.dumps({'body':body},ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/105/comments",
              data=payload,
              method='POST',
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              print(response.status)
          PY
