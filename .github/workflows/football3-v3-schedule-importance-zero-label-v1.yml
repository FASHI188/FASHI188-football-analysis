name: Football3 V3 Schedule Importance Zero Label V1
on:
  pull_request:
    branches: [football3/formal-gpt-runner-integration-v1]
    paths:
      - '.github/workflows/football3-v3-schedule-importance-zero-label-v1.yml'
      - 'governance/football3/v3_schedule_importance_zero_label_contract_v1.json'
      - 'governance/football3/validate_v3_schedule_importance_zero_label_v1.py'
      - 'governance/football3/test_v3_schedule_importance_zero_label_v1.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Permanent tests
        run: |
          python -m py_compile governance/football3/validate_v3_schedule_importance_zero_label_v1.py governance/football3/test_v3_schedule_importance_zero_label_v1.py
          python governance/football3/test_v3_schedule_importance_zero_label_v1.py
      - name: Zero-label tree coverage audit
        run: |
          mkdir -p artifact
          python governance/football3/validate_v3_schedule_importance_zero_label_v1.py --output artifact/schedule-importance-zero-label-receipt.json
          cp governance/football3/v3_schedule_importance_zero_label_contract_v1.json artifact/
          python - <<'PY'
          import json
          p=json.load(open('artifact/schedule-importance-zero-label-receipt.json'))
          assert p['decision']=='PASS_ZERO_LABEL_TREE_COVERAGE_NEXT_SANITIZED_SCHEMA_AUDIT'
          assert p['selected_file_count']==94
          assert p['match_payloads_downloaded']==0
          assert p['target_match_rows_read']==0
          assert p['target_result_or_goal_values_read']==0
          assert p['selected_cohort_labels_opened']==0
          assert p['future_matches_allowed'] is False
          assert p['training'] is False and p['tuning'] is False
          assert p['contaminated_probe_path_excluded'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-v3-schedule-importance-zero-label-${{ github.event.pull_request.head.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 90
