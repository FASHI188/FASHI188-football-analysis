name: Football3 Focus Domain Formal Entry Probes V1

on:
  pull_request:
    branches:
      - football3/formal-gpt-runner-integration-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: football3-focus-domain-formal-entry-probes-v1
  cancel-in-progress: false

jobs:
  sealed-focus-probes:
    if: ${{ github.event.pull_request.head.ref == 'football3/cross-season-team-state-binding-governed-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact PR HEAD and frozen FULL sources
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p .focus_state .runtime_sources/understat .runtime_sources/confirmation acceptance/focus
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9798682425/zip" -o .runtime_sources/understat.zip
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9827606506/zip" -o .runtime_sources/confirmation.zip
          unzip -q .runtime_sources/understat.zip -d .runtime_sources/understat
          unzip -q .runtime_sources/confirmation.zip -d .runtime_sources/confirmation

      - name: Build six real sealed fixture requests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('acceptance/focus')
          cutoff='2026-09-04T13:19:44+00:00'
          fixtures={
            'esp_sevilla_valencia': {
              'competition_id':'ESP_LaLiga','season':'2026/27','kickoff':'2026-09-11T19:00:00+00:00',
              'home_team_name':'Sevilla','away_team_name':'Valencia',
              'fixture_reference':'LALIGA Jornada 5, 11 Sep 2026 21:00 CEST, Sevilla FC vs Valencia CF'
            },
            'ger_mainz_frankfurt': {
              'competition_id':'GER_Bundesliga','season':'2026/27','kickoff':'2026-09-12T13:30:00+00:00',
              'home_team_name':'Mainz','away_team_name':'Ein Frankfurt',
              'fixture_reference':'Bundesliga Matchday 3, 12 Sep 2026 15:30 CEST, Mainz vs Eintracht Frankfurt'
            },
            'ita_roma_inter': {
              'competition_id':'ITA_SerieA','season':'2026/27','kickoff':'2026-09-19T16:00:00+00:00',
              'home_team_name':'AS Roma','away_team_name':'Internazionale',
              'fixture_reference':'Serie A Matchday 5, 19 Sep 2026 18:00 CEST, Roma vs Inter'
            },
            'fra_rennes_marseille': {
              'competition_id':'FRA_Ligue1','season':'2026/27','kickoff':'2026-09-11T18:45:00+00:00',
              'home_team_name':'Rennes','away_team_name':'Olympique de Marseille',
              'fixture_reference':'Ligue 1 Matchday 4, 11 Sep 2026 20:45 CEST, Rennes vs Marseille'
            },
            'jpn_kyoto_kashiwa': {
              'competition_id':'JPN_J1','season':'2026','kickoff':'2026-09-11T10:00:00+00:00',
              'home_team_name':'Kyoto Sanga','away_team_name':'Kashiwa Reysol',
              'fixture_reference':'J1 Matchweek 7, 11 Sep 2026 19:00 JST, Kyoto Sanga vs Kashiwa Reysol'
            },
            'kor_jeonbuk_seoul': {
              'competition_id':'KOR_KLeague1','season':'2026','kickoff':'2026-09-12T07:30:00+00:00',
              'home_team_name':'Jeonbuk Hyundai Motors','away_team_name':'FC Seoul',
              'fixture_reference':'K League 1 Matchweek 29, 12 Sep 2026 16:30 KST, Jeonbuk vs FC Seoul'
            },
          }
          for key, f in fixtures.items():
              req={
                'schema_version':'football3-formal-gpt-gateway-v1','mode':'predict',
                'request_id':f'cross-season-focus-{key}-sealed-v1',
                'match':{
                  'competition_id':f['competition_id'],'season':f['season'],'kickoff':f['kickoff'],'cutoff':cutoff,
                  'home_team_name':f['home_team_name'],'away_team_name':f['away_team_name'],
                }
              }
              (root/f'{key}.request.json').write_text(json.dumps(req,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          (root/'fixture-references.json').write_text(json.dumps(fixtures,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY

      - name: Select durable state independently and execute six sealed formal entries
        env:
          GH_TOKEN: ${{ github.token }}
          FOOTBALL3_DURABLE_SELECTOR_REQUIRED: '1'
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/football-data:$PWD/football-data/formal_fast_runtime_v1:$PWD/football-data/formal_gpt_gateway_v1"
          for request in acceptance/focus/*.request.json; do
            key="$(basename "$request" .request.json)"
            state="$PWD/.focus_state/${key}"
            out="$PWD/acceptance/focus/${key}"
            rm -rf "$state" "$out"
            mkdir -p "$state" "$out"
            python3 football-data/formal_gpt_gateway_v1/durable_state_selector_v1.py \
              --repo "$GITHUB_REPOSITORY" --request "$PWD/$request" \
              --cache-root "$state" --audit "$out/durable_state_selection.json"
            python3 football-data/formal_fast_runtime_v1/runtime.py validate_bundle \
              --bundle "$state/bundle" | tee "$out/state-validate-before.txt"
            cp "$state/durable_state_selection_v1.json" "$out/durable_state_selection_bound.json"
            sha256sum "$state"/bundle/* | sort > "$out/state-files-before.sha256"
            python3 football-data/formal_gpt_gateway_v1/entry.py \
              --request "$PWD/$request" --repo-root "$PWD" \
              --understat-db "$PWD/.runtime_sources/understat/understat_frozen.db" \
              --confirmation-dir "$PWD/.runtime_sources/confirmation" \
              --state-root "$state" --out "$out" | tee "$out/stdout.txt"
            sha256sum "$state"/bundle/* | sort > "$out/state-files-after.sha256"
            diff -u "$out/state-files-before.sha256" "$out/state-files-after.sha256"
          done

      - name: Verify sealed formal-entry receipts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path('acceptance/focus')
          refs=json.load(open(root/'fixture-references.json'))
          rows=[]
          for key, fixture in sorted(refs.items()):
              out=root/key
              r=json.load(open(out/'prediction_receipt.json'))
              s=json.load(open(out/'summary.json'))
              b=json.load(open(out/'team_identity_bridge.json'))
              sel=json.load(open(out/'durable_state_selection_bound.json'))
              assert sel['status']=='SELECTED', (key,sel.get('status'))
              assert sel['competition_id']==fixture['competition_id']
              assert sel['target_cutoff']=='2026-09-04T13:19:44+00:00'
              assert s['status']=='PASS', (key,s.get('status'),s.get('reason') or s.get('fallback_reason'))
              assert r['state_integrity_guard']['status']=='PASS', (key,r['state_integrity_guard'])
              assert r['fallback_class']!='DATA_STATE_ANOMALY', (key,r['fallback_class'])
              assert r['manual_or_auxiliary_fallback_used'] is False
              assert r['state_sha256']==sel['selected']['state_sha256'], (key,r['state_sha256'],sel['selected']['state_sha256'])
              assert r['state_bundle_sha']==sel['selected']['state_bundle_sha256'], (key,r['state_bundle_sha'],sel['selected']['state_bundle_sha256'])
              assert s['state_mutated'] is False
              assert s['source_refetch_used'] is False
              assert s['gateway_route']=='SEALED_EXACT_CUTOFF_REPLAY'
              assert s['transition_status']=='NO_OP_DELTA'
              assert b['competition_id']==fixture['competition_id']
              assert b['home']['historical_match_count']>0 and b['away']['historical_match_count']>0
              assert b['home']['state_local_evidence'] and b['home']['state_global_evidence']
              assert b['away']['state_local_evidence'] and b['away']['state_global_evidence']
              rows.append({
                'key':key,'competition_id':fixture['competition_id'],'fixture_reference':fixture['fixture_reference'],
                'model_route':r['model_route'],'fallback_class':r['fallback_class'],
                'prediction_sha':r['prediction_sha'],'receipt_sha':r['receipt_sha'],
                'runtime_input_sha':r['runtime_input_sha'],'state_sha256':r['state_sha256'],
                'state_bundle_sha256':r['state_bundle_sha'],
                'selected_artifact_id':sel['selected']['artifact_id'],
                'selected_artifact_digest':sel['selected'].get('artifact_digest'),
                'selected_workflow_run_id':sel['selected']['workflow_run_id'],
                'selection_sha256':sel['selection_sha256'],
                'team_identity_mapping_sha256':b['mapping_sha256'],
              })
          core={'schema_version':'football3-focus-domain-formal-entry-probes-v1','status':'PASS','probe_count':len(rows),'probes':rows}
          assert len(rows)==6
          raw=json.dumps(core,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          core['probe_set_sha256']=hashlib.sha256(raw).hexdigest()
          (root/'focus-domain-formal-entry-probes.json').write_text(json.dumps(core,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'status':'PASS','probe_count':6,'probe_set_sha256':core['probe_set_sha256']},sort_keys=True))
          PY

      - name: Upload focus-domain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: focus-domain-formal-entry-probes-${{ github.run_id }}
          path: acceptance/focus/
          if-no-files-found: error
          retention-days: 90
