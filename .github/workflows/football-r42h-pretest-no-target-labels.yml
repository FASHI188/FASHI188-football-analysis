name: Football R42H Pretest No Target Labels

on:
  pull_request:
    paths:
      - "football-data/validation/diagnose_r42h_pretest_no_target_labels.py"
      - ".github/workflows/football-r42h-pretest-no-target-labels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-r42h-pretest-no-target-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: football-data/engine:football-data/validation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deterministic research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Compile diagnostic path
        run: |
          python -m py_compile \
            football-data/validation/diagnose_r42h_pretest_no_target_labels.py \
            football-data/validation/evaluate_r42h_team_red_foul_direct_total_fixed200.py \
            football-data/validation/evaluate_r42g_discipline_referee_direct_total_fixed200.py \
            football-data/validation/evaluate_r42f_htft_response_direct_total_fixed200.py \
            football-data/validation/evaluate_r42e_shot_direct_total_crossdomain_fixed200.py \
            football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Rebuild exact audited V5.1 historical ledger
        run: python football-data/validation/audit_v510_existing_score_market_pit_ledger_r1.py
      - name: Run no-target-label pretest diagnostic
        run: python football-data/validation/diagnose_r42h_pretest_no_target_labels.py
      - name: Verify hard diagnostic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/r42h_pretest_no_target_labels_status.json').read_text(encoding='utf-8'))
          assert x['target_labels_read_for_diagnostic']==0
          assert x.get('target_total_class_read_for_diagnostic',0)==0
          assert x.get('target_goal_difference_read_for_diagnostic',0)==0
          assert x['scientific_metrics_computed']==0
          if x['status']=='PASS_R42H_PRETEST_NO_TARGET_LABELS':
              assert x['sample_rows']==200 and x['sample_overlap_prior2600']==0
              assert x['baseline_probability_sum_max_residual'] < 1e-10
              assert x['challenger_probability_sum_max_residual'] < 1e-10
          else:
              assert x['status']=='STOP_R42H_PRETEST_COVERAGE_LT200'
              assert x['sample_bound'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
      - name: Upload engineering diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: r42h-pretest-no-target-labels
          path: football-data/manifests/r42h_pretest_no_target_labels_status.json
          if-no-files-found: error
          retention-days: 30
