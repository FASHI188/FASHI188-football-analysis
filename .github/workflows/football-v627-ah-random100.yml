name: football-v627-ah-random100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_three_stage_ah_soft_residual_random100_v6273.py'
      - 'football-data/validation/run_three_stage_ah_soft_residual_random100_v6273.py'
      - 'football-data/validation/validate_three_stage_ah_netgoal_random100_v6272.py'
      - 'football-data/validation/run_three_stage_ah_netgoal_random100_v6272_dual.py'
      - '.github/workflows/football-v627-ah-random100.yml'

permissions:
  contents: read

jobs:
  random100:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile
        run: |
          python -m py_compile \
            football-data/validation/validate_three_stage_ah_netgoal_random100_v6272.py \
            football-data/validation/run_three_stage_ah_netgoal_random100_v6272_dual.py \
            football-data/validation/validate_three_stage_ah_soft_residual_random100_v6273.py \
            football-data/validation/run_three_stage_ah_soft_residual_random100_v6273.py

      - name: Run V6.27.3 soft AH residual random100
        run: |
          python football-data/validation/run_three_stage_ah_soft_residual_random100_v6273.py

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6273-soft-ah-random100-receipt
          path: football-data/manifests/v6_three_stage_ah_soft_residual_random100_v6273_status.json
          if-no-files-found: error
