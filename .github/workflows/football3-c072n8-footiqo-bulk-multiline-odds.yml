name: football3-c072n8-footiqo-bulk-multiline-odds-reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4
      - name: Reproduce frozen N8 zero-label retrieval
        run: python football-data/research/audit_c072n8_footiqo_bulk_multiline_odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football3-c072n8-multiline-odds-zero-label-reproduction
          path: |
            football-data/research/c072n8_zero_label_summary.json
            football-data/research/c072n8_multiline_odds.csv
          if-no-files-found: error
