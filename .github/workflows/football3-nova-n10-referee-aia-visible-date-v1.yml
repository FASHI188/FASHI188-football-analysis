name: football3-nova-n10-referee-aia-visible-date

on:
  pull_request:
    paths:
      - 'governance/football3/nova_n10_referee_aia_visible_date_registry_v1.json'
      - 'governance/football3/nova_n10_referee_aia_visible_date_v1.py'
      - 'governance/football3/test_nova_n10_referee_aia_visible_date_v1.py'
      - '.github/workflows/football3-nova-n10-referee-aia-visible-date-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football3-nova-n10-referee-aia-visible-date-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  n10-referee-aia-visible-date:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and contract tests
        run: |
          set -euo pipefail
          python -m py_compile governance/football3/nova_n10_referee_aia_visible_date_v1.py governance/football3/test_nova_n10_referee_aia_visible_date_v1.py
          PYTHONPATH=governance/football3 python governance/football3/test_nova_n10_referee_aia_visible_date_v1.py 2>&1 | tee /tmp/tests.txt
          grep -q 'Ran 5 tests' /tmp/tests.txt
          grep -q '^OK$' /tmp/tests.txt
      - name: Audit bounded visible publication date
        run: |
          set -euo pipefail
          rm -rf _run && mkdir -p _run
          python governance/football3/nova_n10_referee_aia_visible_date_v1.py             --registry governance/football3/nova_n10_referee_aia_visible_date_registry_v1.json             --out _run --timeout 20 2>&1 | tee /tmp/audit.txt
          python - <<'PY'
          import json
          r=json.load(open('_run/aia_visible_date_receipt.json'))
          assert r['classification'] in {'POSITIVE_SIGNAL_SOURCE_FEASIBILITY','STOP_DATA_COVERAGE'}
          assert r['independent_immutable_archive_witness'] is False
          assert r['formal_available_at_proven'] is False
          assert r['appointment_names_parsed'] is False
          assert r['appointment_content_persisted'] is False
          assert r['article_content_after_date_parsed'] is False
          assert r['raw_prefix_persisted'] is False
          assert r['match_payload_read'] is False and r['standings_payload_read'] is False and r['player_stats_payload_read'] is False
          assert r['result_labels_read']==0 and r['score_values_read']==0
          assert r['training_performed'] is False and r['scoring_performed'] is False
          assert r['candidate_weight']==0 and r['matrix_delta']==0
          if r['classification']=='POSITIVE_SIGNAL_SOURCE_FEASIBILITY':
              assert r['official_self_declared_publication_date_pass'] is True
              assert r['target_report']['date_matches_expected'] is True
              assert r['target_report']['date_before_safe_cutoff'] is True
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: football3-nova-n10-referee-aia-visible-date-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}
          path: |
            _run/
            /tmp/tests.txt
            /tmp/audit.txt
          retention-days: 90
