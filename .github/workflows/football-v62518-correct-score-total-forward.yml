name: Football V6.25.18 Correct Score Total Forward

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_correct_score_total_forward_v62518.py"
      - "football-data/forward/v6_market_first_events_v651.json"
      - ".github/workflows/football-v62518-correct-score-total-forward.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v62518-correct-score-total-forward
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile challenger
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m py_compile football-data/validation/v6_correct_score_total_forward_v62518.py > /tmp/v62518_compile.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/v62518_compile.log
          exit 0

      - name: Freeze/evaluate prospective total rankings
        id: run
        if: steps.compile.outputs.exit_code == '0'
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          set +e
          python football-data/validation/v6_correct_score_total_forward_v62518.py > /tmp/v62518_run.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/v62518_run.log
          exit 0

      - name: Persist failure receipt if needed
        if: always()
        shell: bash
        env:
          COMPILE_RC: ${{ steps.compile.outputs.exit_code }}
          RUN_RC: ${{ steps.run.outputs.exit_code }}
        run: |
          path=football-data/manifests/v6_correct_score_total_forward_v62518_status.json
          if [ "$COMPILE_RC" != "0" ] || [ -z "$RUN_RC" ] || [ "$RUN_RC" != "0" ]; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('football-data/manifests/v6_correct_score_total_forward_v62518_status.json')
          compile_log=Path('/tmp/v62518_compile.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/v62518_compile.log').exists() else ''
          run_log=Path('/tmp/v62518_run.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/v62518_run.log').exists() else ''
          payload={
              'schema_version':'V6.25.18-correct-score-total-forward-failure-r1',
              'generated_at_utc':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'status':'FAIL',
              'formal_current_version':'V5.0.1',
              'compile_exit_code':os.environ.get('COMPILE_RC',''),
              'run_exit_code':os.environ.get('RUN_RC',''),
              'compile_log_tail':compile_log[-6000:],
              'run_log_tail':run_log[-16000:],
              'governance':{
                  'research_only':True,
                  'formal_weight':0,
                  'current_rule_change':False,
                  'runtime_probability_change':False,
                  'no_backfill':True
              }
          }
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi

      - name: Persist epoch predictions and receipt
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            football-data/manifests/v6_correct_score_total_forward_epoch_v62518.json \
            football-data/forward/v6_correct_score_total_predictions_v62518.json \
            football-data/manifests/v6_correct_score_total_forward_v62518_status.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.18 prospective score-to-total rankings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce challenger success
        if: always()
        shell: bash
        run: |
          test '${{ steps.compile.outputs.exit_code }}' = '0'
          test '${{ steps.run.outputs.exit_code }}' = '0'

# Ranking research only. No probability distribution is created or promoted.
# Retrigger marker: 2026-07-25T23:58+08:00; ranking rules unchanged.
