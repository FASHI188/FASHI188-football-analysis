name: football3 top1 R41 process-role fusion

on:
  push:
    branches:
      - football3/top1-r41-process-role-fusion
    paths:
      - football-data/experiments/top1_r41_process_role_fusion/run_experiment_r41.py
      - .github/workflows/football3-top1-r41-process-role-fusion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r41:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/top1-r41-process-role-fusion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modeling runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R41 fixed process-role fusion
        run: python football-data/experiments/top1_r41_process_role_fusion/run_experiment_r41.py run
      - name: Verify R41 contract
        run: python football-data/experiments/top1_r41_process_role_fusion/run_experiment_r41.py verify
      - name: Persist R41 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/top1_r41_process_role_fusion/results/summary_r41.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R41 process-role fusion'
            git fetch origin football3/top1-r41-process-role-fusion
            git rebase origin/football3/top1-r41-process-role-fusion
            git push origin HEAD:football3/top1-r41-process-role-fusion
          fi
      - name: Upload R41 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-top1-r41-process-role-fusion
          path: football-data/experiments/top1_r41_process_role_fusion/results/summary_r41.json
          if-no-files-found: error
          retention-days: 90
