name: football3 R43J0 nonlinear latent-state

on:
  push:
    branches:
      - football3/r43j0-nonlinear-latent-state
    paths:
      - football-data/experiments/r43j0_nonlinear_latent_state/**
      - .github/workflows/football3-r43j0-nonlinear-latent-state.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43j0:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43j0-nonlinear-latent-state
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Reconstruct frozen R42H runner
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/experiments/r42h_player_technical_translation
          cat "$D"/encoded/run_r42h.py.gz.b64.part0 "$D"/encoded/run_r42h.py.gz.b64.part1 | base64 -d | gzip -d > "$D"/run_r42h_player_technical_translation.py
          echo 'b7bf4bd5fbfd61936e8de52fa09e5b81f748389cb9e0d2de6f33641c1d394a45  '"$D"'/run_r42h_player_technical_translation.py' | sha256sum -c -
          echo '17155fe709877801299b1b8f2d965cb11da4cb81c5d2fc5733cf7536bbe2faad  football-data/experiments/r42i_player_technical_replication_prev20k/run_r42i_prev20k.py' | sha256sum -c -
          python -m py_compile football-data/experiments/r43f5_probability_weighted_technical_mixture/run_r43f5.py
          python -m py_compile football-data/experiments/r43j0_nonlinear_latent_state/run_r43j0.py
          python -m py_compile football-data/experiments/r43j0_nonlinear_latent_state/run_r43j0_r1.py
      - name: Run R43J0 nonlinear latent-state experiment
        run: python football-data/experiments/r43j0_nonlinear_latent_state/run_r43j0_r1.py run
      - name: Verify R43J0 contract
        run: python football-data/experiments/r43j0_nonlinear_latent_state/run_r43j0_r1.py verify
      - name: Persist R43J0 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add football-data/experiments/r43j0_nonlinear_latent_state/results/summary_r43j0_nonlinear_latent_state.json
          if git diff --cached --quiet; then
            echo 'No evidence delta'
          else
            git commit -m '[r43j0] persist nonlinear latent-state evidence'
            git push origin HEAD:football3/r43j0-nonlinear-latent-state
          fi
      - name: Upload R43J0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43j0-nonlinear-latent-state
          path: football-data/experiments/r43j0_nonlinear_latent_state/results/summary_r43j0_nonlinear_latent_state.json
          if-no-files-found: error
          retention-days: 90
