name: Football R39K Evaluation

on:
  pull_request:
    branches: [research/market-draw-regime-r39j]
    paths:
      - '.github/workflows/football-r39k-evaluation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: r39k-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  online-draw-calibration:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Resolve unique R39K evaluation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r39k-pointer
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/football-r39k-evaluation.yml/runs?branch=research%2Fonline-draw-calibration-r39k&per_page=20" \
            -o /tmp/runs.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('/tmp/runs.json').read_text());cur=int(os.environ['GITHUB_RUN_ID'])
          prior=[r for r in x.get('workflow_runs',[]) if int(r['id'])!=cur and r.get('head_branch')=='research/online-draw-calibration-r39k']
          prior.sort(key=lambda r:int(r['id']),reverse=True)
          if prior:
              p=prior[0];skip='1';pid=str(p['id']);state=p.get('status');conclusion=p.get('conclusion')
          else:
              skip='0';pid='';state=None;conclusion=None
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SKIP_R39K={skip}\nPRIOR_R39K_RUN_ID={pid}\n')
          out={'current_run_id':cur,'skip_current_evaluation':skip=='1','prior_evaluation_run_id':int(pid) if pid else None,'prior_status':state,'prior_conclusion':conclusion}
          Path('r39k-pointer/uniqueness.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY

      - uses: actions/checkout@v6
        if: env.SKIP_R39K != '1'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        if: env.SKIP_R39K != '1'
        with:
          python-version: '3.12'

      - name: Install frozen numerical dependency
        if: env.SKIP_R39K != '1'
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'

      - name: Verify successful zero-label preflight authorization
        if: env.SKIP_R39K != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('football-data/research/online_draw_r39k/preregistration_r39k.json').read_text())
          assert p['preregistration_status']=='MODEL_AND_PREEXISTING_HOLDOUT_FROZEN'
          assert p['source_binding']['fixed100_identity_sha256']=='6ebc9f200942a49e5456774236f950bd73f49e5a0591e29f2e5195c8ccb0d050'
          assert p['source_binding']['holdout_labels_accessed_before_r39k']==0
          assert p['prior_research_separation']['r39j_fixed100_labels_accessed']==0
          print('PASS_R39K_FROZEN_CONTRACT_BEFORE_DATA')
          PY
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31350286533" -o /tmp/preflight-run.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31350286533/artifacts" -o /tmp/preflight-artifacts.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/preflight-run.json').read_text())
          a=json.loads(Path('/tmp/preflight-artifacts.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='5cf0b1fc1e62ae79b7467c1e4beb7dd5eeb009d8'
          arts=a.get('artifacts',[]); assert len(arts)==1
          x=arts[0]
          assert x['id']==9048811475
          assert x.get('digest')=='sha256:ca8628b29b1ce4eb22236029b62429c262862a205dec545c782146c7fed4944d'
          print('PASS_R39K_AUTHORIZED_BY_ZERO_LABEL_PREFLIGHT_31350286533')
          PY

      - name: Verify exact evaluator before source download
        if: env.SKIP_R39K != '1'
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/online_draw_r39k/evaluate_online_draw_r39k.py football-data/research/online_draw_r39k/run_online_draw_r39k.py
          python football-data/research/online_draw_r39k/run_online_draw_r39k.py --self-test

      - name: Download Football-Data and isolate market-only inputs
        if: env.SKIP_R39K != '1'
        run: |
          set -euo pipefail
          rm -rf r39k-market r39k-raw r39k-output
          mkdir -p r39k-market r39k-raw r39k-output
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="r39k-raw/${season}_${div}.csv"
              dst="r39k-market/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$dst" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgH','AvgD','AvgA','AvgCH','AvgCD','AvgCA','Avg>2.5','Avg<2.5','AvgC>2.5','AvgC<2.5','AHh','AvgAHH','AvgAHA','AHCh','AvgCAHH','AvgCAHA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f, open(dst,'w',encoding='utf-8',newline='') as g:
              r=csv.DictReader(f);missing=[c for c in keep if c not in (r.fieldnames or [])]
              if missing: raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in r:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
            done
          done

      - name: Execute frozen R39K causal label-order sequence
        if: env.SKIP_R39K != '1'
        run: |
          set -euo pipefail
          python football-data/research/online_draw_r39k/run_online_draw_r39k.py \
            --prereg football-data/research/online_draw_r39k/preregistration_r39k.json \
            --market-dir r39k-market --raw-dir r39k-raw --out-dir r39k-output

      - name: Verify terminal label boundary
        if: env.SKIP_R39K != '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39k-output/r39k_result.json').read_text())
          allowed={
            'STOP_R39K_BEFORE_CONFIRMATION_DYNAMIC_REGIME_NO_DEVELOPMENT_INCREMENT',
            'STOP_R39K_BEFORE_HOLDOUT_LABEL_ACCESS_VALIDATION_DYNAMIC_REGIME_NO_INCREMENT',
            'STOP_R39K_BEFORE_HOLDOUT_LABEL_ACCESS_POLICY_DYNAMIC_REGIME_NO_INCREMENT',
            'PASS_R39K_ONLINE_DRAW_CALIBRATION_FIXED100_EXPLORATORY_ONLY',
            'NO_R39K_ONLINE_DRAW_CALIBRATION_INCREMENT_FIXED100'
          }
          assert r['status'] in allowed
          f=json.loads(Path('r39k-output/freeze_receipt_r39k.json').read_text())
          if r['status'].startswith('STOP_R39K_BEFORE_'):
              assert r['holdout_labels_accessed']==0
              assert f['final_freeze_completed'] is False
              assert f['holdout_labels_accessed_before_freeze']==0
          else:
              assert r['holdout_labels_accessed']==100
              assert f['final_freeze_completed'] is True
              assert f['holdout_labels_accessed_before_freeze']==0
          print(json.dumps({
            'status':r['status'],
            'selected_half_lives':r.get('selected_half_lives'),
            'development':r.get('development'),
            'validation':r.get('validation'),
            'policy':r.get('policy'),
            'holdout':r.get('holdout'),
            'holdout_labels_accessed':r['holdout_labels_accessed']
          },indent=2))
          PY

      - name: Delete source inputs before artifact
        if: env.SKIP_R39K != '1'
        run: rm -rf r39k-market r39k-raw

      - uses: actions/upload-artifact@v4
        if: env.SKIP_R39K != '1'
        with:
          name: football-r39k-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: r39k-output/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: football-r39k-evaluation-uniqueness-${{ github.sha }}-${{ github.run_id }}
          path: r39k-pointer/
          if-no-files-found: error
          retention-days: 30
