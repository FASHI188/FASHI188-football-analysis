name: football3 R43GOV0 M5H component chain composition

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/components/r43_native_matrix_components.py
      - football-data/components/r43_probability_matrix_adapters.py
      - football-data/components/r43u_fixed_diagonal.py
      - football-data/pipeline/unified_inference.py
      - football-data/tests/test_r43_component_chain_composition.py
      - .github/workflows/football3-r43gov0-component-chain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Verify governance isolation and frozen V500
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object football-data/validation/bayesian_dynamic_state_oof_v500.py)" = "9c302506c49aa1847e60cd7896fc1a80f3b6b457"
          if git diff --name-only 8e7aa3d703b88fae7e275203afa9d6897db79dcf...HEAD | grep -E '(^|/)CURRENT($|/)|football-data/forward/v6_market_first_events_v651.json|football-data/forward/r43u1_pristine_forward_events.json|football-data/forward/r43y0_draw_calibration_forward_events.json'; then
            echo 'sealed/current path modified' >&2
            exit 1
          fi
      - name: Compile M5H component chain
        run: |
          python -m py_compile football-data/components/r43_native_matrix_components.py
          python -m py_compile football-data/tests/test_r43_component_chain_composition.py
      - name: Run unified component-chain composition tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s football-data/tests -p 'test_r43_component_chain_composition.py' -v 2>&1 | tee /tmp/m5h_test.log
      - name: Upload M5H diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5h-component-chain-diagnostic
          path: /tmp/m5h_test.log
          if-no-files-found: error
          retention-days: 30
      - name: Write M5H gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/m5h_component_chain_gate.json <<'JSON'
          {
            "schema_version": "football3-r43gov0-m5h-component-chain-gate-v1",
            "status": "PASS",
            "scope": "research_governance_only",
            "formal_default_baseline": "V500_frozen_unchanged",
            "r43q_candidate_baseline_available": true,
            "r43q_candidate_is_formal_default": false,
            "r43t_score_matrix_protocol_adapter_available": true,
            "r43t_same_kickoff_preupdate_state_frozen": true,
            "r43t_outcome_update_only_after_group_predictions": true,
            "r43u_native_matrix_component_composable": true,
            "r43y_native_1x2_transport_composable": true,
            "r43r_native_1x2_transport_composable": true,
            "q_u_y_dataset_replay_live_numerically_identical": true,
            "invalid_y_before_u_order_fails_closed": true,
            "r43r_source_mass_mismatch_fails_closed": true,
            "all_research_components_enabled_by_default": false,
            "fresh_confirmatory_test_claim": false,
            "current_modified": false,
            "main_modified": false,
            "u0_y0_predictions_modified": false,
            "next_step": "M6_unified_dataset_generator_and_evaluator"
          }
          JSON
      - name: Upload M5H gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-m5h-component-chain-gate
          path: football-data/governance/r43gov0/results/m5h_component_chain_gate.json
          if-no-files-found: error
          retention-days: 90
