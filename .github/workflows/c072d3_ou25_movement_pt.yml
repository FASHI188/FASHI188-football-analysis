name: C072-D3 OU2.5 movement P(T) development

on:
  push:
    branches:
      - football3/c072d3-ou25-movement-pt-development-20260819
    paths:
      - 'football-data/research/c072d3_ou25_movement_pt_contract.json'
      - 'football-data/research/evaluate_c072d3_ou25_movement_pt.py'
      - 'football-data/research/C072D3_EXECUTION_TRIGGER.txt'
      - '.github/workflows/c072d3_ou25_movement_pt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scikit-learn==1.5.2
      - name: Run frozen C072-D3 development evaluator
        shell: bash
        run: |
          set +e
          python football-data/research/evaluate_c072d3_ou25_movement_pt.py --out football-data/research/c072d3_ou25_movement_pt_summary.json
          code=$?
          echo "EVAL_EXIT=${code}" >> "$GITHUB_ENV"
          exit 0
      - name: Commit immutable development evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f football-data/research/c072d3_ou25_movement_pt_summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/research/c072d3_ou25_movement_pt_summary.json
          if git diff --cached --quiet; then
            echo 'No evidence diff to commit.'
          else
            git commit -m 'evidence: football3 C072-D3 movement P(T) development [skip ci]'
            git push origin HEAD:football3/c072d3-ou25-movement-pt-development-20260819
          fi
      - name: Enforce frozen scientific gate
        shell: bash
        run: |
          if [[ "${EVAL_EXIT}" != "0" ]]; then
            echo "Frozen C072-D3 gate did not PASS; evidence committed with exit ${EVAL_EXIT}."
            exit "${EVAL_EXIT}"
          fi
