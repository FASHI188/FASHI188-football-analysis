name: Football R40E Existing Data Pairwise Draw

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/football-r40e-existing-data-pairwise-draw.yml'
      - 'football-data/research/existing_data_pairwise_draw_r40e/**'

permissions:
  contents: read

jobs:
  tenth-disjoint-fixed100-pairwise-draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify R40E preregistration and dependency
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/existing_data_pairwise_draw_r40e/evaluate_r40e.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path('football-data/research/existing_data_pairwise_draw_r40e/preregistration_r40e.json').read_text())
          assert p['schema_version']=='R40E-EXISTING-DATA-PAIRWISE-DRAW-1.0'
          assert p['sample']['size']==100
          for k in ('r39u','r39v','r39w','r39x','r39y','r39z','r40a','r40b','r40d'):
              assert p['sample'][f'required_overlap_with_{k}']==0
          a=p['algorithm']; h=p['hard_boundaries']
          assert a['l2']==10.0
          assert a['probabilistic_claim'] is False
          assert a['manual_draw_boost'] is False and a['class_weighting'] is False
          assert a['candidate_grid'] is False and a['threshold_tuning'] is False
          assert a['post_result_tuning'] is False and a['abstention'] is False
          assert h['external_network_requests']==0 and h['football_api_requests']==0
          assert h['new_data_collection'] is False
          assert h['formal_model_mutation'] is False and h['formal_data_mutation'] is False
          assert h['current_rule_mutation'] is False and h['main_mutation'] is False
          got=subprocess.check_output(['git','rev-parse','HEAD:football-data/research/existing_data_balance_intensity_r39w/evaluate_r39w.py'],text=True).strip()
          assert got=='4abe6918ec9fd32e65d7b6eb2d74686238e0f1ae', got
          print('PASS_R40E_PREREG_AND_DEPENDENCY')
          PY

      - name: Execute R40E tenth disjoint fixed100
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r40e-output"
          python football-data/research/existing_data_pairwise_draw_r40e/evaluate_r40e.py \
            --prereg football-data/research/existing_data_pairwise_draw_r40e/preregistration_r40e.json \
            --root . \
            --out "$RUNNER_TEMP/r40e-output"

      - name: Verify R40E output and hard boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'r40e-output'
          p=root/'r40e_result.json'; raw=p.read_bytes(); r=json.loads(raw)
          assert r['terminal'] in {'PASS_R40E_PAIRWISE_DRAW_GEOMETRY_INCREMENT','FAIL_R40E_PAIRWISE_DRAW_GEOMETRY_NO_INCREMENT'}
          assert len(r['sample_keys'])==100 and len(set(r['sample_keys']))==100
          assert r['overlap']=={'r39u':0,'r39v':0,'r39w':0,'r39x':0,'r39y':0,'r39z':0,'r40a':0,'r40b':0,'r40d':0}
          assert len(r['audit'])==100
          assert all(isinstance(v,bool) for v in r['gate'].values())
          for row in r['audit']:
              assert abs(row['pairwise_score_sum']-3.0)<1e-10
          h=r['hard_boundaries']
          assert h['external_network_requests']==0 and h['football_api_requests']==0
          assert h['new_data_collection'] is False and h['main_mutation'] is False
          want=(root/'r40e_result.sha256').read_text().strip()
          assert want==hashlib.sha256(raw).hexdigest()
          print(json.dumps({
            'terminal':r['terminal'],'passed':r['passed'],'sample_sha':r['r40e_fixed100_identity_sha256'],
            'overlap':r['overlap'],'pairwise_metrics':r['pairwise_metrics'],'baseline_metrics':r['baseline_metrics'],'gate':r['gate']
          },indent=2))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r40e-existing-data-pairwise-draw-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r40e-output
          retention-days: 30
          if-no-files-found: error
