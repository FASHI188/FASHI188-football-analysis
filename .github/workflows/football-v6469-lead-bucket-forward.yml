name: Football V6.46.9 Lead-bucket Prospective Forward

on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_lead_bucket_forward_v6469.py"
      - "football-data/evidence/markets_prospective/**"
      - "football-data/forward/inbox/market_first_results_v651.json"
      - ".github/workflows/football-v6469-lead-bucket-forward.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6469-lead-bucket-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile football-data/validation/v6_lead_bucket_forward_v6469.py
      - env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_lead_bucket_forward_v6469.py
      - name: Persist prospective bucket ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            football-data/manifests/v6_lead_bucket_forward_v6469_freeze.json \
            football-data/forward/v6_lead_bucket_events_v6469.json \
            football-data/manifests/v6_lead_bucket_forward_v6469_status.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.46.9 lead-bucket forward state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
