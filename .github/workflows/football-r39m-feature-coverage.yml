name: Football R39M Feature Coverage

on:
  pull_request:
    paths:
      - '.github/workflows/football-r39m-feature-coverage.yml'
      - 'football-data/research/lineup_attack_recency_r39m/**'

permissions:
  contents: read

concurrency:
  group: r39m-feature-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zero-target-label-recency-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.2'
      - name: Verify zero-label contract and synthetic recency weighting
        run: |
          set -euo pipefail
          python -m py_compile football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py
          python - <<'PY'
          import importlib.util,json,math
          from datetime import date
          from pathlib import Path
          p=json.loads(Path('football-data/research/lineup_attack_recency_r39m/preregistration_r39m.json').read_text())
          s=json.loads(Path('football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json').read_text())
          assert p['preregistration_status']=='HYPOTHESIS_AND_ALGORITHM_FROZEN_BEFORE_R39M_TARGET_LABEL_EVALUATION'
          assert p['blind_binding']['fixed100_labels_accessed_before_r39m']==0
          assert p['blind_binding']['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert p['recency_weighted_player_attack_rate']['half_life_days_candidates']==[90,180,365]
          assert all(v==0 for v in s['no_target_label_contract'].values())
          path=Path('football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py')
          spec=importlib.util.spec_from_file_location('r39m',path);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          raw={'p':[(date(2023,1,1).toordinal(),10.0,90.0),(date(2023,12,31).toordinal(),1.0,90.0)]}
          idx=m.pack(raw);g90,mm90,mx=m.weighted_before(idx,'p',date(2024,1,2),90);g365,mm365,_=m.weighted_before(idx,'p',date(2024,1,2),365)
          assert mx==date(2023,12,31).toordinal()
          # Old 10-goal appearance is discounted more strongly at 90d, so weighted GA/min is lower than at 365d.
          assert g90/mm90 < g365/mm365
          # Same-day observation must be excluded.
          raw2={'p':[(date(2024,1,2).toordinal(),100.0,90.0)]};idx2=m.pack(raw2);g,mn,mx=m.weighted_before(idx2,'p',date(2024,1,2),90);assert (g,mn,mx)==(0.0,0.0,None)
          print('PASS_R39M_ZERO_LABEL_RECENCY_SELF_TEST')
          PY
      - name: Download and sanitize Transfermarkt source tables
        run: |
          set -euo pipefail
          rm -rf r39m-tm r39m-fd r39m-out player_scores.zip /tmp/r39m-*.csv
          mkdir -p r39m-tm r39m-fd r39m-out
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 900 --user-agent 'Mozilla/5.0' \
            'https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores' -o player_scores.zip
          unzip -p player_scores.zip games.csv > /tmp/r39m-games.csv
          unzip -p player_scores.zip game_lineups.csv > /tmp/r39m-lineups.csv
          unzip -p player_scores.zip appearances.csv > /tmp/r39m-appearances.csv
          python - <<'PY'
          import csv
          specs=[
            ('/tmp/r39m-games.csv','r39m-tm/games_identity.csv',['game_id','competition_id','season','date','home_club_id','away_club_id','home_club_name','away_club_name']),
            ('/tmp/r39m-lineups.csv','r39m-tm/lineups_identity.csv',['game_id','player_id','club_id','type','position','number','team_captain']),
            ('/tmp/r39m-appearances.csv','r39m-tm/appearances_prior.csv',['appearance_id','game_id','player_id','player_club_id','date','competition_id','goals','assists','minutes_played'])]
          for src,dst,keep in specs:
              with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
                  rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
                  if missing:raise SystemExit(f'{src} missing {missing}')
                  w=csv.DictWriter(g,fieldnames=keep);w.writeheader()
                  for row in rd:w.writerow({c:row.get(c,'') for c in keep})
          PY
          rm -f /tmp/r39m-games.csv /tmp/r39m-lineups.csv /tmp/r39m-appearances.csv player_scores.zip
      - name: Download and sanitize Football-Data market identity only
        run: |
          set -euo pipefail
          for season in 1920 2021 2122 2223 2324 2425 2526; do
            for div in E0 D1 I1 SP1 F1; do
              raw="/tmp/r39m-${season}_${div}.csv";out="r39m-fd/${season}_${div}.csv"
              curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
                "https://www.football-data.co.uk/mmz4281/${season}/${div}.csv" -o "$raw"
              python - "$raw" "$out" "$season" <<'PY'
          import csv,sys
          src,dst,season=sys.argv[1:]
          keep=['Div','Date','Time','HomeTeam','AwayTeam','AvgCH','AvgCD','AvgCA']
          with open(src,'r',encoding='utf-8-sig',errors='replace',newline='') as f,open(dst,'w',encoding='utf-8',newline='') as g:
              rd=csv.DictReader(f);missing=[c for c in keep if c not in (rd.fieldnames or [])]
              if missing:raise SystemExit(f'{src} missing {missing}')
              w=csv.DictWriter(g,fieldnames=['Season']+keep);w.writeheader()
              for row in rd:w.writerow({'Season':season,**{c:row.get(c,'') for c in keep}})
          PY
              rm -f "$raw"
            done
          done
      - name: Audit all fixed half-life feature lanes
        run: |
          set -euo pipefail
          python football-data/research/lineup_attack_recency_r39m/audit_recency_features_r39m.py \
            --registration football-data/research/lineup_attack_recency_r39m/source_registration_r39m.json \
            --r39l-source-registration football-data/research/lineup_attack_r39l/source_registration_r39l.json \
            --r39i-registration football-data/research/prematch_shock_r39i/coverage_registration_r39i.json \
            --market-dir r39m-fd --games r39m-tm/games_identity.csv --lineups r39m-tm/lineups_identity.csv \
            --appearances r39m-tm/appearances_prior.csv --out-dir r39m-out
      - name: Verify zero-target-label terminal state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('r39m-out/feature_coverage_r39m.json').read_text())
          assert r['status']=='PASS_R39M_ZERO_TARGET_LABEL_RECENCY_FEATURE_COVERAGE'
          assert r['identity_lane']['preholdout']==8161 and r['identity_lane']['holdout_2526']==1273 and r['identity_lane']['fixed100']==100
          assert r['identity_lane']['fixed100_identity_sha256']=='f5ac889cec4ffe9cc4bb40ec1586f5362f769b54a0e1f81a650ecc78ff68f3cc'
          assert r['total_strict_lag_violations']==0
          for h in ('90','180','365'):
              x=r['half_life_results'][h];assert x['counts']=={'all':9434,'preholdout':8161,'holdout_2526':1273,'fixed100':100};assert x['ineligible_reasons']=={};assert x['strict_lag_violations']==0
          assert all(v==0 for v in r['audit_access'].values())
          print(json.dumps({k:r[k] for k in ('status','identity_lane','half_life_results','total_strict_lag_violations','audit_access')},indent=2))
          PY
      - name: Delete source inputs before artifact
        run: rm -rf r39m-tm r39m-fd
      - uses: actions/upload-artifact@v4
        with:
          name: football-r39m-feature-coverage-${{ github.sha }}-${{ github.run_id }}
          path: r39m-out/
          if-no-files-found: error
          retention-days: 30
