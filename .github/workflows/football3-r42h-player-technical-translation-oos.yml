name: football3 R42H player technical translation OOS

on:
  push:
    branches:
      - football3/r42h-player-technical-translation-oos
    paths:
      - football-data/experiments/r42h_player_technical_translation/**
      - .github/workflows/football3-r42h-player-technical-translation-oos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r42h-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r42h-player-technical-translation-oos
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore exact R9b frozen 20k snapshot
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Reconstruct frozen R42H runner
        shell: bash
        run: |
          set -euo pipefail
          D=football-data/experiments/r42h_player_technical_translation
          cat "$D"/encoded/run_r42h.py.gz.b64.part0 "$D"/encoded/run_r42h.py.gz.b64.part1 | base64 -d | gzip -d > "$D"/run_r42h_player_technical_translation.py
          echo 'b7bf4bd5fbfd61936e8de52fa09e5b81f748389cb9e0d2de6f33641c1d394a45  '"$D"'/run_r42h_player_technical_translation.py' | sha256sum -c -
          python -m py_compile "$D"/run_r42h_player_technical_translation.py
      - name: Run R42H technical translation audit
        run: python football-data/experiments/r42h_player_technical_translation/run_r42h_player_technical_translation.py run
      - name: Verify R42H contract
        run: python football-data/experiments/r42h_player_technical_translation/run_r42h_player_technical_translation.py verify
      - name: Persist R42H evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r42h_player_technical_translation/results/summary_r42h_player_technical_translation.json
          git add football-data/experiments/r42h_player_technical_translation/results/oos_records_r42h.jsonl
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R42H player technical translation OOS audit'
            git fetch origin football3/r42h-player-technical-translation-oos
            git rebase origin/football3/r42h-player-technical-translation-oos
            git push origin HEAD:football3/r42h-player-technical-translation-oos
          fi
      - name: Upload R42H artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r42h-player-technical-translation-oos
          path: |
            football-data/experiments/r42h_player_technical_translation/results/summary_r42h_player_technical_translation.json
            football-data/experiments/r42h_player_technical_translation/results/oos_records_r42h.jsonl
          if-no-files-found: error
          retention-days: 90
