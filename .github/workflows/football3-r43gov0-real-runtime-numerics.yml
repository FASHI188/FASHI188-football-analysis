name: football3 R43GOV0 real runtime numerics

on:
  push:
    branches:
      - football3/r43gov0-unified-governance-audit
    paths:
      - football-data/pipeline/s60_numerical_baseline.py
      - football-data/components/v500_dynamic_state.py
      - football-data/pipeline/unified_inference.py
      - football-data/pipeline/unified_dataset.py
      - football-data/tests/test_real_runtime_numerical_chain.py
      - .github/workflows/football3-r43gov0-real-runtime-numerics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-runtime-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/r43gov0-unified-governance-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Compile real runtime chain
        run: |
          python -m py_compile football-data/pipeline/s60_numerical_baseline.py
          python -m py_compile football-data/components/v500_dynamic_state.py
          python -m py_compile football-data/pipeline/unified_inference.py
          python -m py_compile football-data/pipeline/unified_dataset.py
      - name: Run real numerical component tests
        run: python -m unittest discover -s football-data/tests -p 'test_real_runtime_numerical_chain.py' -v
      - name: Run existing unified dataset regression
        run: python -m unittest discover -s football-data/tests -p 'test_unified_dataset_evaluator.py' -v
      - name: Run component chain regression
        run: python -m unittest discover -s football-data/tests -p 'test_r43_component_chain_composition.py' -v
      - name: Run PIT market regression
        run: python -m unittest discover -s football-data/tests -p 'test_r43q_pit_market_binding.py' -v
      - name: Write gate receipt
        shell: bash
        run: |
          mkdir -p football-data/governance/r43gov0/results
          cat > football-data/governance/r43gov0/results/real_runtime_numerics_gate.json <<JSON
          {
            "schema_version": "football3-r43gov0-real-runtime-numerics-gate-v1",
            "status": "PASS",
            "s60_real_numerical_baseline_inside_unified_engine": true,
            "s60_precomputed_fixture_numerics_forbidden": true,
            "v500_real_numerical_component_inside_unified_engine": true,
            "v500_precomputed_candidate_output_forbidden": true,
            "v500_enabled_by_default": false,
            "v500_formal_weight": 0,
            "baseline_and_component_group_lifecycle_unified": true,
            "lineup_numeric_1x2_enabled": false,
            "player_technical_numeric_1x2_enabled": false,
            "head_coach_numeric_1x2_enabled": false,
            "availability_numeric_1x2_enabled": false,
            "u0_y0_predictions_modified": false
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: football3-r43gov0-real-runtime-numerics-gate
          path: football-data/governance/r43gov0/results/real_runtime_numerics_gate.json
          if-no-files-found: error
          retention-days: 90
