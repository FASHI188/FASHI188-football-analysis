name: football3-adaptive-latent-stage4-zero-label-v1

on:
  push:
    branches:
      - football3/adaptive-latent-strength-v1
    paths:
      - "football-data/research/adaptive_latent_stage4_zero_label_core_v1.py"
      - "football-data/research/adaptive_latent_stage4_zero_label_acquisition_v1.py"
      - "football-data/research/test_adaptive_latent_stage4_zero_label_acquisition_v1.py"
      - "football-data/research/adaptive_latent_stage4_zero_label_contract_v1.json"
      - ".github/workflows/football3-adaptive-latent-stage4-zero-label-v1.yml"

permissions:
  contents: read

jobs:
  stage4-exact-whitelist-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Stage4 guard
        run: |
          python -m py_compile \
            football-data/research/adaptive_latent_identity_lock_v1.py \
            football-data/research/adaptive_latent_stage4_zero_label_core_v1.py \
            football-data/research/adaptive_latent_stage4_zero_label_acquisition_v1.py \
            football-data/research/test_adaptive_latent_stage4_zero_label_acquisition_v1.py
          python -m json.tool football-data/research/adaptive_latent_stage4_zero_label_contract_v1.json > /dev/null

      - name: Exact-whitelist behavior and fail-closed tests
        run: python football-data/research/test_adaptive_latent_stage4_zero_label_acquisition_v1.py

      - name: Emit stop-only evidence
        run: |
          rm -rf football-data/research/evidence/adaptive_latent_stage4
          python football-data/research/adaptive_latent_stage4_zero_label_acquisition_v1.py \
            --output-root football-data/research/evidence/adaptive_latent_stage4
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("football-data/research/evidence/adaptive_latent_stage4")
          actual={p.name for p in root.iterdir() if p.is_file()}
          if actual != {"stage4_acquisition_status_v2.json"}:
              raise SystemExit(f"unexpected evidence files: {sorted(actual)}")
          status=json.loads((root/"stage4_acquisition_status_v2.json").read_text())
          assert status["status"] == "STOP_SOURCE_SCHEMA_WHITELIST"
          assert status["live_provider_call_performed"] is False
          assert status["real_labels_read"] == 0
          assert status["training"] is False
          assert status["real_scoring"] is False
          print(json.dumps(status,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: football3-adaptive-latent-stage4-whitelist-guard-${{ github.sha }}
          path: football-data/research/evidence/adaptive_latent_stage4
          if-no-files-found: error
          retention-days: 90
