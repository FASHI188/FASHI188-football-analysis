name: football3 R43D0 score collapse

on:
  push:
    branches:
      - football3/r43d0-score-collapse-conditional-reallocation
    paths:
      - 'football-data/experiments/r43d0_score_collapse_conditional_reallocation/**'
      - '.github/workflows/football3-r43d0-score-collapse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r43d0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: football3/r43d0-score-collapse-conditional-reallocation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow scikit-learn
      - name: Restore R9b 20k source spine
        run: python football-data/experiments/top1_r9b_xg_hf/run_experiment_r9b.py freeze
      - name: Run R43D0 score collapse audit
        run: python football-data/experiments/r43d0_score_collapse_conditional_reallocation/run_r43d0.py run
      - name: Verify R43D0 contract
        run: python football-data/experiments/r43d0_score_collapse_conditional_reallocation/run_r43d0.py verify
      - name: Persist R43D0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/r43d0_score_collapse_conditional_reallocation/results/summary_r43d0_score_collapse.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m '[generated] football3 R43D0 score collapse audit'
            git fetch origin football3/r43d0-score-collapse-conditional-reallocation
            git rebase origin/football3/r43d0-score-collapse-conditional-reallocation
            git push origin HEAD:football3/r43d0-score-collapse-conditional-reallocation
          fi
      - name: Upload R43D0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-r43d0-score-collapse
          path: football-data/experiments/r43d0_score_collapse_conditional_reallocation/results/summary_r43d0_score_collapse.json
          if-no-files-found: error
          retention-days: 90
