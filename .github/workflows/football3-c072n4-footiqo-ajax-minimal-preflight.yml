name: football3-c072n4-footiqo-ajax-minimal-preflight

on:
  pull_request:
    branches:
      - football3/c072n3-footiqo-ajax-backend-zero-label-20260819
    paths:
      - 'football-data/research/C072N4_FOOTIQO_AJAX_MINIMAL_PREFLIGHT_CONTRACT.md'
      - 'football-data/research/audit_c072n4_footiqo_ajax_minimal_preflight.py'
      - '.github/workflows/football3-c072n4-footiqo-ajax-minimal-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.13.4
      - name: Contract guard
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('football-data/research/C072N4_FOOTIQO_AJAX_MINIMAL_PREFLIGHT_CONTRACT.md').read_text()
          assert 'first and only' in c
          assert 'length=1' in c
          assert 'Do NOT persist football row values' in c
          assert 'C073-C077 remain quarantined' in c
          print('N4 contract guard: PASS')
          PY
      - name: Run one-request minimal preflight
        run: python football-data/research/audit_c072n4_footiqo_ajax_minimal_preflight.py
      - name: Boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/research/c072n4_preflight_result.json').read_text())
          assert x['football_table_data_requests_made'] <= 1
          assert x['football_row_values_persisted'] == 0
          assert x['target_result_values_materialized'] == 0
          assert x['model_fit'] == 0 and x['model_score'] == 0
          assert x['C073_C077_quarantined'] is True
          assert x['C070F_confirmation1597_opened'] is False
          print('N4 boundaries: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: football3-c072n4-footiqo-ajax-minimal-preflight
          path: football-data/research/c072n4_preflight_result.json
          if-no-files-found: error
