name: Football V6.23.0 Adaptive Half-Life Hedge Screen

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_adaptive_half_life_hedge_v6230.py"
      - "football-data/validation/v6_adaptive_half_life_hedge_v6230_random100.py"
      - ".github/workflows/football-v6230-adaptive-half-life-hedge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6230-adaptive-half-life-hedge
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile challengers
        run: |
          python -m py_compile football-data/validation/v6_adaptive_half_life_hedge_v6230.py
          python -m py_compile football-data/validation/v6_adaptive_half_life_hedge_v6230_random100.py
      - name: Run strict-PIT adaptive half-life screen
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          python football-data/validation/v6_adaptive_half_life_hedge_v6230.py
          code=$?
          echo "validation_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Run fixed-seed random100 replay
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          python football-data/validation/v6_adaptive_half_life_hedge_v6230_random100.py
          code=$?
          echo "random100_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Persist audit receipts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            football-data/manifests/v6_adaptive_half_life_hedge_v6230_status.json \
            football-data/manifests/v6_adaptive_half_life_hedge_v6230_random100_status.json
          do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.23.0 adaptive half-life Hedge screens"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce execution pass
        run: |
          test "${validation_exit_code:-2}" = "0"
          test "${random100_exit_code:-2}" = "0"

# Research-only: no CURRENT/runtime/promotion mutation.
