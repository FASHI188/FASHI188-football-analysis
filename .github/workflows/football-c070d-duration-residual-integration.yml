name: Football C070-D Duration Residual Integration

on:
  pull_request:
    paths:
      - 'football-data/research/c070d_duration_residual_integration/**'
      - 'football-data/validation/evaluate_c070d_duration_residual_integration.py'
      - '.github/workflows/football-c070d-duration-residual-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 scipy==1.18.0 scikit-learn==1.8.0

      - name: Compile frozen C070-D implementation
        run: |
          python -m py_compile \
            football-data/validation/build_c068_a01_runtime.py \
            football-data/validation/build_c068_a02_runtime.py \
            football-data/validation/build_c069_a03_runtime.py \
            football-data/validation/evaluate_c069_matched_pair_draw_state_r1.py \
            football-data/validation/evaluate_c069_r2_maxcard_coverage.py \
            football-data/validation/evaluate_c069_r3_a03_expanded_dev.py \
            football-data/validation/run_c069_r3_a03_expanded_dev.py \
            football-data/validation/audit_c069_r3_goal_parser.py \
            football-data/validation/evaluate_c070c_semimarkov_generator.py \
            football-data/validation/evaluate_c070d_duration_residual_integration.py
          python -m json.tool football-data/research/c070d_duration_residual_integration/contract.json >/dev/null

      - name: Download exact public Wyscout source archives
        run: |
          mkdir -p /tmp/c070d
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/c070d/matches.zip https://ndownloader.figshare.com/files/14464622
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/c070d/events.zip https://ndownloader.figshare.com/files/14464685
          echo "c8f92bb7533e5c127e043cee764c991b5c25b4f5e70a65be931baae0b1765ce9  /tmp/c070d/matches.zip" | sha256sum -c -
          echo "877e015b716ffdeea18f04418e3f24fed307ed03c37ff305cabe1f47c4822a45  /tmp/c070d/events.zip" | sha256sum -c -

      - name: Rebuild frozen A01 A02 A03 development packages
        run: |
          python football-data/validation/build_c068_a01_runtime.py \
            --matches-zip /tmp/c070d/matches.zip --events-zip /tmp/c070d/events.zip --out /tmp/c070d/A01.zip
          python football-data/validation/build_c068_a02_runtime.py \
            --matches-zip /tmp/c070d/matches.zip --events-zip /tmp/c070d/events.zip --out /tmp/c070d/A02.zip
          python football-data/validation/build_c069_a03_runtime.py \
            --matches-zip /tmp/c070d/matches.zip --events-zip /tmp/c070d/events.zip --out /tmp/c070d/A03.zip \
            | tee /tmp/c070d/a03_build.json

      - name: Re-audit final score parser before C070-D
        run: |
          mkdir -p football-data/manifests/c070d_duration_residual_integration
          python football-data/validation/audit_c069_r3_goal_parser.py \
            --package /tmp/c070d/A01.zip \
            --package /tmp/c070d/A02.zip \
            --package /tmp/c070d/A03.zip \
            --out football-data/manifests/c070d_duration_residual_integration/goal_parser_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('football-data/manifests/c070d_duration_residual_integration/goal_parser_audit.json').read_text())
          assert x['status']=='PASS'
          assert x['source_matches']==1200
          assert x['regular_matches']==1192
          assert x['mismatch_count']==0
          assert [z['match_id'] for z in x['fallback_matches']]==[2499781]
          PY

      - name: Execute frozen C070-D evaluation with parent guard
        run: |
          cp football-data/research/c070d_duration_residual_integration/contract.json \
            football-data/manifests/c070d_duration_residual_integration/contract.json
          cp /tmp/c070d/a03_build.json football-data/manifests/c070d_duration_residual_integration/a03_build.json
          python football-data/validation/evaluate_c070d_duration_residual_integration.py \
            --a01 /tmp/c070d/A01.zip \
            --a02 /tmp/c070d/A02.zip \
            --a03 /tmp/c070d/A03.zip \
            --matches-zip /tmp/c070d/matches.zip \
            --out football-data/manifests/c070d_duration_residual_integration/summary.json

      - name: Verify frozen boundaries and evidence closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('football-data/manifests/c070d_duration_residual_integration')
          c=json.loads((root/'contract.json').read_text())
          x=json.loads((root/'summary.json').read_text())
          assert c['schema_version']=='C070D_DURATION_RESIDUAL_INTEGRATION_CONTRACT_V1'
          assert c['source_boundary']['packages']==['A01','A02','A03']
          assert c['source_boundary']['no_A04'] is True
          assert c['source_boundary']['no_protected'] is True
          assert c['integration_rule']['learned_weight'] is False
          assert c['integration_rule']['learned_intercept'] is False
          assert c['integration_rule']['posthoc_calibration'] is False
          assert c['integration_rule']['blend_search'] is False
          assert c['integration_rule']['alternative_alpha_values'] is False
          assert x['schema_version']=='C070D_DURATION_RESIDUAL_INTEGRATION_V1'
          assert x['source']['source_matches']==1200
          assert x['source']['regular_matches']==1192
          assert x['source']['minute_diagnostics']['score_fallback_matches']==[2499781]
          assert x['boundary']['protected_samples_used'] is False
          assert x['boundary']['new_A_packages_opened']==[]
          assert x['boundary']['formal_weight']==0
          if x['status']=='POSTVIEW_C070D_DEVELOPMENT_COMPLETE':
              assert x['parent_reproduction']['guard_pass'] is True
              assert x['parent_reproduction']['fold_logloss_wins']==3
              assert x['parent_reproduction']['delta_log_loss_semimarkov_minus_markov'] < 0
              assert x['parent_reproduction']['match_bootstrap']['ci90_high'] < 0
              expected={'fold_1':(75,25),'fold_2':(127,23),'fold_3':(169,33)}
              for name,(tr,te) in expected.items():
                  d=x['folds'][name]['matched_draw']
                  assert d['train_pairs']==tr
                  assert d['test_pairs']==te
                  assert d['train_maximum_cardinality_certificate']==tr
                  assert d['test_maximum_cardinality_certificate']==te
              assert x['pooled']['test_pairs']==81
              assert x['pooled']['test_rows']==162
              assert x['pooled']['pair_bootstrap']['reps']==2000
              assert x['pooled']['pair_bootstrap']['seed']==7004
              assert x['boundary']['learned_integration_weight'] is False
              assert x['boundary']['posthoc_probability_calibration_performed'] is False
          else:
              assert x['status']=='STOP_PARENT_REPRODUCTION'
              assert x['boundary']['candidate_scored'] is False
          print(json.dumps({
              'status':x['status'],
              'verdict':x['verdict'],
              'parent_reproduction':x['parent_reproduction'],
              'pooled':x.get('pooled'),
              'development_signal':x.get('development_signal')
          },indent=2))
          PY

      - name: Upload C070-D evidence
        uses: actions/upload-artifact@v4
        with:
          name: c070d-duration-residual-integration
          path: football-data/manifests/c070d_duration_residual_integration/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm runtime-only output
        run: |
          test -z "$(git diff --cached --name-only)"
          test -z "$(git status --short | grep -v '^?? football-data/manifests/' || true)"
