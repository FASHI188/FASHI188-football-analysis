name: football3 Batch-002 reveal score

on:
  push:
    branches:
      - football3/batch002-reveal-score
    paths:
      - football-data/experiments/batch002_reveal_score/score_batch002.py
      - .github/workflows/football3-batch002-reveal-score.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football3/batch002-reveal-score
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reveal and score locked Batch-002 100
        run: python football-data/experiments/batch002_reveal_score/score_batch002.py run
      - name: Verify Batch-002 reveal contract
        run: python football-data/experiments/batch002_reveal_score/score_batch002.py verify
      - name: Upload Batch-002 reveal artifact
        uses: actions/upload-artifact@v4
        with:
          name: football3-batch002-reveal-score
          path: football-data/experiments/batch002_reveal_score/results/summary_batch002_reveal.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist Batch-002 reveal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-data/experiments/batch002_reveal_score/results/summary_batch002_reveal.json
          git commit -m '[revealed] football3 Batch-002 score S60 vs S70 vs S80' || true
          git fetch origin football3/batch002-reveal-score
          git rebase origin/football3/batch002-reveal-score
          git push origin HEAD:football3/batch002-reveal-score
