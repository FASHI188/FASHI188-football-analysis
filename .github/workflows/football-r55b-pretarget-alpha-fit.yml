name: Football R55B Pretarget Alpha Fit

on:
  push:
    branches:
      - research/r55-ou-matched300-20260814
    paths:
      - football-data/research/r55b_pretarget_alpha_fit_20260816.py
      - football-data/research/r55b_grid71_input_recovery_20260816.py
      - .github/workflows/football-r55b-pretarget-alpha-fit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit-pretarget-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned research dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' \
            'scipy==1.17.0' \
            'scikit-learn==1.8.0'

      - name: Download already-verified frozen release archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output archive.1.1.zip \
            'https://github.com/FASHI188/FASHI188-football-analysis/releases/download/football-data-archive-v1/archive.1.1.zip'

      - name: Deterministically recover frozen R55B inputs
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import builtins,collections,runpy,sys; builtins.Counter=collections.Counter; sys.argv=["r55b_grid71_input_recovery_20260816.py","--archive","archive.1.1.zip"]; runpy.run_path("football-data/research/r55b_grid71_input_recovery_20260816.py",run_name="__main__")'

      - name: Fit and freeze pre-target global alpha only
        shell: bash
        run: |
          set -euo pipefail
          python football-data/research/r55b_pretarget_alpha_fit_20260816.py \
            --archive archive.1.1.zip \
            --recovery-json football-data/research/r55b_grid71_input_recovery_20260816.json

      - name: Upload frozen alpha result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r55b-pretarget-alpha-fit
          path: football-data/research/r55b_pretarget_alpha_fit_result_20260816.json
          if-no-files-found: error
          retention-days: 30
