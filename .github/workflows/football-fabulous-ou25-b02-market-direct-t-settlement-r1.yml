name: Football fabul0us OU25 B02 market Direct-T settlement R1

on:
  push:
    branches: [research/fabulous-ou25-b01-input-audit-r1]
    paths:
      - '.github/workflows/football-fabulous-ou25-b02-market-direct-t-settlement-r1.yml'
      - 'football-data/validation/settle_fabulous_ou25_b02_market_direct_t_r1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-fabulous-ou25-b02-market-direct-t-settlement-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-shot-target-only-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned deterministic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 pyarrow==21.0.0 rapidfuzz==3.14.0 Unidecode==1.4.0

      - name: Download pinned pre-match identity sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fab
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 900 \
            'https://huggingface.co/datasets/fabul0us/football_odds_2023-24/resolve/211feb35f9dcd270bd7a1b27b39a8b1f45f239aa/match_odds.csv?download=true' \
            -o /tmp/fab/match_odds.csv
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/fixtures.parquet?download=true' \
            -o /tmp/fab/fixtures.parquet
          curl -sS -L --fail --retry 3 --retry-delay 2 --max-time 300 \
            'https://huggingface.co/datasets/eatpizzanot/soccer-dataset/resolve/main/teams.parquet?download=true' \
            -o /tmp/fab/teams.parquet
          test "$(sha256sum /tmp/fab/match_odds.csv | awk '{print $1}')" = 'c0e8854302159e1a8c529463f33280b728909c5e0ba95262515a7a144a43aa2a'
          test "$(sha256sum /tmp/fab/fixtures.parquet | awk '{print $1}')" = '7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7'
          test "$(sha256sum /tmp/fab/teams.parquet | awk '{print $1}')" = '5529282b37ad51437142dd7c6d32fb60bbbdd56953dc432e3b9247dca17a2fa5'

      - name: Reconstruct sealed B02 pre-match packet with zero outcome fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('football-data/validation/audit_fabulous_ou25_b01_inputs_r1.py').read_text(encoding='utf-8')
          assert "EXPECTED_B01_SHA = 'fcba07147d230357925d3ee41027dfae18a27654960641c509ead5626b057baf'" in src
          assert 'b01 = reserve[:400]' in src
          out=src.replace('B01','B02').replace('b01','b02')
          out=out.replace(
              "EXPECTED_B02_SHA = 'fcba07147d230357925d3ee41027dfae18a27654960641c509ead5626b057baf'",
              "EXPECTED_B02_SHA = '5f642afc51175ae693d45cb0393a78b3b2d5bd8bc8fb5b1a67567f21a3a906e2'"
          )
          out=out.replace('b02 = reserve[:400]','b02 = reserve[400:800]')
          Path('/tmp/audit_fabulous_ou25_b02_inputs_r1.py').write_text(out,encoding='utf-8')
          PY
          python /tmp/audit_fabulous_ou25_b02_inputs_r1.py
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          d=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b02_input_audit_r1')
          s=json.loads((d/'summary.json').read_text(encoding='utf-8'))
          assert s['status']=='ZERO_LABEL_COMPLETE'
          assert s['b02_n']==400 and s['b02_hash_match'] is True
          assert s['target_labels_accessed']==0 and s['target_outcome_columns_read']==[]
          p=d/'B02_pre_match_inputs_all_cutoffs.json'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='b5c8019a06fa0b75ba9b205a552beabc1e84e7877e1095d86c2e8125bfc2d6ed'
          PY

      - name: Recreate and verify frozen B02 predictions before any B02 label query
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('football-data/validation/freeze_fabulous_ou25_b01_market_direct_t_r1.py').read_text(encoding='utf-8')
          out=src.replace('B01','B02').replace('b01','b02')
          out=out.replace(
              "B02_SHA = 'fcba07147d230357925d3ee41027dfae18a27654960641c509ead5626b057baf'",
              "B02_SHA = '5f642afc51175ae693d45cb0393a78b3b2d5bd8bc8fb5b1a67567f21a3a906e2'"
          )
          out=out.replace(
              "PACKET_SHA = 'c43429684741389bd6f57011a5c906be17cbbdd5e8d3ba279b278d038110159a'",
              "PACKET_SHA = 'b5c8019a06fa0b75ba9b205a552beabc1e84e7877e1095d86c2e8125bfc2d6ed'"
          )
          runtime=Path('football-data/validation/_runtime_freeze_fabulous_ou25_b02_market_direct_t_r1.py')
          runtime.write_text(out,encoding='utf-8')
          PY
          python football-data/validation/_runtime_freeze_fabulous_ou25_b02_market_direct_t_r1.py
          rm -f football-data/validation/_runtime_freeze_fabulous_ou25_b02_market_direct_t_r1.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b02_market_direct_t_r1')
          pred=d/'B02_frozen_predictions.csv'; lockp=d/'preregistration_and_prediction_lock.json'
          assert hashlib.sha256(pred.read_bytes()).hexdigest()=='9b771c9466842e97fe8984945cc9b2c9f26d6531bab27f7f871305b6e2c8c008'
          assert hashlib.sha256(lockp.read_bytes()).hexdigest()=='0dd9d39157578b2f3c0d78b66df6bfff5896c6d1a729609bc2ab34cd0d5e45ab'
          x=json.loads(lockp.read_text(encoding='utf-8'))
          assert x['status']=='PREDICTIONS_FROZEN_LABELS_UNOPENED'
          assert x['target']['target_labels_accessed']==0
          assert x['model']['selected_C']==0.1
          print('B02_LOCKS_VERIFIED_BEFORE_LABEL_QUERY')
          PY

      - name: Probe server-side row filter using already-viewed B01 fixture only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          params={
            'dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train',
            'where':'"id"=18199','offset':'0','length':'2'
          }
          url='https://datasets-server.huggingface.co/filter?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'football-research-target-only-settlement/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
            x=json.load(r)
          rows=x.get('rows',[])
          assert len(rows)==1 and int(rows[0]['row']['id'])==18199
          assert x.get('partial',False) is False
          print('ROW_FILTER_PROBE_PASS_ON_ALREADY_VIEWED_B01')
          PY

      - name: One-shot open B02 labels through target-only server-side filters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, time, urllib.parse, urllib.request
          from pathlib import Path
          import pandas as pd
          import pyarrow.parquet as pq

          pred_path=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b02_market_direct_t_r1/B02_frozen_predictions.csv')
          pred=pd.read_csv(pred_path)
          ids=sorted(pred['fixture_id'].astype(int).tolist())
          assert len(ids)==400 and len(set(ids))==400

          # Pinned fixture file is read ONLY for non-outcome identity fields here.
          nonout=['id','date_utc','league_id','home_team_id','away_team_id','is_played']
          local=pq.read_table('/tmp/fab/fixtures.parquet',columns=nonout).to_pandas()
          local=local[local['id'].isin(ids)].copy()
          assert len(local)==400 and local['id'].nunique()==400
          local=local.set_index('id')

          endpoint='https://datasets-server.huggingface.co/filter'
          collected={}
          query_count=0
          for start in range(0,len(ids),40):
            chunk=ids[start:start+40]
            where=' OR '.join(f'"id"={i}' for i in chunk)
            params={'dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train','where':where,'offset':'0','length':'100'}
            url=endpoint+'?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'football-research-target-only-settlement/1.0'})
            with urllib.request.urlopen(req,timeout=90) as r:
              x=json.load(r)
            assert x.get('partial',False) is False
            rows=x.get('rows',[])
            got={int(z['row']['id']) for z in rows}
            assert got==set(chunk), (start,len(rows),sorted(set(chunk)-got),sorted(got-set(chunk)))
            for z in rows:
              row=z['row']; fid=int(row['id']); ref=local.loc[fid]
              assert int(row['league_id'])==int(ref['league_id'])
              assert int(row['home_team_id'])==int(ref['home_team_id'])
              assert int(row['away_team_id'])==int(ref['away_team_id'])
              assert bool(row['is_played'])==bool(ref['is_played'])
              a=pd.to_datetime(row['date_utc'],utc=True); b=pd.to_datetime(ref['date_utc'],utc=True)
              assert a==b
              collected[fid]={
                'fixture_id':fid,
                'goals_home':int(row['goals_home']),
                'goals_away':int(row['goals_away']),
                'is_played':bool(row['is_played']),
              }
            query_count+=1
            time.sleep(0.15)

          assert set(collected)==set(ids)
          canonical='\n'.join(str(i) for i in ids)+'\n'
          receipt={
            'schema_version':'FAB-OU25-B02-TARGET-ONLY-LABEL-RECEIPT-R1',
            'status':'B02_TARGET_ONLY_LABELS_OPENED',
            'dataset':'eatpizzanot/soccer-dataset','config':'fixtures','split':'train',
            'filter_endpoint':endpoint,
            'filter_query_count':query_count,
            'max_requested_ids_per_query':40,
            'requested_fixture_count':400,
            'returned_fixture_count':400,
            'requested_fixture_set_sha256':hashlib.sha256(canonical.encode()).hexdigest(),
            'non_target_rows_returned':0,
            'B03_B04_fixture_ids_requested':0,
            'identity_match_to_pinned_fixture_source':True,
            'pinned_fixture_source_sha256':'7ba90661dbed29eb940daf5ea385c7d76d5751d16be86bd9063293a982abc7b7',
            'labels':[collected[i] for i in ids],
          }
          out=Path('/tmp/fab/B02_labels_target_only.json')
          out.write_text(json.dumps(receipt,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('B02_TARGET_ONLY_LABEL_RECEIPT_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          print('B02_LABELS_OPENED=400; NON_TARGET_ROWS_RETURNED=0; B03_B04_QUERIED=0')
          PY

      - name: Settle locked B02 science gate without any parameter change
        run: python football-data/validation/settle_fabulous_ou25_b02_market_direct_t_r1.py

      - name: Assert irreversible B02 viewed state and B03-B04 target-only isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b02_market_direct_t_settlement_r1/settlement_summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['settlement_scope']['rows']==400
          assert x['settlement_scope']['B02_labels_opened_in_this_run']==400
          assert x['settlement_scope']['B03_B04_fixture_ids_requested']==0
          assert x['settlement_scope']['label_columns_materialized_for_non_B02_rows_in_this_run']==0
          assert x['governance']['B02_state_after_run']=='VIEWED'
          assert x['governance']['B03_B04_state_after_run']=='UNOPENED_BY_TARGET_ONLY_QUERY'
          assert x['governance']['post_result_parameter_search_allowed_on_B02'] is False
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY

      - name: Upload aggregate settlement receipt only
        uses: actions/upload-artifact@v4
        with:
          name: fabulous-ou25-b02-market-direct-t-settlement-r1-${{ github.sha }}
          path: football-data/research/anonymous_data_reserve_r1/fabulous_ou25_b02_market_direct_t_settlement_r1/settlement_summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Confirm no tracked runtime mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf football-data/validation/__pycache__
          rm -f football-data/validation/_runtime_freeze_fabulous_ou25_b02_market_direct_t_r1.py
          git diff --exit-code
          git diff --cached --exit-code
