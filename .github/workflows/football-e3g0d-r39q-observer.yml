name: Football R39Q One-Shot Observer

on:
  pull_request:
    branches:
      - research/e3g0c-zero-cost-budget-forward-design
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/football-e3g0d-r39q-observer.yml'
      - 'football-data/research/e3g0d_r39q_one_shot_contract.json'
      - 'football-data/research/e3g0d_one_shot_bootstrap_r39q.py'
      - '.github/workflows/football-e3g0d-r39q-one-shot.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe-authorized-push-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Poll and audit the exact authorized push run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUTHORIZED_PUSH_HEAD: 099c45ce44fd8cbc4048bd01b1f9ba4fcf8b61c0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r39q-observer"
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          from pathlib import Path
          repo=os.environ['REPOSITORY'];token=os.environ['GH_TOKEN'];head=os.environ['AUTHORIZED_PUSH_HEAD']
          base='https://api.github.com'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'FASHI188-r39q-observer'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read())
          q=urllib.parse.urlencode({'branch':'research/e3g0d-one-shot-live-r39q','event':'push','per_page':20})
          selected=None
          for _ in range(36):
              data=get('/repos/'+repo+'/actions/workflows/football-e3g0d-r39q-one-shot.yml/runs?'+q)
              candidates=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==head]
              if len(candidates)!=1:
                  time.sleep(5);continue
              selected=candidates[0]
              if selected.get('status')=='completed':break
              time.sleep(5)
          if selected is None:raise SystemExit('R39Q_AUTHORIZED_PUSH_RUN_NOT_FOUND')
          run_id=int(selected['id'])
          jobs=get(f'/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100').get('jobs',[])
          arts=get(f'/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
          steps=[]
          for job in jobs:
              for s in job.get('steps') or []:
                  steps.append({'job_id':job.get('id'),'job_name':job.get('name'),'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')})
          failed=[s for s in steps if s.get('conclusion')=='failure']
          names=[str(a.get('name','')) for a in arts]
          receipt={
              'schema_version':'R39Q-PUSH-RUN-OBSERVER-1.0','authorized_push_head':head,'workflow_run_id':run_id,
              'run_status':selected.get('status'),'run_conclusion':selected.get('conclusion'),'run_attempt':selected.get('run_attempt'),
              'event':selected.get('event'),'head_branch':selected.get('head_branch'),'jobs':[
                  {'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs],
              'steps':steps,'first_failed_step':failed[0]['name'] if failed else None,
              'artifacts':[{'id':a.get('id'),'name':a.get('name'),'digest':a.get('digest'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired')} for a in arts],
              'authorization_consumed_artifact_present':any(n.startswith('football-e3g0d-r39q-consumed-') for n in names),
              'quota_reservation_artifact_present':any(n.startswith('football-e3g0d-quota-reservation-') for n in names),
              'plan_artifact_present':any(n.startswith('football-e3g0d-plan-2026-08-21-league-39-season-2026-') for n in names),
              'plan_index_artifact_present':any(n.startswith('football-e3g0d-plan-index-') for n in names),
              'terminal_artifact_present':any(n.startswith('football-e3g0d-r39q-terminal-') for n in names),
              'provider_request_claimed': False,
              'formal_weight':0
          }
          receipt['provider_request_claimed']=receipt['authorization_consumed_artifact_present'] and receipt['quota_reservation_artifact_present'] and any(s['name']=='Execute the single authorized provider request' and s['status']=='completed' for s in steps)
          out=Path(os.environ['RUNNER_TEMP'])/'r39q-observer/observer_receipt.json';out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'workflow_run_id':run_id,'status':receipt['run_status'],'conclusion':receipt['run_conclusion'],'first_failed_step':receipt['first_failed_step'],'consumed':receipt['authorization_consumed_artifact_present'],'reservation':receipt['quota_reservation_artifact_present'],'plan':receipt['plan_artifact_present'],'plan_index':receipt['plan_index_artifact_present'],'terminal':receipt['terminal_artifact_present']},sort_keys=True))
          if receipt['run_status']!='completed':raise SystemExit('R39Q_PUSH_RUN_NOT_TERMINAL')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-r39q-one-shot-observer-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r39q-observer
          retention-days: 30
          if-no-files-found: error
