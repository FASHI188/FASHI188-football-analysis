name: Football V6.50.5 OU-Result Joint Matrix Challenge

on:
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_ou_result_joint_matrix_v6505.py"
      - "football-data/validation/v6_sync_f06_challenge_truth_v6505.py"
      - ".github/workflows/football-v6505-ou-result-joint.yml"
permissions:
  contents: write
concurrency:
  group: football-v6505-ou-result-joint
  cancel-in-progress: true
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile joint challenger and runtime-truth supplement
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: |
          python -m py_compile football-data/validation/v6_ou_result_joint_matrix_v6505.py
          python -m py_compile football-data/validation/v6_sync_f06_challenge_truth_v6505.py
      - name: Freeze or settle OU-result coherent matrices
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_ou_result_joint_matrix_v6505.py
      - name: Synchronize latest F06 challenge evidence into unique runtime truth
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_sync_f06_challenge_truth_v6505.py
      - name: Persist challenge and runtime truth together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_ou_result_joint_matrix_v6505_freeze.json \
            --allow-prefix football-data/forward/v6_ou_result_joint_matrix_events_v6505.json \
            --allow-prefix football-data/manifests/v6_ou_result_joint_matrix_v6505_status.json \
            --allow-prefix football-data/manifests/v6_42_issue_remediation_v6489_status.json \
            --message-prefix "audit(football): persist V6.50.5 joint challenge and runtime truth"
      - name: Hard convergence timing governance and truth-sync guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_ou_result_joint_matrix_v6505_status.json')
          t=Path('football-data/manifests/v6_42_issue_remediation_v6489_status.json')
          if not p.exists() or not t.exists(): raise SystemExit('V6.50.5 or runtime truth missing')
          x=json.loads(p.read_text(encoding='utf-8')); r=json.loads(t.read_text(encoding='utf-8'))
          if x.get('status')!='PASS': raise SystemExit(str(x))
          d=x.get('projection_diagnostics') or {}; g=x.get('governance') or {}; f=x.get('freeze') or {}; acq=r.get('current_forward_acquisition') or {}
          if d.get('count',0) and d.get('all_converged') is not True: raise SystemExit('projection convergence failed')
          if float(d.get('max_total_constraint_residual') or 0)>1e-9 or float(d.get('max_result_constraint_residual') or 0)>1e-9 or float(d.get('max_probability_sum_residual') or 0)>1e-9: raise SystemExit('projection residual failed')
          if d.get('count',0) and float(d.get('minimum_actual_lead_hours_at_freeze') or 0)<1.0: raise SystemExit('actual lead below one hour')
          if (f.get('market_quality') or {}).get('formal_market_source_gate') is not False: raise SystemExit('single-provider source gate drift')
          if g.get('single_provider_market_challenge') is not True or g.get('independent_provider_consensus') is not False: raise SystemExit('provider classification drift')
          if g.get('source_probability_mutation') is not False or g.get('source_matrix_mutation') is not False or g.get('historical_backfill') is not False or g.get('formal_weight')!=0 or g.get('automatic_promotion') is not False or g.get('current_rule_change') is not False: raise SystemExit('governance failed')
          if r.get('schema_version')!='V6.50.5-42-issue-runtime-truth-registry-r9': raise SystemExit('runtime truth schema not upgraded')
          if acq.get('v6505_joint_prediction_count')!=d.get('count'): raise SystemExit('V6.50.5 runtime truth count mismatch')
          if (r.get('summary') or {})!={'PASS':36,'PARTIAL':4,'FORWARD_GATED':2,'EXTERNAL_DATA_GAP':0,'TODO':0,'BLOCKED':0}: raise SystemExit('42-item status composition drift')
          print(json.dumps({'scan':x.get('prediction_scan'),'projection':d,'evaluation':x.get('evaluation'),'runtime_truth_schema':r.get('schema_version')},ensure_ascii=False))
          PY

# A coherent 1X2+OU+score research surface is prospectively testable, but single-provider
# market evidence and zero settlements keep formal weight at zero. The unique truth registry is updated atomically.
