name: Football V6.48.8 Match Context Resolution Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_match_context_resolution_queue_v6488.py"
      - "football-data/evidence/markets_prospective/**"
      - "football-data/evidence/match_context_pre_kickoff/**"
      - ".github/workflows/football-v6485-v6486-live-context.yml"

permissions:
  contents: write

concurrency:
  group: football-v6488-match-context-resolution-queue
  cancel-in-progress: false

jobs:
  context_queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile exact-match context queue
        run: python -m py_compile football-data/validation/v6_match_context_resolution_queue_v6488.py

      - name: Build live-resolution queue from prospective market freezes
        run: python football-data/validation/v6_match_context_resolution_queue_v6488.py

      - name: Persist queue receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python football-data/validation/persist_generated_worktree_v474.py \
            --allow-prefix football-data/manifests/v6_match_context_resolution_queue_v6488_status.json \
            --message-prefix "audit(football): persist V6.48.8 match-context queue"

      - name: Guard unknown-is-not-no-change semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('football-data/manifests/v6_match_context_resolution_queue_v6488_status.json')
          if not p.exists(): raise SystemExit('queue status missing')
          x=json.loads(p.read_text(encoding='utf-8'))
          g=x.get('governance') or {}
          if g.get('missing_means_unknown_not_no_change') is not True:
              raise SystemExit('unknown/no-change guard failed')
          if g.get('automatic_context_completeness_claim') is not False:
              raise SystemExit('automatic completeness guard failed')
          print(json.dumps({'fixtures':x.get('fixture_count'),'counts':x.get('counts')},ensure_ascii=False))
          PY

# Automated systematic FotMob scraping is intentionally not scheduled. Missing dynamic
# context remains a live-resolution task at the specific decision freeze.
# Formal V5.0.1 remains unchanged.
