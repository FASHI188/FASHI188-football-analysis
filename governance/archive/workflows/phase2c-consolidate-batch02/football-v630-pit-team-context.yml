name: football-v630-pit-team-context

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/v6_pit_team_availability_ledger_v6300.py'
      - '.github/workflows/football-v630-pit-team-context.yml'

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile football-data/validation/v6_pit_team_availability_ledger_v6300.py
      - name: Build V6.30 PIT team-context ledger
        run: python football-data/validation/v6_pit_team_availability_ledger_v6300.py
      - name: Upload ledger receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6300-pit-team-context-ledger
          path: football-data/manifests/v6_pit_team_availability_ledger_v6300_status.json
          if-no-files-found: error
