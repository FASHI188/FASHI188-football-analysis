name: Football V6.46.4 Three-track Cached Ablation

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/audit_three_track_ablation_v6462.py"
      - "football-data/validation/evaluate_market_blind_elo_fixed1000_v6461.py"
      - "football-data/cache/v6_fixed1000/v6461_market_blind_elo_predictions.json"
      - "football-data/benchmarks/v6_1x2_neutral_fixed1000_v6131.json"
      - ".github/workflows/football-v6462-three-track-ablation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6462-three-track-ablation
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile football-data/validation/audit_three_track_ablation_v6462.py
      - name: Run three-track ablation using validated cache when available
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/audit_three_track_ablation_v6462.py
      - name: Persist audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_three_track_ablation_v6462_status.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.46.4 cached three-track ablation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
