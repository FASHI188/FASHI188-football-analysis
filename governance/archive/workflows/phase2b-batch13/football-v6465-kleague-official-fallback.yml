name: Football V6.46.5 K League Official Fallback Validation
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/validate_kleague_official_fallback_v6465.py"
      - ".github/workflows/football-v6465-kleague-official-fallback.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile football-data/validation/validate_kleague_official_fallback_v6465.py
      - run: python football-data/validation/validate_kleague_official_fallback_v6465.py
      - name: Persist validation
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f football-data/manifests/v6_kleague_official_fallback_v6465_status.json ]; then
            git add football-data/manifests/v6_kleague_official_fallback_v6465_status.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.46.5 K League official fallback validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
