name: football-v6362-gold500-fast100

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'football-data/validation/validate_gold500_fast100_v6362.py'
      - '.github/workflows/football-v6362-gold500-fast100.yml'
      - 'football-data/manifests/gold500_v6360/gold500_features_v6360.jsonl'
      - 'football-data/manifests/gold500_v6360/gold500_development_labels_v6360.jsonl'

permissions:
  contents: read

jobs:
  fast100:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile football-data/validation/validate_gold500_fast100_v6362.py
      - name: Score frozen Fast100 baselines
        run: python football-data/validation/validate_gold500_fast100_v6362.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6362-gold500-fast100-receipt
          path: football-data/manifests/v6_gold500_fast100_baselines_v6362_status.json
          if-no-files-found: error
