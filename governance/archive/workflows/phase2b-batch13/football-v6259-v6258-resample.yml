name: Football V6.25.9 V6258 Random100 Stability

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/v6_total_pooled_dynamic_shot_resample_v6259.py"
      - ".github/workflows/football-v6259-v6258-resample.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit
        run: python -m py_compile football-data/validation/v6_total_pooled_dynamic_shot_resample_v6259.py
      - name: Run 1000 fixed random100 resamples
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/v6_total_pooled_dynamic_shot_resample_v6259.py
      - name: Persist audit receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          path=football-data/manifests/v6_total_pooled_dynamic_shot_resample_v6259_status.json
          test -f "$path"
          git add "$path"
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.25.9 V6258 random100 stability"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

