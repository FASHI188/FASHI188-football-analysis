name: Football V6.46.4 Market-blind Fixed1000 Cache

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/evaluate_market_blind_elo_fixed1000_v6461.py"
      - "football-data/benchmarks/v6_1x2_neutral_fixed1000_v6131.json"
      - "football-data/processed/**"
      - ".github/workflows/football-v6461-market-blind-fixed1000.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6461-market-blind-fixed1000
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile football-data/validation/evaluate_market_blind_elo_fixed1000_v6461.py
      - name: Evaluate market-blind baseline
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/evaluate_market_blind_elo_fixed1000_v6461.py
      - name: Persist evaluation and hash-safe prediction cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-data/manifests/v6_market_blind_fixed1000_v6461_status.json
          if [ -f football-data/cache/v6_fixed1000/v6461_market_blind_elo_predictions.json ]; then
            git add football-data/cache/v6_fixed1000/v6461_market_blind_elo_predictions.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.46.4 fixed1000 cache"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
