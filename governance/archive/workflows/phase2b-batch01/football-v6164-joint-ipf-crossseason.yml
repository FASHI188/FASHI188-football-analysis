name: Football V6.20 Fast100 Repair Batch
on:
  push:
    branches: [main]
    paths:
      - "football-data/validation/v6_independent_total_hierarchical_fast100_v6200.py"
      - "football-data/validation/v6_independent_score_hierarchical_fast100_v6201.py"
      - ".github/workflows/football-v6164-joint-ipf-crossseason.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-v620-fast100-repair
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sklearn
        run: python -m pip install --quiet scikit-learn
      - name: Compile challengers
        run: |
          python -m py_compile football-data/validation/v6_independent_total_hierarchical_fast100_v6200.py
          python -m py_compile football-data/validation/v6_independent_score_hierarchical_fast100_v6201.py
      - name: Run V6.20.0 independent total Fast100
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          python football-data/validation/v6_independent_total_hierarchical_fast100_v6200.py
          code=$?
          echo "total_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Run V6.20.1 independent score Fast100
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        shell: bash
        run: |
          set +e
          python football-data/validation/v6_independent_score_hierarchical_fast100_v6201.py
          code=$?
          echo "score_exit_code=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Persist V6.20 receipts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in \
            football-data/manifests/v6_independent_total_hierarchical_fast100_v6200_status.json \
            football-data/manifests/v6_independent_score_hierarchical_fast100_v6201_status.json; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.20 Fast100 repair batch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce executions
        run: |
          test "${total_exit_code:-2}" = "0"
          test "${score_exit_code:-2}" = "0"
