name: Football V6.13.1 Neutral Fixed1000 Benchmark

on:
  push:
    branches:
      - main
    paths:
      - "football-data/validation/build_1x2_neutral_fixed1000_v6131.py"
      - "football-data/processed/**"
      - ".github/workflows/football-v6131-neutral-fixed1000-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-v6131-neutral-fixed1000-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile football-data/validation/build_1x2_neutral_fixed1000_v6131.py
      - name: Build neutral 17-domain fixed1000 benchmark
        env:
          PYTHONPATH: football-data/engine:football-data/validation
        run: python football-data/validation/build_1x2_neutral_fixed1000_v6131.py
      - name: Persist benchmark evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            football-data/benchmarks/v6_1x2_neutral_fixed1000_v6131.json \
            football-data/manifests/v6_1x2_neutral_fixed1000_v6131_status.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "audit(football): persist V6.13.1 neutral fixed1000 benchmark"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
